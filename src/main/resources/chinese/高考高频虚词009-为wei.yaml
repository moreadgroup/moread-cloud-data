---
words:
  - word: 为 【名词】
    phonetic: wei2
    tags:
      - 高中
    samples:
      - trans: 作为;政绩。
        sentences:
          - ancient: 【例句】未能助上大有为，以膏泽（恩惠）斯民。（宋•王安石《答司马谏议书》）
  - word: 为 【动词】
    phonetic: wei2
    tags:
      - 高中
    samples:
      - trans: ❶做;干；当。
        sentences:
          - ancient: 【例句】不为者与不能者之形，何以异？（《齐桓晋文之事》）
          - ancient: 君家妇难为。（《孔雀东南飞》）
          - ancient: 臣之壮也,犹不如人;今老矣，无能为也已。（《烛之武退秦师》）
          - ancient: 沛公欲王关中，使子婴为相，珍宝尽有之。（《鸿门宴》）
      - trans: ❷制作;建造。
        sentences:
          - ancient: 【例句】能以径寸之木为宫室、器皿、人物，以至鸟兽、木石。（《核舟记》）
      - trans: ❸是;算。
        sentences:
          - ancient: 【例句】知之为知之，不知为不知，是知也。（《论语•为政》）
          - ancient: 亡羊而补牢（羊圈），未为迟也。（《战国策•楚策四》）
          - ancient: 共事二三年，始尔未为久，女行无偏斜，何意致不厚?（《孔雀东南飞》）
          - ancient: 吾令人望其气，皆为龙虎,成五采，此天子气也。（《鸿门宴》）
      - trans: ❹当作。
        sentences:
          - ancient: 【例句】斩木为兵（兵器），揭竿为旗。（《过秦论》）
          - ancient: 若舍郑以为东道主，行年之往来，共其乏困，君亦无所害。（《烛之武退秦师》）
      - trans: ❺叫作。
        sentences:
          - ancient: 【例句】北冥有鱼,其名为鲲。（《逍遥游》）
      - trans: ❻成为；变为。
        sentences:
          - ancient: 【例句】冰,水为之，而寒于水。（《劝学》）
          - ancient: 儿已薄禄相，幸复得此妇，结发同枕席，黄泉共为友。（《孔雀东南飞》）
      - trans: ❼治理。
        sentences:
          - ancient: 【例句】善为国者，仓廩虽满，不偷（怠惰）于农。（《商君书•农战》）
          - ancient: 为国者无使为积威之所劫哉！（《六国论》）
      - trans: ❽创作;写作。
        sentences:
          - ancient: 【例句】因为长句，歌以赠之，凡六百一十六言。（《琵琶行》序）
          - ancient: 余既为此志,后五年，吾妻来归。（《项脊轩志》）
      - trans: ❾整理。
        sentences:
          - ancient: 【例句】以试人，血濡缕，人无不立死者。乃为装遣荆轲。（《荆轲刺秦王》）
      - trans: ❿演奏。
        sentences:
          - ancient: 【例句】高渐离击筑,荆轲和而歌，为变徴之声，士皆垂泪涕泣。（《荆轲刺秦王》）
      - trans: 11 认为。
        sentences:
          - ancient: 【例句】窃为大王不取也！（《鸿门宴》）
  - word: 为 【介词】
    phonetic: wei2
    tags:
      - 高中
    samples:
      - trans: 相当于"被"。常与''所"配合使用，引出施动者。
        sentences:
          - ancient: 【例句】身死人手，为天下笑者，何也？（《过秦论》）
          - ancient: 武父子亡功德，皆为陛下所成就。（《苏武传》）
          - ancient: 既自以心为形役,奚惆怅而独悲？（《归去来兮辞》）
          - ancient: 有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。（《六国论》）
          - ancient: 【高考题例】父为郭氾所害，芝襁褓流离。（《晋书•鲁芝传》）
  - word: 为 【助词】
    phonetic: wei2
    tags:
      - 高中
    samples:
      - trans: ❶用于句末，表示疑问、感叹、反诘，可译为"呢"。
        sentences:
          - ancient: 【例句】如今人方为（是）刀俎，我为（是）鱼肉，何辞为?（《鸿门宴》）
          - ancient: 奚以之九万里而南为?（《逍遥游》）
          - ancient: 何以伐为？（《季氏将伐颛臾》）
          - ancient: 何故怀瑾握瑜（比喻有才能），而自令见放为？（《史记•屈原贾生列传》）
      - trans: ❷宾语前置的标志,不译。
        sentences:
          - ancient: 【例句】其一人专心致志，惟弈秋之为听。（《孟子•告子上》）
          - ancient: 何以汝为见?（《苏武传》）
          - ancient: 【高考题例】此事，申饬边臣岂不可，何以使为？（《宋史•许将传》）	
  - word: 为 【介词】
    phonetic: wei4	
    tags:
      - 高中
    samples:
      - trans: ❶引出服务的对象。相当于"帮助"；"给”；"替"。
        sentences:
          - ancient: 【例句】于是为长安君约车百乘（sheng4,四马一车为一乘），质（留作保证的人）于齐。（《触龙说赵太后》）
          - ancient: 为之声义，敛赀财以送其行，哭声震动天地。（《五人墓碑记》）
          - ancient: 于是六国之士,有宁越、徐尚、苏秦、杜赫之属为之谋。（《过秦论》）
          - ancient: 旦日飨士卒，为击破沛公军！（《鸿门宴》）
      - trans: ❷引出动作、行为的原因。相当于"因为"。
        sentences:
          - ancient: 【例句】天行有常，不为尧存，不为桀亡。（《荀子•天论》）
          - ancient: 夫子胡为忧也？（《晏子春秋•内篇杂上》）
          - ancient: 苏子愀然，正襟危坐而问客曰：''何为其然也?"（《赤壁赋》）
          - ancient: 其险也如此，嗟尔远道之人胡为乎来哉！（《蜀道难》）
      - trans: ❸引出动作、行为的目的。相当于"为了"。
        sentences:
          - ancient: 【例句】天下熙熙，皆为利来;天下攘攘，皆为利往。（《史记・货殖列传》）
          - ancient: 故燕昭筑金台，天下称其贤;殷纣作玉杯,百代传其恶。盖为人与为己殊（不同）也。（唐•陆贽《翰苑集•奉天请罢琼林大盈二库状》
          - ancient: 汝是大家子，仕宦于台阁，慎勿为妇死,贵贱情何薄！（《孔雀东南飞》）
      - trans: 4 引出动作、行为所涉及的对象。相当于"跟''"对"。
        sentences:
          - ancient: 【例句】如姬为公子泣，公子使客斩其仇头，敬进如姬。（《史记•魏公子列传》）
          - ancient: 不足为外人道也。（《桃花源记》）
  - word: 为 【连词】
    phonetic: wei4	
    tags:
      - 高中
    samples:
      - trans: 如果。
        sentences:
          - ancient: 【例句】是楚与三国谋出秦兵矣。秦为知之，必不救也。（《战国策•秦策四》）
          - ancient: 王甚喜人之掩口也，为近王，必掩口。（《韩非子•内储说下》）