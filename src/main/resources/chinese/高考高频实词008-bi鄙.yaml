---
words:
  - word: 鄙 【名词】
    samples:
      - trans: 边远的地方。
        sentences:
          - ancient: 【例句】蜀之鄙有二僧：其一贫，其一富。（《为学》）丨臣，东鄙之贱人也，开罪于楚、魏，遁逃来奔。（《战国策•秦策三》）
  - word: 鄙 【动词】
    tags:
      - 高中
    phonetic: bi3
    samples:
      - trans: ❶使……成为边邑。
        sentences:
          - ancient: 【例句】越国以鄙远,君知其难也。（《烛之武退秦师》）
      - trans: ❷看不起;轻视。
        sentences:
          - ancient: 【例句】过我而不假（借）道，鄙我也。（《左传•宣公十四年》）丨僧仲镂簋（gui3,盛食物的器具）朱紘（hong2,帽子上的带子），山节藻棁（zhuo1,梁上短柱），孔字鄙其小器。（《训俭示康》）
  - word: 鄙 【形容词】
    tags:
      - 高中
    phonetic: bi3
    samples:  
      - trans: ❶浅陋;粗俗。
        sentences:
          - ancient: 【例句】肉食者鄙，未能远谋。（《曹刿论战》）丨先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中。（《出师表》）丨鄙贱之人，不知将军宽之至此也！（《廉颇蔺相如列传》）丨恨私心有所不尽，鄙陋没世，而文采不表于后也。（《报任安书》）丨敢竭鄙怀，恭疏短引,—言均赋，四韵俱成。（《滕王阁序》）丨北蛮夷之鄙人，未尝见天子，故振慑。（《荆轲刺秦王》）
      - trans: ❷轻贱;下贱。
        sentences:
          - ancient: 【例句】人贱物亦鄙,不足迎后人。（《孔雀东南飞》）
      - trans: ❸粗野。
        sentences:
          - ancient: 【例句】子路性鄙，好勇力，志伉直,冠雄鸡，佩豭豚,陵暴孔子。（《史记•仲尼弟子列传》）            