poems:
  - poem: 报任安书
    type: 文言文选必
    author: 司马迁
    created_at: 西汉
    paragraphs:
      - paragraph: 积土
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。
            vernacular: 至于那春风春鸟，秋月秋蝉，夏云暑雨，冬月酷寒，这是人有感于四季节令气候并把它表现在诗歌里。
          - ancient: 嘉会寄诗以亲，离群讬诗以怨。
            vernacular: 在美好的集会时用诗来表现亲近愉悦，离开群体用诗来表达哀怨。
          - ancient: 至于楚臣去境，汉妾辞宫。
            vernacular: 至于楚国臣子离开国都，汉朝的嫔妃辞别宫廷。
          - ancient: 或骨横朔野，魂逐飞蓬。
            vernacular: xxxxx
          - ancient: 或负戈外戍，杀气雄边。
            vernacular: xxxxx
          - ancient: 塞客衣单，孀闺泪尽。
            vernacular: 在边关的客子衣裳单薄，闺中寡居的妇女眼泪哭尽。
          - ancient: 或士有解佩出朝，一去忘返。
            vernacular: 有的士人解下佩印辞官离朝，一去不返。
          - ancient: 女有扬蛾入宠，再盼倾国。
            vernacular: 女子有扬起蛾眉，入宫受宠，再次顾盼，倾国倾城。
          - ancient: 凡斯种种，感荡心灵，非陈诗何以展其义?
            vernacular: 所有这种种情景，感动激荡人的心灵，如果不铺陈诗句还能用什么来抒发他的情义?
          - ancient: 非长歌何以骋其情?
            vernacular: 如果不放声歌唱还能用什么来舒展他的情怀?
          - ancient: 故曰：“诗可以群，可以怨。”
            vernacular: 所以说：“诗可以结交朋友，可以怨刺不平。”
          - ancient: 使穷贱易安，幽居靡闷，莫尚于诗矣。
            vernacular: 使处境困难地位卑贱的人容易安心，使隐居避世的人消除苦闷，要想如此没有比诗更好的了。

          - ancient: 子曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
            vernacular: 孔子说：“一个人没有仁爱之心，遵守礼仪有什么用？一个人没有仁爱之心，礼乐有什么用？” ①如礼何：“如…何”是古代常用句式，当中一般插入代词、名词或其他词语，意思是“把（对）…怎么样（怎么办）”。

          - ancient: 子曰：朝闻道，夕死可矣。
            vernacular: 在听闻圣人之道后，要不断的固守，坚持，实践，承担，不退转，达到不愠的世界。

          - ancient: 君子喻于义，小人喻于利。
            vernacular: 有道君子通晓大义，无道小人只懂得追求小利。喻，喻晓之意。
