poems:
  - poem: 论语
    type: 文言文必修
    author: 孔子及其弟子
    created_at: 战国前期
    paragraphs:
      - paragraph: 人而
        url: https://baike.baidu.com/item/%E4%BA%BA%E8%80%8C%E4%B8%8D%E4%BB%81
        sentences:
          - ancient: 子1曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
            vernacular: 孔子说：“一个人没有仁爱之心，遵守礼仪有什么用？一个人没有仁爱之心，礼乐有什么用？” ①如礼何：“如…何”是古代常用句式，当中一般插入代词、名词或其他词语，意思是“把（对）…怎么样（怎么办）”。
          - ancient: 子2曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
            vernacular: 孔子说：“一个人没有仁爱之心，遵守礼仪有什么用？一个人没有仁爱之心，礼乐有什么用？” ①如礼何：“如…何”是古代常用句式，当中一般插入代词、名词或其他词语，意思是“把（对）…怎么样（怎么办）”。
  - poem: 长亭送别
    type: 诗词曲
    author: 王实甫
    created_at: 元代
    paragraphs:
      - paragraph: 碧云
        url: https://baike.baidu.com/item/%E9%95%BF%E4%BA%AD%E9%80%81%E5%88%AB
        sentences:
          - ancient: 【正宫】【端正好】碧云天，黄花地，西风紧，北雁南飞。
            vernacular: 【正宫】【端正好】碧蓝的天空，开满了菊花的大地，西风猛烈吹，大雁从北往南飞。
          - ancient: 晓来谁染霜林醉？总是离人泪。
            vernacular: 清晨，是谁把经霜的枫林染红了？那总是离人的眼泪。
      - paragraph: 恨相
        url: https://baike.baidu.com/item/%E9%95%BF%E4%BA%AD%E9%80%81%E5%88%AB
        sentences:
          - ancient: 【滚绣球】恨相见得迟，怨归去得疾。
            vernacular: 【滚绣球】恨相见得太迟，怨离别得太快。
          - ancient: 柳丝长玉骢难系，恨不倩疏林挂住斜晖。
            vernacular: 柳丝虽长，却难系住远行人的马，恨不能使疏林一直挂住那斜阳。
          - ancient: 马儿迍迍的行，车儿快快的随，却告了相思回避，破题儿又早别离。
            vernacular: 张生的马慢慢地走 我和车紧紧地跟随，刚刚结束了相思之苦，却又早开始了别离之愁。
          - ancient: 听得道一声“去也”，松了金钏；遥望见十里长亭，减了玉肌：此恨谁知？
            vernacular: 听他说“要走了”，人顿时消瘦下来；远远地望见十里长亭，人更消瘦了：这离愁别恨有谁能理解？
  - poem: 朝天子·咏喇叭
    type: 诗词曲
    author: 王磐
    created_at: 明代
    paragraphs:
      - paragraph: 喇叭
        url: https://baike.baidu.com/item/%E6%9C%9D%E5%A4%A9%E5%AD%90%C2%B7%E5%92%8F%E5%96%87%E5%8F%AD
        sentences:
          - ancient: 喇叭，唢呐，曲儿小腔儿大。
            vernacular: 喇叭唢呐呜呜哇哇，曲儿小来腔儿大。
          - ancient: 官船来往乱如麻，全仗你抬声价。
            vernacular: 官船来往乱如麻，全凭你来抬声价。
          - ancient: 军听了军愁，民听了民怕。
            vernacular: 军人听了军人愁，百姓听了百姓怕。
          - ancient: 那里去辨甚么真共假？
            vernacular: 还能到哪里去分真和假？
          - ancient: 眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！
            vernacular: 眼睁睁吹翻了这家，吹伤了那家，只吹得江水枯竭鹅飞罢！
  - poem: 报任安书
    type: 文言文选必
    author: 司马迁
    created_at: 西汉
    paragraphs:
      - paragraph: 积土
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。
            vernacular: 至于那春风春鸟，秋月秋蝉，夏云暑雨，冬月酷寒，这是人有感于四季节令气候并把它表现在诗歌里。
          - ancient: 嘉会寄诗以亲，离群讬诗以怨。
            vernacular: 在美好的集会时用诗来表现亲近愉悦，离开群体用诗来表达哀怨。
          - ancient: 至于楚臣去境，汉妾辞宫。
            vernacular: 至于楚国臣子离开国都，汉朝的嫔妃辞别宫廷。
          - ancient: 或骨横朔野，魂逐飞蓬。
            vernacular: 丈夫出去打仗，他的尸骨已经横露在北方的战场上，他的魂魄已经随着飞扬的蓬草而消逝了。
          - ancient: 或负戈外戍，杀气雄边。
            vernacular: 有的人在外戍守边疆，杀气雄边
          - ancient: 塞客衣单，孀闺泪尽。
            vernacular: 在边关的客子衣裳单薄，闺中寡居的妇女眼泪哭尽。
          - ancient: 或士有解佩出朝，一去忘返。
            vernacular: 有的士人解下佩印辞官离朝，一去不返。
          - ancient: 女有扬蛾入宠，再盼倾国。
            vernacular: 女子有扬起蛾眉，入宫受宠，再次顾盼，倾国倾城。
          - ancient: 凡斯种种，感荡心灵，非陈诗何以展其义?
            vernacular: 所有这种种情景，感动激荡人的心灵，如果不铺陈诗句还能用什么来抒发他的情义?
          - ancient: 非长歌何以骋其情?
            vernacular: 如果不放声歌唱还能用什么来舒展他的情怀?
          - ancient: 故曰：“诗可以群，可以怨。”
            vernacular: 所以说：“诗可以结交朋友，可以怨刺不平。”
          - ancient: 使穷贱易安，幽居靡闷，莫尚于诗矣。
            vernacular: 使处境困难地位卑贱的人容易安心，使隐居避世的人消除苦闷，要想如此没有比诗更好的了。

          - ancient: 子曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
            vernacular: 孔子说：“一个人没有仁爱之心，遵守礼仪有什么用？一个人没有仁爱之心，礼乐有什么用？” ①如礼何：“如…何”是古代常用句式，当中一般插入代词、名词或其他词语，意思是“把（对）…怎么样（怎么办）”。

          - ancient: 子曰：朝闻道，夕死可矣。
            vernacular: 在听闻圣人之道后，要不断的固守，坚持，实践，承担，不退转，达到不愠的世界。

          - ancient: 君子喻于义，小人喻于利。
            vernacular: 有道君子通晓大义，无道小人只懂得追求小利。喻，喻晓之意。                        