poems:
  - poem: 季氏将伐颛臾 《论语》 
    type: 文言文选修
    author: 孔子及其弟子
    created_at: 战国
    paragraphs:
      - paragraph: 季氏
        url: https://baike.baidu.com/item/%E5%AD%A3%E6%B0%8F%E5%B0%86%E4%BC%90%E9%A2%9B%E8%87%BE
        sentences:
        - 季氏将伐颛臾。冉有、季路见于孔子曰：“季氏将有事于颛臾。”
        - 孔子曰：“求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？”
        - 冉有曰：“夫子欲之，吾二臣者皆不欲也。”
        - 孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’危而不持，颠而不扶，则将焉用彼相矣？且尔言过矣。虎兕出于柙，龟玉毁于椟中，是谁之过与？”
        - 冉有曰：“今夫颛臾，固而近于费。今不取，后世必为子孙忧。”
        - 孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。
        - 盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。
        - 既来之，则安之。今由与求也，相夫子，远人不服、而不能来也；邦分崩离析、而不能守也：而谋动干戈于邦内。
        - 吾恐季孙之忧，不在颛臾，而在萧墙之内也。”
  - poem: 《大学》出自《礼记》
    type: 文言文选修
    author: 曾子
    created_at: 春秋末期
    paragraphs:
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E5%A4%A7%E5%AD%A6/5655065
        sentences:
        - 古之欲明明德于天下者，先治其国。欲治其国者，先齐其家。欲齐其家者，先修其身。欲修其身者，先正其心。
        - 欲正其心者，先诚其意。欲诚其意者，先致其知。致知在格物。
        - 物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。
        - 自天子以至于庶人，壹是皆以修身为本。 其本乱而末治者否矣。
        - 其所厚者薄，而其所薄者厚，未之有也。此谓知本，此谓知之至也。
  - poem: 《中庸》出自《礼记》
    type: 文言文选修
    author: 子思
    created_at: 战国时期
    paragraphs:
      - paragraph: 喜怒
        url: https://baike.baidu.com/item/%E4%B8%AD%E5%BA%B8/5700593
        sentences:
        - 喜怒哀乐之未发，谓之中；发而皆中节，谓之和；中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。
        - 博学之，审问之，慎思之，明辨之，笃行之。
        - 有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗思，思之弗得，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行之弗笃，弗措也。
        - 人一能之己百之，人十能之己千之。 
  - poem: 《孟子》一则
    type: 文言文选修
    author: 孟子
    created_at: 战国时期
    paragraphs:
      - paragraph: 敢问
        url: https://zhuanlan.zhihu.com/p/470252329
        sentences:
        - “敢问夫子恶乎长？” 
        - 曰：“我知言，我善养吾浩然之气。”
        - “敢问何谓浩然之气？” 
        - 曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。
        - 其为气也，配义与道；无是，馁也。
        - 是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。
        - 我故曰，告子未尝知义，以其外之也。必有事焉，而勿正；心勿忘，勿助长也，无若宋人然。
        - 宋人有闵其苗之不长而揠之者，芒芒然归，谓其人曰：‘今日病矣！予助苗长矣！’
        - 其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。
        - 以为无益而舍之者，不耘苗者也；助之长者，揠苗者也——非徒无益，而又害之。”
      - paragraph: 何谓
        url: https://zhuanlan.zhihu.com/p/470252329
        sentences:        
        - “何谓知言？”
        - 曰：“辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷——生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。” 
        - “宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行。
        - 孔子兼之，曰：‘我于辞命，则不能也。’然则夫子既圣矣乎？” 
        - 曰：“恶！是何言也？昔者子贡问于孔子曰：‘夫子圣矣乎？’
        - 孔子曰：‘圣则吾不能，我学不厌而教不倦也。’
        - 子贡曰：‘学不厌，智也；教不倦，仁也。仁且智，夫子既圣矣。’
        - 夫圣，孔子不居——是何言也？”
  - poem: 逍遥游（ 惠子谓庄子曰……则夫子犹有蓬之心也夫 ） 《庄子》 
    type: 文言文选修
    author: 庄周
    created_at: 战国时期
    paragraphs:
      - paragraph: 惠子
        url: https://baike.baidu.com/item/%E9%80%8D%E9%81%A5%E6%B8%B8/1506
        sentences:
        - 惠子谓庄子曰：“魏王贻我大瓠之种，我树之成，而实五石。
        - 以盛水浆，其坚不能自举也。
        - 剖之以为瓢，则瓠落无所容。
        - 非不呺然大也，吾为其无用而掊之。”
        - 庄子曰：“夫子固拙于用大矣。
        - 宋人有善为不龟手之药者，世世以洴澼絖为事。
        - 客闻之，请买其方百金。
        - 聚族而谋曰：‘我世世为洴澼絖，不过数金，今一朝而鬻技百金，请与之。’
        - 客得之，以说吴王。
        - 越有难，吴王使之将，冬，与越人水战，大败越人。
        - 裂地而封之。
        - 能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。
        - 今子有五石之瓠，何不虑以为大樽，而浮于江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”
  - poem: 谏逐客书 李斯 
    type: 文言文选修
    author: 李斯
    created_at: 秦王政十年
    paragraphs:
      - paragraph: 臣闻吏
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
        - 臣闻吏议逐客，窃以为过矣。
        - 昔穆公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。
        - 此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。
        - 孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。
        - 惠王用张仪之计，拔三川之地，西并巴蜀，北收上郡，南取汉中，包九夷，制鄢郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。
        - 昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。
        - 此四君者，皆以客之功。
        - 由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。
      - paragraph: 今陛
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
        - 今陛下致昆山之玉，有随和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。
        - 此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧，不饰朝廷；犀象之器，不为玩好；郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。
        - 所以饰后宫，充下陈，娱心意，说耳目者，必出于秦然后可，则是宛珠之簪，傅玑之珥，阿缟之衣，锦绣之饰不进于前，而随俗雅化，佳冶窈窕，赵女不立于侧也。
        - 夫击瓮叩缶弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；郑卫桑间、韶虞、武象者，异国之乐也。
        - 今弃击瓮叩缶而就郑卫，退弹筝而取韶虞，若是者何也？快意当前，适观而已矣。
        - 今取人则不然。
        - 不问可否，不论曲直，非秦者去，为客者逐。
        - 然则是所重者在乎色乐珠玉，而所轻者在乎人民也。
        - 此非所以跨海内、制诸侯之术也。
      - paragraph: 臣闻地
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
        - 臣闻地广者粟多，国大者人众，兵强则士勇。
        - 是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。
        - 是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。
        - 今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。
      - paragraph: 夫物
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
        - 夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。
        - 今逐客以资敌国，损民以益雠，内自虚而外树怨于诸侯，求国无危，不可得也。  
  - poem: 兰亭集序 
    type: 文言文选修
    author: 王羲之 
    created_at: 东晋
    paragraphs:
      - paragraph: 永和
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
        - 永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。
        - 群贤毕至，少长咸集。
        - 此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右。
        - 引以为流觞曲水，列坐其次。
        - 虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。
      - paragraph: 是日
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
        - 是日也，天朗气清，惠风和畅。
        - 仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。
      - paragraph: 夫人
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
        - 夫人之相与，俯仰一世。
        - 或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。
        - 虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己， 快（怏）然自足，（曾）不知老之将至。
        - 及其所之既倦，情随事迁，感慨系之矣。
        - 向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀。
        - 况修短随化，终期于尽。
        - 古人云：“死生亦大矣！”岂不痛哉！
      - paragraph: 每览
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
        - 每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。
        - 固知一死生为虚诞，齐彭殇为妄作。
        - 后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述。
        - 虽世殊事异，所以兴怀，其致一也。
        - 后之览者，亦将有感于斯文。 
  - poem: 滕王阁序 
    type: 文言文选修
    author: 王勃 
    created_at: 唐代
    paragraphs:
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 豫章故郡，洪都新府。
        - 星分翼轸，地接衡庐。
        - 襟三江而带五湖，控蛮荆而引瓯越。
        - 物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。
        - 雄州雾列，俊采星驰。
        - 台隍枕夷夏之交，宾主尽东南之美。
        - 都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。
        - 十旬休假，胜友如云；千里逢迎，高朋满座。
        - 腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。
        - 家君作宰，路出名区；童子何知，躬逢胜饯。
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 时维九月，序属三秋。
        - 潦水尽而寒潭清，烟光凝而暮山紫。
        - 俨骖騑（𬴂）于上路，访风景于崇阿。
        - 临帝子之长洲，得天人之旧馆。
        - 层峦耸翠，上出重霄；飞阁流丹，下临无地。
        - 鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。
        - 闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。
        - 云销雨霁，彩彻区明。
        - 落霞与孤鹜齐飞，秋水共长天一色。
        - 渔舟唱晚，响穷彭蠡之滨，雁阵惊寒，声断衡阳之浦。
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 遥襟甫畅，逸兴遄飞。
        - 爽籁发而清风生，纤歌凝而白云遏。
        - 睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。
        - 四美具，二难并。
        - 穷睇眄于中天，极娱游于暇日。
        - 天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。
        - 望长安于日下，目吴会于云间。
        - 地势极而南溟深，天柱高而北辰远。
        - 关山难越，谁悲失路之人；萍水相逢，尽是他乡之客。
        - 怀帝阍而不见，奉宣室以何年？
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 嗟乎！时运不齐，命途多舛。
        - 冯唐易老，李广难封。
        - 屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。
        - 老当益壮，宁移白首之心？穷且益坚，不坠青云之志。
        - 酌贪泉而觉爽，处涸辙以犹欢。
        - 北海虽赊，扶摇可接；东隅已逝，桑榆非晚。
        - 孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 勃，三尺微命，一介书生。
        - 无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。
        - 舍簪笏于百龄，奉晨昏于万里。
        - 非谢家之宝树，接孟氏之芳邻。
        - 他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。
        - 杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 呜乎！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。
        - 临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。
        - 敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。
        - 请洒潘江，各倾陆海云尔。
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
        - 滕王高阁临江渚，佩玉鸣鸾罢歌舞。 
        - 画栋朝飞南浦云，珠帘暮卷西山雨。 
        - 闲云潭影日悠悠，物换星移几度秋。 
        - 阁中帝子今何在？槛外长江空自流。
  - poem: 黄冈竹楼记 
    type: 文言文选修
    author: 王禹偁 
    created_at: 北宋
    paragraphs:
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
        - 黄冈之地多竹，大者如椽，竹工破之，刳去其节，用代陶瓦。
        - 比屋皆然，以其价廉而工省也。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
        - 子城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。
        - 远吞山光，平挹江濑，幽阒辽夐，不可具状。
        - 夏宜急雨，有瀑布声；冬宜密雪，有碎玉声；宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然；皆竹楼之所助也。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
        - 公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。
        - 江山之外，第见风帆沙鸟，烟云竹树而已。
        - 待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
        - 彼齐云、落星，高则高矣；井干、丽谯，华则华矣；止于贮妓女，藏歌舞，非骚人之事，吾所不取。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
        - 吾闻竹工云，竹之为瓦，仅十稔。
        - 若重覆之，得二十稔。
        - 噫，吾以至道乙未岁，自翰林出滁上，丙申移广陵；丁酉又入西掖，戊戌岁除日有齐安之命，己亥闰三月到郡。
        - 四年之间，奔走不暇，未知明年又在何处，岂惧竹楼之易朽乎！后之人与我同志，嗣而葺之，庶斯楼之不朽也！ 咸平二年八月十五日记。  
  - poem: 上枢密韩太尉书  
    type: 文言文选修
    author: 苏辙
    created_at: 北宋
    paragraphs:
      - paragraph: 太尉
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
        - 太尉执事：辙生好为文，思之至深。
        - 以为文者气之所形，然文不可以学而能，气可以养而致。
        - 孟子曰：“我善养吾浩然之气。”
        - 今观其文章，宽厚宏博，充乎天地之间，称其气之小大。
        - 太史公行天下，周览四海名山大川，与燕、赵间豪俊交游，故其文疏荡，颇有奇气。
        - 此二子者，岂尝执笔学为如此之文哉？其气充乎其中而溢乎其貌，动乎其言而见乎其文，而不自知也。
      - paragraph: 辙生
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
        - 辙生十有九年矣。
        - 其居家所与游者，不过其邻里乡党之人；所见不过数百里之间，无高山大野可登览以自广，百氏之书，虽无所不读，然皆古人之陈迹，不足以激发其志气。
        - 恐遂汩没，故决然舍去，求天下奇闻壮观，以知天地之广大。
        - 过秦、汉之故都，恣观终南、嵩、华之高，北顾黄河之奔流，慨然想见古之豪杰。
        - 至京师，仰观天子宫阙之壮，与仓廪、府库、城池、苑囿之富且大也，而后知天下之巨丽。
        - 见翰林欧阳公，听其议论之宏辨，观其容貌之秀伟，与其门人贤士大夫游，而后知天下之文章聚乎此也。
        - 太尉以才略冠天下，天下之所恃以无忧，四夷之所惮以不敢发，入则周公、召公，出则方叔、召虎。
        - 而辙也未之见焉。
      - paragraph: 且夫
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
        - 且夫人之学也，不志其大，虽多而何为？辙之来也，于山见终南、嵩、华之高，于水见黄河之大且深，于人见欧阳公，而犹以为未见太尉也。
        - 故愿得观贤人之光耀，闻一言以自壮，然后可以尽天下之大观而无憾者矣。
      - paragraph: 辙年
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
        - 辙年少，未能通习吏事。
        - 向之来，非有取于斗升之禄，偶然得之，非其所乐。
        - 然幸得赐归待选，使得优游数年之间，将以益治其文，且学为政。
        - 太尉苟以为可教而辱教之，又幸矣！  