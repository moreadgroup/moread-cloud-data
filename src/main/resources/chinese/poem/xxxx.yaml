poems:
  - poem: 典论·论文
    type: 古代文论选段
    author: 曹丕
    created_at: 三国时期
    paragraphs:
      - paragraph: xxx
        url: https://baike.baidu.com/item/%E5%85%B8%E8%AE%BA%C2%B7%E8%AE%BA%E6%96%87/7013652
        sentences:
        - 盖文章，经国之大业，不朽之盛事。
        - 年寿有时而尽，荣乐止乎其身，二者必至之常期，未若文章之无穷。
        - 是以古之作者，寄身于翰墨，见意于篇籍，不假良史之辞，不托飞驰之势，而声名自传于后。
  - poem: 诗品序
    type: 古代文论选段
    author: 锺嵘
    created_at: 南朝梁
    paragraphs:
      - paragraph: 若乃
        url: http://www.guoxuemeng.com/mingju/445207.html
        sentences:
        - 若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。
        - 嘉会寄诗以亲，离群讬诗以怨。
        - 至于楚臣去境，汉妾辞宫。
        - 或骨横朔野，魂逐飞蓬。
        - 或负戈外戍，杀气雄边。
        - 塞客衣单，孀闺泪尽。
        - 或士有解佩出朝，一去忘返。
        - 女有扬蛾入宠，再盼倾国。
        - 凡斯种种，感荡心灵，非陈诗何以展其义?非长歌何以骋其情?故曰：“诗可以群，可以怨。”使穷贱易安，幽居靡闷，莫尚于诗矣。
 
  - poem: 与元九书
    type: 古代文论选段
    author: 白居易
    created_at: 唐代
    paragraphs:
      - paragraph: 感人
        url: https://baike.baidu.com/item/%E4%B8%8E%E5%85%83%E4%B9%9D%E4%B9%A6/8973034
        sentences:
        - 感人心者，莫先乎情，莫始乎言，莫切乎声，莫深乎义。
        - 诗者，根情，苗言，华声，实义。 
  - poem: 题画·江馆清秋
    type: 古代文论选段
    author: 郑燮
    created_at: 清代
    paragraphs:
      - paragraph: 江馆
        url: http://www.guoxuemeng.com/gushici/445203.html
        sentences:
        - 江馆清秋，晨起看竹，烟光日影露气，皆浮动于疏枝密叶之间。
        - 胸中勃勃，遂有画意。
        - 其中胸中之竹，并不是眼中之竹。
        - 因而磨墨展纸，落笔倏作变相，手中之竹又不是胸中之竹也。
        - 总之，意在笔先者，定则也。
        - 趣在法外者，化机也。独画云乎哉? 
  - poem: 人间词话（ 词以境界为最上……自有名句；境非独谓景物也…… 否则谓之无境界； 古今之成大事业、 大学问者……恐为晏欧诸公 所不许也 ） 
    type: 古代文论选段
    author: 王国维
    created_at: 近代
    paragraphs:
      - paragraph: 词以
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
        - 词以境界为最上，有境界则自成高格，自有名句。
      - paragraph: 境非
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
        - 境非独谓景物也，喜怒哀乐，亦人心中之一境界。
        - 故能写真景物、真感情者，谓之有境界。
        - 否则谓之无境界。
      - paragraph: 古今
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
        - 古今之成大事业、大学问者，必经过三种之境界：
        - “昨夜西风凋碧树。独上高楼，望尽天涯路。”此第一境也。
        - “衣带渐宽终不悔，为伊消得人憔悴。” 此第二境也。
        - “众里寻他千百度，回头蓦见，那人正在，灯火阑珊处。” 此第三境也。
        - 此等语皆非大词人不能道。
        - 然遽以此意解释诸词，恐为晏、欧诸公所不许也。 
