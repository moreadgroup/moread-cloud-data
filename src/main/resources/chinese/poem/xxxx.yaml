 poems:
  - poem: 报任安书
    type: 文言文选必
    author: 司马迁
    created_at: 西汉
    paragraphs:
      - paragraph: 积土
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。。
          - 故不积跬步，无以至千里；不积小流，无以成江海。
          - 骐骥一跃，不能十步；驽马十驾，功在不舍。
          - 锲而舍之，朽木不折；锲而不舍，金石可镂。
          - 蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。
          - 蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。
          - 是故无冥冥之志者，无昭昭之明；无惛惛之事者，无赫赫之功。
          - 行衢道者不至，事两君者不容。目不能两视而明，耳不能两听而聪。
          - 螣蛇无足而飞，鼫鼠五技而穷。
          - 《诗》曰：“尸鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮！”
          - 故君子结于一也。