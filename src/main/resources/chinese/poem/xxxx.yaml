poems:
  - poem: 登岳阳楼 
    type: 诗词曲
    author: 杜甫
    created_at: 唐代
    paragraphs:
      - paragraph: 昔闻
        url: https://baike.baidu.com/item/%E7%99%BB%E5%B2%B3%E9%98%B3%E6%A5%BC/295
        sentences:
        - 昔闻洞庭水，今上岳阳楼。
        - 吴楚东南坼，乾坤日夜浮。
        - 亲朋无一字，老病有孤舟。
        - 戎马关山北，凭轩涕泗流。
        
  - poem: 琵琶行（并序） 
    type: 诗词曲
    author: 白居易
    created_at: 中唐
    paragraphs:
      - paragraph: 元和
        url: https://baike.baidu.com/item/%E7%90%B5%E7%90%B6%E8%A1%8C/69544
        sentences:
        - 元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。
        - 问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。
        - 遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。
        - 予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。
        - 因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。
        - 浔阳江头夜送客，枫叶荻花秋瑟瑟。
        - 主人下马客在船，举酒欲饮无管弦。
        - 醉不成欢惨将别，别时茫茫江浸月。
        - 忽闻水上琵琶声，主人忘归客不发。
        - 寻声暗问弹者谁？琵琶声停欲语迟。
        - 移船相近邀相见，添酒回灯重开宴。
        - 千呼万唤始出来，犹抱琵琶半遮面。
        - 转轴拨弦三两声，未成曲调先有情。
        - 弦弦掩抑声声思，似诉平生不得志。
        - 低眉信手续续弹，说尽心中无限事。
        - 轻拢慢捻抹复挑，初为《霓裳》后《六幺》。
        - 大弦嘈嘈如急雨，小弦切切如私语。
        - 嘈嘈切切错杂弹，大珠小珠落玉盘。
        - 间关莺语花底滑，幽咽泉流冰下难。
        - 冰泉冷涩弦凝绝，凝绝不通声暂歇。
        - 别有幽愁暗恨生，此时无声胜有声。
        - 银瓶乍破水浆迸，铁骑突出刀枪鸣。
        - 曲终收拨当心画，四弦一声如裂帛。
        - 东船西舫悄无言，唯见江心秋月白。
        - 沉吟放拨插弦中，整顿衣裳起敛容。
        - 自言本是京城女，家在虾蟆陵下住。
        - 十三学得琵琶成，名属教坊第一部。
        - 曲罢曾教善才服，妆成每被秋娘妒。
        - 五陵年少争缠头，一曲红绡不知数。
        - 钿头银篦击节碎，血色罗裙翻酒污。
        - 今年欢笑复明年，秋月春风等闲度。
        - 弟走从军阿姨死，暮去朝来颜色故。
        - 门前冷落鞍马稀，老大嫁作商人妇。
        - 商人重利轻别离，前月浮梁买茶去。
        - 去来江口守空船，绕船月明江水寒。
        - 夜深忽梦少年事，梦啼妆泪红阑干。
        - 我闻琵琶已叹息，又闻此语重唧唧。
        - 同是天涯沦落人，相逢何必曾相识！
        - 我从去年辞帝京，谪居卧病浔阳城。
        - 浔阳地僻无音乐，终岁不闻丝竹声。
        - 住近湓江地低湿，黄芦苦竹绕宅生。
        - 其间旦暮闻何物？杜鹃啼血猿哀鸣。
        - 春江花朝秋月夜，往往取酒还独倾。
        - 岂无山歌与村笛？呕哑嘲哳难为听。
        - 今夜闻君琵琶语，如听仙乐耳暂明。
        - 莫辞更坐弹一曲，为君翻作《琵琶行》。
        - 感我此言良久立，却坐促弦弦转急。
        - 凄凄不似向前声，满座重闻皆掩泣。
        - 座中泣下谁最多？江州司马青衫湿。
 
  - poem: 李凭箜篌引 
    type: 诗词曲
    author: 李贺
    created_at: 中唐
    paragraphs:
      - paragraph: 吴丝
        url: https://baike.baidu.com/item/%E6%9D%8E%E5%87%AD%E7%AE%9C%E7%AF%8C%E5%BC%95/2880645
        sentences:
        - 吴丝蜀桐张高秋，空山凝云颓不流。
        - 江娥啼竹素女愁，李凭中国弹箜篌。
        - 昆山玉碎凤凰叫，芙蓉泣露香兰笑。
        - 十二门前融冷光，二十三丝动紫皇。
        - 女娲炼石补天处，石破天惊逗秋雨。
        - 梦入神山教神妪，老鱼跳波瘦蛟舞。
        - 吴质不眠倚桂树，露脚斜飞湿寒兔。
 
  - poem: 菩萨蛮·小山重叠金明灭
    type: 诗词曲
    author: 温庭筠
    created_at: 晚唐
    paragraphs:
      - paragraph: 小山
        url: https://baike.baidu.com/item/%E8%8F%A9%E8%90%A8%E8%9B%AE%C2%B7%E5%B0%8F%E5%B1%B1%E9%87%8D%E5%8F%A0%E9%87%91%E6%98%8E%E7%81%AD
        sentences:
        - 小山重叠金明灭，鬓云欲度香腮雪。
        - 懒起画蛾眉，弄妆梳洗迟。
        - 照花前后镜，花面交相映。
        - 新帖绣罗襦，双双金鹧鸪。
 
  - poem: 锦瑟 
    type: 诗词曲
    author: 李商隐
    created_at: 晚唐
    paragraphs:
      - paragraph: 锦瑟
        url: https://baike.baidu.com/item/%E9%94%A6%E7%91%9F/396
        sentences:
        - 锦瑟无端五十弦，一弦一柱思华年。
        - 庄生晓梦迷蝴蝶，望帝春心托杜鹃。
        - 沧海月明珠有泪，蓝田日暖玉生烟。
        - 此情可待成追忆，只是当时已惘然。
 
  - poem: 虞美人·春花秋月何时了
    type: 诗词曲
    author: 李煜
    created_at: 北宋
    paragraphs:
      - paragraph: xxx
        url: https://baike.baidu.com/item/%E8%99%9E%E7%BE%8E%E4%BA%BA%C2%B7%E6%98%A5%E8%8A%B1%E7%A7%8B%E6%9C%88%E4%BD%95%E6%97%B6%E4%BA%86/10926799
        sentences:
        - 春花秋月何时了，往事知多少？小楼昨夜又东风，故国不堪回首月明中！
        - 雕栏玉砌应犹在，只是朱颜改。
        - 问君能有几多愁？恰似一江春水向东流。
 
  - poem: 望海潮·东南形胜
    type: 诗词曲
    author: 柳永
    created_at: 北宋
    paragraphs:
      - paragraph: 东南
        url: https://baike.baidu.com/item/%E6%9C%9B%E6%B5%B7%E6%BD%AE%C2%B7%E4%B8%9C%E5%8D%97%E5%BD%A2%E8%83%9C
        sentences:
        - 东南形胜，三吴都会，钱塘自古繁华。
        - 烟柳画桥，风帘翠幕，参差十万人家。
        - 云树绕堤沙。
        - 怒涛卷霜雪，天堑无涯。
        - 市列珠玑，户盈罗绮，竞豪奢。
      - paragraph: 重湖
        url: https://baike.baidu.com/item/%E6%9C%9B%E6%B5%B7%E6%BD%AE%C2%B7%E4%B8%9C%E5%8D%97%E5%BD%A2%E8%83%9C
        sentences:
        - 重湖叠𪩘清嘉。
        - 有三秋桂子，十里荷花。
        - 羌管弄晴⑾，菱歌泛夜，嬉嬉钓叟莲娃。
        - 千骑拥高牙。
        - 乘醉听箫鼓，吟赏烟霞。
        - 异日图将好景，归去凤池夸。
 
  - poem: 桂枝香·金陵怀古 
    type: 诗词曲
    author: 王安石
    created_at: 北宋
    paragraphs:
      - paragraph: 登临
        url: https://baike.baidu.com/item/%E6%A1%82%E6%9E%9D%E9%A6%99%C2%B7%E9%87%91%E9%99%B5%E6%80%80%E5%8F%A4
        sentences:
        - 登临送目，正故国晚秋，天气初肃。
        - 千里澄江似练，翠峰如簇。
        - 归帆去棹残阳里，背西风，酒旗斜矗。
        - 彩舟云淡，星河鹭起，画图难足。
      - paragraph: 念往
        url: https://baike.baidu.com/item/%E6%A1%82%E6%9E%9D%E9%A6%99%C2%B7%E9%87%91%E9%99%B5%E6%80%80%E5%8F%A4
        sentences:
        - 念往昔，繁华竞逐，叹门外楼头，悲恨相续。
        - 千古凭高，对此谩嗟荣辱。
        - 六朝旧事随流水，但寒烟芳草凝绿。
        - 至今商女，时时犹唱，后庭遗曲。 
 
  - poem: 江城子·乙卯正月二十日夜记梦 
    type: 诗词曲
    author: 苏轼
    created_at: 北宋
    paragraphs:
      - paragraph: 十年
        url: https://baike.baidu.com/item/%E6%B1%9F%E5%9F%8E%E5%AD%90%C2%B7%E4%B9%99%E5%8D%AF%E6%AD%A3%E6%9C%88%E4%BA%8C%E5%8D%81%E6%97%A5%E5%A4%9C%E8%AE%B0%E6%A2%A6/7332110
        sentences:
        - 十年生死两茫茫。
        - 不思量，自难忘。
        - 千里孤坟，无处话凄凉。
        - 纵使相逢应不识，尘满面，鬓如霜。
      - paragraph: 夜来
        url: https://baike.baidu.com/item/%E6%B1%9F%E5%9F%8E%E5%AD%90%C2%B7%E4%B9%99%E5%8D%AF%E6%AD%A3%E6%9C%88%E4%BA%8C%E5%8D%81%E6%97%A5%E5%A4%9C%E8%AE%B0%E6%A2%A6/7332110
        sentences:
        - 夜来幽梦忽还乡。
        - 小轩窗，正梳妆。
        - 相顾无言，惟有泪千行。
        - 料得年年肠断处，明月夜，短松冈。
 
  - poem: 念奴娇·赤壁怀古 
    type: 诗词曲
    author: 苏轼
    created_at: 北宋
    paragraphs:
      - paragraph: 大江
        url: https://baike.baidu.com/item/%E5%BF%B5%E5%A5%B4%E5%A8%87%C2%B7%E8%B5%A4%E5%A3%81%E6%80%80%E5%8F%A4/847153
        sentences:
        - 大江东去，浪淘尽，千古风流人物。
        - 故垒西边，人道是：三国周郎赤壁。
        - 乱石穿空，惊涛拍岸，卷起千堆雪。
        - 江山如画，一时多少豪杰。
      - paragraph: 遥想
        url: https://baike.baidu.com/item/%E5%BF%B5%E5%A5%B4%E5%A8%87%C2%B7%E8%B5%A4%E5%A3%81%E6%80%80%E5%8F%A4/847153
        sentences:
        - 遥想公瑾当年，小乔初嫁了，雄姿英发。
        - 羽扇纶巾，谈笑间、樯橹灰飞烟灭。
        - 故国神游，多情应笑我，早生华发。
        - 人生如梦，一尊还酹江月。
 
  - poem: 登快阁 
    type: 诗词曲
    author: 黄庭坚
    created_at: 北宋
    paragraphs:
      - paragraph: 痴儿
        url: https://baike.baidu.com/item/%E7%99%BB%E5%BF%AB%E9%98%81
        sentences:
        - 痴儿了却公家事，快阁东西倚晚晴。
        - 落木千山天远大，澄江一道月分明。
        - 朱弦已为佳人绝，青眼聊因美酒横。
        - 万里归船弄长笛，此心吾与白鸥盟。
 
  - poem: 鹊桥仙·纤云弄巧
    type: 诗词曲
    author: 秦观
    created_at: 北宋
    paragraphs:
      - paragraph: 纤云
        url: https://baike.baidu.com/item/%E9%B9%8A%E6%A1%A5%E4%BB%99%C2%B7%E7%BA%A4%E4%BA%91%E5%BC%84%E5%B7%A7/6679491
        sentences:
        - 纤云弄巧，飞星传恨，银汉迢迢暗度。
        - 金风玉露一相逢，便胜却人间无数。
        - 柔情似水，佳期如梦，忍顾鹊桥归路。
        - 两情若是久长时，又岂在朝朝暮暮。
 
  - poem: 苏幕遮·燎沈香
    type: 诗词曲
    author: 周邦彦
    created_at: 北宋
    paragraphs:
      - paragraph: 燎沈
        url: https://baike.baidu.com/item/%E8%8B%8F%E5%B9%95%E9%81%AE%C2%B7%E7%87%8E%E6%B2%88%E9%A6%99/6528191
        sentences:
        - 燎沈香，消溽暑。
        - 鸟雀呼晴，侵晓窥檐语。
        - 叶上初阳干宿雨，水面清圆，一一风荷举。
        - 故乡遥，何日去？家住吴门，久作长安旅。
        - 五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。
 
  - poem: 声声慢·寻寻觅觅
    type: 诗词曲
    author: 李清照
    created_at: 南宋
    paragraphs:
      - paragraph: 寻寻
        url: https://baike.baidu.com/item/%E5%A3%B0%E5%A3%B0%E6%85%A2%C2%B7%E5%AF%BB%E5%AF%BB%E8%A7%85%E8%A7%85/10912390
        sentences:
        - 寻寻觅觅，冷冷清清，凄凄惨惨戚戚。
        - 乍暖还寒时候，最难将息。
        - 三杯两盏淡酒，怎敌他、晚来风急？雁过也，正伤心，却是旧时相识。
      - paragraph: 满地
        url: https://baike.baidu.com/item/%E5%A3%B0%E5%A3%B0%E6%85%A2%C2%B7%E5%AF%BB%E5%AF%BB%E8%A7%85%E8%A7%85/10912390
        sentences:
        - 满地黄花堆积。
        - 憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。
        - 这次第，怎一个愁字了得！
 
  - poem: 书愤
    type: 诗词曲
    author: 陆游
    created_at: 南宋
    paragraphs:
      - paragraph: 早岁
        url: https://baike.baidu.com/item/%E4%B9%A6%E6%84%A4/1059791
        sentences:
        - 早岁那知世事艰，中原北望气如山。
        - 楼船夜雪瓜洲渡，铁马秋风大散关。
        - 塞上长城空自许，镜中衰鬓已先斑。
        - 出师一表真名世，千载谁堪伯仲间！
 
  - poem: 临安春雨初霁 
    type: 诗词曲
    author: 陆游
    created_at: 南宋
    paragraphs:
      - paragraph: 世味
        url: https://baike.baidu.com/item/%E4%B8%B4%E5%AE%89%E6%98%A5%E9%9B%A8%E5%88%9D%E9%9C%81
        sentences:
        - 世味年来薄似纱，谁令骑马客京华？
        - 小楼一夜听春雨，深巷明朝卖杏花。
        - 矮纸斜行闲作草，晴窗细乳戏分茶。
        - 素衣⒀莫起风尘叹，犹及清明可到家。
 
  - poem: 念奴娇·过洞庭 
    type: 诗词曲
    author: 张孝祥
    created_at: 南宋
    paragraphs:
      - paragraph: 洞庭
        url: https://baike.baidu.com/item/%E5%BF%B5%E5%A5%B4%E5%A8%87%C2%B7%E8%BF%87%E6%B4%9E%E5%BA%AD
        sentences:
        - 洞庭青草，近中秋，更无一点风色。
        - 玉鉴琼田三万顷，着我扁舟一叶。
        - 素月分辉，明河共影，表里俱澄澈。
        - 悠然心会，妙处难与君说。
      - paragraph: 应念
        url: https://baike.baidu.com/item/%E5%BF%B5%E5%A5%B4%E5%A8%87%C2%B7%E8%BF%87%E6%B4%9E%E5%BA%AD
        sentences:
        - 应念岭表经年，孤光自照，肝胆皆冰雪。
        - 短发萧骚襟袖冷，稳泛沧溟空阔。
        - 尽挹西江，细斟北斗，万象为宾客。
        - 扣舷独啸，不知今夕何夕。
 
  - poem: 永遇乐·京口北固亭怀古 
    type: 诗词曲
    author: 辛弃疾
    created_at: 南宋
    paragraphs:
      - paragraph: 千古
        url: https://baike.baidu.com/item/%E6%B0%B8%E9%81%87%E4%B9%90%C2%B7%E4%BA%AC%E5%8F%A3%E5%8C%97%E5%9B%BA%E4%BA%AD%E6%80%80%E5%8F%A4/3743164
        sentences:
        - 千古江山，英雄无觅，孙仲谋处。
        - 舞榭歌台，风流总被，雨打风吹去。
        - 斜阳草树，寻常巷陌，人道寄奴曾住。
        - 想当年，金戈铁马，气吞万里如虎。
      - paragraph: 元嘉
        url: https://baike.baidu.com/item/%E6%B0%B8%E9%81%87%E4%B9%90%C2%B7%E4%BA%AC%E5%8F%A3%E5%8C%97%E5%9B%BA%E4%BA%AD%E6%80%80%E5%8F%A4/3743164
        sentences:
        - 元嘉草草，封狼居胥，赢得仓皇北顾。
        - 四十三年，望中犹记，烽火扬州路。
        - 可堪回首，佛狸祠下，一片神鸦社鼓。
        - 凭谁问：廉颇老矣，尚能饭否？
 
  - poem: 菩萨蛮·书江西造口壁 
    type: 诗词曲
    author: 辛弃疾
    created_at: 南宋
    paragraphs:
      - paragraph: 郁孤
        url: https://baike.baidu.com/item/%E8%8F%A9%E8%90%A8%E8%9B%AE%C2%B7%E4%B9%A6%E6%B1%9F%E8%A5%BF%E9%80%A0%E5%8F%A3%E5%A3%81
        sentences:
        - 郁孤台下清江水，中间多少行人泪。
        - 西北望长安，可怜无数山。
        - 青山遮不住，毕竟东流去。
        - 江晚正愁余，山深闻鹧鸪。
 
  - poem: 青玉案·元夕 
    type: 诗词曲
    author: 辛弃疾
    created_at: 南宋
    paragraphs:
      - paragraph: 东风
        url: https://baike.baidu.com/item/%E9%9D%92%E7%8E%89%E6%A1%88%C2%B7%E5%85%83%E5%A4%95/2582543
        sentences:
        - 东风夜放花千树。
        - 更吹落，星如雨。
        - 宝马雕车香满路。
        - 凤箫声动，玉壶光转，一夜鱼龙舞。
      - paragraph: 蛾儿
        url: https://baike.baidu.com/item/%E9%9D%92%E7%8E%89%E6%A1%88%C2%B7%E5%85%83%E5%A4%95/2582543
        sentences:
        - 蛾儿雪柳黄金缕。
        - 笑语盈盈暗香去。
        - 众里寻他千百度。
        - 蓦然回首，那人却在，灯火阑珊处。
 
  - poem: 贺新郎·国脉微如缕
    type: 诗词曲
    author: 刘克庄
    created_at: 南宋
    paragraphs:
      - paragraph: 国脉
        url: https://baike.baidu.com/item/%E8%B4%BA%E6%96%B0%E9%83%8E%C2%B7%E5%9B%BD%E8%84%89%E5%BE%AE%E5%A6%82%E7%BC%95/482080
        sentences:
        - 国脉微如缕。
        - 问长缨何时入手，缚将戎主？未必人间无好汉，谁与宽些尺度？试看取当年韩五。
        - 岂有谷城公付授，也不干曾遇骊山母。
        - 谈笑起，两河路。
      - paragraph: 少时
        url: https://baike.baidu.com/item/%E8%B4%BA%E6%96%B0%E9%83%8E%C2%B7%E5%9B%BD%E8%84%89%E5%BE%AE%E5%A6%82%E7%BC%95/482080
        sentences:
        - 少时棋柝曾联句。
        - 叹而今登楼揽镜，事机频误。
        - 闻说北风吹面急，边上冲梯屡舞。
        - 君莫道投鞭虚语，自古一贤能制难，有金汤便可无张许？快投笔，莫题柱。
 
  - poem: 扬州慢·淮左名都
    type: 诗词曲
    author: 姜夔
    created_at: 南宋
    paragraphs:
      - paragraph: 淳熙
        url: https://baike.baidu.com/item/%E6%89%AC%E5%B7%9E%E6%85%A2%C2%B7%E6%B7%AE%E5%B7%A6%E5%90%8D%E9%83%BD/9756101
        sentences:
        - 淳熙丙申至日，予过维扬。
        - 夜雪初霁，荠麦弥望。
        - 入其城，则四顾萧条，寒水自碧，暮色渐起，戍角悲吟。
        - 予怀怆然，感慨今昔，因自度此曲。
        - 千岩老人以为有“黍离”之悲也。
      - paragraph: 淮左
        url: https://baike.baidu.com/item/%E6%89%AC%E5%B7%9E%E6%85%A2%C2%B7%E6%B7%AE%E5%B7%A6%E5%90%8D%E9%83%BD/9756101
        sentences:
        - 淮左名都，竹西佳处，解鞍少驻初程。
        - 过春风十里，尽荠麦青青。
        - 自胡马窥江去后，废池乔木，犹厌言兵。
        - 渐黄昏，清角吹寒，都在空城。
      - paragraph: 杜郎
        url: https://baike.baidu.com/item/%E6%89%AC%E5%B7%9E%E6%85%A2%C2%B7%E6%B7%AE%E5%B7%A6%E5%90%8D%E9%83%BD/9756101
        sentences:
        - 杜郎俊赏，算而今重到须惊。
        - 纵豆蔻词工，青楼梦好，难赋深情。
        - 二十四桥仍在，波心荡、冷月无声。
        - 念桥边红药，年年知为谁生？
 
  - poem: 长亭送别
    type: 诗词曲
    author: 王实甫
    created_at: 元代
    paragraphs:
      - paragraph: 碧云
        url: https://baike.baidu.com/item/%E9%95%BF%E4%BA%AD%E9%80%81%E5%88%AB
        sentences:
        - 【正宫】【端正好】碧云天，黄花地，西风紧，北雁南飞。
        - 晓来谁染霜林醉？总是离人泪。
      - paragraph: 恨相
        url: https://baike.baidu.com/item/%E9%95%BF%E4%BA%AD%E9%80%81%E5%88%AB
        sentences:
        - 【滚绣球】恨相见得迟，怨归去得疾。
        - 柳丝长玉骢难系，恨不倩疏林挂住斜晖。
        - 马儿迍迍的行，车儿快快的随，却告了相思回避，破题儿又早别离。
        - 听得道一声“去也”，松了金钏；遥望见十里长亭，减了玉肌：此恨谁知？
 
  - poem: 朝天子·咏喇叭 
    type: 诗词曲
    author: 王磐
    created_at: 明代
    paragraphs:
      - paragraph: 喇叭
        url: https://baike.baidu.com/item/%E6%9C%9D%E5%A4%A9%E5%AD%90%C2%B7%E5%92%8F%E5%96%87%E5%8F%AD
        sentences:
        - 喇叭，唢呐，曲儿小腔儿大。
        - 官船来往乱如麻，全仗你抬声价。
        - 军听了军愁，民听了民怕。
        - 那里去辨甚么真共假？眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！
 
