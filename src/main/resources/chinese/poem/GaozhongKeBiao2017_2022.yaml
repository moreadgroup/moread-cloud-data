poems:
  - poem: 论语
    type: 文言文必修
    author: 春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子的言行
    created_at: 战国前期
    paragraphs:
      - paragraph: 人而
        url: https://baike.baidu.com/item/%E4%BA%BA%E8%80%8C%E4%B8%8D%E4%BB%81
        sentences:
          - ancient: 子曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
            vernacular: 孔子说：“一个人没有仁爱之心，遵守礼仪有什么用？一个人没有仁爱之心，礼乐有什么用？” ①如礼何：“如…何”是古代常用句式，当中一般插入代词、名词或其他词语，意思是“把（对）…怎么样（怎么办）”。
      - paragraph: 朝闻
        url: https://baike.baidu.com/item/%E6%9C%9D%E9%97%BB%E9%81%93/13326
        sentences:
          - ancient: 子曰：朝闻道，夕死可矣。
            vernacular: 在听闻圣人之道后，要不断的固守，坚持，实践，承担，不退转，达到不愠的世界。
      - paragraph: 君子
        url: https://baike.baidu.com/item/%E5%90%9B%E5%AD%90%E5%96%BB%E4%BA%8E%E4%B9%89
        sentences:
          - ancient: 君子喻于义，小人喻于利。
            vernacular: 有道君子通晓大义，无道小人只懂得追求小利。喻，喻晓之意。
      - paragraph: 见贤
        url: https://baike.baidu.com/item/%E8%A7%81%E8%B4%A4%E6%80%9D%E9%BD%90%E7%84%89
        sentences:
          - ancient: 见贤思齐焉，见不贤而内自省也。
          - vernacular: 看到有德行有才能的人就向他学习，希望能在其中和他看齐；见到没有德行的人就要在内心反省自我的缺点。
      - paragraph: 质胜
        url: https://baike.baidu.com/item/%E8%B4%A8%E8%83%9C%E6%96%87%E5%88%99%E9%87%8E
        sentences:
          - ancient: 质胜文则野，文胜质则史，文质彬彬，然后君子。
            vernacular: “质朴胜过了文饰就会粗野，文饰胜过了质朴就会虚浮，质朴和文饰比例恰当，然后才可以成为君子。”出自《论语·雍也》。
      - paragraph: 士不
        url: https://baike.baidu.com/item/%E5%A3%AB%E4%B8%8D%E5%8F%AF%E4%BB%A5%E4%B8%8D%E5%BC%98%E6%AF%85
        sentences:
          - ancient: 士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？
            vernacular: 学士不可以不志向远大，意志坚强，因为他肩负重任，路途遥远。把实行仁道作为自己的责任，不是很重大吗？直到死去才停止，也是要经历长期的奋斗。
      - paragraph: 譬如
        url: https://baike.baidu.com/item/%E5%AD%94%E5%AD%9F%E8%AE%BA%E5%AD%A6/1115047
        sentences:
          - ancient: 譬如为山，未成一篑，止吾止也。
            vernacular: 比如堆积土山，只差一筐土而没有堆成，停止了，就停止了。比如填平洼地，虽然只倒下了一筐土，但是如果我继续干下去，那就是我主动前进的。
      - paragraph: 知者
        url: https://baike.baidu.com/item/%E8%AE%BA%E8%AF%AD%C2%B7%E5%AD%90%E7%BD%95/624504
        sentences:
          - ancient: 知者不惑，仁者不忧，勇者不惧。
            vernacular: 不断地求取知识，以至于不在对现实世界的事物产生困惑；真诚的待人如己，以至于不在为个人得失而忧愁；勇敢的实践前行以至于不在畏惧任何困难。
      - paragraph: 有一
        url: https://baike.baidu.com/item/%E5%8D%AB%E7%81%B5%E5%85%AC/20400580
        sentences:
          - ancient: 子贡问曰：“有一言而可以终身行之者乎?”
            vernacular: 子贡问孔子问道：“有没有一个字可以终身奉行的呢？”
          - ancient: 子曰：“其恕乎!己所不欲，勿施于人。”(《卫灵公》)
            vernacular: 孔子回答说：“那就是恕吧！自己不愿意的，不要强加给别人。”
      - paragraph: 小子
        url: https://baike.baidu.com/item/%E8%AE%BA%E8%AF%AD%E4%B8%89%E5%88%99/2067460
        sentences:
          - ancient: 子曰：“小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君，多识于鸟兽草木之名。”
            vernacular: 孔子说：“学生们为什么不学习《诗经》呢？学《诗经》可以抒发情志，可以观察社会与自然，可以使人结交朋友，可以使人懂得怎样去讽谏怨刺不平之事。近可以用来侍奉父母，远可以侍奉君主；还可以多知道一些鸟兽草木的名字。”
      - paragraph: 君子食
        url: https://baike.baidu.com/item/%E9%A3%9F%E6%97%A0%E6%B1%82%E9%A5%B1
        sentences:
          - ancient: 君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。
            vernacular: 君子，饮食不求饱足，居住不要求舒适，对工作勤劳敏捷，说话却小心谨慎，到有道的人那里去匡正自己，这样可以说是好学了
      - paragraph: 克己
        url: https://baike.baidu.com/item/%E8%AE%BA%E8%AF%AD%C2%B7%E9%A2%9C%E6%B8%8A
        sentences:
          - ancient: 颜渊问仁。
            vernacular: 颜渊问怎样做才是仁。
          - ancient: 子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”
            vernacular: 孔子说：“克制自己，一切都照着礼的要求去做，这就是仁。一旦这样做了，天下的一切就都归于仁了。实行仁德，完全在于自己，难道还在于别人吗？”
          - ancient: 颜渊曰：“请问其目。”
            vernacular: 颜渊说：“请问实行仁的条目。”
          - ancient: 子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”
            vernacular: 孔子说：“不合于礼的不要看，不合于礼的不要听，不合于礼的不要说，不合于礼的不要做。”
          - ancient: 颜渊曰：“回虽不敏，请事斯语矣。”（《论语·颜渊》）
            vernacular: 颜渊说：“我虽然愚笨，也要照您的这些话去做。”
  - poem: 劝学
    author: 荀子
    created_at: 战国后期
    type: 文言文必修
    paragraphs:
      - paragraph: 学不
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 君子曰：学不可以已。
            vernacular: 君子说：学习不可以半途而止。
          - ancient: 青，取之于蓝，而青于蓝；冰，水为之，而寒于水。
            vernacular: 靛青是从蓼蓝草里提炼出来的，却比蓼蓝草还要青；冰是由水凝结而成的，却比水还要寒冷。
          - ancient: 木直中绳，𫐓以为轮，其曲中规。
            vernacular: 木材直得符合拉直的墨线，用煣的工艺把它制成车轮，那么木材的弯度就合乎圆的标准了。
          - ancient: 虽有槁暴，不复挺者，輮使之然也。
            vernacular: 即使又被风吹日晒而干枯了，木材也不会再挺直，是因为经过加工使它成为这样的。
          - ancient: 故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。
            vernacular: 所以木材用墨线量过再经辅具加工就能取直，刀剑在磨刀石上磨过就能变得锋利，君子广博地学习并且每天检验反省自己，那么他就会智慧明达而且行为没有过失了。
      - paragraph: 故不
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 故不登高山，不知天之高也；不临深溪，不知地之厚也；不闻先王之遗言，不知学问之大也。
            vernacular: 因此，不登上高山，就不知天有多高；不面临深涧，就不知道地有多厚；不懂得先代帝王的遗教，就不知道学问的博大。
          - ancient: 干、越、夷、貉之子，生而同声，长而异俗，教使之然也。
            vernacular: 干国、越国、夷族、貉族的人，刚生下来啼哭的声音是一样的；待他们长大以后，其风俗习性却不相同，这是由于后天所受的教育不同所造成的。
          - ancient: 诗曰：“嗟尔君子，无恒安息。靖共尔位，好是正直。神之听之，介尔景福。”
            vernacular: 《诗经》上说：“你这个君子啊，不要总是贪图安逸。恭谨对待你的本职，爱好正直的德行。神明听到这一切，就会赐给你洪福祥瑞。”
          - ancient: 神莫大于化道，福莫长于无祸。
            vernacular: 人的德行的境界，没有比接受道的教化更高的了；人的幸福，没有比无灾无祸更长远的了。
      - paragraph: 吾尝
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。
            vernacular: 我曾经整天思索，却不如片刻学到的知识多；我曾经踮起脚远望，却不如登到高处看得广阔。
          - ancient: 登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。
            vernacular: 登到高处招手，胳膊没有加长，可是别人在远处也能看见；顺着风呼叫，声音没有变得洪亮，可是听的人在远处也能听得很清楚。
          - ancient: 假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。
            vernacular: 借助车马的人，并不是脚走得快，却可以达到千里之外；借助舟船的人，并不善于游泳，却可以横渡江河。
          - ancient: 君子生非异也，善假于物也。
            vernacular: 君子的资质秉性跟一般人没有不同，只是君子善于借助外物罢了。
      - paragraph: 南方
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 南方有鸟焉，名曰蒙鸠，以羽为巢，而编之以发，系之苇苕。
            vernacular: 南方有一种鸟，名叫“蒙鸠”，用羽毛构筑自己的窝巢，再用毛发把窝编结起来，把窝系在芦苇的嫩条上。
          - ancient: 风至苕折，卵破子死。
            vernacular: 一遇风吹，芦苇的嫩条折断，蒙鸠的窝巢也就掉到地上，鸟蛋被打破，幼鸟被摔死。
          - ancient: 巢非不完也，所系者然也。
            vernacular: 这并不是蒙鸠的窝巢构筑得不完好，而是由于它所系结的东西太脆弱所造成的。
          - ancient: 西方有木焉，名曰射干，茎长四寸，生于高山之上，而临百仞之渊。
            vernacular: 西方有一种树木，名叫“射干”，树茎只有四寸长，可它生长在高山上面，就能俯瞰百丈深渊。
          - ancient: 木茎非能长也，所立者然也。
            vernacular: 这并不是在高山上面射干的树茎就能够长得长些，而是它所生长的地势使它如此的。
          - ancient: 蓬生麻中，不扶而直；白沙在涅，与之俱黑。
            vernacular: 蓬草生长在麻丛当中，不需要扶植就长得挺直；洁白的沙子如果混进了黑泥里，也会变得跟就黑泥一样黑。
          - ancient: 兰槐之根是为芷，其渐之滫，君子不近，庶人不服。
            vernacular: 香草兰槐的根叫做芷，虽然香，如果将它浸泡在臭水当中，君子就不愿意接近它，百姓也不愿意佩戴它。
          - ancient: 其质非不美也，所渐者然也。
            vernacular: 这并不是芷的本质不好，而是由于它被浸泡在臭水里的缘故。
          - ancient: 故君子居必择乡，游必就士，所以防邪辟而近中正也。
            vernacular: 因此，君子定居时一定要选择好的环境，外出交游一定要和有道德有学问的人结伴，这样就能够防止自己受邪恶乖僻之人的影响，而逐渐接近“礼”“仁”之道。
      - paragraph: 物类
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 物类之起，必有所始。
            vernacular: 各类事情的发生，都是它的根源。
          - ancient: 荣辱之来，必象其德。
            vernacular: 人的荣辱的降临，也必定和他品德的优劣相应。
          - ancient: 肉腐出虫，鱼枯生蠹。
            vernacular: 肉腐了会生蛆，鱼枯死了会生虫。
          - ancient: 怠慢忘身，祸灾乃作。
            vernacular: 懒散到连自身的安危都不顾的时候，灾祸也就要降临了。
          - ancient: 强自取柱，柔自取束。
            vernacular: 太坚硬了容易断裂，太柔弱了又易被束缚。
          - ancient: 邪秽在身，怨之所构。
            vernacular: 自己邪恶肮脏，那就必然造成人们对你怨恨。
          - ancient: 施薪若一，火就燥也，平地若一，水就湿也。
            vernacular: 把干湿不同的柴草堆置得一样，火总会朝着干燥的一堆烧去；一样平整的地面如果有干有湿，水也总是向着潮湿的地方流去。
          - ancient: 草木畴生，禽兽群焉，物各从其类也。
            vernacular: 野草和树木总是共同生长，飞禽和走兽也总是成群居住，万物就是这样依从自己的同类以生存。
          - ancient: 是故质的张，而弓矢至焉；林木茂，而斧斤至焉；树成荫，而众鸟息焉。
            vernacular: 所以靶子一旦张设，箭也就会对着它射去；森林一旦繁茂，伐木者也就拿着斧头来了；树木一旦成荫，众鸟也就会飞来休息。
          - ancient: 醯酸，而蜹聚焉。
            vernacular: 醋一有酸味，蚊蝇也就自然会飞来相聚。
          - ancient: 故言有招祸也，行有招辱也，君子慎其所立乎！
            vernacular: 所以言语有时会带来灾祸，行动有时会招致耻辱，君子应当谨慎地对待自己的一言一行。
      - paragraph: 积土
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - ancient: 积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。
            vernacular: 堆积土石成了高山，风雨从这里兴起；汇积水流成为深渊，蛟龙从这儿产生；积累善行养成高尚的道德，精神得到提升，圣人的心境由此具备。
          - ancient: 故不积跬步，无以至千里；不积小流，无以成江海。
            vernacular: 所以不积累一步半步的行程，就没有办法达到千里之远；不积累细小的流水，就没有办法汇成江河大海。
          - ancient: 骐骥一跃，不能十步；驽马十驾，功在不舍。
            vernacular: 骏马一跨跃，也不足十步远；劣马连走十天，它的成功在于不停止。
          - ancient: 锲而舍之，朽木不折；锲而不舍，金石可镂。
            vernacular: 如果刻几下就停下来了，那么腐朽的木头也刻不断。如果不停地刻下去，那么金石也能雕刻成功。
          - ancient: 蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。
            vernacular: 蚯蚓没有锐利的爪子和牙齿，强健的筋骨，却能向上吃到泥土，向下喝到地下的泉水，这是由于它用心专一。
          - ancient: 蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。
            vernacular: 螃蟹有六条腿，两个蟹钳，但是没有蛇、鳝的洞穴它就无处藏身，这是因为它用心浮躁。
          - ancient: 是故无冥冥之志者，无昭昭之明；无惛惛之事者，无赫赫之功。
            vernacular: 因此没有刻苦钻研的心志，学习上就不会有显著成绩；没有埋头苦干的实践，事业上就不会有巨大成就。
          - ancient: 行衢道者不至，事两君者不容。
            vernacular: 在十字路口徘徊不定的人，任何一条路的尽头都不能到达；同时事奉两个君主的人，任何一方都不会容纳他。
          - ancient: 目不能两视而明，耳不能两听而聪。
            vernacular: 眼睛不可能同时看清楚两样东西，耳朵不可能同时听清楚两个声音。
          - ancient: 螣蛇无足而飞，鼫鼠五技而穷。
            vernacular: 螣蛇没有脚但能凌空而飞，鼫鼠有五种技能却还是飞不上屋。
          - ancient: 《诗》曰：“尸鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮！”
            vernacular: 《诗经》上说：“布谷鸟筑巢在桑树上，它的幼鸟儿有七只。善良的君子们，行为要专一不偏邪。行为专一不偏邪，意志才会如磐石坚。”
          - ancient: 故君子结于一也。
            vernacular: 所以君子的意志坚定专一。
  - poem: 屈原列传
    type: 文言文必修
    author: 司马迁
    created_at: 战国后期
    paragraphs:
      - paragraph: 屈原
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - ancient: 屈原者，名平，楚之同姓也。为楚怀王左徒。
            vernacular: 屈原名平，与楚国的王族同姓。他曾担任楚怀王的左徒。
          - ancient: 博闻强志，明于治乱，娴于辞令。
            vernacular: 见闻广博，记忆力很强，通晓治理国家的道理，熟悉外交应对辞令。
          - ancient: 入则与王图议国事，以出号令，出则接遇宾客，应对诸侯。
            vernacular: 对内与怀王谋划商议国事，发号施令；对外接待宾客，应酬诸侯。
          - ancient: 王甚任之。
            vernacular: 怀王很信任他。
      - paragraph: 上官
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - ancient: 上官大夫与之同列，争宠而心害其能。
            vernacular: 上官大夫和他同在朝列，想争得怀王的宠幸，心里嫉妒屈原的才能。
          - ancient: 怀王使屈原造为宪令，屈平属草稿未定。
            vernacular: 怀王让屈原制订法令，屈原起草尚未定稿。
          - ancient: 上官大夫见而欲夺之，屈平不与。
            vernacular: 上官大夫见了就想强行更改它（想邀功），屈原不赞同。
          - ancient: 因谗之曰：“王使屈平为令，众莫不知，每一令出，平伐其功，曰：以为‘非我莫能为’也。”
            vernacular: 他就在怀王面前谗毁屈原说：“大王叫屈原制订法令，大家没有不知道的，每一项法令发出，屈原就夸耀自己的功劳说：除了我，没有人能做的。”
          - ancient: 王怒而疏屈平。
            vernacular: 怀王很生气，就疏远了屈原。
      - paragraph: 屈平
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - ancient: 屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思，而作《离骚》。
            vernacular: 屈原痛心怀王惑于小人之言，不能明辨是非，小人混淆黑白，使怀王看不明白，邪恶的小人妨碍国家，端方正直的君子则不为朝廷所容，所以忧愁苦闷，写下了《离骚》。
          - ancient: “离骚”者，犹离忧也。
            vernacular: “离骚”，就是遭到忧愁的意思。
          - ancient: 夫天者，人之始也;父母者，人之本也。
            vernacular: 天是人类的原始，父母是人的根本。
          - ancient: 人穷则反本，故劳苦倦极，未尝不呼天也，疾痛惨怛，未尝不呼父母也。
            vernacular: 人处于困境就会追念本源，所以到了极其劳苦疲倦的时候，没有不叫天的；遇到病痛或忧伤的时候，没有不叫父母的。
          - ancient: 屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣!
            vernacular: 屈原行为正直，竭尽自己的忠诚和智慧来辅助君主，谗邪的小人来离间他，可以说到了困境了。
          - ancient: 信而见疑，忠而被谤，能无怨乎?
            vernacular: 诚信却被怀疑，忠实却被诽谤，能够没有怨恨吗？
          - ancient: 屈平之作《离骚》，盖自怨生也。
            vernacular: 屈原之所以写《离骚》，其原因大概是从怨愤引起的。
          - ancient: 《国风》好色而不淫，《小雅》怨诽而不乱。
            vernacular: 《国风》虽然多写男女爱情，但不过分而失当，《小雅》虽然多讥讽指责，但并不宣扬作乱。
          - ancient: 若《离骚》者，可谓兼之矣。
            vernacular: 像《离骚》，可以说是兼有二者的特点了。
          - ancient: 上称帝喾，下道齐桓，中述汤、武，以刺世事。
            vernacular: 它对远古上溯到帝喾，近世称述齐桓公，中古称述商汤和周武王，用来讽刺当时的政事。
          - ancient: 明道德之广崇，治乱之条贯，靡不毕见。
            vernacular: 阐明道德的广阔崇高，国家治乱兴亡的道理，无不完全表现出来。
          - ancient: 其文约，其辞微，其志洁，其行廉。
            vernacular: 他的文笔简约，词意精微，他的志趣高洁，行为廉正。
          - ancient: 其称文小而其指极大，举类迩而见义远。
            vernacular: 就其文字描写来看，不过寻常事物，但它的旨趣是极大的（因为关系到国家的治乱），举的是近事，而表达的意思却十分深远。
          - ancient: 其志洁，故其称物芳。
            vernacular: 由于志趣高洁，所以文章中称述的事物也是透散着芬芳的。
          - ancient: 其行廉，故死而不容。
            vernacular: 由于行为廉正，所以到死也不为奸邪势力所容。
          - ancient: 自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。
            vernacular: 他独自远离污泥浊水之中，像蝉脱壳一样摆脱浊秽，浮游在尘世之外，不受浊世的玷辱，保持皎洁的品质，出污泥而不染。
          - ancient: 推此志也，虽与日月争光可也。
            vernacular: 可以推断，屈原的志向，即使和日月争辉，也是可以的。
  - poem: 谏太宗十思疏
    type: 文言文必修
    author: 魏征
    created_at: 唐代
    paragraphs:
      - paragraph: 臣闻
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - ancient: 臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。
            vernacular: 我听说想要树木生长，一定要稳固它的根；想要泉水流得远，一定要疏通它的源泉；想要国家安定，一定要厚积道德仁义。
          - ancient: 源不深而岂望流之远，根不固而何求木之长。
            vernacular: 源泉不深却希望泉水流得远，根系不牢固却想要树木生长。
          - ancient: 德不厚而思国之治，臣虽下愚，知其不可，而况于明哲乎！
            vernacular: 道德不深厚却想要国家安定，我虽然地位低见识浅，（也）知道这是不可能的，更何况（您这）聪明睿智（的人）呢！
          - ancient: 人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。
            vernacular: 国君处于皇帝的重要位置，在天地间尊大，就要推崇皇权的高峻，永远保持政权的和平美好。
          - ancient: 不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。
            vernacular: 如果不在安逸的环境中想着危难，戒奢侈，行节俭，道德不能保持宽厚，性情不能克服欲望，这也（如同）挖断树根来求得树木茂盛，堵塞源泉而想要泉水流得远啊。
      - paragraph: 凡百
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - ancient: 凡百元首，承天景命，莫不殷忧而道著，功成而德衰。
            vernacular: （古代）所有的帝王，承受了上天赋予的重大使命，他们没有一个不为国家深切地忧虑而且治理成效显著的，但大功告成之后国君的品德就开始衰微了。
          - ancient: 有善始者实繁，能克终者盖寡，岂其取之易而守之难乎？
            vernacular: 国君开头做得好的确实很多，能够坚持到底的大概不多，难道是取得天下容易守住天下困难吗？
          - ancient: 昔取之而有余，今守之而不足，何也？
            vernacular: 过去夺取天下时力量有余，现在守卫天下却力量不足，这是为什么呢？
          - ancient: 夫在殷忧，必竭诚以待下，既得志则纵情以傲物。
            vernacular: 通常处在深重的忧虑之中一定能竭尽诚心来对待臣民，已经成功，就放纵自己的性情来傲视别人。
          - ancient: 竭诚则吴越为一体，傲物则骨肉为行路。
            vernacular: 竭尽诚心，虽然一在北方，一在南方，也能结成一家，傲视别人，就会使亲人成为陌路之人。
          - ancient: 虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。
            vernacular: 即使用严酷的刑罚来督责（人们），用威风怒气来吓唬（人们），（臣民）只求苟且免于刑罚而不怀念感激国君的仁德，表面上恭敬而在内心里却不服气。
          - ancient: 怨不在大，可畏惟人；载舟覆舟，所宜深慎。
            vernacular: （臣民）对国君的怨恨不在大小，可怕的只是百姓；（他们像水一样）能够负载船只，也能颠覆船只，这是应当深切谨慎的。
          - ancient: 奔车朽索，其可忽乎？
            vernacular: 疾驰的马车却用腐烂的绳索驾驭，怎么可以疏忽大意呢？
      - paragraph: 君人
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - ancient: 君人者，诚能见可欲则思知足以自戒，
            vernacular: 做国君的人，如果真的能够做到一见到能引起（自己）喜好的东西就要想到用知足来自我克制，
          - ancient: 将有所作则思知止以安人，
            vernacular: 将要兴建什么就要想到适可而止来使百姓安定，
          - ancient: 念高危则思谦冲而自牧，
            vernacular: 想到帝位高高在上就想到要谦虚并加强自我约束，
          - ancient: 惧满溢则思江海下百川，
            vernacular: 害怕骄傲自满就想到要像江海那样能够（处于）众多河流的下游，
          - ancient: 乐盘游则思三驱以为度，
            vernacular: 喜爱狩猎就想到网三面留一面，
          - ancient: 忧懈怠则思慎始而敬终，
            vernacular: 担心意志松懈就想到（做事）要慎始慎终，
          - ancient: 虑壅蔽则思虚心以纳下，
            vernacular: 担心（言路）不通受蒙蔽就想到虚心采纳臣下的意见，
          - ancient: 想谗邪则思正身以黜恶，
            vernacular: 考虑到（朝中可能会出现）谗佞奸邪就想到使自身端正（才能）罢黜奸邪，
          - ancient: 恩所加则思无因喜以谬赏，
            vernacular: 施加恩泽就要考虑到不要因为一时高兴而奖赏不当，
          - ancient: 罚所及则思无以怒而滥刑。
            vernacular: 动用刑罚就要想到不要因为一时发怒而滥用刑罚。
          - ancient: 总此十思，宏兹九德，简能而任之，择善而从之。
            vernacular: 全面做到这十件应该深思的事，弘扬这九种美德，选拔有才能的人而任用他，挑选好的意见而听从它。
          - ancient: 则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。
            vernacular: 那么有智慧的人就能充分献出他的谋略，勇敢的人就能完全使出他的力量，仁爱的人就能散播他的恩惠，诚信的人就能献出他的忠诚。
          - ancient: 文武争驰，君臣无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。
            vernacular: 文臣武将争先恐后前来效力，国君和大臣没有大事烦扰，可以尽情享受出游的快乐，可以颐养得像赤松子与王子乔那样长寿，皇上弹着琴垂衣拱手就能治理好天下，不用再说什么，天下人就已经都有教化了。
          - ancient: 何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！
            vernacular: 为什么一定要（自己）劳神费思，代替臣下管理职事，役使自己灵敏、明亮的耳、眼，减损顺其自然就能治理好天下的大道理呢！
  - poem: 师说
    type: 文言文必修
    author: 韩愈
    created_at: 唐代
    paragraphs:
      - paragraph: 古之
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - ancient: 古之学者必有师。
            vernacular: 古代求学的人一定有老师。
          - ancient: 师者，所以传道受业解惑也。
            vernacular: 老师，是可以依靠来传授道理、教授学业、解答疑难问题的。
          - ancient: 人非生而知之者，孰能无惑？
            vernacular: 人不是生下来就懂得道理的，谁能没有疑惑？
          - ancient: 惑而不从师，其为惑也，终不解矣。
            vernacular: 有了疑惑，如果不跟从老师学习，那些成为疑难问题的，就最终不能理解了。
          - ancient: 生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。
            vernacular: 生在我前面，他懂得道理本来就早于我，我应该跟从他把他当作老师；生在我后面，如果他懂得的道理也早于我，我也应该跟从他把他当作老师。
          - ancient: 吾师道也，夫庸知其年之先后生于吾乎？
            vernacular: 我是向他学习道理啊，哪管他的生年比我早还是比我晚呢？
          - ancient: 是故无贵无贱，无长无少，道之所存，师之所存也。
            vernacular: 因此，无论地位高低贵贱，无论年纪大小，道理存在的地方，就是老师存在的地方。
      - paragraph: 嗟乎
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - ancient: 嗟乎！师道之不传也久矣！
            vernacular: 唉，古代从师学习的风尚不流传已经很久了！
          - ancient: 欲人之无惑也难矣！
            vernacular: 想要人没有疑惑难啊！
          - ancient: 古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。
            vernacular: 古代的圣人，他们超出一般人很远，尚且跟从老师而请教；现在的一般人，他们的才智低于圣人很远，却以向老师学习为耻。
          - ancient: 是故圣益圣，愚益愚。
            vernacular: 因此圣人就更加圣明，愚人就更加愚昧。
          - ancient: 圣人之所以为圣，愚人之所以为愚，其皆出于此乎？
            vernacular: 圣人之所以能成为圣人，愚人之所以能成为愚人，大概都出于这吧？
          - ancient: 爱其子，择师而教之；于其身也，则耻师焉，惑矣。
            vernacular: 人们爱他们的孩子，就选择老师来教他，但是对于他自己呢，却以跟从老师学习为可耻，真是糊涂啊！
          - ancient: 彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。
            vernacular: 那些孩子们的老师，是教他们读书，帮助他们学习断句的，不是我所说的能传授那些道理，解答那些疑难问题的。
          - ancient: 句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。
            vernacular: 一方面不通晓句读，另一方面不能解决疑惑，不通晓文句的去向老师请教，有疑惑不能理解的却不向老师请教；小的方面倒要学习，大的方面反而放弃不学，我没看出那种人是明智的。
          - ancient: 巫医乐师百工之人，不耻相师。
            vernacular: 巫医乐师和各种工匠这些人，不以互相学习为耻。
          - ancient: 士大夫之族，曰师曰弟子云者，则群聚而笑之。
            vernacular: 士大夫这类人，听到称“老师”称“弟子”的，就成群聚在一起讥笑人家。
          - ancient: 问之，则曰：“彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。”
            vernacular: 问他们为什么讥笑，就说：“他和他年龄差不多，道德学问也差不多，以地位低的人为师，就觉得羞耻，以官职高的人为师，就近乎谄媚了。”
          - ancient: 呜呼！师道之不复可知矣。
            vernacular: 唉！古代那种跟从老师学习的风尚不能恢复，从这些话里就可以明白了。
          - ancient: 巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！
            vernacular: 巫医乐师和各种工匠这些人，君子们不屑一提，现在他们的见识竟反而赶不上这些人，真是令人奇怪啊！
      - paragraph: 圣人
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - ancient: 圣人无常师。
            vernacular: 圣人没有固定的老师。
          - ancient: 孔子师郯子、苌弘、师襄、老聃。
            vernacular: 孔子曾以郯子、苌弘、师襄、老聃为师。
          - ancient: 郯子之徒，其贤不及孔子。
            vernacular: 郯子这些人，他们的贤能都比不上孔子。
          - ancient: 孔子曰：“三人行，则必有我师”。
            vernacular: 孔子说：“几个人一起走，其中一定有可以当我的老师的人。”
          - ancient: 是故弟子不必不如师，师不必贤于弟子。
            vernacular: 因此学生不一定不如老师，老师不一定比学生贤能。
          - ancient: 闻道有先后，术业有专攻，如是而已。
            vernacular: 听到的道理有早有晚，学问技艺各有专长，如此罢了。
      - paragraph: 李氏
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - ancient: 李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。
            vernacular: 李家的孩子蟠，年龄十七，喜欢古文，六经的经文和传文都普遍地学习了，不受时俗的拘束，向我学习。
          - ancient: 余嘉其能行古道，作《师说》以贻之。
            vernacular: 我赞许他能够遵行古人从师的途径，写这篇《师说》来赠送他。
  - poem: 阿房宫赋
    type: 文言文必修
    author: 杜牧
    created_at: 战国后期
    paragraphs:
      - paragraph: 六王
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - ancient: 六王毕，四海一，蜀山兀，阿房出。
            vernacular: 六国统治结束，天下合而为一，蜀山砍伐一空，阿房得以建成。
          - ancient: 覆压三百余里，隔离天日。
            vernacular: 覆盖三百余里，遮天蔽日。
          - ancient: 骊山北构而西折，直走咸阳。
            vernacular: 从骊山向北构筑而后西折，直达咸阳。
          - ancient: 二川溶溶，流入宫墙。
            vernacular: 渭樊二川浩浩荡荡，流入宫墙。
          - ancient: 五步一楼，十步一阁。
            vernacular: 五步一楼，十步一阁。
          - ancient: 廊腰 màn 缦回，檐牙高啄。
            vernacular: 走廊如绸带回绕，飞檐像鸟嘴高啄。
          - ancient: 各抱地势，钩心斗角。
            vernacular: 各因地势制宜，钩连对凑相互配合。
          - ancient: 盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。
            vernacular: 盘绕着呀，回旋着呀，像密集的蜂房、激流的水涡，高高矗立，不知有几千万座。
          - ancient: 长桥卧波，未云何龙？
            vernacular: 骤见长桥卧于水波，没有云彩哪来的游龙？
          - ancient: 复道行空，不霁何虹？
            vernacular: 乍逢复道高架在天空，不曾雨晴哪来的彩虹？
          - ancient: 高低冥迷，不知西东。
            vernacular: 高低冥迷，不辨东西。
          - ancient: 歌台暖响，春光融融。
            vernacular: 台上歌声温柔，一派春光融融。
          - ancient: 舞殿冷袖，风雨凄凄。
            vernacular: 舞殿冷袖翻飞，一阵风雨凄凄。
          - ancient: 一日之内，一宫之间，而气候不齐。
            vernacular: 一日之内，一宫之间，而气候不同。
      - paragraph: 妃嫔
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - ancient: 妃pín嫔yìng媵qiáng嫱，王子皇孙，辞楼下殿，niǎn辇来于秦，朝歌夜弦，为秦宫人。
            vernacular: 六国的妃嫔媵嬙，王子皇孙，离开了故国的楼阁宫殿，乘车来到秦国，早上唱歌，晚上弹琴，成了秦国的宫人。
          - ancient: 明星荧荧，开妆镜也。
            vernacular: 明星荧荧，是她们打开了妆镜。
          - ancient: 绿云扰扰，梳晓鬟也。
            vernacular: 绿云扰扰，是她们早晨在梳理发鬟。
          - ancient: 渭流涨腻，弃脂水也。
            vernacular: 渭水泛起一层油腻，是她们泼下的洗脸水。
          - ancient: 烟斜雾横，焚椒兰也。
            vernacular: 烟雾弥漫，是她们在焚烧椒兰。
          - ancient: 雷霆乍惊，宫车过也。
            vernacular: 雷霆突然惊动，是宫车在经过。
          - ancient: 辘辘远听，杳不知其所之也。
            vernacular: 车轮声远去，杳杳然不知它去向何方。
          - ancient: 一肌一容，尽态极yán妍，缦立远视，而望幸焉。
            vernacular: 卖弄姿容，尽态极妍，伫立遥望，盼望皇帝的幸临。
          - ancient: 有不见者，三十六年。
            vernacular: 有人未睹天颜，长达三十六年。
      - paragraph: 燕赵
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - ancient: 燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，piāo剽掠其人，倚叠如山。
            vernacular: 燕赵收藏的奇珍，韩魏经营的宝物，齐楚保存的重器，多少代多少年，掠夺自民间，堆积如山。
          - ancient: 一旦不能有，输来其间。
            vernacular: 一旦国破家亡，都给运到此间。
          - ancient: 鼎chēng铛玉石，金块珠砾，弃掷lǐ逦yǐ迤，秦人视之，亦不甚惜。
            vernacular: 视鼎如铛，视玉如石，挥金如土，以珠作砾，四处拋掷，秦人见了，也不怎样爱惜。
      - paragraph: 嗟乎
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - ancient: 嗟乎！一人之心，千万人之心也。
            vernacular: 哎呀！一个人的心，也就是千万人的心。
          - ancient: 秦爱纷奢，人亦念其家。
            vernacular: 秦人喜欢奢侈，六国人也眷念故家。
          - ancient: 奈何取之尽zī锱zhū铢，用之如泥沙？
            vernacular: 为什么掠夺时一丁点儿也不放过，用起来却当成泥沙？
          - ancient: 使负栋之柱，多于南亩之农夫。
            vernacular: 使负荷大梁的柱子，比地里耕田的农夫还多。
          - ancient: 架梁之椽，多于机上之工女。
            vernacular: 架在屋梁上的椽子，比机杼旁的织女还多。
          - ancient: 钉头磷磷，多于在 yǔ 庾之粟粒。
            vernacular: 显眼的钉头，比粮仓里的谷粒还多。
          - ancient: 瓦缝参差，多于周身之帛缕。
            vernacular: 参差的瓦缝，比人们身上穿的丝缕还多。
          - ancient: 直栏横jiàn槛，多于九土之城郭。
            vernacular: 纵横的栏杆，比九州的城郭还多。
          - ancient: 管弦ōu呕yā哑，多于市人之言语。
            vernacular: 呕哑的乐声，比市上人们的语声还要嘈杂。
          - ancient: 使天下之人，不敢言而敢怒。
            vernacular: 使天下的人，敢怒而不敢言。
          - ancient: 独夫之心，日益骄固。
            vernacular: 而独夫的心，日益骄傲而顽固。
          - ancient: 戍卒叫，函谷举，楚人一炬，可怜焦土！
            vernacular: 陈胜、吴广振臂一呼，刘邦一举攻占函谷；楚人项羽放了一把火，可怜阿房宫成了焦土。
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - ancient: 呜呼！灭六国者，六国也，非秦也。
            vernacular: 哎呀！灭掉六国的，正是六国，而不是秦国。
          - ancient: 族秦者，秦也，非天下也。
            vernacular: 族灭秦国的，正是秦国，而不是天下的人。
          - ancient: 嗟乎！使六国各爱其人，则足以拒秦。
            vernacular: 哎呀！假使六国君主各自爱护他们自己的人民，就足以抵抗秦国的入侵。
          - ancient: 使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？
            vernacular: 假使秦国也能爱护六国的人民，就可以传位三世，乃至万世而为君，谁又能族灭它呢？
          - ancient: 秦人不暇自哀，而后人哀之。
            vernacular: 秦人无暇自哀，而使后人哀怜之。
          - ancient: 后人哀之而不鉴之，亦使后人而复哀后人也。
            vernacular: 后人哀怜之而又不引以为借鉴的话，那就会使他们的后人又来哀怜他们啊！
  - poem: 六国论
    type: 文言文必修
    author: 苏洵
    created_at: 战国后期
    paragraphs:
      - paragraph: 六国
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - ancient: 六国破灭，非兵不利 ，战不善，弊在赂秦。
            vernacular: 六国灭亡，不是武器不锐利，仗打得不好，弊病在于割地贿赂秦国。
          - ancient: 赂秦而力亏，破灭之道也。
            vernacular: 割地贿赂秦国，自己的力量就亏损了，这是灭亡的原因。
          - ancient: 或曰：六国互丧，率赂秦耶？
            vernacular: 有人说：六国相继灭亡，全都是由于割地贿赂秦国吗？
          - ancient: 曰：不赂者以赂者丧，盖失强援，不能独完。
            vernacular: 回答说：不割地贿赂秦国的国家因为割地贿赂秦国的国家而灭亡，因为他们失去了强有力的外援，不能单独保全。
          - ancient: 故曰：弊在赂秦也。
            vernacular: 所以说：弊病在于割地贿赂秦国啊！
      - paragraph: 秦以
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - ancient: 秦以攻取之外，小则获邑，大则得城。
            vernacular: 秦国除用攻战的方法取得土地之外（还得到诸侯的割地贿赂），小的就获得城镇，大的就获得都市。
          - ancient: 较秦之所得，与战胜而得者，其实百倍；
            vernacular: 把秦国由受贿赂得到的土地与战胜而得到的土地比较，实际上有一百倍，
          - ancient: 诸侯之所亡，与战败而亡者，其实亦百倍。
            vernacular: 把诸侯贿赂秦国所失去的土地与战败所失去的土地比较，实际上也有一百倍。
          - ancient: 则秦之所大欲，诸侯之所大患，固不在战矣。
            vernacular: 那么秦国最大的欲望，诸侯最大的祸患，当然就不在于战争了。
          - ancient: 思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。
            vernacular: 回想他们的祖辈父辈，冒着霜露，披荆斩棘，因而才有一点点土地。
          - ancient: 子孙视之不甚惜，举以予人，如弃草芥。
            vernacular: 可是子孙们看待它却很不珍惜，拿它来送人，就像抛弃小草一样。
          - ancient: 今日割五城，明日割十城，然后得一夕安寝。
            vernacular: 今天割去五座城，明天割去十座城，然后才能睡上一夜安稳觉。
          - ancient: 起视四境，而秦兵又至矣。
            vernacular: 待起床一看四周边境，秦国的军队又打来了。
          - ancient: 然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。
            vernacular: 那么，诸侯的土地有限，暴秦的欲望没有满足；谁送给它土地越多，它侵犯谁就越急。
          - ancient: 故不战而强弱胜负已判矣。
            vernacular: 所以不用打仗，谁强谁弱、谁胜谁败就已分得清清楚楚了。
          - ancient: 至于颠覆，理固宜然。
            vernacular: 六国落到灭亡的地步，按理本来应当这样。
          - ancient: 古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”
            vernacular: 古人说：“用土地侍奉秦国，就像抱着柴草救火，柴草没有烧完，火就不会熄灭。”
          - ancient: 此言得之。
            vernacular: 这话说得在理啊！
      - paragraph: 齐人
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - ancient: 齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。
            vernacular: 齐国不曾割地贿赂秦国，最后也随着五国灭亡，为什么呢？这是因为它跟秦国交好而不帮助五国啊。
          - ancient: 五国既丧，齐亦不免矣。
            vernacular: 五国灭亡之后，齐国也就不能幸免了。
          - ancient: 燕赵之君，始有远略，能守其土，义不赂秦。
            vernacular: 燕国和赵国的君主，起初有远大的谋略，能够守住自己的土地，坚持正义不贿赂秦国。
          - ancient: 是故燕虽小国而后亡，斯用兵之效也。
            vernacular: 因此燕国虽然是个小国，却灭亡在后，这是用兵抵抗的效果啊。
          - ancient: 至丹以荆卿为计，始速祸焉。
            vernacular: 到了燕太子丹用派遣荆轲刺杀秦王作为对付秦国的策略，才招致灭亡的祸患。
          - ancient: 赵尝五战于秦，二败而三胜。
            vernacular: 赵国曾经与秦国多次作战，败少胜多。
          - ancient: 后秦击赵者再，李牧连却之。
            vernacular: 后来秦国又两次攻打赵国，李牧接连打退了它。
          - ancient: 洎牧以谗诛，邯郸为郡，惜其用武而不终也。
            vernacular: 等到李牧因受谗言被赵王杀害，都城邯郸就变成秦国的一个郡，可惜它用兵抵抗却没能坚持到底啊。
          - ancient: 且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。
            vernacular: 况且燕赵正处在其他国家被消灭了的时候，可说是智谋已尽，力量单薄，战败而亡国，实在是没有办法的事啊。
          - ancient: 向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。
            vernacular: 假使当初韩、魏、楚三国都各自珍惜自己的土地，齐国不依附秦国，燕国的刺客不去秦国，赵国的良将李牧还活着，那么胜败存亡的命运，如果与秦国较量，也许还不容易估量呢。
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - ancient: 呜呼！以赂秦之地，封天下之谋臣，以事秦之心，礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。
            vernacular: 唉！如果六国把贿赂秦国的土地封赏给天下的谋臣，用侍奉秦国的心意礼遇天下非凡的人才，齐心协力向西对付秦国，那么我担心秦国人连饭也咽不下喉呢。
          - ancient: 悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。
            vernacular: 可悲啊！有这样的形势，却被秦国积久的威势所胁制，土地天天削减，月月割让，以至于走向灭亡。
          - ancient: 为国者无使为积威之所劫哉！
            vernacular: 治理国家的人切不要让自己被敌人积久的威势所胁制啊！
      - paragraph: 夫六
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - ancient: 夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。
            vernacular: 六国和秦国都是诸侯，他们的势力比秦国弱，可是还有能够不割地贿赂而战胜秦国的形势。
          - ancient: 苟以天下之大，下而从六国破亡之故事，是又在六国下矣。
            vernacular: 如果凭着一统天下的大国，却自取下策反而重蹈六国灭亡的覆辙，这就又在六国之下了！
  - poem: 答司马谏议书
    type: 文言文必修
    author: 王安石
    created_at: 战国后期
    paragraphs:
      - paragraph: 某启
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - ancient: 某启：
            vernacular: 鄙人王安石请启：
          - ancient: 昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。
            vernacular: 昨天承蒙（您来信）指教，我私下认为与君实您交往相好的日子很久了，但是议论起政事来（意见）常常不一致，（这是因为我们）所持的政治主张和方法大多不同。
          - ancient: 虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。
            vernacular: 虽然想要（向您）硬啰嗦几句，（但）终究一定（是）不能蒙受（您）考虑（我的意见），所以（我）只是简单地给您写了封回信，不再一一为自己辩解了。
          - ancient: 重念蒙君实视遇厚，于反复不宜卤莽，故今具道所以，冀君实或见恕也。
            vernacular: 再三考虑君实对我的重视厚遇，在书信往来上不应该粗疏草率，所以现在详细地说出我这样做的理由，希望您或许能够宽恕我吧。
      - paragraph: 盖儒
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - ancient: 盖儒者所争，尤在于名实。
            vernacular: 有学问的读书人所争论的问题，特别注重于名义和实际（是否相符）。
          - ancient: 名实已明，而天下之理得矣。
            vernacular: 如果名义和实际的关系已经明确了，那么天下的大道理也就清晰了。
          - ancient: 今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。
            vernacular: 现在君实您用来指教我的，是认为我（推行新法）侵夺了官吏们的职权，制造了事端，争夺了百姓的财利，拒绝接受不同的意见，因而招致天下人的怨恨和诽谤。
          - ancient: 某则以谓：受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；
            vernacular: 我却认为从皇帝那里接受命令，议订法令制度，又在朝廷上修正（决定），把它交给负有专责的官吏（去执行），（这）不能算是侵夺官权；
          - ancient: 举先王之政，以兴利除弊，不为生事；
            vernacular: 实行古代贤明君主的政策，用它来兴办（对天下）有利的事业、消除（种种）弊病，（这）不能算是制造事端；
          - ancient: 为天下理财，不为征利；辟邪说，难壬人，不为拒谏。
            vernacular: 为天下治理整顿财政，（这）不能算是（与百姓）争夺财利；抨击不正确的言论，驳斥巧辩的坏人，（这）不能算是拒绝接受（他人的）规劝。
          - ancient: 至于怨诽之多，则固前知其如此也。
            vernacular: 至于（社会上对我的）那么多怨恨和诽谤，那是我本来早就料到它会这样的。
      - paragraph: 人习
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - ancient: 人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，
            vernacular: 人们习惯于苟且偷安、得过且过（已）不是一天（的事）了。士大夫们多数把不顾国家大事、附和世俗（的见解），向众人献媚讨好当做好事，
          - ancient: 上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？
            vernacular: （因而）皇上才要改变这种（不良）风气，那么我不去估量反对者的多少，想拿出（自己的）力量帮助皇上来抵制这股势力，（这样一来）那么那些人又为什么不（对我）大吵大闹呢？
          - ancient: 盘庚之迁，胥怨者民也，非特朝廷士大夫而已。
            vernacular: 盘庚迁都（的时候），连老百姓都抱怨啊，（并）不只是朝廷上的士大夫（加以反对）；
          - ancient: 盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。
            vernacular: 盘庚不因为有人怨恨的缘故就改变自己的计划；（这是他）考虑到（迁都）合理，然后坚决行动；认为对（就）看不出有什么可以后悔的缘故啊。
          - ancient: 如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；
            vernacular: 如果君实您责备我是因为（我）在位任职很久，没能帮助皇上干一番大事业，使这些老百姓得到好处，那么我承认（自己是）有罪的；
          - ancient: 如曰今日当一切不事事，守前所为而已，则非某之所敢知。
            vernacular: 如果说现在应该什么事都不去做，墨守前人的陈规旧法就是了，那就不是我敢领教的了。
      - paragraph: 无由
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - ancient: 无由会晤，不任区区向往之至。
            vernacular: 没有机会（与您）见面，内心实在仰慕到极点。
  - poem: 赤壁赋
    type: 文言文必修
    author: 苏轼
    created_at: 战国后期
    paragraphs:
      - paragraph: 壬戌
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。
            vernacular: 壬戌年秋天，七月十六日，我与友人在赤壁下泛舟游玩。
          - ancient: 清风徐来，水波不兴。
            vernacular: 清风阵阵拂来，水面波澜不起。
          - ancient: 举酒属客，诵明月之诗，歌窈窕之章。
            vernacular: 举起酒杯向同伴劝酒，吟诵《明月》中“窈窕”这一章。
          - ancient: 少焉，月出于东山之上，徘徊于斗牛之间。
            vernacular: 不一会儿，明月从东山后升起，在斗宿与牛宿之间缓步徐行。
          - ancient: 白露横江，水光接天。
            vernacular: 白茫茫的雾气横贯江面，水光连着天际。
          - ancient: 纵一苇之所如，凌万顷之茫然。
            vernacular: 放纵一片苇叶似的小船随意漂浮，越过茫茫的江面。
          - ancient: 浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。
            vernacular: 浩浩淼淼好像乘风凌空而行，并不知道到哪里才会停栖，飘飘摇摇好像要离开尘世飘飞而起，羽化成仙进入仙境。
      - paragraph: 于是
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 于是饮酒乐甚，扣舷而歌之。
            vernacular: 在这时喝酒喝得非常高兴，敲着船边唱起歌来。
          - ancient: 歌曰：“桂棹兮兰桨，击空明兮溯流光。
            vernacular: 歌中唱道：“桂木船棹啊香兰船桨，击打着月光下的清波，在泛着月光的水面逆流而上。
          - ancient: 渺渺兮予怀，望美人兮天一方。
            vernacular: 我的情思啊悠远茫茫，思念心中的美人啊 [14]  ，却在天的另一方。”
          - ancient: 有吹洞箫者，倚歌而和之。
            vernacular: 有会吹洞箫的客人，配着节奏为歌声伴和，
          - ancient: 其声呜呜然，如怨如慕，如泣如诉；余音袅袅，不绝如缕。
            vernacular: 洞箫的声音呜呜咽咽：有如哀怨有如思慕，既像啜泣也像倾诉，余音在江上回荡，像细丝一样连续不断。
          - ancient: 舞幽壑之潜蛟，泣孤舟之嫠妇。
            vernacular: 能使深谷中的蛟龙为之起舞，能使孤舟上的寡妇为之饮泣。
      - paragraph: 苏子愀
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 苏子愀然，正襟危坐，而问客曰：“何为其然也？”
            vernacular: 我的神色也愁惨起来，整好衣襟坐端正，向客人问道：“箫声为什么这样哀怨呢？”
      - paragraph: 客曰
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 客曰：“‘月明星稀，乌鹊南飞。’
            vernacular: 客人回答：“‘月明星稀，乌鹊南飞’，
          - ancient: 此非曹孟德之诗乎？
            vernacular: 这不是曹公孟德的诗么？
          - ancient: 西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？
            vernacular: 这里向西可以望到夏口，向东可以望到武昌，山河接壤连绵不绝，目力所及，一片郁郁苍苍。这不正是曹孟德被周瑜所围困的地方么？
          - ancient: 方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？
            vernacular: 当初他攻陷荆州，夺得江陵，沿长江顺流东下，麾下的战船首尾相连延绵千里，旗子将天空全都蔽住，面对大江斟酒，横执长矛吟诗，本来是当世的一位英雄人物，然而现在又在哪里呢？
          - ancient: 况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏尊（樽）以相属。
            vernacular: 何况我与你在江中的小洲打渔砍柴，以鱼虾为侣，以麋鹿为友，在江上驾着这一叶小舟，举起杯盏相互敬酒，
          - ancient: 寄蜉蝣于天地，渺沧海之一粟。
            vernacular: 如同蜉蝣置身于广阔的天地中，像沧海中的一粒粟米那样渺小。
          - ancient: 哀吾生之须臾，羡长江之无穷。
            vernacular: 唉，哀叹我们的一生只是短暂的片刻，不由羡慕长江的没有穷尽。
          - ancient: 挟飞仙以遨游，抱明月而长终。
            vernacular: 想要携同仙人携手遨游各地，与明月相拥而永存世间。
          - ancient: 知不可乎骤得，托遗响于悲风。”
            vernacular: 知道这些终究不能实现，只得将憾恨化为箫音，托寄在悲凉的秋风中罢了。”
      - paragraph: 苏子曰
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。
            vernacular: 我问道：“你可也知道这水与月？时间流逝就像这水，其实并没有真正逝去；时圆时缺的就像这月，终究没有增减。
          - ancient: 盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！
            vernacular: 可见，从事物易变的一面看来，那么天地间万事万物时刻在变动，连一眨眼的工夫都不停止；而从事物不变的一面看来，万物同我们来说都是永恒的，又有什么可羡慕的呢？
          - ancient: 且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。
            vernacular: 何况天地之间，万物各有主宰者，若不是自己应该拥有的，即使一分一毫也不能求取。
          - ancient: 惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。
            vernacular: 只有江上的清风，以及山间的明月，听到便成了声音，进入眼帘便绘出形色，取得这些不会有人禁止，感受这些也不会有竭尽的忧虑。
          - ancient: 是造物者之无尽藏也，而吾与子之所共适。”
            vernacular: 这是大自然恩赐的没有穷尽的宝藏，我和你可以共同享受。”
      - paragraph: 客喜
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - ancient: 客喜而笑，洗盏更酌。
            vernacular: 客人高兴地笑了，洗净酒杯重新斟酒。
          - ancient: 肴核既尽，杯盘狼籍。
            vernacular: 菜肴果品都已吃完，杯子盘子杂乱一片。
          - ancient: 相与枕藉乎舟中，不知东方之既白。
            vernacular: 大家互相枕着垫着睡在船上，不知不觉东方已经露出白色的曙光。
  - poem: 项脊轩志
    type: 文言文必修
    author: 归有光
    created_at: 战国后期
    paragraphs:
      - paragraph: 项脊轩
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 项脊轩，旧南阁子也。室仅方丈，可容一人居。
            vernacular: 项脊轩，就是原来的南阁子。室内只有一丈见方，可以容纳一个人居住。
          - ancient: 百年老屋，尘泥渗漉，雨泽下注；每移案，顾视，无可置者。
            vernacular: 百年老屋，灰尘泥土不断渗滴出水来，雨水也往下流，每每挪移桌子，环顾四周，没有地方可以安置。
          - ancient: 又北向，不能得日，日过午已昏。
            vernacular: 项脊轩坐南朝北，照不到太阳，每天一过中午屋里就很昏暗。
          - ancient: 余稍为修葺，使不上漏。
            vernacular: 我稍稍修补了一下，使上面不再掉土漏水，
          - ancient: 前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。
            vernacular: 前面开了四个窗子，环绕庭院盖起围墙，用北墙来挡南面的阳光，阳光照在墙上，反射进屋里，屋里才亮堂了。
          - ancient: 又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。
            vernacular: 又在院里种了兰花、桂花、竹子和其他树木，旧时的栏杆，也就增加了光彩。
          - ancient: 借书满架，偃仰啸歌，冥然兀坐，万籁有声；
            vernacular: 借来的书堆满书架，时卧时起，长啸高歌，或者静静地端坐，种种声音都能听到。
          - ancient: 而庭阶寂寂，小鸟时来啄食，人至不去。
            vernacular: 庭院的台阶上静悄悄的，小鸟时时来啄食，人过去都不飞走。
          - ancient: 三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。
            vernacular: 每月十五的夜里，明亮的月光洒满半面墙壁，桂花的影子杂乱地映在墙上，风一吹，影子也跟着摇曳，袅袅婷婷，十分可爱。
      - paragraph: 然余
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 然余居于此，多可喜，亦多可悲。
            vernacular: 但是我住在这里，有很多可喜的事情，也有很多可悲的事情。
          - ancient: 先是庭中通南北为一。
            vernacular: 这以前，庭院南北相通，连成一个大院。
          - ancient: 迨诸父异爨，内外多置小门墙，往往而是。
            vernacular: 等到叔伯们分家以后，里里外外建了许多小门墙，到处都是。
          - ancient: 东犬西吠，客逾庖而宴，鸡栖于厅。
            vernacular: 东家的狗跑到西家叫，客人得越过厨房去赴宴，鸡蹲在大厅上。
          - ancient: 庭中始为篱，已为墙，凡再变矣。
            vernacular: 院子里开始是筑起篱笆，后来修了围墙，变了两次。
          - ancient: 家有老妪，尝居于此。
            vernacular: 家里有一个老婆婆，曾经住在这座轩里。
          - ancient: 妪，先大母婢也，乳二世，先妣抚之甚厚。
            vernacular: 这个老婆婆，是已故的祖母的婢女，做过两代人的乳母，已故的母亲待她很好。
          - ancient: 室西连于中闺，先妣尝一至。
            vernacular: 轩西面连着内室，先母曾经来过一次。
          - ancient: 妪每谓余曰：“某所，而母立于兹。”
            vernacular: 老婆婆不止一次对我说：“这里，就是你母亲站的地方。”
          - ancient: 妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”
            vernacular: 她又说：“你姐姐在我怀里，哇哇地哭起来，你母亲就用手指敲敲门说：‘孩子是不是冷了？是不是想吃东西了？’我在门板外和她互相应答……”
          - ancient: 语未毕，余泣，妪亦泣。
            vernacular: 话还没说完，我就哭起来，老婆婆也跟着哭了。
          - ancient: 余自束发，读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”
            vernacular: 我从十五岁起在轩中读书。一天，祖母走来对我说：“孩子，好久不见你的踪影，怎么整天静悄悄地呆在这里，像个闺女一样？”
          - ancient: 比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”
            vernacular: 等到离开时，她用手关上门，自言自语地说：“我们家的人读书老不见成效，这个孩子的功成名就，总可以期待了吧？”
          - ancient: 顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”
            vernacular: 过了一会儿，她拿着一个象牙手板进来，说：“这是我的祖父太常公在宣德年间拿着上朝用的，以后你一定会用到它。”
          - ancient: 瞻顾遗迹，如在昨日，令人长号不自禁。
            vernacular: 回忆旧日这些事物，就好像在昨天一样，令人忍不住要放声大哭。
      - paragraph: 轩东
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 轩东，故尝为厨，人往，从轩前过。
            vernacular: 轩的东面，过去曾经做过厨房，人们到那里去，就要从轩前过。
          - ancient: 余扃牖而居，久之，能以足音辨人。
            vernacular: 我关着窗子住在里面，久而久之，能通过脚步声分辨是谁。
          - ancient: 轩凡四遭火，得不焚，殆有神护者。
            vernacular: 这座轩曾遭过四次火灾，能够不被烧掉，大概是有神灵在保佑吧。
      - paragraph: 项脊生
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 项脊生曰：“蜀清守丹穴，利甲天下，其后秦皇帝筑女怀清台；
            vernacular: 我认为：巴蜀寡妇名叫清的，守着丹砂矿井，得到的好处为天下第一，后来秦始皇为表彰她而筑了女怀清台；
          - ancient: 刘玄德与曹操争天下，诸葛孔明起陇中。
            vernacular: 刘备和曹操争夺天下，诸葛孔明从隆中出山建功立业。
          - ancient: 方二人之昧昧于一隅也，世何足以知之，余区区处败屋中，方扬眉、瞬目，谓有奇景。
            vernacular: 当这两个人无声无息地住在偏僻的地方时，世人哪里能知道他们？我住在这小小的破屋中，当我扬眉眨眼时，认为这破屋中自有不平凡的事物。
          - ancient: 人知之者，其谓与坎井之蛙何异？”
            vernacular: 知道的人，是不是要说我跟浅薄的浅井之蛙没什么不同？
      - paragraph: 余既
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。
            vernacular: 我写了这篇记之后，过了五年，我妻子嫁了过来。她时常来到轩中，向我问问古代的事情，或者靠着几案学写字。
          - ancient: 吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”
            vernacular: 她回娘家去，回来以后转述几个小妹妹的话说：“听说姐姐家有个阁子，那什么叫阁子呢？”
          - ancient: 其后六年，吾妻死，室坏不修。
            vernacular: 过了六年，我妻子去世了，房屋坏了也没有修理。
          - ancient: 其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。
            vernacular: 又过了两年，我长时间生病，没有依靠，于是使人又修整了南阁子，它的形式和以前稍稍有些不同。
          - ancient: 然自后余多在外，不常居。
            vernacular: 但从此以后我常年在外，不常住在那里了。
      - paragraph: 庭有
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - ancient: 庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。
            vernacular: 庭院里有一株枇杷树，是我妻子去世那年她亲手种的，现在已经长得挺拔高大，枝繁叶茂像伞一样了。
  - poem: 子路、曾晳、冉有、公西华侍坐 《论语》
    type: 文言文选必
    author: 春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子的言行
    created_at: 战国前期
    paragraphs:
      - paragraph: 子路侍坐
        url: https://baike.baidu.com/item/%E5%AD%90%E8%B7%AF%E3%80%81%E6%9B%BE%E7%9A%99%E3%80%81%E5%86%89%E6%9C%89%E3%80%81%E5%85%AC%E8%A5%BF%E5%8D%8E%E4%BE%8D%E5%9D%90/5456498
        sentences:
          - ancient: 子路、曾皙xī、冉rǎn有、公西华侍坐。
            vernacular: 子路、曾皙、冉有、公西华四人在孔子近旁陪坐。
          - ancient: 子曰：“以吾一日长zhǎng乎尔，毋吾以也。
            vernacular: 孔子说：“因为我年纪比你们大一点，你们不要凭这个原因就不敢说话了。
          - ancient: 居则曰：‘不吾知也。’如或知尔，则何以哉？”
            vernacular: 你们平日说：‘（别人）不了解我 ！’假如有人了解你们， 那么（你们）打算怎么做呢？”
          - ancient: 子路率尔而对曰：“千乘shèng之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比bì及三年，可使有勇，且知方也。”
            vernacular: 子路急遽而不加考虑地回答说：“一个拥有一千辆兵车的中等诸侯国，夹在几个大国之间，加上有军队来攻打它，接下来又有饥荒；如果让我治理这个国家，等到三年后，就可以使人有保卫国家的勇气， 而且还懂得合乎礼义的行事准则。”
          - ancient: 夫子哂shěn之。
            vernacular: 孔子对着他微微一笑。
          - ancient: “求，尔何如？”
            vernacular: “冉有，你怎么样？”
          - ancient: 对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟sì君子。”
            vernacular: 冉有回答说：“ 一个纵横六七十里或者五六十里的国家，如果让我去治理，等到三年后，就可以使老百姓富足起来。至于礼乐教化，自己的能力是不够的，那就得等待君子来推行了。"
          - ancient: “赤，尔何如？”
            vernacular: “公西华 ，你怎么样？”
          - ancient: 对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。”
            vernacular: 公西华回答说：“我不敢说我能胜任，但愿意在这方面学习。宗庙祭祀的工作，或者是诸侯会盟及朝见 天子的时候 ，我愿意穿着礼服， 戴着礼帽，做一个小司仪。”
          - ancient: “点，尔何如？”
            vernacular: “曾皙，你怎么样？”
          - ancient: 鼓瑟希，铿kēng尔，舍瑟而作，对曰：“异乎三子者之撰(zhuàn)。”
            vernacular: 曾皙弹瑟的声音渐渐稀疏下来，铿的一声，放下瑟站起身来 ，回答说： “我和他们三人的志向不一样。"
          - ancient: 子曰：“何伤乎？亦各言其志也！”
            vernacular: 孔子说："那有什么关系呢 ？也不过是各自谈自己的志向罢了。”
          - ancient: 曰：“莫mù春者，春服既成，冠者五六人，童子六七人，浴乎沂yí，风乎舞雩yú，咏而归。”
            vernacular: 曾皙回答说:“暮春时节，春天的衣服已经穿定了，（我和）五六个成年人，六七名少年，在沂水游泳后，在舞雩台上吹吹风，唱着歌回家。”
          - ancient: 夫子喟kuì然叹曰：“吾与点也。”
            vernacular: 孔子长叹一声说 ：“我赞同曾皙啊。”
          - ancient: 三子者出，曾皙后。
            vernacular: 子路、冉有、公西华都出去了，曾皙最后走。
          - ancient: 曾皙曰：“夫三子者之言何如？”
            vernacular: 曾皙问孔子：“他们三位的话怎么样？”
          - ancient: 子曰：“亦各言其志也已矣！”
            vernacular: 孔子说：“也不过是各自谈谈自己的志向罢了！”
          - ancient: 曰：“夫子何哂由也？”
            vernacular: 曾皙说：“您为什么笑子路呢？”
          - ancient: 曰：“为国以礼，其言不让，是故哂之。”
            vernacular: 孔子说：“治国要用礼，可是他（子路）的话毫不谦让，所以我笑他。”
          - ancient: “唯求则非邦也与？”
            vernacular: “难道冉有讲的不是国家大事吗？”
          - ancient: “安见方六七十，如五六十而非邦也者？”
            vernacular: “怎么见得纵横六七十里或五六十里的地方的事就不是国家大事呢？”
          - ancient: “唯赤则非邦也与？”
            vernacular: “难道公西华所讲的不是国家大事吗？”
          - ancient: “宗庙会同，非诸侯而何？赤也为之小，孰能为之大？”
            vernacular: “宗庙祭祀、诸侯会盟和朝见天子，不是诸侯的大事又是什么呢？如果公西华只能给诸侯做一个小相，那么谁又能给诸侯做大相呢？”
  - poem: 报任安书
    type: 文言文选必
    author: 司马迁
    created_at: 西汉
    paragraphs:
      - paragraph: 太史
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - ancient: 太史公牛马走司马迁，再拜言，少卿足下：
            vernacular: 像牛马一样替人奔走的仆役太史公司马迁，恭敬地拜两次并回复您的书信，少卿足下：
          - ancient: 曩者辱赐书，教以慎于接物，推贤进士为务，意气勤勤恳恳。
            vernacular: 前不久承蒙您给我写信，用谨慎地待人接物教导我，以推举贤能、引荐人才为己任，情意、态度十分恳切诚挚，
          - ancient: 若望仆不相师，而用流俗人之言，仆非敢如此也。
            vernacular: 好像抱怨我没有遵从您的教诲，而是追随了世俗之人的意见，我是不敢这样做的。
          - ancient: 仆虽罢驽，亦尝侧闻长者之遗风矣。
            vernacular: 我虽然平庸无能，但也曾听到过德高才俊的前辈遗留下来的风尚。
          - ancient: 顾自以为身残处秽，动而见尤，欲益反损，是以独郁悒而无谁语。
            vernacular: 只是我自认为身体已遭受摧残，又处于污浊的环境之中，每有行动便受到指责，想对事情有所增益，结果反而自己遭到损害，因此我独自忧闷而不能向人诉说。
          - ancient: 谚曰：“谁为为之？孰令听之？”
            vernacular: 俗话说：“为谁去做，教谁来听？”
          - ancient: 盖钟子期死，伯牙终身不复鼓琴。
            vernacular: 钟子期死了，伯牙便一辈子不再弹琴。
          - ancient: 何则？士为知己者用，女为悦己者容。
            vernacular: 这是为什么呢？贤士乐于被了解自己的人所用，女子为喜爱自己的人而打扮。
          - ancient: 若仆大质已亏缺矣，虽材怀随和，行若由夷，终不可以为荣，适足以见笑而自点耳。
            vernacular: 像我这样的人，身躯已经亏残，虽然才能像随侯珠、和氏璧那样稀有，品行像许由、伯夷那样高尚，终究不能用这些来引以为荣，恰好会引人耻笑而自取污辱。
          - ancient: 书辞宜答，会东从上来，又迫贱事，相见日浅，卒卒无须臾之间，得竭指意。
            vernacular: 来信本应及时答复，刚巧我侍从皇上东巡回来，后又为烦琐之事所逼迫，同您见面的日子很少，我又匆匆忙忙地没有些微空闲来详尽地表达心意。
          - ancient: 今少卿抱不测之罪，涉旬月，迫季冬，仆又薄从上雍，恐卒然不可为讳，是仆终已不得舒愤懑以晓左右，则长逝者魂魄私恨无穷。
            vernacular: 现在您蒙受意想不到的罪祸，再过一月，临近十二月，我侍从皇上到雍县去的日期也迫近了，恐怕突然之间您就会有不幸之事发生，因而使我终生不能向您抒发胸中的愤懑，那么与世长辞的灵魂会永远留下无穷的遗怨。
          - ancient: 请略陈固陋。
            vernacular: 请让我向您略约陈述浅陋的意见。
          - ancient: 阙然久不报，幸勿为过。
            vernacular: 隔了很长的日子没有复信给您，希望您不要责怪。
      - paragraph: 仆闻
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - ancient: 仆闻之：修身者，智之符也；
            vernacular: 我听到过这样的说法：一个人如何修身，是判断他智慧的凭证；
          - ancient: 爱施者，仁之端也；
            vernacular: 一个人是否乐善好施，是评判他仁义的起点；
          - ancient: 取予者，义之表也；
            vernacular: 一个人如何取舍，是体会他道义的标志；
          - ancient: 耻辱者，勇之决也；
            vernacular: 一个人如何面对耻辱，是断定他是否勇敢的准则；
          - ancient: 立名者，行之极也。
            vernacular: 一个人建立了怎样的名声，是他品行的终极目标。
          - ancient: 士有此五者，然后可以托于世，列于君子之林矣。
            vernacular: 志士有这五种品德，然后就可以立足于社会，排在君子的行列中了。
          - ancient: 故祸莫憯于欲利，悲莫痛于伤心，行莫丑于辱先，诟莫大于宫刑。
            vernacular: 所以，祸患没有比贪利更悲惨的了，悲哀没有比心灵受创更痛苦的了，行为没有比污辱祖先更丑恶的了，耻辱没有比遭受宫刑更重大的了。
          - ancient: 刑余之人，无所比数，非一世也，所从来远矣。
            vernacular: 受过宫刑的人，社会地位是没法比类的，这并非当今之世如此，这可追溯到很远的时候。
          - ancient: 昔卫灵公与雍渠同载，孔子适陈；
            vernacular: 从前卫灵公与宦官雍渠同坐一辆车子，孔子感到羞耻，便离开卫国到陈国去，
          - ancient: 商鞅因景监见，赵良寒心；
            vernacular: 商鞅靠了宠臣景监的推荐而被秦孝公召见，贤士赵良为此寒心；
          - ancient: 同子参乘，袁丝变色：自古而耻之！
            vernacular: 太监赵同子陪坐在汉文帝的车上，袁丝为之脸色大变。自古以来，人们对宦官都是鄙视的。
          - ancient: 夫中材之人，事有关于宦竖，莫不伤气，而况于慷慨之士乎！
            vernacular: 一个才能平常的人，一旦事情关系到宦官，没有不感到屈辱的，更何况一个慷慨刚强的志士呢？
          - ancient: 如今朝廷虽乏人，奈何令刀锯之余，荐天下之豪俊哉！
            vernacular: 如今朝廷虽然缺乏人材，但怎么会让一个受过刀锯摧残之刑的人，来推荐天下的豪杰俊才呢？
          - ancient: 仆赖先人绪业，得待罪辇毂下，二十余年矣。
            vernacular: 我凭着先人遗留下来的余业，才能够在京城任职，到现在已二十多年了。
          - ancient: 所以自惟：上之，不能纳忠效信，有奇策材力之誉，自结明主；
            vernacular: 我常常这样想：上不能对君王尽忠和报效信诚，而获得有奇策和才干的称誉，从而得到皇上的信任；
          - ancient: 次之，又不能拾遗补阙，招贤进能，显岩穴之士；
            vernacular: 其次，又不能给皇上拾取遗漏，补正阙失，招纳贤才，推举能人，发现山野隐居的贤士；
          - ancient: 外之，不能备行伍，攻城野战，有斩将搴旗之功；
            vernacular: 对外，不能备数于军队之中，攻城野战，以建立斩将夺旗的功劳；
          - ancient: 下之，不能积日累劳，取尊官厚禄，以为宗族交游光宠。
            vernacular: 从最次要的方面来看，又不能每日积累功劳，谋得高官厚禄，来为宗族和朋友争光。
          - ancient: 四者无一遂，苟合取容，无所短长之效，可见于此矣。
            vernacular: 这四个方面没有哪一方面做出成绩，我只能有意地迎合皇上的心意，以保全自己的地位，我没有些微的建树，可以从这些方面看出来。
          - ancient: 乡者，仆亦尝厕下大夫之列，陪外廷末议。
            vernacular: 以前，我也曾置身于下大夫的行列，在朝堂上发表些不值一提的意见。
          - ancient: 不以此时引纲维，尽思虑，今已亏形为扫除之隶，在阘茸之中，乃欲卬首伸眉，论列是非，不亦轻朝廷、羞当世之士邪？
            vernacular: 我没有利用这个机会申张纲纪，竭尽思虑，到现在身体残废而成为打扫污秽的奴隶，处在卑贱者中间，还想昂首扬眉，评论是非，不也是轻视朝廷、羞辱了当世的君子们吗？
          - ancient: 嗟乎！嗟乎！如仆尚何言哉！尚何言哉！
            vernacular: 唉！唉！像我这样的人，尚且说什么呢？尚且说什么呢？
      - paragraph: 且事
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - ancient: 且事本末未易明也。
            vernacular: 而且，事情的前因后果一般人是不容易弄明白的。
          - ancient: 仆少负不羁之才，长无乡曲之誉，主上幸以先人之故，使得奉薄伎，出入周卫之中。
            vernacular: 我在少年的时候就没有卓越不羁的才华，成年以后也没有得到乡里的称誉，幸亏皇上因为我父亲是太史令，使我能够获得奉献微薄才能的机会，出入宫禁之中。
          - ancient: 仆以为戴盆何以望天，故绝宾客之知，忘室家之业，日夜思竭其不肖之材力，务一心营职，以求亲媚于主上。
            vernacular: 我认为头上顶着盆子就不能望天，所以断绝了宾客的往来，忘掉了家室的事务，日夜都在考虑全部献出自己的微不足道的才干和能力，专心供职，以求得皇上的信任和宠幸。
          - ancient: 而事乃有大谬不然者！
            vernacular: 但是，事情与愿望违背太大，不是原先所料想的那样。
          - ancient: 夫仆与李陵俱居门下，素非能相善也。
            vernacular: 我和李陵都在朝中为官，向来并没有多少交往，
          - ancient: 趣舍异路，未尝衔杯酒，接殷勤之余欢。
            vernacular: 追求和反对的目标也不相同，从不曾在一起举杯饮酒，互相表示友好的感情。
          - ancient: 然仆观其为人，自守奇士，事亲孝，与士信，临财廉，取予义，分别有让，恭俭下人，常思奋不顾身，以殉国家之急。
            vernacular: 但是我观察李陵的为人，确是个守节操的不平常之人：奉事父母讲孝道，同朋友交往守信用，遇到钱财很廉洁，或取或予都合乎礼义，能分别长幼尊卑，谦让有礼，恭敬谦卑自甘人下，总是考虑着奋不顾身来赴国家的急难。
          - ancient: 其素所蓄积也，仆以为有国士之风。
            vernacular: 他历来积铸的品德，我认为有国士的风度。
          - ancient: 夫人臣出万死不顾一生之计，赴公家之难，斯已奇矣。
            vernacular: 做人臣的，从出于万死而不顾一生的考虑，奔赴国家的危难，这已经是很少见的了。
          - ancient: 今举事一不当，而全躯保妻子之臣随而媒孽其短，仆诚私心痛之。
            vernacular: 现在他行事一有不当，而那些只顾保全自己性命和妻室儿女利益的臣子们，便跟着挑拨是非，夸大过错，陷人于祸，我确实从内心感到沉痛。
          - ancient: 且李陵提步卒不满五千，深践戎马之地，足历王庭，垂饵虎口，横挑强胡，仰亿万之师，与单于连战十有余日，所杀过当。
            vernacular: 况且李陵带领的兵卒不满五千，深入敌人军事要地，到达单于的王庭，好像在老虎口上垂挂诱饵，向强大的胡兵四面挑战，面对着亿万敌兵，同单于连续作战十多天，杀伤的敌人超过了自己军队的人数，使得敌人连救死扶伤都顾不上。
          - ancient: 虏救死扶伤不给，旃裘之君长咸震怖，乃悉征其左、右贤王，举引弓之民，一国共攻而围之。
            vernacular: 匈奴君长都十分震惊恐怖，于是就征调左、右贤王，出动了所有会开弓放箭的人，举国上下，共同攻打李陵并包围他。
          - ancient: 转斗千里，矢尽道穷，救兵不至，士卒死伤如积。
            vernacular: 李陵转战千里，箭都射完了，进退之路已经断绝，救兵不来，士兵死伤成堆。
          - ancient: 然陵一呼劳军，士无不起，躬自流涕，沬自饮泣，更张空弮，冒白刃，北首争死敌者。
            vernacular: 但是，当李陵振臂一呼，鼓舞士气的时候，兵士没有不奋起的，他们流着眼泪，一个个满脸是血，强忍悲泣，拉开空的弓弦，冒着白光闪闪的刀锋，向北拼死杀敌。
          - ancient: 陵未没时，使有来报，汉公卿王侯皆奉觞上寿。
            vernacular: 当李陵的军队尚未覆没的时候，使者曾给朝廷送来捷报，朝廷的公卿王侯都举杯为皇上庆贺。
          - ancient: 后数日，陵败书闻，主上为之食不甘味，听朝不怡。
            vernacular: 几天以后，李陵兵败的奏书传来，皇上为此而饮食不甜，处理朝政也不高兴。
          - ancient: 大臣忧惧，不知所出。
            vernacular: 大臣们都很忧虑，害怕，不知如何是好。
          - ancient: 仆窃不自料其卑贱，见主上惨凄怛悼，诚欲效其款款之愚，以为李陵素与士大夫绝甘分少，能得人之死力，虽古之名将，不能过也。
            vernacular: 我私下里并未考虑自己的卑贱，见皇上悲伤痛心，实在想尽一点我那款款愚忠。我认为李陵向来与将士们同甘共苦，能够换得士兵们拼死效命的行动，即使是古代名将恐怕也没能超过的。
          - ancient: 身虽陷败，彼观其意，且欲得其当而报于汉。
            vernacular: 他虽然身陷重围，兵败投降，但看他的意思，是想寻找机会报效汉朝。
          - ancient: 事已无可奈何，其所摧败，功亦足以暴于天下矣。
            vernacular: 事情已经到了无可奈何的地步，但他摧垮、打败敌军的功劳，也足以向天下人显示他的本心了。
          - ancient: 仆怀欲陈之，而未有路，适会召问，即以此指，推言陵之功，欲以广主上之意，塞睚眦之辞。
            vernacular: 我内心打算向皇上陈述上面的看法，而没有得到适当的机会，恰逢皇上召见，询问我的看法，我就根据这些意见来论述李陵的功劳，想以此来宽慰皇上的胸怀，堵塞那些攻击、诬陷的言论。
          - ancient: 未能尽明，明主不晓，以为仆沮贰师，而为李陵游说，遂下于理。
            vernacular: 我没有完全说清我的意思，圣明的君主不深入了解，认为我是攻击贰师将军，而为李陵辩解，于是将我交付狱官处罚。
          - ancient: 拳拳之忠，终不能自列。
            vernacular: 我的虔敬和忠诚的心意，始终没有机会陈述和辩白，
          - ancient: 因为诬上，卒从吏议。
            vernacular: 被判了诬上的罪名，皇上终于同意了法吏的判决。
          - ancient: 家贫，货赂不足以自赎，交游莫救，左右亲近不为一言。
            vernacular: 我家境贫寒，微薄的钱财不足以拿来赎罪，朋友们谁也不出面营救，皇帝左右的亲近大臣又不肯替我说一句话。
          - ancient: 身非木石，独与法吏为伍，深幽囹圄之中，谁可告愬者！
            vernacular: 我血肉之躯本非木头和石块，却与执法的官吏在一起，深深地关闭在牢狱之中，我向谁去诉说内心的痛苦呢？
          - ancient: 此真少卿所亲见，仆行事岂不然乎？
            vernacular: 这些，正是少卿所亲眼看见的，我的所作所为难道不正是这样吗？
          - ancient: 李陵既生降，隤其家声，而仆又佴之蚕室，重为天下观笑。
            vernacular: 李陵投降以后，败坏了他的家族的名声，而我接着被置于蚕室，更被天下人所耻笑，
          - ancient: 悲夫！悲夫！事未易一二为俗人言也。
            vernacular: 可悲啊！可悲！这些事情是不容易逐一地向俗人解释的。
      - paragraph: 仆之
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - ancient: 仆之先人，非有剖符丹书之功，文史星历，近乎卜祝之间，固主上所戏弄，倡优畜之，流俗之所轻也。
            vernacular: 我的祖先，没有剖符丹书的功劳，职掌文史星历，地位接近于卜官和巫祝一类，本是皇上所戏弄并当作倡优来畜养的人，是世俗所轻视的。
          - ancient: 假令仆伏法受诛，若九牛亡一毛，与蝼蚁何以异？
            vernacular: 假如我伏法被杀，那好像是九牛的身上失掉一根毛，同蝼蚁又有什么区别？
          - ancient: 而世又不与能死节者比，特以为智穷罪极，不为自免，卒就死耳。
            vernacular: 世人又不会拿我之死与能殉节的人相比，只会认为我是智尽无能、罪大恶极，不能免于死刑，而终于走向死路的啊！
          - ancient: 何也？素所自树立使然也。
            vernacular: 为什么会这样呢？这是我向来所从事的职业以及地位，使人们会这样地认为。
          - ancient: 人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。
            vernacular: 人固然都有一死，但有的人死得比泰山还重，有的人却比鸿毛还轻，这是因为他们生存所依靠的东西不同啊！
          - ancient: 太上，不辱先，其次不辱身，
            vernacular: 一个人最重要的是不污辱祖先，其次是自身不受侮辱，
          - ancient: 其次不辱理色，其次不辱辞令，
            vernacular: 再次是不因别人的脸色而受辱，再次是不因别人的言语而受辱，
          - ancient: 其次诎体受辱，其次易服受辱，
            vernacular: 再次是被捆绑在地而受辱，再次是穿上囚服受辱，
          - ancient: 其次关木索、被箠楚受辱，
            vernacular: 再次是戴上脚镣手铐、被杖击鞭笞而受辱，
          - ancient: 其次剔毛发、婴金铁受辱，
            vernacular: 再次是被剃光头发、颈戴枷锁而受辱，
          - ancient: 其次毁肌肤、断肢体受辱，最下腐刑极矣！
            vernacular: 再次是毁坏肌肤、断肢截体而受辱，最下等的是腐刑，侮辱到了极点。
          - ancient: 传曰“刑不上大夫”。
            vernacular: 古书说“刑不上大夫”，
          - ancient: 此言士节不可不勉厉也。
            vernacular: 这是说士人讲节操而不能不加以自勉。
          - ancient: 猛虎在深山，百兽震恐，及在槛阱之中，摇尾而求食，积威约之渐也。
            vernacular: 猛虎生活在深山之中，百兽就都震恐，等到它落入陷穽和栅栏之中时，就只得摇着尾巴乞求食物，这是人不断地使用威力和约束而逐渐使它驯服的。
          - ancient: 故士有画地为牢，势不入；削木为吏，议不对，定计于鲜也。
            vernacular: 所以，士子看见画地为牢而决不进入，面对削木而成的假狱吏也决不同他对答，这是由于早有主意，事先就态度鲜明。
          - ancient: 今交手足，受木索，暴肌肤，受榜箠，幽于圜墙之中。
            vernacular: 现在我的手脚交叉，被木枷锁住、绳索捆绑，皮肉暴露在外，受着棍打和鞭笞，关在牢狱之中。
          - ancient: 当此之时，见狱吏则头枪地，视徒隶则心惕息。
            vernacular: 在这种时候，看见狱吏就叩头触地，看见牢卒就恐惧喘息。
          - ancient: 何者？积威约之势也。
            vernacular: 这是为什么呢？是狱吏的威风和禁约所造成的。
          - ancient: 及以至是，言不辱者，所谓强颜耳，曷足贵乎！
            vernacular: 事情已经到了这种地步，再谈什么不受污辱，那就是人们常说的厚脸皮了，有什么值得尊贵的呢？
          - ancient: 且西伯，伯也，拘于羑里；
            vernacular: 况且，像西伯姬昌，是诸侯的领袖，曾被拘禁在羑里；
          - ancient: 李斯，相也，具于五刑；
            vernacular: 李斯，是丞相，也受尽了五刑；
          - ancient: 淮阴，王也，受械于陈；
            vernacular: 淮阴侯韩信，被封为王，却在陈地被戴上刑具；
          - ancient: 彭越、张敖，南面称孤，系狱抵罪；
            vernacular: 彭越、张敖被诬告有称帝野心，被捕入狱并定下罪名；
          - ancient: 绛侯诛诸吕，权倾五伯，囚于请室；
            vernacular: 绛侯周勃，曾诛杀诸吕，一时间权力大于春秋五霸，也被囚禁在请罪室中；
          - ancient: 魏其，大将也，衣赭衣，关三木；
            vernacular: 魏其侯窦婴，是一员大将，也穿上了红色的囚衣，手、脚、颈项都套上了刑具；
          - ancient: 季布为朱家钳奴；灌夫受辱于居室。
            vernacular: 季布以铁圈束颈卖身绐朱家当了奴隶；灌夫被拘于居室而受屈辱。
          - ancient: 此人皆身至王侯将相，声闻邻国，及罪至罔加，不能引决自裁。
            vernacular: 这些人的身分都到了王侯将相的地位，声名传扬到邻国，等到犯了罪而法网加身的时候，不能引决自裁。
          - ancient: 在尘埃之中，古今一体，安在其不辱也？
            vernacular: 在社会上，古今都一样，哪里有不受辱的呢？
          - ancient: 由此言之，勇怯，势也；强弱，形也。
            vernacular: 照这样说来，勇敢或怯懦，乃是势位所造成；强或弱，也是形势所决定。
          - ancient: 审矣，何足怪乎？
            vernacular: 确实是这样，有什么奇怪的呢？
          - ancient: 夫人不能早自裁绳墨之外，以稍陵迟，至于鞭箠之间，乃欲引节，斯不亦远乎！
            vernacular: 况且人不能早早地自杀以逃脱于法网之外，而到了被摧残和被杖打受刑的时候，才想到保全节操，这种愿望和现实不是相距太远了吗？
          - ancient: 古人所以重施刑于大夫者，殆为此也。
            vernacular: 古人之所以慎重地对大夫用刑，就是因为这个缘故。
          - ancient: 夫人情莫不贪生恶死，念父母，顾妻子，至激于义理者不然，乃有所不得已也。
            vernacular: 人之常情，没有谁不贪生怕死的，都挂念父母，顾虑妻室儿女。至于那些激愤于正义公理的人当然不是这样，这里有迫不得已的情况。
          - ancient: 今仆不幸，早失父母，无兄弟之亲，独身孤立，少卿视仆于妻子何如哉？
            vernacular: 如今我很不幸，早早地失去双亲，又没有兄弟互相爱护，独身一人，孤立于世，少卿你看我对妻室儿女又怎样呢？
          - ancient: 且勇者不必死节，怯夫慕义，何处不勉焉！
            vernacular: 况且一个勇敢的人不一定要为名节去死，怯懦的人仰慕大义，又何处不勉励自己呢？
          - ancient: 仆虽怯懦，欲苟活，亦颇识去就之分矣，何至自湛溺累绁之辱哉！
            vernacular: 我虽然怯懦软弱，想苟活在人世，但也颇能区分弃生就死的界限，哪会自甘沉溺于牢狱生活而忍受屈辱呢？
          - ancient: 且夫臧获婢妾，犹能引决，况仆之不得已乎？
            vernacular: 再说奴隶婢妾尚且懂得自杀，何况像我到了这样不得已的地步！
          - ancient: 所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世，而文采不表于后世也。
            vernacular: 我之所以忍受着屈辱苟且活下来，陷在污浊的监狱之中却不肯死的原因，是遗憾我内心的志愿有未达到的，平平庸庸地死了，文章就不能在后世显露。
      - paragraph: 古者
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - ancient: 古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。
            vernacular: 古时候虽富贵但名字磨灭不传的人，多得数不清，只有那些卓异而不平常的人才在世上著称。
          - ancient: 盖文王拘而演《周易》；
            vernacular: 西伯姬昌被拘禁而扩写《周易》；
          - ancient: 仲尼厄而作《春秋》；
            vernacular: 孔子受困窘而作《春秋》；
          - ancient: 屈原放逐，乃赋《离骚》；
            vernacular: 屈原被放逐，才写了《离骚》；
          - ancient: 左丘失明，厥有《国语》；
            vernacular: 左丘明失去视力，才有《国语》。
          - ancient: 孙子膑脚，《兵法》修列；
            vernacular: 孙膑被截去膝盖骨，《兵法》才撰写出来；
          - ancient: 不韦迁蜀，世传《吕览》；
            vernacular: 吕不韦被贬谪蜀地，后世才流传着《吕氏春秋》；
          - ancient: 韩非囚秦，《说难》《孤愤》；
            vernacular: 韩非被囚禁在秦国，写出《说难》、《孤愤》；
          - ancient: 《诗》三百篇，大底圣贤发愤之所为作也。
            vernacular: 《诗》三百篇，大都是一些圣贤们抒发愤懑而写作的。
          - ancient: 此人皆意有所郁结，不得通其道，故述往事、思来者。
            vernacular: 这些都是人们感情有压抑郁结不解的地方，不能实现其理想，所以记述过去的事迹，让将来的人了解他的志向。
          - ancient: 乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。
            vernacular: 就像左丘明没有了视力，孙膑断了双脚，终生不能被人重用，便退隐著书立说来抒发他们的怨愤，想到活下来从事著作来表现自己的思想。
          - ancient: 仆窃不逊，近自托于无能之辞，
            vernacular: 我私下里也自不量力，近来用我那不高明的文辞，
          - ancient: 网罗天下放失旧闻，略考其行事，
            vernacular: 收集天下散失的历史传闻，粗略地考订其事实，
          - ancient: 综其终始，稽其成败兴坏之纪，
            vernacular: 综述其事实的本末，推究其成败盛衰的道理，
          - ancient: 上计轩辕，下至于兹，
            vernacular: 上自黄帝，下至于当今，
          - ancient: 为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。
            vernacular: 写成十篇表，十二篇本纪，八篇书，三十篇世家，七十篇列传，一共一百三十篇，
          - ancient: 亦欲以究天人之际，通古今之变，成一家之言。
            vernacular: 也是想探求天道与人事之间的关系，贯通古往今来世道盛衰变迁的脉络，成为一家之言。
          - ancient: 草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。
            vernacular: 刚开始草创还没有完毕，恰恰遭遇到这场灾祸，我痛惜这部书不能完成，因此便接受了最残酷的刑罚而不敢有怒色。
          - ancient: 仆诚以著此书，藏之名山，传之其人，通邑大都，
            vernacular: 我现在真正的写完了这部书，打算把它藏进名山，传给可传的人，再让它流传进都市之中，
          - ancient: 则仆偿前辱之责，虽万被戮，岂有悔哉！
            vernacular: 那么，我便抵偿了以前所受的侮辱，即便是让我千次万次地被侮辱，又有什么后悔的呢！
          - ancient: 然此可为智者道，难为俗人言也！
            vernacular: 但是，这些只能向有见识的人诉说，却很难向世俗之人讲清楚啊！
  - poem: 过秦论（上）
    type: 文言文选必
    author: 贾谊
    created_at: 西汉
    paragraphs:
      - paragraph: 秦孝
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - ancient: 秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。
            vernacular: 秦孝公占据着崤山和函谷关的险固地势，拥有雍州的土地，君臣牢固地守卫着来伺机夺取周王室的权力，（秦孝公）有统一天下的雄心。
          - ancient: 当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。
            vernacular: 正当这时，商鞅辅佐他，对内建立法规制度，从事耕作纺织，修造防守和进攻的器械；对外实行连衡策略，使诸侯自相争斗。
          - ancient: 于是秦人拱手而取西河之外。
            vernacular: 因此，秦人轻而易举地夺取了黄河以西的土地。
      - paragraph: 孝公
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - ancient: 孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。
            vernacular: 秦孝公死了以后，惠文王、武王、昭襄王承继先前的基业，沿袭前代的策略，向南夺取汉中，向西攻取巴、蜀，向东割取肥沃的地区，向北占领非常重要的地区。
          - ancient: 诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。
            vernacular: 诸侯恐慌害怕，集会结盟，商议削弱秦国，不吝惜奇珍贵重的器物和肥沃富饶的土地，用来招纳天下的优秀人才，采用合纵的策略缔结盟约，互相援助，成为一体。
          - ancient: 当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。
            vernacular: 在这个时候，齐国有孟尝君，赵国有平原君，楚国有春申君，魏国有信陵君。
          - ancient: 此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。
            vernacular: 这四位封君，都见识英明有智谋，心地诚而讲信义，待人宽宏厚道而爱惜人民，尊重贤才而重用士人，以合纵之约击破秦的连横之策，联合韩、魏、燕、楚、齐、赵、宋、卫、中山的部队。 
          - ancient: 于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召shào滑、楼缓、翟zhái景、苏厉、乐yuè毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。
            vernacular: 在这时，六国的士人，有宁越、徐尚、苏秦、杜赫等人为他们出谋划策，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅等人沟通他们的意见，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢等人统率他们的军队。
          - ancient: 尝以十倍之地，百万之众，叩关而攻秦。
            vernacular: 他们曾经用十倍于秦的土地，上百万的军队，攻打函谷关来攻打秦国。
          - ancient: 秦人开关延敌，九国之师，逡qūn巡而不敢进。
            vernacular: 秦人打开函谷关口迎战敌人，九国的军队有所顾虑徘徊不敢入关。
          - ancient: 秦无亡矢遗镞zú之费，而天下诸侯已困矣。
            vernacular: 秦人没有一兵一卒的耗费，然而天下的诸侯就已窘迫不堪了。
          - ancient: 于是从散约败，争割地而赂秦。
            vernacular: 于是，纵约失败了，各诸侯国争着割地来贿赂秦国。
          - ancient: 秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。
            vernacular: 秦有剩余的力量趁他们困乏而制服他们，追赶逃走的败兵，百万败兵横尸道路，流淌的血液可以漂浮盾牌。
          - ancient: 因利乘便，宰割天下，分裂山河。
            vernacular: 秦国凭借这有利的形势，割取天下的土地，重新划分山河的区域。
          - ancient: 强国请服，弱国入朝。
            vernacular: 强国主动表示臣服，弱国入秦朝拜。
          - ancient: 延及孝文王、庄襄王，享国之日浅，国家无事。
            vernacular: 延续到孝文王、庄襄王，统治的时间不长，秦国并没有什么大事发生。
      - paragraph: 及至
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - ancient: 及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。
            vernacular: 到始皇的时候，发展六世遗留下来的功业，以武力来统治各国，将西周、东周和各诸侯国统统消灭，登上皇帝的宝座来统治天下，用严酷的刑罚来奴役天下的百姓，威风震慑四海。
          - ancient: 南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。
            vernacular: 秦始皇向南攻取百越的土地，把它划为桂林郡和象郡，百越的君主低着头，颈上捆着绳子（愿意服从投降），把性命交给司法官吏。
          - ancient: 乃使蒙恬北筑长城而守藩篱，却匈奴七百余里。
            vernacular: 秦始皇于是又命令蒙恬在北方修筑长城，守卫边境，使匈奴退却七百多里；
          - ancient: 胡人不敢南下而牧马，士不敢弯弓而报怨。
            vernacular: 胡人不敢向下到南边来放牧，勇士不敢拉弓射箭来报仇。
          - ancient: 于是废先王之道，焚百家之言，以愚黔首；
            vernacular: 秦始皇接着就废除古代帝王的治世之道，焚烧诸子百家的著作，来使百姓愚蠢；
          - ancient: 隳huī名城，杀豪杰，收天下之兵，聚之咸阳，
            vernacular: 毁坏高大的城墙，杀掉英雄豪杰；收缴天下的兵器，集中在咸阳，
          - ancient: 销锋镝dí，铸以为金人十二，以弱天下之民。
            vernacular: 销毁兵刃和箭头，冶炼它们铸造十二个铜人，以便削弱百姓的反抗力量。
          - ancient: 然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。
            vernacular: 然后凭借华山为城墙，依据黄河为城池，凭借着高耸的华山，往下看着深不可测的黄河，认为这是险固的地方。
          - ancient: 良将劲弩守要害之处，信臣精卒陈利兵而谁何。
            vernacular: 好的将领手执强弩，守卫着要害的地方，可靠的官员和精锐的士卒，拿着锋利的兵器，盘问过往行人。
          - ancient: 天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。
            vernacular: 天下已经安定，始皇心里自己认为这关中的险固地势、方圆千里的坚固的城防，是子子孙孙称帝称王直至万代的基业。
      - paragraph: 始皇
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - ancient: 始皇既没，余威震于殊俗。
            vernacular: 始皇去世之后，他的余威（依然）震慑着边远地区。
          - ancient: 然陈涉瓮牖yǒu绳枢之子，氓méng隶之人，而迁徙之徒也；
            vernacular: 可是，陈涉不过是个破瓮做窗户、草绳做户枢的贫家子弟，是氓、隶一类的人，（后来）做了被迁谪戍边的卒子；
          - ancient: 才能不及中人，非有仲尼、墨翟dí之贤，陶朱、猗yī顿之富；
            vernacular: 才能不如普通人，并没有孔丘、墨翟那样的贤德，也不像陶朱、猗顿那样富有。
          - ancient: 蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦，斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。
            vernacular: （他）跻身于戍卒的队伍中，从田野间突然奋起发难，率领着疲惫无力的士兵，指挥着几百人的队伍，掉转头来进攻秦国，砍下树木作武器，举起竹竿当旗帜，天下豪杰像云一样聚集，回声似的应和他，许多人都背着粮食，如影随形地跟着。
          - ancient: 山东豪俊遂并起而亡秦族矣。
            vernacular: 崤山以东的英雄豪杰于是一齐起事，消灭了秦的家族。
      - paragraph: 且夫
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - ancient: 且夫天下非小弱也，雍州之地，崤函之固，自若也。
            vernacular: 况且那天下并没有缩小削弱，雍州的地势，崤山和函谷关的险固，是保持原来的样子。
          - ancient: 陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；
            vernacular: 陈涉的地位，没有比齐、楚、燕、赵、韩、魏、宋、卫、中山的国君更加尊贵；
          - ancient: 锄耰yōu棘矜qín，非铦xiān于钩戟长铩也；
            vernacular: 锄头木棍也不比钩戟长矛更锋利；
          - ancient: 谪戍之众，非抗于九国之师也；
            vernacular: 那迁谪戍边的士兵也不能和九国部队抗衡；
          - ancient: 深谋远虑，行军用兵之道，非及向时之士也。
            vernacular: 深谋远虑，行军用兵的方法，也比不上先前九国的武将谋臣。
          - ancient: 然而成败异变，功业相反，何也？
            vernacular: 可是条件好者失败而条件差者成功，功业完全相反，为什么呢？
          - ancient: 试使山东之国与陈涉度duó长絜xié大，比权量力，则不可同年而语矣。
            vernacular: 假使拿东方诸侯国跟陈涉比一比长短大小，量一量权势力量，就更不能相提并论了。
          - ancient: 然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；
            vernacular: 然而秦凭借着它的小小的地方，发展到兵车万乘的国势，管辖全国，使六国诸侯都来朝见，已经一百多年了；
          - ancient: 然后以六合为家，崤函为宫；
            vernacular: 这之后把天下作为家业，用崤山、函谷关作为自己的内宫；
          - ancient: 一夫作难nàn而七庙隳，身死人手，为天下笑者，何也？
            vernacular: 陈涉一人起义国家就灭亡了，秦王子婴死在别人（项羽）手里，被天下人耻笑，这是为什么呢？
          - ancient: 仁义不施而攻守之势异也。
            vernacular: 就因为不施行仁政而使攻守的形势发生了变化啊。
  - poem: 礼运《礼记》
    type: 文言文选必
    author: 孔子
    created_at: 战国末年
    paragraphs:
      - paragraph: 大道
        url: https://baike.baidu.com/item/%E7%A4%BC%E8%BF%90
        sentences:
          - ancient: 大道之行也，与三代之英，丘未之逮也，而有志焉。
            vernacular: 大道实行的时代，和夏、商、周三代杰出人物当政的时期，我孔丘未能赶得上，但我有志于此。
          - ancient: 大道之行也，天下为公，选贤与能，讲信修睦。
            vernacular: 大道运行的时代，天下是属于大家的，选拔贤能之人当政，相互讲究信用，建立和睦关系。
          - ancient: 故人不独亲其亲，不独子其子，
            vernacular: 所以人们不只是把自己的亲人当作亲人，不只是把自己的儿子当作儿子。
          - ancient: 使老有所终，壮有所用，幼有所长，
            vernacular: 使老年人得到赡养，壮年人有用武之地，幼年人得到抚养
          - ancient: 矜寡孤独废疾者皆有所养，男有分，女有归。
            vernacular: 鳏寡孤独者及身体残疾之人皆得供养，男子有正当职业，女人都适时出嫁。
          - ancient: 货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。
            vernacular: 爱护财货却不必藏于身边；能竭尽其力却不必为自己。
          - ancient: 是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。
            vernacular: 因此阴谋诡计不会兴起，偷窃作乱无人去做，所以出外可以不关闭大门。
          - ancient: 是谓大同。
            vernacular: 这称为大同世界。
  - poem: 陈情表
    type: 文言文选必
    author: 李密
    created_at: 西晋
    paragraphs:
      - paragraph: 臣密言
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - ancient: 臣密言：臣以险衅，夙遭闵凶。
            vernacular: 臣子李密陈言：我因为命运不好，很早就遭遇了不幸。
          - ancient: 生孩六月，慈父见背；行年四岁，舅夺母志。
            vernacular: 刚出生六个月，我慈爱的父亲就去世了。长到四岁，舅舅就逼迫母亲改嫁。
          - ancient: 祖母刘愍臣孤弱，躬亲抚养。
            vernacular: 祖母刘氏可怜我孤苦弱小，便亲自加以抚养。
          - ancient: 臣少多疾病，九岁不行，零丁孤苦，至于成立。
            vernacular: 臣小的时候经常生病，九岁时还不会行走，始终孤独无依，直到长大成人。
          - ancient: 既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。
            vernacular: 既没有叔叔伯伯，也没有哥哥弟弟，门庭衰微福分又浅，很晚才有了儿子。
          - ancient: 外无期功强近之亲，内无应门五尺之僮，茕茕独立，形影相吊。
            vernacular: 外面没有关系比较亲近的亲戚，家里也没有照应门户的童仆，一人孤单地独自生活，只有影子作伴。
          - ancient: 而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。
            vernacular: 而祖母刘氏很久前就疾病缠身，经常躺在床上不能起身，臣早晚服侍饮食药物，从来就没有停止侍奉而离开她。
      - paragraph: 逮奉
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - ancient: 逮奉圣朝，沐浴清化。
            vernacular: 到了圣明的朝代，臣身受清明的教化。
          - ancient: 前太守臣逵察臣孝廉；后刺史臣荣举臣秀才。
            vernacular: 起初有太守逵推选臣为孝廉，后来刺史荣又举荐臣为秀才。
          - ancient: 臣以供养无主，辞不赴命。
            vernacular: 臣因没有人供养祖母，辞谢不接受任命。
          - ancient: 诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。
            vernacular: 朝廷又特地下了诏书，任命臣为郎中，不久又蒙受国恩，任命臣为太子洗马。
          - ancient: 猥以微贱，当侍东宫，非臣陨首所能上报。
            vernacular: 像我这样出身微贱地位卑下的人，担当侍奉太子的职务，这实在不是臣杀身捐躯所能报答的。
          - ancient: 臣具以表闻，辞不就职。
            vernacular: 臣将以上苦衷上表报告，推辞不去就职。
          - ancient: 诏书切峻，责臣逋慢；
            vernacular: 但是诏书急切严厉，责怪臣回避怠慢；
          - ancient: 郡县逼迫，催臣上道；
            vernacular: 郡县长官催促逼迫，命令臣即刻启程；
          - ancient: 州司临门，急于星火。
            vernacular: 州的长官也登门督促，比流星坠落还要急迫。
          - ancient: 臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。
            vernacular: 臣想手捧诏书马上赶路，但因祖母刘氏的病一天比一天重，就想姑且迁就自己的私情，但被告知不被允许。
          - ancient: 臣之进退，实为狼狈。
            vernacular: 臣的处境进退两难，实在狼狈不堪。
      - paragraph: 伏惟
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - ancient: 伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。
            vernacular: 我俯伏思量圣明的朝代是用孝道来治理天下的，凡是年老而德高的旧臣，尚且还受到怜悯养育，何况臣的孤苦又特别严重呢。
          - ancient: 且臣少仕伪朝，历职郎署，本图宦达，不矜名节。
            vernacular: 况且臣年轻时曾经做过蜀汉的官，历任郎官衙署之职，本来就希望做官显达，并不顾惜名声节操。
          - ancient: 今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀！
            vernacular: 现在我是一个低贱的亡国俘虏，十分卑微浅陋，受到过分提拔，恩宠优厚，怎敢犹豫不决而有非分的企求呢？
          - ancient: 但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。
            vernacular: 只是因为祖母刘氏已像迫近西山的落日，气息微弱，生命垂危，到了早晨不知傍晚的境地。
          - ancient: 臣无祖母，无以至今日；祖母无臣，无以终余年。
            vernacular: 臣如果没有祖母，就不会活到现在；祖母如果没有臣的照料，也就不能安度余生。
          - ancient: 母孙二人，更相为命，是以区区不能废远。
            vernacular: 我们祖孙二人，此时更是相依为命，正是出于这种内心的恳切之情才无法离去远行。
      - paragraph: 臣密今
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - ancient: 臣密今年四十有四，祖母刘今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。
            vernacular: 臣李密今年四十四岁，祖母刘氏今年已九十六岁，因此臣为陛下效劳尽节的日子还长着，而报答祖母的日子已经不多了。
          - ancient: 乌鸟私情，愿乞终养。
            vernacular: 我怀着乌鸦反哺的私情，乞求能够准许臣完成对祖母养老送终的心愿。
          - ancient: 臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土，实所共鉴。
            vernacular: 臣的辛酸苦楚，不单是蜀地的百姓及益、梁二州的长官所耳闻目睹，就连天地神明也都看得清清楚楚。
          - ancient: 愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。
            vernacular: 希望陛下能怜悯臣愚拙的诚心，请允许臣完成一点小小的心愿，祖母刘氏或许能因此有幸安度余生。
          - ancient: 臣生当陨首，死当结草。
            vernacular: 臣活着愿杀身报效朝廷，死了也要结草来报答陛下的恩情。
          - ancient: 臣不胜犬马怖惧之情，谨拜表以闻。
            vernacular: 臣怀着牛马一样不胜恐惧的心情，恭敬地呈上此表来使陛下知道这件事。
  - poem: 归去来兮辞（并序）
    type: 文言文选必
    author: 陶渊明
    created_at: 东晋
    paragraphs:
      - paragraph: 余家
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - ancient: 余家贫，耕植不足以自给。
            vernacular: 我家境贫困，靠耕田不足自给。
          - ancient: 幼稚盈室，缾无储粟，生生所资，未见其术。
            vernacular: 年幼的孩子很多，米瓮里没有积蓄的粮食，养活全家老幼还找不到什么办法。
          - ancient: 亲故多劝余为长吏，脱然有怀，求之靡途。
            vernacular: 亲戚朋友都劝我出去做官，我豁然而有所思虑，但求取一官半职也没有途径。
          - ancient: 会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。
            vernacular: 恰巧遇到四方勤王的大事，诸侯大臣都以广施惠爱作为美德。我的叔父见我家境贫困，就举荐我任职于小县县令。
          - ancient: 于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。
            vernacular: 这时讨伐桓玄的战争还没有结束，心里也害怕出远差。彭泽县离家只有百余里路程，公田里种植的粮食，足够酿酒，
          - ancient: 故便求之。
            vernacular: 故而就向叔父谋求这个官职。
          - ancient: 及少日，眷然有归欤之情。
            vernacular: 到任后不久，很怀念家乡，便有归去的心愿。
          - ancient: 何则？质性自然，非矫厉所得。
            vernacular: 为什么呢？我本性真率，无法改变。
          - ancient: 饥冻虽切，违己交病。
            vernacular: 饥饿寒冷虽也令人感觉痛切，但违背自己的意愿则更使我心身交病。
          - ancient: 尝从人事，皆口腹自役。
            vernacular: 先前曾在官场里应酬周旋，那都是为了嘴巴肚子而役使自己。
          - ancient: 于是怅然慷慨，深愧平生之志。
            vernacular: 于是惆怅感慨，为平生的抱负未能实现而深感惭愧。
          - ancient: 犹望一稔，当敛裳宵逝。
            vernacular: 本指望干完一年就整好衣服乘夜离去。
          - ancient: 寻程氏妹丧于武昌，情在骏奔，自免去职。
            vernacular: 不久，嫁到程家的妹妹在武昌去世，一心想赶快奔赴吊丧，于是自己请求免去了职务。
          - ancient: 仲秋至冬，在官八十余日。
            vernacular: 自仲秋到入冬，任职一共八十多天。
          - ancient: 因事顺心，命篇曰归去来兮。
            vernacular: 因这件事顺遂了心愿，而写了一篇文章，题目叫“归去来兮”。
          - ancient: 乙巳岁十一月也。
            vernacular: 时在乙巳年十一月。
      - paragraph: 归去
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - ancient: 归去来兮，田园将芜胡不归？
            vernacular: 回去吧！田园都将要荒芜了，为什么不回去呢？
          - ancient: 既自以心为形役，奚惆怅而独悲？
            vernacular: 既然自己的心灵被躯壳所役使，那为什么悲愁失意？
          - ancient: 悟已往之不谏，知来者之可追。
            vernacular: 我明悟过去的错误已不可挽回，但明白未发生的事尚可补救。
          - ancient: 实迷途其未远，觉今是而昨非。
            vernacular: 我确实入了迷途，但不算太远，已觉悟如今的选择是正确的，而曾经的行为才是迷途。
          - ancient: 舟遥遥以轻飏，风飘飘而吹衣。
            vernacular: 船在水面轻轻地飘荡着前进，轻快前行，风轻飘飞舞，吹起了衣袂翩翩。
          - ancient: 问征夫以前路，恨晨光之熹微。
            vernacular: 我向行人询问前面的路，恨天亮的太慢。
      - paragraph: 乃瞻
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - ancient: 乃瞻衡宇，载欣载奔。
            vernacular: 终于看到了自己的家，心中欣喜，奔跑过去。
          - ancient: 僮仆欢迎，稚子候门。
            vernacular: 家僮欢快地迎接我，幼儿们守候在门庭等待。
          - ancient: 三径就荒，松菊犹存。携幼入室，有酒盈樽。
            vernacular: 院子里的小路快要荒芜了，松菊还长在那里。我带着幼儿们进入屋室，早有清酿溢满了酒樽。
          - ancient: 引壶觞以自酌，眄庭柯以怡颜。
            vernacular: 我端起酒壶酒杯自斟自饮，看看院子里的树木，觉得很愉快；
          - ancient: 倚南窗以寄傲，审容膝之易安。
            vernacular: 倚着南窗寄托傲然自得的心情，觉得住在简陋的小屋里也非常舒服。
          - ancient: 园日涉以成趣，门虽设而常关。
            vernacular: 天天到院子里走走，自成一种乐趣，小园的门经常地关闭。
          - ancient: 策扶老以流憩，时矫首而遐观。
            vernacular: 拄着拐杖出去走走，随时随地休息，时时抬头望着远方。
          - ancient: 云无心以出岫，鸟倦飞而知还。
            vernacular: 云气自然而然的从山里冒出，倦飞的小鸟也知道飞回巢中。
          - ancient: 景翳翳以将入，抚孤松而盘桓。
            vernacular: 阳光黯淡，太阳快落下去了，手抚孤松徘徊。
      - paragraph: 归去
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - ancient: 归去来兮，请息交以绝游。
            vernacular: 回来呀！我要跟世俗之人断绝交游。
          - ancient: 世与我而相违，复驾言兮焉求？
            vernacular: 世事与我所想的相违背，再出外远行又有什么追求？
          - ancient: 悦亲戚之情话，乐琴书以消忧。
            vernacular: 以亲人间的知心话为愉悦，以弹琴读书为乐来消除忧愁。
          - ancient: 农人告余以春及，将有事于西畴。
            vernacular: 农夫告诉我春天到了，西边田野里要开始耕种了。
          - ancient: 或命巾车，或棹孤舟。
            vernacular: 有时叫上一辆有帷的小车，有时划过一艘小船。
          - ancient: 既窈窕以寻壑，亦崎岖而经丘。
            vernacular: 有时经过幽深曲折的山谷，有时走过高低不平的山路。
          - ancient: 木欣欣以向荣，泉涓涓而始流。
            vernacular: 草木茂盛，水流细微。
          - ancient: 善万物之得时，感吾生之行休。
            vernacular: 羡慕自然界的万物一到春天便及时生长茂盛，感叹自己的一生行将结束。
      - paragraph: 已矣
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - ancient: 已矣乎！寓形宇内复几时？
            vernacular: 算了吧！活在世上还能有多久，
          - ancient: 曷不委心任去留？
            vernacular: 为什么不放下心来任其自然地生死？
          - ancient: 胡为乎遑遑欲何之？
            vernacular: 为什么心神不定，想要到哪里去？
          - ancient: 富贵非吾愿，帝乡不可期。
            vernacular: 富贵不是我所求，修成神仙是没有希望的。
          - ancient: 怀良辰以孤往，或植杖而耘耔。
            vernacular: 趁着春天美好的时光，独自外出，有时放下手杖，拿起农具除草培土。
          - ancient: 登东皋以舒啸，临清流而赋诗。
            vernacular: 登上东边的高岗放声呼啸，傍着清清的溪流吟诵诗篇。
          - ancient: 聊乘化以归尽，乐夫天命复奚疑！
            vernacular: 姑且顺其自然走完生命的路程，抱定乐安天命的主意，还有什么可犹疑的呢！
  - poem: 种树郭橐驼传
    type: 文言文选必
    author: 柳宗元
    created_at: 中唐
    paragraphs:
      - paragraph: 郭橐
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - ancient: 郭橐驼，不知始何名。
            vernacular: 郭橐驼，不知道他起初叫什么名字。
          - ancient: 病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。
            vernacular: 他患了脊背弯曲的病，脊背突起而弯腰行走，就像骆驼一样，所以乡里人称呼他叫“橐驼”。
          - ancient: 驼闻之曰：“甚善，名我固当。”
            vernacular: 橐驼听说后，说：“这个名字很好啊，这样称呼我确实恰当。”
          - ancient: 因舍其名，亦自谓“橐驼”云。
            vernacular: 于是他舍弃了他原来的名字，也自称起“橐驼”来。
      - paragraph: 其乡
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - ancient: 其乡曰丰乐乡，在长安西。
            vernacular: 他的家乡叫丰乐乡，在长安城西边。
          - ancient: 驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。
            vernacular: 郭橐驼以种树为职业，凡是长安城里经营园林游览和做水果买卖的豪富人，都争着把他接到家里奉养。
          - ancient: 视驼所种树，或移徙，无不活；且硕茂，早实以蕃。
            vernacular: 观察橐驼种的树，有的是移植来的，也没有不成活的；而且长得高大茂盛，结果实早而且多。
          - ancient: 他植者虽窥伺效慕，莫能如也。
            vernacular: 其他种树的人即使暗中观察、羡慕效仿，也没有谁能比得上。
      - paragraph: 有问
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - ancient: 有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天以致其性焉尔。
            vernacular: 有人问他种树种得好的原因，他回答说：“我郭橐驼不是能够使树木活得长久而且长得很快，只不过能够顺应树木的天性，来实现其自身的习性罢了。
          - ancient: 凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。
            vernacular: 但凡种树的方法，它的树根要舒展，它的培土要平均，它根下的土要用原来培育树苗的土，它捣土要结实。
          - ancient: 既然已，勿动勿虑，去不复顾。
            vernacular: 已经这样做了，就不要再动，不要再忧虑它，离开它不再回顾。
          - ancient: 其莳也若子，其置也若弃，则其天者全而其性得矣。
            vernacular: 栽种时要像对待子女一样细心，栽好后要像丢弃它一样放在一边，那么树木的天性就得以保全，它的习性就得以实现。
          - ancient: 故吾不害其长而已，非有能硕茂之也；
            vernacular: 所以我只不过不妨碍它的生长罢了，并不是有能使它长得高大茂盛的办法；
          - ancient: 不抑耗其实而已，非有能早而蕃之也。
            vernacular: 只不过不抑制、减少它的结果罢了，也并不是有能使它果实结得早又多的办法。
          - ancient: 他植者则不然。
            vernacular: 别的种树人却不是这样，
          - ancient: 根拳而土易，其培之也，若不过焉则不及。
            vernacular: 树根拳曲又换了生土；他培土的时候，不是过多就是过少。
          - ancient: 苟有能反是者，则又爱之太恩，忧之太勤。
            vernacular: 如果有能够和这种做法相反的人，就又太过于吝惜它们了，担心它太过分了，
          - ancient: 旦视而暮抚，已去而复顾。
            vernacular: 在早晨去看了，在晚上又去摸摸，已经离开了，又回头去看看。
          - ancient: 甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。
            vernacular: 更严重的，甚至用指甲划破树皮来观察它是活着还是枯死了，摇晃树根来看它是否栽结实了，这样树木的天性就一天天远去了。
          - ancient: 虽曰爱之，其实害之；虽曰忧之，其实仇之：
            vernacular: 虽然说是喜爱它，这实际上是害了它，虽说是担心它，这实际上是仇视它。
          - ancient: 故不我若也。吾又何能为哉？”
            vernacular: 所以他们都不如我。我又能做什么呢？”
      - paragraph: 问者
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - ancient: 问者曰：“以子之道，移之官理，可乎？”
            vernacular: 问的人说：“把你种树的方法，转用到做官治民上，可行吗？”
          - ancient: 驼曰：“我知种树而已，官理，非吾业也。
            vernacular: 橐驼说：“我只知道种树罢了，做官治民,不是我的职业。
          - ancient: 然吾居乡，见长人者好烦其令，
            vernacular: 但是我住在乡里，看见那些官吏喜欢不断地发号施令，
          - ancient: 若甚怜焉，而卒以祸。
            vernacular: 好像是很怜爱（百姓）啊，但百姓最终反因此受到祸害。
          - ancient: 旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，
            vernacular: 在早上在晚上那些小吏跑来大喊：‘长官命令：催促你们耕地，勉励你们种植，督促你们收获，
          - ancient: 早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’
            vernacular: 早些煮茧抽丝，早些织你们的布，养育你们的小孩，喂大你们的鸡和猪。’
          - ancient: 鸣鼓而聚之，击木而召之。
            vernacular: 一会儿打鼓招聚大家，一会儿鼓梆召集大家，
          - ancient: 吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？
            vernacular: 我们这些小百姓停止吃早、晚饭去慰劳那些小吏尚且不得空暇，又怎能使我们繁衍生息，使我们民心安定呢？
          - ancient: 故病且怠。若是，则与吾业者其亦有类乎？”
            vernacular: 所以我们既困苦又疲乏,像这样（治民反而扰民），它与我种树的行当大概也有相似的地方吧？”
          - ancient: 问者曰：“嘻，不亦善夫！吾问养树，得养人术。” 
            vernacular: 问的人说：“不也是很好吗！我问种树的方法，得到了治民的方法。”
          - ancient: 传其事以为官戒也。
            vernacular: 我为这件事作传把它作为官吏们的鉴戒。 
  - poem: 五代史伶官传序
    type: 文言文选必
    author: 欧阳修
    created_at: 北宋
    paragraphs:
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - ancient: 呜呼！盛衰之理，虽曰天命，岂非人事哉！
            vernacular: 啊！国家的兴盛与衰败的道理，虽说是天意，难道不是人为的缘故吗？
          - ancient: 原庄宗之所以得天下，与其所以失之者，可以知之矣。
            vernacular: 探究庄宗得天下和失天下的原因，就可以知道了。
      - paragraph: 世言
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - ancient: 世言晋王之将终也，以三矢赐庄宗而告之曰：“
            vernacular: 世人传言晋王李克用临死时，曾把三支箭交给庄宗，并对他说：“
          - ancient: 梁，吾仇也；
            vernacular: 梁是我的仇人，
          - ancient: 燕王，吾所立，
            vernacular: 燕王是我扶持的，
          - ancient: 契丹，与吾约为兄弟，而皆背晋以归梁。
            vernacular: 契丹与我结为兄弟，但都背叛了我而归附于梁。
          - ancient: 此三者，吾遗恨也。
            vernacular: 这三件事，是我的遗恨。
          - ancient: 与尔三矢，尔其无忘乃父之志！”
            vernacular: 给你三支箭，希望你不要忘记你父亲报仇的心愿。”
          - ancient: 庄宗受而藏之于庙。
            vernacular: 庄宗收下箭藏在宗庙里，
          - ancient: 其后用兵，则遣从事以一少牢告庙，
            vernacular: 此后打仗时，就派官员以少牢之礼祭祀于宗庙，
          - ancient: 请其矢，盛以锦囊，负而前驱，及凯旋而纳之。
            vernacular: 恭敬地取出箭，放入锦锻织的袋子里，背着它冲杀在前，等打了胜仗，又把箭放回宗庙。
      - paragraph: 方其
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - ancient: 方其系燕父子以组，函梁君臣之首，入于太庙，
            vernacular: 当庄宗用绳子捆着燕王父子，用木匣装放着梁王君臣的头颅，进宗庙，
          - ancient: 还矢先王，而告以成功，其意气之盛，可谓壮哉！
            vernacular: 把箭交还先王，禀告报仇成功的消息的时候，他意气之盛，可以说是豪壮啊！
          - ancient: 及仇雠已灭，天下已定，
            vernacular: 等仇敌已灭，天下平定，
          - ancient: 一夫夜呼，乱者四应，仓皇东出，
            vernacular: 一个人在夜间呼喊，叛乱的人四方响应，庄宗慌张东逃，
          - ancient: 未及见贼而士卒离散，君臣相顾，不知所归。
            vernacular: 还没等见到敌人，官兵们就离散了，只剩下君臣互相瞧着，不知投奔哪里是好，
          - ancient: 至于誓天断发，泣下沾襟，何其衰也！
            vernacular: 以至于剪断头发，对天发誓，眼泪沾湿了衣裳，这又是多么衰败啊！
          - ancient: 岂得之难而失之易欤？
            vernacular: 难道真是得天下难而失天下易吗！
          - ancient: 抑本其成败之迹，而皆自于人欤？
            vernacular: 还是推究他成功或失败的原因，都在于人为的缘故呢？
      - paragraph: 《书
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - ancient: 《书》曰：“满招损，谦得益。”
            vernacular: 《尚书》说：“自满招致损失，谦虚得到好处。”
          - ancient: 忧劳可以兴国，逸豫可以亡身，自然之理也。
            vernacular: 忧患与勤劳可以使国家兴盛，贪图安逸享乐可丧失性命，这是很自然的道理。
          - ancient: 故方其盛也，举天下之豪杰莫能与之争；
            vernacular: 所以当庄宗气势旺盛时，天下所有豪杰无人能同他对抗，
          - ancient: 及其衰也，数十伶人困之，而身死国灭，为天下笑。
            vernacular: 等到衰败时，几十个伶人就可使他命丧国亡，为天下人所耻笑。
          - ancient: 夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！
            vernacular: 可见祸患常常是由微小的事情积累而成的，聪明勇敢的人反而常被所溺爱的人或事困扰，难道仅仅是伶人的事吗？
          - ancient: 作《伶官传》。
            vernacular: 于是作《伶官传》。
  - poem: 石钟山记
    type: 文言文选必
    author: 苏轼
    created_at: 北宋
    paragraphs:
      - paragraph: 《水
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 《水经》云：“彭蠡之口有石钟山焉。”
            vernacular: 《水经》说：“鄱阳湖的湖口有一座石钟山在那里。”
          - ancient: 郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。
            vernacular: 郦道元认为石钟山下面靠近深潭，微风振动波浪，水和石头互相拍打，发出的声音好像大钟一般。
          - ancient: 是说也，人常疑之。
            vernacular: 这个说法，人们常常怀疑它。
          - ancient: 今以钟磬置水中，虽大风浪不能鸣也，而况石乎！
            vernacular: 如果把钟磬放在水中，即使大风大浪也不能使它发出声响，何况是石头呢！
          - ancient: 至唐李渤始访其遗踪，得双石于潭上，
            vernacular: 到了唐代李渤才访求石钟山的旧址。在深潭边找到两块山石，
          - ancient: 扣而聆之，南声函胡，北音清越，
            vernacular: 敲击它们，聆听它们的声音，南边那座山石的声音重浊而模糊，北边那座山石的声音清脆而响亮，
          - ancient: 桴止响腾，余韵徐歇。
            vernacular: 鼓槌停止了敲击，声音还在传播，余音慢慢地消失。
          - ancient: 自以为得之矣。
            vernacular: 他自己认为找到了这个石钟山命名的原因。
          - ancient: 然是说也，余尤疑之。
            vernacular: 但是这个说法，我更加怀疑。
          - ancient: 石之铿然有声者，所在皆是也，而此独以钟名，何哉？
            vernacular: 敲击后能发出声响的石头，到处都这样，可唯独这座山用钟来命名，这是为什么呢？
      - paragraph: 元丰
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。
            vernacular: 元丰七年六月初九，我从齐安坐船到临汝去，大儿子苏迈将要去就任饶州的德兴县的县尉，我送他到湖口，因而能够看到所说的石钟山。
          - ancient: 寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉，余固笑而不信也。
            vernacular: 庙里的和尚让小童拿着斧头，在乱石中间选一两处敲打它，硿硿地发出声响，我当然觉得很好笑并不相信。
          - ancient: 至莫夜月明，独与迈乘小舟，至绝壁下。
            vernacular: 到了晚上月光明亮，特地和苏迈坐着小船到断壁下面。
          - ancient: 大石侧立千尺，如猛兽奇鬼，森然欲搏人；
            vernacular: 巨大的山石倾斜地立着，有千尺之高，好像凶猛的野兽和奇异的鬼怪，阴森森地想要攻击人；
          - ancient: 而山上栖鹘，闻人声亦惊起，磔磔云霄间；
            vernacular: 山上宿巢的老鹰，听到人声也受惊飞起来，在云霄间发出磔磔声响；
          - ancient: 又有若老人咳且笑于山谷中者，或曰此鹳鹤也。
            vernacular: 又有像老人在山谷中咳嗽并且大笑的声音，有人说这是鹳鹤。
          - ancient: 余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。
            vernacular: 我正心惊想要回去，忽然巨大的声音从水上发出，声音洪亮像不断地敲钟击鼓。
          - ancient: 舟人大恐。
            vernacular: 船夫很惊恐。
          - ancient: 徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。
            vernacular: 我慢慢地观察，山下都是石穴和缝隙，不知它们有多深，细微的水波涌进那里面，水波激荡因而发出这种声音。
          - ancient: 舟回至两山间，将入港口，有大石当中流，可坐百人，
            vernacular: 船回到两山之间，将要进入港口，有块大石头正对着水的中央，上面可坐百来个人，
          - ancient: 空中而多窍，与风水相吞吐，有窾坎镗鞳之声，
            vernacular: 中间是空的，而且有许多窟窿，把清风水波吞进去又吐出来，发出窾坎镗鞳的声音，
          - ancient: 与向之噌吰者相应，如乐作焉。
            vernacular: 同先前噌吰的声音相互应和，好像音乐演奏。
          - ancient: 因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。
            vernacular: 于是我笑着对苏迈说：“你知道那些典故吗？那噌吰的响声，是周景王无射钟的声音，窾坎镗鞳的响声，是魏庄子歌钟的声音。
          - ancient: 古之人不余欺也！”
            vernacular: 古人没有欺骗我啊！”
      - paragraph: 事不
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 事不目见耳闻，而臆断其有无，可乎？
            vernacular: 任何的事情不用眼睛看不用耳朵听，只凭主观臆断去猜测它的有或没有，可以吗？
          - ancient: 郦元之所见闻，殆与余同，而言之不详；
            vernacular: 郦道元所看到的、所听到的，大概和我一样，但是描述它不详细；
          - ancient: 士大夫终不肯以小舟夜泊绝壁之下，故莫能知；
            vernacular: 士大夫终究不愿用小船在夜里在悬崖绝壁的下面停泊，所以没有谁能知道；
          - ancient: 而渔工水师虽知而不能言。
            vernacular: 渔人和船夫，虽然知道石钟山命名的真相却不能用文字记载。
          - ancient: 此世所以不传也。
            vernacular: 这就是世上没有流传下来石钟山得名由来的原因。
          - ancient: 而陋者乃以斧斤考击而求之，自以为得其实。
            vernacular: 然而浅陋的人竟然用斧头敲打石头来寻求石钟山得名的原因，自以为得到了石钟山命名的真相。
          - ancient: 余是以记之，盖叹郦元之简，而笑李渤之陋也。
            vernacular: 我因此记下以上的经过，叹惜郦道元的简略，嘲笑李渤的浅陋。
  - poem: 登泰山记
    type: 文言文选必
    author: 姚鼐
    created_at: 清乾隆三十九年
    paragraphs:
      - paragraph: 泰山之
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 泰山之阳，汶水西流；其阴，济水东流。
            vernacular: 泰山的南面，汶河向西流去；泰山的北面，济水向东流去。
          - ancient: 阳谷皆入汶，阴谷皆入济。
            vernacular: 南面山谷的水都流入汶水，北面山谷的水都流入济水。
          - ancient: 当其南北分者，古长城也。
            vernacular: 处在那阳谷和阴谷南北分界处的，是古代春秋时期齐国所筑长城的遗址。
          - ancient: 最高日观峰，在长城南十五里。
            vernacular: 最高的日观峰，在古长城以南十五里。
      - paragraph: 余以
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。
            vernacular: 我在乾隆三十九年十二月从京城里出发，冒着风雪启程，经过齐河县、长清县，穿过泰山西北面的山谷，跨过长城的城墙，到达泰安。
          - ancient: 是月丁未，与知府朱孝纯子颍由南麓登。
            vernacular: 这月28日，我和泰安知府朱孝纯从南边的山脚登山。
          - ancient: 四十五里，道皆砌石为磴，其级七千有余。
            vernacular: 攀行四十五里远，道路都是石板砌成的石级，那些台阶共有七千多级。
      - paragraph: 泰山正
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 泰山正南面有三谷。
            vernacular: 泰山正南面有三条水道，
          - ancient: 中谷绕泰安城下，郦道元所谓环水也。
            vernacular: 其中中谷的水环绕泰安城，这就是郦道元书中所说的环水。
          - ancient: 余始循以入，道少半，越中岭，复循西谷，遂至其巅。
            vernacular: 我起初顺着中谷进去。沿着小路走了不到一半，翻过中岭，再沿着西边的水道走，就到了泰山的巅顶。
          - ancient: 古时登山，循东谷入，道有天门。
            vernacular: 古时候登泰山，沿着东边的水道进入，道路中有座天门。
          - ancient: 东谷者，古谓之天门溪水，余所不至也。
            vernacular: 这东边的山谷，古时候称它为“天门溪水”，是我没有到过的。
          - ancient: 今所经中岭及山巅，崖限当道者，世皆谓之天门云。
            vernacular: 现在我经过的中岭和山顶，挡在路上的像门槛一样的山崖，世上人都称它为“天门”。
          - ancient: 道中迷雾冰滑，磴几不可登。
            vernacular: 一路上大雾弥漫、冰冻溜滑，石阶几乎无法攀登。
          - ancient: 及既上，苍山负雪，明烛天南；
            vernacular: 等到已经登上山顶，只见青山上覆盖着白雪，雪光照亮了南面的天空。
          - ancient: 望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。
            vernacular: 远望夕阳映照着泰安城，汶水、徂徕山就像是一幅美丽的山水画，停留在半山腰处的云雾，又像是一条舞动的飘带似的。
      - paragraph: 戊申
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 戊申晦，五鼓，与子颍坐日观亭，待日出。
            vernacular: 戊申这一天是月底，五更的时候，我和子颖坐在日观亭里，等待日出。
          - ancient: 大风扬积雪击面。
            vernacular: 这时大风扬起的积雪扑面打来。
          - ancient: 亭东自足下皆云漫。
            vernacular: 日观亭东面从脚底往下一片云雾弥漫，
          - ancient: 稍见云中白若摴蒱数十立者，山也。
            vernacular: 依稀可见云中几十个白色的像骰子似的东西，那是山峰。
          - ancient: 极天云一线异色，须臾成五采。
            vernacular: 天边的云彩形成一条线呈现出奇异的颜色，一会儿又变成五颜六色的。
          - ancient: 日上，正赤如丹，下有红光，动摇承之。
            vernacular: 太阳升上来了，红的像朱砂一样，下面有红光晃动摇荡着托着它。
          - ancient: 或曰，此东海也。
            vernacular: 有人说，这是东海。
          - ancient: 回视日观以西峰，或得日，或否，绛皓驳色，而皆若偻。
            vernacular: 回头看日观峰以西的山峰，有的被日光照到，有的没照到，或红或白，颜色错杂，都像弯腰曲背鞠躬致敬的样子。
      - paragraph: 亭西
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 亭西有岱祠，又有碧霞元君祠；皇帝行宫在碧霞元君祠东。
            vernacular: 日观亭西面有一座东岳大帝庙，又有一座碧霞元君庙。皇帝出外巡行时居住的处所就在碧霞元君庙的东面。
          - ancient: 是日观道中石刻，自唐显庆以来，其远古刻尽漫失。
            vernacular: 这一天，还观看了路上的石刻，都是从唐朝显庆年间以来的，那些更古老的石碑都已经模糊或缺失了。
          - ancient: 僻不当道者，皆不及往。
            vernacular: 那些偏僻不对着道路的石刻，都赶不上去看了。
      - paragraph: 山多
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - ancient: 山多石，少土；
            vernacular: 山上石头多，泥土少。
          - ancient: 石苍黑色，多平方，少圜。
            vernacular: 山石都呈青黑色，大多是平的、方形的，很少有圆形的。
          - ancient: 少杂树，多松，生石罅，皆平顶。
            vernacular: 杂树很少，多是松树，松树都生长在石头的缝隙里，树顶是平的。
          - ancient: 冰雪，无瀑水，无鸟兽音迹。
            vernacular: 冰天雪地，没有瀑布，没有飞鸟走兽的声音和踪迹。
          - ancient: 至日观数里内无树，而雪与人膝齐。
            vernacular: 日观峰附近几里以内没有树木，积雪厚得同人的膝盖一样平齐。
          - ancient: 桐城姚鼐记。
            vernacular: 桐城姚鼐记述。
  - poem: 《老子》上善若水
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 上善
        url: https://zhuanlan.zhihu.com/p/149481251
        sentences:
          - ancient: 上善若水。
            vernacular: 最好的“善”像水一样。
          - ancient: 水善利万物而不争，处众人之所恶， 故几于道。
            vernacular: 滋润万物而不争，总是处于人们所厌恶的地方，这接近于“道”的特点。
          - ancient: 居善地；
            vernacular: 居住善于选择，
          - ancient: 心善渊；
            vernacular: 存心幽深而明澈，
          - ancient: 与善仁；
            vernacular: 待人真诚友爱，
          - ancient: 言善信；
            vernacular: 言行如一讲信用，
          - ancient: 政善治；
            vernacular: 为政精于治理，
          - ancient: 事善能；
            vernacular: 做事发挥特长，
          - ancient: 动善时。
            vernacular: 行动把握时机。
          - ancient: 夫唯不争，故无尤。
            vernacular: 正因为有不争的美德，所以没有过失，不犯错误。
  - poem: 《老子》五色令人目盲
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 五色
        url: https://zhuanlan.zhihu.com/p/150341039
        sentences:
          - ancient: 五色令人目盲，
            vernacular: 缤纷色彩，令人眼花缭乱；
          - ancient: 五音令人耳聋，
            vernacular: 纷繁音乐，令人听觉不灵；
          - ancient: 五味令人口爽，
            vernacular: 丰厚饮食，令人味觉迟钝；
          - ancient: 驰骋畋猎令人心发狂，难得之货令人行妨。
            vernacular: 纵马驰骋围猎，令人心疯狂；稀罕器物，令人操行变坏。
          - ancient: 是以圣人为腹不为目。
            vernacular: 因此，有道的人只求安饱而不纵情声色，摒弃物欲的诱惑而安守内心宁静。
          - ancient: 故去彼取此。
            vernacular: 所以面对外界的诱惑，要有所取舍。
  - poem: 《老子》古之善为士者
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 古之
        url: https://zhuanlan.zhihu.com/p/150800406
        sentences:
          - ancient: 古之善为士者，微妙玄通，深不可识。
            vernacular: 古时候懂得“道”的人，微妙幽深而通达权变，令人难以识别。
          - ancient: 夫唯不可识，故强为之容﹕
            vernacular: 正因为难以识别，所以只好勉强来形容。
          - ancient: 豫兮若冬涉川，
            vernacular: 他们小心谨慎，像冬天里踏冰过河。
          - ancient: 犹兮若畏四邻，
            vernacular: 警惕疑惧，像随时提防周围攻击。
          - ancient: 俨兮其若客，
            vernacular: 庄重严肃，像是在做客。
          - ancient: 涣兮若冰之将释，
            vernacular: 融和温暖，像冰雪消融。
          - ancient: 敦兮其若朴，
            vernacular: 敦厚质朴，像未琢之璞玉。
          - ancient: 旷兮其若谷，
            vernacular: 豁达空灵，像深山之幽谷。
          - ancient: 浑兮其若浊。
            vernacular: 浑朴厚道，像江水之混浊。
          - ancient: 孰能浊以静之徐清﹖
            vernacular: 谁能在混浊中安静下来，保持内心澄明？
          - ancient: 孰能安以久动之徐生﹖
            vernacular: 谁能在长久的安定中变动起来，渐渐前进？
          - ancient: 保此道者不欲盈，
            vernacular: 懂得“道”的人，不求圆满。
          - ancient: 夫唯不盈，故能蔽不新成。
            vernacular: 正因为不求圆满，所以看似保守，却能不断取得成功。
  - poem: 《老子》曲则全
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 曲则
        url: https://zhuanlan.zhihu.com/p/154463465
        sentences:
          - ancient: 曲则全，枉则直。
            vernacular: 弯曲反能保全，委屈反能伸直。
          - ancient: 洼则盈，敝则新。
            vernacular: 低洼反能满盈，破旧反能更新。
          - ancient: 少则得，多则惑。
            vernacular: 少取反能多得，贪多反而迷惑。
          - ancient: 是以圣人抱一，为天下式。
            vernacular: 所以，有道的圣人坚守大道，作为天下的楷模。
          - ancient: 不自见故明，不自是故彰，
            vernacular: 不自我表现反而得到表现，不自以为是反而能够彰显，
          - ancient: 不自伐故有功，不自矜故长。
            vernacular: 不自我夸耀能有功劳，不自高自大所以能够长久。
          - ancient: 夫唯不争，故天下莫能与之争。
            vernacular: 正因为不跟人争，天下没谁能与他争。
          - ancient: 古之所谓曲则全者，岂虚言哉！
            vernacular: 古人所说“曲则全”，难道是假话呢？
          - ancient: 诚全而归之。
            vernacular: 确实能够让他保全。
  - poem: 《老子》跂者不立
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 企者
        url: https://zhuanlan.zhihu.com/p/156881173
        sentences:
          - ancient: 企者不立，跨者不行。
            vernacular: 踮起脚尖走路的人会站不稳，跨步前行的人反而走不快。
          - ancient: 自见者不明，自是者不彰，
            vernacular: 自我张显的人不明于道，自以为是的人不善辨析，
          - ancient: 自伐者无功，自矜者不长。
            vernacular: 自我夸耀的人少有功劳，自高自大的人不能长久。
          - ancient: 其在道也，曰余食赘行，物或恶之。
            vernacular: 以“道”的观点来看上面的行为，可以说：“多余的饮食和累赘的行为，鬼神都会厌恶。”
          - ancient: 故有道者不处。
            vernacular: 所以有“道”的人是不这样做的。
  - poem: 《老子》善行无辙迹
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 善行
        url: https://zhuanlan.zhihu.com/p/157882759
        sentences:
          - ancient: 善行无辙迹，
            vernacular: 善于行走的不留痕迹，
          - ancient: 善言无瑕谪，
            vernacular: 善于言谈的不说错话，
          - ancient: 善数不用筹策，
            vernacular: 善于计算的不用筹策，
          - ancient: 善闭无关楗而不可开，
            vernacular: 善于关闭的不用栓梢却不可打开，
          - ancient: 善结无绳约而不可解。
            vernacular: 善于捆缚的不用绳索却不可松解。
          - ancient: 是以圣人常善救人，故无弃人；
            vernacular: 因此，圣人总是善于做到人尽其才，没有被遗弃的人；
          - ancient: 常善救物，故无弃物，是谓“袭明”。
            vernacular: 圣人总是善于做到物尽其用，没有被废弃的东西，这可以说是含而不露的智慧。
          - ancient: 故善人者，不善人之师；不善人者，善人之资。
            vernacular: 所以，善人可以作为恶人的师范，恶人可以做善人的借鉴。
          - ancient: 不贵其师，不爱其资，虽智大迷，是谓“要妙”。
            vernacular: 不懂得标榜师范，不懂得善于借鉴，虽然对善与不善理解很深，自以为聪明，其实是糊涂，这就是精要玄妙的道理。
  - poem: 《老子》知人者智
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 知人
        url: https://zhuanlan.zhihu.com/p/159448745
        sentences:
          - ancient: 知人者智，自知者明。
            vernacular: 认识别人可以说是智慧，了解自己才算高明。
          - ancient: 胜人者有力，自胜者强。
            vernacular: 战胜别人算是有力，战胜自己才算刚强。
          - ancient: 知足者富，强行者有志。
            vernacular: 知足常乐就是富有，身体力行就是有志。
          - ancient: 不失其所者久，死而不亡者寿。
            vernacular: 不离失道的根基才能持久，身死而精神长存才是永生。
  - poem: 《老子》信言不美
    type: 文言文选修
    author: 老子
    created_at: 春秋末期
    paragraphs:
      - paragraph: 信言
        url: https://baike.baidu.com/item/%E4%BF%A1%E8%A8%80%E4%B8%8D%E7%BE%8E/2246448
        sentences:
          - ancient: 信言不美，美言不信。
            vernacular: 真实的话听起来不好听，听起来好听的话不真实；
          - ancient: 善者不辩，辩者不善。
            vernacular: 行为良善的人不狡辩，狡辩的人不善良。
          - ancient: 知者不博，博者不知。
            vernacular: 真正有学问的人，知道学海无涯，因为处处虚心向别人请教。一知半解的人，以为自己什么都知道，到处卖弄自己。
          - ancient: 圣人不积，既以为人己愈有，既以与人己愈多。
            vernacular: 圣人没有私心，什么都无保留，他尽量帮助别人，自己反而很充足。
          - ancient: 天之道，利而不害；圣人之道，为而不争。
            vernacular: 圣人顺天而行，只有贡献施与，不和人家争夺。
  - poem: 季氏将伐颛臾 《论语》
    type: 文言文选修
    author: 孔子及其弟子
    created_at: 战国
    paragraphs:
      - paragraph: 季氏
        url: https://baike.baidu.com/item/%E5%AD%A3%E6%B0%8F%E5%B0%86%E4%BC%90%E9%A2%9B%E8%87%BE
        sentences:
          - ancient: 季氏将伐颛臾。
            vernacular: 季孙氏将要讨伐颛臾。
          - ancient: 冉有、季路见于孔子曰：“季氏将有事于颛臾。”
            vernacular: 冉有、季路拜见孔子说：“季孙氏准备对颛臾采取军事行动。”
          - ancient: 孔子曰：“求！无乃尔是过与？
            vernacular: 孔子说：“冉有！我恐怕该责备你了。
          - ancient: 夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。
            vernacular: 那颛臾，从前先王把他当作主管东蒙山祭祀的人，而且它地处鲁国境内。这是鲁国的臣属，
          - ancient: 何以伐为？”
            vernacular: 为什么要讨伐它呢？”
          - ancient: 冉有曰：“夫子欲之，吾二臣者皆不欲也。”
            vernacular: 冉有说：“季孙要这么干，我们两个做臣下的都不愿意。”
          - ancient: 孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’
            vernacular: 孔子说：“冉有！周任有句话说：‘能施展才能就担任那职位，不能这样做则不担任那职务。’
          - ancient: 危而不持，颠而不扶，则将焉用彼相矣？且尔言过矣。
            vernacular: 盲人遇到危险却不去护持，将要跌倒却不去搀扶，那何必要用那个做相的人呢？况且你的话错了，
          - ancient: 虎兕出于柙，龟玉毁于椟中，是谁之过与？”
            vernacular: 老虎和犀牛从笼子里跑出，龟甲和玉器在匣子里被毁坏，这是谁的过错呢？”
          - ancient: 冉有曰：“今夫颛臾，固而近于费。
            vernacular: 冉有说：“如今颛臾城墙坚固而且靠近费城，
          - ancient: 今不取，后世必为子孙忧。”
            vernacular: 现在不夺取，后世一定会成为子孙们的忧虑。”
          - ancient: 孔子曰：“求！君子疾夫舍曰欲之而必为之辞。
            vernacular: 孔子说：“冉有！君子厌恶那种不说自己想去做却偏要编造借口来搪塞态度的人。
          - ancient: 丘也闻有国有家者，不患寡而患不均，不患贫而患不安。
            vernacular: 我听说士大夫都有自己的封地，他们不怕财富不多而怕分配不均匀，不怕民众不多而怕不安定。
          - ancient: 盖均无贫，和无寡，安无倾。
            vernacular: 财物分配公平合理，就没有贫穷；上下和睦，就不必担心人少；社会安定，国家就没有倾覆的危险。
          - ancient: 夫如是，故远人不服，则修文德以来之。
            vernacular: 依照这个道理，原来的远方的人不归服，就发扬文治教化来使他归服；
          - ancient: 既来之，则安之。
            vernacular: 使他来了之后，就要使他安定下来。
          - ancient: 今由与求也，相夫子，远人不服、而不能来也；
            vernacular: 如今由与求两人辅佐季孙，远方的人不归服，却不能使他们来；
          - ancient: 邦分崩离析、而不能守也：而谋动干戈于邦内。
            vernacular: 国家四分五裂而不能保持它的稳定统一；反而在境内策划兴起干戈。
          - ancient: 吾恐季孙之忧，不在颛臾，而在萧墙之内也。”
            vernacular: 我恐怕季孙氏的忧虑，不在颛臾，而是在鲁国内部。”
  - poem: 《大学》出自《礼记》
    type: 文言文选修
    author: 曾子
    created_at: 春秋末期
    paragraphs:
      - paragraph: xxxx
        url: https://baike.baidu.com/item/%E5%A4%A7%E5%AD%A6/5655065
        sentences:
          - ancient: 古之欲明明德于天下者，先治其国。
            vernacular: 在古代，意欲将高尚的德行弘扬于天下的人，则先要治理好自己的国家；
          - ancient: 欲治其国者，先齐其家。
            vernacular: 意欲治理好自己国家的人，则先要调整好自己的家庭；
          - ancient: 欲齐其家者，先修其身。
            vernacular: 意欲调整好自己家庭的人，则先要修养好自身的品德；
          - ancient: 欲修其身者，先正其心。
            vernacular: 意欲修养好自身品德的人，则先要端正自己的心意；
          - ancient: 欲正其心者，先诚其意。
            vernacular: 意欲端正自己心意的人，则先要使自己的意念真诚；
          - ancient: 欲诚其意者，先致其知。
            vernacular: 意欲使自己意念真诚的人，则先要获取知识；
          - ancient: 致知在格物。
            vernacular: 获取知识的途径则在于探究事理。
          - ancient: 物格而后知至，知至而后意诚，
            vernacular: 探究事理后才能获得正确认识，认识正确后才能意念真诚，
          - ancient: 意诚而后心正，心正而后身修，
            vernacular: 意念真诚后才能端正心意，心意端正后才能修养好品德，
          - ancient: 身修而后家齐，家齐而后国治，
            vernacular: 品德修养好后才能调整好家族，家族调整好后才能治理好国家，
          - ancient: 国治而后天下平。
            vernacular: 国家治理好后才能使天下太平。
          - ancient: 自天子以至于庶人，壹是皆以修身为本。
            vernacular: 从天子到普通百姓，都要把修养品德作为根本。
          - ancient: 其本乱而末治者否矣。
            vernacular: 人的根本败坏了，末节反倒能调理好，这是不可能的。
          - ancient: 其所厚者薄，而其所薄者厚，未之有也。
            vernacular: 正像我厚待他人，他人反而慢待我；我慢待他人，他人反而厚待我这样的事情，还未曾有过。
          - ancient: 此谓知本，此谓知之至也。
            vernacular: 这就叫知道了根本，这就是认知的最高境界。
  - poem: 《中庸》出自《礼记》
    type: 文言文选修
    author: 子思
    created_at: 战国时期
    paragraphs:
      - paragraph: 喜怒
        url: https://baike.baidu.com/item/%E4%B8%AD%E5%BA%B8/5700593
        sentences:
          - ancient: 喜怒哀乐之未发，谓之中；
            vernacular: 喜怒哀乐的情绪没有表露出来，这叫做中。
          - ancient: 发而皆中节，谓之和；
            vernacular: 表露出来但合干法度，这叫做和。
          - ancient: 中也者，天下之大本也；
            vernacular: 中是天下最为根本的，
          - ancient: 和也者，天下之达道也。
            vernacular: 和是天下共同遵循的法度。
          - ancient: 致中和，天地位焉，万物育焉。
            vernacular: 达到了中和，天地便各归其位，万物便生长发育了。
          - ancient: 博学之，审问之，慎思之，明辨之，笃行之。
            vernacular: 要广泛地学习，仔细地询问，审慎地思考，清晰地分辨，忠实地实践。
          - ancient: 有弗学，学之弗能，弗措也；
            vernacular: 要么就不学，学了没有学会就不中止。
          - ancient: 有弗问，问之弗知，弗措也；
            vernacular: 要么就不问，问了还不明白就不中止。
          - ancient: 有弗思，思之弗得，弗措也；
            vernacular: 要么就不思考，思考了不懂得就不中止。
          - ancient: 有弗辨，辨之弗明，弗措也；
            vernacular: 要么就不辨别，辨别了不分明就不中止。
          - ancient: 有弗行，行之弗笃，弗措也。
            vernacular: 要么就不实行，实行了但不够忠实就不中止。
          - ancient: 人一能之己百之，人十能之己千之。
            vernacular: 别人一次能做的，我用百倍的工夫，别人十次能做的，我用千倍的工夫。
  - poem: 《孟子》一则
    type: 文言文选修
    author: 孟子
    created_at: 战国时期
    paragraphs:
      - paragraph: 敢问
        url: https://baike.baidu.com/item/%E6%95%A2%E9%97%AE%E5%A4%AB%E5%AD%90%E6%81%B6%E4%B9%8E%E9%95%BF
        sentences:
          - ancient: “敢问夫子恶乎长？”
            vernacular: 公孙丑说：“请问老师您长于哪一方面呢？”
          - ancient: 曰：“我知言，我善养吾浩然之气。”
            vernacular: 孟子说：“我善于分析别人的言语，我善于培养自己的浩然之气。”
          - ancient: “敢问何谓浩然之气？”
            vernacular: 公孙丑说：“请问什么叫浩然之气呢？”
          - ancient: 曰：“难言也。
            vernacular: 孟子说：“这很难用一两句话说清楚。
          - ancient: 其为气也，至大至刚，以直养而无害，则塞于天地之间。
            vernacular: 这种气，极端浩大，极端有力量，用正直去培养它而不加以伤害，就会充满天地之间。
          - ancient: 其为气也，配义与道；无是，馁也。
            vernacular: 不过，这种气必须与仁义道德相配，否则就会缺乏力量。
          - ancient: 是集义所生者，非义袭而取之也。
            vernacular: 而且，必须要有经常性的仁义道德蓄养才能生成，而不是靠偶尔的正义行为就能获取的。
          - ancient: 行有不慊于心，则馁矣。
            vernacular: 一旦你的行为问心有愧，这种气就会缺乏力量了。
          - ancient: 我故曰，告子未尝知义，以其外之也。
            vernacular: 所以我说，告子不懂得义，因为他：把义看成心外的东西。
          - ancient: 必有事焉，而勿正；
            vernacular:  我们一定要不断地培养义，
          - ancient: 心勿忘，勿助长也，无若宋人然。
            vernacular:  心中不要忘记，但也不要一厢情愿地去帮助它生长。不要像宋人一样：
          - ancient: 宋人有闵其苗之不长而揠之者，
            vernacular: 宋国有个人嫌他种的禾苗老是长不高， 于是到地里去用手把它们一株一株地拔高，
          - ancient: 芒芒然归，谓其人曰：‘今日病矣！予助苗长矣！’
            vernacular: 累得气喘吁吁地回家， 对他家里人说：‘今天可真把我累坏啦！不过，我总算让禾苗一下子就长高了！’
          - ancient: 其子趋而往视之，苗则槁矣。
            vernacular: 他的儿子跑到地里去一看，禾苗已全部于死了。
          - ancient: 天下之不助苗长者寡矣。
            vernacular: 天下人不犯这种拔苗助长错误的是很少的。
          - ancient: 以为无益而舍之者，不耘苗者也；
            vernacular: 认为养护庄稼没有用处而不去管它们的，是只种庄稼不除草的懒汉；
          - ancient: 助之长者，揠苗者也——非徒无益，而又害之。”
            vernacular: 一厢情愿地去帮助庄稼生长的，就是这种拔苗助长的人－－不仅没有益处，反而害死了庄稼。”
      - paragraph: 何谓
        url: https://baike.baidu.com/item/%E6%95%A2%E9%97%AE%E5%A4%AB%E5%AD%90%E6%81%B6%E4%B9%8E%E9%95%BF
        sentences:
          - ancient: “何谓知言？”
            vernacular: 公孙丑问：“怎样才算善于分析别人的言语呢？”
          - ancient: 曰：“辞知其所蔽，
            vernacular: 孟子回答说：“偏颇的言语知道它片面在哪里；
          - ancient: 淫辞知其所陷，
            vernacular: 夸张的言语知道它过分在哪里；
          - ancient: 邪辞知其所离，
            vernacular: 怪僻的言语知道它离奇在哪里；
          - ancient: 遁辞知其所穷——生于其心，害于其政；
            vernacular: 躲闪的言语知道它理穷在哪里。－－从心里产生，必然会对政治造成危害，
          - ancient: 发于其政，害于其事。
            vernacular: 用于政治，必然会对国家大事造成危害。
          - ancient: 圣人复起，必从吾言矣。”
            vernacular: 如果圣人再世，也一定会同意我的话。”
  - poem: 逍遥游《庄子》
    type: 文言文选修
    author: 庄周
    created_at: 战国时期
    paragraphs:
      - paragraph: 惠子
        url: https://baike.baidu.com/item/%E9%80%8D%E9%81%A5%E6%B8%B8/1506
        sentences:
          - ancient: 惠子谓庄子曰：“魏王贻我大瓠之种，我树之成，而实五石。
            vernacular: 惠子对庄子说：“魏王送给我大葫芦的种子，我种下后结出的葫芦大得可以容纳五石。
          - ancient: 以盛水浆，其坚不能自举也。
            vernacular: 用它来盛水，它却因质地太脆无法提举。
          - ancient: 剖之以为瓢，则瓠落无所容。
            vernacular: 切开它当瓠，又大而平浅无法容纳东西。
          - ancient: 非不呺然大也，吾为其无用而掊之。”
            vernacular: 我不是嫌它不大，只是因为它无用，我把它砸了。”
          - ancient: 庄子曰：“夫子固拙于用大矣。
            vernacular: 庄子说：“你真不善于使用大的物件。
          - ancient: 宋人有善为不龟手之药者，世世以洴澼絖为事。
            vernacular: 宋国有个人善于制作防止手冻裂的药，他家世世代代都以漂洗丝絮为职业。
          - ancient: 客闻之，请买其方百金。
            vernacular: 有个客人听说了，请求用一百金来买他的药方。
          - ancient: 聚族而谋曰：‘我世世为洴澼絖，不过数金，
            vernacular: 这个宋国人召集全家商量说：‘我家世世代代靠这种药从事漂洗丝絮，一年所得不过数金；
          - ancient: 今一朝而鬻技百金，请与之。’
            vernacular: 现在一旦卖掉这个药方马上可得百金，请大家答应我卖掉它。’
          - ancient: 客得之，以说吴王。
            vernacular: 这个客人买到药方，就去游说吴王。
          - ancient: 越有难，吴王使之将，冬，与越人水战，大败越人。
            vernacular: 那时正逢越国有难，吴王就命他为将，在冬天跟越国人展开水战，大败越人，
          - ancient: 裂地而封之。
            vernacular: 吴王就割地封侯来奖赏他。
          - ancient: 能不龟手一也，或以封，
            vernacular: 同样是一帖防止手冻裂的药方，有人靠它得到封赏，
          - ancient: 或不免于洴澼絖，则所用之异也。
            vernacular: 有人却只会用于漂洗丝絮，这是因为使用方法不同啊。
          - ancient: 今子有五石之瓠，何不虑以为大樽，而浮于江湖，
            vernacular: 现在你有可容五石东西的大葫芦，为什么不把它系在身上作为腰舟而浮游于江湖呢？
          - ancient: 而忧其瓠落无所容？
            vernacular: 却担忧它大而无处可容纳，
          - ancient: 则夫子犹有蓬之心也夫！”
            vernacular: 可见你的心地过于浅陋狭隘了！”
  - poem: 谏逐客书 李斯
    type: 文言文选修
    author: 李斯
    created_at: 秦王政十年
    paragraphs:
      - paragraph: 臣闻吏
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
          - ancient: 臣闻吏议逐客，窃以为过矣。
            vernacular: 臣听说官吏议论驱逐列国入秦的游说之士，私下认为这是错误的。
          - ancient: 昔穆公求士，西取由余于戎，
            vernacular: 从前穆公访求贤士，西面从西戎得到了由余，
          - ancient: 东得百里奚于宛，
            vernacular: 东面从宛地得到了百里奚，
          - ancient: 迎蹇叔于宋，
            vernacular: 从宋国迎来了蹇叔，
          - ancient: 来丕豹、公孙支于晋。
            vernacular: 从晋国得来了丕豹、公孙支。
          - ancient: 此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。
            vernacular: 这五位人物，不出生在秦国，但穆公重用他们，兼并了二十个诸侯国，于是称霸西戎。
          - ancient: 孝公用商鞅之法，移风易俗，民以殷盛，国以富强，
            vernacular: 孝公采用商鞅的法令，移风易俗，人民因此富裕丰盛，国家因此富足强盛，
          - ancient: 百姓乐用，诸侯亲服，
            vernacular: 百姓乐于效力，诸侯亲近顺服，
          - ancient: 获楚、魏之师，举地千里，至今治强。
            vernacular: 俘获楚魏军队，攻占土地千里，国家至今安定强盛。
          - ancient: 惠王用张仪之计，拔三川之地，
            vernacular: 惠王采用张仪计谋，攻克三川之地，
          - ancient: 西并巴蜀，北收上郡，南取汉中，
            vernacular: 西面兼并巴蜀，北面收受上郡，南面轻取汉中，
          - ancient: 包九夷，制鄢郢，东据成皋之险，割膏腴之壤，
            vernacular: 统揽九夷之地，控制楚之鄢郢，东面占有成皋之险，割取肥美土地，
          - ancient: 遂散六国之从，使之西面事秦，功施到今。
            vernacular: 六国联盟罢休，迫使西来侍奉秦国，功绩延续到今天。
          - ancient: 昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。
            vernacular: 昭王得到范雎，废掉穰侯，放逐华阳君，加强国家权力，杜绝权豪之门，蚕食诸候国家，使秦国成就帝王之业。
          - ancient: 此四君者，皆以客之功。
            vernacular: 这四位国君，都是依靠客卿的功劳。
          - ancient: 由此观之，客何负于秦哉！
            vernacular: 由此看来，客卿有什么对不起秦国的呢？
          - ancient: 向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。
            vernacular: 假使四位国君拒绝客卿而不接纳，疏远贤士而不重用，这会使秦国没有富庶之实和强大之名了。
      - paragraph: 今陛
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
          - ancient: 今陛下致昆山之玉，有随和之宝，
            vernacular: 如今陛下得到了昆仑山的美玉，拥有随侯珠、和氏璧这样的宝物，
          - ancient: 垂明月之珠，服太阿之剑，
            vernacular: 悬挂着夜间光如明月的宝珠，佩戴着太阿宝剑，
          - ancient: 乘纤离之马，建翠凤之旗，
            vernacular: 骑着纤离骏马，立起用翠羽编成凤鸟形状所装饰的旗帜，
          - ancient: 树灵鼍之鼓。
            vernacular: 架起用灵鼍皮蒙成的鼓。
          - ancient: 此数宝者，秦不生一焉，而陛下说之，何也？
            vernacular: 这些宝物，秦国不出产一样，而陛下却喜欢它，为什么呢？
          - ancient: 必秦国之所生然后可，则是夜光之璧，不饰朝廷；
            vernacular: 一定要秦国出产的东西才可以用，那么夜光璧不能装饰朝廷；
          - ancient: 犀象之器，不为玩好；
            vernacular: 犀角、象牙做的器物不能成为赏玩嗜好之物；
          - ancient: 郑、卫之女不充后宫，而骏良駃騠不实外厩，
            vernacular: 郑国、卫国的女子不能充斥后宫；骏马驴骡不会充满外马房；
          - ancient: 江南金锡不为用，西蜀丹青不为采。
            vernacular: 江南的金器锡器不会被使用，西蜀的丹青不会作为绘画的颜料。
          - ancient: 所以饰后宫，充下陈，娱心意，说耳目者，必出于秦然后可，
            vernacular: 所以装饰后宫、充塞堂下、娱乐心情、好听好看的东西，一定要秦国出产的才可以，
          - ancient: 则是宛珠之簪，傅玑之珥，阿缟之衣，锦绣之饰不进于前，
            vernacular: 那么宛地珍珠装饰的头簪、附着珠玑的耳饰、东阿丝绸做成的衣服、织锦刺绣的饰品不会进献到您的面前；
          - ancient: 而随俗雅化，佳冶窈窕，赵女不立于侧也。
            vernacular: 而化俗为雅、宁静美丽的赵国女子不会站在您的身边。
          - ancient: 夫击瓮叩缶弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；
            vernacular: 那敲打着瓦器、弹着秦筝、拍着大腿呜呜唱歌呼叫而悦耳的，才是真正的秦国音乐。
          - ancient: 郑卫桑间、韶虞、武象者，异国之乐也。
            vernacular: 《郑》《卫》《桑间》《韶虞》《武象》这类乐曲，都是别国的音乐。
          - ancient: 今弃击瓮叩缶而就郑卫，退弹筝而取韶虞，若是者何也？
            vernacular: 现在抛弃了敲击瓦器而接受《郑》《卫》之音，屏退弹筝而求取《韶虞》，这样做是为什么呢？
          - ancient: 快意当前，适观而已矣。
            vernacular: 为了舒适称心于眼前，适合观赏罢了。
          - ancient: 今取人则不然。
            vernacular: 如今选取人才则不然，
          - ancient: 不问可否，不论曲直，非秦者去，为客者逐。
            vernacular: 不问可用不可用，不论是非曲直，不是秦国人都得离去，是客卿的一律驱逐。
          - ancient: 然则是所重者在乎色乐珠玉，而所轻者在乎人民也。
            vernacular: 这样看来，所重视的是美色、音乐、珍珠、玉器，而所轻视的是人民。
          - ancient: 此非所以跨海内、制诸侯之术也。
            vernacular: 这不是用来据有天下、控制诸侯的策略。
      - paragraph: 臣闻地
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
          - ancient: 臣闻地广者粟多，国大者人众，兵强则士勇。
            vernacular: 臣听说地域辽阔粮食就多，国家广大人口就多，军队强大士兵就勇敢。
          - ancient: 是以太山不让土壤，故能成其大；
            vernacular: 因此泰山不拒绝泥土，所以形成了它的高大；
          - ancient: 河海不择细流，故能就其深；
            vernacular: 河海不挑拣细流，所以成就了它的深广；
          - ancient: 王者不却众庶，故能明其德。
            vernacular: 帝王不拒绝众多的百姓，所以能使他的功德昭著。
          - ancient: 是以地无四方，民无异国，
            vernacular: 因此，地域不论东西南北，百姓不论异国他乡，
          - ancient: 四时充美，鬼神降福，此五帝三王之所以无敌也。
            vernacular: 一年四季充实美好，鬼神降恩赐福，这就是五帝三王之所以无敌的原因。
          - ancient: 今乃弃黔首以资敌国，却宾客以业诸侯，
            vernacular: 现在却抛弃百姓以帮助敌国，拒绝宾客去为诸侯成就功业，
          - ancient: 使天下之士退而不敢西向，裹足不入秦，
            vernacular: 让天下的贤士退却而不敢向西而来，裹足不前进入秦国，
          - ancient: 此所谓“藉寇兵而赍盗粮”者也。
            vernacular: 这就是所谓“借给敌人武器，送给盗贼粮食”。
      - paragraph: 夫物
        url: https://baike.baidu.com/item/%E8%B0%8F%E9%80%90%E5%AE%A2%E4%B9%A6
        sentences:
          - ancient: 夫物不产于秦，可宝者多；
            vernacular: 东西不是秦国出产的，可珍贵之物很多；
          - ancient: 士不产于秦，而愿忠者众。
            vernacular: 贤士不是秦国出生的，而愿效忠的很多。
          - ancient: 今逐客以资敌国，损民以益雠，
            vernacular: 如今驱逐客卿去帮助敌国，减少人民而对仇敌有益，
          - ancient: 内自虚而外树怨于诸侯，求国无危，
            vernacular: 使自己内部空虚而外部又跟诸侯结怨，要想国家没有危险，
          - ancient: 不可得也。
            vernacular: 那是不可能的。
  - poem: 兰亭集序
    type: 文言文选修
    author: 王羲之
    created_at: 东晋
    paragraphs:
      - paragraph: 永和
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
          - ancient: 永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。
            vernacular: 永和九年，时在癸丑之年，三月上旬，我们会集在会稽郡山阴城的兰亭，为了做禊事。
          - ancient: 群贤毕至，少长咸集。
            vernacular: 众多贤才都汇聚到这里，年龄大的小的都聚集在这里。
          - ancient: 此地有崇山峻岭，茂林修竹，
            vernacular: 兰亭这个地方有高峻的山峰，茂盛的树林，高高的竹子，
          - ancient: 又有清流激湍，映带左右。
            vernacular: 又有清澈湍急的溪流，辉映环绕在亭子的四周，
          - ancient: 引以为流觞曲水，列坐其次。
            vernacular: 我们引溪水作为流觞的曲水，排列坐在曲水旁边，
          - ancient: 虽无丝竹管弦之盛，一觞一咏，
            vernacular: 虽然没有演奏音乐的盛况，但喝点酒，作点诗，
          - ancient: 亦足以畅叙幽情。
            vernacular: 也足够来畅快叙述幽深内藏的感情了。
      - paragraph: 是日
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
          - ancient: 是日也，天朗气清，惠风和畅。
            vernacular: 这一天，天气晴朗，空气清新，和风温暖，
          - ancient: 仰观宇宙之大，
            vernacular: 仰首观览到宇宙的浩大，
          - ancient: 俯察品类之盛，
            vernacular: 俯看观察大地上众多的万物，
          - ancient: 所以游目骋怀，足以极视听之娱，
            vernacular: 用来舒展眼力，开阔胸怀，足够来极尽视听的欢娱，
          - ancient: 信可乐也。
            vernacular: 实在很快乐。
      - paragraph: 夫人
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
          - ancient: 夫人之相与，俯仰一世。
            vernacular: 人与人相互交往，很快便度过一生。
          - ancient: 或取诸怀抱，悟言一室之内；
            vernacular: 有的人在室内畅谈自己的胸怀抱负；
          - ancient: 或因寄所托，放浪形骸之外。
            vernacular: 有的人就着自己所爱好的事物，寄托情怀，放纵无羁地生活。
          - ancient: 虽趣舍万殊，静躁不同，当其欣于所遇，
            vernacular: 虽然各有各的爱好，安静与躁动各不相同，但当他们对所接触的事物感到高兴时，
          - ancient: 暂得于己， 快（怏）然自足，（曾）不知老之将至。
            vernacular: 一时感到自得。感到高兴和满足，竟然不知道衰老将要到来。
          - ancient: 及其所之既倦，情随事迁，感慨系之矣。
            vernacular: 等到对得到或喜爱的东西已经厌倦，感情随着事物的变化而变化，感慨随之产生。
          - ancient: 向之所欣，俯仰之间，
            vernacular: 过去所喜欢的东西，转瞬间，
          - ancient: 已为陈迹，犹不能不以之兴怀。
            vernacular: 已经成为旧迹，尚且不能不因为它引发心中的感触，
          - ancient: 况修短随化，终期于尽。
            vernacular: 况且寿命长短，听凭造化，最后归结于消灭。
          - ancient: 古人云：“死生亦大矣！”岂不痛哉！
            vernacular: 古人说：“死生毕竟是件大事啊。”怎么能不让人悲痛呢？
      - paragraph: 每览
        url: https://baike.baidu.com/item/%E5%85%B0%E4%BA%AD%E9%9B%86%E5%BA%8F/199614
        sentences:
          - ancient: 每览昔人兴感之由，若合一契，
            vernacular: 每当看到前人所发感慨的原因，其缘由像一张符契那样相和，
          - ancient: 未尝不临文嗟悼，不能喻之于怀。
            vernacular: 总难免要在读前人文章时叹息哀伤，不能明白于心。
          - ancient: 固知一死生为虚诞，齐彭殇为妄作。
            vernacular: 本来知道把生死等同的说法是不真实的，把长寿和短命等同起来的说法是妄造的。
          - ancient: 后之视今，亦犹今之视昔，悲夫！
            vernacular: 后人看待今人，也就像今人看待前人，可悲呀。
          - ancient: 故列叙时人，录其所述。
            vernacular: 所以一个一个记下当时与会的人，录下他们所作的诗篇。
          - ancient: 虽世殊事异，所以兴怀，其致一也。
            vernacular: 纵使时代变了，事情不同了，但触发人们情怀的原因，他们的思想情趣是一样的。
          - ancient: 后之览者，亦将有感于斯文。
            vernacular: 后世的读者，也将对这次集会的诗文有所感慨。
  - poem: 滕王阁序
    type: 文言文选修
    author: 王勃
    created_at: 唐代
    paragraphs:
      - paragraph: 豫章
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 豫章故郡，洪都新府。
            vernacular: 这里是汉代的南昌郡城，如今是洪州都督府，
          - ancient: 星分翼轸，地接衡庐。
            vernacular: 天上的方位属于翼、轸两星宿的分野，地上连结着衡山和庐山。
          - ancient: 襟三江而带五湖，控蛮荆而引瓯越。
            vernacular: 以三江为衣襟，以五湖为衣带，控制楚地，连接闽越。
          - ancient: 物华天宝，龙光射牛斗之墟；
            vernacular: 这里有物类精华、天产珍宝，宝剑的光芒直冲上牛、斗二星之间。
          - ancient: 人杰地灵，徐孺下陈蕃之榻。
            vernacular: 人中有英杰，大地有灵气，陈蕃专为徐孺设下几榻。
          - ancient: 雄州雾列，俊采星驰。
            vernacular: 雄伟的洪州城，房屋像雾般罗列，英俊的人才，像繁星一样活跃。
          - ancient: 台隍枕夷夏之交，宾主尽东南之美。
            vernacular: 城池座落在夷夏交界之地，主人与宾客，汇集了东南地区的青年才俊。
          - ancient: 都督阎公之雅望，棨戟遥临；
            vernacular: 都督阎公，享有崇高的名望，远道来到洪州坐镇；
          - ancient: 宇文新州之懿范，襜帷暂驻。
            vernacular: 宇文州牧，是美德的楷模，赴任途中在此暂留。
          - ancient: 十旬休假，胜友如云；
            vernacular: 正逢十旬休假的日子，杰出的朋友云集，
          - ancient: 千里逢迎，高朋满座。
            vernacular: 高贵的宾客，也都不远千里来此聚会，
          - ancient: 腾蛟起凤，孟学士之词宗；
            vernacular: 文坛领袖孟学士，其文采像腾起的蛟龙、飞舞的彩凤，
          - ancient: 紫电青霜，王将军之武库。
            vernacular: 王将军的武库里，藏有像紫电、青霜一样锋利的宝剑。
          - ancient: 家君作宰，路出名区；
            vernacular: 父亲在交趾做县令，我在探亲途中路过这方宝地；
          - ancient: 童子何知，躬逢胜饯。
            vernacular: 我年幼无知，竟然有幸亲自参加了这次盛大的宴会。
      - paragraph: 时维
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 时维九月，序属三秋。
            vernacular: 时值九月深秋，
          - ancient: 潦水尽而寒潭清，烟光凝而暮山紫。
            vernacular: 积水消尽，潭水清澈，云烟凝结在暮霭中，山峦呈现一片紫色。
          - ancient: 俨骖騑（𬴂）于上路，访风景于崇阿。
            vernacular: 在高高的山路上驾着马车，在崇山峻岭中访求风景，
          - ancient: 临帝子之长洲，得天人之旧馆。
            vernacular: 来到昔日帝子的长洲，找到仙人居住过的宫殿，
          - ancient: 层峦耸翠，上出重霄；
            vernacular: 这里山峦重叠，山峰耸入云霄。
          - ancient: 飞阁流丹，下临无地。
            vernacular: 凌空的楼阁，红色的阁道犹如飞翔在天空，从阁上看深不见底
          - ancient: 鹤汀凫渚，穷岛屿之萦回；
            vernacular: 白鹤、野鸭栖息的小洲，极尽岛屿的迂折回环之势，
          - ancient: 桂殿兰宫，即冈峦之体势。
            vernacular: 威严的宫殿，依照起伏的山峦而建。
      - paragraph: 披绣
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。
            vernacular: 打开雕花的阁门，俯视华美的屋脊。山峰平原尽收眼底，湖川曲折令人惊叹。
          - ancient: 闾阎扑地，钟鸣鼎食之家；
            vernacular: 房屋密集，不少富贵人家，
          - ancient: 舸舰弥津，青雀黄龙之舳。
            vernacular: 船只塞满了渡口，都是雕刻着青雀黄龙花纹的大船。
          - ancient: 云销雨霁，彩彻区明。
            vernacular: 雨过天晴，虹消云散，阳光朗照。
          - ancient: 落霞与孤鹜齐飞，秋水共长天一色。
            vernacular: 落霞与孤雁一起飞翔，秋水长天连成一片。
          - ancient: 渔舟唱晚，响穷彭蠡之滨，
            vernacular: 傍晚渔舟中传来歌声，响彻彭蠡湖滨，
          - ancient: 雁阵惊寒，声断衡阳之浦。
            vernacular: 雁群因寒意而长鸣，到衡阳岸边方止。
      - paragraph: 遥襟
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 遥襟甫畅，逸兴遄飞。
            vernacular: 放眼远望，心胸顿时舒畅，兴致兴起，
          - ancient: 爽籁发而清风生，纤歌凝而白云遏。
            vernacular: 排箫的音响引来了清风，柔缓的歌声令白云陶醉，
          - ancient: 睢园绿竹，气凌彭泽之樽；
            vernacular: 像在睢园竹林的聚会，宴会上的人酒量超过陶渊明，
          - ancient: 邺水朱华，光照临川之笔。
            vernacular: 像在邺水赞咏莲花，席上人的文采胜过谢灵运。
          - ancient: 四美具，二难并。
            vernacular: 良辰、美景、赏心、乐事这四种美好的事物都已经齐备，贤主、嘉宾千载难逢。
          - ancient: 穷睇眄于中天，极娱游于暇日。
            vernacular: 向天空中远眺，在假日里尽享欢娱，
          - ancient: 天高地迥，觉宇宙之无穷；
            vernacular: 天高地远，令人感到宇宙的无穷。
          - ancient: 兴尽悲来，识盈虚之有数。
            vernacular: 欢乐逝去，悲哀袭来，我想到了事物的兴衰成败是有定数的。
          - ancient: 望长安于日下，目吴会于云间。
            vernacular: 远望长安，东看吴会，
          - ancient: 地势极而南溟深，天柱高而北辰远。
            vernacular: 陆地的尽头是深不可测的大海，北斗星多么遥远，天柱山高不可攀。
          - ancient: 关山难越，谁悲失路之人；
            vernacular: 关山重重难以跨越，有谁同情不得志的人？
          - ancient: 萍水相逢，尽是他乡之客。
            vernacular: 萍水相逢，大家都是异乡之客。
          - ancient: 怀帝阍而不见，奉宣室以何年？
            vernacular: 心系朝廷，却不被召见，什么时候才能像贾谊那样去侍奉君王呢？
      - paragraph: 嗟乎
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 嗟乎！时运不齐，命途多舛。
            vernacular: 唉！命运不顺，路途艰险。
          - ancient: 冯唐易老，李广难封。
            vernacular: 冯唐容易老，李广封侯难。
          - ancient: 屈贾谊于长沙，非无圣主；
            vernacular: 把贾谊贬到长沙，并不是没有贤明的君主：
          - ancient: 窜梁鸿于海曲，岂乏明时？
            vernacular: 梁鸿到海边隐居，难道不是在政治昌明的时代吗？
          - ancient: 所赖君子见机，达人知命。
            vernacular: 不过是君子能够察觉事物的先兆，通达的人知道自己的命数罢了。
          - ancient: 老当益壮，宁移白首之心？
            vernacular: 年纪大了应当更有壮志，哪能在白发苍苍时改变自己的心志？
          - ancient: 穷且益坚，不坠青云之志。
            vernacular: 处境艰难反该更加坚强，不能放弃凌云之志。
          - ancient: 酌贪泉而觉爽，处涸辙以犹欢。
            vernacular: 这样即使喝了贪泉的水。仍然觉得心清无尘；处在干涸的车辙中，还能乐观开朗、
          - ancient: 北海虽赊，扶摇可接；
            vernacular: 北海虽然遥远，乘着旋风还是可以到达；
          - ancient: 东隅已逝，桑榆非晚。
            vernacular: 过去的时光虽然已经消逝，珍惜将来的日子还不算晚。
          - ancient: 孟尝高洁，空余报国之情；
            vernacular: 孟尝品行高洁，却空有报国之心；
          - ancient: 阮籍猖狂，岂效穷途之哭！
            vernacular: 阮籍狂放不羁，怎能效仿他在无路可走时便恸哭而返？
      - paragraph: 勃，
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 勃，三尺微命，一介书生。
            vernacular: 我，地位卑微，一个书生，
          - ancient: 无路请缨，等终军之弱冠；
            vernacular: 虽然和终军的年龄相同却没有报国的机会；
          - ancient: 有怀投笔，慕宗悫之长风。
            vernacular: 像班超那样有投笔从戎的豪情，也有宗悫“乘风破浪”的壮志。
          - ancient: 舍簪笏于百龄，奉晨昏于万里。
            vernacular: 而今放弃一生的功名，到万里之外去侍奉父亲，
          - ancient: 非谢家之宝树，接孟氏之芳邻。
            vernacular: 不是谢玄那样的人才，却结识了诸位名家。
          - ancient: 他日趋庭，叨陪鲤对；
            vernacular: 过些天到父亲那里聆听教诲，一定像孔鲤那样有礼；
          - ancient: 今兹捧袂，喜托龙门。
            vernacular: 今天有幸参加宴会，如登龙门。
          - ancient: 杨意不逢，抚凌云而自惜；
            vernacular: 司马相如倘若没有杨得意的引荐，虽有文才也只能独自叹惋。
          - ancient: 钟期既遇，奏流水以何惭？
            vernacular: 既然遇到钟子期那样的知音，演奏高山流水的乐曲又有什么羞愧的呢？
      - paragraph: 呜乎
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 呜乎！胜地不常，盛筵难再；
            vernacular: 唉！名胜不能长存，盛宴难逢。
          - ancient: 兰亭已矣，梓泽丘墟。
            vernacular: 兰亭集会的盛况已成陈迹，繁华的金谷园也变为废墟。
          - ancient: 临别赠言，幸承恩于伟饯；
            vernacular: 有幸参加这次盛宴，故写小文以纪念；
          - ancient: 登高作赋，是所望于群公。
            vernacular: 登高作赋，那就指望在座诸公了。
          - ancient: 敢竭鄙怀，恭疏短引；
            vernacular: 竭尽心力，恭敬地写下这篇小序，
          - ancient: 一言均赋，四韵俱成。
            vernacular: 我的一首四韵小诗也已写成
          - ancient: 请洒潘江，各倾陆海云尔。
            vernacular: 请各位像潘岳、陆机那样，展现江海般的文才吧。
      - paragraph: 滕王
        url: https://baike.baidu.com/item/%E6%BB%95%E7%8E%8B%E9%98%81%E5%BA%8F/480325
        sentences:
          - ancient: 滕王高阁临江渚，佩玉鸣鸾罢歌舞。
            vernacular: 巍然高大的滕王阁建在江渚之滨，当年滕王宴饮的场面已不再呈现。
          - ancient: 画栋朝飞南浦云，珠帘暮卷西山雨。
            vernacular: 南浦轻云早晨掠过滕王阁的画栋，西山烟雨傍晚卷起滕王阁的珠帘。
          - ancient: 闲云潭影日悠悠，物换星移几度秋。
            vernacular: 悠闲的云朵映在潭水上悠然渡过，变换的景物在星空下历数着春秋。
          - ancient: 阁中帝子今何在？槛外长江空自流。
            vernacular: 修建这滕王阁的帝子在什么地方？只有槛外的长江水滚滚向东流淌。
  - poem: 黄冈竹楼记
    type: 文言文选修
    author: 王禹偁
    created_at: 北宋
    paragraphs:
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
          - ancient: 黄冈之地多竹，大者如椽，
            vernacular: 黄冈地区盛产竹子，大的竹子像椽子那样粗。
          - ancient: 竹工破之，刳去其节，用代陶瓦。
            vernacular: 竹工破开它，削去竹节，用来代替陶瓦。
          - ancient: 比屋皆然，以其价廉而工省也。
            vernacular: 家家户户都用它盖房子，因为它便宜而且省工。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
          - ancient: 子城西北隅，雉堞圮毁，蓁莽荒秽，
            vernacular: 黄冈子城西北角的城垛子都塌毁了，野草丛生，荒芜污秽。
          - ancient: 因作小楼二间，与月波楼通。
            vernacular: 我清理了那里，盖了两间小竹楼，与月波楼互相连通。
          - ancient: 远吞山光，平挹江濑，
            vernacular: 登上竹楼，远山的风光尽收眼底，平望出去，能看到江中的浅水流沙。
          - ancient: 幽阒辽夐，不可具状。
            vernacular: 那幽静寂寥、高远空阔的景致，实在无法一一描绘出来。
          - ancient: 夏宜急雨，有瀑布声；
            vernacular: 夏天适宜听急雨，雨声有如瀑布之飞流直下；
          - ancient: 冬宜密雪，有碎玉声；
            vernacular: 冬天适宜听密雪，雪花坠落发出玉碎之声；
          - ancient: 宜鼓琴，琴调虚畅；
            vernacular: 适宜抚琴，琴声和畅悠扬；
          - ancient: 宜咏诗，诗韵清绝；
            vernacular: 适宜吟诗，诗韵清新绝俗；
          - ancient: 宜围棋，子声丁丁然；
            vernacular: 适宜下棋，棋子落盘有丁丁清响；
          - ancient: 宜投壶，矢声铮铮然；
            vernacular: 适宜投壶，箭入壶中铮铮动听。
          - ancient: 皆竹楼之所助也。
            vernacular: 这些美妙的声音，都是因为竹楼才得以听到。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
          - ancient: 公退之暇，被鹤氅衣，戴华阳巾，
            vernacular: 公事办完后的闲暇时间里，披着鹤氅衣，戴着华阳巾，
          - ancient: 手执《周易》一卷，焚香默坐，消遣世虑。
            vernacular: 手持一卷《周易》，焚香默坐，驱散尘世中的种种杂念。
          - ancient: 江山之外，第见风帆沙鸟，烟云竹树而已。
            vernacular: 除了水色山光之外，只见到风帆沙鸟、烟云竹树罢了。
          - ancient: 待其酒力醒，茶烟歇，
            vernacular: 等到酒意退去，煮茶的烟火熄灭，
          - ancient: 送夕阳，迎素月，亦谪居之胜概也。
            vernacular: 便送走夕阳，迎来皓月，这正是谪居生活的快乐之处啊。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
          - ancient: 彼齐云、落星，高则高矣；
            vernacular: 那齐云楼、落星楼，高是很高了；
          - ancient: 井干、丽谯，华则华矣；
            vernacular: 井干楼、丽谯楼，华丽是很华丽了，
          - ancient: 止于贮妓女，藏歌舞，
            vernacular: 但它们只不过是用来贮藏妓女和能歌善舞的人罢了，
          - ancient: 非骚人之事，吾所不取。
            vernacular: 这不是诗人应傲的事，是我所不屑去做的。
      - paragraph: 黄冈
        url: https://baike.baidu.com/item/%E9%BB%84%E5%B7%9E%E6%96%B0%E5%BB%BA%E5%B0%8F%E7%AB%B9%E6%A5%BC%E8%AE%B0
        sentences:
          - ancient: 吾闻竹工云，竹之为瓦，仅十稔。
            vernacular: 我听竹工说，竹子做屋瓦，只能用十年，
          - ancient: 若重覆之，得二十稔。
            vernacular: 如果覆盖两层竹瓦，可以支持二十年。
          - ancient: 噫，吾以至道乙未岁，自翰林出滁上，丙申移广陵；
            vernacular: 唉，我在至道乙未那一年，由翰林学士而贬到滁州，丙申年又调到扬州，
          - ancient: 丁酉又入西掖，戊戌岁除日有齐安之命，己亥闰三月到郡。
            vernacular: 丁酉年又到中书省任职，戊戌年的除夕，奉命调到齐安，己亥年闰三月才到了齐安郡城。
          - ancient: 四年之间，奔走不暇，未知明年又在何处，岂惧竹楼之易朽乎！
            vernacular: 四年之中，奔走不停，还不知道明年又在何处，难道还会怕竹楼容易朽坏吗？
          - ancient: 后之人与我同志，嗣而葺之，庶斯楼之不朽也！
            vernacular: 希望后来的人跟我志趣相同，能继我之后接着修整它。或许这座竹楼就永远不会腐朽吧。
          - ancient: 咸平二年八月十五日记。
            vernacular: 咸平二年八月十五日撰记。
  - poem: 上枢密韩太尉书
    type: 文言文选修
    author: 苏辙
    created_at: 北宋
    paragraphs:
      - paragraph: 太尉
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
          - ancient: 太尉执事：辙生好为文，思之至深。
            vernacular: 太尉执事：我生性喜好写文章，对此想得很深。
          - ancient: 以为文者气之所形，然文不可以学而能，气可以养而致。
            vernacular: 我认为文章是气的外在体现，然而文章不是单靠学习就能写好的，气却可以通过培养而得到。
          - ancient: 孟子曰：“我善养吾浩然之气。”
            vernacular: 孟子说：“我善于培养我的浩然之气。”
          - ancient: 今观其文章，宽厚宏博，充乎天地之间，称其气之小大。
            vernacular: 现在看他的文章，宽大厚重宏伟博大，充塞于天地之间，同他气的大小相称。
          - ancient: 太史公行天下，周览四海名山大川，
            vernacular: 司马迁走遍天下，广览四海名山大川，
          - ancient: 与燕、赵间豪俊交游，故其文疏荡，颇有奇气。
            vernacular: 与燕、赵之间的英豪俊杰交友，所以他的文章疏放不羁，颇有奇伟之气。
          - ancient: 此二子者，岂尝执笔学为如此之文哉？
            vernacular: 这两个人，难道曾经执笔学写这种文章吗？
          - ancient: 其气充乎其中而溢乎其貌，动乎其言而见乎其文，而不自知也。
            vernacular: 这是因为他们的气充满在内心而溢露到外貌，发于言语而表现为文章，自己却并没有觉察到。
      - paragraph: 辙生
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
          - ancient: 辙生十有九年矣。
            vernacular: 我出生已经十九年了。
          - ancient: 其居家所与游者，不过其邻里乡党之人；
            vernacular: 我住在家里时，所交往的，不过是邻居同乡这一类人。
          - ancient: 所见不过数百里之间，无高山大野可登览以自广，
            vernacular: 所看到的，不过是几百里之内的景物，没有高山旷野可以登临观览以开阔自己的心胸。
          - ancient: 百氏之书，虽无所不读，
            vernacular: 诸子百家的书，虽然无所不读，
          - ancient: 然皆古人之陈迹，不足以激发其志气。
            vernacular: 但是都是古人过去的东西，不能激发自己的志气。
          - ancient: 恐遂汩没，故决然舍去，求天下奇闻壮观，以知天地之广大。
            vernacular: 我担心就此而被埋没，所以断然离开家乡，去寻求天下的奇闻壮观，以便了解天地的广大。
          - ancient: 过秦、汉之故都，
            vernacular: 我经过秦朝、汉朝的故都，
          - ancient: 恣观终南、嵩、华之高，
            vernacular: 尽情观览终南山、嵩山、华山的高峻，
          - ancient: 北顾黄河之奔流，慨然想见古之豪杰。
            vernacular: 向北眺望黄河奔腾的急流，深有感慨地想起了古代的英雄豪杰。
          - ancient: 至京师，仰观天子宫阙之壮，
            vernacular: 到了京城，抬头看到天子宫殿的壮丽，
          - ancient: 与仓廪、府库、城池、苑囿之富且大也，
            vernacular: 以及粮仓、府库、城池、苑囿的富庶而且巨大，
          - ancient: 而后知天下之巨丽。
            vernacular: 这才知道天下的广阔富丽。
          - ancient: 见翰林欧阳公，听其议论之宏辨，观其容貌之秀伟，
            vernacular: 见到翰林学士欧阳公，聆听了他宏大雄辩的议论，看到了他秀美奇伟的容貌，
          - ancient: 与其门人贤士大夫游，而后知天下之文章聚乎此也。
            vernacular: 同他的学生贤士大夫交游，这才知道天下的文章都汇聚在这里。
          - ancient: 太尉以才略冠天下，天下之所恃以无忧，四夷之所惮以不敢发，
            vernacular: 太尉以雄才大略称冠天下，全国人依靠您而无忧无虑，四方异族国家惧怕您而不敢侵犯，
          - ancient: 入则周公、召公，出则方叔、召虎。
            vernacular: 在朝廷之内像周公、召公一样辅君有方，领兵出征像方叔、召虎一样御敌立功。
          - ancient: 而辙也未之见焉。
            vernacular: 可是我至今还未见到您呢。
      - paragraph: 且夫
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
          - ancient: 且夫人之学也，不志其大，虽多而何为？
            vernacular: 再说一个人的学习，如果不是有志于大的方面，即使学了很多又有什么用呢？
          - ancient: 辙之来也，于山见终南、嵩、华之高，
            vernacular: 我这次来，对于山，看到了终南山、嵩山、华山的高峻；
          - ancient: 于水见黄河之大且深，
            vernacular: 对于水，看到了黄河的深广；
          - ancient: 于人见欧阳公，而犹以为未见太尉也。
            vernacular: 对于人，看到了欧阳公；可是仍以没有谒见您而为一件憾事。
          - ancient: 故愿得观贤人之光耀，闻一言以自壮，
            vernacular: 所以希望能够一睹贤人的风采，就是听到您的一句话也足以激发自己雄心壮志，
          - ancient: 然后可以尽天下之大观而无憾者矣。
            vernacular: 这样就算看遍了天下的壮观而不会再有什么遗憾了。
      - paragraph: 辙年
        url: https://baike.baidu.com/item/%E4%B8%8A%E6%9E%A2%E5%AF%86%E9%9F%A9%E5%A4%AA%E5%B0%89%E4%B9%A6
        sentences:
          - ancient: 辙年少，未能通习吏事。
            vernacular: 我年纪还很轻，还没能够通晓做官的事情。
          - ancient: 向之来，非有取于斗升之禄，偶然得之，非其所乐。
            vernacular: 先前来京应试，并不是为了谋取微薄的俸禄，偶然得到了它，也不是自己所喜欢的。
          - ancient: 然幸得赐归待选，使得优游数年之间，
            vernacular: 然而有幸得到恩赐还乡，等待吏部的选用，使我能够有几年空闲的时间，
          - ancient: 将以益治其文，且学为政。
            vernacular: 将用来更好地研习文章，并且学习从政之道。
          - ancient: 太尉苟以为可教而辱教之，又幸矣！
            vernacular: 太尉假如认为我还可以教诲而屈尊教导我的话，那我就更感到幸运了。
  - poem: 毛诗序
    type: 古代文论选段
    author: 说法不一，有子夏、卫宏等说
    created_at: 先秦至两汉
    paragraphs:
      - paragraph: 《关
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - ancient: 《关雎》，后妃之德也，风之始也，所以风天下而正夫妇也。
            vernacular: 《关雎》，是讲后妃美德的诗，是《诗经》国风的第一篇，君王用它来教化天下而矫正夫妇之间的伦理关系。
          - ancient: 故用之乡人焉，用之邦国焉。
            vernacular: 所以可以用以教化乡村百姓，也可以用以教化诸侯邦国。
          - ancient: 风，风也，教也。
            vernacular: 风，就是讽谕，教化；
          - ancient: 风以动之，教以化之。
            vernacular: 用讽谕来感动、教化人们。
      - paragraph: 诗者
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - ancient: 诗者，志之所之也。
            vernacular: 诗，是人用来表现志向的，
          - ancient: 在心为志，发言为诗，
            vernacular: 在心里叫志向，用语言表达出来就是诗。
          - ancient: 情动于中而形于言，言之不足，故嗟叹之；
            vernacular: 情感在心里激荡就会表达为语言，语言不足以表达，就会吁嗟叹息来继续它，
          - ancient: 嗟叹之不足，故永歌之；
            vernacular: 吁嗟叹息还不尽情，就会长声歌咏，
          - ancient: 永歌之不足，不知手之舞之，足之蹈之也。
            vernacular: 长声歌咏仍不满足，就会情不自禁地手舞足蹈。
      - paragraph: 情发
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - ancient: 情发于声，声成文谓之音。
            vernacular: 情感表现为声音，声音组成宫、商、角、徵、羽的调子，就是音乐。
          - ancient: 治世之音安以乐，其政和；
            vernacular: 太平时代的音乐平和而欢乐，它的政治就平和通畅；
          - ancient: 乱世之音怨以怒，其政乖；
            vernacular: 动乱之世的音乐怨恨而愤怒，它的政治就乖戾残暴；
          - ancient: 亡国之音哀以思，其民困。
            vernacular: 亡国之时的音乐悲伤而忧思，其国民就困顿。
          - ancient: 故正得失，动天地，感鬼神，莫近于诗。
            vernacular: 所以矫正政治的过失，感动天地和鬼神，没有超过诗歌的。
          - ancient: 先王以是经夫妇，成孝敬，
            vernacular: 古代的君王正是以诗歌来矫正夫妻之道，培养孝敬，
          - ancient: 厚人伦，美教化，移风俗。
            vernacular: 敦厚人伦，完善教化，移风易俗。
      - paragraph: 故诗
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - ancient: 故诗有六义焉：一曰风，二曰赋，三曰比，四曰兴，五曰雅，六曰颂。
            vernacular: 所以诗有六义：一叫“风”，二叫“赋”，三叫“比”，四叫“兴”，五叫“雅”，六叫“颂”。
          - ancient: 上以风化下，下以风刺上，
            vernacular: 天子用“风”来教化平民百姓，平民百姓用“风”来讽谕天子诸侯，
          - ancient: 主文而谲谏，言之者无罪，
            vernacular: 用深隐的文辞来作委婉的劝谏，这样写诗的人不会获罪，
          - ancient: 闻之者足以戒，故曰风。
            vernacular: 听诗的人足可以警戒，这就叫“风”。
          - ancient: 至于王道衰，礼义废，
            vernacular: 至于王道衰微，礼义废弛，
          - ancient: 政教失，国异政，
            vernacular: 政教败坏，诸侯各国各自为政，
          - ancient: 家殊俗，而变风变雅作矣。
            vernacular: 老百姓家风俗各异，于是“变风”“变雅”的诗就产生了。
          - ancient: 国史明乎得失之迹，伤人伦之废，
            vernacular: 国家的史官明白政治败坏的事实，感伤于人伦的废弛，
          - ancient: 哀刑政之苛，吟咏情性，
            vernacular: 哀痛刑政的残酷苛刻，于是吟咏自己的情感，
          - ancient: 以风其上，达于事变而怀其旧俗者也。
            vernacular: 用来讽谕君上，这是通达政事的变化而又怀念传统风俗的。
          - ancient: 故变风发乎情，止乎礼义。
            vernacular: 所以“变风”是发于内心的情感，但并不超越礼义的规范。
          - ancient: 发乎情，民之性也；
            vernacular: 发于内心的情感是人的天性；
          - ancient: 止乎礼义，先王之泽也。
            vernacular: 不超越礼义，是先王教化的恩泽久远。
          - ancient: 是以一国之事，系一人之本，谓之风；
            vernacular: 因此，如果诗吟咏一个邦国的事，通过一个人的心意表现出来，就叫作“风”；
          - ancient: 言天下之事，形四方之风，谓之雅。
            vernacular: 反映天下的事，表现的是包括各国的风俗，就叫作“雅”。
          - ancient: 雅者，正也，言王政之所由废兴也。
            vernacular: “雅”，是正的意思，说的是王朝政教兴衰的缘由。
          - ancient: 政有小大，故有小雅焉，有大雅焉。
            vernacular: 政事有小大之分，所以有的叫“小雅”，有的叫“大雅”。
          - ancient: 颂者，美盛德之形容，以其成功告于神明者也。
            vernacular: “颂”，就是赞美君王盛德，并将他的成功的事业禀告神灵的。
          - ancient: 是谓四始，诗之至也。
            vernacular: （“风”“小雅”“大雅”“颂”）这就是“四始”，是诗中最高的了。
      - paragraph: 然则
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - ancient: 然则《关雎》《麟趾》之化，王者之风，故系之周公。
            vernacular: 既然如此，那么《关雎》《麟趾》的教化，原是周文王时的“风”，所以记在周公的名下。
          - ancient: 南，言化自北而南也。
            vernacular: “南”的意思，是说教化是从北方到南方的。
          - ancient: 《鹊巢》《驺虞》之德，诸侯之风也，
            vernacular: 《鹊巢》《驺虞》的德行，本是邦国诸侯的“风”，
          - ancient: 先王之所以教，故系之召公。
            vernacular: 先王用它来教化，所以就记在召公的名下。
          - ancient: 《周南》《召南》，正始之道，王化之基。
            vernacular: 《周南》《召南》，是规范最初时的标准，是王道教化的基础。
          - ancient: 是以《关雎》乐得淑女，以配君子，
            vernacular: 因此，《关雎》是赞美得到贤淑的女子，来匹配给君子的，
          - ancient: 忧在进贤，不淫其色；
            vernacular: 忧虑的是如何进举贤才，并非贪恋女色；
          - ancient: 哀窈窕，思贤才，而无伤善之心焉。
            vernacular: 怜爱静雅的美女，思念贤良的人才，却没有伤风败俗的邪念。
          - ancient: 是《关雎》之义也。
            vernacular: 这就是《关雎》的要义。
  - poem: 典论·论文
    type: 古代文论选段
    author: 曹丕
    created_at: 三国时期
    paragraphs:
      - paragraph: 盖文
        url: https://baike.baidu.com/item/%E5%85%B8%E8%AE%BA%C2%B7%E8%AE%BA%E6%96%87/7013652
        sentences:
          - ancient: 盖文章，经国之大业，不朽之盛事。
            vernacular: 文章是关系到治理国家的伟大功业，是可以流传后世而不朽的盛大事业。
          - ancient: 年寿有时而尽，荣乐止乎其身，
            vernacular: 人的年龄寿夭有时间的限制，荣誉欢乐也只能终于一身，
          - ancient: 二者必至之常期，未若文章之无穷。
            vernacular: 二者都终止于一定的期限，不能像文章那样永久流传，没有穷期。
          - ancient: 是以古之作者，寄身于翰墨，
            vernacular: 因此，古代的作者，投身于写作，
          - ancient: 见意于篇籍，不假良史之辞，
            vernacular: 把自己的思想意见表现在文章书籍中，就不必借史家的言辞，
          - ancient: 不托飞驰之势，而声名自传于后。
            vernacular: 也不必托高官的权势，而声名自然能流传后世。
  - poem: 诗品序
    type: 古代文论选段
    author: 锺嵘
    created_at: 南朝梁
    paragraphs:
      - paragraph: 若乃
        url: http://www.guoxuemeng.com/mingju/445207.html
        sentences:
          - ancient: 若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。
            vernacular: 至于那春风春鸟，秋月秋蝉，夏云暑雨，冬月酷寒，这是人有感于四季节令气候并把它表现在诗歌里。
          - ancient: 嘉会寄诗以亲，离群讬诗以怨。
            vernacular: 在美好的集会时用诗来表现亲近愉悦，离开群体用诗来表达哀怨。
          - ancient: 至于楚臣去境，汉妾辞宫。
            vernacular: 至于楚国臣子离开国都，汉朝的嫔妃辞别宫廷。
          - ancient: 或骨横朔野，魂逐飞蓬。
            vernacular: xxxx
          - ancient: 或负戈外戍，杀气雄边。
            vernacular: xxxx
          - ancient: 塞客衣单，孀闺泪尽。
            vernacular: 在边关的客子衣裳单薄，闺中寡居的妇女眼泪哭尽。
          - ancient: 或士有解佩出朝，一去忘返。
            vernacular: 有的士人解下佩印辞官离朝，一去不返。
          - ancient: 女有扬蛾入宠，再盼倾国。
            vernacular: 女子有扬起蛾眉，入宫受宠，再次顾盼，倾国倾城。
          - ancient: 凡斯种种，感荡心灵，非陈诗何以展其义?
            vernacular: 所有这种种情景，感动激荡人的心灵，如果不铺陈诗句还能用什么来抒发他的情义?
          - ancient: 非长歌何以骋其情?
            vernacular: 如果不放声歌唱还能用什么来舒展他的情怀?
          - ancient: 故曰：“诗可以群，可以怨。”
            vernacular: 所以说：“诗可以结交朋友，可以怨刺不平。”
          - ancient: 使穷贱易安，幽居靡闷，莫尚于诗矣。
            vernacular: 使处境困难地位卑贱的人容易安心，使隐居避世的人消除苦闷，要想如此没有比诗更好的了。
  - poem: 与元九书
    type: 古代文论选段
    author: 白居易
    created_at: 唐代
    paragraphs:
      - paragraph: 感人
        url: https://baike.baidu.com/item/%E4%B8%8E%E5%85%83%E4%B9%9D%E4%B9%A6/8973034
        sentences:
          - ancient: 感人心者，莫先乎情，莫始乎言，莫切乎声，莫深乎义。
            vernacular: 能够感化人心的事物，没有比情先的，没有比言早的，没有比声近的，没有比义深的。
          - ancient: 诗者，根情，苗言，华声，实义。
            vernacular: 所谓诗，就是以情为根，以诗为苗，以声为花，以义为实的。
  - poem: 题画·江馆清秋
    type: 古代文论选段
    author: 郑燮
    created_at: 清代
    paragraphs:
      - paragraph: 江馆
        url: http://www.guoxuemeng.com/gushici/445203.html
        sentences:
          - ancient: 江馆清秋，晨起看竹，烟光日影露气，皆浮动于疏枝密叶之间。
            vernacular: 在江边的私塾教书，每逢清秋，早晨常起来观察竹子，这时，烟光、日影、露气，都在疏枝密叶之间飘浮流动。
          - ancient: 胸中勃勃，遂有画意。
            vernacular: 于是，胸中情致勃动，就有了作画的意念。
          - ancient: 其中胸中之竹，并不是眼中之竹。
            vernacular: 其实，这时在脑海里映现的竹子，已经不是眼睛所看到的竹子了，
          - ancient: 因而磨墨展纸，落笔倏作变相，
            vernacular: 于是赶快取砚磨墨，展开画纸，乘兴落笔，尽情挥毫，迅即呵成一幅幅图画。
          - ancient: 手中之竹又不是胸中之竹也。
            vernacular: 这时，笔下所画出来的竹子又不是脑海里映现的竹子了。
          - ancient: 总之，意在笔先者，定则也。
            vernacular: 总之，意念产生在落笔之前，这是无可置疑的法则;
          - ancient: 趣在法外者，化机也。
            vernacular: 但情趣流溢在法则之外，则全凭个人的运化之功了。
          - ancient: 独画云乎哉?
            vernacular: 难道仅仅作画是这样吗?
  - poem: 人间词话
    type: 古代文论选段
    author: 王国维
    created_at: 近代
    paragraphs:
      - paragraph: 词以
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
          - ancient: 词以境界为最上，有境界则自成高格，自有名句。
            vernacular: 词是要以境界为最高标准的。有境界的词，就会有很高的格调，自然会出现有名的句子。
      - paragraph: 境非
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
          - ancient: 境非独谓景物也，喜怒哀乐，亦人心中之一境界。
            vernacular: 境界并不是只指景物，喜怒哀乐等情感也是人心中的地种境界。
          - ancient: 故能写真景物、真感情者，谓之有境界。
            vernacular: 所以(文章)能够描写真实的景物，真实的情感的，就称为有境界，
          - ancient: 否则谓之无境界。
            vernacular: 否则就称为没有境界。
      - paragraph: 古今
        url: http://www.guoxuemeng.com/mingju/445210.html
        sentences:
          - ancient: 古今之成大事业、大学问者，必经过三种之境界：
            vernacular: 从古至今，那些做成大事业，大学问的人，没有不经历三种境界的：
          - ancient: “昨夜西风凋碧树。独上高楼，望尽天涯路。” 此第一境也。
            vernacular: “昨夜西风凋碧树。独上高楼，望尽天涯路。”这是第一境界。
          - ancient: “衣带渐宽终不悔，为伊消得人憔悴。” 此第二境也。
            vernacular: “衣带渐宽终不悔，为伊消得人憔悴。”这是第二境界。
          - ancient: “众里寻他千百度，回头蓦见，那人正在，灯火阑珊处。” 此第三境也。
            vernacular: “众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。”这是第三境界。
          - ancient: 此等语皆非大词人不能道。
            vernacular: 这些话都是大词人才能作出来。
          - ancient: 然遽以此意解释诸词，恐为晏、欧诸公所不许也。
            vernacular: 但是根据这个意思解释诗词，恐怕晏同叔和欧阳修等人是不会赞同的。
  - poem: 邶风·静女
    type: 诗词曲
    author: 《诗经·邶风》
    created_at: 周代
    paragraphs:
      - paragraph: 静女
        url: https://baike.baidu.com/item/%E9%82%B6%E9%A3%8E%C2%B7%E9%9D%99%E5%A5%B3/3183014
        sentences:
          - ancient: 静女其姝，俟我于城隅。
            vernacular: 娴静姑娘真可爱，约我城角楼上来。
          - ancient: 爱而不见，搔首踟蹰。
            vernacular: 故意躲藏让我找，急得抓耳又挠腮。
          - ancient: 静女其娈，贻我彤管。
            vernacular: 娴静姑娘好容颜，送我一枝红彤管。
          - ancient: 彤管有炜，说怿女美。
            vernacular: 鲜红彤管有光彩，爱它颜色真鲜艳。
          - ancient: 自牧归荑，洵美且异。
            vernacular: 郊野采荑送给我，荑草美好又珍异。
          - ancient: 匪女之为美，美人之贻。
            vernacular: 不是荑草长得美，美人相赠厚情意。
  - poem: 秦风·无衣
    type: 诗词曲
    author: 《诗经·秦风》
    created_at: 周代
    paragraphs:
      - paragraph: 岂曰
        url: https://baike.baidu.com/item/%E7%A7%A6%E9%A3%8E%C2%B7%E6%97%A0%E8%A1%A3/2468699
        sentences:
          - ancient: 岂曰无衣？与子同袍
            vernacular: 谁说我们没衣穿？与你同穿那长袍。
          - ancient: 王于兴师，修我戈矛，与子同仇！
            vernacular: 君王发兵去交战，修整我那戈与矛，杀敌与你同目标。
          - ancient: 岂曰无衣？与子同泽。
            vernacular: 谁说我们没衣穿？与你同穿那内衣。
          - ancient: 王于兴师，修我矛戟，与子偕作！
            vernacular: 君王发兵去交战，修整我那矛与戟，出发与你在一起。
          - ancient: 岂曰无衣？与子同裳。
            vernacular: 谁说我们没衣穿？与你同穿那战裙。
          - ancient: 王于兴师，修我甲兵，与子偕行！
            vernacular: 君王发兵去交战，修整甲胄与刀兵，杀敌与你共前进。
  - poem: 离骚
    type: 诗词曲
    author: 屈原
    created_at: 战国后期
    paragraphs:
      - paragraph: 帝高
        url: https://baike.baidu.com/item/%E7%A6%BB%E9%AA%9A/1045
        sentences:
          - ancient: 帝高阳之苗裔兮，朕皇考曰伯庸。
            vernacular: 我是古帝高阳氏的子孙，我已去世的父亲字伯庸。
          - ancient: 摄提贞于孟陬兮，惟庚寅吾以降。
            vernacular: 岁星在寅那年的孟春月，正当庚寅日那天我降生。
          - ancient: 皇览揆余初度兮，肇锡余以嘉名。
            vernacular: 父亲仔细揣测我的生辰，于是赐给我相应的美名：
          - ancient: 名余曰正则兮，字余曰灵均。
            vernacular: 父亲把我的名取为正则，同时把我的字叫作灵均。
          - ancient: 纷吾既有此内美兮，又重之以脩能。
            vernacular: 天赋给我很多良好素质，我不断加强自己的修养。
          - ancient: 扈江离与辟芷兮，纫秋兰以为佩。
            vernacular: 我把江离芷草披在肩上，把秋兰结成索佩挂身旁。
          - ancient: 汩余若将不及兮，恐年岁之不吾与。
            vernacular: 光阴似箭我好像跟不上，岁月不等待人令我心慌。
          - ancient: 朝搴阰之木兰兮，夕揽洲之宿莽。
            vernacular: 早晨我在大坡采集木兰，傍晚在小洲中摘取宿莽。
          - ancient: 日月忽其不淹兮，春与秋其代序。
            vernacular: 时光迅速逝去不能久留，四季更相代谢变化有常。
          - ancient: 惟草木之零落兮，恐美人之迟暮。
            vernacular: 我想到草木已由盛到衰，恐怕自己身体逐渐衰老。
          - ancient: 不抚壮而弃秽兮，何不改乎此度？
            vernacular: 何不利用盛时扬弃秽政，为何还不改变这些法度？
          - ancient: 乘骐骥以驰骋兮，来吾道夫先路！
            vernacular: 乘上千里马纵横驰骋吧，来呀我在前面引导开路！
  - poem: 涉江采芙蓉
    type: 诗词曲
    author: 《古诗十九首》
    created_at: 东汉
    paragraphs:
      - paragraph: 涉江
        url: https://baike.baidu.com/item/%E6%B6%89%E6%B1%9F%E9%87%87%E8%8A%99%E8%93%89/7866139
        sentences:
          - ancient: 涉江采芙蓉，兰泽多芳草。
            vernacular: 踏过江水去采荷花，到兰草生长的沼泽地采兰花。
          - ancient: 采之欲遗谁？所思在远道。
            vernacular: 采了花要送给谁呢？想要送给那远在故乡的爱人。
          - ancient: 还顾望旧乡，长路漫浩浩。
            vernacular: 回想起故乡的爱妻，却又长路漫漫遥望无边无际。
          - ancient: 同心而离居，忧伤以终老。
            vernacular: 漂泊异乡两地相思，怀念爱妻愁苦忧伤以至终老。
  - poem: 短歌行·其一
    type: 诗词曲
    author: 曹操
    created_at: 东汉
    paragraphs:
      - paragraph: 对酒
        url: https://baike.baidu.com/item/%E7%9F%AD%E6%AD%8C%E8%A1%8C%E4%BA%8C%E9%A6%96/13571956
        sentences:
          - ancient: 对酒当歌，人生几何！
            vernacular: 一边喝酒一边高歌，人生短促日月如梭。
          - ancient: 譬如朝露，去日苦多。
            vernacular: 好比晨露转瞬即逝，失去的时日实在太多！
          - ancient: 慨当以慷，忧思难忘。
            vernacular: 席上歌声激昂慷慨，忧郁长久填满心窝。
          - ancient: 何以解忧？唯有杜康。
            vernacular: 靠什么来排解忧闷？唯有狂饮方可解脱。
          - ancient: 青青子衿，悠悠我心。
            vernacular: 那穿着青领的学子哟，你们令我朝夕思慕。
          - ancient: 但为君故，沉吟至今。
            vernacular: 只是因为您的缘故，让我沉痛吟诵至今。
          - ancient: 呦呦鹿鸣，食野之苹。
            vernacular: 阳光下鹿群呦呦欢鸣，悠然自得啃食在绿坡。
          - ancient: 我有嘉宾，鼓瑟吹笙。
            vernacular: 一旦四方贤才光临舍下，我将奏瑟吹笙宴请嘉宾。
          - ancient: 明明如月，何时可掇？
            vernacular: 当空悬挂的皓月哟，什么时候才可以拾到；
          - ancient: 忧从中来，不可断绝。
            vernacular: 我久蓄于怀的忧愤哟，突然喷涌而出汇成长河。
          - ancient: 越陌度阡，枉用相存。
            vernacular: 远方宾客踏着田间小路，一个个屈驾前来探望我。
          - ancient: 契阔谈䜩，心念旧恩。
            vernacular: 彼此久别重逢谈心宴饮，争着将往日的情谊诉说。
          - ancient: 月明星稀，乌鹊南飞。
            vernacular: 月光明亮星光稀疏，一群寻巢乌鹊向南飞去。
          - ancient: 绕树三匝，何枝可依？
            vernacular: 绕树飞了三周却没敛翅，哪里才有它们的栖身之所？
          - ancient: 山不厌高，海不厌深。
            vernacular: 高山不辞土石才见巍峨，大海不弃涓流才见壮阔。
          - ancient: 周公吐哺，天下归心。
            vernacular: 我愿如周公般礼贤下士，愿天下英杰真心归顺我。
  - poem: 短歌行·其二
    type: 诗词曲
    author: 曹操
    created_at: 东汉
    paragraphs:
      - paragraph: 周西
        url: https://baike.baidu.com/item/%E7%9F%AD%E6%AD%8C%E8%A1%8C%E4%BA%8C%E9%A6%96/13571956
        sentences:
          - ancient: 周西伯昌，怀此圣德。
            vernacular: 姬昌受封为西伯，具有神智和美德。
          - ancient: 三分天下，而有其二。
            vernacular: 殷朝土地为三份，他有其中的两份。
          - ancient: 修奉贡献，臣节不隆。
            vernacular: 整治贡品来进奉，不失臣子的职责。
          - ancient: 崇侯谗之，是以拘系。
            vernacular: 只因为崇侯进谗言，而蒙冤受拘禁。
          - ancient: 后见赦原，赐之斧钺，得使征伐。
            vernacular: 后因为送礼而赦免，受赐斧钺征伐的权力。
          - ancient: 为仲尼所称，达及德行。
            vernacular: 他被孔子所称赞，品德高尚地位显。
          - ancient: 犹奉事殷，论叙其美。
            vernacular: 始终臣服殷朝帝王，美名后世流传遍。
          - ancient: 齐桓之功，为霸之道。
            vernacular: 齐桓公拥周建立功业，存亡继绝为霸首。
          - ancient: 九合诸侯，一匡天下。
            vernacular: 聚合诸侯捍卫中原，匡正天下功业千秋。
          - ancient: 一匡天下，不以兵车。
            vernacular: 号令诸侯以匡周室，依靠的主要不是武力。
          - ancient: 正而不谲，其德传称。
            vernacular: 行为磊落不欺诈，美德流传于身后。
          - ancient: 孔子所叹，并称夷吾，民受其恩。
            vernacular: 孔子赞美齐桓公，也称赞管仲，百姓深受恩惠。
          - ancient: 赐与庙胙，命无下拜。
            vernacular: 天子赐肉与桓公，命其无拜来接受。
          - ancient: 小白不敢尔，天威在颜咫尺。
            vernacular: 桓公称小白不敢，天子威严就在咫尺前。
          - ancient: 晋文亦霸，躬奉天王。
            vernacular: 晋文公继承来称霸，亲身尊奉周天王。
          - ancient: 受赐珪瓒，秬鬯彤弓。
            vernacular: 周天子赏赐丰厚，仪式也非常隆重。
          - ancient: 卢弓矢千，虎贲三百人。
            vernacular: 接受玉器和美酒，弓矢武士三百名。
          - ancient: 威服诸侯，师之所尊。
            vernacular: 晋文公声望镇诸侯，从其风者受尊重。
          - ancient: 八方闻之，名亚齐桓。
            vernacular: 威名八方传遍，名声仅次于齐桓公。
          - ancient: 河阳之会，诈称周王，是其名纷葩。
            vernacular: 佯称周王巡狩，招天子到河阳，因此大众议论纷纷。
  - poem: 归园田居（其一）
    type: 诗词曲
    author: 陶潜
    created_at: 东晋
    paragraphs:
      - paragraph: 少无
        url: https://baike.baidu.com/item/%E5%BD%92%E5%9B%AD%E7%94%B0%E5%B1%85/387
        sentences:
          - ancient: 少无适俗韵，性本爱丘山。
            vernacular: 少小时就没有随俗气韵，自己的天性是热爱自然。
          - ancient: 误落尘网中，一去三十年。
            vernacular: 偶失足落入了仕途罗网，转眼间离田园已十余年。
          - ancient: 羁鸟恋旧林，池鱼思故渊。
            vernacular: 笼中鸟常依恋往日山林，池里鱼向往着从前深渊。
          - ancient: 开荒南野际，守拙归园田。
            vernacular: 我愿在南野际开垦荒地，保持着拙朴性归耕田园。
          - ancient: 方宅十余亩，草屋八九间。
            vernacular: 绕房宅方圆有十余亩地，还有那茅屋草舍八九间。
          - ancient: 榆柳荫后檐，桃李罗堂前。
            vernacular: 榆柳树荫盖着房屋后檐，争春的桃与李列满院前。
          - ancient: 暧暧远人村，依依墟里烟。
            vernacular: 远处的邻村舍依稀可见，村落里飘荡着袅袅炊烟。
          - ancient: 狗吠深巷中，鸡鸣桑树颠。
            vernacular: 深巷中传来了几声狗吠，桑树顶有雄鸡不停啼唤。
          - ancient: 户庭无尘杂，虚室有余闲。
            vernacular: 庭院内没有那尘杂干扰，静室里有的是安适悠闲。
          - ancient: 久在樊笼里，复得返自然。
            vernacular: 久困于樊笼里毫无自由，我今日总算又归返林山。
  - poem: 拟行路难（其四）
    type: 诗词曲
    author: 鲍照
    created_at: 南朝宋
    paragraphs:
      - paragraph: 泻水
        url: https://baike.baidu.com/item/%E6%8B%9F%E8%A1%8C%E8%B7%AF%E9%9A%BE%E5%8D%81%E5%85%AB%E9%A6%96
        sentences:
          - ancient: 泻水置平地，各自东西南北流。
            vernacular: 就像往平地上倒水，水会向不同方向流散一样，人生贵贱穷达是不一致的。
          - ancient: 人生亦有命，安能行叹复坐愁？
            vernacular: 人生也是有宿命的，怎么能在行走，坐着而叹息又哀愁呢？
          - ancient: 酌酒以自宽，举杯断绝歌路难。
            vernacular: 喝点酒来宽慰自己，歌唱《行路难》，歌声因举杯饮酒而中断。
          - ancient: 心非木石岂无感，吞声踯躅不敢言。
            vernacular: 人心又不是木头，石头，怎么会没有感情？声将发又止，徘徊不前，我不敢再说什么了。
  - poem: 春江花月夜
    type: 诗词曲
    author: 张若虚
    created_at: 初唐
    paragraphs:
      - paragraph: 春江
        url: https://baike.baidu.com/item/%E6%98%A5%E6%B1%9F%E8%8A%B1%E6%9C%88%E5%A4%9C/1701
        sentences:
          - ancient: 春江潮水连海平，海上明月共潮生。
            vernacular: 春天的江潮水势浩荡，与大海连成一片，一轮明月从海上升起，好像与潮水一起涌出来。
          - ancient: 滟滟随波千万里，何处春江无月明！
            vernacular: 月光照耀着春江，随着波浪闪耀千万里，所有地方的春江都有明亮的月光。
          - ancient: 江流宛转绕芳甸，月照花林皆似霰。
            vernacular: 江水曲曲折折地绕着花草丛生的原野流淌，月光照射着开遍鲜花的树林好像细密的雪珠在闪烁。
          - ancient: 空里流霜不觉飞，汀上白沙看不见。
            vernacular: 月色如霜，所以霜飞无从觉察。洲上的白沙和月色融合在一起，看不分明。
          - ancient: 江天一色无纤尘，皎皎空中孤月轮。
            vernacular: 江水、天空成一色，没有一点微小灰尘，明亮的天空中只有一轮孤月高悬空中。
          - ancient: 江畔何人初见月？江月何年初照人？
            vernacular: 江边上什么人最初看见月亮，江上的月亮哪一年最初照耀着人？
          - ancient: 人生代代无穷已，江月年年望相似。
            vernacular: 人生一代代地无穷无尽，只有江上的月亮一年年地总是相像。
          - ancient: 不知江月待何人，但见长江送流水。
            vernacular: 不知江上的月亮等待着什么人，只见长江不断地一直运输着流水。
          - ancient: 白云一片去悠悠，青枫浦上不胜愁。
            vernacular: 游子像一片白云缓缓地离去，只剩下思妇站在离别的青枫浦不胜忧愁。
          - ancient: 谁家今夜扁舟子？何处相思明月楼？
            vernacular: 哪家的游子今晚坐着小船在漂流？什么地方有人在明月照耀的楼上相思？
          - ancient: 可怜楼上月裴回，应照离人妆镜台。
            vernacular: 可怜楼上不停移动的月光，应该照耀着离人的梳妆台。
          - ancient: 玉户帘中卷不去，捣衣砧上拂还来。
            vernacular: 月光照进思妇的门帘，卷不走，照在她的捣衣砧上，拂不掉。
          - ancient: 此时相望不相闻，愿逐月华流照君。
            vernacular: 这时互相望着月亮可是互相听不到声音，我希望随着月光流去照耀着您。
          - ancient: 鸿雁长飞光不度，鱼龙潜跃水成文。
            vernacular: 鸿雁不停地飞翔，而不能飞出无边的月光；月照江面，鱼龙在水中跳跃，激起阵阵波纹。
          - ancient: 昨夜闲潭梦落花，可怜春半不还家。
            vernacular: 昨天夜里梦见花落闲潭，可惜的是春天过了一半自己还不能回家。
          - ancient: 江水流春去欲尽，江潭落月复西斜。
            vernacular: 江水带着春光将要流尽，水潭上的月亮又要西落。
          - ancient: 斜月沉沉藏海雾，碣石潇湘无限路。
            vernacular: 斜月慢慢下沉，藏在海雾里，碣石与潇湘的离人距离无限遥远。
          - ancient: 不知乘月几人归，落月摇情满江树。
            vernacular: 不知有几人能趁着月光回家，唯有那西落的月亮摇荡着离情，洒满了江边的树林。
  - poem: 山居秋暝
    type: 诗词曲
    author: 王维
    created_at: 盛唐
    paragraphs:
      - paragraph: 空山
        url: https://baike.baidu.com/item/%E5%B1%B1%E5%B1%85%E7%A7%8B%E6%9A%9D/2794200
        sentences:
          - ancient: 空山新雨后，天气晚来秋。
            vernacular: 空旷的群山沐浴了一场新雨，夜晚降临使人感到已是初秋。
          - ancient: 明月松间照，清泉石上流。
            vernacular: 皎皎明月从松隙间洒下清光，清清泉水在山石上淙淙淌流。
          - ancient: 竹喧归浣女，莲动下渔舟。
            vernacular: 竹林喧响知是洗衣姑娘归来，莲叶轻摇想是上游荡下轻舟。
          - ancient: 随意春芳歇，王孙自可留。
            vernacular: 春日的芳菲不妨任随它消歇，秋天的山中王孙自可以久留。
  - poem: 蜀道难
    type: 诗词曲
    author: 李白
    created_at: 盛唐
    paragraphs:
      - paragraph: 噫吁
        url: https://baike.baidu.com/item/%E8%9C%80%E9%81%93%E9%9A%BE/14470
        sentences:
          - ancient: 噫吁嚱，危乎高哉！蜀道之难，难于上青天！
            vernacular: 唉呀呀，多么高峻多么伟岸！蜀道真太难攀简直难于上青天。
          - ancient: 蚕丛及鱼凫，开国何茫然！
            vernacular: 传说中蚕丛和鱼凫建立了蜀国，开国的年代实在久远无法详谈。
          - ancient: 尔来四万八千岁，不与秦塞通人烟。
            vernacular: 自从那时至今约有四万八千年，秦蜀被秦岭所阻从不沟通往返。
          - ancient: 西当太白有鸟道，可以横绝峨眉巅。
            vernacular: 西边太白山有飞鸟能过的小道。从那小路走可横渡峨嵋山顶端。
          - ancient: 地崩山摧壮士死，然后天梯石栈相钩连。
            vernacular: 山崩地裂蜀国五壮士被压死了，两地才有天梯栈道开始相通连。
          - ancient: 上有六龙回日之高标，下有冲波逆折之回川。
            vernacular: 上有挡住太阳神六龙车的山巅，下有激浪排空纡回曲折的大川。
          - ancient: 黄鹤之飞尚不得过，猿猱欲度愁攀援。
            vernacular: 善于高飞的黄鹤尚且无法飞过，即使猢狲要想翻过也愁于攀援。
          - ancient: 青泥何盘盘，百步九折萦岩峦。
            vernacular: 青泥岭多么曲折绕着山峦盘旋，百步之内萦绕岩峦转九个弯弯。
          - ancient: 扪参历井仰胁息，以手抚膺坐长叹。
            vernacular: 可以摸到参井星叫人仰首屏息，用手抚胸惊恐不已徒劳地长叹。
          - ancient: 问君西游何时还？畏途巉岩不可攀。
            vernacular: 好朋友呵请问你西游何时回还？可怕的岩山栈道实在难以登攀！
          - ancient: 但见悲鸟号古木，雄飞雌从绕林间。
            vernacular: 只见那悲鸟在古树上哀鸣啼叫，雄雌相随飞翔在原始森林之间。
          - ancient: 又闻子规啼夜月，愁空山。
            vernacular: 月夜听到的是杜鹃悲惨的啼声，令人愁思绵绵呵这荒荡的空山！
          - ancient: 蜀道之难，难于上青天，使人听此凋朱颜。
            vernacular: 蜀道真难走呵简直难于上青天，叫人听到这些怎么不脸色突变？
          - ancient: 连峰去天不盈尺，枯松倒挂倚绝壁。
            vernacular: 山峰座座相连离天还不到一尺；枯松老枝倒挂倚贴在绝壁之间。
          - ancient: 飞湍瀑流争喧豗，砯崖转石万壑雷。
            vernacular: 漩涡飞转瀑布飞泻争相喧闹着；水石相击转动像万壑鸣雷一般。
          - ancient: 其险也如此，嗟尔远道之人胡为乎来哉！
            vernacular: 那去处恶劣艰险到了这种地步；唉呀呀你这个远方而来的客人，为了什么要来到这个险要地方？
          - ancient: 剑阁峥嵘而崔嵬，一夫当关，万夫莫开。
            vernacular: 剑阁那地方崇峻巍峨高入云端，只要一人把守千军万马难攻占。
          - ancient: 所守或匪亲，化为狼与豺。
            vernacular: 驻守的官员若不是皇家的近亲；难免要变为豺狼踞此为非造反。
          - ancient: 朝避猛虎，夕避长蛇。
            vernacular: 清晨你要提心吊胆地躲避猛虎，傍晚你要警觉防范长蛇的灾难。
          - ancient: 磨牙吮血，杀人如麻。
            vernacular: 豺狼虎豹磨牙吮血真叫人不安，毒蛇猛兽杀人如麻即令你胆寒。
          - ancient: 锦城虽云乐，不如早还家。
            vernacular: 锦官城虽然说是个快乐的所在，如此险恶还不如早早地把家还。
          - ancient: 蜀道之难，难于上青天，侧身西望长咨嗟！
            vernacular: 蜀道太难走呵简直难于上青天，侧身西望令人不免感慨与长叹！
  - poem: 梦游天姥吟留别
    type: 诗词曲
    author: 李白
    created_at: 盛唐
    paragraphs:
      - paragraph: 海客
        url: https://baike.baidu.com/item/%E6%A2%A6%E6%B8%B8%E5%A4%A9%E5%A7%A5%E5%90%9F%E7%95%99%E5%88%AB
        sentences:
          - ancient: 海客谈瀛洲，烟涛微茫信难求。
            vernacular: 海外来客们谈起瀛洲，烟波渺茫实在难以寻求。
          - ancient: 越人语天姥，云霞明灭或可睹。
            vernacular: 越中来人说起天姥山，在云雾忽明忽暗间有时可以看见。
          - ancient: 天姥连天向天横，势拔五岳掩赤城。
            vernacular: 天姥山仿佛连接着天遮断了天空，山势高峻超过五岳，遮掩过赤城山。
          - ancient: 天台四万八千丈，对此欲倒东南倾。
            vernacular: 天台山虽高四万八千丈，面对着它好像要向东南倾斜拜倒一样。
          - ancient: 我欲因之梦吴越，一夜飞度镜湖月。
            vernacular: 我根据越人说的话梦游到吴越，一天夜晚飞渡过明月映照下的镜湖。
          - ancient: 湖月照我影，送我至剡溪。
            vernacular: 镜湖上的月光照着我的影子，一直伴随我到了剡溪。
          - ancient: 谢公宿处今尚在，渌水荡漾清猿啼。
            vernacular: 谢灵运住的地方如今还在，清澈的湖水荡漾，猿猴清啼。
          - ancient: 脚著谢公屐，身登青云梯。
            vernacular: 我脚上穿着谢公当年特制的木鞋，攀登直上云霄的山路。
          - ancient: 半壁见海日，空中闻天鸡。
            vernacular: 上到半山腰就看见了从海上升起的太阳，在半空中传来天鸡报晓的叫声。
          - ancient: 千岩万转路不定，迷花倚石忽已暝。
            vernacular: 无数山岩重叠，道路盘旋弯曲，方向不定，迷恋着花，依倚着石头，不觉天色已晚。
          - ancient: 熊咆龙吟殷岩泉，栗深林兮惊层巅。
            vernacular: 熊在怒吼，龙在长鸣，岩中的泉水在震响，使森林战栗，使山峰惊颤。
          - ancient: 云青青兮欲雨，水澹澹兮生烟。
            vernacular: 云层黑沉沉的，像是要下雨，水波动荡升起了烟雾。
          - ancient: 列缺霹雳，丘峦崩摧。
            vernacular: 电光闪闪，雷声轰鸣，山峰好像要崩塌似的。
          - ancient: 洞天石扉，訇然中开。
            vernacular: 仙府的石门，“訇”的一声从中间打开。
          - ancient: 青冥浩荡不见底，日月照耀金银台。
            vernacular: 洞中蔚蓝的天空广阔无际，看不到尽头，日月照耀着金银做的宫阙。
          - ancient: 霓为衣兮风为马，云之君兮纷纷而来下。
            vernacular: 用彩虹做衣裳，将风作为马来乘，云中的神仙们纷纷下来。
          - ancient: 虎鼓瑟兮鸾回车，仙之人兮列如麻。
            vernacular: 老虎弹奏着琴瑟，鸾鸟驾着车，仙人们成群结队密密如麻。
          - ancient: 忽魂悸以魄动，恍惊起而长嗟。
            vernacular: 忽然魂魄惊动，我猛然惊醒，不禁长声叹息。
          - ancient: 惟觉时之枕席，失向来之烟霞。
            vernacular: 醒来时只有身边的枕席，刚才梦中所见的烟雾云霞全都消失了。
          - ancient: 世间行乐亦如此，古来万事东流水。
            vernacular: 人世间的欢乐也是像梦中的幻境这样，自古以来万事都像东流的水一样一去不复返。
          - ancient: 别君去兮何时还？
            vernacular: 告别诸位朋友远去东鲁啊，什么时候才能回来？
          - ancient: 且放白鹿青崖间，须行即骑访名山。
            vernacular: 暂且把白鹿放牧在青崖间，等到要远行时就骑上它访名山。
          - ancient: 安能摧眉折腰事权贵，使我不得开心颜！
            vernacular: 岂能卑躬屈膝去侍奉权贵，使我不能有舒心畅意的笑颜！
  - poem: 将进酒
    type: 诗词曲
    author: 李白
    created_at: 盛唐
    paragraphs:
      - paragraph: 君不
        url: https://baike.baidu.com/item/%E5%B0%86%E8%BF%9B%E9%85%92/5312
        sentences:
          - ancient: 君不见黄河之水天上来，奔流到海不复回。
            vernacular: 你可见黄河水从天上流下来，波涛滚滚直奔向大海不回还。
          - ancient: 君不见高堂明镜悲白发，朝如青丝暮成雪。
            vernacular: 你可见高堂明镜中苍苍白发，早上满头青丝晚上就如白雪。
          - ancient: 人生得意须尽欢，莫使金樽空对月。
            vernacular: 人生得意时要尽情享受欢乐，不要让金杯空对皎洁的明月。
          - ancient: 天生我材必有用，千金散尽还复来。
            vernacular: 天造就了我成材必定会有用，即使散尽黄金也还会再得到，
          - ancient: 烹羊宰牛且为乐，会须一饮三百杯。
            vernacular: 煮羊宰牛姑且尽情享受欢乐，一气喝他三百杯也不要嫌多。
          - ancient: 岑夫子，丹丘生，将进酒，杯莫停。
            vernacular: 岑夫子啊，丹丘生啊，快喝酒啊，不要停啊。
          - ancient: 与君歌一曲，请君为我倾耳听。
            vernacular: 我为在坐各位朋友高歌一曲，请你们一定要侧耳细细倾听。
          - ancient: 钟鼓馔玉不足贵，但愿长醉不复醒。
            vernacular: 钟乐美食这样的富贵不稀罕，我愿永远沉醉酒中不愿清醒。
          - ancient: 古来圣贤皆寂寞，惟有饮者留其名。
            vernacular: 圣者仁人自古就寂然悄无声，只有那善饮的人才留下美名。
          - ancient: 陈王昔时宴平乐，斗酒十千恣欢谑。
            vernacular: 当年陈王曹植平乐观摆酒宴，一斗美酒值万钱他们开怀饮。
          - ancient: 主人何为言少钱，径须沽取对君酌。
            vernacular: 主人你为什么说钱已经不多，你尽管端酒来让我陪朋友喝。
          - ancient: 五花马、千金裘，呼儿将出换美酒，与尔同销万古愁。
            vernacular: 管它名贵五花马还是狐皮裘，快叫侍儿拿去统统来换美酒，与你同饮来消融这万古长愁。
  - poem: 燕歌行
    type: 诗词曲
    author: 高适
    created_at: 盛唐
    paragraphs:
      - paragraph: 开元
        url: https://baike.baidu.com/item/%E7%87%95%E6%AD%8C%E8%A1%8C/2614588
        sentences:
          - ancient: 开元二十六年，客有从御史大夫张公出塞而还者，作《燕歌行》以示。
            vernacular: 唐玄宗开元二十六年，有个随从主帅出塞回来的人，写了《燕歌行》诗一首给我看。
          - ancient: 适感征戍之事，因而和焉。
            vernacular: 我感慨于边疆战守的事，因而写了这首《燕歌行》应和他。
          - ancient: 汉家烟尘在东北，汉将辞家破残贼。
            vernacular: 唐朝边境举烟火狼烟东北起尘土，唐朝将军辞家去欲破残忍之边贼。
          - ancient: 男儿本自重横行，天子非常赐颜色。
            vernacular: 战士们本来在战场上就所向无敌，皇帝又特别给予他们丰厚的赏赐。
          - ancient: 摐金伐鼓下榆关，旌旆逶迤碣石间。
            vernacular: 锣声响彻重鼓棰声威齐出山海关，旌旗迎风又逶迤猎猎碣石之山间。
          - ancient: 校尉羽书飞瀚海，单于猎火照狼山。
            vernacular: 校尉紧急传羽书飞奔浩瀚之沙海，匈奴单于举猎火光照已到我狼山。
          - ancient: 山川萧条极边土，胡骑凭陵杂风雨。
            vernacular: 山河荒芜多萧条满目凄凉到边土，胡人骑兵仗威力兵器声里夹风雨。
          - ancient: 战士军前半死生，美人帐下犹歌舞。
            vernacular: 战士拼斗军阵前半数死去半生还，美人却在营帐中还是歌来还是舞！
          - ancient: 大漠穷秋塞草腓，孤城落日斗兵稀。
            vernacular: 时值深秋大沙漠塞外百草尽凋枯，孤城一片映落日战卒越斗越稀少。
          - ancient: 身当恩遇恒轻敌，力尽关山未解围。
            vernacular: 身受皇家深恩义常思报国轻寇敌，边塞之地尽力量尚未破除匈奴围。
          - ancient: 铁衣远戍辛勤久，玉箸应啼别离后。
            vernacular: 身穿铁甲守边远疆场辛勤已长久，珠泪纷落挂双目丈夫远去独啼哭。
          - ancient: 少妇城南欲断肠，征人蓟北空回首。
            vernacular: 少妇孤单住城南泪下凄伤欲断肠，远征军人驻蓟北依空仰望频回头。
          - ancient: 边庭飘飖那可度，绝域苍茫更何有。
            vernacular: 边境飘渺多遥远怎可轻易来奔赴，绝远之地尽苍茫更是人烟何所有。
          - ancient: 杀气三时作阵云，寒声一夜传刁斗。
            vernacular: 杀气早中晚三时腾起阵前似乌云，一夜寒风声声里如泣更声惊耳鼓。
          - ancient: 相看白刃血纷纷，死节从来岂顾勋。
            vernacular: 互看白刃乱飞舞夹杂着鲜血纷飞，从来死节为报国难道还求著功勋？
          - ancient: 君不见沙场征战苦，至今犹忆李将军。
            vernacular: 你没看见拼杀在沙场战斗多惨苦，现在还在思念有勇有谋的李将军。
  - poem: 蜀相
    type: 诗词曲
    author: 杜甫
    created_at: 盛唐
    paragraphs:
      - paragraph: 丞相
        url: https://baike.baidu.com/item/%E8%9C%80%E7%9B%B8/160949
        sentences:
          - ancient: 丞相祠堂何处寻？锦官城外柏森森。
            vernacular: 诸葛丞相的祠堂去哪里寻找？锦官城外翠柏长得郁郁苍苍。
          - ancient: 映阶碧草自春色，隔叶黄鹂空好音。
            vernacular: 碧草映照石阶自有一片春色，黄鹂在密叶间空有美妙歌声。
          - ancient: 三顾频烦天下计，两朝开济老臣心。
            vernacular: 当年先主屡次向您求教大计，辅佐先主开国扶助后主继业。
          - ancient: 出师未捷身先死，长使英雄泪满襟。
            vernacular: 可惜您却出师征战病死军中，常使古今英雄感慨泪湿衣襟。
  - poem: 客至
    type: 诗词曲
    author: 杜甫
    created_at: 唐代
    paragraphs:
      - paragraph: 喜崔
        url: https://baike.baidu.com/item/%E5%AE%A2%E8%87%B3/2813842
        sentences:
          - ancient: 喜崔明府相过
            vernacular: 为崔明府的到访而感到高兴
          - ancient: 舍南舍北皆春水，但见群鸥日日来。
            vernacular: 草堂的南北涨满了春水，只见鸥群日日结队飞来。
          - ancient: 花径不曾缘客扫，蓬门今始为君开。
            vernacular: 不曾为客扫过花径，今天才为您扫；柴门不曾为客开过，今天为您打开。
          - ancient: 盘飧市远无兼味，樽酒家贫只旧醅。
            vernacular: 离市太远晚餐中没有好菜肴，家底太薄只有陈酒招待。
          - ancient: 肯与邻翁相对饮，隔篱呼取尽余杯。
            vernacular: 若肯与隔壁的老翁一同对饮，就隔着篱笆将他唤来！
  - poem: 登高
    type: 诗词曲
    author: 杜甫
    created_at: 中唐
    paragraphs:
      - paragraph: 风急
        url: https://baike.baidu.com/item/%E7%99%BB%E9%AB%98/7605079
        sentences:
          - ancient: 风急天高猿啸哀，渚清沙白鸟飞回。
            vernacular: 秋风急秋气高猿声凄哀，洲渚青沙滩白鸟儿回旋。
          - ancient: 无边落木萧萧下，不尽长江滚滚来。
            vernacular: 落叶一望无际萧萧堕下，长江不见尽头滚滚涌来。
          - ancient: 万里悲秋常作客，百年多病独登台。
            vernacular: 万里悲秋感慨长期漂泊，一生多病独自登上高台。
          - ancient: 艰难苦恨繁霜鬓，潦倒新停浊酒杯。
            vernacular: 深为憾恨鬓发日益斑白，困顿潦倒病后停酒伤怀。
  - poem: 登岳阳楼
    type: 诗词曲
    author: 杜甫
    created_at: 唐代
    paragraphs:
      - paragraph: 昔闻
        url: https://baike.baidu.com/item/%E7%99%BB%E5%B2%B3%E9%98%B3%E6%A5%BC/295
        sentences:
          - ancient: 昔闻洞庭水，今上岳阳楼。
            vernacular: 从前只听说洞庭湖茫茫大水，如今有幸登上湖边的岳阳楼。
          - ancient: 吴楚东南坼，乾坤日夜浮。
            vernacular: 大湖浩瀚像把吴楚东南隔开，天地像在湖面日夜荡漾漂浮。
          - ancient: 亲朋无一字，老病有孤舟。
            vernacular: 没有得到亲朋故旧一字音信，年老体弱之身只剩一叶孤舟。
          - ancient: 戎马关山北，凭轩涕泗流。
            vernacular: 关山以北战争烽火仍未止息，凭栏遥望胸怀家国泪水横流。
  - poem: 琵琶行（并序）
    type: 诗词曲
    author: 白居易
    created_at: 中唐
    paragraphs:
      - paragraph: 元和
        url: https://baike.baidu.com/item/%E7%90%B5%E7%90%B6%E8%A1%8C/69544
        sentences:
          - ancient: 元和十年，予左迁九江郡司马。
            vernacular: 元和十年，我被贬为九江郡司马。
          - ancient: 明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。
            vernacular: 次年秋天，到湓浦口送客，听到邻舟有一女子在夜晚弹奏琵琶，细审那声音，铿铿锵锵颇有点京城的风味。
          - ancient: 问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。
            vernacular: 我询问她的来历，原来是长安的乐伎，曾经跟穆、曹这两位琵琶名家学习技艺，后来年长色衰，嫁给一位商人为妻。
          - ancient: 遂命酒，使快弹数曲。
            vernacular: 于是我吩咐摆酒，请她尽情地弹几支曲子。
          - ancient: 曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。
            vernacular: 她演奏完毕，神态忧伤，叙说自己年青时欢乐的往事，但如今漂泊沦落，憔悴不堪，在江湖之间飘零流浪。
          - ancient: 予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。
            vernacular: 我出任地方官已将两年，一向心境平和，她的话却使我有所触动，这一晚竟然有被贬逐的感受。
          - ancient: 因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。
            vernacular: 于是撰写了这首七言歌行，吟唱一番来赠送给她，一共有六百一十六字，命题为《琵琶行》。
          - ancient: 浔阳江头夜送客，枫叶荻花秋瑟瑟。
            vernacular: 在一个夜晚我到浔阳江边送客，秋风吹动枫叶和荻花响声瑟瑟。
          - ancient: 主人下马客在船，举酒欲饮无管弦。
            vernacular: 主人和客人一起下马走上了船，端杯要饮酒却没有助兴的管弦。
          - ancient: 醉不成欢惨将别，别时茫茫江浸月。
            vernacular: 闷闷地喝醉酒便待凄伤地分别，临别只见茫茫江水浸映着明月。
          - ancient: 忽闻水上琵琶声，主人忘归客不发。
            vernacular: 忽听得江面上传来琵琶清脆声，主人忘却归去客人也不想出发。
          - ancient: 寻声暗问弹者谁？琵琶声停欲语迟。
            vernacular: 寻着声源探问弹琵琶的是何人？琵琶声停想要答话又有点迟疑。
          - ancient: 移船相近邀相见，添酒回灯重开宴。
            vernacular: 开船移到近旁邀请她过船相见，剔亮灯光增添酒菜再摆开酒宴。
          - ancient: 千呼万唤始出来，犹抱琵琶半遮面。
            vernacular: 经过千呼万唤她才缓缓走出来，怀里还抱着琵琶遮着半边脸面。
          - ancient: 转轴拨弦三两声，未成曲调先有情。
            vernacular: 转紧琴轴拨动琴弦试弹两三声，尚未成曲调那形态就非常有情。
          - ancient: 弦弦掩抑声声思，似诉平生不得志。
            vernacular: 弦弦凄楚悲切声音隐含着沉思，似乎在诉说着她平生的不得志；
          - ancient: 低眉信手续续弹，说尽心中无限事。
            vernacular: 她低着头随手连续地弹个不停，用琴声说尽了心中无限的情事。
          - ancient: 轻拢慢捻抹复挑，初为《霓裳》后《六幺》。
            vernacular: 轻轻抚拢慢慢捻揉下抹又上挑，初弹霓裳羽衣曲接着再弹六幺。
          - ancient: 大弦嘈嘈如急雨，小弦切切如私语。
            vernacular: 大弦浑宏悠长嘈嘈如暴风骤雨，小弦和缓幽细切切如有人私语。
          - ancient: 嘈嘈切切错杂弹，大珠小珠落玉盘。
            vernacular: 嘈嘈声切切声互为交错地弹奏，就像大珠小珠一串串掉落玉盘。
          - ancient: 间关莺语花底滑，幽咽泉流冰下难。
            vernacular: 呖呖的莺声从花底下悠然滑去，幽咽的泉水在冰下流得很艰难。
          - ancient: 冰泉冷涩弦凝绝，凝绝不通声暂歇。
            vernacular: 好像水泉冷涩琵琶声开始凝结，凝结而不通畅声音渐渐地停歇。
          - ancient: 别有幽愁暗恨生，此时无声胜有声。
            vernacular: 像另有一种愁思幽恨暗暗滋生，此时闷闷无声却比有声更动人。
          - ancient: 银瓶乍破水浆迸，铁骑突出刀枪鸣。
            vernacular: 突然间好像银瓶撞破水浆四溅，又好像铁甲骑兵厮杀刀枪齐鸣。
          - ancient: 曲终收拨当心画，四弦一声如裂帛。
            vernacular: 一曲终了她对准琴弦中心划拨，四弦一声轰鸣好像撕裂了绢帛。
          - ancient: 东船西舫悄无言，唯见江心秋月白。
            vernacular: 东船西舫人们都静悄悄地聆听，只见江心之中映着白白秋月影。
          - ancient: 沉吟放拨插弦中，整顿衣裳起敛容。
            vernacular: 她沉吟着收起拨子插在琴弦中，整顿衣裳依然显出庄重的颜容。
          - ancient: 自言本是京城女，家在虾蟆陵下住。
            vernacular: 她说原是京城负有盛名的歌女，老家住在长安城东南的虾蟆陵。
          - ancient: 十三学得琵琶成，名属教坊第一部。
            vernacular: 弹奏琵琶技艺十三岁就已学成，教坊乐团第一队中列有我姓名。
          - ancient: 曲罢曾教善才服，妆成每被秋娘妒。
            vernacular: 每曲弹罢都令艺术大师们叹服，每次妆成都被同行歌妓们嫉妒。
          - ancient: 五陵年少争缠头，一曲红绡不知数。
            vernacular: 京都豪富子弟争先恐后来献彩，弹完一曲收来的红绡不知其数。
          - ancient: 钿头银篦击节碎，血色罗裙翻酒污。
            vernacular: 钿头银篦打节拍常常断裂粉碎，红色罗裙被酒渍染污也不后悔。
          - ancient: 今年欢笑复明年，秋月春风等闲度。
            vernacular: 年复一年都在欢笑打闹中度过，秋去春来美好的时光白白消磨。
          - ancient: 弟走从军阿姨死，暮去朝来颜色故。
            vernacular: 兄弟从军姊妹死家道已经破败，暮去朝来我也渐渐地年老色衰。
          - ancient: 门前冷落鞍马稀，老大嫁作商人妇。
            vernacular: 门前车马减少光顾者落落稀稀，青春已逝我只得嫁给商人为妻。
          - ancient: 商人重利轻别离，前月浮梁买茶去。
            vernacular: 商人重利不重情常常轻易别离，上个月他去浮梁做茶叶的生意。
          - ancient: 去来江口守空船，绕船月明江水寒。
            vernacular: 他去了留下我在江口孤守空船，秋月与我作伴绕舱的秋水凄寒。
          - ancient: 夜深忽梦少年事，梦啼妆泪红阑干。
            vernacular: 更深夜阑常梦少年时作乐狂欢，梦中哭醒涕泪纵横污损了粉颜。
          - ancient: 我闻琵琶已叹息，又闻此语重唧唧。
            vernacular: 我听到悲泣的琵琶声已经叹息，又听到她的这番诉说更为悲戚。
          - ancient: 同是天涯沦落人，相逢何必曾相识！
            vernacular: 我们俩都是流落天涯的失意人，今日相逢何必问是否曾经相识！
          - ancient: 我从去年辞帝京，谪居卧病浔阳城。
            vernacular: 自从去年我离开繁华长安京城，被贬居住在浔阳江畔常常卧病。
          - ancient: 浔阳地僻无音乐，终岁不闻丝竹声。
            vernacular: 浔阳这地方荒凉偏僻没有音乐，一年到头听不到管弦的乐器声。
          - ancient: 住近湓江地低湿，黄芦苦竹绕宅生。
            vernacular: 住在湓江这个低洼潮湿的地方，第宅周围黄芦和苦竹缭绕丛生。
          - ancient: 其间旦暮闻何物？杜鹃啼血猿哀鸣。
            vernacular: 在这里早晚能听到的是什么呢？尽是杜鹃猿猴那些悲凄的哀鸣。
          - ancient: 春江花朝秋月夜，往往取酒还独倾。
            vernacular: 春江花朝秋江月夜那样好光景，也无可奈何常常取酒独酌独饮。
          - ancient: 岂无山歌与村笛？呕哑嘲哳难为听。
            vernacular: 难道这里就没有山歌和村笛吗？只是那音调嘶哑粗涩实在难听。
          - ancient: 今夜闻君琵琶语，如听仙乐耳暂明。
            vernacular: 今晚我听你弹奏琵琶诉说衷情，就像听到仙乐眼也亮来耳也明。
          - ancient: 莫辞更坐弹一曲，为君翻作《琵琶行》。
            vernacular: 请你不要推辞再坐下弹奏一曲，我要为你按曲谱作一首琵琶行。
          - ancient: 感我此言良久立，却坐促弦弦转急。
            vernacular: 被我的话所感动她站立了好久，重新入座转紧琴弦把音高调急。
          - ancient: 凄凄不似向前声，满座重闻皆掩泣。
            vernacular: 凄凄切切不再像刚才那种声音，满座的人重听之后都掩面而泣。
          - ancient: 座中泣下谁最多？江州司马青衫湿。
            vernacular: 要问在座之中谁流的眼泪最多？江州司马的青色官袍已经沾湿。
  - poem: 李凭箜篌引
    type: 诗词曲
    author: 李贺
    created_at: 中唐
    paragraphs:
      - paragraph: 吴丝
        url: https://baike.baidu.com/item/%E6%9D%8E%E5%87%AD%E7%AE%9C%E7%AF%8C%E5%BC%95/2880645
        sentences:
          - ancient: 吴丝蜀桐张高秋，空山凝云颓不流。
            vernacular: 在深秋的夜晚，弹奏起吴丝蜀桐制成精美的箜篌。听到美妙的乐声，天空的白云凝聚起来不再飘游。
          - ancient: 江娥啼竹素女愁，李凭中国弹箜篌。
            vernacular: 湘娥把泪珠洒满斑竹，九天素女也牵动满腔忧愁。出现这种情况，是由于乐工李凭在京城弹奏箜篌。
          - ancient: 昆山玉碎凤凰叫，芙蓉泣露香兰笑。
            vernacular: 乐声清脆动听得就像昆仑山美玉击碎，凤凰鸣叫；时而使芙蓉在露水中饮泣，时而使香兰开怀欢笑。
          - ancient: 十二门前融冷光，二十三丝动紫皇。
            vernacular: 清脆的乐声，融和了长安城十二门前的清冷光气。二十三根弦丝高弹轻拨，打动了高高在上的天帝。
          - ancient: 女娲炼石补天处，石破天惊逗秋雨。
            vernacular: 高亢的乐声直冲云霄，冲上女娲炼石补过的天际。好似补天的五彩石被击破，逗落了漫天绵绵秋雨。
          - ancient: 梦入神山教神妪，老鱼跳波瘦蛟舞。
            vernacular: 幻觉中仿佛乐工进入了神山，把技艺向女仙传授；老鱼兴奋得在波中跳跃，瘦蛟也翩翩起舞乐悠悠。
          - ancient: 吴质不眠倚桂树，露脚斜飞湿寒兔。
            vernacular: 月宫中吴刚被乐声吸引，彻夜不眠在桂树下逗留。桂树下的兔子也伫立聆听，不顾露珠斜飞寒飕飕！ 
  - poem: 菩萨蛮·小山重叠金明灭
    type: 诗词曲
    author: 温庭筠
    created_at: 晚唐
    paragraphs:
      - paragraph: 小山
        url: https://baike.baidu.com/item/%E8%8F%A9%E8%90%A8%E8%9B%AE%C2%B7%E5%B0%8F%E5%B1%B1%E9%87%8D%E5%8F%A0%E9%87%91%E6%98%8E%E7%81%AD
        sentences:
