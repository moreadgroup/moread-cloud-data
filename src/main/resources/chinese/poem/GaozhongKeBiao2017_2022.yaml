poems:
  - poem: 论语
    type: 文言文必修
    author: 春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子的言行
    created_at: 战国前期
    paragraphs:
      - paragraph: 人而
        url: https://baike.baidu.com/item/%E4%BA%BA%E8%80%8C%E4%B8%8D%E4%BB%81
        sentences:
          - 子曰：“人而不仁，如礼何？人而不仁，如乐（yue）何？”
      - paragraph: 朝闻
        url: https://baike.baidu.com/item/%E6%9C%9D%E9%97%BB%E9%81%93/13326
        sentences:
          - 子曰：朝闻道，夕死可矣。
      - paragraph: 君子
        url: https://baike.baidu.com/item/%E5%90%9B%E5%AD%90%E5%96%BB%E4%BA%8E%E4%B9%89
        sentences:
          - 君子喻于义，小人喻于利。
      - paragraph: 见贤
        url: https://baike.baidu.com/item/%E8%A7%81%E8%B4%A4%E6%80%9D%E9%BD%90%E7%84%89
        sentences:
          - 见贤思齐焉，见不贤而内自省也。
      - paragraph: 质胜
        url: https://baike.baidu.com/item/%E8%B4%A8%E8%83%9C%E6%96%87%E5%88%99%E9%87%8E
        sentences:
          - 质胜文则野，文胜质则史，文质彬彬，然后君子。
      - paragraph: 士不
        url: https://baike.baidu.com/item/%E5%A3%AB%E4%B8%8D%E5%8F%AF%E4%BB%A5%E4%B8%8D%E5%BC%98%E6%AF%85
        sentences:
          - 士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？
      - paragraph: 譬如
        url: https://baike.baidu.com/item/%E6%9C%AA%E6%88%90%E4%B8%80%E7%AF%91/6751560
        sentences:
          - 譬如为山，未成一篑，止吾止也。
      - paragraph: 知者
        url: https://baike.baidu.com/item/%E7%9F%A5%E8%80%85%E4%B8%8D%E6%83%91
        sentences:
          - 知者不惑，仁者不忧，勇者不惧。
      - paragraph: 有一
        url: https://baike.baidu.com/item/%E5%8D%AB%E7%81%B5%E5%85%AC/20400580
        sentences:
          - 子贡问曰：“有一言而可以终身行之者乎?” 子曰：“其恕乎!己所不欲，勿施于人。”(《卫灵公》)
      - paragraph: 小子
        url: https://baike.baidu.com/item/%E8%AE%BA%E8%AF%AD%E4%B8%89%E5%88%99/2067460
        sentences:
          - 子曰：“小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君，多识于鸟兽草木之名。”
      - paragraph: 君子食
        url: https://baike.baidu.com/item/%E9%A3%9F%E6%97%A0%E6%B1%82%E9%A5%B1
        sentences:
          - 君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。
      - paragraph: 克己
        url: https://baike.baidu.com/item/%E5%85%8B%E5%B7%B1%E5%A4%8D%E7%A4%BC/367617
        sentences:
          - 颜渊问仁。
          - 子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”
          - 颜渊曰：“请问其目。”
          - 子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”
          - 颜渊曰：“回虽不敏，请事斯语矣。”（《论语·颜渊》）
  - poem: 劝学
    author: 荀子
    created_at: 战国后期
    type: 文言文必修
    paragraphs:
      - paragraph: 学不
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。
      - paragraph: 故不
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 故不登高山，不知天之高也；不临深溪，不知地之厚也；不闻先王之遗言，不知学问之大也。
          - 干、越、夷、貉之子，生而同声，长而异俗，教使之然也。
          - 诗曰：“嗟尔君子，无恒安息。靖共尔位，好是正直。神之听之，介尔景福。”
          - 神莫大于化道，福莫长于无祸。
      - paragraph: 吾尝
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。
          - 登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。
          - 假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。
          - 君子生非异也，善假于物也。
      - paragraph: 南方
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 南方有鸟焉，名曰蒙鸠，以羽为巢，而编之以发，系之苇苕，风至苕折，卵破子死。
          - 巢非不完也，所系者然也。
          - 西方有木焉，名曰射干，茎长四寸，生于高山之上，而临百仞之渊，木茎非能长也，所立者然也。
          - 蓬生麻中，不扶而直；白沙在涅，与之俱黑。
          - 兰槐之根是为芷，其渐之滫，君子不近，庶人不服。
          - 其质非不美也，所渐者然也。
          - 故君子居必择乡，游必就士，所以防邪辟而近中正也。
      - paragraph: 物类
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 物类之起，必有所始。荣辱之来，必象其德。
          - 肉腐出虫，鱼枯生蠹。怠慢忘身，祸灾乃作。
          - 强自取柱，柔自取束。
          - 邪秽在身，怨之所构。
          - 施薪若一，火就燥也，平地若一，水就湿也。
          - 草木畴生，禽兽群焉，物各从其类也。
          - 是故质的张，而弓矢至焉；林木茂，而斧斤至焉；树成荫，而众鸟息焉。
          - 醯酸，而蜹聚焉。
          - 故言有招祸也，行有招辱也，君子慎其所立乎！
      - paragraph: 积土
        url: https://baike.baidu.com/item/%E5%8A%9D%E5%AD%A6/1055
        sentences:
          - 积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。
          - 故不积跬步，无以至千里；不积小流，无以成江海。
          - 骐骥一跃，不能十步；驽马十驾，功在不舍。
          - 锲而舍之，朽木不折；锲而不舍，金石可镂。
          - 蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。
          - 蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。
          - 是故无冥冥之志者，无昭昭之明；无惛惛之事者，无赫赫之功。
          - 行衢道者不至，事两君者不容。目不能两视而明，耳不能两听而聪。
          - 螣蛇无足而飞，鼫鼠五技而穷。
          - 《诗》曰：“尸鸠在桑，其子七兮。淑人君子，其仪一兮。其仪一兮，心如结兮！”
          - 故君子结于一也。
  - poem: 屈原列传
    type: 文言文必修
    author: 司马迁
    created_at: 战国后期
    paragraphs:
      - paragraph: 屈原
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - 屈原者，名平，楚之同姓也。为楚怀王左徒。
          - 博闻强志，明于治乱，娴于辞令。
          - 入则与王图议国事，以出号令，出则接遇宾客，应对诸侯。
          - 王甚任之。
      - paragraph: 上官
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - 上官大夫与之同列，争宠而心害其能。
          - 怀王使屈原造为宪令，屈平属草稿未定。
          - 上官大夫见而欲夺之，屈平不与，因谗之曰：“王使屈平为令，众莫不知，每一令出，平伐其功，曰：以为‘非我莫能为’也。”
          - 王怒而疏屈平。
      - paragraph: 屈平
        url: https://baike.baidu.com/item/%E5%B1%88%E5%8E%9F%E5%88%97%E4%BC%A0
        sentences:
          - 屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思，而作《离骚》。
          - “离骚”者，犹离忧也。
          - 夫天者，人之始也;父母者，人之本也。
          - 人穷则反本，故劳苦倦极，未尝不呼天也，疾痛惨怛，未尝不呼父母也。
          - 屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣!信而见疑，忠而被谤，能无怨乎?屈平之作《离骚》，盖自怨生也。
          - 《国风》好色而不淫，《小雅》怨诽而不乱。
          - 若《离骚》者，可谓兼之矣。
          - 上称帝喾，下道齐桓，中述汤、武，以刺世事。
          - 明道德之广崇，治乱之条贯，靡不毕见。
          - 其文约，其辞微，其志洁，其行廉。
          - 其称文小而其指极大，举类迩而见义远。
          - 其志洁，故其称物芳。
          - 其行廉，故死而不容。
          - 自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。
          - 推此志也，虽与日月争光可也。
  - poem: 谏太宗十思疏
    type: 文言文必修
    author: 魏征
    created_at: 唐代
    paragraphs:
      - paragraph: 臣闻
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - 臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。
          - 源不深而岂望流之远，根不固而何求木之长。
          - 德不厚而思国之治，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。
          - 不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。
      - paragraph: 凡百
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - 凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡，岂其取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下，既得志则纵情以傲物。
          - 竭诚则吴越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。
          - 怨不在大，可畏惟人；载舟覆舟，所宜深慎。
          - 奔车朽索，其可忽乎？
      - paragraph: 君人
        url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
        sentences:
          - 君人者，诚能见可欲则思知足以自戒，将有所作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无以怒而滥刑。
          - 总此十思，宏兹九德，简能而任之，择善而从之。则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，君臣无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！ [-]
  - poem: 师说
    type: 文言文必修
    author: 韩愈
    created_at: 唐代
    paragraphs:
      - paragraph: 古之
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - 古之学者必有师。
          - 师者，所以传道受业解惑也。
          - 人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。
          - 生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。
          - 吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。
      - paragraph: 嗟乎
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - 嗟乎！师道之不传也久矣！欲人之无惑也难矣！
          - 古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。
          - 是故圣益圣，愚益愚。
          - 圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。
          - 彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。
          - 句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。
          - 巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。
          - 问之，则曰：“彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。” 呜呼！师道之不复可知矣。
          - 巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！
      - paragraph: 圣人
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - 圣人无常师。
          - 孔子师郯子、苌弘、师襄、老聃。
          - 郯子之徒，其贤不及孔子。
          - 孔子曰：“三人行，则必有我师”。
          - 是故弟子不必不如师，师不必贤于弟子。
          - 闻道有先后，术业有专攻，如是而已。
      - paragraph: 李氏
        url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
        sentences:
          - 李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。
          - 余嘉其能行古道，作《师说》以贻之。 
  - poem: 阿房宫赋
    type: 文言文必修
    author: 杜牧
    created_at: 战国后期
    paragraphs:
      - paragraph: 六王
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - 六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁。廊腰 màn 缦回，檐牙高啄。各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融。舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。
      - paragraph: 妃嫔
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - 妃 pín 嫔 yìng 媵 qiáng 嫱，王子皇孙，辞楼下殿， niǎn 辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也。绿云扰扰，梳晓鬟也。渭流涨腻，弃脂水也。烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也。辘辘远听，杳不知其所之也。一肌一容，尽态极 yán 妍，缦立远视，而望幸焉。有不见者，三十六年。
      - paragraph: 燕赵
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - 燕赵之收藏，韩魏之经营，齐楚之精英，几世几年， piāo 剽掠其人，倚叠如山。一旦不能有，输来其间。鼎 chēng 铛玉石，金块珠砾，弃掷 lǐ 逦 yǐ 迤，秦人视之，亦不甚惜。
      - paragraph: 嗟乎
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - 嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽 zī 锱 zhū 铢，用之如泥沙？使负栋之柱，多于南亩之农夫。架梁之椽，多于机上之工女。钉头磷磷，多于在 yǔ 庾之粟粒。瓦缝参差，多于周身之帛缕。直栏横 jiàn 槛，多于九土之城郭。管弦 ōu 呕 yā 哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
        sentences:
          - 呜呼！灭六国者，六国也，非秦也。族秦者，秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦。使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之。后人哀之而不鉴之，亦使后人而复哀后人也。
  - poem: 六国论
    type: 文言文必修
    author: 苏洵
    created_at: 战国后期
    paragraphs:
      - paragraph: 六国
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - 六国破灭，非兵不利 ，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧，盖失强援，不能独完。故曰：弊在赂秦也。
      - paragraph: 秦以
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - 秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。
      - paragraph: 齐人
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - 齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - 呜呼！以赂秦之地，封天下之谋臣，以事秦之心，礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！
      - paragraph: 夫六
        url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
        sentences:
          - 夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。 
  - poem: 答司马谏议书
    type: 文言文必修
    author: 王安石
    created_at: 战国后期
    paragraphs:
      - paragraph: 某启
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - 某启：
          - 昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反复不宜卤莽，故今具道所以，冀君实或见恕也。
      - paragraph: 盖儒
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - 盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓：受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。
      - paragraph: 人习
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - 人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已。盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。
      - paragraph: 无由
        url: https://baike.baidu.com/item/%E7%AD%94%E5%8F%B8%E9%A9%AC%E8%B0%8F%E8%AE%AE%E4%B9%A6
        sentences:
          - 无由会晤，不任区区向往之至。 
  - poem: 赤壁赋
    type: 文言文必修
    author: 苏轼
    created_at: 战国后期
    paragraphs:
      - paragraph: 壬戌
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。
      - paragraph: 于是
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉；余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。
      - paragraph: 苏子愀
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 苏子愀然，正襟危坐，而问客曰：“何为其然也？”
      - paragraph: 客曰
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 客曰：“‘月明星稀，乌鹊南飞。’此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏尊（樽）以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。” 
      - paragraph: 苏子曰
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。”
      - paragraph: 客喜
        url: https://baike.baidu.com/item/%E8%B5%A4%E5%A3%81%E8%B5%8B/130
        sentences:
          - 客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。   
  - poem: 项脊轩志
    type: 文言文必修
    author: 归有光
    created_at: 战国后期
    paragraphs:
      - paragraph: 项脊轩
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视，无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。
      - paragraph: 然余
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发，读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。
      - paragraph: 然余
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 然余，故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。
      - paragraph: 项脊生
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 项脊生曰：“蜀清守丹穴，利甲天下，其后秦皇帝筑女怀清台；刘玄德与曹操争天下，诸葛孔明起陇中。方二人之昧昧于一隅也，世何足以知之，余区区处败屋中，方扬眉、瞬目，谓有奇景。人知之者，其谓与坎井之蛙何异？”
      - paragraph: 余既
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。
      - paragraph: 庭有
        url: https://baike.baidu.com/item/%E9%A1%B9%E8%84%8A%E8%BD%A9%E5%BF%97/1225478
        sentences:
          - 庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。 
  - poem: 子路、曾晳、冉有、公西华侍坐 《论语》
    type: 文言文选必
    author: 春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子的言行
    created_at: 战国前期
    paragraphs:
      - paragraph: 子路侍坐
        url: https://baike.baidu.com/item/%E5%AD%90%E8%B7%AF%E3%80%81%E6%9B%BE%E7%9A%99%E3%80%81%E5%86%89%E6%9C%89%E3%80%81%E5%85%AC%E8%A5%BF%E5%8D%8E%E4%BE%8D%E5%9D%90/5456498
        sentences:
          - 子路、曾皙（xī）、冉（rǎn)有、公西华侍坐。
          - 子曰：“以吾一日长（zhǎng）乎尔，毋吾以也。
          - 居则曰：‘不吾知也。’如或知尔，则何以哉？”
          - 子路率尔而对曰：“千乘（shèng）之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比（bì）及三年，可使有勇，且知方也。”
          - 夫子哂（shěn）之。
          - “求，尔何如？”
          - 对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟（sì）君子。”
          - “赤，尔何如？”
          - 对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。”
          - “点，尔何如？”
          - 鼓瑟希，铿（kēng）尔，舍瑟而作，对曰：“异乎三子者之撰(zhuàn)。”
          - 子曰：“何伤乎？亦各言其志也！”
          - 曰：“莫（mù）春者，春服既成，冠者五六人，童子六七人，浴乎沂（yí），风乎舞雩(yú)，咏而归。”
          - 夫子喟（kuì）然叹曰：“吾与点也。”
          - 三子者出，曾皙后。
          - 曾皙曰：“夫三子者之言何如？”
          - 子曰：“亦各言其志也已矣！”
          - 曰：“夫子何哂由也？”
          - 曰：“为国以礼，其言不让，是故哂之。”
          - “唯求则非邦也与？”
          - “安见方六七十，如五六十而非邦也者？”
          - “唯赤则非邦也与？”
          - “宗庙会同，非诸侯而何？赤也为之小，孰能为之大？”
  - poem: 报任安书（古者富贵而名摩灭…… 难为俗人言也 ）
    type: 文言文选必
    author: 司马迁
    created_at: 西汉
    paragraphs:
      - paragraph: 太史
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - 太史公牛马走司马迁，再拜言，少卿足下：
          - 曩者辱赐书，教以慎于接物，推贤进士为务，意气勤勤恳恳。
          - 若望仆不相师，而用流俗人之言，仆非敢如此也。
          - 仆虽罢驽，亦尝侧闻长者之遗风矣。
          - 顾自以为身残处秽，动而见尤，欲益反损，是以独郁悒而无谁语。
          - 谚曰：“谁为为之？孰令听之？”
          - 盖钟子期死，伯牙终身不复鼓琴。
          - 何则？士为知己者用，女为悦己者容。
          - 若仆大质已亏缺矣，虽材怀随和，行若由夷，终不可以为荣，适足以见笑而自点耳。
          - 书辞宜答，会东从上来，又迫贱事，相见日浅，卒卒无须臾之间，得竭指意。
          - 今少卿抱不测之罪，涉旬月，迫季冬，仆又薄从上雍，恐卒然不可为讳，是仆终已不得舒愤懑以晓左右，则长逝者魂魄私恨无穷。
          - 请略陈固陋。
          - 阙然久不报，幸勿为过。
      - paragraph: 仆闻
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - 仆闻之：修身者，智之符也；爱施者，仁之端也；取予者，义之表也；耻辱者，勇之决也；立名者，行之极也。
          - 士有此五者，然后可以托于世，列于君子之林矣。
          - 故祸莫憯于欲利，悲莫痛于伤心，行莫丑于辱先，诟莫大于宫刑。
          - 刑余之人，无所比数，非一世也，所从来远矣。
          - 昔卫灵公与雍渠同载，孔子适陈；商鞅因景监见，赵良寒心；同子参乘，袁丝变色：自古而耻之！
          - 夫中材之人，事有关于宦竖，莫不伤气，而况于慷慨之士乎！
          - 如今朝廷虽乏人，奈何令刀锯之余，荐天下之豪俊哉！
          - 仆赖先人绪业，得待罪辇毂下，二十余年矣。
          - 所以自惟：上之，不能纳忠效信，有奇策材力之誉，自结明主；次之，又不能拾遗补阙，招贤进能，显岩穴之士；外之，不能备行伍，攻城野战，有斩将搴旗之功；下之，不能积日累劳，取尊官厚禄，以为宗族交游光宠。
          - 四者无一遂，苟合取容，无所短长之效，可见于此矣。
          - 乡者，仆亦尝厕下大夫之列，陪外廷末议。
          - 不以此时引纲维，尽思虑，今已亏形为扫除之隶，在阘茸之中，乃欲卬首伸眉，论列是非，不亦轻朝廷、羞当世之士邪？嗟乎！嗟乎！如仆尚何言哉！尚何言哉！
      - paragraph: 且事
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - 且事本末未易明也。仆少负不羁之才，长无乡曲之誉，主上幸以先人之故，使得奉薄伎，出入周卫之中。
          - 仆以为戴盆何以望天，故绝宾客之知，忘室家之业，日夜思竭其不肖之材力，务一心营职，以求亲媚于主上。
          - 而事乃有大谬不然者！夫仆与李陵俱居门下，素非能相善也。
          - 趣舍异路，未尝衔杯酒，接殷勤之余欢。
          - 然仆观其为人，自守奇士，事亲孝，与士信，临财廉，取予义，分别有让，恭俭下人，常思奋不顾身，以殉国家之急。
          - 其素所蓄积也，仆以为有国士之风。
          - 夫人臣出万死不顾一生之计，赴公家之难，斯已奇矣。
          - 今举事一不当，而全躯保妻子之臣随而媒孽其短，仆诚私心痛之。
          - 且李陵提步卒不满五千，深践戎马之地，足历王庭，垂饵虎口，横挑强胡，仰亿万之师，与单于连战十有余日，所杀过当。
          - 虏救死扶伤不给，旃裘之君长咸震怖，乃悉征其左、右贤王，举引弓之民，一国共攻而围之。
          - 转斗千里，矢尽道穷，救兵不至，士卒死伤如积。
          - 然陵一呼劳军，士无不起，躬自流涕，沬自饮泣，更张空弮，冒白刃，北首争死敌者。
          - 陵未没时，使有来报，汉公卿王侯皆奉觞上寿。
          - 后数日，陵败书闻，主上为之食不甘味，听朝不怡。
          - 大臣忧惧，不知所出。
          - 仆窃不自料其卑贱，见主上惨凄怛悼，诚欲效其款款之愚，以为李陵素与士大夫绝甘分少，能得人之死力，虽古之名将，不能过也。
          - 身虽陷败，彼观其意，且欲得其当而报于汉。
          - 事已无可奈何，其所摧败，功亦足以暴于天下矣。
          - 仆怀欲陈之，而未有路，适会召问，即以此指，推言陵之功，欲以广主上之意，塞睚眦之辞。
          - 未能尽明，明主不晓，以为仆沮贰师，而为李陵游说，遂下于理。
          - 拳拳之忠，终不能自列。
          - 因为诬上，卒从吏议。
          - 家贫，货赂不足以自赎，交游莫救，左右亲近不为一言。
          - 身非木石，独与法吏为伍，深幽囹圄之中，谁可告愬者！
          - 此真少卿所亲见，仆行事岂不然乎？李陵既生降，隤其家声，而仆又佴之蚕室，重为天下观笑。
          - 悲夫！悲夫！事未易一二为俗人言也。
      - paragraph: 仆之
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - 仆之先人，非有剖符丹书之功，文史星历，近乎卜祝之间，固主上所戏弄，倡优畜之，流俗之所轻也。
          - 假令仆伏法受诛，若九牛亡一毛，与蝼蚁何以异？而世又不与能死节者比，特以为智穷罪极，不为自免，卒就死耳。
          - 何也？素所自树立使然也。
          - 人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。
          - 太上，不辱先，其次不辱身，其次不辱理色，其次不辱辞令，其次诎体受辱，其次易服受辱，其次关木索、被箠楚受辱，其次剔毛发、婴金铁受辱，其次毁肌肤、断肢体受辱，最下腐刑极矣！
          - 传曰“刑不上大夫”。
          - 此言士节不可不勉厉也。
          - 猛虎在深山，百兽震恐，及在槛阱之中，摇尾而求食，积威约之渐也。
          - 故士有画地为牢，势不入；削木为吏，议不对，定计于鲜也。
          - 今交手足，受木索，暴肌肤，受榜箠，幽于圜墙之中。
          - 当此之时，见狱吏则头枪地，视徒隶则心惕息。
          - 何者？积威约之势也。
          - 及以至是，言不辱者，所谓强颜耳，曷足贵乎！
          - 且西伯，伯也，拘于羑里；李斯，相也，具于五刑；淮阴，王也，受械于陈；彭越、张敖，南面称孤，系狱抵罪；绛侯诛诸吕，权倾五伯，囚于请室；魏其，大将也，衣赭衣，关三木；季布为朱家钳奴；灌夫受辱于居室。
          - 此人皆身至王侯将相，声闻邻国，及罪至罔加，不能引决自裁，在尘埃之中。
          - 古今一体，安在其不辱也？由此言之，勇怯，势也；强弱，形也。
          - 审矣，何足怪乎？夫人不能早自裁绳墨之外，以稍陵迟，至于鞭箠之间，乃欲引节，斯不亦远乎！
          - 古人所以重施刑于大夫者，殆为此也。
          - 夫人情莫不贪生恶死，念父母，顾妻子，至激于义理者不然，乃有所不得已也。
          - 今仆不幸，早失父母，无兄弟之亲，独身孤立，少卿视仆于妻子何如哉？且勇者不必死节，怯夫慕义，何处不勉焉！
          - 仆虽怯懦，欲苟活，亦颇识去就之分矣，何至自湛溺累绁之辱哉！
          - 且夫臧获婢妾，犹能引决，况仆之不得已乎？所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世，而文采不表于后世也。
      - paragraph: 古者
        url: https://baike.baidu.com/item/%E6%8A%A5%E4%BB%BB%E5%AE%89%E4%B9%A6
        sentences:
          - 古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。
          - 盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。
          - 此人皆意有所郁结，不得通其道，故述往事、思来者。
          - 乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。
          - 仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。
          - 亦欲以究天人之际，通古今之变，成一家之言。
          - 草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。
          - 仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也！
  - poem: 过秦论（上）
    type: 文言文选必
    author: 贾谊
    created_at: 西汉
    paragraphs:
      - paragraph: 秦孝
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - 秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。
          - 当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。
          - 于是秦人拱手而取西河之外。
      - paragraph: 孝公
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - 孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。
          - 诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。
          - 当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。
          - 此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。
          - 于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召（shào）滑、楼缓、翟（zhái）景、苏厉、乐（yuè）毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。
          - 尝以十倍之地，百万之众，叩关而攻秦。
          - 秦人开关延敌，九国之师，逡（qūn）巡而不敢进。
          - 秦无亡矢遗镞（zú）之费，而天下诸侯已困矣。
          - 于是从散约败，争割地而赂秦。
          - 秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。
          - 因利乘便，宰割天下，分裂山河。
          - 强国请服，弱国入朝。
          - 延及孝文王、庄襄王，享国之日浅，国家无事。
      - paragraph: 及至
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - 及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。
          - 南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。
          - 乃使蒙恬北筑长城而守藩篱，却匈奴七百余里。
          - 胡人不敢南下而牧马，士不敢弯弓而报怨。
          - 于是废先王之道，焚百家之言，以愚黔首；隳（huī）名城，杀豪杰，收天下之兵，聚之咸阳，销锋镝（dí），铸以为金人十二，以弱天下之民。
          - 然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。
          - 良将劲弩守要害之处，信臣精卒陈利兵而谁何。
          - 天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。
      - paragraph: 始皇
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - 始皇既没，余威震于殊俗。
          - 然陈涉瓮牖（yǒu）绳枢之子，氓（méng）隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟〔dí〕之贤，陶朱、猗（yī）顿之富；
          - 蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦，斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。
          - 山东豪俊遂并起而亡秦族矣。
      - paragraph: 且夫
        url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA/335641
        sentences:
          - 且夫天下非小弱也，雍州之地，崤函之固，自若也。
          - 陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄耰（yōu）棘矜（qín），非铦（xiān）于钩戟长铩也；
          - 谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及向时之士也。
          - 然而成败异变，功业相反，何也？试使山东之国与陈涉度（duó）长絜（xié）大，比权量力，则不可同年而语矣。
          - 然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；
          - 一夫作难（nàn）而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。
  - poem: 礼运（大道之行也……是谓大同） 《礼记》
    type: 文言文选必
    author: 孔子
    created_at: 战国末年
    paragraphs:
      - paragraph: 大道
        url: https://baike.baidu.com/item/%E7%A4%BC%E8%BF%90
        sentences:
          - 大道之行也，与三代之英，丘未之逮也，而有志焉。
          - 大道之行也，天下为公，选贤与能，讲信修睦。
          - 故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养，男有分，女有归。
          - 货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。
          - 是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。
          - 是谓大同。
  - poem: 陈情表
    type: 文言文选必
    author: 李密
    created_at: 西晋
    paragraphs:
      - paragraph: 臣密言
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - 臣密言：臣以险衅，夙遭闵凶。
          - 生孩六月，慈父见背；行年四岁，舅夺母志。
          - 祖母刘愍臣孤弱，躬亲抚养。
          - 臣少多疾病，九岁不行，零丁孤苦，至于成立。
          - 既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。
          - 外无期功强近之亲，内无应门五尺之僮，茕茕独立，形影相吊。
          - 而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。
      - paragraph: 逮奉
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - 逮奉圣朝，沐浴清化。
          - 前太守臣逵察臣孝廉；后刺史臣荣举臣秀才。
          - 臣以供养无主，辞不赴命。
          - 诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。
          - 猥以微贱，当侍东宫，非臣陨首所能上报。
          - 臣具以表闻，辞不就职。
          - 诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。
          - 臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。
          - 臣之进退，实为狼狈。
      - paragraph: 伏惟
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - 伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。
          - 且臣少仕伪朝，历职郎署，本图宦达，不矜名节。
          - 今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀！但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。
          - 臣无祖母，无以至今日；祖母无臣，无以终余年。
          - 母孙二人，更相为命，是以区区不能废远。
      - paragraph: 臣密今
        url: https://baike.baidu.com/item/%E9%99%88%E6%83%85%E8%A1%A8/3075432
        sentences:
          - 臣密今年四十有四，祖母刘今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。
          - 乌鸟私情，愿乞终养。
          - 臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土，实所共鉴。
          - 愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。
          - 臣生当陨首，死当结草。
          - 臣不胜犬马怖惧之情，谨拜表以闻。
  - poem: 归去来兮辞（并序）
    type: 文言文选必
    author: 陶渊明
    created_at: 东晋
    paragraphs:
      - paragraph: 余家
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - 余家贫，耕植不足以自给。
          - 幼稚盈室，缾无储粟，生生所资，未见其术。
          - 亲故多劝余为长吏，脱然有怀，求之靡途。
          - 会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。
          - 于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。
          - 故便求之。
          - 及少日，眷然有归欤之情。
          - 何则？质性自然，非矫厉所得。
          - 饥冻虽切，违己交病。
          - 尝从人事，皆口腹自役。
          - 于是怅然慷慨，深愧平生之志。
          - 犹望一稔，当敛裳宵逝。
          - 寻程氏妹丧于武昌，情在骏奔，自免去职。
          - 仲秋至冬，在官八十余日。
          - 因事顺心，命篇曰归去来兮。
          - 乙巳岁十一月也。
      - paragraph: 归去
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - 归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。
          - 实迷途其未远，觉今是而昨非。
          - 舟遥遥以轻飏，风飘飘而吹衣。
          - 问征夫以前路，恨晨光之熹微。
      - paragraph: 乃瞻
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - 乃瞻衡宇，载欣载奔。
          - 僮仆欢迎，稚子候门。
          - 三径就荒，松菊犹存。携幼入室，有酒盈樽。
          - 引壶觞以自酌，眄庭柯以怡颜。
          - 倚南窗以寄傲，审容膝之易安。
          - 园日涉以成趣，门虽设而常关。
          - 策扶老以流憩，时矫首而遐观。
          - 云无心以出岫，鸟倦飞而知还。
          - 景翳翳以将入，抚孤松而盘桓。
      - paragraph: 归去
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - 归去来兮，请息交以绝游。
          - 世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。
          - 农人告余以春及，将有事于西畴。
          - 或命巾车，或棹孤舟。
          - 既窈窕以寻壑，亦崎岖而经丘。
          - 木欣欣以向荣，泉涓涓而始流。
          - 善万物之得时，感吾生之行休。
      - paragraph: 已矣
        url: https://baike.baidu.com/item/%E5%BD%92%E5%8E%BB%E6%9D%A5%E5%85%AE%E8%BE%9E/334939
        sentences:
          - 已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。
          - 怀良辰以孤往，或植杖而耘耔。
          - 登东皋以舒啸，临清流而赋诗。
          - 聊乘化以归尽，乐夫天命复奚疑！
  - poem: 种树郭橐驼传
    type: 文言文选必
    author: 柳宗元
    created_at: 中唐
    paragraphs:
      - paragraph: 郭橐
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - 郭橐驼，不知始何名。
          - 病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。
          - 驼闻之曰：“甚善，名我固当。”
          - 因舍其名，亦自谓“橐驼”云。
      - paragraph: 其乡
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - 其乡曰丰乐乡，在长安西。
          - 驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。
          - 视驼所种树，或移徙，无不活；且硕茂，早实以蕃。
          - 他植者虽窥伺效慕，莫能如也。
      - paragraph: 有问
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - 有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天以致其性焉尔。
          - 凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。
          - 既然已，勿动勿虑，去不复顾。
          - 其莳也若子，其置也若弃，则其天者全而其性得矣。
          - 故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。
          - 他植者则不然。
          - 根拳而土易，其培之也，若不过焉则不及。
          - 苟有能反是者，则又爱之太恩，忧之太勤。
          - 旦视而暮抚，已去而复顾。
          - 甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。
          - 虽曰爱之，其实害之；虽曰忧之，其实仇之：故不我若也。
          - 吾又何能为哉？”
      - paragraph: 问者
        url: https://baike.baidu.com/item/%E7%A7%8D%E6%A0%91%E9%83%AD%E6%A9%90%E9%A9%BC%E4%BC%A0
        sentences:
          - 问者曰：“以子之道，移之官理，可乎？”
          - 驼曰：“我知种树而已，官理，非吾业也。
          - 然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。
          - 旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’
          - 鸣鼓而聚之，击木而召之。
          - 吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。
          - 若是，则与吾业者其亦有类乎？”
          - 问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。
  - poem: 五代史伶官传序
    type: 文言文选必
    author: 欧阳修
    created_at: 北宋
    paragraphs:
      - paragraph: 呜呼
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - 呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。
      - paragraph: 世言
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - 世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王，吾所立，契丹，与吾约为兄弟，而皆背晋以归梁。
          - 此三者，吾遗恨也。
          - 与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。
      - paragraph: 方其
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - 方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归。
          - 至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？
      - paragraph: 《书
        url: https://baike.baidu.com/item/%E4%BA%94%E4%BB%A3%E5%8F%B2%E4%BC%B6%E5%AE%98%E4%BC%A0%E5%BA%8F
        sentences:
          - 《书》曰：“满招损，谦得益。”
          - 忧劳可以兴国，逸豫可以亡身，自然之理也。
          - 故方其盛也，举天下之豪杰莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。
          - 夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！作《伶官传》。
  - poem: 石钟山记
    type: 文言文选必
    author: 苏轼
    created_at: 北宋
    paragraphs:
      - paragraph: 《水
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - 《水经》云：“彭蠡之口有石钟山焉。”
          - 郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。
          - 是说也，人常疑之。
          - 今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。
          - 自以为得之矣。
          - 然是说也，余尤疑之。
          - 石之铿然有声者，所在皆是也，而此独以钟名，何哉？
      - paragraph: 元丰
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - 元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。
          - 寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉，余固笑而不信也。
          - 至莫夜月明，独与迈乘小舟，至绝壁下。
          - 大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。
          - 余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。
          - 舟人大恐。
          - 徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。
          - 舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。
          - 因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！”
      - paragraph: 事不
        url: https://baike.baidu.com/item/%E7%9F%B3%E9%92%9F%E5%B1%B1%E8%AE%B0
        sentences:
          - 事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。
          - 此世所以不传也。
          - 而陋者乃以斧斤考击而求之，自以为得其实。
          - 余是以记之，盖叹郦元之简，而笑李渤之陋也。
  - poem: 登泰山记
    type: 文言文选必
    author: 姚鼐
    created_at: 清乾隆三十九年
    paragraphs:
      - paragraph: 泰山之
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 泰山之阳，汶水西流；其阴，济水东流。
          - 阳谷皆入汶，阴谷皆入济。
          - 当其南北分者，古长城也。
          - 最高日观峰，在长城南十五里。
      - paragraph: 余以
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。
          - 是月丁未，与知府朱孝纯子颍由南麓登。
          - 四十五里，道皆砌石为磴，其级七千有余。
      - paragraph: 泰山正
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 泰山正南面有三谷。
          - 中谷绕泰安城下，郦道元所谓环水也。
          - 余始循以入，道少半，越中岭，复循西谷，遂至其巅。
          - 古时登山，循东谷入，道有天门。
          - 东谷者，古谓之天门溪水，余所不至也。
          - 今所经中岭及山巅，崖限当道者，世皆谓之天门云。
          - 道中迷雾冰滑，磴几不可登。
          - 及既上，苍山负雪，明烛天南；望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。
      - paragraph: 戊申
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 戊申晦，五鼓，与子颍坐日观亭，待日出。
          - 大风扬积雪击面。
          - 亭东自足下皆云漫。
          - 稍见云中白若摴蒱数十立者，山也。
          - 极天云一线异色，须臾成五采。
          - 日上，正赤如丹，下有红光，动摇承之。
          - 或曰，此东海也。
          - 回视日观以西峰，或得日，或否，绛皓驳色，而皆若偻。
      - paragraph: 亭西
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 亭西有岱祠，又有碧霞元君祠；皇帝行宫在碧霞元君祠东。
          - 是日观道中石刻，自唐显庆以来，其远古刻尽漫失。
          - 僻不当道者，皆不及往。
      - paragraph: 山多
        url: https://baike.baidu.com/item/%E7%99%BB%E6%B3%B0%E5%B1%B1%E8%AE%B0
        sentences:
          - 山多石，少土；石苍黑色，多平方，少圜。
          - 少杂树，多松，生石罅，皆平顶。
          - 冰雪，无瀑水，无鸟兽音迹。
          - 至日观数里内无树，而雪与人膝齐。
          - 桐城姚鼐记。
  
  
  - poem: 毛诗序
    type: 古代文论选段
    author: 说法不一，有子夏、卫宏等说
    created_at: 先秦至两汉
    paragraphs:
      - paragraph: 《关
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - 《关雎》，后妃之德也，风之始也，所以风天下而正夫妇也。
          - 故用之乡人焉，用之邦国焉。风，风也，教也。风以动之，教以化之。
      - paragraph: 诗者
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - 诗者，志之所之也。
          - 在心为志，发言为诗，情动于中而形于言，言之不足，故嗟叹之；嗟叹之不足，故永歌之；永歌之不足，不知手之舞之，足之蹈之也。
      - paragraph: 情发
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - 情发于声，声成文谓之音。
          - 治世之音安以乐，其政和；乱世之音怨以怒，其政乖；亡国之音哀以思，其民困。
          - 故正得失，动天地，感鬼神，莫近于诗。
          - 先王以是经夫妇，成孝敬，厚人伦，美教化，移风俗。
      - paragraph: 故诗
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - 故诗有六义焉：一曰风，二曰赋，三曰比，四曰兴，五曰雅，六曰颂。
          - 上以风化下，下以风刺上，主文而谲谏，言之者无罪，闻之者足以戒，故曰风。
          - 至于王道衰，礼义废，政教失，国异政，家殊俗，而变风变雅作矣。
          - 国史明乎得失之迹，伤人伦之废，哀刑政之苛，吟咏情性，以风其上，达于事变而怀其旧俗者也。
          - 故变风发乎情，止乎礼义。
          - 发乎情，民之性也；止乎礼义，先王之泽也。
          - 是以一国之事，系一人之本，谓之风；言天下之事，形四方之风，谓之雅。
          - 雅者，正也，言王政之所由废兴也。
          - 政有小大，故有小雅焉，有大雅焉。
          - 颂者，美盛德之形容，以其成功告于神明者也。
          - 是谓四始，诗之至也。
      - paragraph: 然则
        url: https://baike.baidu.com/item/%E6%AF%9B%E8%AF%97%E5%BA%8F/10970271
        sentences:
          - 然则《关雎》《麟趾》之化，王者之风，故系之周公。
          - 南，言化自北而南也。
          - 《鹊巢》《驺虞》之德，诸侯之风也，先王之所以教，故系之召公。
          - 《周南》《召南》，正始之道，王化之基。
          - 是以《关雎》乐得淑女，以配君子，忧在进贤，不淫其色；哀窈窕，思贤才，而无伤善之心焉。
          - 是《关雎》之义也。