---
words:
  - word: 于 【介词】
    phonetic: yu2
    tags:
      - 高中
    samples:
      - trans: ❶介绍出动作行为发生的时间、处所，相当于"在""到""从"等。
        sentences:
          - ancient: 【例句】千里之行，始于足下。（《老子》六十四章）
          - ancient: 庞涓死于此树之下。（《史记•孙子吴起列传》）
          - ancient: 少焉，月出于东山之上，徘徊于斗牛之间。（《赤壁赋》）
          - ancient: 不幸吕师孟构恶于前，贾余庆献谄于后，予羁縻不得还，国事遂不可收拾。（《〈指南录〉后序》）
          - ancient: 青，取之于蓝。（《劝学》）
          - ancient: 河内凶，则移其民于河东，移其粟于河内。（《寡人之于国也》）
      - trans: ❷介绍出动作行为的施事者。
        sentences:
          - ancient: 【例句】臣诚恐见欺于王而负（对不起）赵。（《廉颇蔺相如列传》）
          - ancient: 魏惠王兵数破于齐、秦。（《史记•商君列传》）
      - trans: ❸介绍出动作行为的对象。
        sentences:
          - ancient: 【例句】故明于天人之分，则可谓至人矣。（《荀子•天论》）
          - ancient: 上由此怨望（怨恨）于梁王。（《史记•梁孝王世家》）
          - ancient: 晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。（《烛之武退秦师》）
          - ancient: 君子生非异也，善假于物也。（《劝学》）
      - trans: ❹介绍出动作行为所涉及的对象，相当于"对跟""给""等
        sentences:
          - ancient: 【例句】余不爱衣食于民，不爱牲玉于神。（《国语•鲁语上》）
          - ancient: 是臣尽节于陛下之日长，报养刘之日短也。（《陈情表》）
          - ancient: 将请罪于君,君不许;请罪于母,母不许。（《〈指南录〉后序》）
      - trans: ❺用在【形容词】之后，表示比较，介绍出比较的对象。相当于"比"。
        sentences:
          - ancient: 【例句】青，取之于蓝（一种叶子可以制成染料的草），而青于蓝;冰，水为之，而寒于水。（《劝学》）
          - ancient: 田赞衣（yi4,穿）补衣而见荆王，荆王曰："先生之衣，何其恶（e3）也?"亩赞对曰："衣又有恶于此者也。"（《吕氏春秋•顺说》）
          - ancient: 郡县逼迫，催臣上道;州司临门，急于星火。（《陈情表》）
          - ancient: 是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。（《师说》）
      - trans: ❻由于。
        sentences:
          - ancient: 【例句】业精于勤，荒于嬉;行成于思，毁于随。（《进学解》）
  - word: 【连词】
    phonetic: yu2
    tags:
      - 高中
    samples:  
      - trans: 表示联合关系，相当于""与和"。
        sentences:
          - ancient: 【例句】不克敬于和，则无我怨。（《尚书•多方》）
  - word: 【助词】
    phonetic: yu2
    tags:
      - 高中
    samples:
      - trans: 动词词头,无义。
        sentences:
          - ancient: 【例句】黄鸟于飞。（《诗经•周南•葛覃》）

