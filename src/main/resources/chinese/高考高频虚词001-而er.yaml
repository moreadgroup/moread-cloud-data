  - word: 而 【代词】
    phonetic: er2
    tags:
      - 高中
    samples:
      - trans: 你;你的。
        sentences:
          - ancient: 某所,而母立于兹。（《项脊轩志》）
          - ancient: 官命促尔耕，勖（xu4,勉励）尔植,督尔获，早缫而绪，早织而缕，字而幼孩,遂而鸡豚。（《种树郭橐驼传》）
  - word: 而 【连词】
    phonetic: er2
    tags:
      - 高中
    samples:
      - trans: ❶表示前后两个词或短语、分句是并列关系。相当于"而且""和""并"等。
        sentences:
          - ancient: 君子博学而日参省乎己，则知明而行无过矣。（《劝学》）
          - ancient: 蟹六跪而二螯。（《劝学》）
          - ancient: 永州之野产异蛇,黑质而白章。（《捕蛇者说》）
      - trans: ❷表示前后两个词或短语、分句为转折关系。相当于"可是"，"但”"却”
        sentences:
          - ancient: 不知彼而知己，一胜一负。（《孙子兵法•谋攻》）
          - ancient: 予独爱莲之出淤泥而不染，濯（zhuo2,洗涤）清涟而不妖。（《爱莲说》）
          - ancient: 青,取之于蓝而書于蓝。（《劝学》）
          - ancient: 因人之力而敝之，不仁。（《烛之武退秦师》）
          - ancient: 【高考题例】芝坐爽下狱，当死，而□不讼直，志不苟免。（《晋书•鲁芝传》）
          - ancient: —岁断狱，不过数十，威风猛于涣，而文理不及之。（《后汉书•王涣传》）
      - trans: ❸表示前后两个词或短语是顺承关系。相当于"就""才''等。
        sentences:
          - ancient: 许君焦、瑕，朝济而夕设版焉。（《烛之武退秦师》）
          - ancient: 若亡郑而有益于君,敢以烦执事。（《烛之武退秦师》）
          - ancient: 然则何时而乐耶？其必曰"先天下之忧而忧，后天下之乐而乐"乎！（《岳阳楼记》）
      - trans: ❹连接状语和中心词，表示修饰关系。相当于"就"'‘着""地''等。
        sentences:
          - ancient: 吾尝跤而望矣，不如登高之博见也。（《劝学》）
          - ancient: 后五月而秦孝公卒。（《史记•商君列传》）
          - ancient: 渔父莞尔而笑,鼓枻xie4而去。（《渔父》）
          - ancient: 于是饮酒乐甚，扣舷而歌之。（《赤壁赋》）
          - ancient: 饭疏食饮水，曲肱而枕之，乐亦在其中矣。（《论语・述》）
          - ancient: 太子闻之，驰往，伏尸而哭,极哀。（《荆轲刺秦王》）
          - ancient: 于是秦人拱手而取西河之外。（《过秦论》）
          - ancient: 【高考题例】民思其德，为立祠安阳亭西,每食辄弦歌而荐之。（《后汉书•王涣传》）
      - trans: ❺连接主语和谓语，表示假设关系。相当于"如果""假如"。
        sentences:
          - ancient: 管氏而知礼，孰不知礼？（《论语•八佾yi4》）
          - ancient: 锲而舍之，朽木不折;锲而不舍，金石可镂。（《劝学》）
          - ancient: 诸君无意则已，诸军而有意，瞻予马首可也。（《冯婉贞》）
          - ancient: 人而无信,不知其可也。（《论语•为政》）
          - ancient: 死而有知，其几何离。（《祭十二郎文》）
      - trans: ❻连接前后两个短语，表示因果关系。相当于"因而"。
        sentences:
          - ancient: 王怒而疏屈平。（《史记•屈原贾生列传》）
          - ancient: 有能助寡人谋而退吴者，吾与之共知越国之政。（《勾践灭吴》）
          - ancient: 遏其生气，以求重价，而江浙之梅皆病。（《病梅馆记》）
