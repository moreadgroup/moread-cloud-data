---
words:
  - word: 焉 【代词】
    phonetic: yan1
    tags:
      - 高中
    samples:
      - trans: ❶第三人称代词。相当于"之"。
        sentences:
          - ancient: 古之圣人,其出人也远矣，犹且从师而问焉。（《师说》）
          - ancient: 可远观而不可亵玩焉。（《爱莲说》）
          - ancient: 【高考题例】公亮明练文法，更践久，习知朝廷台阁典（典章）宪（法规）,首相韩埼每咨访焉。（《宋史•曽公孟传》）
      - trans: ❷疑问代词。相当于"哪里"。
        sentences:
          - ancient: 既东封郑，又欲肆其西封，若不阙秦，将焉取之？（《烛之武退秦师》）
      - trans: ❸疑问代词。相当于"什么""怎么"。
        sentences:
          - ancient: 世与我而相违，复驾言兮焉求？（《归去来兮辞》）
  - word: 焉 【连词】
    phonetic: yan1
    tags:
      - 高中
    samples:
      - trans: 表示承接,相当于"于是""就"。
        sentences:
          - ancient: 必知乱之所自起，焉能治之；不知乱之所自起，则不能治。（《墨子•兼爱上》）
          - ancient: 若赴水火，入焉焦没耳。（《荀子•议兵》）
  - word: 焉 【助词】
    phonetic: yan1
    tags:
      - 高中
    samples:
      - trans: ❶用在句末,表示陈述语气，相当于"了""呢"等。
        sentences:
          - ancient: 我二十五年矣，又如是而嫁，则就木（指死亡）焉。（《左传•僖公二十三年》）
          - ancient: 王笑曰："圣人非所与熙（耍笑）也，寡人反取病焉。"（《晏子春秋•内篇杂下》）"
      - trans: ❷用在句末，表示肯定，同时兼有指代作用，相当于"于是""于此"。
        sentences:
          - ancient: 积土成山，风雨兴焉。（《劝学》）
      - trans: ❸用在句中，大多位于复句前一分句之末，表示语气上的停顿，同时表示句子未完，有表示假定提起下文的语气。
        sentences:
          - ancient: 是故张军而不能战，围邑而不能攻，得地而不能实，三者见一焉，则可破毁也。（《管子•七法》）
          - ancient: 心不使焉，则白黑在前而目不见，雷鼓在侧而耳不闻，况于使者乎？（《荀子•解蔽》）
          - ancient: 覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。（《逍遥游》）
          - ancient: 于是焉河伯欣然自喜,以天下之美为尽在己。（《庄子•秋水》）
      - trans: ❹用在形容词后，表示状态。
        sentences:
          - ancient: 是事小敌毳（脆），则偷可用也;事大敌坚,则涣焉离耳，若飞鸟然。（《崙子•议兵》）
          - ancient: 忽焉自有，恍（huang3）尔而无。（《梁书•范缜传》）
          - ancient: 盘盘焉，囷囷qun1焉，蜂房水涡，矗不知其几千万落。（《阿房宫赋》）
      - trans: ❺用于句末，表示感叹。
        sentences:
          - ancient: 然郑亡，子亦有不利焉。（《烛之武退秦师》）
          - ancient: 于是余有叹焉。（《游褒禅山记》）
          - ancient: 寡人之于国也，尽心焉耳矣。（《寡人之于国也》）
  - word: 焉 【兼词】
    phonetic: yan1
    tags:
      - 高中
    samples:
      - trans: 相当于介词结构"于之"。
        sentences:
          - ancient: 步余马于兰皋兮，驰椒丘且焉止息。（《离骚》）
          - ancient: 【高考题例】兵尽矢绝,援不至，遂没焉。（《宋史•康保裔传》）
