---
words:
  - word: 且 
    type: 【代词】
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: 此。
        sentences:
          - ancient: 匪且有且，匪今斯今，振古（自古）如兹。（《诗经・周颂•载芟》）
  - word:  且 
    type: 【副词】    
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: ❶将近。
        sentences:
          - ancient: 北山愚公者，年且九十。（《愚公移山》）
      - trans: ❷将要。
        sentences:
          - ancient: 不者，若属（你们这帮人）皆且为所虏！（《鸿门宴》）
          - ancient: 以为且噬（咬）己也,甚恐。（《黔之驴》）
          - ancient: 有怠而欲出者，曰："不出，火且尽。”（《游褒禅山记》）
          - ancient: 【高考题例】殚其财，竭其力,卒不效，且死，乃交责之日，是医之误，而用巫之晩也。（《赠医者汤伯高序》）
          - ancient: 与之校,且生事。（《宋史•曾公亮传》）
      - trans: ❸暂且;姑且。
        sentences:
          - ancient: 存者且偷生,死者长已矣。（《石壕吏》）
          - ancient: 且放白鹿青崖间，须行即骑访名山。（《梦游天姥吟留别》）
          - ancient: 誓不相隔卿,且暂还家去。（《孔雀东南飞》）
  - word:  且 
    type: 【连词】    
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: ❶表示递进。而且;并且。
        sentences:
          - ancient: 凡四方之士无有不过而拜且泣者，斯固（的确是）百世之遇也。（《五人墓碑记》）
          - ancient: 磐石方且厚，可以卒千年。（《孔雀东南飞》）
          - ancient: 晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。（《烛之武退秦师》）
          - ancient: 且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。（《赤壁赋》）
          - ancient: 【高考题例】且鲁卫兄弟之国也，而君用起，则是奔卫。（《史记,孙子吴起列传》）
      - trans: ❷表示让步。尚且。
        sentences:
          - ancient: 且壮士不死即已，死即举大名（成大名）耳。（《陈涉世家》）
          - ancient: 臣死且不避，卮酒安足辞！（《鸿门宴》）
          - ancient: 且欲与常马等不可得，安求其能千里也？（《马说》）
          - ancient: 且庸人尚羞之（以之为羞）,况于将相乎？（《廉颇蔺相如列传》）
      - trans: ❸表示假设。假如；如果。
        sentences:
          - ancient: 且静郭君听辨（人名）而为之也，必无今日之患也。（《吕氏春秋•知士》）
      - trans: ❹表示并列。其一,连接形容词。又。
        sentences:
          - ancient: 上且怒且喜。（《史记•淮阴侯列传》）
      - trans: ❹表示并列。其二，连接【动词】。一面一面	
        sentences:
          - ancient: 百工之事，固不可耕且为也。（《孟子•滕文公上》）
      - trans: ❺表示转折。却;可是。
        sentences:
          - ancient: 穷且益坚，不坠青云之志。（《滕王阁序》）
      - trans: ❻表示选择。还是;抑或。
        sentences:
          - ancient: 富贵者骄人乎？且贫贱者骄人乎？（《史记•魏世家》）
  - word:  且 
    type: 【助词】    
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: 用在句首。
        sentences:
          - ancient: 且夫水之积也不厚，则其负大舟也无力。（《逍遥游》）
