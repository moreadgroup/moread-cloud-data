        sentences:
          - ancient: 【高考题例】被重刑厚罚而不怨恚，而巫之祸盘错深固不解矣。:（元•揭俟斯《赠医者汤伯高序》）
  - word: 恚
    type: 【形容词】
    phonetic: hui4
    tags:
      - 高中
    samples:
      - trans: 恼怒。
        sentences:
          - ancient: 【例句】（洪）承畴大恚，急呼麾下驱出斩之。（《梅花岭记》）
