过guo4
【名词】错误;过失。
【例句】吾不能早用子，今急而求子，是寡人之过也。（《烛之武退秦师》）丨君臣吏民能面刺（指责）寡人之过者，受上赏。（《邹忌讽齐王纳谏》）
【高考题例】有德之君，不忘规过，臣不胜大庆。（《旧唐书•于休烈传》）

【动词】❶经过;通过。
【例句】雷霆乍惊，宫车过也。（《阿房宫赋》）丨悉使羸兵负草填之，骑乃得过。（《资治通鉴•汉纪五十七》）丨黄鹤之飞尚不得过，猿猱欲度愁攀援。（《蜀道难》）
【高考题例】宣和末，高丽入贡，使者所过，调夫治舟,骚然烦费。（《宋史•孙傅传》）	
❷超过。
【例句】今以实校之，彼所将中国（指中原地区）人不过十五六万，且已久疲。（《资治通喧•"汉纪五十七》）丨时已过午，奴辈适至，立庵前，指点两峰。（明•徐霞客《游黄山日记》）丨我腾跃而上,不过数仞而下，翱翔蓬蒿之间，此亦飞之至也。（《逍遥游》）丨从此道至吾军，不过二十里耳。度我至军中，公乃入。（《鸿门宴》）
【高考题例】吾久不死贾生，自以为过之，今不及也。（《史记•屈原贾生列传》）
❸去；拜访。
【例句】公子过谢侯生。（《史记•魏公子列传》）丨余自束发读书轩中，一日，大母过余曰……（《项脊轩志》）
❹犯错误。
【例句】此愚者之所以大过也。（《吕氏春秋•察传》）丨过而能改，善莫大焉。（《左传•宣公二年》）丨人恒过，然后能改，困于心衡于虑而后作，征于色发于声而后喻。（《生于忧患死于安乐》）
❺责备。
【例句】闻大王有意督过之，脱身独去，已至军矣。（《鸿门宴》）丨求！无乃尔是过与？（《季氏将伐颛臾》）丨阙然久不报，幸勿为过。（《报任安书》）

【形容词】不正确。
【例句】曰："君过矣，不若长安君之甚。"（《触龙说赵太后》）丨且尔言过矣，虎兕出于柙,龟玉毁于椟中，是谁之过（错误）与？（《季氏将伐颛臾》）

【副词】过分;过于。
【例句】以其境过清，不可久居，乃记之而去。（《小石潭记》）丨今臣亡国贱俘，至微至陋,过蒙拔擢,宠命优渥，岂敢盘桓，有所希冀。（《陈情表》）