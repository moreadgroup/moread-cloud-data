逆ni4
【名词】
叛乱，叛乱的人。
【例句】则直前诟虏帅失信,数吕师孟叔侄为逆。（《〈指南录〉后序》）丨大王起微细,诛暴逆，平定四海,有功者辄裂地而封为王侯。（《史记•高祖本纪》）
【高考题例】及宇文化及构逆，深忌之。（《北史•来护儿传》）丨不能肃清凶逆，遂令王室至此，抱恨泉壤，知复何言！（《北史•来护儿传》）

【动词】
❶迎接。
【例句】郑子产聘于晋。晋侯有疾,韩宣子逆客。（《左传・昭公七年》）丨寓逆旅，主人日再食。（《送东阳马生序》）丨夫天地者，万物之逆旅也;光阴者，百代之过客也。（唐•李白《春夜宴从弟桃花园序》）
❷违背;对抗（与"顺"相对）。
【例句】而君逆寡人者，轻寡人与？（《唐雎不辱使命》）丨且以一璧之故逆强秦之欢,不可。（《廉颇蔺相如列传》）丨子不反亲，臣不逆君，兄弟之通义也。（《史记•赵世家》）
❸反常;乖于常理。
【例句】行辟而坚，饰非而好，玩奸而泽，言辩而逆，古之大禁也。（《荀子•非十二子》）
❹抗拒；抵抗（与"顺"相对）。
【例句】遂以周瑜、程普为左右督，将兵与备并力逆（曹）操。

（《资治通鉴•汉纪五十七》）丨燕王诚振怖大王之威，不敢举兵以逆军吏，愿举国为内臣，比诸侯之列。（《史记•刺客列传》）
❺叛乱。
【例句】庶长壮与大臣、诸侯、公子为逆，皆诛。（《史记•秦本纪》）丨数（责备）吕师孟叔侄为逆。（《〈指南录〉后序》）
❻揣,测。
【例句】以意逆志，是为得之。（《孟子•万章上》）

【形容词】反常的;反叛的。	
【例句】即除逆阉废祠之址以葬之。（《五人墓碑记》）

【副词】预先。
【例句】至于成败利钝，非臣之明所能逆睹也。（《后出师表》）




