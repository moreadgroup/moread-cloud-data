---
words:
  - word: 游
    type: 【名词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: 河流的一段。
        sentences:
          - ancient: 古之帝者地方千里，必居上游。（《史记•项羽本纪》）

  - word: 游
    type: 【动词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: ❶在水上漂浮;游泳。
        sentences:
          - ancient: 其父虽善游，其子岂遽善游哉？（《吕氏春秋•察今》）
          - ancient: 沙鸥翔集，锦鳞（指美丽的鱼）游泳。（《岳阳楼记》）
      - trans: ❷飞翔。
        sentences:
          - ancient: 若夫乘天地之正,而御六气之辩，以游无穷者，彼且恶乎待哉？（《逍遥游》）
      - trans: ❸游玩;游览。
        sentences:
          - ancient: 而余亦悔其随之而不得极夫游之乐也。（《游褒禅山记》）
          - ancient: 所以游目骋怀，足以极视听之娱，信可乐也。（《兰亭集序》）
          - ancient: 壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。（《赤壁赋》）
      - trans: ❹交往;交际。
        sentences:
          - ancient: 秦时与臣游，项伯杀人，臣活之。（《鸿门宴》）
          - ancient: 始公孙季功、董生与夏无且游，具知其事，为余道之如是。（《史记•刺客列传》）
          - ancient: 少时常与鲍叔牙游，鲍叔知其贤。（《史记•管仲列传》）
          - ancient: 窃以为与君实（宋代司马光，字君实）游处相好之日久……（宋•主安石《答司马谏议书》）
      - trans: ❺流动;转动。
        sentences:
          - ancient: 恢恢（广大）乎其于游刃必有余地矣。（《庄子•养生主》）
          - ancient: 忽反顾以游目兮，将往观乎四荒。（《离骚》）
      - trans: ❻游说。
        sentences:
          - ancient: 子墨子游公上过（人名）于越。（《吕氏春秋•高义》）
          - ancient: 及见贾生吊之,又怪屈原以彼其材，游诸侯,何国不容,而自令若是。（《史记•屈原贾生列传》）
      - trans: ❼出外求学或求官。
        sentences:
          - ancient: （张）衡少善属文（写文章），游于三辅，因入京师。（《张衡传》）
          - ancient: 长于楚，,游"学于秦。（《柳毅传》）

  - word: 游
    type: 【形容词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: 虚浮;不切实际。
        sentences:
          - ancient: 游辞巧饰者虽轻必戮。（《三国志•蜀书•诸葛亮传》）

