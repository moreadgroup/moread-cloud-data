游you2
【名词】河流的一段。
【例句】古之帝者地方千里，必居上游。（《史记•项羽本纪》）

【动词】❶在水上漂浮;游泳。,
【例句】其父虽善游，其子岂遽善游哉？（《吕氏春秋•察今》）丨沙鸥翔集，锦鳞（指美丽的鱼）游泳。（《岳阳楼记》）
❷飞翔。
【例句】若夫乘天地之正,而御六气之辩，以游无穷者，彼且恶乎待哉？（《逍遥游》）
❸游玩;游览。
【例句】而余亦悔其随之而不得极夫游之乐也。（《游褒禅山记》）丨所以游目骋怀，足以极视听之娱，信可乐也。（《兰亭集序》）丨壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。（《赤壁赋》）
❹交往;交际。
【例句】秦时与臣游，项伯杀人，臣活之。（《鸿门宴》）丨始公孙季功、董生与夏无且游，具知其事，为余道之如是。（《史记•刺客列传》）丨少时常与鲍叔牙游，鲍叔知其贤。（《史记•管仲列传》）丨窃以为与君实（宋代司马光，字君实）游处相好之日久……（宋•主安石《答司马谏议书》）
❺流动;转动。
【例句】恢恢（广大）乎其于游刃必有余地矣。（《庄子•养生主》）丨忽反顾以游目兮，将往观乎四荒。（《离骚》）
❻游说。
【例句】子墨子游公上过（人名）于越。（《吕氏春秋•高义》）丨及见贾生吊之,又怪屈原以彼其材，游诸侯,何国不容,而自令若是。（《史记•屈原贾生列传》）
❼出外求学或求官。
【例句】（张）衡少善属文（写文章），游于三辅，因入京师。
（《张衡传》）丨长于楚，,游"学于秦。（《柳毅传》）

【形容词】虚浮;不切实际。
【例句】游辞巧饰者虽轻必戮。（《三国志•蜀书•诸葛亮传》）

