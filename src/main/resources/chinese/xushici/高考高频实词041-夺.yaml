---
words:
  - word: 夺
    type: 【动词】
    phonetic: duo2
    tags:
      - 高中
    samples:
      - trans: ❶强取。
        sentences:
          - ancient: 【例句】将欲夺之，必固予之。（《老子》三十六章）
      - trans: ❷改变;使改变。
        sentences:
          - ancient: 【例句】生孩六月，慈父见背;行年四岁，舅夺母志。（《陈情表》）
          - ancient: 上官大夫见而欲夺之，屈平不与。（《史记•屈原贾生列传》）
          - ancient: 【高考题例】其父见其志不可夺，遣之读书。（明•方孝孺《詹鼎传》）
      - trans: ❸丧失；耽误。
        sentences:
          - ancient: 【例句】百亩之田，勿夺其时，数口之家可以无饥矣。（《寡人之于国也》）
          - ancient: 罕（少）兴力役，无夺农时，如是则国富矣。（《荀子•富国》）
          - ancient: 三军可夺帅也，匹夫不可夺志也。（《论语•子罕》）

