阙㊀que4
【名词】❶古代王宫、祠庙门前两边的高大建筑物,左右各一,中间为通道。
【例句】人有当阙而哭者。（《战国策•齐策六》）丨城阙辅三秦,风烟望五津。（唐•王勃《送杜少府之任蜀州》）丨不知天上宫阙,今夕是何年。（《水调歌头•明月几时有》）
❷墓道前两边的石牌坊。
【例句】音尘绝，西风残照，汉家陵阙。（唐•李白《忆秦娥》）
❸帝王所居之处；宫殿。
【例句】（曹）操乃诣阙贡献。（《后汉书•董卓传》）
【高考题例】即偕诸大臣伏阙上疏，疏入，帝惊泣不食，瑾等大惧。（《明史•韩文传》）丨炀帝嗣位，被追入朝,百姓攀恋,累日不能出境，诣阙上书致请者，前后数百人。（《北史•来护儿传》）

阙©que1
【名词】❶空隙;缺口。
【例句】自三峡七百里中，两岸连山，略无阙处。（《三峡》）
❷空缺。
【高考题例】先是,察官阙，朝论多属燧，以未历县，遂除左司谏。（《宋史•萧燧传》）
❸过失;弊病。
【例句】愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。（《出师表》）丨有可以救济人病（指民疾），裨补（增益;完补）时阙。（唐•白居易《与元尤屯》）
【高考题例】臣任功曹王涣以简贤选能,主簿镡显拾遗补阙，臣奉宣诏书而已。（《后汉书•王涣传》）

【动词】❶同"缺"。空（kong4）着，留待以后处理。
【例句】君子于其阴不知，盖阙如也。（《论语•子路》）
❷同"缺"。缺少。
【例句】南渡桂水阙舟楫。（唐•杜甫《暮归》）丨小子不敏,请悉论先人所次旧闻，弗敢阙。（《史记•太史公自序》）
❸损伤；损害。
【例句】既东封郑,又欲肆其西封，若不阙秦，将焉取之？阙秦以利晋，唯君图之。（《烛之武退秦师》）