---
words:
  - word: 阙
    type: 【名词】
    phonetic: que4
    tags:
      - 高中
    samples:
      - trans: ❶古代王宫、祠庙门前两边的高大建筑物，左右各一，中间为通道。
        sentences:
          - ancient: 人有当阙而哭者。（《战国策•齐策六》）
          - ancient: 城阙辅三秦，风烟望五津。（唐•王勃《送杜少府之任蜀州》）
          - ancient: 不知天上宫阙，今夕是何年。（《水调歌头•明月几时有》）
      - trans: ❷墓道前两边的石牌坊。
        sentences:
          - ancient: 音尘绝，西风残照，汉家陵阙。（唐•李白《忆秦娥》）
      - trans: ❸帝王所居之处；宫殿。
        sentences:
          - ancient: （曹）操乃诣阙贡献。（《后汉书•董卓传》）
          - ancient: 【高考题例】即偕诸大臣伏阙上疏，疏入，帝惊泣不食，瑾等大惧。（《明史•韩文传》）
          - ancient: 炀帝嗣位，被追入朝，百姓攀恋，累日不能出境，诣阙上书致请者，前后数百人。（《北史•来护儿传》）

  - word: 阙
    type: 【名词】
    phonetic: que1
    tags:
      - 高中
    samples:

      - trans: ❶空隙;缺口。
        sentences:
          - ancient: 自三峡七百里中，两岸连山，略无阙处。（《三峡》）
      - trans: ❷空缺。
        sentences:
          - ancient: 【高考题例】先是，察官阙，朝论多属燧，以未历县，遂除左司谏。（《宋史•萧燧传》）
      - trans: ❸过失;弊病。
        sentences:
          - ancient: 愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。（《出师表》）
          - ancient: 有可以救济人病（指民疾），裨补（增益;完补）时阙。（唐•白居易《与元尤屯》）
          - ancient: 【高考题例】臣任功曹王涣以简贤选能，主簿镡显拾遗补阙，臣奉宣诏书而已。（《后汉书•王涣传》）

  - word: 阙
    type: 【动词】
    phonetic: que1
    tags:
      - 高中
    samples:
      - trans: ❶同"缺"。空（kong4）着，留待以后处理。
        sentences:
          - ancient: 君子于其阴不知，盖阙如也。（《论语•子路》）
      - trans: ❷同"缺"。缺少。
        sentences:
          - ancient: 南渡桂水阙舟楫。（唐•杜甫《暮归》）
          - ancient: 小子不敏，请悉论先人所次旧闻，弗敢阙。（《史记•太史公自序》）
      - trans: ❸损伤；损害。
        sentences:
          - ancient: 既东封郑，又欲肆其西封，若不<阙>秦，将焉取之？<阙>秦以利晋，唯君图之。（《烛之武退秦师》）