---
words:
  - word: 负
    type: 【动词】
    phonetic: fu4
    tags:
      - 高中
    samples:
      - trans: ❶背（bei1）
        sentences:
          - ancient: 帝感其诚，命夸娥氏二子负二山，一厝（cuo4,通""措"，放置）朔东，一厝雍南。（《愚公移山》）
          - ancient: 烧其南门，民负争负薪刍助之。（《资治通鉴•唐纪五十六》）
          - ancient: 左右乃曰：""王负剑！王负剑！"（《荆轲刺秦王》）
          - ancient: 谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。（《寡人之于国也》）
          - ancient: 廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪。（《廉颇蔺相如列传》）
      - trans: ❷背靠着。
        sentences:
          - ancient: 四战（四面受敌）之国贵（重视）守战,负海之国贵攻战。（《高君书•兵守》）
      - trans: ❸担负;承担。
        sentences:
          - ancient: 秦以城求璧而赵不许，曲（理亏）在赵;赵予璧而秦不予赵城，曲在秦。均之二策，宁许以负秦曲。（《廉颇蔺相如列传》）
          - ancient: 使负栋之柱，多于南亩之农夫。（《阿房宫赋》）
          - ancient: 【高考题例】或劝脱脱曰："王公素负重名，不可害。"（《明史•王祎传》）
      - trans: ❹依仗;凭借。
        sentences:
          - ancient: 张凭举孝廉，出都（到京城），负其才气，谓必参时彦。（《世说新语•文学》）
          - ancient: 夹岸高山，皆生寒树，负势竞上,互相轩（高）邈（远）。（《与朱元思书》）
          - ancient: 秦贪，负其强,以空言求璧，偿城恐不可得。（《廉颇蔺相如列传》）
      - trans: ❺辜负;对不起。
        sentences:
          - ancient: 臣诚恐见欺于王而负赵,故令人持璧归，间至赵矣。（《廉颇蔺相如列传》）
          - ancient: 先生曰："狼负我！狼负我!"狼曰:"吾非固（一定）欲负汝，天生汝辈，固需吾辈食也。"（《中山狼传》）〕吾今且赴府，不久当还归，誓天不相负！（《孔雀东南飞》）
      - trans: ❻违背;背弃。
        sentences:
          - ancient: 相如度秦王虽斋,决负约不偿城，乃使其从者衣褐,怀其璧，从径道（小路）亡（逃走），归璧于赵。（《廉颇蔺相如列传））
          - ancient: 负神明，而使汝夭。（《祭十二郎文》）
      - trans: ❼失败。
        sentences:
          - ancient: 不知彼而知己，一胜一负。（《孙子兵法•谋攻》）
          - ancient: 向使三国各爱其地,齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。（《六国论》）
      - trans: ❽蒙受。
        sentences:
          - ancient: 这都是我做窦娥的没时没运，不明不暗，负屈衔冤。（《窦娥冤》）
      - trans: ❾欠。
        sentences:
          - ancient: （邓）通家尚负等（债）数巨万。（《汉书•邓通传》）

