---
words:
  - word: 犹
    type: 【名词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: "❶又称犹湖,似猴而足短。"
        sentences:
          - ancient: 山多<犹>猢，似猴而短足，好游岩树。（《水经注•江水》）
            url: xxxx
            vernacular: 山中多犹瑚，形状像猴子，但脚稍短，喜欢在岩头和树上嬉戏
      - trans: ❷通"猷"。计谋;谋划。
        sentences:
          - ancient: 方叔元老，克壮其<犹>。（《诗经•小雅•采芝》）
            url: xxxx
            vernacular: 尊贵的方叔元老英雄人物，老当益壮操劳国事善筹谋。
  - word: 犹
    type: 【动词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: 如同；好像。
        sentences:
          - ancient: 以若所为，求若所欲，<犹>缘木而求鱼也。（《孟子•梁惠王上》）
            url: xxxx
            vernacular: 但是以这样的做法，去谋求这样的理想，就像爬到树上却要抓鱼一样。
          - ancient: 以地事（侍奉）秦，<犹>抱薪救火。（《六国论》）
            url: xxxx
            vernacular: 割地给秦国（来求得暂时的安稳），就好像抱着木柴救火一样。
          - ancient: 后之视今，亦<犹>今之视昔，悲夫！（《兰亭集序》）
            url: xxxx
            vernacular: 后人看待今人，也就像今人看待前人。可悲呀！
          - ancient: 臣事君，<犹>子事父也，子为父死，亡所恨，愿勿复再言！（《苏武传》）
            url: xxxx
            vernacular: 大臣侍奉君王，就像儿子侍奉父亲，儿子为父亲而死，没有什么可遗憾的，希望你不要再说了！
          - ancient: "【高考题例】治兵有制，名虽不同，从而横之，方而圆之,使万众<犹>一人。（《宋史•许将传》）"
            url: xxxx
            vernacular: 治理军队有制度，名称虽然不同，或纵或横，或方或圆，要让万众像一人。
  - word: 犹
    type: 【副词】
    phonetic: you2
    tags:
      - 高中
    samples:
      - trans: ❶还;仍然。
        sentences:
          - ancient: 虽体解吾<犹>未变兮，岂余心之可惩？（《离骚》）
            url: xxxx
            vernacular: 就是身体被肢解,我也不会改变理想,我的心哪是惩罚所能更改的!
          - ancient: 夫六国与秦皆诸侯，其势弱于秦，而<犹>有可以不赂而胜之之势。（《六国论》）
            url: xxxx
            vernacular: 六国和秦国都是诸侯之国，他们的势力比秦国弱，却还有可以不贿赂秦国而战胜它的优势。
          - ancient: 三径就荒，松菊<犹>存。（《归去来兮辞》）
            url: xxxx
            vernacular: 院子里的小路快要荒芜了，松树菊花还长在那里
          - ancient: 士之耽兮，<犹>可说也。女之耽兮，不可说也！（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 男子沉溺在爱情里，还可以脱身。女子沉溺在爱情里，就无法摆脱了。
          - ancient: 千呼万唤始出来，<犹>抱琵琶半遮面。（《琵琶行》）
            url: xxxx
            vernacular: 千呼万唤她才缓缓地走出来，用怀里抱着的琵琶半遮着脸面。
          - ancient: "【高考题例】贼怒,碎其首，缚诸（之于）檣丛射之，骂贼不少（稍微）变，至死声<犹>壮，年三十有九。（《明史•花云祥》）"
            url: xxxx
            vernacular: 敌人很气怒，打破他的头，把他绑在桅杆上，用乱箭射他。花云痛骂敌人没有丝毫改变，至死声音还很雄壮，时年三十九岁。
      - trans: ❷尚且。
        sentences:
          - ancient: 臣之壮也，<犹>不如人;今老矣，无能为也已。（《烛之武退秦师》）
            url: xxxx
            vernacular: 我在壮年的时候，尚且不如别人；现在老了，无能为力啊。
          - ancient: 向之所欣，俯仰（一俯一仰之间，表示时间短暂）之间，已为陈迹，<犹>不能不以之兴怀，况修短随化（寿命长短完全听凭造化安排），终期于尽！（《兰亭集序》）
            url: xxxx
            vernacular: 过去所喜欢的东西，转瞬间，已经成为旧迹，尚且不能不因为它引发心中的感触
          - ancient: "古之圣人,其出人也远矣，<犹>且从师而问焉。（《师说》）"
            url: xxxx
            vernacular: 古代的圣人，他们超出一般人很远，尚且跟从老师而请教
