拟ni3
【动词】❶揣度;斟酌。
【例句】拟之而后言,议之而后动。（《周易•系辞上》）
❷打算。
【例句】丈人祠西佳气浓，缘云拟住最高峰。（唐•杜甫《丈人山》）丨闻说双溪春尚好,也拟泛轻舟。（宋•李清照《武陵春•春晚》）
【高考题例】初,选人调（调动职位）拟（打算任用），先南曹，次考功。（《宋史•许将传》）
❸比拟。
【例句】自数十里外望之,碧峰曖然孤起，上干云霄，已非它山可拟。（《过小孤山大孤山》）
❹比画；做样子。
【例句】挟儿南驰，取胡儿弓引满以拟追骑。（宋•黄庭坚《题摹燕郭尚父图》）丨复举剑拟之，武不动。（《苏武传》）
❺模仿;模拟。
【例句】宦官得志，无所惮畏，并起第宅，拟则宫室。（《后汉书•张让传》）丨（张）衡乃拟班固《两都》作《二京赋》，因以讽谏。（《张衡传》）
❻类似。
【例句】吾观《太玄》,方知子云妙极道术,乃与五经相拟，非徒传记之属。（《后汉书•张衡传》）
❼起草;撰写。
【例句】皇上欲幵懋（mao4）勤殿，设顾问官，命君拟旨。（清•梁启超《谭嗣同》）	