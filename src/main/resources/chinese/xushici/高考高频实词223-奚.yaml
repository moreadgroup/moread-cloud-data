---
words:
  - word: 奚
    type: 【名词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: ❶杂使的女奴;奴仆。
        sentences:
          - ancient: 酒人,奄十人，女酒三十人，奚三百人。（《周礼•天官•序官》）丨每旦日出，骑弱马，从小奚奴，背古锦囊。（《新唐书•李贺传》）
      - trans: ❷东胡族，隋唐时期称奚族。
        sentences:
          - ancient: 黄头奚儿日向西，数骑弯弓敢驰突。（唐•杜甫《悲青坂》）

  - word: 奚
    type: 【代词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: ❶表示疑问。用在动词或介词前,作宾语，代处所或事物。相当于"哪里""什么""哪个"等。
        sentences:
          - ancient: 三虱食彘，相与讼，一虱过之，曰："讼者奚说？"（《韩非子•说林下》）丨聊乘化（顺应死生变化）以归尽，乐夫天命复奚疑！（《归去来兮辞》）丨而彼且奚适也？（《逍遥游》）
      - trans: ❷表示疑问。用在名词之前，代事物的状况、性质等。相当于"什么"。
        sentences:
          - ancient: 奚物而谓石？奚物而谓火？（《列子•黄帝》）丨蝗螟（—种吃禾心的害虫），农夫得而杀之,奚故？为其害稼也。（《吕氏春秋•不屈》）
      - trans: ❸表示疑问。用在动词、形容词前，表示询问。相当于"怎么""为什么"等。
        sentences:
          - ancient: 士患不勇耳，奚患于不能？（《吕氏春秋•忠廉》）丨既自以心为形役，奚惆怅而独悲？（《归去来兮辞》）

