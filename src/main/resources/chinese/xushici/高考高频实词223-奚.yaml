---
words:
  - word: 奚
    type: 【名词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: ❶杂使的女奴;奴仆。
        sentences:
          - ancient: "酒人,奄十人，女酒三十人，<奚>三百人。（《周礼•天官•序官》）"
            url: xxxx
            vernacular: 每天清晨太阳刚刚初升时，就骑着一头瘦弱的马，带着一个小书童，背着破烂不堪的锦囊
          - ancient: 每旦日出，骑弱马，从小<奚>奴，背古锦囊。（《新唐书•李贺传》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷东胡族，隋唐时期称奚族。
        sentences:
          - ancient: 黄头<奚>儿日向西，数骑弯弓敢驰突。（唐•杜甫《悲青坂》）
            url: xxxx
            vernacular: 黄头的奚兵每天向西推进，只有几个骑兵，居然敢弯弓射箭向我军冲击。
  - word: 奚
    type: 【代词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: "❶表示疑问。用在动词或介词前,作宾语，代处所或事物。相当于\"哪里\"\"什么\"\"哪个\"等。"
        sentences:
          - ancient: 三虱食彘，相与讼，一虱过之，曰："讼者<奚>说？"（《韩非子•说林下》）
            url: xxxx
            vernacular: 叮在一头肥猪身上的三只虱子，互相争吵起来。 有一只虱子经过它们身旁，便问：“你们为什么吵啊？”
          - ancient: 聊乘化（顺应死生变化）以归尽，乐夫天命复<奚>疑！（《归去来兮辞》）
            url: xxxx
            vernacular: 姑且顺随自然的变化，度到生命的尽头。乐天安命，还有什么可疑虑的呢？
          - ancient: 而彼且<奚>适也？（《逍遥游》）
            url: xxxx
            vernacular: 而它还要飞到哪里去呢？
      - trans: ❷表示疑问。用在名词之前，代事物的状况、性质等。相当于"什么"。
        sentences:
          - ancient: <奚>物而谓石？<奚>物而谓火？（《列子•黄帝》）
            url: xxxx
            vernacular: 什么东西叫做石壁？什么东西叫做火？
          - ancient: "蝗螟（—种吃禾心的害虫），农夫得而杀之,<奚>故？为其害稼也。（《吕氏春秋•不屈》）"
            url: xxxx
            vernacular: 蝗虫，农民看见他就杀了他，这是为什么？
      - trans: ❸表示疑问。用在动词、形容词前，表示询问。相当于"怎么""为什么"等。
        sentences:
          - ancient: 士患不勇耳，<奚>患于不能？（《吕氏春秋•忠廉》）
            url: xxxx
            vernacular: 壮士只担忧自己不够勇敢罢了，哪里用得着担忧事情做不成呢？
          - ancient: 既自以心为形役，<奚>惆怅而独悲？（《归去来兮辞》）
            url: xxxx
            vernacular: 既然自己的心灵为形体所役使，为什么如此失意而独自伤悲？
