然ran2
【动词】❶"燃"的本字。燃烧。
【例句】死灰独不复然乎？（《汉书•韩安国传》）丨夜然脂照城外。（《三国志•魏书•刘馥传》）
❷认为正确。
【例句】成（人名）然之。（《促织》）丨沛公然其计，从之。（《史记•高祖本纪》）
【形容词】正确；对。
【例句】雍之言然。（《论语•雍也》）丨今诚以吾众诈自称公子扶苏、项燕，为天下唱（倡导），宜多应者。吴广以为然。（《陈涉世家》）丨孔子曰"赐，尔以予为多学而识之者与？"曰："然。非与？"（《史记•孔子世家》）

【代词】指示代词。如此;这样。
【例句】河内凶（庄稼歉收），则移其民于河东，移其粟于河内，河东凶亦然。（《孟子•梁惠王上》）丨不然，籍（指项羽）何以至此？（《鸿门宴》）丨同是被逼迫,君尔妾亦然。（《孔雀东南飞》）丨臣左手把其袖，而右手揕其胸，然则将军之仇报，而燕国见陵之耻除矣。（《荆轲刺秦王》）

【连词】表示转折,然而;但是。
【例句】然往来视之,觉无异能者;益习其声，又近出前后,终不敢搏。（《黔之驴》）丨然视其左右，来而记之者已少。（《游褒禅山记》）丨吾不能早用子，今急而求子,是寡人之过也。然郑亡，子亦有不利焉。（《烛之武退秦师》）丨将军战河北，臣战河南,然不自意能先入关破秦。（《鸿门宴》）
【高考题例】平居谨绳墨，蹈规矩；然性吝啬，殖货至巨万。（《宋史•曾公亮传》）

【助词】❶用于句尾，表示比拟，常用"如……然"的格式，可译为"如••••••一般"或"像……似的"。
【例句】其视杀人若艾（通""刈"，割）草菅（一种草本植物）然。（《汉书•贾谊传》）
❷用于形容词后，表示状态"……样子"。
【例句】天油然作云，沛然下雨。（《孟子•梁惠王上》）丨虎见之，庞然大物也，以为神,蔽林间窥之。（《黔之驴》）丨婉贞独戚然曰……（《冯婉贞》）丨怅然遥相望，知是故人来。（《孔雀东南飞》）丨纵一苇之所如，凌（越过）万顷之茫然。（《赤壁赋》）
【高考题例】休烈恬然自持，殊不介意。（《旧唐书•于休烈
"传》）