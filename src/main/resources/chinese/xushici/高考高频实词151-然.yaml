---
words:
  - word: 然
    type: 【动词】
    phonetic: ran2
    tags:
      - 高中
    samples:
      - trans: ❶"燃"的本字。燃烧。
        sentences:
          - ancient: 死灰独不复<然>乎？（《汉书•韩安国传》）
            url: xxxx
            vernacular: 死灰难道就不会复燃吗?
          - ancient: 于是以苫蓑覆之，夜<然>脂照城外。（《三国志•魏书•刘馥传》）
            url: xxxx
            vernacular: 于是用苫草和蓑衣盖在上面，到了夜里燃烧脂油照亮城外。
      - trans: ❷认为正确。
        sentences:
          - ancient: 成（人名）<然>之。（《促织》）
            url: xxxx
            vernacular: 成名认为这些话很对。
          - ancient: 沛公<然>其计，从之。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 沛公认为他的计策不错,遵从了他的计策.
  - word: 然
    type: 【形容词】
    phonetic: ran2
    tags:
      - 高中
    samples:
      - trans: 正确；对。
        sentences:
          - ancient: 雍之言<然>。（《论语•雍也》）
            url: xxxx
            vernacular: 你的话很对。
          - ancient: 今诚以吾众诈自称公子扶苏、项燕，为天下唱（倡导），宜多应者。吴广以为<然>。（《陈涉世家》）
            url: xxxx
            vernacular: 现在如果把我们的人假称公子扶苏和大将项燕的队伍，倡导天下反秦，应当有很多响应的人。
          - ancient: 孔子曰"赐，尔以予为多学而识之者与？"曰："<然>。非与？"（《史记•孔子世家》）
            url: xxxx
            vernacular: 孔子说：“赐啊，你认为我是博学强记的人吗？“子贡回答说：“是的。难道不对吗？“
  - word: 然
    type: 【代词】
    phonetic: ran2
    tags:
      - 高中
    samples:
      - trans: 指示代词。如此;这样。
        sentences:
          - ancient: 河内凶（庄稼歉收），则移其民于河东，移其粟于河内，河东凶亦<然>。（《孟子•梁惠王上》）
            url: xxxx
            vernacular: 河内遇到饥荒，就把那里的老百姓迁移到河东去，把河东的粮食转移到河内；河东遇到饥荒也是这样做。
          - ancient: 不<然>，籍（指项羽）何以至此？（《鸿门宴》）
            url: xxxx
            vernacular: 如果不是这样，我怎么会这么生气。
          - ancient: 同是被逼迫，君尔妾亦<然>。（《孔雀东南飞》）
            url: xxxx
            vernacular: 两人同样是被逼迫，你是这样我也是这样受熬煎。
          - ancient: 臣左手把其袖，而右手揕其胸，<然>则将军之仇报，而燕国见陵之耻除矣。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 我左手抓住他的衣袖，右手（用匕首）刺他的胸膛,这样，将军的仇报了，燕国被欺侮的耻辱也除掉了。
  - word: 然
    type: 【连词】
    phonetic: ran2
    tags:
      - 高中
    samples:
      - trans: 表示转折，然而;但是。
        sentences:
          - ancient: <然>往来视之，觉无异能者;益习其声，又近出前后，终不敢搏。（《黔之驴》）
            url: xxxx
            vernacular: 但是老虎来来回回地观察它，觉得它并没有什么特别的本领。渐渐地老虎熟悉了驴的叫声，又前前后后地靠近它，但始终不敢与它搏斗。
          - ancient: <然>视其左右，来而记之者已少。（《游褒禅山记》）
            url: xxxx
            vernacular: 然而看看左右的石壁，来此而题记的人已经很少了。
          - ancient: 吾不能早用子，今急而求子，是寡人之过也。<然>郑亡，子亦有不利焉。（《烛之武退秦师》）
            url: xxxx
            vernacular: 我不能早早用你，现在由于情况危急因而求您，这是我的过错。然而，郑国灭亡了，你也有所不利啊！
          - ancient: 将军战河北，臣战河南，<然>不自意能先入关破秦。（《鸿门宴》）
            url: xxxx
            vernacular: 将军在黄河以北作战，我在黄河以南作战，但是我自己没有料到能先进入关中，灭掉秦朝。
          - ancient: 【高考题例】平居谨绳墨，蹈规矩；<然>性吝啬，殖货至巨万。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 平时谨守礼仪，遵守规矩，但性情吝啬，积累财富达巨万。
  - word: 然
    type: 【助词】
    phonetic: ran2
    tags:
      - 高中
    samples:
      - trans: ❶用于句尾，表示比拟，常用"如……然"的格式，可译为"如••••••一般"或"像……似的"。
        sentences:
          - ancient: 其视杀人，若艾（通""刈"，割）草菅（一种草本植物）<然>。（《汉书•贾谊传》）
            url: xxxx
            vernacular: 把人命视作野草,任意残杀。
      - trans: ❷用于形容词后，表示状态"……样子"。
        sentences:
          - ancient: 天油<然>作云，沛<然>下雨。（《孟子•梁惠王上》）
            url: xxxx
            vernacular: 一旦天上乌云密布，下起大雨
          - ancient: 虎见之，庞<然>大物也，以为神，蔽林间窥之。（《黔之驴》）
            url: xxxx
            vernacular: 老虎看到它是个庞然大物，以为它是什么神物，就躲在树林里偷偷看它。
          - ancient: 婉贞独戚<然>曰……（《冯婉贞》）
            url: xxxx
            vernacular: 唯独婉贞忧愁地说
          - ancient: 怅<然>遥相望，知是故人来。（《孔雀东南飞》）
            url: xxxx
            vernacular: 心中惆怅远远地望过去，知道是从前的夫婿已来临。
          - ancient: 纵一苇之所如，凌（越过）万顷之茫<然>。（《赤壁赋》）
            url: xxxx
            vernacular: 任凭小船儿在茫无边际的江上飘荡，越过苍茫万顷的江面。
          - ancient: 【高考题例】休烈恬<然>自持，殊不介意。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 于休烈安然自处，毫不介意。
