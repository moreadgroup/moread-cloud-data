---
words:
  - word: 竟
    type: 【名词】
    phonetic: jing4
    tags:
      - 高中
    samples:
      - trans: 通"境"。国境。
        sentences:
          - ancient: 入竟而问禁，入国而问俗，入门而问讳。（《礼记・曲礼上》）
          - ancient: 竟内不失须臾之时。（《商君书•彼民》）
  
  - word: 竟
    type: 【名词】
    phonetic: jing4
    tags:
      - 高中
    samples:
      - trans: 【动词】完毕;结束。
        sentences:
          - ancient: 神龟虽寿，犹有竟时。（汉•曹操《龟虽寿》）
          - ancient: 及见怪，岁竟，此两家常折券弃责。（《史记•高祖本纪》）
  
  - word: 竟
    type: 【形容词】
    phonetic: jing4
    tags:
      - 高中
    samples:
      - trans: 整;终。
        sentences:
          - ancient: 久不见若（你的）影，何竟日默默在此,大类女郎也?（《项脊轩志》）
  - word: 竟
    type: 【副词】
    phonetic: jing4
    tags:
      - 高中
    samples:
      - trans: ❶终于;毕竟。
        sentences:
          - ancient: 怀王怒，不听。亡走赵，赵不内（同""纳"）。复之秦,竟死于秦而归葬。（《史记•屈原贾,生列传》）
          - ancient: 道竟何为邪？（唐•刘禹锡《天论》）
      - trans: ❷竟然;居然。
        sentences:
          - ancient: 执手相看泪眼，竟无语凝噎。（《雨霖铃》）
          - ancient: 而齐竟怒不救楚，楚大困。（《史记•屈原贾生列传》）
          - ancient: 【高考题例】疏入，贵妃、承先皆怒，同列亦为登云危，帝竟留中不下。（《明史•陈登云传》

