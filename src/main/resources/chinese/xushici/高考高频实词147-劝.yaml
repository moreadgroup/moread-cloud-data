---
words:
  - word: 劝
    type: 【动词】
    phonetic: quan4
    tags:
      - 高中
    samples:
      - trans: ❶勉励;奖励。
        sentences:
          - ancient: 果行，国人皆劝。（《勾践灭吴》）
          - ancient: 顺于民心，所补者三:一曰主用足，二曰民赋少，三曰劝农功。（汉•晁错《论贵粟疏》）
      - trans: ❷劝说;劝导。
        sentences:
          - ancient: 怀王稚子子兰劝王行。（《史记•屈原贾生列传》）
          - ancient: 时周瑜受使至番阳，肃劝权召瑜还。（《资治通鉴•汉纪五十七》）
      - trans: ❸努力。
        sentences:
          - ancient: 若是则田野大辟，而农夫劝其事矣。（《管子•轻重乙》）
          - ancient: 且举世誉之而不加劝，举世非之而不加沮。（《逍遥游》）
