---
words:
  - word: 彰
    type: 【动词】
    phonetic: zhang1
    tags:
      - 高中
    samples:
      - trans: ❶显示;表明。
        sentences:
          - ancient: 若无兴德之言，则责（郭）攸之、（费）祎、（董）允等之博（懈怠），以<彰>其咎。（《出师表》）
            url: xxxx
            vernacular: 如果没有振兴圣德的建议，就责罚郭攸之、费祎、董允等人的怠慢，来揭示他们的过失
      - trans: ❷表彰;表扬。
        sentences:
          - ancient: 然而不<彰>其功，不扬其声。（《淮南子•览冥训》）
            url: xxxx
            vernacular: 尽管如此，他们从来不标榜炫耀自己的功绩，从来不张扬彰显自己的名声
          - ancient: 今天动威以<彰>周公之德，惟朕小子其迎，我国家礼亦宜之。（《史记•鲁周公世家》）
            url: xxxx
            vernacular: 现在上天动怒来表彰周公的功德，只是我小儿子的欢迎，我们国家的礼制也应该的
  - word: 彰
    type: 【形容词】
    phonetic: zhang1
    tags:
      - 高中
    samples:
      - trans: 明显;清楚。
        sentences:
          - ancient: 顺风而呼，声非加疾（大）也，而闻者<彰>。（《劝学》）
            url: xxxx
            vernacular: 顺着风呼叫，声音没有变得洪亮，可是听的人在远处也能听得很清楚。
