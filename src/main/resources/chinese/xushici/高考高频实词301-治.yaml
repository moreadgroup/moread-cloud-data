---
words:
  - word: 治
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 治所。
        sentences:
          - ancient: 巫山在县西南，而今县东有巫山，将郡县居治无恒故也。（《水经注•江水》）

  - word: 治
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶治理;管理。
        sentences:
          - ancient: 故治国无法则乱，守法而弗变则悖（谬误），悖乱不可以持国。（《吕氏春秋•察今》）
          - ancient: 民不足而可治者，自古及今，未之尝闻。（《论积贮疏》）
          - ancient: 单于使卫律治其事，张胜闻之，恐前语发，以状语武。（《苏武传》）
          - ancient: 伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤老，特为尤甚。（《陈情表》）
      - trans: ❷医治。
        sentences:
          - ancient: 君有疾在媵理（媵cou4,中医指皮肤的纹理和皮下肌肉之间的空隙），不治将恐深。（《韩非子•喻老》）
          - ancient: 如人有疾，不治则寝以深。（《盐铁论•世务》）
          - ancient: 君之病在肌肤，不治将益（更加）深。（《扁鹊见蔡桓公》）
      - trans: ❸惩处;处置。
        sentences:
          - ancient: 且矫诏纷出，钩党之捕遍于天下，卒以吾郡之发愤一击，不敢复有株治。（《五人墓碑记》）
          - ancient: 愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。（《出师表》）
          - ancient: 绝无有者，则治之如所言。（《狱中杂记》）
      - trans: ❹训练;整治。
        sentences:
          - ancient: 今<治>水军八十万众。（《资治通鉴•汉纪五十七》）
          - ancient: 荆轲有所待，欲与俱;其人居远未来，而为治行。（《史记•或.刺客列传》）
      - trans: ❺对付;抵御。
        sentences:
          - ancient: 同心一意，共<治>曹操。（《资治通鉴•汉纪五十七》）
      - trans: ❻讲求;硏究。
        sentences:
          - ancient: 奚暇治礼义哉！（《齐桓晋文之事》）

  - word: 治
    type: 【形容词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 治理得好;太平（与"乱"相对）。
        sentences:
          - ancient: 以乱攻治者亡。（《战国策•秦策三》）
          - ancient: 然亡国破家相随属（接连），而圣君治国累世而不见（出现）者,其所谓忠者不忠，而所谓贤者不贤也。（《史记•屈原贾生列传》）
          - ancient: 源不深而望流之远，根不固而求木之长，德不厚而望国之治，虽在下愚，知其不可，而况于明哲乎！（《谏太宗十思疏》）
          - ancient: 【高考题例】今贤否杂糅，风俗浇浮，兵未强,财未裕,宜卧薪尝胆以图内治。（《宋史•萧燧传》）
