---
words:
  - word: 胡
    type: 【名词】
    phonetic: hu2
    tags:
      - 高中
    samples:
      - trans: ❶兽颔下的垂肉。
        sentences:
          - ancient: 前虞（担忧）跋（踏）胡，后恐疐尾（zhi4,跌倒）尾，三纳之而未克，徘徊容与（徘徊不进的样孚），追者益近。（《中山狼传》）
      - trans: ❷我国古代西北部民族的统称。
        sentences:
          - ancient: 胡人不敢南下而牧马，士不敢弯弓而报怨。（《过秦论》）
          - ancient: 旦辞黄河去,暮至黑山头。不闻爷娘唤女声,但闻燕山胡骑鸣啾啾。（《木兰诗》）
  - word: 胡
    type: 【代词】
    phonetic: hu2
    tags:
      - 高中
    samples:
      - trans: 什么;怎么。
        sentences:
          - ancient: 即不幸有方二三千里之旱,国胡以相恤？（《论积贮疏》）
          - ancient: 胡为乎遑遑欲何之？（《归去来兮辞》）
          - ancient: 不狩不猎，胡瞻尔庭有县貆（huan2,小貉）兮？（《诗经•魏风•伐檀》）
          - ancient: 归去来兮，田园将芜胡不归？（《归去来兮辞》）
          - ancient: 其险也若此,嗟尔远道之人胡为乎来哉！（《蜀道难》）
