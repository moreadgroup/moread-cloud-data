---
words:
  - word: 奉
    type: 【动词】
    phonetic: feng4
    tags:
      - 高中
    samples:
      - trans: ❶两手捧着。
        sentences:
          - ancient: 王必（假如）无人，臣愿<奉>璧往使。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 大王如果无人可派，臣愿捧护宝璧前往出使。
          - ancient: 沛公塞卮酒为寿，约为婚姻。（《鸿门宴》）
            url: xxxx
            vernacular: 刘邦捧上一杯酒向项伯祝酒，和项伯约定结为儿女亲家
          - ancient: 荆轲<奉>樊於期头函，而秦武阳<奉>地图匣，以次进。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲捧着装了樊於期头颅的盒子，秦武阳捧着地图匣子，按次序进宫
          - ancient: 是时，侍医夏无且以其所<奉>药囊提轲。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 这时，秦王的随从医官夏无且(jū)用他手里捧着的药袋投击荆轲。
      - trans: ❷接受，多指对上级或长辈。
        sentences:
          - ancient: 受任于败军之际，<奉>命于危难之间，尔来二十有一年矣。（《出师表》）
            url: xxxx
            vernacular: 后来遇到兵败，在兵败的时候接受任务，形势危急之时奉命出使，从这以来二十一年了。
          - ancient: 近者<奉>辞伐罪，旌麾南指，刘琮束手。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 近来我奉皇帝的命令讨伐有罪的人，大军南下，刘琮投降
          - ancient: "臣欲<奉>诏奔驰，则刘病日笃;欲苟顺私情，则告诉不许。（《陈情表》）"
            url: xxxx
            vernacular: 我很想奉旨为皇上奔走效劳，但祖母刘氏的疾病一天比一天沉重，想要姑且顺从自己的私情，但报告申诉不被允许。
          - ancient: 初，<奉>使往来，无留北者。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 当初，使者奉命往来，并没有被扣留在北方的
      - trans: ❸供给。
        sentences:
          - ancient: 以<奉>我一人之淫乐，视为当然。（明•黄宗羲《原君》）
            url: xxxx
            vernacular: 以供个人放纵的享乐，（把这）看成应当如此
      - trans: ❹侍奉;尊奉。
        sentences:
          - ancient: 为宫室之美、妻妾之<奉>、所识穷乏者得我与？（《鱼我所欲也》）
            url: xxxx
            vernacular: 是为了住宅的华丽，妻妾的侍奉和熟识的穷人感激我吗？
          - ancient: "怀帝阍（阍hun1，皇帝的宫门）而不见，<奉>宣室（汉代宫殿）以何年？（《滕王阁序》）"
            url: xxxx
            vernacular: 怀念着君王的宫门，但却不被召见，什么时候才能像贾谊那样到宣室侍奉君王呢？
          - ancient: <奉>事循公姥，进止敢自专？（《孔雀东南飞》）
            url: xxxx
            vernacular: 侍奉公婆都顺着他们的心意，一举一动哪里敢自作主张不守本分？
          - ancient: 舍簪笏于百龄，<奉>晨昏于万里。（《滕王阁序》）
            url: xxxx
            vernacular: 如今我抛弃了一生的功名，不远万里去朝夕侍奉父亲。
          - ancient: 逮<奉>圣朝，沐浴清化。（《陈情表》）
            url: xxxx
            vernacular: 到了晋朝建立，我蒙受着清明的政治教化。
      - trans: ❺遵守;遵从。
        sentences:
          - ancient: 天子偶用一物，未必不过此已忘;而<奉>行者即为定例。（《促织》）
            url: xxxx
            vernacular: 皇帝偶尔使用一件东西，未必不是用过它就忘记了；然而下面执行的人却把它作为一成不变的惯例。
          - ancient: <奉>法者强则国强。（《韩非子•有度》）
            url: xxxx
            vernacular: 执行法律的人依法行事，那么国家就强大。
          - ancient: 【高考题例】吏<奉>法，律不可枉也，更道它所欲。（《后汉书•赵憙传》）
            url: xxxx
            vernacular: 官吏奉行法典，律令是不可违犯的，再说说其他要求。
      - trans: ❻通"俸"。俸禄。
        sentences:
          - ancient: 位尊而无功，<奉>厚而无劳，而挟重器多也。（《战国策-赵策四》）
            url: xxxx
            vernacular: 地位高贵却没有功，俸禄优厚却没有劳，而且拥有的贵重宝器太多了啊！
      - trans: ❼进献;献上。
        sentences:
          - ancient: 轲既取图<奉>之，发图，图穷而匕首见。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲拿来地图之后捧着，打开地图，地图全部展开后露出了匕首。
          - ancient: 诸侯之地有限，暴秦之欲无厌，<奉>之弥繁，侵之愈急。（《六国论》）
            url: xxxx
            vernacular: 既然这样，那么诸侯的土地有限，强暴的秦国的欲望永远不会满足，诸侯送给秦越多，秦侵犯六国就越急迫。
      - trans: ❽祭祀;供奉。
        sentences:
          - ancient: "愿举国为内臣，比诸侯之列，给贡职如郡县，而得<奉>守先王之宗庙。（《荆轲刺秦王》）"
            url: xxxx
            vernacular: 愿意全国上下都做秦国的臣民，排在诸侯的行列里(意为：燕国愿意同别的诸侯一起尊秦王为天子)像秦国的郡县那样贡纳赋税，俾能守住祖先的宗庙。
          - ancient: 【高考题例】民图像与庐，而<奉>之如神，名日"范公庵"。（《宋史.范纯礼传》）
            url: xxxx
            vernacular: 百姓在房中悬挂“他的”画像，把他像神仙一样供奉，叫 他为“范公庵”。
  - word: 奉
    type: 【副词】
    phonetic: feng4
    tags:
      - 高中
    samples:
      - trans: 表示恭敬。
        sentences:
          - ancient: "此兴予非薄，何时得<奉>陪？（唐•杜牧《早春寄岳州李使君李善棋爱酒情地闲雅》）"
            url: xxxx
            vernacular: 奉陪到底意思就是坚持做好一件事，不中途放弃，以诚恳的敬意，来陪伴别人共度时光。出自唐·杜牧《早春寄岳州李使君》诗：“此兴予非薄，何时得奉陪？”
