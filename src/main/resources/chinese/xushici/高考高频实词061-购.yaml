购gou4
【动词】❶悬赏捕捉。
【例句】吾闻汉购我头千金，邑万户。（《项羽之死》）丨穷饿无聊，追购又急，天高地迥，号呼靡及。（《〈指南录〉后序》）丨夫今樊将军，秦王购之金千斤，邑万家。（《荆轲刺秦王》）
【高考题例】有人别收得《国史》《实录》，如送官司，重加购赏。（《旧唐书•于休烈传》）
❷买。
【例句】太宗尝出御府金帛购求王羲之书迹。（《旧唐书•褚遂良传》）丨予购三百盆，皆病者，无一完者。（《病梅馆记》）
❸通"媾";讲和。
【例句】乃警公仲之行，将西购于秦。（《史记•韩世家》）
