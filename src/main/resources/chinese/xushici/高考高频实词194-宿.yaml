---
words:
  - word: 宿
    type: 【名词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶住宿的地方。
        sentences:
          - ancient: 三十里有<宿>，<宿>有路室。（《周礼•地官•遗人》）
      - trans: ❷夜。
        sentences:
          - ancient: 适百里者，宿舂粮。（《逍遥游》）

  - word: 宿
    type: 【动词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶住宿;过夜。
        sentences:
          - ancient: 旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声,但闻黄河流水鸣溅溅。（《木兰诗》）
          - ancient: 谢公宿处今尚在，渌（lu4,清澈）水荡漾清猿啼。（《梦游天姥吟留别》）
          - ancient: 不得已，变姓名，诡踪迹，草行露宿，日与北骑相出没于长淮间。（《〈指南录〉后序》）
      - trans: ❷停留。
        sentences:
          - ancient: 薄云岩际<宿>,孤月浪中翻。（唐•杜甫《宿江边阁》）
      - trans: ❸保持;长期从事。
        sentences:
          - ancient: 官宿其业。（《左传•昭公二十九年》）

  - word: 宿
    type: 【形容词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶旧有的；多年的。
        sentences:
          - ancient: 边境有兵，则怀宿怨而不战。（《管子•轻重》）
          - ancient: 大率用根者，若有宿根，须取无茎叶时釆，则津泽皆归其根。（《梦溪笔谈•药议》）
          - ancient: 朋友之墓，有宿草而不哭焉。（《礼记•檀弓上》）
      - trans: ❷隔夜的；隔年的。
        sentences:
          - ancient: 叶上初阳干宿雨，水面清圆，一一风荷举。（宋•周邦彦《苏幕遮•燎沉香》）
          - ancient: 宿醉头仍重，晨游眼乍明。（唐•白居易《洛桥寒食日作十韵》）
          - ancient: 【高考题例】旅舍残春宿雨睛,恍然心地忆屈京。（唐•韩偓《残春旅舍》）
      - trans: ❸年老的;富着阅历的;经验丰富的。
        sentences:
          - ancient: 河间之宿儒。（清•纪旳《阅微草堂笔记•姑妄听之二》）
          - ancient: 公子曰："晋鄙嚄唶（huòzè）宿将，往恐不听，必当杀之，是以泣耳，岂畏死哉？"（《史记•魏公子列传》）

  - word: 宿
    type: 【副词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: 向来;平素。
        sentences:
          - ancient: （孙）权既宿服仰（刘）备，又睹（诸葛）亮奇雅，甚敬重之，即遣兵三万人以助备。（《三国志•蜀书.诸葛亮传》）

