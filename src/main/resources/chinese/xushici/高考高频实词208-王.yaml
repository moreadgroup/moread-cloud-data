    samples:
      - trans: ❶成就王业;统治天下。
        sentences:
          - ancient: 七十者衣帛食肉，黎民不饥不寒，然而不<王>者，未之有也。（《寡人之于国也》）
            url: xxxx
            vernacular: 年满七十岁的人能穿上丝绸、吃上鱼肉，老百姓不缺衣少食，做到了这些而不称王于天下的是决不会有的。
          - ancient: 沛公（指刘邦）欲<王>关中，使子婴为相，珍宝尽有之。（《鸿门宴》）
            url: xxxx
            vernacular: 沛公（刘邦）想要率先攻城在关中称王，并且拜子婴为宰相，关内的财宝都归属于他.
      - trans: ❷封为王。
        sentences:
          - ancient: 宜悉<王>诸功臣。（《后汉书•刘玄传》）
            url: xxxx
