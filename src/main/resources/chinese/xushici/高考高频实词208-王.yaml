---
words:
  - word: 王
    type: 【名词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: ❶君主；帝王。
        sentences:
          - ancient: 三十日不还，则请立太子为王，以绝秦望（念头）。（《廉颇蔺相如列传》）
          - ancient: 其始，太医以王命聚之，岁赋其二。（《捕蛇者说》）
          - ancient: 夫《春秋》，上明三王之道，下辨人事之纪。（《史记•太史公自序》）
      - trans: ❷秦以后,国家的君主一律称帝，"王"成为一种最高的封爵。
        sentences:
          - ancient: 且壮士不死即已，死即举大名耳，王侯将相宁有种乎！（《陈涉世家》）

  - word: 王
    type: 【动词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: 朝见天子。
        sentences:
          - ancient: 莫敢不来享,莫敢不来王。（《诗经•商颂•殷武》）

  - word: 王
    type: 【形容词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: 某一类事物中大的;最大的。
        sentences:
          - ancient: 春献王鲔（wei3,古称鲟鱼）。（《周礼•天官•敝人》）
          - ancient: 蟒，王蛇（蛇最大者，故曰王蛇）。（《尔雅•释鱼》）

  - word: 王
    type: 【动词】
    phonetic: wang4
    tags:
      - 高中
    samples:
      - trans: ❶成就王业;统治天下。
        sentences:
          - ancient: 七十者衣帛食肉,黎民不饥不寒，然而不王者，未之有也。（《寡人之于国也》）
          - ancient: 沛公（指刘邦）欲王关中，使子婴为相，珍宝尽有之。（《鸿门宴》）
      - trans: ❷封为王。
        sentences:
          - ancient: 宜悉王诸功臣。（《后汉书•刘玄传》）

  - word: 王
    type: 【形容词】
    phonetic: wang4
    tags:
      - 高中
    samples:
      - trans: 通"旺"。旺盛。
        sentences:
          - ancient: 神虽王，不膏（喜欢）也。（《庄子•养生主》）
