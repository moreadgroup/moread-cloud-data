---
words:
  - word: 王
    type: 【名词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: ❶君主；帝王。
        sentences:
          - ancient: 三十日不还，则请立太子为<王>，以绝秦望（念头）。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 如果三十天还没回来，就请您允许我们立太子为王，以断绝秦国要挟的妄想。
          - ancient: 其始，太医以<王>命聚之，岁赋其二。（《捕蛇者说》）
            url: xxxx
            vernacular: 起初，太医用皇帝的命令征集这种蛇，每年征收这种蛇两次
          - ancient: 夫《春秋》，上明三<王>之道，下辨人事之纪。（《史记•太史公自序》）
            url: xxxx
            vernacular: 《春秋》这部书，对上则阐明了夏禹、商汤、周文王的治世之道，对下则辨明了为人处世的伦理纲常
      - trans: ❷秦以后，国家的君主一律称帝，"王"成为一种最高的封爵。
        sentences:
          - ancient: 且壮士不死即已，死即举大名耳，<王>侯将相宁有种乎！（《陈涉世家》）
            url: xxxx
            vernacular: 况且壮士不死便罢了，要死就该成就伟大的名声啊，王侯将相难道有天生的贵种么？
  - word: 王
    type: 【动词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: 朝见天子。
        sentences:
          - ancient: 昔有成汤，自彼氐羌，莫敢不来享，莫敢不来<王>。（《诗经•商颂•殷武》）
            url: xxxx
            vernacular: 从前成汤建立殷商，那些远方民族氐羌，没人胆敢不来献享，没人胆敢不来朝王。
