私si1
【名词】❶私事;私利。
【例句】借于外力，以成其私而遗社稷之利。（《韩非子•五蠹》）丨丹不忍以己之私，而伤长者之意，愿足下更虑之!（《荆轲刺秦王》）
❷贴身衣服。
【例句】薄（稍稍）污（去污）我私，薄瀚（洗）我衣（外衣）。（《诗经•周南•葛簞》）	’
❸隐私;秘密的事。
【例句】使者归报项王，项王乃疑范增与汉有私，稍夺之权。（《史记•项羽本纪》）

【动词】❶偏私;偏爱。
【例句】吾妻之美我者，私我也。（《邹忌讽齐王纳谏》）
❷私人占有。
【例句】井九百亩，其中为公田，八家皆私百亩。（《孟子・滕文公上》）
❸私通。
【例句】夜有奔女，颜色颇丽。万悦而私之。（《聊斋志异•狐谐》）
❹排尿;小便。
【例句】师慧过宋朝，将私焉。（《左传•襄公十五年》）

【形容词】私人的;个人的（与"公"相对）。
【例句】吾所以为此者，以先国家之急而后私仇也。（《廉颇蔺相如列传》）丨子布、元表诸人，各顾妻子，挟持私虑，深失所望。（《资治通鉴•汉纪五十七》）

【副词】私下;秘密地。
【例句】张良是时从沛公（指刘邦），项伯乃夜驰之沛公军,私见张良。（《鸿门套》丨臣尝从大王与燕王会境上，燕王私握臣手曰，"愿结友"。以此知之，故欲往。（《廉颇蔺相如列传》）