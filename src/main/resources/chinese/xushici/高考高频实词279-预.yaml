预yu4
【动词】❶预备。
【例句】右臣闻事预则立，不预则废。（宋•苏轼《奏浙西灾伤第一状》）
❷参与。
【例句】偶兹精庐近,数预名僧会。（唐•岑参《终南山双峰草堂》）

【形容词】安乐。
【高考题例】仙亭日登眺,虎丘时游预。（唐•白居易《和微之诗二十三首・和三月三十日四十韵》）



【副词】预先。
