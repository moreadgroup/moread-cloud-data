色se4
【名词】❶颜色。
【例句】落霞与孤鹜（Wu4，野鸭）齐飞，秋水共长天一色。（《滕王阁序》）丨耳得之而为声，目遇之而成色。（《赤壁赋》）
❷神色;表情。
【例句】巧言令色，鲜矣仁。（《论语•学而》）丨太后之色少解（稍微缓和）。（《触龙说赵太后》）丨富者有惭色。（《为学》）丨至陛下，秦武阳色变振恐，群臣怪之。（《荆轲刺秦王》）丨是以就极刑而无愠色。（《报任安书》）丨断头置城上,颜色不少变。（《五人墓碑记》）丨屈原既放，游于江潭，行吟泽畔，颜色憔悴，形容枯槁。（《渔父》）
【高考题例】而亲贤下士，推毂后进，虽位崇年高，曾无倦色。（《旧唐书•于休烈传》）
❸景色。
【例句】春色满园关不住，一枝红杏出墙来。（宋•叶绍翁《游园不值》）丨左天都，右莲花，背倚玉屏风，两峰秀色，俱可手揽。（明•徐霞客《游黄山日记》）
❹美色，多指女色。
【例句】王曰："寡人有疾，寡人好色。"（《孟子•梁惠王下》）丨毅怪视之，乃殊色也。（《柳毅传》）丨及壮,试为吏，为泗水亭长,廷中吏无所不狎侮。好酒及色。（《史记•高祖本纪》）
❺情欲。
【例句】食色,性也。（《孟子•告子上》）
❻容颜;容貌。
【例句】弟走从军阿姨死，暮去朝来颜色故。（《琵琶行》）
❼怒色。
【例句】子贡色作。（《史记•孔子世家》）
❽种类;品类。
【例句】诸色名目，悉宜停罢。（唐•陆贽《奉天改元•大赦制》）丨其赠几何多，六色十五饼。（宋•梅尧臣《吕晋叔著作遗新茶》）
❾佛教指称一切可以感触到的有形质的东西。
【例句】色即是空，空即是色。（《心经》）丨空色皆寂灭，缘业亦何名！（唐•陈子昂《感遇》之八）