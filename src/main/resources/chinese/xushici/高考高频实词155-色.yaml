---
words:
  - word: 色
    type: 【名词】
    phonetic: se4
    tags:
      - 高中
    samples:
      - trans: ❶颜色。
        sentences:
          - ancient: 落霞与孤鹜（Wu4，野鸭）齐飞，秋水共长天一色。（《滕王阁序》）
          - ancient: 耳得之而为声，目遇之而成色。（《赤壁赋》）
      - trans: ❷神色;表情。
        sentences:
          - ancient: 巧言令色，鲜矣仁。（《论语•学而》）
          - ancient: 太后之色少解（稍微缓和）。（《触龙说赵太后》）
          - ancient: 富者有惭色。（《为学》）
          - ancient: 至陛下，秦武阳色变振恐，群臣怪之。（《荆轲刺秦王》）
          - ancient: 是以就极刑而无愠色。（《报任安书》）
          - ancient: 断头置城上，颜色不少变。（《五人墓碑记》）
          - ancient: 屈原既放，游于江潭，行吟泽畔，颜色憔悴，形容枯槁。（《渔父》）
          - ancient: 【高考题例】而亲贤下士，推毂后进，虽位崇年高，曾无倦色。（《旧唐书•于休烈传》）
      - trans: ❸景色。
        sentences:
          - ancient: 春色满园关不住，一枝红杏出墙来。（宋•叶绍翁《游园不值》）
          - ancient: 左天都，右莲花，背倚玉屏风，两峰秀色，俱可手揽。（明•徐霞客《游黄山日记》）
      - trans: ❹美色，多指女色。
        sentences:
          - ancient: 王曰："寡人有疾，寡人好色。"（《孟子•梁惠王下》）
          - ancient: 毅怪视之，乃殊色也。（《柳毅传》）
          - ancient: 及壮，试为吏，为泗水亭长，廷中吏无所不狎侮。好酒及色。（《史记•高祖本纪》）
      - trans: ❺情欲。
        sentences:
          - ancient: 食色，性也。（《孟子•告子上》）
      - trans: ❻容颜;容貌。
        sentences:
          - ancient: 弟走从军阿姨死，暮去朝来颜色故。（《琵琶行》）
      - trans: ❼怒色。
        sentences:
          - ancient: 子贡色作。（《史记•孔子世家》）
      - trans: ❽种类;品类。
        sentences:
          - ancient: 诸色名目，悉宜停罢。（唐•陆贽《奉天改元•大赦制》）
          - ancient: 其赠几何多，六色十五饼。（宋•梅尧臣《吕晋叔著作遗新茶》）
      - trans: ❾佛教指称一切可以感触到的有形质的东西。
        sentences:
          - ancient: 色即是空，空即是色。（《心经》）
          - ancient: 空色皆寂灭，缘业亦何名！（唐•陈子昂《感遇》之八）