---
words:
  - word: 形
    type: 【名词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶形体;身体。
        sentences:
          - ancient: 鸟兽得之，形体肥大，羽毛丰茂。（《管子.水地》）
          - ancient: 或因寄所托，放浪形骸之外。（《兰亭集序》）
          - ancient: 既自以心为形役，奚惆怅而独悲？（《归去来兮辞》）
      - trans: ❷形状;形象。
        sentences:
          - ancient: 视之，形若土狗（蝼蛄），梅花翅，方首长胫，意似良。（《促织》）
          - ancient: 形似酒尊，饰以篆文山龟鸟兽之形。（《张衡传》）
      - trans: ❸地形。
        sentences:
          - ancient: 隘形者，我先居之，必盈之以待敌。（《孙子兵法•地形》）
          - ancient: 秦富十倍天下，地形彊。（《史记•高祖本纪》）
      - trans: ❹情形;情况。
        sentences:
          - ancient: 今太子闻光壮盛之时，不知吾形已不逮也。（《史记•刺客列传》）
      - trans: ❺形势。
        sentences:
          - ancient: （曹）操军破，必北还;如此，则荆、吴之势强，鼎足之形成矣。（《资治通鉴•汉纪五十七》）
          - ancient: 由此言之，勇怯，势也;强弱，形也。（《报任安书》）

  - word: 形
    type: 【动词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶表现;显露。
        sentences:
          - ancient: 往借，不与，归而形诸梦。（《黄生借书说》）
          - ancient: 愚者暗成事，智者睹未形，则王何疑焉。（《史记•赵世家》）
          - ancient: 【高考题例】恭俭温仁，未尝以喜愠形于颜色。（《旧唐书•于休烈传》）
      - trans: ❷对照;对比。
        sentences:
          - ancient: 长短相形，高下相倾。（《老子》二章）