形xing2
【名词】❶形体;身体。
【例句】鸟兽得之，形体肥大，羽毛丰茂。（《管子.水地》）丨或因寄所托，放浪形骸之外。（《兰亭集序》）丨既自以心为形役，奚惆怅而独悲？（《归去来兮辞》）
❷形状;形象。
【例句】视之，形若土狗（蝼蛄），梅花翅，方首长胫，意似良。（《促织》）丨形似酒尊，饰以篆文山龟鸟兽之形。（《张衡传》）
❸地形。
【例句】隘形者，我先居之，必盈之以待敌。（《孙子兵法•地形》）丨秦富十倍天下，地形彊。（《史记•高祖本纪》）
❹情形;情况。
【例句】今太子闻光壮盛之时，不知吾形已不逮也。（《史记•刺客列传》）
❺形势。
【例句】（曹）操军破，必北还;如此，则荆、吴之势强，鼎足之形成矣。（《资治通鉴•汉纪五十七》）丨由此言之，勇怯，势也;强弱，形也。（《报任安书》）
【动词】❶表现;显露。
【例句】往借，不与，归而形诸梦。（《黄生借书说》）丨愚者暗成事，智者睹未形，则王何疑焉。（《史记•赵世家》）
【高考题例】恭俭温仁，未尝以喜愠形于颜色。（《旧唐书•于休烈传》）
❷对照;对比。
【例句】长短相形，高下相倾。（《老子》二章）