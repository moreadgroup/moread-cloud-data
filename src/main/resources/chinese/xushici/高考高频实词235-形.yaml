---
words:
  - word: 形
    type: 【名词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶形体;身体。
        sentences:
          - ancient: 鸟兽得之，<形>体肥大，羽毛丰茂， 文理明著。（《管子.水地》）
            url: xxxx
            vernacular: 鸟兽得到水，形体就能肥大，羽毛就能丰满，毛色花纹鲜明而显著。
          - ancient: 或因寄所托，放浪<形>骸之外。（《兰亭集序》）
            url: xxxx
            vernacular: 有的人就着自己所爱好的事物，寄托情怀，放纵无羁地生活。
          - ancient: 既自以心为<形>役，奚惆怅而独悲？（《归去来兮辞》）
            url: xxxx
            vernacular: 既然自己使心为身所驱役，又何必怅惘而独自悲戚呢？
      - trans: ❷形状;形象。
        sentences:
          - ancient: 视之，<形>若土狗（蝼蛄），梅花翅，方首长胫，意似良。（《促织》）
            url: xxxx
            vernacular: 再仔细看它，形状像蝼蛄，梅花翅膀，方头长腿，觉得好像还不错。
          - ancient: <形>似酒尊，饰以篆文山龟鸟兽之形。（《张衡传》）
            url: xxxx
            vernacular: 样子像个大酒樽，外面用篆体文字和山、龟、鸟、兽的图案装饰。
      - trans: ❸地形。
        sentences:
          - ancient: 隘<形>者，我先居之，必盈之以待敌。（《孙子兵法•地形》）
            url: xxxx
            vernacular: 在“隘”形地域上，我们应该抢先占领，并用重兵封锁隘口，以等待敌人的到来
          - ancient: 秦富十倍天下，地<形>彊。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 秦地的富足是其它地区的十倍，地理形势又好。
      - trans: ❹情形;情况。
        sentences:
          - ancient: 今太子闻光壮盛之时，不知吾<形>已不逮也。（《史记•刺客列传》）
            url: xxxx
            vernacular: 如今太子听说过我壮年气盛的的情形，却不了解我现在的身体已经不能达到当时的状态了
      - trans: ❺形势。
        sentences:
          - ancient: （曹）操军破，必北还;如此，则荆、吴之势强，鼎足之<形>成矣。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 曹操的军队被打败了，一定退还北方去；这样荆州和吴国的势力就会增强，三分天下的局面就形成了。
          - ancient: 由此言之，勇怯，势也;强弱，<形>也。（《报任安书》）
            url: xxxx
            vernacular: 这样说来，勇敢与胆怯，看的是势气，强与弱，看的是形体。
  - word: 形
    type: 【动词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶表现;显露。
        sentences:
          - ancient: 往借，不与，归而<形>诸梦。（《黄生借书说》）
            url: xxxx
            vernacular: （我）到他家去借，（他）不借给我，回来以后我在梦中还出现向他借书的情形。
          - ancient: 愚者暗成事，智者睹未<形>，则王何疑焉。（《史记•赵世家》）
            url: xxxx
            vernacular: 愚蠢的人事情成功了他还不明白，聪明人在事情尚无迹象的时候就能看清，那末您还犹疑什么呢!
          - ancient: 【高考题例】恭俭温仁，未尝以喜愠<形>于颜色。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 为人恭俭温良仁慈，从未以喜怒形于颜色。
      - trans: ❷对照;对比。
        sentences:
          - ancient: 长短相<形>，高下相倾。（《老子》二章）
            url: xxxx
            vernacular: 长和短互相显现，高和下互相充实
