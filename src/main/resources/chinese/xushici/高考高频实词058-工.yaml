---
words:
  - word: 工
    type: 【名词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: ❶工匠。
        sentences:
          - ancient: 巫医乐师百工之人，不耻相师。（《师说》）
          - ancient: 自王公卿相以至工艺杂流，凡有名者，往往留像于馆。（清•薛福成《观巴黎油画记》）
          - ancient: 至坐前有尺帛，且令工以为冠。（《战国策•赵策三》）
      - trans: ❷特指乐官或乐人。
        sentences:
          - ancient: 他工辈以程艺天下无双,欲以动上意。（宋•王说《唐语林.政事下》）
          - ancient: 晋平公铸为大钟，使工听之，皆以为调矣。（《吕氏春秋•长见》）
      - trans: ❸官吏。
        sentences:
          - ancient: 论百工，审时事,辨功苦，尚完利,便备用，使雕琢文釆不敢专造于家,<工>师之事也。（《荀子•王制》）
          - ancient: 比周邪伪之徒不得即工。（《汉书•谷永传》）

  - word: 工
    type: 【动词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: 善于;擅长。
        sentences:
          - ancient: 工文学者非所用，用之则乱法。（《韩非子•五蠹》）
          - ancient: 固时俗之工巧兮，偭（mian3,违背）规矩而改错（同"措"，措置，处分）。（《离盛》）
          - ancient: 宋,怀庆青华镇人，工按击,七省好事者皆来学。（《大铁椎传》）
  - word: 工
    type: 【形容词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: 精致;精巧。
        sentences:
          - ancient: 纵豆蔻词工，青楼梦好，难赋深情。（宋•姜夔《扬州慢》）
          - ancient: 其实湖光染翠之工，山岚设色之妙，皆在朝日始出，夕春未下,始极其浓媚。（明•袁宏道《西湖》）
          - ancient: 然则非诗之能穷人，殆穷者而后工也。（《梅圣俞诗集序》）
