---
words:
  - word: 工
    type: 【名词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: ❶工匠。
        sentences:
          - ancient: 巫医乐师百<工>之人，不耻相师。（《师说》）
            url: xxxx
            vernacular: 巫医、乐师、各种工匠这些人，不以互相学习为耻。
          - ancient: 自王公卿相以至<工>艺杂流，凡有名者，往往留像于馆。（清•薛福成《观巴黎油画记》）
            url: xxxx
            vernacular: 从达官贵族以至工艺家和各行各业的人，凡是有名气的，每每在馆里留下蜡像。
          - ancient: 顾反至坐，前有尺帛，且令<工>以为冠。（《战国策•赵策三》）
            url: xxxx
            vernacular: 回来以后，坐到自己位置上，面前摆着一小块丝织物，准备让工匠用它做帽子。
      - trans: ❷特指乐官或乐人。
        sentences:
          - ancient: "他<工>辈以程艺天下无双,欲以动上意。（宋•王说《唐语林.政事下》）"
            url: xxxx
            vernacular: 其他乐工们因罗程的技艺天下无人能比，想要以此打动皇上的心意。
          - ancient: 晋平公铸为大钟，使<工>听之，皆以为调矣。（《吕氏春秋•长见》）
            url: xxxx
            vernacular: 晋平公叫人铸成了一口大钟，让乐工听听并评判钟的音调，乐工都认为合乎音调了。
      - trans: ❸官吏。
        sentences:
          - ancient: "论百工，审时事,辨功苦，尚完利,便备用，使雕琢文釆不敢专造于家,<工>师之事也。（《荀子•王制》）"
            url: xxxx
            vernacular: 考查各个工匠的手艺，审察各个时节的生产事宜，辨别产品质量的好坏，提倡产品的坚固好用，使设备用具便于使用，雕刻图案的器具与有彩色花纹的礼服不敢私家制造，这是工师的职事。
          - ancient: 比周邪伪之徒不得即<工>。（《汉书•谷永传》）
            url: xxxx
            vernacular: 对于那些像周邪一样虚假、伪善的人，不能让他们马上得逞。
  - word: 工
    type: 【动词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: 善于;擅长。
        sentences:
          - ancient: <工>文学者非所用，用之则乱法。（《韩非子•五蠹》）
            url: xxxx
            vernacular: 对于从事古代文献经典工作的人不应当加以任用，如果任用了，就会破坏法治。
          - ancient: "固时俗之<工>巧兮，偭（mian3,违背）规矩而改错（同\"措\"，措置，处分）。（《离盛》）"
            url: xxxx
            vernacular: 庸人本来善于投机取巧，背弃规矩而又改变政策。
          - ancient: "宋,怀庆青华镇人，<工>按击,七省好事者皆来学。（《大铁椎传》）"
            url: xxxx
            vernacular: 宋将军是怀庆青华镇人，擅长武术，七省爱好武术的人都来向他学习
  - word: 工
    type: 【形容词】
    phonetic: gong1
    tags:
      - 高中
    samples:
      - trans: 精致;精巧。
        sentences:
          - ancient: 纵豆蔻词<工>，青楼梦好，难赋深情。（宋•姜夔《扬州慢》）
            url: xxxx
            vernacular: 即使“豆蔻”词语再精妙，青楼美梦的诗意再好，也难抒写此刻深沉悲怆感情。
          - ancient: "其实湖光染翠之<工>，山岚设色之妙，皆在朝日始出，夕春未下,始极其浓媚。（明•袁宏道《西湖》）"
            url: xxxx
            vernacular: 其实湖光染翠之工巧，山岚设色之美妙，都在朝日初升，夕阳未下时，那时西湖才尽显浓艳和娇媚。
          - ancient: 然则非诗之能穷人，殆穷者而后<工>也。（《梅圣俞诗集序》）
            url: xxxx
            vernacular: 并不是写诗让人产生困窘，而是艰难的生活际遇让人的感情波动剧烈，从而创造出好的作品来。
