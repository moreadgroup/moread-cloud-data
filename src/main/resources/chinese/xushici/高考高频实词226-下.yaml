---
words:
  - word: 下
    type: 【名词】
    phonetic: xia4
    tags:
      - 高中
    samples:
      - trans: ❶位置低的;下面;下方（与"上"相对）。
        sentences:
          - ancient: 蚓无爪牙之利，筋骨之强，上食埃土，<下>饮黄泉，用心一也。（《劝学》）
            url: xxxx
            vernacular: 蚯蚓没有锐利的爪子和牙齿，强健的筋骨，却能向上吃到泥土，向下喝到地下的泉水，这是由于它用心专一。
          - ancient: "至莫（通\"暮\"）夜月明，独与迈乘小舟，至绝壁<下>。（《石钟山记》）"
            url: xxxx
            vernacular: 到了晚上月光明亮，特地和苏迈坐着小船到断壁下面。
      - trans: ❷时间、次序在后的（与"上""相对）。
        sentences:
          - ancient: "案贤圣之言，上<下>多相违;其文，前后多相伐者，世之学者，不能知也。（《论衡•问孔》）"
            url: xxxx
            vernacular: 查阅很多圣贤言辞，前后多有相互违背之处；他们的文章，前后多有相互矛盾之处，世间学者，却不能深研知晓。
      - trans: ❸等次低的。
        sentences:
          - ancient: 能谤议于市朝，闻寡人之耳者，受<下>赏。（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 能够在众人集聚的公共场所指责议论我的过失，并能传到我耳朵里的，得下等奖赏。
      - trans: ❹地位在下面的人。
        sentences:
          - ancient: 且相如素贱人，吾羞，不忍为之<下>！（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 况且蔺相如本来就出身卑贱，我感到羞耻，无法容忍在他的下面。
          - ancient: 上<下>交（俱，都）征（取）利而国危矣。（《孟子•梁惠王上》）•
            url: xxxx
            vernacular: 结果是上上下下互相争夺利益，国家就危险了啊！
  - word: 下
    type: 【动词】
    phonetic: xia4
    tags:
      - 高中
    samples:
      - trans: ❶降落;从高处落到低处。
        sentences:
          - ancient: <下>视其辙，登轼而望之，曰："可矣。"（《曹刿论战》）
            url: xxxx
            vernacular: 说完就向下看，查看齐军车轮碾出的痕迹，又登上战车，扶着轼远望齐军的队形，这才说：“可以追击了。”
          - ancient: 元济于城上请罪，进城梯而<下>之。（《资治通鉴•唐纪五十六》）
            url: xxxx
            vernacular: 元济在城上请求治罪，进诚用梯子引他下来。
          - ancient: 我腾跃而上，不过数仞而<下>，翱翔蓬蒿之间，此亦飞之至也。（《逍遥游》）
            url: xxxx
            vernacular: 我奋力起飞，不过几丈高就落下来，盘旋于蓬蒿丛中，这也是我飞翔的极限了。
          - ancient: 无边落木萧萧<下>，不尽长江滚滚来。（《登高》）
            url: xxxx
            vernacular: 无边无际的树木萧萧地飘下落叶，望不到头的长江水滚滚奔腾而来。
      - trans: ❷去；往。通常指由西往东，由北往南，由上游往下游。
        sentences:
          - ancient: 故人西辞黄鹤楼，烟花三月<下>扬州。（唐•李白《黄鹤楼送孟浩然之广陵》）
            url: xxxx
            vernacular: 老朋友在西面的黄鹤楼与我辞别，在三月份烟雾迷漫、繁花似锦的春天去扬州。
      - trans: ❸下达;发布。
        sentences:
          - ancient: 令初<下>，群臣进谏，门庭若市。（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 政令刚一下达，许多大臣都来进献谏言，宫门和庭院像集市一样热闹
          - ancient: 二世<下>诏，增始皇寝庙牺牲及山川百祀之礼，令群臣议尊始皇庙。（《史记•秦始皇本纪》）
            url: xxxx
            vernacular: 二世下诏，增加祭祀始皇陵寝和宗庙用的牲畜数量，提高对名山大川的祭祀等级，让群臣议论祭祀始皇的方法。
      - trans: ❹攻下;攻占。
        sentences:
          - ancient: "方其破荆州，<下>江陵，顺流而东也，舳舻千里，旌旗蔽空，酾（shi1）酒临江，横槊赋诗，固一世之雄也，而今安在哉？（《赤壁赋》）"
            url: xxxx
            vernacular: 当初他攻陷荆州，夺得江陵，沿长江顺流东下，麾下的战船延绵千里，旌旗将天空全都蔽住，在江边持酒而饮，横执矛槊吟诗作赋，委实是当世的一代枭雄，而今天又在哪里呢？
          - ancient: 吾攻赵旦暮且<下>，而诸侯敢救者，已拔赵，必移兵先击之。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 我们魏国攻击赵国，一天就将要拿下，但如果哪国敢帮助赵国，我们等攻下赵国后，立刻马上调兵在讨伐你
      - trans: ❺少于;低于。
        sentences:
          - ancient: 今农夫五口之家，其服役者不<下>二人，其能耕者不过百亩，百亩之收不过百石（容量单位，十斗为一石）。（汉•晁错《论贵粟疏》）
            url: xxxx
            vernacular: 现在农户中一家如果有五口人，当中去服徭役的，就有两个以上；能耕作的田地，却不超过一百亩；这一百亩地所能收的粮食，也没有超过一百石。
          - ancient: 豫州（指刘备）军虽败于长坂，今战士还者及关羽水军精甲万人，刘琦合江夏战士亦不<下>万人。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 刘豫州的军队虽然在长坂坡打了败仗，（但是）现在归队的士兵加上关羽率领的精锐水兵还有一万人，刘琦收拢江夏的战士也不也于一万人。
      - trans: ❻比不上；居于……之下。
        sentences:
          - ancient: 今之众人，其<下>圣人也亦远矣，而耻学于师。（《师说》）
            url: xxxx
            vernacular: 现在的一般人，他们（的才智）低于圣人很远，却以向老师学习为耻。
      - trans: ❼降低身份与人交往;谦恭待人。
        sentences:
          - ancient: "公子为人仁而<下>士，士无（无论）贤不肖皆谦而礼交之，不敢以其富贵骄士。（《史记•魏公子列传》）"
            url: xxxx
            vernacular: 公子的为人仁爱宽厚礼贤下士，士人无论有无才能或才能大小，他都谦恭有礼地同他们交往，从来不敢因为自己富贵而轻慢士人。
          - ancient: "市人皆以（认为）嬴为小人，而以公子为长者能<下>士也。（《史记・巍公子列传》）"
            url: xxxx
            vernacular: 街市上的人都以为我是小人，而认为公子是个高尚的人能礼贤下士啊。
          - ancient: 而亲贤<下>士，推毂后进，虽位崇年高，曾无倦色。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 而亲近贤才，屈身交接士人，荐举后辈，虽然位尊年高，一点倦怠的神色都没有。
      - trans: ⑧投降。
        sentences:
          - ancient: 项王已死，楚地皆降汉，独鲁不<下>。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 项王已死，楚地全都投降了汉王，只有鲁县不降服。
  - word: 下
    type: 【形容词】
    phonetic: xia4
    tags:
      - 高中
    samples:
      - trans: ❶低（与"高"相对）。
        sentences:
          - ancient: 此地势高<下>不同也。（《梦溪笔谈•药议》）
            url: xxxx
            vernacular: 这是由地势高下的不同引起的。
      - trans: ❷平庸的;低劣的。
        sentences:
          - ancient: 才<下>知浅，不能用大才也。（《论衡•逢遇》）
            url: xxxx
            vernacular: 而是他们才能低下智力浅薄，没有能力任用具有大德大智之才。
  - word: 下
    type: 【量词】
    phonetic: xia4
    tags:
      - 高中
    samples:
      - trans: 表示动作的次数。
        sentences:
          - ancient: 九月甲申，莽立载行视，亲举筑三<下>。《汉书•王莽传》
            url: xxxx
            vernacular: 立载行视：站在车上巡察。筑：筑土之槌。
