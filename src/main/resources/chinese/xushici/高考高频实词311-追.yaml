---
words:
  - word: 追
    type: 【动词】
    phonetic: zhui1
    tags:
      - 高中
    samples:
      - trans: ❶追赶;追击。
        sentences:
          - ancient: 秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。（《过秦论》）
          - ancient: 穷饿无聊，追购又急，天高地迥，号呼靡及。（《〈指南录〉后序》）
          - ancient: 曹操之众，远来疲敝，闻追豫州（刘备，任豫州牧），轻骑一日一夜行三百余里。（《资治痛鉴•汉纪五十七》）
      - trans: ❷跟随。
        sentences:
          - ancient: 背绳墨以追曲兮，竞周容以为度。（《离骚》）
      - trans: ❸追索。
        sentences:
          - ancient: 宰严限追比（官吏限定时间命令吏役办某事，越期要受杖责），旬条，妆至百。（《促织》）
      - trans: ❹追思;追念。
        sentences:
          - ancient: 然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇（恩遇），欲报之于陛下也。（《出师表》）
          - ancient: 此情可待成迫忆？只是当时已惘然。（唐•李商隐《锦瑟》）
      - trans: ❺弥补;挽救。
        sentences:
          - ancient: 悟已往之不谏，知来者之可追。（《归去来兮辞》）
          - ancient: 追尊庄襄王为太上皇。（《史记•秦始皇本纪》）
          - ancient: 【高考题例】太祖即吴王位，追封云东丘郡侯，立忠臣祠祀之。（《明史•花云传》）