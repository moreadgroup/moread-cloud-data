数㊀shu4
【名词】❶数目；数量。
【例句】愿令得补黑衣（指宫中卫士）之数，以卫王宫。（《触龙说赵太后》）丨夫以疲病之卒御狐疑之众，众数虽多，甚未足畏。（《资治通鉴•汉纪五十七》）
❷算术;数学。古代属六艺之一。
【例句】三曰六艺:礼、乐、射、御、书、数。（《周礼•地官•大司徒》）
❸命运;定数。
【例句】兴尽悲来,识盈虚（盈满和亏损，指兴衰贵贱）之有数。（《滕王阁序》）丨则胜负之数，存亡之理，当与秦相较,或未易量（判断）。（《六国论》）
❹技艺。特指术数（占卜、星相、算命等）。
【例句】使王良持辔，马无欲奔之心，御之有数也。（《论衡•非韩》）丨丘已习其曲矣，未得其数也。（《史记•孔子世家》）
❺权术;方略。
【例句】故为国之数，务在垦草。（《商君书•算地》）
❻规律;法则。
【例句】天有常道矣，地有常数矣，君子有常体矣。（《荀子.天论》）

【数词】几;几个。
【例句】每一字皆有数印，如"之""也"等字,每字有二十余印，以备一板内有重复者。（《梦溪笔谈•技艺》）丨媒人去数日，寻遣丞请还，说有兰家女，承籍有宦官。（《孔雀东南飞》）丨百亩之田，勿夺其时，数口之家可以无饥矣。（《寡人之于国也》）丨屠暴（突然）起，以刀劈狼首，又数刀毙之。（《狼》）
【高考题例】鼎至,奏罢不职有司数十辈，列部肃清。（《明史•熊鼎传》）	：
数㊁shu3
【动词】❶计算;查点。
【例句】今操得荆州，奄（覆盖，包括）有其地，刘表治水军,蒙冲斗舰乃以千数。（《资治通鉴•汉纪五十七》）丨虞人导前，鹰犬罗后，捷禽鸷（zhi4,凶猛的鸟）兽应弦而倒者，不可胜数。（《中山狼传》）丨诸侯奔走不得保其社稷者不可胜数。（《史记•太史公自序》）
【高考题例】令行于民期年，秦民之国都言初令之不便者以千数。（《史记•商君列传》）
❷历成;列基（好的事情）。、
【高考题例】后三十年，契丹萧太师与灌会，道曩事，数何巡检神射。（《宋史•何灌传》）
❸列举罪状加以责备。
【例句】予自度不得脱，则直前诟（gou4,辱骂）虏帅失信，数吕师孟叔侄为逆。（《〈指南录〉后序》）
数㊂shuo4
【形容词】过多;超过常度。
【例句】祭不欲数，数则烦。（《礼记•祭义》）丨宫门令欲缚之。自辩数，乃置。（《陈涉世家》）

【副词】多次;屡次。
【例句】扶苏以数谏故，上使外将兵。（《陈涉世家》）丨范增数目（使眼色）项王。（《鸿门宴》）丨吾数击杀响马贼，夺其物，故仇我。（《大铁椎传》）
【高考题例】贾生数（多次）上疏,言诸侯或连数（几个）郡,非古之制，可稍削之。（《史记•屈原贾生而传》）

数cu4
【形容词】细密。
【例句】数罟（gu3,网）不入湾池，鱼鳖不可胜食也。（《寡人之于国也》）丨妇人疏字（生育）者子活，数乳（生育）者子死。（《论衡•气寿》）
		