---
words:
  - word: 庶
    type: 【名词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: ❶平民;百姓。
        sentences:
          - ancient: 将军魏武之子孙，于今为庶为清门。（唐•杜甫《丹青引赠曹将军霸》）
          - ancient: 令益予众庶稻，可种卑湿。（《史记•夏本纪》）
          - ancient: 而右将军独下吏，当死，赎为庶人。（《史记•李将军列传》）
          - ancient: 【高考题例】涣丧（灵柩）西归，道经弘农,民庶皆设盘案于路。（《后汉书•王涣传》）


      - trans: ❷非正妻所生之子;家族的旁支（与""嫡"相对）。
        sentences:
          - ancient: 仲为不道，杀适（通"嫡"）立庶。（《左传•文公十八年》）

  - word: 庶
    type: 【形容词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: 众;多。
        sentences:
          - ancient: 寒暑不吋（合乎季节），以伤庶物。（《庄子•渔父》）
          - ancient: 庶草茂则禽兽归之。（《吕氏春秋•功名》）

  - word: 庶
    type: 【副词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: ❶表示可能。或许;差不多。
        sentences:
          - ancient: 君姑修政而亲兄弟之国，庶免于难。（《左传・桓公六年》）
          - ancient: 中兴机会，庶几在此。（《〈指南录〉后序》）
          - ancient: 【高考题例】金人虽不吾索，吾当与之俱行，求见二酋面责之，庶或万一可济。（《宋史•孙傅传》）
      - trans: ❷表示希望。但愿。
        sentences:
          - ancient: 当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。（《出师表》）
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）