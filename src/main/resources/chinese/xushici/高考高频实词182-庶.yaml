---
words:
  - word: 庶
    type: 【名词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: ❶平民;百姓。
        sentences:
          - ancient: 将军魏武之子孙，于今为<庶>为清门。（唐•杜甫《丹青引赠曹将军霸》）
            url: xxxx
            vernacular: 曹将军是魏武帝曹操后代子孙，而今却沦为平民百姓成为寒门。
          - ancient: 令益予众<庶>稻，可种卑湿。（《史记•夏本纪》）
            url: xxxx
            vernacular: 他叫伯益发放稻种，教导群众在低洼潮湿的地方种植
          - ancient: 而右将军独下吏，当死，赎为<庶>人。（《史记•李将军列传》）
            url: xxxx
            vernacular: 右将军赵食其独自被送交执法官审处，当死，经纳粟赎罪，成为平民。意思是说，本该被处死，后被赎罪贬为平民百姓。
          - ancient: 【高考题例】涣丧（灵柩）西归，道经弘农，民<庶>皆设盘案于路。（《后汉书•王涣传》）
            url: xxxx
            vernacular: 王涣的灵枢向西运回家乡，路过弘农县，老百姓都在路旁摆设盘、碗加以祭奠。
      - trans: ❷非正妻所生之子;家族的旁支（与""嫡"相对）。
        sentences:
          - ancient: 仲为不道，杀适（通"嫡"）立<庶>。（《左传•文公十八年》）
            url: xxxx
            vernacular: 襄仲无道，杀死了嫡子立庶子。
  - word: 庶
    type: 【形容词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: 众;多。
        sentences:
          - ancient: 寒暑不时（合乎季节），以伤<庶>物。（《庄子•渔父》）
            url: xxxx
            vernacular: 寒暑变化不合时令，以致伤害万物的生长
          - ancient: <庶>草茂则禽兽归之，人主贤则豪桀归之。（《吕氏春秋•功名》）
            url: xxxx
            vernacular: 杂草茂密，那么禽兽就会奔向那里；君主贤明，那么豪杰就会投奔到他那里。
  - word: 庶
    type: 【副词】
    phonetic: shu4
    tags:
      - 高中
    samples:
      - trans: ❶表示可能。或许;差不多。
        sentences:
          - ancient: 君姑修政而亲兄弟之国，<庶>免于难。（《左传・桓公六年》）
            url: xxxx
            vernacular: 您还是先整顿内政，和周围兄弟之国亲密友好，也许可以避免灾祸吧。
          - ancient: 中兴机会，<庶>几在此。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 复兴宋朝的机会，大概就在此一举了。
          - ancient: 【高考题例】金人虽不吾索，吾当与之俱行，求见二酋面责之，<庶>或万一可济。（《宋史•孙傅传》）
            url: xxxx
            vernacular: 金人虽然不索取我本人，我也应当跟太子一起去，求见两位酋长当面谴责我们，或者还有可能把事情办好。
      - trans: ❷表示希望。但愿。
        sentences:
          - ancient: 当奖率三军，北定中原，<庶>竭驽钝，攘除奸凶，兴复汉室，还于旧都。（《出师表》）
            url: xxxx
            vernacular: 应当激励、率领全军将士向北方进军，平定中原，希望用尽我平庸的才能，铲除奸邪凶恶的敌人，恢复汉朝的基业，回到旧日的国都。
          - ancient: 愿陛下矜悯愚诚，听臣微志，<庶>刘侥幸，保卒余年。（《陈情表》）
            url: xxxx
            vernacular: 希望陛下能怜悯我愚昧诚心，满足我微不足道的心愿，使祖母刘氏能够侥幸保全她的余生。
