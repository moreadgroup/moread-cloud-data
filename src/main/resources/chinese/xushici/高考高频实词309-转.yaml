转zhuan3
【动词】❶转动;运转。
【例句】我心匪（不是）石，不可转也。（《诗经•邶风•柏舟》）丨楚汉久相持未决，丁壮苦军旅，老弱罢（通"疲"）转漕（车运为转,船运为漕）。（《史记.项羽本纪》）丨转轴拔弦三两声，未成曲调先有情。（《琵琶行》）丨飞湍瀑流争喧豗,砯（ping1,水击山崖声）崖转石万壑雷。（《蜀道难》）
❷转弯。
【例句】峰回路转。（《醉翁亭记》）
❸迁徙;转移。
【例句】号呼而转徙，饥渴而顿（困顿）踣（bo2,跌倒）。（《捕蛇者说》）丨展转四明、天台，故至于永嘉。（《〈指南录〉后序》）
❹转向;转变。
【例句】率疲弊之卒，将数百之众，转而攻秦。（《过秦论》）丨感我此言良久立，却坐促弦弦转急。（《琵琶行》）
❺传送;运送。
【例句】转送其家。（《汉书•高帝纪》）
❻调任（职务）。
【例句】密有才能，常望内转，而朝廷无援，及迁汉中太守。（《晋书•李密传》）丨顺帝初，再转复为太史令。（《张衡传》）
❼声调婉转。
【例句】蝉则千转不穷，猿则百叫无绝。（《与朱元思书》）
