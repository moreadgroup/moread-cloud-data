---
words:
  - word: 其
    type: 【代词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶人称代词。多用于第三人称代词，他（她、它）的，他（她、它）们的;和他（她、它），他（她、它）们。有时也用于第—人称，自己，我的;或第二人称，你的。
        sentences:
          - ancient: 今者项庄拔剑舞，其（他的）意常在沛公（指刘邦）也。（《鸿门宴》）
          - ancient: 其（他）闻道也固先乎吾，吾从而师之。（《师说》）
          - ancient: 而余亦悔其（自己）随之而不得极夫游之乐也。（《游褒禅山记》）
          - ancient: 瑜曰："有军任，不可得委署;倘能屈威，诚副其（我的）所望。"（《资治通鉴•汉纪五十七》）
          - ancient: 老臣以媪为长安君计短也，故以为其（你的）爱不若燕后。（《战国策•赵策四》）
          - ancient: 北冥有鱼，其名为鲲。（《逍遥游》）
          - ancient: 风之积也不厚，则其负大翼也无力。（《逍遥游》）
          - ancient: 【高考题例】苏轼尝从容责公亮不能救正，世讥其持禄固宠云。（《宋史•曾公亮传》）
      - trans: ❷指示代词。相当于"那""那些"。
        sentences:
          - ancient: 有蒋氏者，专其利三世矣。（《捕蛇者说》）
          - ancient: 以其境过清，不可久居，乃记之而去。（《小石潭记》）
          - ancient: 盖将自其变者而观之，则天地曾不能以一瞬。（《赤壁赋》）
          - ancient: 其间旦暮闻何物？杜鹃啼血猿哀鸣。（《琵琶行》）
          - ancient: 【高考题例】圣人苟可以强国，不法其故;苟可以利民，不循其礼。（《史记•商君列传》）
      - trans: ❸指示代词。相当于"其中的"。
        sentences:
          - ancient: 于乱石间择其一二扣之。（《石钟山记》）
          - ancient: 其一犬坐（像犬一样蹲坐）于前。（《狼》）
          - ancient: 虞常等七十余人欲发，其—人夜亡，告之。（《苏武传》）
  - word: 其
    type: 【副词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶表示推测、估计。恐怕;大概。
        sentences:
          - ancient: 其真不知马也！（《马说》）
          - ancient: 圣人之所以为圣，愚人之所以为愚，其皆出于此乎？（《师说》） 
          - ancient: 【高考题例】兼而有者，其吾友杨君乎？（《白蘋州五亭记》）
      - trans: ❷表示祈使。一定。
        sentences:
          - ancient: 以乱易整，不武。吾其还也。（《烛之武退秦师》）
          - ancient: 此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！（《伶官传序》） 
          - ancient: 【高考题例】近时职轻，故用卿以重此官，其毋辞！（《新唐书•韦凑传》）
      - trans: ❸表示反诘。岂;难道。
        sentences:
          - ancient: 呜呼！其真无马邪？（《马说》）
          - ancient: 尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？（《游褒禅山记》）
  - word: 其
    type: 【连词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶表示假设。假如；如果。
        sentences:
          - ancient: 其极刑，曰:"顺我，即先刺心;否则，四肢解尽，心犹不死。”（《狱中杂记》）
          - ancient: 其业有不精，德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？（《送东阳马生序》）
      - trans: ❷表示选择。或者;还是。
        sentences:
          - ancient: 将比（比照）今之诸侯而诛之乎？其教之不改而后诛之乎？（《孟子•万章下》）
          - ancient: 天之苍苍，其正色邪？其远而无所至极邪？（《逍遥游》）
          - ancient: 呜呼！其信然邪？其梦邪？其传之非其真邪？（《祭十二郎文》）
      - trans: ❸表示让步。尚且。
        sentences:
          - ancient: 天其弗识，人胡能觉？（《列子•力命》）
  - word: 其
    type: 【助词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶用于【形容词】后。相当于"然"。
        sentences:
          - ancient: 溱zhēn与洧wěi，浏其清矣。（《诗经•郑风•溱洧》）
          - ancient: 路漫漫其修远兮，吾将上下而求索。（《离骚》）
      - trans: ❷用在单音节【形容词】或拟声词之前，起调整音节的作用。
        sentences:
          - ancient: 北风其凉，雨雪其雰。（《诗经•邯风•北风》）            
