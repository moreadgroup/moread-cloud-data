---
words:
  - word: 其
    type: 【代词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶人称代词。多用于第三人称代词，他（她、它）的，他（她、它）们的;和他（她、它），他（她、它）们。有时也用于第—人称，自己，我的;或第二人称，你的。
        sentences:
          - ancient: 今者项庄拔剑舞，<其>（他的）意常在沛公（指刘邦）也。（《鸿门宴》）
            url: xxxx
            vernacular: 现在项庄拔剑起舞，他的意图常在沛公身上啊！
          - ancient: <其>（他）闻道也固先乎吾，吾从而师之。（《师说》）
            url: xxxx
            vernacular: 他懂得道理本来就早于我，我（应该）跟从（他）把他当作老师
          - ancient: 而余亦悔<其>（自己）随之而不得极夫游之乐也。（《游褒禅山记》）
            url: xxxx
            vernacular: 我也后悔跟他出来，而未能极尽游洞的乐趣。
          - ancient: 瑜曰："有军任，不可得委署;倘能屈威，诚副<其>（我的）所望。"（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 我有军事任命,不可以接受你的委派,如果能杀杀他的威风,就对得起你的期望了
          - ancient: 老臣以媪为长安君计短也，故以为<其>（你的）爱不若燕后。（《战国策•赵策四》）
            url: xxxx
            vernacular: 老臣认为太后为长安君考虑得太短浅了,所以认为你爱他不如爱燕后（深）。
          - ancient: 北冥有鱼，<其>名为鲲。（《逍遥游》）
            url: xxxx
            vernacular: 北方的海里有一条大鱼，名字叫鲲。
          - ancient: 风之积也不厚，则<其>负大翼也无力。（《逍遥游》）
            url: xxxx
            vernacular: 风聚积的力量不雄厚，它便无法托负巨大的翅膀。
          - ancient: 【高考题例】苏轼尝从容责公亮不能救正，世讥<其>持禄固宠云。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 苏轼曾经严肃地责备曾公亮不能救正补弊，世人都讥讽他只知道维持自己俸禄，巩固受到的宠幸。
      - trans: ❷指示代词。相当于"那""那些"。
        sentences:
          - ancient: 有蒋氏者，专<其>利三世矣。（《捕蛇者说》）
            url: xxxx
            vernacular: 有个姓蒋的人家，享有这种（捕蛇而不纳税的）好处已经三代了。
          - ancient: 以<其>境过清，不可久居，乃记之而去。（《小石潭记》）
            url: xxxx
            vernacular: 因为这里的环境太凄清，不可长久停留，于是记下了这里的情景就离开了。
          - ancient: 盖将自<其>变者而观之，则天地曾不能以一瞬。（《赤壁赋》）
            url: xxxx
            vernacular: 可见，从事物易变的一面看来，天地间没有一瞬间不发生变化
          - ancient: <其>间旦暮闻何物？杜鹃啼血猿哀鸣。（《琵琶行》）
            url: xxxx
            vernacular: 在这里早晚能听到的是什么呢？尽是杜鹃猿猴那些悲凄的哀鸣。
          - ancient: 【高考题例】圣人苟可以强国，不法<其>故;苟可以利民，不循<其>礼。（《史记•商君列传》）
            url: xxxx
            vernacular: 如果能使国家强盛,圣人们就不会效法旧制;如果能对人民有利,就不必遵循旧礼。
      - trans: ❸指示代词。相当于"其中的"。
        sentences:
          - ancient: 于乱石间择<其>一二扣之。（《石钟山记》）
            url: xxxx
            vernacular: 乱石中间选一两处敲打它
          - ancient: <其>一犬坐（像犬一样蹲坐）于前。（《狼》）
            url: xxxx
            vernacular: 其中一只狼像狗一样蹲坐在前面。
          - ancient: 虞常等七十余人欲发，<其>—人夜亡，告之。（《苏武传》）
            url: xxxx
            vernacular: 虞常等七十余人将要起事，其中一人夜晚逃走，告发了这件事。
  - word: 其
    type: 【副词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶表示推测、估计。恐怕;大概。
        sentences:
          - ancient: <其>真不知马也！（《马说》）
            url: xxxx
            vernacular: 大概是真的不认识千里马吧！
          - ancient: 圣人之所以为圣，愚人之所以为愚，<其>皆出于此乎？（《师说》）
            url: xxxx
            vernacular: 圣人之所以能成为圣人，愚人之所以能成为愚人，大概都出于这吧？
          - ancient: 【高考题例】兼而有者，<其>吾友杨君乎？（《白蘋州五亭记》）
            url: xxxx
            vernacular: 同时具备的,大概只有我的朋友杨君吧。
      - trans: ❷表示祈使。一定。
        sentences:
          - ancient: 以乱易整，不武。吾<其>还也。（《烛之武退秦师》）
            url: xxxx
            vernacular: 利用混乱去改变已有的协调，这并不是威风。我们还是回去吧！
          - ancient: 此三者，吾遗恨也。与尔三矢，尔<其>无忘乃父之志！（《伶官传序》）
            url: https://so.gushiwen.cn/mingju/juv_6d6fdfebbed9.aspx
            vernacular: 这三件事是我的遗恨。交给你三支箭，你不要忘记你父亲报仇的志向。
          - ancient: 【高考题例】近时职轻，故用卿以重此官，<其>毋辞！（《新唐书•韦凑传》）
            url: xxxx
            vernacular: 近期职权较轻，所以任用你来加重这一官位，还是不要推辞吧！
      - trans: ❸表示反诘。岂;难道。
        sentences:
          - ancient: 呜呼！<其>真无马邪？（《马说》）
            url: xxxx
            vernacular: 唉！难道果真没有千里马吗？
          - ancient: 尽吾志也而不能至者，可以无悔矣，<其>孰能讥之乎？（《游褒禅山记》）
            url: xxxx
            vernacular: 尽了自己的主观努力而未能达到，便可以无所悔恨，这难道谁还能讥笑吗？
  - word: 其
    type: 【连词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶表示假设。假如；如果。
        sentences:
          - ancient: <其>极刑，曰:"顺我，即先刺心;否则，四肢解尽，心犹不死。”（《狱中杂记》）
            url: xxxx
            vernacular: 如果判的是剐刑，便说：“答应了我的条件，便先刺心；不然的话，四肢解完，心还没死。”
          - ancient: <其>业有不精，德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？（《送东阳马生序》）
            url: xxxx
            vernacular: 他们中如果学业有所不精通，品德有所未养成的，如果不是天赋、资质低下，就是⽤⼼不如我这样专⼀，难道可以说是别⼈的过错吗！
      - trans: ❷表示选择。或者;还是。
        sentences:
          - ancient: 子以为有王者作，将比（比照）今之诸侯而诛之乎？<其>教之不改而后诛之乎？（《孟子•万章下》）
            url: xxxx
            vernacular: 你以为有圣王兴起，就会对现在的诸侯们一律加以诛杀吗？还是经过教育仍不悔改再去诛杀？
          - ancient: 天之苍苍，<其>正色邪？<其>远而无所至极邪？（《逍遥游》）
            url: xxxx
            vernacular: 天空是那么湛蓝湛蓝的，难道就是它真正的颜色吗？还是因为天空高远而看不到尽头呢？
          - ancient: 呜呼！其信然邪？<其>梦邪？<其>传之非其真邪？（《祭十二郎文》）
            url: xxxx
            vernacular: 唉!是真的这样呢?还是在做梦呢?还是这传来的消息不可靠呢?
      - trans: ❸表示让步。尚且。
        sentences:
          - ancient: 天<其>弗识，人胡能觉？（《列子•力命》）
            url: xxxx
            vernacular: 天尚且不认识，人又怎么能明白？
  - word: 其
    type: 【助词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶用于【形容词】后。相当于"然"。
        sentences:
          - ancient: 溱zhēn与洧wěi，浏<其>清矣。（《诗经•郑风•溱洧》）
            url: xxxx
            vernacular: 溱水洧水长又长，河水洋洋真清亮。
          - ancient: 路漫漫<其>修远兮，吾将上下而求索。（《离骚》）
            url: xxxx
            vernacular: 前面的道路啊又远又长，我将上上下下追求理想。
      - trans: ❷用在单音节【形容词】或拟声词之前，起调整音节的作用。
        sentences:
          - ancient: 北风<其>凉，雨雪<其>雰。（《诗经•邯风•北风》）
            url: https://so.gushiwen.cn/mingju/juv_b0824595b307.aspx
            vernacular: 北风刮来冰样凉，大雪漫天白茫茫。
