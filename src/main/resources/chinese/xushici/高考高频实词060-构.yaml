---
words:
  - word: 构
    type: 【动词】
    phonetic: gou4
    tags:
      - 高中
    samples:
      - trans: ❶架。
        sentences:
          - ancient: 构木为巢，以避群害。（《韩非子•五蠹》）
          - ancient: 筑土构木以为宫室。（《淮南子.氾论训D）
          - ancient: 骊山北构而西折，直走（趋向）咸阳。（《阿房宫赋》）
      - trans: ❷连接;交会。 ❸结成;造成。
        sentences:
          - ancient: 抑（还是）王兴（发动）甲兵（战争），危士臣，构怨于诸侯，然后快于心与方（《齐桓晋文之事》）
      - trans: ❹谋划。
        sentences:
          - ancient: 纣醢（hai3，将人剁成肉酱的酷刑）梅伯，文王与诸侯构之。（《淮南子•说林训》）
          - ancient: 【高考题例】值禄山构难，肃宗践祚，休烈迁太常少卿，知礼仪事，兼修国史。（《旧唐书•于休烈传》）
          - ancient: 【高考题例】及宇文化及构逆，深忌之。（《北史•来护儿传》）
          - ancient: 【高考题例】惧其重入，遂密令直省至諲管内构求諲过失。（《旧唐书•李揆传》）	：
      - trans: ❺挑拨。
        sentences:
          - ancient: 彼实（的确）构吾二君。寡君若得而食之，不厌（满足），君何辱（相当于屈尊）讨焉？（《左传•僖公三十三年》）
          - ancient: 不幸吕师孟构恶于前，贾余庆献谄于后，予羁縻不得还，国事遂不可收拾。（《〈指南录〉后序》）
