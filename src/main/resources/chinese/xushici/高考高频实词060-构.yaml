---
words:
  - word: 构
    type: 【动词】
    phonetic: gou4
    tags:
      - 高中
    samples:
      - trans: ❶架。
        sentences:
          - ancient: <构>木为巢，以避群害。（《韩非子•五蠹》）
            url: xxxx
            vernacular: 在树上搭窝棚的办法，用来避免遭到各种伤害
          - ancient: 筑土<构>木以为宫室。（《淮南子.氾论训D）
            url: xxxx
            vernacular: 垒土架木，筑成屋舍
          - ancient: 骊山北<构>而西折，直走（趋向）咸阳。（《阿房宫赋》）
            url: xxxx
            vernacular: 它从骊山北边建起，折而向西，一直通到咸阳。
      - trans: ❷连接;交会。 ❸结成;造成。
        sentences:
          - ancient: 抑（还是）王兴（发动）甲兵（战争），危士臣，<构>怨于诸侯，然后快于心与?（《齐桓晋文之事》）
            url: xxxx
            vernacular: 还是说大王您(齐宣王)发动战争,使将士冒着生命的危险,与各诸侯国结怨,这样心里才痛快么?
      - trans: ❹谋划。
        sentences:
          - ancient: 纣醢（hai3，将人剁成肉酱的酷刑）梅伯，文王与诸侯<构>之。（《淮南子•说林训》）
            url: xxxx
            vernacular: 纣王把梅伯剁成肉酱，周文王就和诸侯计划要推翻纣王统治
          - ancient: 【高考题例】值禄山<构>难，肃宗践祚，休烈迁太常少卿，知礼仪事，兼修国史。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 正值安禄山叛乱,肃宗即位，改任太常少卿，掌管礼仪事务，兼修国史。
          - ancient: 【高考题例】及宇文化及<构>逆，深忌之。（《北史•来护儿传》）
            url: xxxx
            vernacular: 到宇文化及发动叛乱,十分忌恨来护儿。
          - ancient: 【高考题例】惧其重入，遂密令直省至諲管内<构>求諲过失。（《旧唐书•李揆传》）
            url: xxxx
            vernacular: 李揆惧怕他再入朝当宰相,于是密令直省机构到吕諲所属的地方捏造吕的过失。
      - trans: ❺挑拨。
        sentences:
          - ancient: 彼实（的确）<构>吾二君。寡君若得而食之，不厌（满足），君何辱（相当于屈尊）讨焉？（《左传•僖公三十三年》）
            url: xxxx
            vernacular: 他们的确是离间了我们秦晋两国国君的关系，秦穆公如果得到这三个人，就是吃了他们的肉都不解恨，何劳您去惩罚他们呢？
          - ancient: 不幸吕师孟<构>恶于前，贾余庆献谄于后，予羁縻不得还，国事遂不可收拾。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 可不幸的是，吕师孟早就同我结怨，先在元人面前说我坏话，贾余庆又紧跟着媚敌献计，于是我被拘留不能回国，国事就不可收拾了。
