---
words:
  - word: 适
    type: 【动词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶到;往。
        sentences:
          - ancient: 适莽苍者，三餐而反，腹犹果然（饱饱的样子）。（《逍遥游》）
          - ancient: 余自齐安舟行适临汝。（《右钟山记》）
          - ancient: 【高考题例】云海相望寄此身，那因远适更沾巾。（宋•苏轼《送子由使契丹》）
      - trans: ❷出嫁。
        sentences:
          - ancient: 贫贱有此女，始适还家门。（《孔雀东南飞》）
          - ancient: 诸葛恢大女<适>太尉庾亮儿，次女<适>徐州刺史羊忱儿。（《世说新语•方正》）
      - trans: ❸适应;顺从。	适
        sentences:
          - ancient: 处分适兄意，那得自任专！（《孔雀东南飞》）
          - ancient: 是芙蕖（荷花的别称）也者，无一时一刻不适耳目之观。（《芙蕖》）
          - ancient: 少无适俗韵，性本爱丘山。（《归园田居》）
          - ancient: 太子日造门下，供太牢具，异物间进，车骑美女恣荆轲所欲，以顺适其意。（《史记•刺客列传》）
      - trans: ❹满足。
        sentences:
          - ancient: 秦王贪狠暴虐，残贼天下，穷困万民，以适其欲也。 （《汉书•贾山传》）
      - trans: ❺享受；享有。
        sentences:
          - ancient: 是造物者之无尽藏也，而吾与子之所共适。（《赤壁赋》）

  - word: 适
    type: 【形容词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: 舒适。
        sentences:
          - ancient: 向晚意不适，驱车登古原。（唐•李商隐《登乐游原》）

  - word: 适
    type: 【副词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶恰好；正巧。
        sentences:
          - ancient: 此时鲁仲连适游赵，会秦围赵。（《战国策•赵策三》）
          - ancient: 自下望之则高岩峭壁，从上观之适与地平。（《梦溪笔谈•杂志一》）
          - ancient: 今虽欲自雕琢，曼辞以自饰，无益，于俗不信，适足取辱耳。（《报任安书》）
          - ancient: 【高考题例】吏部请如雍言，不报。而珪适卒，年五十七。（《明史•傅珪传》）
      - trans: ❷偶然。
        sentences:
          - ancient: <适>来，夫子时也；<适>去，夫子顺也。（《庄子♦养生主》）
      - trans: ❸刚刚;才。
        sentences:
          - ancient: 陛下之臣虽有悍如冯敬者，适启其口，匕首已陷其匈（胸）矣。（《汉书•贾谊传》）
          - ancient: 适得府君书，明日来迎汝。（，《孔雀东南飞》）