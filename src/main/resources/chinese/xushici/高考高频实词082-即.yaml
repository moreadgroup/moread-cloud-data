---
words:
  - word: 即
    type: 【动词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶靠近;接近。
        sentences:
          - ancient: 夜半，童自转，以缚<即>炉火烧绝之，虽疮手勿惮。（《童区寄传》）
            url: xxxx
            vernacular: 到了半夜，区寄自己转过身来，把捆绑的绳子就着炉火烧断了，虽然烧伤了手也不怕
          - ancient: 白云在青天，可望不可<即>。（明•刘基《登卧龙山写怀二十八韵》）
            url: xxxx
            vernacular: 可以望到但无法接近
          - ancient: 氓之蚩蚩，抱布贸丝。匪来贸丝，来<即>我谋。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 那个人老实忠厚，怀抱布匹来换丝。
      - trans: ❷依着。
        sentences:
          - ancient: 鹤汀（ting1，水边平地）凫渚（zhu3，水中小洲），穷岛屿之萦回;桂殿兰宫，<即>冈峦之体势。（《滕王阁序》）
            url: xxxx
            vernacular: 白鹤，野鸭停息的小洲，极尽岛屿的纡曲回环之势，雅浩的宫殿，跟起伏的山峦配合有致。
      - trans: ❸登上（帝王之位）。
        sentences:
          - ancient: 高皇帝以明圣威武<即>天子位。（汉•贾谊《陈政事疏》）
            url: xxxx
            vernacular: 高祖凭着他的明智威武，即位做了天子。登上（帝王之位）
          - ancient: 昭帝<即>位，数年，匈奴与汉和亲。（《苏武传》）
            url: xxxx
            vernacular: 汉昭帝登位，几年后，匈奴和汉达成和议。
  - word: 即
    type: 【副词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶就;立即。
        sentences:
          - ancient: <即>使吏卒共抱大巫妪投之河中。（汉•褚少孙《西门豹治邺》）
            url: xxxx
            vernacular: 就叫差役们一齐抱起大巫婆，把她抛到河中。
          - ancient: 赵奢许诺，<即>发万人趋之。（《史记•廉颇蔺相如列传》）
            url: xxxx
            vernacular: 赵奢同意，立即派出一万人迅速奔上北面山头。
          - ancient: 哙<即>带剑拥盾入军门。（《鸿门宴》）
            url: xxxx
            vernacular: 于是樊哙拿着剑，持着盾牌，冲入军门。
          - ancient: 郡之贤士大夫请于当道，<即>除逆阉废祠之址以葬之。（《五人墓碑记》）
            url: xxxx
            vernacular: 本郡有声望的士大夫们向有关当局请求，就清理已被废除的魏忠贤生祠旧址来安葬他们
      - trans: ❷就是。
        sentences:
          - ancient: 充<即>庐江人，所闻异于此。（《世说新语•方正》）
            url: xxxx
            vernacular: 我何充就是庐江郡的人，我所听到的跟你所说的不一样。
          - ancient: <即>今之傫然（傫lei3，聚集的样子）在墓者也。（《五人墓碑记》）
            url: xxxx
            vernacular: 就是现在一起埋葬在墓中的这五个人。
  - word: 即
    type: 【连词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶如果;假如。
        sentences:
          - ancient: <即>不幸有方二三千里之旱，国胡以相恤？（《论积贮疏》）
            url: xxxx
            vernacular: 假如不幸有纵横二三千里地方的大旱灾，国家用什么去救济灾区？
          - ancient: 君<即>百岁（"死""的婉辞）后，谁可代君？（《汉书•萧何传》）
            url: xxxx
            vernacular: 您一旦死了，谁能替代您呢？
          - ancient: 左伊秩訾曰："<即>谋单于，何以复加？宜皆降之。"（《苏武传》）
            url: xxxx
            vernacular: 左伊秩訾说：“假如是谋杀单于，又该用什么更严的刑法呢？应当都叫他们投降。”
          - ancient: 优旃曰："我<即>呼汝，汝疾应曰诺。"（《史记.滑稽列传》）
            url: xxxx
            vernacular: 优旃说：“如果我叫你们，你们要很快地答应我。”
          - ancient: 程婴曰："朔之妇有遗腹，若幸而男，吾奉之;<即>女也，吾徐死耳。"（《史记•赵世家》）
            url: xxxx
            vernacular: 程婴说：“赵朔的妻子有身孕，如果幸运的生了男孩，我就养活他；如果是女孩，我再安心死去。”
          - ancient: 【高考题例】王<即>不听用鞅，必杀之，无令出境。（《史记•商君:列传》）
            url: xxxx
            vernacular: 大王假如不任用公孙鞅，就一定要杀掉他，不要让他走出国境。
      - trans: ❷即使。
        sentences:
          - ancient: 公子<即>合符，而晋鄙不授公子兵，而复请之，事必危矣。臣客屠者朱亥可与俱，此人力士。（《史记・魏公子列传》）
            url: xxxx
            vernacular: 公子到那里即使两符相合，验明无误，可是晋鄙仍不交给公子兵权反而再请示魏王，那么事情就危险了。我的朋友屠夫朱亥可以跟您一起前往，这个人是个大力士。
          - ancient: <即>捕得三两头，又劣弱不中于款（规格）。（《促织》）
            url: xxxx
            vernacular: 即使捕捉到二、三只，也是又弱又小不符合规格。
          - ancient: 【高考题例】不但惠安遭其虐焰，<即>中宫与太后家亦谨避其锋矣。（《明史•陈登云传》）
            url: xxxx
            vernacular: 不仅惠安被他（指朱瞻基）的暴行所伤害，即使中宫和太后的家族也小心避免受到他的攻击或伤害。
