---
words:
  - word: 提
    type: 【动词】
    phonetic: ti2
    tags:
      - 高中
    samples:
      - trans: ❶垂下手来拿着。
        sentences:
          - ancient: 一贼<提>刀突（出其不意）奔客。（《大铁椎传》）
            url: xxxx
            vernacular: 一个强盗提着刀纵马冲向侠客
          - ancient: 今<提>—匕首入不测之强秦，仆所以留者，待吾客与俱。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 现在光拿着一把匕首进入不可意料的强暴的秦国，我之所以停留下来，是因为等待我的客人好同他一起走。
      - trans: ❷携带。
        sentences:
          - ancient: <提>挈妻子，而寄托之。（《墨子•兼爱》）
            url: xxxx
            vernacular: 安顿妻子和孩子
      - trans: ❸提拔。
        sentences:
          - ancient: "然<提>奖后辈,以名行为先。（《北史•魏收传》）"
            url: xxxx
            vernacular: 提拔奖赏后辈的人，首先要看他的名望和德行。
      - trans: ❹举出;提出。
        sentences:
          - ancient: 记事者必<提>其要，纂言者必钩其玄（深奥的道理）。（唐•韩愈《进学解》）
            url: xxxx
            vernacular: 对史书类典籍必定总结掌握其纲要，对论说类典籍必定探寻其深奥隐微之意。
      - trans: ❺投掷。
        sentences:
          - ancient: 是时，侍医夏无且以其所奉药囊<提>轲。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 这时，秦王的随从医官夏无且(jū)用他手里捧着的药袋投击荆轲。
          - ancient: 荆轲废，乃引其匕首<提>秦王，不中，中柱。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲倒下了，就举起他的匕首投击秦王，没有击中，击中了柱子。
