      - trans: ❶垂下手来拿着。
        sentences:
          - ancient: 一贼提刀突（出其不意）奔客。（《大铁椎传》）
          - ancient: 今提—匕首入不测之徴秦，仆所以留者，待吾客与俱。（《荆轲刺秦王》）
      - trans: ❷携带。
        sentences:
          - ancient: 提挈妻子而寄托之。（《墨子•兼爱下》）
      - trans: ❸提拔。
        sentences:
          - ancient: 然提奖后辈,以名行为先。（《北史•魏收传》）
      - trans: ❹举出;提出。
        sentences:
          - ancient: 记事者必提其要，纂言者必钩其玄（深奥的道理）。（唐•韩愈《进学解》）
      - trans: ❺投掷。
        sentences:
          - ancient: 是时，侍医夏无且以其所奉药囊提轲。（《荆轲刺秦涕王》）
          - ancient: 荆轲废，乃引其匕首提秦王，不中，中柱。（《荆轲刺秦王》）
