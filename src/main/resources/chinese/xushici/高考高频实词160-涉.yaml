涉she4
【名词】渡口。
【例句】匏（pao2,-种葫芦）有苦叶，济（渡口）有深涉。（《诗经•邶风•匏有苦叶》）

【动词】❶徒步渡水。
【例句】滩水暴益，荆人弗知，循表（标志）而夜涉。（《吕氏春秋•察今》）丨送子涉淇，至工顿丘。（《诗经•卫风•氓》）丨以小舟涉鲸波出，无可奈何，而死固付之度外矣。（《〈指南录〉后序》）
❷到达;游历。
【例句】园日涉以成趣，门虽设而常关。（《归去来兮辞》）丨驱中国（中原地区）士众远涉江湖之间，不习水土，必生疾病。（《资治通鉴•汉纪五十七》）
❸经历。
【例句】仆自到九江，已涉三载。（唐•白居易《与元微之书》）
❹浏览。
【例句】少好学，博涉书记。（《后汉书•仲长统传》）
❺牵涉;关联。
【例句】而言有关涉，事便显露。（《史通•叙事》）

