---
words:
  - word: 慕
    type: 【动词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: ❶想念;向往。
        sentences:
          - ancient: 其声呜呜然，如怨如<慕>，如泣如诉。（《赤壁赋》）
            url: xxxx
            vernacular: 洞箫“呜呜”作声，有如哀怨有如思慕，像是哭泣，又像是倾诉
      - trans: ❷敬仰;仰慕。
        sentences:
          - ancient: "且勇者不必死节，怯夫<慕>义，何处不勉焉。（《报任安书》）"
            url: xxxx
            vernacular: 况且一个勇敢的人不一定要为名节去死，怯懦的人如果仰慕大义，什么地方不可以勉励自己去死节呢？
          - ancient: 臣所以去亲戚而事君者，徒<慕>君之高义也。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 我们之所以离开亲人来侍奉您，是仰慕您高尚的节义呀。
          - ancient: "【高考题例】天水夷夏<慕>德，老幼赴阙献书，乞留芝。（《晋书•鲁芝传》）"
            url: xxxx
            vernacular: 天水各族百姓都非常仰慕他的美德，老人和小孩到朝廷上书，请求留下鲁芝。
      - trans: ❸羡慕。
        sentences:
          - ancient: 无路请缨，等终军之弱冠；有怀投笔，<慕>宗悫之长风。（《滕王阁序》）
            url: xxxx
            vernacular: 却无处去请缨杀敌。虽然和终军一样年已二十一，也有投笔从戎的志向，我羡慕宗悫那种“乘长风破万里浪”的英雄气概
          - ancient: "余则缊（yun4，乱麻）袍敝衣处其间，略无<慕>艳意。（《送东阳马圧序》）"
            url: xxxx
            vernacular: 我却穿着破破烂烂的衣服和他们生活在一起，但我毫无羡慕的心。
          - ancient: "（张）衡不<慕>当世，所居之官辄积年不徙。（《张衡传》）"
            url: xxxx
            vernacular: 张衡不趋附当时的那些达官显贵，他所担任的官职，总是多年得不到提升。
      - trans: ❹讨好;趋附。
        sentences:
          - ancient: 仕则<慕>君，不得于君则热中。（《孟子•万章上》）
            url: xxxx
            vernacular: 做了官便爱慕君王，得不到君王的赏识便内心焦急得发热。
      - trans: ❺效法。
        sentences:
          - ancient: 他植者虽窥伺效<慕>，莫能如也。（《种树郭橐驼传》）
            url: xxxx
            vernacular: 其他种树的人即使暗中观察、羡慕效仿，也没有谁能比得上。
