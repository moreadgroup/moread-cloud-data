---
words:
  - word: 兹
    type: 【名词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: 年。
        sentences:
          - ancient: 今兹美禾，来兹美麦。（《吕氏春秋•任地》）

  - word: 兹
    type: 【代词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: ❶表示近指，相当于"这""此"。
        sentences:
          - ancient: 登兹楼以四望兮，聊暇日以销忧。（汉•王粲《登楼赋》）
          - ancient: 他日趋庭，叨陪鲤对;今兹捧袂，喜托龙门。（《滕王阁序》）
          - ancient: 总此十思，宏兹九德。（《谏太宗十思疏》）
          - ancient: 妪每谓余曰："某所，而母立于兹。"（《项脊轩志》）
      - trans: ❷现在;这里;这个。
        sentences:
          - ancient: 今臣生十二岁于兹矣。（《史记•樗里子甘茂列传》）
          - ancient: 兹可谓一劳而久逸，暂费而永宁也。（汉•班固《封燕然山铭》）

  - word: 兹
    type: 【副词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: 通"滋"。表示程度的加深或趋势的发展，相当于""更加""越发"等。
        sentences:
          - ancient: 祸之长也兹萃（cui,聚集）。（《庄子•徐无鬼》）
          - ancient: 至攘人犬豕鸡豚者，其不义又甚入人园圃窃桃李。是何故也?以亏人愈多，其不仁兹甚，罪益厚。（《墨子•非攻上》）
