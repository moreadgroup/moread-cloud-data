      - trans: ❶表示近指，相当于"这""此"。
        sentences:
          - ancient: 登<兹>楼以四望兮，聊暇日以销忧。（汉•王粲《登楼赋》）
            url: xxxx
            vernacular: 登上城楼向四处眺望啊，暂借此日来排遣忧愁。
          - ancient: 他日趋庭，叨陪鲤对;今<兹>捧袂，喜托龙门。（《滕王阁序》）
            url: xxxx
            vernacular: 不久我将见到父亲，聆听他的教诲；今天我侥幸地奉陪各位长者，高兴地登上龙门。
          - ancient: 总此十思，宏<兹>九德，简能而任之，择善而从之。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 全面做到这十件应该深思的事，弘扬这九种美德，选拔有才能的人而任用他，挑选好的意见而听从它。
          - ancient: 妪每谓余曰："某所，而母立于<兹>。"（《项脊轩志》）
            url: xxxx
            vernacular: 老婆婆常常对我说：“这个地方，你母亲曾经站在这里。”
      - trans: ❷现在;这里;这个。
        sentences:
          - ancient: 今臣生十二岁于<兹>矣。（《史记•樗里子甘茂列传》）
            url: xxxx
            vernacular: xxxx
          - ancient: <兹>可谓一劳而久逸，暂费而永宁也。（汉•班固《封燕然山铭》）
            url: xxxx
            vernacular: 此所渭一次劳神而长期安逸，暂时费事而永久安宁。
  - word: 兹
    type: 【副词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: 通"滋"。表示程度的加深或趋势的发展，相当于""更加""越发"等。
        sentences:
          - ancient: 祸之长也<兹>萃（cui，聚集），其反也缘功，其果也待久。（《庄子•徐无鬼》）
            url: xxxx
            vernacular: 灾祸滋生并逐渐地增多与聚集，返归本性却为功名所萦绕，要想获得成功便须持续很久很久。
          - ancient: 至攘人犬豕鸡豚者，其不义又甚入人园圃窃桃李。是何故也?以亏人愈多，其不仁<兹>甚，罪益厚。（《墨子•非攻上》）
            url: xxxx
            vernacular: 至于偷人家鸡犬大猪小猪的，比进人家果园偷桃李更不义。这是什么原故呢？因为他损人更多。如果损人越多，他越是不仁，罪越重。
