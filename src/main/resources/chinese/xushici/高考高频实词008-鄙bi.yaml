---
words:
  - word: 鄙
    type: 【名词】
    samples:
      - trans: 边远的地方。
        sentences:
          - ancient: 蜀之鄙有二僧：其一贫，其一富。（《为学》）
          - ancient: 臣，东鄙之贱人也，开罪于楚、魏，遁逃来奔。（《战国策•秦策三》）
  - word: 鄙
    type: 【动词】
    phonetic: bi3
    tags:
      - 高中
    samples:
      - trans: ❶使……成为边邑。
        sentences:
          - ancient: 越国以鄙远，君知其难也。（《烛之武退秦师》）
      - trans: ❷看不起;轻视。
        sentences:
          - ancient: 过我而不假（借）道，鄙我也。（《左传•宣公十四年》）
          - ancient: 僧仲镂簋（gui3，盛食物的器具）朱紘（hong2，帽子上的带子），山节藻棁（zhuo1，梁上短柱），孔字鄙其小器。（《训俭示康》）
  - word: 鄙
    type: 【形容词】
    phonetic: bi3
    tags:
      - 高中
    samples:
      - trans: ❶浅陋;粗俗。
        sentences:
          - ancient: 肉食者鄙，未能远谋。（《曹刿论战》）
          - ancient: 先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中。（《出师表》）
          - ancient: 鄙贱之人，不知将军宽之至此也！（《廉颇蔺相如列传》）
          - ancient: 恨私心有所不尽，鄙陋没世，而文采不表于后也。（《报任安书》）
          - ancient: 敢竭鄙怀，恭疏短引，—言均赋，四韵俱成。（《滕王阁序》）
          - ancient: 北蛮夷之鄙人，未尝见天子，故振慑。（《荆轲刺秦王》）
      - trans: ❷轻贱;下贱。
        sentences:
          - ancient: 人贱物亦鄙，不足迎后人。（《孔雀东南飞》）
      - trans: ❸粗野。
        sentences:
          - ancient: 子路性鄙，好勇力，志伉直，冠雄鸡，佩豭豚，陵暴孔子。（《史记•仲尼弟子列传》）
