---
words:
  - word: 盈
    type: 【动词】
    phonetic: ying2
    tags:
      - 高中
    samples:
      - trans: ❶足够;充满。
        sentences:
          - ancient: 连峰去（距离）天不盈尺，枯松倒挂倚绝壁。（《蜀道难》）
          - ancient: 市列珠玑，户盈罗绮，竞豪奢。（宋•柳永《望海潮》）
          - ancient: 东篱把酒黄昏后,有暗香盈袖。（《醉花阴》）
          - ancient: 携幼入室，有酒盈樽。（《归去来兮辞》）
          - ancient: 【高考题例】自混亡，至是九载，而室宇修整，仓廩充盈。（《宋书•谢弘微传》）
      - trans: ❷增长（与"亏""缩"相对）「
        sentences:
          - ancient: 进退盈缩，与时变化。（《史记•范睢蔡泽列传》）

  - word: 盈
    type: 【形容词】
    phonetic: ying2
    tags:
      - 高中
    samples:
      - trans: ❶圆满。
        sentences:
          - ancient: 逝者如斯,而未尝往也;盈虚者如彼，而卒莫消长也。（《赤壁赋》）
      - trans: ❷富裕。
        sentences:
          - ancient: 致求盈余。（《汉书•马援传》）
      - trans: ❸自满。
        sentences:
          - ancient: 志骄盈而轻旧怨。（《荀子•仲尼》）
      - trans: ❹丰满。
        sentences:
          - ancient: 貌丰盈以庄姝（shu1,美丽）兮。（战国楚•宋玉《神女赋》）

