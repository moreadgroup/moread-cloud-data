盈ying2
【动词】❶足够;充满。
【例句】连峰去（距离）天不盈尺，枯松倒挂倚绝壁。（《蜀道难》）丨市列珠玑，户盈罗绮，竞豪奢。（宋•柳永《望海潮》）丨东篱把酒黄昏后,有暗香盈袖。（《醉花阴》）丨携幼入室，有酒盈樽。（《归去来兮辞》）
【高考题例】自混亡，至是九载，而室宇修整，仓廩充盈。（《宋书•谢弘微传》）
❷增长（与"亏""缩"相对）「
【例句】进退盈缩，与时变化。（《史记•范睢蔡泽列传》）

【形容词】❶圆满。
【例句】逝者如斯,而未尝往也;盈虚者如彼，而卒莫消长也。（《赤壁赋》）
❷富裕。
【例句】致求盈余。（《汉书•马援传》）
❸自满。
【例句】志骄盈而轻旧怨。（《荀子•仲尼》）
❹丰满。
【例句】貌丰盈以庄姝（shu1,美丽）兮。（战国楚•宋玉《神女赋》）

