---
words:
  - word: 诸
    type: 【代词】
    phonetic: zhu1
    tags:
      - 高中
    samples:
      - trans: ❶表示各个。
        sentences:
          - ancient: 诸郎中执兵，皆陈殿下，非有诏不得上。（《荆轲刺秦王》）
          - ancient: 当此时，诸郡县苦秦吏者，皆刑（杀）其长吏，杀之以应陈涉。（《陈涉世家》）
      - trans: ❷做第三人称代词。相当于"之"。
        sentences:
          - ancient: 潘崇曰："能事诸乎?"曰:"不能。"（《左传•文公元年》）
          - ancient: 王如改诸，则必反予。（《孟子•公孙丑下》）

  - word: 诸
    type: 【兼词】
    phonetic: zhu1
    tags:
      - 高中
    samples:
      - trans: ❶相当于"之于"。
        sentences:
          - ancient: 投诸渤海之尾，隐土之北。（《愚公移山》）
          - ancient: 或取诸怀抱，悟言一室之内。（《兰导集序》）
          - ancient: 乃赏成，献诸抚军。（《促织》）
          - ancient: 【高考题例】为请诸朝，发太仓米振之。（《宋史•萧燧传》）
      - trans: ❷相当于"之乎"。
        sentences:
          - ancient: 文王之囿（畜养禽兽的园地）方（方园）七十里，有诸？（《孟子•桀惠王下》）
          - ancient: 何可废也,以羊易之。不识有诸？（《齐桓晋文之事》）
