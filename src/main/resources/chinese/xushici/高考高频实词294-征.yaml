---
words:
  - word: 征
    type: 【名词】
    phonetic: zheng1
    tags:
      - 高中
    samples:
      - trans: ❶征兆;迹象。
        sentences:
          - ancient: 兵未战而先见败征，此可谓知兵矣。（《史记•项羽本纪》）
          - ancient: 尝一龙机发而地不觉动，京师学者咸怪其无征。（《张衡传》）
      - trans: ❷证明。
        sentences:
          - ancient: 而其事信而有征。（清•薛福成《观巴黎油画记》）
      - trans: ❸赋税。
        sentences:
          - ancient: 使食其征。（《左传•文公十一年》）
  - word: 征
    type: 【动词】
    phonetic: zheng1
    tags:
      - 高中
    samples:
      - trans: ❶远行。
        sentences:
          - ancient: 我日斯迈，而月斯征。（《诗经•小雅•小宛》）
          - ancient: 问征夫以前路，恨晨光之熹微。（《归去来兮辞》）
      - trans: ❷征伐;讨伐。
        sentences:
          - ancient: 挟天子以征四方。（《资治通鉴•汉纪五十七》）
          - ancient: 桓公实北征山戎，而管仲因而令燕修召公之政。（《史记•管仲列传》）
      - trans: ❸争夺;争取。
        sentences:
          - ancient: 当此时也，民务胜而力征。（《商君书•开塞》）
      - trans: ❹征收;征税。
        sentences:
          - ancient: 宫中点（风行）促织之戏，岁征民间。（《促织》）
      - trans: ❺征召;召请。
        sentences:
          - ancient: 安帝雅（平素）闻（张）衡善术学，公车特征拜郎中,再迁为太史令。（《张衡传》）
          - ancient: 视事三年，上书乞骸骨，征拜尚书。（《张衡传》）
          - ancient: 【高考题例】孝文皇帝初立，闻河南守吴公治平为天下第一，故":与李斯同邑而常学事焉,乃征为廷尉。（《史记•屈原贾生列传》）

      - trans: ❻追允;追冋。
        sentences:
          - ancient: 寡人是征。（《左传•僖公四年》）
      - trans: ❼求;取。
        sentences:
          - ancient: 梁王伐邯郸,而征师于宋。（《战国策•宋策》）
      - trans: ❽取信。
        sentences:
          - ancient: 故夫知效一官，行比一乡，德合一君,而征一国者,其自视也，亦若此矣。（《逍遥游》）
      - trans: ❾证明。
        sentences:
          - ancient: 夏礼吾能言之，杞不足<征>也。殷礼吾能言之，宋不足<征>也。足，则吾能<征>之矣。（《史记•孔子世家》）