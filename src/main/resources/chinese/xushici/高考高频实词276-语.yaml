---
words:
  - word: 语
    type: 【名词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: ❶对别人说的话;言论。
        sentences:
          - ancient: 慎勿违吾语。（《孔雀东南飞》）
          - ancient: 我闻琵琶已叹息，又闻此语重唧唧（叹息声）。（《琵琶行》）
      - trans: ❷群众中流传的话；俗语；谚语。
        sentences:
          - ancient: 语云:仁者"老吾老以及人之老，幼吾幼以及人之幼"。（《与妻书》）
          - ancient: 于是焉河伯始旋其面目，望洋向若而叹曰:"野语有之曰"闻道百,以为莫己若者"，我之谓也……"（《秋水》）
      - trans: ❸语句;词语。
        sentences:
          - ancient: 为人性僻耽（爱好而沉浸其中）佳句，语不惊人死不休。（唐•杜甫《江上值水如海势聊短述》）
      - trans: ❹语言。
        sentences:
          - ancient: 教其鲜卑语及弹琵琶。（《颜氏家训•教子》）

  - word: 语
    type: 【动词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: ❶和别人说话。
        sentences:
          - ancient: 食不语，寝不言。（《论语•乡党》）
          - ancient: 小子无所畏，何敢助妇语！（《孔雀东南飞》）
          - ancient: 寻声暗问弹者谁？琵琶声停欲语迟。（《琵琶行》）
          - ancient: 夜久语声绝,如闻泣幽咽。（《石壕吏》）
      - trans: ❷谈论。
        sentences:
          - ancient: 试使山东之国与陈涉度（duo2,比量）长絜（xie2,衡量）大，比权量力，则不可同年而语矣。（《过秦论））
          - ancient: 是日，卒中往往语，皆指目陈胜。（《陈涉世家》）
          - ancient: 【高考题例】家居，非事未尝入州城。语及时事，辄颦蹙不答。（《明史•马文升传》）

  - word: 语
    type: 【动词】
    phonetic: yu4
    tags:
      - 高中
    samples:

      - trans: 告诉。
        sentences:
          - ancient: 挟（xie2,夹在胳膊下）太山（泰山）以超（跳过）北海（渤海），语人曰:"我不能。"是诚不能也。（《孟字•梁惠主上》）
          - ancient: 臣为韩王送沛公,沛公今事有急，亡去不义，不可不语。（《鸿门宴》）
          - ancient: 此中人语云："不足为外人道也。"（《桃花源记》）
          - ancient: 【高考题例】得金人，使之还，日:"为（替）语汝将曰，我郭浩也，欲战即来决战。"金人遂引去。（《宋史•郭浩传》）

