语㊀yu3
【名词】❶对别人说的话;言论。
【例句】慎勿违吾语。（《孔雀东南飞》）丨我闻琵琶已叹息，又闻此语重唧唧（叹息声）。（《琵琶行》）
❷群众中流传的话；俗语；谚语。
【例句】语云:仁者"老吾老以及人之老，幼吾幼以及人之幼"。（《与妻书》）丨于是焉河伯始旋其面目，望洋向若而叹曰:"野语有之曰"闻道百,以为莫己若者"，我之谓也……"（《秋水》）
❸语句;词语。
【例句】为人性僻耽（爱好而沉浸其中）佳句，语不惊人死不休。（唐•杜甫《江上值水如海势聊短述》）
❹语言。
【例句】教其鲜卑语及弹琵琶。（《颜氏家训•教子》）

【动词】❶和别人说话。
【例句】食不语，寝不言。（《论语•乡党》）丨小子无所畏，何敢助妇语！（《孔雀东南飞》）丨寻声暗问弹者谁？琵琶声停欲语迟。（《琵琶行》）丨夜久语声绝,如闻泣幽咽。（《石壕吏》）
❷谈论。
【例句】试使山东之国与陈涉度（duo2,比量）长絜（xie2,衡量）大，比权量力，则不可同年而语矣。（《过秦论））丨是日，卒中往往语，皆指目陈胜。（《陈涉世家》）
【高考题例】家居，非事未尝入州城。语及时事，辄颦蹙不答。（《明史•马文升传》）

语㊁yu4
【动词】告诉。
【例句】挟（xie2,夹在胳膊下）太山（泰山）以超（跳过）北海（渤海），语人曰:"我不能。"是诚不能也。（《孟字•梁惠主上》）丨臣为韩王送沛公,沛公今事有急，亡去不义，不可不语。（《鸿门宴》）丨此中人语云："不足为外人道也。"（《桃花源记》）
【高考题例】得金人，使之还，日:"为（替）语汝将曰，我郭浩也，欲战即来决战。"金人遂引去。（《宋史•郭浩传》）

