---
words:
  - word: 也
    type: 【副词】
    phonetic: ye3
    tags:
      - 高中
    samples:
      - trans: ❶或;还。
        sentences:
          - ancient: 眼巴巴不见孩儿回来，不知有官也是无官？（元•张国宾《薛仁贵荣归故里》）
      - trans: ❷表示同样等意义。
        sentences:
          - ancient: 天涯也有江南信，梅破知春近。（宋•黄庭坚《虞美人•宜州见梅作》）
      - trans: ❸表示强调，有甚至的意思。
        sentences:
          - ancient: 似花还似非花，也无人惜从教坠。（宋•苏轼《水龙吟•次韵章质夫杨花词》）

  - word: 也
    type: 【助词】
    phonetic: ye3
    tags:
      - 高中
    samples:
      - trans: ❶用在句末，表示判断语气。
        sentences:
          - ancient: 陈胜者，阳城人也。（《史记•陈涉世家》）
          - ancient: 师者，所以传道受业解惑也。（《师说》）
          - ancient: 今日往而不反者，竖子也！（《荆轲刺秦王》）
          - ancient: 不可，直不百步耳，是亦走也。（《寡人之于国也》）
          - ancient: 【高考题例】有华生者，世家江北，备谙村落者也。（《村落嫁娶图记》）
      - trans: ❷用在句末，表示肯定语气。
        sentences:
          - ancient: 小惠未遍，民弗从也。（《曹刿论战》）
          - ancient: 忳郁邑余侘傺兮，吾独穷困乎此时也。（《离骚》）
          - ancient: 今者项庄拔剑舞，其意常在沛公也。（《鸿门宴》）
      - trans: ❸用在句末，表示疑问语气。
        sentences:
          - ancient: 吾王庶几无疾病与？何以能鼓乐也？（《庄暴见孟子》）
          - ancient: 焉有仁人在位，罔民而可为也？（《齐桓晋文之事》）
          - ancient: 苏子愀然，正襟危坐而问客曰："何为其然也？"（《赤壁赋》）
          - ancient: —夫作难而七庙隳（hui1，毁坏），身死人手，为天下笑者，何也？（《过秦论》）
      - trans: ❹用在句末，表示感叹语气。
        sentences:
          - ancient: 至于誓天断发，泣下沾襟，何其衰也！（《伶官传序》）
          - ancient: 古之人不余欺也！（《石钟山记》）
          - ancient: 君美甚，徐公何能及君也？（《邹忌讽齐王纳谏》）
      - trans: ❺用在句末，表示祈使语气。
        sentences:
          - ancient: 欲呼张良与俱去，曰:"毋从俱死也！"（《鸿门宴》）
      - trans: ❻用在句中，表示语气的停顿，以引起下文。
        sentences:
          - ancient: 女也不爽，士贰其行。（《诗经•卫风•氓》）
          - ancient: 然后驱而之善，故民之从之也轻。（《齐桓晋文之事》）
          - ancient: 今之众人，其下圣人也亦远矣，而耻学于师。（《师说》）

