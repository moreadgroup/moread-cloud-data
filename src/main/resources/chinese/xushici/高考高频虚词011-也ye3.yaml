---
words:
  - word: 也
    type: 【副词】
    phonetic: ye3
    tags:
      - 高中
    samples:
      - trans: ❶或;还。
        sentences:
          - ancient: 眼巴巴不见孩儿回来，不知有官<也>是无官？（元•张国宾《薛仁贵荣归故里》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷表示同样等意义。
        sentences:
          - ancient: 天涯<也>有江南信，梅破知春近。（宋•黄庭坚《虞美人•宜州见梅作》）
            url: xxxx
            vernacular: 我看见宜州的梅花绽放枝头，就想到春天快要到了。
      - trans: ❸表示强调，有甚至的意思。
        sentences:
          - ancient: 似花还似非花，<也>无人惜从教坠。（宋•苏轼《水龙吟•次韵章质夫杨花词》）
            url: xxxx
            vernacular: 非常像花又好像不是花，无人怜惜任凭衰零坠地。
  - word: 也
    type: 【助词】
    phonetic: ye3
    tags:
      - 高中
    samples:
      - trans: ❶用在句末，表示判断语气。
        sentences:
          - ancient: 陈胜者，阳城人<也>，字涉。（《史记•陈涉世家》）
            url: xxxx
            vernacular: 陈胜，是阳城人，字涉。
          - ancient: 师者，所以传道受业解惑<也>。（《师说》）
            url: xxxx
            vernacular: 老师,是用来传授知识、教授学业、解答疑惑的人。
          - ancient: 今日往而不反者，竖子<也>！（《荆轲刺秦王》）
            url: xxxx
            vernacular: 如果现在去了却不能够回来向太子复命，那是小人！
          - ancient: 不可，直不百步耳，是亦走<也>。（《寡人之于国也》）
            url: xxxx
            vernacular: 不行。他只不过没有逃跑到一百步罢了，可是这也同样是逃跑呀！
          - ancient: 【高考题例】有华生者，世家江北，备谙村落者<也>。（《村落嫁娶图记》）
            url: xxxx
            vernacular: (有一位)姓华的先生，世代居住在江北，是十分熟悉乡村的人。
      - trans: ❷用在句末，表示肯定语气。
        sentences:
          - ancient: 小惠未遍，民弗从<也>。（《曹刿论战》）
            url: xxxx
            vernacular: 这些只是小恩小惠，不能遍及百姓，百姓是不会听从您的。
          - ancient: 忳郁邑余侘傺兮，吾独穷困乎此时<也>。（《离骚》）
            url: xxxx
            vernacular: 忧愁烦闷啊我失意不安，现在孤独穷困多么艰难。
          - ancient: 今者项庄拔剑舞，其意常在沛公<也>。（《鸿门宴》）
            url: xxxx
            vernacular: 现在项庄拔剑起舞，他的意图常在沛公身上啊！
      - trans: ❸用在句末，表示疑问语气。
        sentences:
          - ancient: 吾王庶几无疾病与？何以能鼓乐<也>？（《庄暴见孟子》）
            url: xxxx
            vernacular: 我们大王大概没有疾病吧，要不怎么能围猎呢？
          - ancient: 焉有仁人在位，罔民而可为<也>？（《齐桓晋文之事》）
            url: xxxx
            vernacular: 哪有仁爱的君主掌权，却可以做这种陷害百姓的事呢？
          - ancient: 苏子愀然，正襟危坐而问客曰："何为其然<也>？"（《赤壁赋》）
            url: xxxx
            vernacular: 我的神色也愁惨起来，整好衣襟坐端正，向客人问道：“箫声为什么这样哀怨呢？”
          - ancient: —夫作难而七庙隳（hui1，毁坏），身死人手，为天下笑者，何<也>？（《过秦论》）
            url: xxxx
            vernacular: 一人发动起义,就使得整个王朝都崩溃了,秦二世也死于他人之手,被天下耻笑,这是什么原因呢?
      - trans: ❹用在句末，表示感叹语气。
        sentences:
          - ancient: 至于誓天断发，泣下沾襟，何其衰<也>！（《伶官传序》）
            url: xxxx
            vernacular: 以至于剪断头发,对天发誓,眼泪沾湿了衣裳,这又是多么衰败啊!
          - ancient: 古之人不余欺<也>！（《石钟山记》）
            url: xxxx
            vernacular: 古人没有欺骗我啊！
          - ancient: 君美甚，徐公何能及君<也>？（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 您美极了，徐公怎么能比得上您呢？
      - trans: ❺用在句末，表示祈使语气。
        sentences:
          - ancient: 欲呼张良与俱去，曰:"毋从俱死<也>！"（《鸿门宴》）
            url: xxxx
            vernacular: 想叫张良和他一起离开，说：“不要和（刘邦）他们一起死了。”
      - trans: ❻用在句中，表示语气的停顿，以引起下文。
        sentences:
          - ancient: 女<也>不爽，士贰其行。（《诗经•卫风•氓》）
            url: https://so.gushiwen.cn/mingju/juv_010d05aa7ffb.aspx
            vernacular: 我女子没有什么差错，男子行为却前后不一致了。
          - ancient: 然后驱而之善，故民之从之<也>轻。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 这样之后督促他们做好事。所以老百姓跟随国君走就容易了。
          - ancient: 今之众人，其下圣人<也>亦远矣，而耻学于师。（《师说》）
            url: xxxx
            vernacular: 现在的一般人，他们（的才智）低于圣人很远，却以向老师学习为耻。
