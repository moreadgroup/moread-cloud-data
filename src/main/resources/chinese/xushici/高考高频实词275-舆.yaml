---
words:
  - word: 舆
    type: 【名词】
    phonetic: yu2
    tags:
      - 高中
    samples:
      - trans: ❶车厢。泛指车。
        sentences:
          - ancient: 假（借助）舆马者，非利足（脚步快）也。（《劝学》）
      - trans: ❷抬人登山的用具。轿孚；
        sentences:
          - ancient: 乘肩舆，具威仪。（《晋书•王导传》）
      - trans: ❸古代奴隶的一个等级。
        sentences:
          - ancient: 士臣皂，皂臣<舆>,<舆>臣隶，隶臣僚,僚臣仆，仆臣台。 （《左传•昭公七年》）
      - trans: ❹地。
        sentences:
          - ancient: 漫漫方舆，回回洪覆。（晋•束皙《补亡诗》）

  - word: 舆
    type: 【动词】
    phonetic: yu2
    tags:
      - 高中
    samples:
      - trans: 抬;举。
        sentences:
          - ancient: 武气绝，半日复息。惠等哭，舆归营。（《苏武传》）【形容词】众多。
          - ancient: 近臣谏，远臣谤,舆人诵，以自诰也。（《国语•楚语上》）