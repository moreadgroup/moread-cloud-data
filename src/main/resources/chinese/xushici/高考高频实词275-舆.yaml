舆yu2
【名词】❶车厢。泛指车。
【例句】假（借助）舆马者，非利足（脚步快）也。（《劝学》）❷抬人登山的用具。轿孚；
【例句】乘肩舆，具威仪。（《晋书•王导传》）
❸古代奴隶的一个等级。
【例句】士臣皂，皂臣舆,舆臣隶，隶臣僚,僚臣仆，仆臣台。
（《左传•昭公七年》）
❹地。
【例句】漫漫方舆，回回洪覆。（晋•束皙《补亡诗》）

【动词】抬;举。
【例句】武气绝，半日复息。惠等哭，舆归营。（《苏武传》）【形容词】众多。
【例句】近臣谏，远臣谤,舆人诵，以自诰也。（《国语•楚语上》）