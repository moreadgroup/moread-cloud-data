---
words:
  - word: 独
    type: 【名词】
    phonetic: du2
    tags:
      - 高中
    samples:
      - trans: 没有子女的老人。
        sentences:
          - ancient: 【例句】老而无子曰独。（《孟子•梁惠王下》）
          - ancient: 恤鳏寡，存（关怀）孤独（年老没有儿子）。（《史记・司马相如列传》）
          - ancient: 使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养。（《大道之行也》）

  - word: 独
    type: 【形容词】
    phonetic: du2
    tags:
      - 高中
    samples:
      - trans: 单独的;单一的。
        sentences:
          - ancient: 【例句】独木不林。（《后汉书•崔驱传》）
          - ancient: 独夫之心，日益骄固。（《阿房宫赋》）

  - word: 独
    type: 【副词】
    phonetic: du2
    tags:
      - 高中
    samples:
      - trans: ❶单独;独自。
        sentences:
          - ancient: 【例句】沛公则置车骑，脱身独骑。（《鸿门宴》）
          - ancient: 至莫（暮）夜月明，独与迈乘小舟，至绝壁下。（《石钟山记》）
          - ancient: 向大王有意督过之，脱身独去，已至军矣。（《鸿门宴》）
          - ancient: 既自以心为形役，奚惆怅而独悲？（《归去来兮辞》）
          - ancient: 【高考题例】城破，吾夫必死，吾义不独存，然不可使花氏无后，若等善抚之。（《明史•花云传》）	；
      - trans: ❷仅;只;唯独。
        sentences:
          - ancient: 【例句】举世混浊而我独清，众人皆醉而我独醒，是以见放（被流放）。（《史记•屈原贾生列传》）
          - ancient: 予独爱莲之出淤泥而不染，濯清涟而不妖。（《爱莲说》）
          - ancient: 臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土，实所共鉴。（《陈情度表》）
      - trans: ❸难道。
        sentences:
          - ancient: 【例句】丘虽不吾誉（称赞我），吾独不自知邪？（《庄子•盗跖》）
          - ancient: 相如虽驽（才能低劣），独畏廉将军哉？（《廉颇蔺相如列传》）
          - ancient: 纵江东父兄怜而王我，我何面目见之？纵彼不言，籍独不愧于心乎？（《项羽之死》）