凶xiong1
【名词】❶恶人。
【例句】庶竭驽钝（用尽平庸的才智），攘除奸凶。（《出师表》）
❷丧事。
【例句】寡君少遭闵（min3,忧患）凶。（《左传•宣公十二年》）丨臣密言：臣以脸衅，夙遭闵凶。（《陈情表》）
❸灾祸，祸殃。
【例句】衡常思图身之事，以为吉凶倚伏，幽微难明，乃作
《思玄赋》以宣寄情志。（《张衡传》）

【形容词】❶凶恶;残暴。
【例句】凶狡无行之徒，媚以求官。（《后汉书•朱穆传》）
❷不吉利。
【例句】以瞽（gu3,眼睛失明）为明，以聋为聪，以是为非，以吉为凶。（《战国策•楚策四》）
❸庄稼无收成或严重歉收。
【例句】河内凶，则移其民于河东,移其粟于河内；河东凶亦然。（《寡人之于国也》）
