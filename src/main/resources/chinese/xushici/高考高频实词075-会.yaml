---
words:
  - word: 会
    type: 【名词】
    phonetic: hui4
    tags:
      - 高中
    samples:
      - trans: ❶节奏。
        sentences:
          - ancient: 【例句】合于《桑林》之舞，乃中《经首》之会。（《庄子•养生主》）
      - trans: ❷机会。
        sentences:
          - ancient: 【例句】此乃忠臣肝脑涂地之秋，烈士立功之会。（汉•陈琳《为袁绍檄豫州》）
  - word: 会
    type: 【动词】
    phonetic: hui4
    tags:
      - 高中
    samples:
      - trans: ❶会合;会集。
        sentences:
          - ancient: 【例句】暮春之初,会于会稽山阴之兰亭，修禊（xi4,三月初在水边嬉游，以消除不祥）事也。（《兰亭集序"》）丨然则北通巫峡，南极（最远到达）潇湘，迁客骚人，多会于此，览物之情，得无异乎？（《岳阳楼记》）丨诸侯恐惧，会盟而谋弱秦。（《六国论》）
      - trans: ❷体会;领会。
        sentences:
          - ancient: 【例句】每有会意,便欣然忘食。（《五柳先生传》）丨把吴钩看了，栏杆拍遍,无人会，登临意。（《水龙吟•登建康赏心亭》）
      - trans: ❸会见;会面。
        sentences:
          - ancient: 【例句】人贱物亦鄙，不足迎后人，留待作遗施（遗wei4,赠送的礼物），于今无会因。（《孔雀东南飞》无由会晤，不任区区向往之至！（宋•王安石《答司马谏议书》）丨秦王使使者告赵王，欲与王为好，会于西河外渑池。（《廉颇蔺相如列传》）
  - word: 会
    type: 【副词】
    phonetic: hui4
    tags:
      - 高中
    samples:
      - trans: ❶恰巧;适逢。
        sentences:
          - ancient: 【例句】会天大雨，道不通，度（duo2,估计）已失期（误期）。（《陈涉世家》）丨草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。（《报任安书》）丨方欲发使送武等，会缑王与长水虞常等谋反匈奴中。（《苏武传》）
          - ancient: 【高考题例】会户部尚书孙交亦以守正见忤，遂矫旨令二人致仕。（《明史•傅珪传》）
      - trans: ❷一定;应该。
        sentences:
          - ancient: 【例句】吾已失恩义，会不相从许。（《孔雀东南飞》）丨长风破浪会有时，直挂云帆济沧海。（《行路难•其—》）
