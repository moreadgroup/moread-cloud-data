寓yu4
【名词】住所。
【例句】时余方访君寓。（清•梁启超《谭嗣同》）
【动词】❶寄居:临时居住。
【例句】刘备天下枭雄，与（曹）操有隙，寄寓于（刘）表，表恶（wu4讨厌）其能而不能用也。（《资治通鉴•汉纪五+七》）丨寓逆旅（旅店），主人日再食，无鲜肥滋味之享。（《送东阳马生序》）
❷寄托。
【例句】山水之乐,得之心而寓之酒也。（《醉翁亭记》）丨已矣乎！寓形宇内复几时？曷不委心任去留？（《归去来兮辞》）

