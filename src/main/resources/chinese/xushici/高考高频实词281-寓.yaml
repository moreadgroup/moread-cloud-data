      - trans: ❶寄居:临时居住。
        sentences:
          - ancient: 刘备天下枭雄，与（曹）操有隙，寄<寓>于（刘）表，表恶（wu4讨厌）其能而不能用也。（《资治通鉴•汉纪五+七》）
            url: xxxx
            vernacular: 刘备,天下枭雄,跟曹操不睦,屈身（暂居）在刘表帐下,刘表因为他能力太强而不敢用他（对其心存提防）.
          - ancient: <寓>逆旅（旅店），主人日再食，无鲜肥滋味之享。（《送东阳马生序》）
            url: xxxx
            vernacular: 寄居在旅馆，店主人每天供给两顿饭，没有新鲜肥嫩的美味享受。
      - trans: ❷寄托。
        sentences:
          - ancient: "山水之乐,得之心而<寓>之酒也。（《醉翁亭记》）"
            url: xxxx
            vernacular: 欣赏山水美景的乐趣，领会在心里，寄托在酒上。
          - ancient: 已矣乎！<寓>形宇内复几时？曷不委心任去留？（《归去来兮辞》）
            url: xxxx
            vernacular: 算了吧！活在世上还能有多久？为什么不随心所欲，听凭自然的生死？
