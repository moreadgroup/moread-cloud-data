  - word: 厌
    type: 【动词】
    phonetic: yan4
    tags:
      - 高中
    samples:
      - trans: ❶吃饱。
        sentences:
          - ancient: <厌>饮食，财货有余，是谓盗夸。（《老子》五十三章）
            url: xxxx
            vernacular: 饱餐精美饮食，搜刮无数财货，这就叫做江洋大盗。
      - trans: "❷满足。如成语\"贪得无厌\"。"
        sentences:
          - ancient: "然则诸侯之地有限，暴秦之欲无<厌>，奉之弥繁,侵之愈急。（《六国论》）"
            url: xxxx
            vernacular: 既然这样，那么诸侯的土地有限，强暴的秦国的欲望永远不会满足，诸侯送给秦越多，秦侵犯六国就越急迫。
          - ancient: 夫晋，何<厌>之有？（《烛之武退秦师》）
            url: xxxx
            vernacular: 晋国，哪里有满足的时候呢？
          - ancient: 【高考题例】公与语，不自知厀之前于席也，语数日不<厌>。（《史记•商君列传》）
            url: xxxx
            vernacular: 孝公跟他谈的非常投机，不知不觉地在垫席上向前移动膝盖，谈了好几天都不觉得厌倦。
      - trans: ❸厌恶;嫌弃。
        sentences:
          - ancient: 诸公宾客多<厌>之。（《史记•平津侯主父列传》）
            url: xxxx
            vernacular: 诸侯的宾客们都很讨厌他
          - ancient: 山不<厌>高，海不<厌>深。周公吐哺，天下归心。（《短歌行》）
            url: xxxx
            vernacular: 高山不辞土石才见巍峨，大海不弃涓流才见壮阔。我愿如周公一般礼贤下士，愿天下的英杰真心归顺与我。
      - trans: ❹心服。
        sentences:
          - ancient: 诸狱疑，若虽文致于法而于人心不<厌>者，辄谳yan4之。（《汉书•景帝纪》）
            url: xxxx
            vernacular: 而对于疑狱，即使可以引用律条进行判处而人心却不服的， 就应予进行复审与合议。
