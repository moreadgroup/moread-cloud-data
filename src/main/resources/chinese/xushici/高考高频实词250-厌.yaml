厌yan4
【动词】❶吃饱。
【例句】厌饮食，财货有余，是谓盗夸。（《老子》五十三章）
❷满足。如成语"贪得无厌"。	一
【例句】然则诸侯之地有限，暴秦之欲无厌，奉之弥繁,侵之愈急。（《六国论》）丨夫晋，何厌之有？（《烛之武退秦师》）


【高考题例】公与语，数日不厌。（《史记•商君列传》）

❸厌恶;嫌弃。
【例句】诸公宾客多厌之。（《史记•平津侯主父列传》）丨阳山不厌高，海不厌深。周公吐哺，天下归心。（《短歌行》）
❹心服。
【例句】诸狱疑，若虽文致于法而于人心不厌者，辄谳yan4之。（《汉书•景帝纪》）
【形容词】茂盛的样子。
【例句】有厌其杰（最先出土的幼苗）。（《诗经•周颂•载芟》）
