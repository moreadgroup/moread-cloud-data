      - trans: 茂盛的样子。
        sentences:
          - ancient: 有<厌>其杰（最先出土的幼苗），<厌><厌>其苗，绵绵其麃。（《诗经•周颂•载芟》）
            url: xxxx
            vernacular: 小芽纷纷拱出土，长出苗儿好漂亮。禾苗越长越茂盛，谷穗下垂长又长。
