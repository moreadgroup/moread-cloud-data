---
words:
  - word: 厌
    type: 【动词】
    phonetic: yan4
    tags:
      - 高中
    samples:
      - trans: ❶吃饱。
        sentences:
          - ancient: 厌饮食，财货有余，是谓盗夸。（《老子》五十三章）
      - trans: ❷满足。如成语"贪得无厌"。	一
        sentences:
          - ancient: 然则诸侯之地有限，暴秦之欲无厌，奉之弥繁,侵之愈急。（《六国论》）
          - ancient: 夫晋，何厌之有？（《烛之武退秦师》）
          - ancient: 【高考题例】公与语，数日不厌。（《史记•商君列传》）
      - trans: ❸厌恶;嫌弃。
        sentences:
          - ancient: 诸公宾客多厌之。（《史记•平津侯主父列传》）
          - ancient: 山不<厌>高，海不<厌>深。周公吐哺，天下归心。（《短歌行》）
      - trans: ❹心服。
        sentences:
          - ancient: 诸狱疑，若虽文致于法而于人心不厌者，辄谳yan4之。（《汉书•景帝纪》）

  - word: 厌
    type: 【形容词】
    phonetic: yan4
    tags:
      - 高中
    samples:
      - trans: 茂盛的样子。
        sentences:
          - ancient: 有厌其杰（最先出土的幼苗）。（《诗经•周颂•载芟》）
