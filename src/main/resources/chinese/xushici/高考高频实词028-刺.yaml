---
words:
  - word: 刺
    type: 【名词】
    phonetic: ci4
    tags:
      - 高中
    samples:
      - trans: ❶兵器的锋刃。
        sentences:
          - ancient: 虽有戈矛之<刺>，不如恭俭之利也。（《荀子•荣辱》）
            url: xxxx
            vernacular: 武器再锋利也比不上恭敬简朴的良好品质对人的影响威力。
          - ancient: 古之兵，弓剑而已矣，槽矛无击，修戟无<刺>。（《淮南子•氾论训》）
            url: xxxx
            vernacular: 古时候的兵器，就只有弓和剑而已了，那时候的的矛没有左右槽，那时候的戟也没有刺。
      - trans: ❷尖利像针的东西。
        sentences:
          - ancient: 苦苣<刺>如针，马齿（植物名）叶亦繁。（唐•杜甫《园官送菜》）
            url: xxxx
            vernacular: 苦苣的叶片长着像针一样的刺，而马齿苋的叶片则非常茂盛。
          - ancient: 宣帝始立，谒见高庙，大将军光从骖乘，上内严惮之，若有芒<刺>在背。（《汉书•霍光传》）
            url: xxxx
            vernacular: 宣帝刚被立为皇上时，到高庙祭祀，大将军霍光以骖乘的身份跟从，皇上心里害怕他，像背上长了芒刺一样。
          - ancient: 外布芳菲虽笑日，中含芒<刺>欲伤人。（唐•陆龟蒙《蔷薇》）
            url: xxxx
            vernacular: 蔷薇花竞相开放，鲜艳可人，但谁要触摸它，那茎上的芒刺就会不客气地刺痛你。
      - trans: ❸名帖。相当于后来的名片。
        sentences:
          - ancient: 即（即使）门者（守门的人）持<刺>入，而主者又不即出见。（明"•宗臣《堰刘一丈书》）
            url: xxxx
            vernacular: 守门人拿着名帖进去之后，而主人又不立即出来接见
          - ancient: 书姓字于奏上，曰书<刺>。（汉•刘熙《释名•释书契》）
            url: xxxx
            vernacular: 写名刺。书刺
          - ancient: 性清高，未尝脩<刺>候人。（《后汉书•井丹传》）
            url: xxxx
            vernacular: 性清高，从来没用名片问候过别人。
  - word: 刺
    type: 【动词】
    phonetic: ci4
    tags:
      - 高中
    samples:
      - trans: ❶用有尖的东西扎进或穿透物体。
        sentences:
          - ancient: 是何异于<刺>人而杀之，曰"非我也，兵也"？（《寡人之于国也》）
            url: xxxx
            vernacular: 这种说法与拿刀把人杀死后，说‘杀死人的不是我，是兵器’有什么不同？
          - ancient: 武谓惠等："屈节辱命，虽生，何面目以归汉!"引佩刀自<刺>。（《苏武传》）
            url: xxxx
            vernacular: 苏武对常惠说：“丧失气节、玷辱使命，即使活着，还有什么脸面回到家乡去呢！”说着拔出佩带的刀自刎
          - ancient: 读书欲睡，引锥自<刺>其股，血流至足。（《战国策•秦策一》）
            url: xxxx
            vernacular: 读到昏昏欲睡时，就拿针刺自己的大腿，鲜血一直流到脚跟
      - trans: ❷暗杀。
        sentences:
          - ancient: 夫专诸之<刺>王僚也，彗星袭月。（《唐雎不辱使命》）
            url: xxxx
            vernacular: 专诸刺杀吴王僚的时候，彗星的尾巴扫过月亮
      - trans: ❸指责;批评。
        sentences:
          - ancient: 群臣吏民能面<刺>寡人之过者，受上赏。（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 臣、官吏、百姓，能够当面批评我的过错的，可得上等奖赏
          - ancient: 面<刺>王过，王至掩耳起走。（《汉书•龚遂传》）
            url: xxxx
            vernacular: 当面指责昌邑王的过错，以至昌邑王捂着耳朵起身离开
      - trans: ❹讽刺。
        sentences:
          - ancient: 上称帝喾，下道齐桓，中述汤、武，以<刺>世事。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: （他）远古提到帝喾，近古提到齐桓公，中古提到商汤、周武王，利用古代帝王这些事用来讽刺当世社会。
          - ancient: 孔子贤者，所<刺>讥皆中诸侯之疾。（《史记•孔子世家》）
            url: xxxx
            vernacular: 孔子是当今的圣贤之士，他所揭露与嘲讽的事还有社会现状，都是切中要害，也都是各诸侯国出现的问题。
      - trans: ❺撑船。
        sentences:
          - ancient: 乃<刺>舟过舫，而喜可知矣。（《徐霞客游记•楚游日记十五》）
            url: xxxx
            vernacular: 于是叫船夫把渔船撑向前，我们过到所乘的船上，心中的喜悦可想而知了。
          - ancient: 见一丈人，<刺>小船，方将渔。（《吕氏春秋•异宝》）
            url: xxxx
            vernacular: 他看到一位老人，撑着小船，正要打渔。
      - trans: ❻担任州刺史或郡守。
        sentences:
          - ancient: 遇有以梦得事白上者，梦得于是改<刺>连州。（唐•韩愈《柳子厚墓志铭》）
            url: xxxx
            vernacular: 此时正好又有人将梦得的事报告了朝廷，梦得于是改为连州刺史。
