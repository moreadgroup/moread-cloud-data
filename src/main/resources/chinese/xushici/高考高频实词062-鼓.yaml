---
words:
  - word: 鼓
    type: 【名词】
    phonetic: gu3
    tags:
      - 高中
    samples:
      - trans: ❶一面或两面蒙着皮革的打击乐器。
        sentences:
          - ancient: 霾（通"埋"）两轮兮絷（zhi2用绳索拴住马足）四马，援玉枹（fu2，鼓槌）兮击鸣鼓。（战国楚•屈原《九歌•国殇》）「余方心动欲还，而大声发于水上，噌吰（cheng1hong2，形容钟声）如钟鼓不绝。（《石钟山记》）
      - trans: ❷鼓声。
        sentences:
          - ancient: 可堪回首，佛狸祠下，一片神鸦社鼓。（《永遇乐•京口北固亭怀古》）
          - ancient: 箫鼓追随春社近，衣冠简朴古风存。（《游山西村》）
      - trans: ❸更的代称。古代夜间击鼓计时，""一鼓""即"一更"，—夜击五次。
        sentences:
          - ancient: 四鼓，（李）愬(shuo4)至城下，无一人知者。（《资治通鉴•唐纪五十六》）
          - ancient: 戊申晦，五鼓，与子颖坐曰观亭，待曰出。（《登泰山记》）
  - word: 鼓
    type: 【动词】
    phonetic: gu3
    tags:
      - 高中
    samples:
      - trans: ❶弹奏;敲击（乐器）。
        sentences:
          - ancient: 秦王饮酒酣，曰："寡人窃闻赵王好音，请奏瑟。"赵王鼓瑟。（《廉颇蔺相如列传》）
          - ancient: 虎鼓瑟兮鸾回车，仙之人兮列如麻。（《梦游天姥吟留别》）
          - ancient: 某年月日，秦王与赵王会饮，令赵王鼓瑟。（《廉颇蔺相如列传》）
          - ancient: 呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。（《短歌行》）
      - trans: ❷敲击战鼓，发出进攻号令。
        sentences:
          - ancient: 公与之乘，战于长勺。公将鼓之。（《曹刿论战》）
          - ancient: 填然（形容鼓声）鼓之，兵刃既接，弃甲曳兵而走。（《寡人之于国也》）
          - ancient: 夫战，勇气也。一鼓作气，再而衰，三而竭。（《曹刿论战》）
      - trans: ❸鼓起;凸出。
        sentences:
          - ancient: 遂鼓吻奋爪以向先生。（《中山狼传》）
      - trans: ❹振奋。
        sentences:
          - ancient: 吴儿善泅者数百，皆披发文身，手持十幅大彩旗，争先鼓勇，溯迎而上。（《观潮》）	固
      - trans: ❺击鼓奏乐。
        sentences:
          - ancient: 今王鼓乐于此，百姓闻王钟鼓之声，管籥（籥yue4，笙箫之类的乐器）之音，举疾首蹙额而相告。（《庄暴见孟子》）
      - trans: ❻振动。
        sentences:
          - ancient: 郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。（《石钟山记》）
  - word: 鼓
    type: 【名词】
    phonetic: gu3
    tags:
      - 高中
    samples:
      - trans: 【量词】古代计量单位，四钧为一石，四石为一鼓。
        sentences:
          - ancient: 遂赋晋国一鼓铁，以铸刑鼎。（《左传•昭公二十九年》）
