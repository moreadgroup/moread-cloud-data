鼓gu3
【名词】❶一面或两面蒙着皮革的打击乐器。
【例句】霾（通"埋"）两轮兮絷（zhi2用绳索拴住马足）四马,援玉枹（fu2，鼓槌）兮击鸣鼓。（战国楚•屈原《九歌•国殇》）「余方心动欲还，而大声发于水上，噌吰（cheng1hong2,形容钟声）如钟鼓不绝。（《石钟山记》）
❷鼓声。
【例句】可堪回首，佛狸祠下，一片神鸦社鼓。（《永遇乐•京口北固亭怀古》）丨箫鼓追随春社近，衣冠简朴古风存。（《游山西村》）
❸更的代称。古代夜间击鼓计时，""一鼓""即"一更",—夜击五次。
【例句】四鼓，（李）愬(shuo4)至城下,无一人知者。（《资治通鉴•唐纪五十六》）丨戊申晦，五鼓，与子颖坐曰观亭，待曰出。（《登泰山记》）

【动词】❶弹奏;敲击（乐器）。
【例句】秦王饮酒酣，曰："寡人窃闻赵王好音，请奏瑟。"赵王鼓瑟。（《廉颇蔺相如列传》）丨虎鼓瑟兮鸾回车,仙之人兮列如麻。（《梦游天姥吟留别》）丨某年月日，秦王与赵王会饮,令赵王鼓瑟。（《廉颇蔺相如列传》）丨呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。（《短歌行》）
❷敲击战鼓，发出进攻号令。
【例句】公与之乘，战于长勺。公将鼓之。（《曹刿论战》）丨填然（形容鼓声）鼓之，兵刃既接，弃甲曳兵而走。（《寡人之于国也》）丨夫战，勇气也。一鼓作气,再而衰，三而竭。（《曹刿论战》）
❸鼓起;凸出。
【例句】遂鼓吻奋爪以向先生。（《中山狼传》）
4振奋。
【例句】吴儿善泅者数百，皆披发文身，手持十幅大彩旗，争先鼓勇，溯迎而上。（《观潮》）	固
❺击鼓奏乐。
【例句】今王鼓乐于此，百姓闻王钟鼓之声，管籥（籥yue4,笙箫之类的乐器）之音,举疾首蹙额而相告。（《庄暴见孟子》）
❻振动。
【例句】郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。（《石钟山记》）

【量词】古代计量单位，四钧为一石，四石为一鼓。
【例句】遂赋晋国一鼓铁，以铸刑鼎。（《左传•昭公二十九年》）

