---
words:
  - word: 事
    type: 【名词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶事情。
        sentences:
          - ancient: 此人皆意有所郁结，不得通其道，故述往事，思来者。（《报任安书》）
          - ancient: 若事之不济（成功），此乃天也，安能复为之下乎？（《资治通鉴•汉纪五十七》）
          - ancient: 天下事有难易乎？（《为学》）
          - ancient: 事所以不成者，乃欲以生劫之，必得约契以报太子也。（《荆轲刺秦王》）
      - trans: ❷职务;职业。
        sentences:
          - ancient: 然则无功而受事，无爵而显荣。（《韩非子•五蠹》）
          - ancient: 樊哙，沛人也，以屠狗为事。（《汉书•樊哙传》）
      - trans: ❸事故;变故。
        sentences:
          - ancient: 是故无<事>则国富，有<事>则兵强。（《韩非子•五蠹》）

      - trans: ❹专指战事。
        sentences:
          - ancient: 冉有、季路见于孔子曰："季氏将有事于颛臾。"（《季氏将伐颛臾》）

  - word: 事
    type: 【动词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶从事;做。
        sentences:
          - ancient: 如曰今日当一切不<事>事（前一"事"为动词，做;后一"事"为名词，事情），守前所为而已，则非某之所敢知（承认）。（宋•王安石《答司马谏议书》）
          - ancient: 居数月，漠然无所事。（《狱中杂记》）
          - ancient: 常有大度，不事家人生产作业。（《史记•高祖本纪》）
      - trans: ❷侍奉;服侍。
        sentences:
          - ancient: 臣所以去（离开）亲戚而事君者，徒慕君之高义也。（《廉颇蔺相如列传》）
          - ancient: 安能摧眉折腰事权贵，使我不得开心颜！（《梦游天姥吟留别》）
          - ancient: 君为我呼入，吾得兄事之。（《鸿门宴》）
          - ancient: 谢家事夫婿，中道还兄门。（《孔雀东南飞》）
          - ancient: 【高考题例】吴起于是闻魏文侯贤，欲事之。（《史记•孙子吴起列传》）
          - ancient: 延熹中，桓帝事黄老道，悉毁诸房祀。（《后：汉书•王涣传》）
      - trans: ❸供奉。
        sentences:
          - ancient: 【高考题例】今舍我去，愿得只履事之，以慰我思！（明•宋濂《吴德基传》）
      - trans: ❹任用。
        sentences:
          - ancient: 境内之杰不事，而求封外（国境以外）之士。（《韩非子•亡征》）

  - word: 事
    type: 【量词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: 件;样。
        sentences:
          - ancient: 对月五六人，管弦三两事。（唐•白居易《张常侍池凉夜闲燕赠诸公》）