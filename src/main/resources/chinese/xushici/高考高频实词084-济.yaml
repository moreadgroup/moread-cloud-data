---
words:
  - word: 济
    type: 【动词】
    phonetic: ji4
    tags:
      - 高中
    samples:
      - trans: ❶过河;渡水。
        sentences:
          - ancient: 朝济而夕设版（筑土墙用的夹板）焉，君之所知也。（《烛之武退秦师》）
          - ancient: 欲济无舟楫，端居耻圣明。（《望洞庭湖赠张丞相》）
      - trans: ❷完成;成就。
        sentences:
          - ancient: 若事之不济，此乃天也，安能复为之下乎！（《资治通鉴•汉纪五十七》）
          - ancient: 探石发穴，靡计不施，迄（qi4，始终）无济。（《促织》）
          - ancient: 鲍叔乃誓曰："事之济也，听我令;事之不济也，免公子者为上，死者为下。"（《管子•大匡》）
          - ancient: 【高考题例】纵事勿济，吾年足死矣，不死不足报国。（《明史・韩文传》）
          - ancient: 【高考题例】金人虽不吾索，吾当与之俱行，求见二酋面责之，庶或万一可济。（《宋史•孙傅传》）
      - trans: ❸帮助;接济。
        sentences:
          - ancient: 三顾频烦天下计，两朝开济老臣心。（《蜀相》）
          - ancient: 先生岂有志于济物哉？（《中山狼传》）
      - trans: ❹加上。
        sentences:
          - ancient: 若不胜狄，虽济其罪，可也。（《国语•晋语一》）
          - ancient: 【高考题例】今又济之以雪，岂亦表其高洁之志行也欤？（明•杜琼《雪屋记》）
      - trans: ❺得益;补益。
        sentences:
          - ancient: 断木为杵，掘地为臼，臼杵之利，万民以济。（《周易•系辞下》）
          - ancient: 【高考题例】宽猛相济，圣人之训。（《宋史•范纯礼传》）

