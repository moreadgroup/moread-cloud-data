徐Xu2
【名词】古诸侯国名。故址在今安徽泗县。
【例句】徐君使容居来吊含。（《礼记•檀弓下》）

【形容词】缓慢。
【例句】清风徐来，水波不兴。（《赤壁赋》）丨莫听穿林打叶声，何妨吟啸且徐行。（苏轼《定风波•莫听穿林打叶声》）丨自可断来信,徐徐更谓之。（《孔雀东南飞》）
