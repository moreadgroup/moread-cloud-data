---
words:
  - word: 乃
    type: 【代词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶人称代词。你，你们;你的，你们的。
        sentences:
          - ancient: 王师北定中原曰，家祭无忘告乃翁。（《示儿》）
          - ancient: 与尔三矢，尔其无忘乃父之志！（《伶官传序》）
      - trans: ❷指示代词。这样;如此。
        sentences:
          - ancient: 真长性至峭，何足乃重？（《世说新语•赏誉》）
          - ancient: 夫我乃行之，反而求之，不得吾心。（《齐桓晋文之事》）
          - ancient: 【高考题例】若乃名者，方为薄世笑骂，仆脆怯，尤不足当也。 （《答严厚舆秀才论为师道书》）
  - word: 乃
    type: 【副词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶表示肯定。就是;原来是。
        sentences:
          - ancient: 所谓华山洞者，以其乃华山之阳名之也。（《游褒禅山记》）
          - ancient: 夫人情莫不贪生恶死，念父母，顾妻子，至激于义理者不然，乃有所不得已也。（《报任安书》）
          - ancient: 臣乃市井鼓刀屠者，而公子亲数存（问候）之。（《史记.魏公子列传》）
          - ancient: 【高考题例】文日："此乃吾所以居子之上也。"（《史记•孙子吴起列传》）
      - trans: ❷表示范围的限定。只;仅仅。
        sentences:
          - ancient: 夫我乃行之，反而求之，不得吾心。（《齐桓晋文之事》）
          - ancient: 天下胜者众矣，而霸者乃五。（《吕氏春秋•义赏》叫至东城，乃有二十八骑。（《项羽之死》）
      - trans: ❸表示时间的衔接，就。
        sentences:
          - ancient: 老臣今者殊不欲食，乃自强步。（《触龙说赵太后》）
          - ancient: 荆轲知太子不忍，乃遂私见樊於期。（《荆轲刺秦王》）
          - ancient: 秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。（《烛之武退秦师》）
          - ancient: 【高考题例】乃短贾生日："洛阳之人，年少初学，专欲擅权，纷乱诸事。"（《史记•屈原贾生列传》）
      - trans: ❹表示两事情理相悖或事出意外。却;竟然。
        sentences:
          - ancient: 问今是何世，乃不知有汉，无论魏晋。（《桃花源记》）
          - ancient: 而陋者乃以斧斤考击而求之，自以为得其实。（《石钟山记》）
          - ancient: 今君乃亡赵走燕，燕畏赵，其势必不敢留君，而束君归赵矣。（《廉颇蔺相如列传》）
          - ancient: 巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤!（《师说》）
          - ancient: 【高考题例】后怒解，方被引入，谓日："公意乃尔，朕复何望!"（《北史•来护儿传》）
      - trans: ❺表示初、始。
        sentences:
          - ancient: 古之王者，太子乃生，固举之礼。（《大戴礼记•保傅》）
      - trans: ❻才。
        sentences:
          - ancient: 至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。（《送东阳马生序》）
          - ancient: 事如此，此必及我，见犯乃死，重负国。（《苏武传》）
          - ancient: 精思傅会，十年乃成。（《张衡传》）
          - ancient: 至于鞭箠之间，乃欲引节，斯不亦远乎！（《报任安书》）
          - ancient: 【高考题例】吴起乃自知弗如田文。（《史记•孙子吴起列传》）
  - word: 乃
    type: 【连词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶表示承接。于是;便。
        sentences:
          - ancient: 以为诸侯莫足游者，乃西入关见卫将军。（《史记•平津侯主父列传》）
          - ancient: 政通人和，百废具兴，乃重修岳阳楼。（《岳阳楼记》）
      - trans: ❷表示假设，如果。
        sentences:
          - ancient: 乃越逐，不复，汝则有常刑！（《尚书•费誓》）
