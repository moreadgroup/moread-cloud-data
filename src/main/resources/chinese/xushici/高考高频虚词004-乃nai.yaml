---
words:
  - word: 乃
    type: 【代词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶人称代词。你，你们;你的，你们的。
        sentences:
          - ancient: 王师北定中原曰，家祭无忘告<乃>翁。（《示儿》）
            url: xxxx
            vernacular: 当大宋军队收复了中原失地的那一天时，你们举行家祭时不要忘了告诉我！
          - ancient: 与尔三矢，尔其无忘<乃>父之志！（《伶官传序》）
            url: xxxx
            vernacular: 交给你三支箭，你不要忘记你父亲报仇的志向。
      - trans: ❷指示代词。这样;如此。
        sentences:
          - ancient: 真长性至峭，何足<乃>重？（《世说新语•赏誉》）
            url: xxxx
            vernacular: 刘惔性情很是苛刻，哪里值得如此被人敬重？
          - ancient: 夫我<乃>行之，反而求之，不得吾心。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 我这样做了，回头再去想它，却想不出是为什么。
          - ancient: 【高考题例】若<乃>名者，方为薄世笑骂，仆脆怯，尤不足当也。 （《答严厚舆秀才论为师道书》）
            url: xxxx
            vernacular: 如果是个名人，将要被刻薄的世人讥笑辱骂，我脆弱胆怯，更加不能承受。
  - word: 乃
    type: 【副词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶表示肯定。就是;原来是。
        sentences:
          - ancient: 所谓华山洞者，以其<乃>华山之阳名之也。（《游褒禅山记》）
            url: xxxx
            vernacular: 是人们所说的华山洞，因为它在华山南面而这样命名。
          - ancient: 夫人情莫不贪生恶死，念父母，顾妻子，至激于义理者不然，<乃>有所不得已也。（《报任安书》）
            url: xxxx
            vernacular: 人之常情，没有谁不贪生怕死的，都挂念父母，顾虑妻室儿女，至于那些激愤于正义公理的人当然不是这样，这里有迫不得已的情况
          - ancient: 臣<乃>市井鼓刀屠者，而公子亲数存（问候）之。（《史记.魏公子列传》）
            url: xxxx
            vernacular: 我是在市井中操刀的屠夫，公子你却亲自多次来看望我。
          - ancient: 【高考题例】文日："此<乃>吾所以居子之上也。"（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 这就是为什么我的地位在你之上的原因
      - trans: ❷表示范围的限定。只;仅仅。
        sentences:
          - ancient: 夫我<乃>行之，反而求之，不得吾心。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 我这样做了，回头再去想它，却想不出是为什么。
          - ancient: 天下胜者众矣，而霸者<乃>五。（《吕氏春秋•义赏》）
            url: xxxx
            vernacular: 天下取得胜利的人很多，而成就霸业的只有五个
          - ancient: 至东城，<乃>有二十八骑。（《项羽之死》）
            url: xxxx
            vernacular: 到达东城，这时就只剩下二十八人。
      - trans: ❸表示时间的衔接，就。
        sentences:
          - ancient: 老臣今者殊不欲食，<乃>自强步。（《触龙说赵太后》）
            url: xxxx
            vernacular: 我现在特别不想吃东西，自己却勉强走走
          - ancient: 荆轲知太子不忍，<乃>遂私见樊於期。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲知道太子不忍心，于是私下里悄悄地去见樊於期
          - ancient: 秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，<乃>还。（《烛之武退秦师》）
            url: xxxx
            vernacular: 秦伯很高兴，与郑国订立盟约，委派杞子、逢孙、杨孙戍守郑国，自己就率军回国。
          - ancient: 【高考题例】<乃>短贾生日："洛阳之人，年少初学，专欲擅权，纷乱诸事。"（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 于是说贾谊坏话道："洛阳之人，年轻学浅，一味独揽权力，使事情变得复杂混乱"
      - trans: ❹表示两事情理相悖或事出意外。却;竟然。
        sentences:
          - ancient: 问今是何世，<乃>不知有汉，无论魏晋。（《桃花源记》）
            url: xxxx
            vernacular: 他们问渔人现在是什么朝代，他们竟然不知道有过汉朝，更不必说魏晋两朝了。
          - ancient: 而陋者<乃>以斧斤考击而求之，自以为得其实。（《石钟山记》）
            url: xxxx
            vernacular: 然而浅陋的人竟然用斧头敲打石头来寻求石钟山得名的原因，自以为得到了石钟山命名的真相。
          - ancient: 今君<乃>亡赵走燕，燕畏赵，其势必不敢留君，而束君归赵矣。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 现在您是从赵国逃亡到燕国去燕国惧怕赵国，这种形势下燕王必定不敢收留您，而且还会把您捆绑起来送回赵国。
          - ancient: 巫医乐师百工之人，君子不齿，今其智<乃>反不能及，其可怪也欤!（《师说》）
            url: xxxx
            vernacular: 巫医乐师和各种工匠这些人，君子们不屑一提，现在他们的见识竟反而赶不上（这些人），真是令人奇怪啊!
          - ancient: 【高考题例】后怒解，方被引入，谓日："公意<乃>尔，朕复何望!"（《北史•来护儿传》）
            url: xxxx
            vernacular: 稍后怒气缓解，才叫人引进，对护儿说:“公意既然如此，朕还有什么指望呢?”
      - trans: ❺表示初、始。
        sentences:
          - ancient: 古之王者，太子<乃>生，固举之礼。（《大戴礼记•保傅》）
            url: xxxx
            vernacular: 古代英明的君主，在太子诞生时，就举行礼仪
      - trans: ❻才。
        sentences:
          - ancient: 至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而<乃>和。（《送东阳马生序》）
            url: xxxx
            vernacular: 回到学舍，四肢僵硬动弹不得。服侍的人拿着热水为我洗浴，用被子裹着我，很久才暖和起来。
          - ancient: 事如此，此必及我，见犯<乃>死，重负国。（《苏武传》）
            url: xxxx
            vernacular: 事情到了如此地步，这样一定会牵连到我们，受到侮辱才去死，更对不起国家！
          - ancient: 精思傅会，十年<乃>成。（《张衡传》）
            url: xxxx
            vernacular: （他）精心构思润色，用了十年才完成。
          - ancient: 至于鞭箠之间，<乃>欲引节，斯不亦远乎！（《报任安书》）
            url: xxxx
            vernacular: 到了挨打受刑的时候，才想到伸张士大夫的名节，这种愿望和现实不是相距太远了吗？
          - ancient: 【高考题例】吴起<乃>自知弗如田文。（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 吴起才自知比不上田文。
  - word: 乃
    type: 【连词】
    phonetic: nai3
    tags:
      - 高中
    samples:
      - trans: ❶表示承接。于是;便。
        sentences:
          - ancient: 以为诸侯莫足游者，<乃>西入关见卫将军。（《史记•平津侯主父列传》）
            url: xxxx
            vernacular: 他认为各诸侯国都不值得去游学，就西入函谷关，去见大将军卫青。
          - ancient: 政通人和，百废具兴，<乃>重修岳阳楼。（《岳阳楼记》）
            url: xxxx
            vernacular: 政治清明通达，人民安居和顺，各种荒废的事业都兴办起来了，于是重新修建岳阳楼
      - trans: ❷表示假设，如果。
        sentences:
          - ancient: <乃>越逐，不复，汝则有常刑！（《尚书•费誓》）
            url: xxxx
            vernacular: 如果你们越境去追逐，而不回来，那么我将惩罚你们！
