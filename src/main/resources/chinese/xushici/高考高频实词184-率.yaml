率shuai4
【名词】❶表率;楷模。
【例句】乡子弟力田为人率者几何人？（《管子•问》）
❷通"帅"。军中统帅。
【例句】王之将率有如子路者乎？（《史记•孔子世家》）

【动词】❶遵循;遵从。
【例句】此吾所以敢率性就死不顾汝也。（清•林觉民《与妻书》）丨《诗》云"匪兕匪虎，率彼旷野"。（《史记•孔子世家》）
❷率领;带领。
【例句】遂率子孙荷担者三夫，叩石垦壤，箕畚（ji1ben3,簸箕和笸箩，两种装土石的工具）运于渤海之尾。（《愚公移山》）丨将军身率益州之众出于秦川，百姓孰敢不箪食壶浆（箪dan1,用竹器盛着饭，用壶装酒水）以迎将军者乎?（《隆中对》）丨率疲弊之卒，将数百之众。（《过秦论》）
❸给……做榜样。
【例句】菲薄衣食，躬率群下。（《后汉书•和熹邓皇后纪》）

【形容词】直率;坦率。
【例句】率心奉上，不顾嫌疑。（《魏书•张衮传》）

【副词】❶大概:一般。
【例句】古诗率以四言为体。（《全晋文•文章流别论》）丨至于梁、陈间，率不过嘲风雪、弄花草而已。（唐•白居易《与元九书》）丨汉与匈奴和亲，率不过数岁即背约，不如勿许。（《汉书•韩安国传》）
❷一概;一律。
【例句】六国互丧，率赂秦耶？（《六国论》）丨吴主饮群臣酒,不问能否，率以七升为限。（《资治通鉴•晋纪二》）
【介词】由于；因为。
【例句】争城以战，杀人盈城，此所谓率土地而食人肉，罪不容于死。（《孟子•离娄上》）
