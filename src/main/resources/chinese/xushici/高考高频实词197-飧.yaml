      - trans: ❷熟食。
        sentences:
          - ancient: "盘<飧>市远无兼味，樽酒家贫只旧醅（pei1，没有过滤的酒）。（《客至》）"
            url: xxxx
            vernacular: 离集市太远盘中没好菜肴，家境贫寒只有隔年的陈酒招待。
