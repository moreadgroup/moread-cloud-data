奏ZOU4
【名词】奏章。
【例句】文吏试笺奏。（《后汉书•胡广传》）
【动词】❶进;运。
【例句】手之所触，肩之所倚，足之所履，膝之所踦，砉然（砉xu1,形容皮骨相离声）向然，奏刀騞然（huo1,形容刀割物开裂的声音），莫不中音。（《庄子,•葬生主》）
❷进献;呈献。
【例句】轲既取图奏之，发图，图穷而匕首见。（《荆轲刺秦王》）丨秦王坐章台（秦宫中台名）见相如，相如奉璧奏秦王。（《廉颇蔺相如列传》）
❸向君主进言或上书;上奏。
【例句】奏对称旨（合乎旨意）。（清•梁启超《谭嗣同》）
【高考题例】贬谪元祐诸臣，奏发司马光墓。（《宋史•许将传》）丨宰相李揆矜（夸耀）能忌贤，以休烈修国史与己齐列，嫉之，奏为国子祭酒。（《旧唐书•于休烈传》）
❹弹奏（乐器）；演奏（乐曲）。
【例句】秦王饮酒酣，曰："寡人窃闻赵王好音，请奏瑟。"卒（《廉颇蔺相如列传》）丨杨意不逢,抚凌云（司马相如的《大人赋》）而自惜;钟期既遇，凑流水以荷惭？（《滕王阁序》）
