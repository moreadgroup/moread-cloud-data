      - trans: ❶赠给;送给。
        sentences:
          - ancient: "静女其娈（luan2,容貌美好），<贻>我彤管。（《诗经·邶风·静女》）"
            url: xxxx
            vernacular: 娴静姑娘真娇艳，送我一枝红彤管。
          - ancient: 余嘉其能行古道，作《师说》以<贻>之。（《师说》）
            url: xxxx
            vernacular: 我赞许他能够遵行古人从师的途径，写这篇《师说》来赠送他。
          - ancient: 东土以集，周公归报成王，乃为诗<贻>王，命之曰《鸱鸮chīxiāo》。（《史记•鲁周公世家》）
            url: xxxx
            vernacular: 帝国东部安定以后，周公班师回朝，回报成王，并作诗赠给成王，其诗名为《鸱鸮》寓意不是太好
          - ancient: 【高考题例】帝兼旬不返，傅屡<贻>书请之。（《宋史•孙傅传》）；
            url: xxxx
            vernacular: 二十天了皇帝也没有返回，孙傅多次写信请求金国送还皇帝。
      - trans: ❷遗留。
        sentences:
          - ancient: 我之怀矣，自<贻>伊戚。（《左传•宣公二年》）
            url: xxxx
            vernacular: 我如此思念夫君，给自己带来忧伤。
