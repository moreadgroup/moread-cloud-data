贻yi2
【动词】丨❶赠给;送给。
【例句】静女其娈（luan2,容貌美好），贻我彤管。（《诗经·邶风·静女》）丨余嘉其能行古道，作《师说》以贻之。（《师说》）丨东土以集，周公归报成王，乃为诗贻王，命之曰《鸱鸮chīxiāo》。（《史记•鲁周公世家》）

【高考题例】帝兼旬不返，傅屡贻书请之。（《宋史•孙傅传》）；

❷遗留。
【例句】我之怀矣，自贻伊戚。（《左传•宣公二年》）