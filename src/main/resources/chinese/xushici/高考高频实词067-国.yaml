国guo2
【名词】❶国家；周代指诸侯国。
【例句】夫大国，难测也,惧有伏（埋伏）焉。（《曹刿论战》）丨越国以鄙远（以遥远的地方做边境），君知其难也。（《烛之武退秦师》,）丨人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善。（宋•王安石《答司马谏议书》）丨思国之安者,必积其德义。（《谏太宗十思疏》）丨小楼昨夜又东风,故国不堪回首月明中。（《虞美人•春花秋月何时了》）丨诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。（《陈情表》）
❷战国时公卿和汉以后王侯的封地。
【例句】孟尝君就（前往）国于薛。（《战国策•齐策四》）丨汉兴，天子之政行午郡，不行于国。（唐•柳宗元《封建论》）丨丘（孔子自称）也闻有国有家者，不患寡而患不均，不患贫而患不安。（《季氏将伐颛臾》）丨四月，兵罢戏下，诸侯各就国。（《史记•高祖本纪》）
❸国都;京城。
【例句】先王之制，大都不过参国之一。（《左传•隐公元年》）丨国破山河在,城春草木深。（《春望》）丨登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。（《岳阳楼记》）
❹地区;地域。
【例句】逝将去女（通""汝"，你），适彼乐国。（《诗经•魏风•硕鼠》）丨荆见北据汉、沔，利尽南海，东连吴会，西通巴、蜀，此用武之国。（《隆中对》）丨红豆生南国，春来发几枝?（《相思》）
