---
words:
  - word: 孰
    type: 【动词】
    phonetic: shu2
    tags:
      - 高中
    samples:
      - trans: 后来作"熟"。❶成熟。
        sentences:
          - ancient: 高者不旱，下者不水，寒暑和节，而五谷以时孰，是天下之事也。（《荀子•富国》）
      - trans: ❷深思熟虑。
        sentences:
          - ancient: 行不可不孰。（《吕氏春秋•慎行》）
      - trans: ❸煮熟。
        sentences:
          - ancient: 宰夫胹（煮）熊蹯（熊掌）不孰。（《左传•宣公二年》）

  - word: 孰
    type: 【形容词】
    phonetic: shu2
    tags:
      - 高中
    samples:
      - trans: 同"熟"。仔细，周详。
        sentences:
          - ancient: 明日徐公来，孰视之，自以为不如。（《邹忌讽齐王纳谏》）
          - ancient: 唯大王与群臣孰计议之。（《廉颇蔺相如列传》）

  - word: 孰
    type: 【代词】
    phonetic: shu2
    tags:
      - 高中
    samples:
      - trans: ❶用于问人。谁。
        sentences:
          - ancient: 丈人曰："四体不勤，五谷不分，孰为夫子？"（《论语•微子》）
          - ancient: 尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？（《游褒禅山记》）
          - ancient: 人非生而知之者，孰能无惑？（《师说》）
          - ancient: 【高考题例】若挟天子保许昌，杖大威以羽檄征四方兵,孰敢不从！（《晋书•鲁芝传》）
      - trans: ❷用于问事物。什么。
        sentences:
          - ancient: 是可忍也,孰不可忍也？（《论语•八侑》）
      - trans: ❸用于比较。哪个。
        sentences:
          - ancient: 礼与食孰重？（《孟子•告子下》）
      - trans: ❹怎么。
        sentences:
          - ancient: 何方圜之能周兮？夫孰异道而相安？（《离骚》）