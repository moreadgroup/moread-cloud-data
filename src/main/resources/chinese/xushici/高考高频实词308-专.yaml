专zhuan1
【动词】❶独占;独有;独掌。
【例句】衣食所安，弗敢专也，必以分人。（《曹刿论战》）丨夫然，则天下莫能争是溪，予得专而名焉。（唐•柳宗元《愚溪诗序》）丨灵公既立，赵盾益专国政。（《史记•赵世家》）
【高考题例】臣既受命专斧钺之威，臣不敢生还，愿君亦垂一言之命于臣。（《六韬》）
❷擅自行事;独断专行。
【例句】此妇无礼节,举动自专由。（《孔雀东南飞》）丨奉事循公姥，进止敢自专？（《孔雀东南飞》）
【形容词】专一；专心。
【例句】其业有不精、德有不成者，非天质之卑（低下），则心不若余之专耳，岂他人之过哉？（《送东阳马生序》）丨然后叹借者之用心专，而少时之岁月为可惜也。（《黄生借书说》）
【副词】❶专门。
【例句】向（先前）察众人之议，专欲误将军，不足与图大事。（《资治逼鉴•汉纪五十七》）丨闻道有先后，术业有专攻，如是而已。（《师说》）丨专以射为戏,竟死。（《史记•李将军列传》）
【高考题例】洛阳之人，年少初学，专欲擅权，纷乱诸事。（《史记•屈原贾生列传》）
	
❷独自。
【例句】迩年（近年）狱讼,情稍重，京兆、五城即不敢专决。（《狱中杂记》）