---
words:
  - word: 势
    type: 【名词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶力量。
        sentences:
          - ancient: 此所谓强弩之末，<势>不能穿鲁縞者也。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 强弩发射出去的箭，到最后，连薄薄的绢都穿透不了。比喻强大的力量已衰竭，不起作用。
      - trans: ❷权力；势力。
        sentences:
          - ancient: 如此则荆、吴之<势>强，鼎足之形成矣。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 那么荆州和东吴的势力也就加强了，三足鼎立的局面也得以成形。
          - ancient: 然秦以区区（很小）之地，致（取得）万乘之<势>。（《过秦论》）
            url: xxxx
            vernacular: 然而秦凭借着它的小小的地方，发展到兵车万乘的国势
          - ancient: 依倚将军<势>，调笑酒家胡。（汉•辛延年《羽林郎》）
            url: xxxx
            vernacular: 他不过是狗仗人势的豪门恶奴，依倚着霍家的将军势力，调笑一位卖酒的少数民族女子。
          - ancient: 夫六国与秦皆诸侯，其<势>弱于秦。（《六国论》）
            url: xxxx
            vernacular: 六国和秦国都是诸侯之国，六国单个的势力虽然比秦国弱
      - trans: ❸形势;趋势。
        sentences:
          - ancient: 虽有智慧，不如乘<势>；虽有镃基，不如待时。（《孟子•公孙丑上》）
            url: xxxx
            vernacular: 虽有才智，不如依靠好形势好运气；就像虽有锄头，不如依靠好天时一样。
          - ancient: 仁义不施而攻守之<势>异也。（《过秦论》）
            url: xxxx
            vernacular: 就因为不施行仁政而使攻守的形势发生了变化啊。
          - ancient: 今君乃亡赵走燕，燕畏赵，其<势>必不敢留君，而束君归赵矣。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 现在您是从赵国逃亡到燕国去，燕国惧怕赵国，这种形势下燕王必定不敢收留您，而且还会把您捆绑起来送回赵国。
          - ancient: 由此言之，勇怯，<势>也;强弱，形也。（《报任安书》）
            url: xxxx
            vernacular: 照这样说来，勇敢或怯懦，乃是形势所造成；坚强或懦弱，也是形势所决定。
          - ancient: 有如此之<势>，而为秦人积威之所劫，日削月割掉，以趋于亡。（《六国论》）
            url: xxxx
            vernacular: 有这样的有利形势，却被秦国积久的威势所胁迫，天天割地，月月割地，以至于走向灭亡。
      - trans: ❹气势。
        sentences:
          - ancient: 天姥连天向天横，<势>拔五岳掩赤城。（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 天姥山高耸入云，连着天际，横向天外；山势高峻超过五岳，遮掩过赤城山。
      - trans: ❺姿势。
        sentences:
          - ancient: 罔（无）不因<势>象形，各具情态。（《核舟记》）
            url: xxxx
            vernacular: 没有一件不是就着木头原来的样子摹拟某种东西的形状的，各有各的神情姿态。
      - trans: ❻男性生殖器。
        sentences:
          - ancient: 淫者割其<势>。（《晋书•刑法志》）
            url: xxxx
            vernacular: 《晋书·刑法志》云:“淫者割其势。”“去势”，就是将睾丸去掉。 去势最初是兽医的专用名词，是用在对动物(主要是家禽家畜)的外科绝育手术上，摘除其主要生殖器官。
