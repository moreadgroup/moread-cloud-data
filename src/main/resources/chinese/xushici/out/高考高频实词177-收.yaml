---
words:
  - word: 收
    type: 【名词】
    phonetic: shou1
    tags:
      - 高中
    samples:
      - trans: ❶收成。
        sentences:
          - ancient: 百亩之<收>，不过百石（古代容量单位，十斗为一石）。（汉•晁错《论贵粟疏》）
            url: xxxx
            vernacular: 百亩的收成，不超过百石。
      - trans: ❷收藏物。
        sentences:
          - ancient: 燕赵之<收>藏。（《阿房宫赋》）
            url: xxxx
            vernacular: 燕赵国家收藏的金玉珍宝
  - word: 收
    type: 【动词】
    phonetic: shou1
    tags:
      - 高中
    samples:
      - trans: ❶拘捕。
        sentences:
          - ancient: 此宜无罪，女反<收>之。（《诗经•大雅•瞻卬》）
            url: xxxx
            vernacular: 这人原本无罪过，你却反目来拘捕。
          - ancient: 单于壮其节，朝夕遣人候问武，而<收>系张胜。（《苏武传》）
            url: xxxx
            vernacular: 单于认为苏武的气节值得敬佩，早晚派人探望、问候苏武，而把张胜逮捕监禁起来。
          - ancient: （张）衡下车（指官吏初到任），治威严，整法度，阴知奸党名姓，一时<收>禽（通"擒"），上下肃然，称为政理。（《张衡传》）
            url: xxxx
            vernacular: 张衡上任之后治理严厉，整饬法令制度，暗中探得奸党的姓名，一下子同时逮捕，拘押起来，于是上下敬畏恭顺，称赞政事处理得好。
          - ancient: 【高考题例】憙下车，闻其二孙杀人事未发觉，即穷诘其奸，<收>考子春，二孙自杀。（《后汉书•赵憙传》）
            url: xxxx
            vernacular: 憙下车（到任），闻其二孙杀人事未发觉（被发现觉察，暴露，败露），即穷诘（深究问责）其奸，收考（拘捕拷问）（李）子春，二孙自杀。
      - trans: ❷收集;收取。
        sentences:
          - ancient: 必死是间，余<收>尔骨焉。（《左传•僖公三十二年》）
            url: xxxx
            vernacular: 一定会死在这两座山之间的峡谷中，我准备到那里去收你的尸骨！
          - ancient: <收>天下之兵（兵器），聚之咸阳。（《过秦论》）
            url: xxxx
            vernacular: 收缴天下的兵器，集中在咸阳
          - ancient: 燕赵之<收>藏，韩魏之经营。（《阿房宫赋》）
            url: xxxx
            vernacular: 燕赵、韩魏国家收藏的金玉珍宝
          - ancient: 东割膏腴之地，北<收>要害之郡。（《过书秦论》）
            url: xxxx
            vernacular: 向东割取了肥沃的土地，向北占据了重大的城邑。
          - ancient: 秦将王翦破赵，虏赵王，尽<收>其地，进兵北略地，至燕南界。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦国的将军王翦攻破赵国，俘虏赵王，大部分占领了赵国的国土，进军向北侵占土地，到达燕国南部的边界。
          - ancient: 剑外忽传<收>蓟北，初闻涕泪满衣裳。（《闻官军收河南河北》）
            url: xxxx
            vernacular: 剑外忽然传来收蓟北的消息，刚刚听到时涕泪满衣裳。
      - trans: ❸征收。
        sentences:
          - ancient: 十年不<收>于国，民俱有三年之食。（《勾践灭吴》）
            url: xxxx
            vernacular: 这样连续十年，国家不收赋税，老百姓都存有足够三年吃的粮食。
      - trans: ❹招收。
        sentences:
          - ancient: 行<收>兵。比至陈，车六七百乘，骑千余，卒数万人。 （《陈涉世家》）
            url: xxxx
            vernacular: 等到到达陈县，已有战车六七百辆，骑兵一千多，士兵好几万。
      - trans: ❺停止;结束。
        sentences:
          - ancient: 雷始<收>声。（《礼记•月令》）
            url: xxxx
            vernacular: “雷始收声”指的是秋分过去阳气转为阴气，因此雷声不再会出现
      - trans: ❻收获（农作物）。
        sentences:
          - ancient: 春生，夏长，秋<收>，冬藏。（《史记•太史公自序》）
            url: xxxx
            vernacular: 春天萌生，夏天滋长，秋天收获，冬天储藏。指农业生产的一般过程。亦比喻事物的发生、发展过程。
