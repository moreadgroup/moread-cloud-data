      - trans: 赞许;嘉奖。
        sentences:
          - ancient: 余<嘉>其能行古道，作《师说》以贻（yi2，赠送）之。（《师说》）
            url: xxxx
            vernacular: 我赞许他能够遵行古人从师的途径，写这篇《师说》来赠送他。
          - ancient: 上大<嘉>悦，诏赐抚臣名马衣缎。（《促织》）
            url: xxxx
            vernacular: 皇帝更加喜欢，便下诏赏给巡抚好马和锦缎。
          - ancient: 武帝<嘉>其义，乃遣武以中郎将使持节送匈奴使留在汉者。（《苏武传》）
            url: xxxx
            vernacular: 汉武帝赞许他这种通晓情理的做法，于是派遣苏武以中郎将的身份出使，持旄节护送扣留在汉的匈奴使者回国
          - ancient: 【高考题例】宣帝<嘉>之，赦而不诛，俄而起为并州刺史。（《晋书•鲁芝传》）
            url: xxxx
            vernacular: 宣帝对于鲁芝的表现表示赞许和嘉奖，因此赦免他的罪行，并且不予处罚，不久后提拔他为并州刺史。
