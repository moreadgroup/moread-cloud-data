          - ancient: <嘉>木异石错（交错）置，皆山水之奇者，以予故，咸以愚辱焉。（唐•柳宗元《愚溪诗序》）
            url: xxxx
            vernacular: 美好的树木和奇异的岩石参差错落。这些都是山水中瑰丽的景色，因为我的缘故都用愚字玷污了它们。
