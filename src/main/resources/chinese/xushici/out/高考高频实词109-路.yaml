---
words:
  - word: 路
    type: 【名词】
    phonetic: lu4
    tags:
      - 高中
    samples:
      - trans: ❶道路。
        sentences:
          - ancient: 缘溪行，忘<路>之远近。（《桃花源记》）
            url: xxxx
            vernacular: 他顺着溪水行船，忘记了路程的远近。
          - ancient: 无为在歧<路>，儿女共沾巾。（唐•王勃《送杜少府之任蜀州》）
            url: xxxx
            vernacular: 莫在岔路口上分手之时，像多情的少年男女那样悲伤得泪湿衣巾。
          - ancient: 回朕车以复<路>兮，及行迷之未远。（《离骚》）
            url: xxxx
            vernacular: 调转我的车走回我路啊，趁着迷途未远赶快罢休。
          - ancient: 问征夫以前<路>，恨晨光之熹微。（《归去来兮辞》）
            url: xxxx
            vernacular: 向行人打听前面的路，遗憾的是天亮得太慢。
      - trans: ❷途径；门路。
        sentences:
          - ancient: 以塞忠谏之<路>也。（《出师表》）
            url: xxxx
            vernacular: 以致于堵塞人们忠心地进行规劝的言路。
          - ancient: 无<路>请缨，等终军之弱冠;有怀投笔，慕宗悫之长风。（《滕王阁序》）
            url: xxxx
            vernacular: 虽然和终军年龄相等，却没有报国的机会；像班超那样有投笔从戎的豪情，也有宗悫“乘风破浪”的壮志。
          - ancient: 【高考题例】胸中磊落藏五兵，欲试无<路>空峥嵘（宋•陆游《题醉中所作草书卷后》）
            url: xxxx
            vernacular: 胸中自有军事谋略，想要试炼一番却没有门路，空怀豪情。
      - trans: ❸职位;政权。
        sentences:
          - ancient: 夫子当<路>于齐。（《孟子•公孙丑上》）
            url: xxxx
            vernacular: 先生如果在齐国当权
          - ancient: 当涂（道路）者升青云，失<路>者委沟渠。（汉•扬雄《解嘲》）
            url: xxxx
            vernacular: 当权的青云直上，落拓的委弃沟渠。
      - trans: ❹通"辂"。车。
        sentences:
          - ancient: 杜洩（人名）将以<路>葬。（《左传•昭公四年》）
            url: xxxx
            vernacular: xxxx
          - ancient: 彼尔维何？维常之华。彼<路>斯何？君子之车。（《诗经•小雅•采薇》）
            url: xxxx
            vernacular: 那盛开的花是什么？是棠棣之花。那很大很威武的车是什么？那是将士的军车
          - ancient: 筚<路>（驾着柴车）蓝缕，以启山林。（《左传•宣公十二年）），
            url: xxxx
            vernacular: 驾着简陋的车，穿着破烂的衣服去开辟山林.形容创业的艰苦.
      - trans: ❺行政区划名。宋时相当于现在的省;元时降为二等政区，隶属于省，与府相当。
        sentences:
          - ancient: 予除（拜官授职）右丞相兼枢密使，都督诸<路>军马。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 我官拜右丞相和枢密使，监察管理各路军队.除:被授予...官职.右丞/枢密使都是官职名.都督:监察管理.军马:军队马车.
          - ancient: 四十三年，望中犹记，烽火扬州<路>。（《永遇乐•京口北固亭怀古》）
            url: xxxx
            vernacular: 四十三年过去了，如今瞭望长江北岸，还记得扬州战火连天的情景。
          - ancient: 【高考题例】甫半岁，得善田二万六千顷，募士七千四百人，为他<路>最。（《宋史•何灌传》）
            url: xxxx
            vernacular: 不到半年，就得到了质量良好的耕地二万六千顷，招募到了弓箭手七千四百人，是其他行政路区相比是最成功的。
          - ancient: 东西异<路>，不当与，然安忍于旧治坐视？（《宋史•萧燧传》）
            url: xxxx
            vernacular: 东部西部不属同路，按说不该给粮食，但哪能忍心对原管辖地区不管不问呢?
          - ancient: 浩招辑流亡，开营田，以其规置颁示诸<路>。（《宋史•郭浩传》）
            url: xxxx
            vernacular: 郭浩召集逃亡流落在外的人，开辟耕地，将自己的规划安排发布各地。
  - word: 路
    type: 【形容词】
    phonetic: lu4
    tags:
      - 高中
    samples:
      - trans: 疲乏;羸弱。
        sentences:
          - ancient: 且一人之身而百工之所为备，如必自为而后用之，是率天下而<路>也。（《孟子•滕文公上》）
            url: xxxx
            vernacular: 一个人身上(所需的用品)要靠各种工匠来替他制备，如果必须一件一件地亲自做出来然后去使用它，这是率领天下的人疲于奔命。
