---
words:
  - word: 度
    type: 【名词】
    phonetic: du4
    tags:
      - 高中
    samples:
      - trans: ❶尺寸;计量长短的标准。
        sentences:
          - ancient: 已得履，乃曰："吾忘持<度>。"（《韩非子•外储说左上》）
            url: xxxx
            vernacular: 已经拿到鞋子，却说：“我忘记带量好的尺码了。”
          - ancient: 遂见东方君长，合时月正日，同律<度>量衡。（《史记・五帝本纪》）
            url: xxxx
            vernacular: 他就召见东方各诸侯，协调校正四时节气、月之大小、日之甲乙，统一音律和长度、容量、重量的标准
      - trans: ❷限度；尺度。
        sentences:
          - ancient: 生之有时而用之亡<度>，则物力必屈（尽）。（《论积贮疏》）
            url: xxxx
            vernacular: 生产东西有时节的限制，而消费它却没有限度，那么社会财富一定会缺乏。
          - ancient: 乐盘游，则思三驱以为<度>。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 喜爱狩猎，就想到网三面留一面
      - trans: ❸制度;法度。
        sentences:
          - ancient: 夫子知<度>与礼矣，我实纵欲而不能自克也。（《左传•昭公十年》）
            url: xxxx
            vernacular: （子产）他是知律令底线和人伦底线的，（而）我真是纵欲无度而不自醒啊。
          - ancient: 有司言淮南王长废先帝法，不听天子诏，居处毋<度>，出入拟于天子。（《史记•孝文本纪》）
            url: xxxx
            vernacular: 主管大臣报告淮南王刘长废弃先帝的法律，不听从皇帝的诏令，宫室居所超过规定的限度，出入车马仪仗比拟天子
          - ancient: 当是时也，商君佐之，内立法<度>。（《过秦论》）
            url: xxxx
            vernacular: 在那时候，有商鞅辅佐他，对内确立法律制度
          - ancient: 背绳墨以追曲兮，竞周容以为<度>。（《离骚》）
            url: xxxx
            vernacular: 违背是非标准追求邪曲，争着苟合取悦作为法则。
          - ancient: 仓廩实而知礼节，衣食足而知荣辱，上服<度>则六亲固。（《史记•管仲列传》）
            url: xxxx
            vernacular: 仓库储备充实了，百姓才懂得礼节;衣食丰足了，百姓才能分辨荣辱;统治者的作为合乎礼节法度，六亲才会得以稳固。
      - trans: ❹气度;胸襟。
        sentences:
          - ancient: 高祖为人...宽仁爱人，意豁如也。常有大<度>，不事家人生产作业。（《汉书•高帝纪》）
            url: xxxx
            vernacular: 高祖宽厚仁爱，胸襟十分开朗。平时不拘小节，不很安心从事一般生产劳动。
          - ancient: 父完，沉深有大<度>。（《后汉书•献帝伏皇后纪》）
            url: xxxx
            vernacular: 父伏完，沉着器度大
          - ancient: 以小舟涉鲸波出，无可奈何，而死固付之<度>外矣。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 靠了一条小船渡过惊涛骇浪，实在无可奈何，对于死本已置之度外了!考查知识点：翻译思路分析与延伸： 以：用、靠了，介词。涉：渡过，渡河。鲸波：惊涛骇浪。 2.固：本来。度：考虑。付之度外：付之考虑之外。
      - trans: ❺气质;态度。
        sentences:
          - ancient: 皇览揆余于初<度>兮，肇锡余以嘉名。（《离骚》）
            url: xxxx
            vernacular: 父亲仔细揣测我的生辰，于是赐给我相应的美名。
          - ancient: 群臣惊愕，卒起不意，尽失其<度>。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦国的君臣都惊呆了，事情突然发生，意料不到，大家都失去了常态。
  - word: 度
    type: 【动词】
    phonetic: du4
    tags:
      - 高中
    samples:
      - trans: ❶越过;度过。
        sentences:
          - ancient: 我欲因之梦吴越，一夜飞<度>镜湖月。（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 我根据越人说的话梦游到吴越，一天夜晚飞渡过明月映照下的镜湖。
          - ancient: 今年欢笑复明年，秋月春风等闲<度>。（《琵琶行》）
            url: xxxx
            vernacular: 年复一年都在欢笑打闹中度过；秋去春来美好的时光白白消磨。
      - trans: ❷依音节唱。
        sentences:
          - ancient: 一夫登场，四座屏息，音若细发，响彻云际，每<度>一字，几尽一刻，飞鸟为之徘徊，壮士听而下泪矣。（明•袁宏道《虎丘记》）
            url: xxxx
            vernacular: 一个人登场，四围的人屏住声息，声音如细而直上的毛发，响彻云端，每吐一字，几乎拖长达一刻之久，飞鸟听了为之回翔盘旋，壮士听了感动得流下眼泪。
      - trans: ❸创作（乐曲）。
        sentences:
          - ancient: 予怀怆然，感慨今昔，因自<度>此曲。（《扬州慢》序）
            url: xxxx
            vernacular: 我内心悲凉，感慨于扬州城今昔的变化，于是自创了这支曲子。
  - word: 度
    type: 【量词】
    phonetic: du4
    tags:
      - 高中
    samples:
      - trans: 次;回
        sentences:
          - ancient: 岐王宅里寻常见，崔九堂前几<度>闻。（唐•杜甫《江南逢李龟年》）
            url: xxxx
            vernacular: 当年我经常在岐王与崔九的住宅里见到你并听到你的歌声。
  - word: 度
    type: 【动词】
    phonetic: duo2
    tags:
      - 高中
    samples:
      - trans: ❶计量长短。
        sentences:
          - ancient: 郑人有欲买履者，先自<度>其足而置之其坐。（《韩非子•外储说左上》）
            url: xxxx
            vernacular: 郑国有个想买鞋子的人，他先量好自己脚的尺码，然后把量出的尺码放在自己的座位上。
          - ancient: 权，然后知轻重；<度>，然后知长短。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 用秤称，才能知道轻重；用尺量，才能知道长短
      - trans: ❷计算。
        sentences:
          - ancient: 试使山东之国与陈涉<度>长絜（xie2，用绳围着量）大，比权量力，则不可同年而语矣。（《过秦论》）
            url: xxxx
            vernacular: 假使拿崤山函谷关以东各国诸侯来跟陈涉量量长短，比比大小，比较一下他们的权威，衡量衡量他们的实力，那简直不能够同年而语，相提并论。
      - trans: ❸估计;揣测。
        sentences:
          - ancient: <度>我至军中，公乃入。（《鸿门宴》）
            url: xxxx
            vernacular: 估计我回到军营里，你才进去。
          - ancient: <度>道里会遇之礼毕，还，不过三十日。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 估计路程和会谈结束，再加上返回的时间，不会超过三十天。
          - ancient: 相如<度>秦王特以诈佯为予赵城，实不可得。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 相如估计秦王只不过用欺诈手段假装给赵国城邑，实际上赵国根本不可能得到
      - trans: ❹考虑;衡量。
        sentences:
          - ancient: 权（用秤称），然后知轻重；度（用尺量），然后知长短;物皆然，心为甚。王请<度>之。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 用秤称，才能知道轻重；用尺量，才能知道长短，任何事物都是如此，人心更是这样。大王，您请思量一下吧！
          - ancient: <度>义而后动，是而不见可悔故也。（宋•王安石《答司马谏议书》）
            url: xxxx
            vernacular: （这是他）考虑到（迁都）合理，然后坚决行动；认为对（就）看不出有什么可以后悔的缘故啊。
