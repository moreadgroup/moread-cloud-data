---
words:
  - word: 国
    type: 【名词】
    phonetic: guo2
    tags:
      - 高中
    samples:
      - trans: ❶国家；周代指诸侯国。
        sentences:
          - ancient: 夫大<国>，难测也，惧有伏（埋伏）焉。（《曹刿论战》）
            url: xxxx
            vernacular: 像齐国这样的大国，他们的情况是难以推测的，怕他们设下埋伏。
          - ancient: 越<国>以鄙远（以遥远的地方做边境），君知其难也。（《烛之武退秦师》，）
            url: xxxx
            vernacular: 然而越过别国把远方的郑国作为秦国的东部边邑，您知道这是困难的
          - ancient: 人习于苟且非一日，士大夫多以不恤<国>事、同俗自媚于众为善。（宋•王安石《答司马谏议书》）
            url: xxxx
            vernacular: 人们习惯于苟且偷安、得过且过（已）不是一天（的事）了，士大夫们多数把不顾国家大事、附和世俗（的见解），向众人献媚讨好当做好事
          - ancient: 思<国>之安者，必积其德义。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 要使国家稳定，一定要积聚它的民心。
          - ancient: 小楼昨夜又东风，故<国>不堪回首月明中。（《虞美人•春花秋月何时了》）
            url: xxxx
            vernacular: 昨夜小楼上又吹来了春风，在这皓月当空的夜晚怎能忍受得了回忆故国的伤痛。
          - ancient: 诏书特下，拜臣郎中，寻蒙<国>恩，除臣洗马。（《陈情表》）
            url: xxxx
            vernacular: 朝廷又特地下了诏书，任命我为郎中，不久又蒙受国家恩命，任命我为太子的侍从。
      - trans: ❷战国时公卿和汉以后王侯的封地。
        sentences:
          - ancient: 孟尝君就（前往）<国>于薛。（《战国策•齐策四》）
            url: xxxx
            vernacular: 孟尝君只好到他的领地薛去。
          - ancient: 汉兴，天子之政行午郡，不行于<国>，制其守宰，不制其侯王。（唐•柳宗元《封建论》）
            url: xxxx
            vernacular: 汉朝统一了全国之后，纠正秦朝的错误，沿袭周朝的封建制，分割天下，分封自己的子弟和功臣为诸侯王。
          - ancient: 丘（孔子自称）也闻有<国>有家者，不患寡而患不均，不患贫而患不安。（《季氏将伐颛臾》）
            url: xxxx
            vernacular: 我听说拥有邦国封邑的诸侯和拥有家族封邑的大夫，他们不担忧东西少而担忧分配不均，不担忧贫困而担忧社会不安定。
          - ancient: 四月，兵罢戏下，诸侯各就<国>。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 四月，在项羽旌麾之下罢兵散归，诸侯各自回到封国
      - trans: ❸国都;京城。
        sentences:
          - ancient: 先王之制，大都不过参<国>之一。（《左传•隐公元年》）
            url: xxxx
            vernacular: 按先王的规定，大城市的城墙不能超过国都的城墙的三分之一
          - ancient: <国>破山河在，城春草木深。（《春望》）
            url: xxxx
            vernacular: 国都沦陷，城池残破，虽然山河依旧，可是乱草遍地，林木苍苍。
          - ancient: 登斯楼也，则有去<国>怀乡，忧谗畏讥，满目萧然，感极而悲者矣。（《岳阳楼记》）
            url: xxxx
            vernacular: 这时登上这座楼，就会产生被贬官离开京城，怀念家乡，担心人家说坏话，惧怕人家讥讽的心情，再抬眼望去尽是萧条冷落的景象，一定会感慨万千而十分悲伤了。
      - trans: ❹地区;地域。
        sentences:
          - ancient: 逝将去女（通""汝"，你），适彼乐<国>。（《诗经•魏风•硕鼠》）
            url: xxxx
            vernacular: 发誓定要摆脱你，去那乐国有仁爱。
          - ancient: 荆州北据汉、沔，利尽南海，东连吴会，西通巴、蜀，此用武之<国>。（《隆中对》）
            url: xxxx
            vernacular: 荆州北靠汉水、沔水，一直到南海的物资都能得到，东面和吴郡、会稽郡相连，西边和巴郡、蜀郡相通，这是大家都要争夺的地方
          - ancient: 红豆生南<国>，春来发几枝?（《相思》）
            url: xxxx
            vernacular: 红豆生于南方，随着春天到来而长。
