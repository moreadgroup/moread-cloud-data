---
words:
  - word: 名
    type: 【名词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: ❶名字;名称。
        sentences:
          - ancient: 昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷<名>。（《木兰诗》）
            url: xxxx
            vernacular: 昨夜看见征兵的文书，知道君王在大规模征募兵士，那么多卷征兵文书，每卷上都有父亲的名字。
          - ancient: 即书诗四句，并自为其<名>。（《伤仲永》）
            url: xxxx
            vernacular: 仲永立刻写下了四句，并自己题上自己的名字。
      - trans: ❷名号；名分（与"实"相对）。
        sentences:
          - ancient: 古者<名>位不同，礼亦异数。（《汉书•艺文志》）
            url: xxxx
            vernacular: 古代名号品位不一样，所用的礼节也就异等。
          - ancient: 唯<名>与器，圣人所重。（《后汉书•刘玄传》）
            url: xxxx
            vernacular: 要知道名与器，是圣人最重视的
      - trans: ❸名誉;名声。
        sentences:
          - ancient: 曹操比于袁绍，则<名>微而众寡，然操遂能克绍，以弱为强者，非惟天时，抑亦人谋也。（《隆中对》）
            url: xxxx
            vernacular: 曹操与袁绍相比，声望少之又少，然而曹操最终之所以能打败袁绍，凭借弱小的力量战胜强大的原因，不仅依靠的是天时好，而且也是人的谋划得当。
          - ancient: 功与日月齐光兮，<名>与三王争流。（《后汉书•冯衍传》）
            url: xxxx
            vernacular: xxxx
  - word: 名
    type: 【动词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: ❶命名；取名。
        sentences:
          - ancient: 所谓华山洞者，以其乃华山之阳<名>之也。（《游褒禅山记》）
            url: xxxx
            vernacular: 人们所说的华山洞，因为它在华山南面而这样命名。
          - ancient: 东家有贤女，自<名>秦罗敷，可怜体无比，阿母为汝求。（《孔雀东南飞》）
            url: xxxx
            vernacular: 东邻有个好姑娘，本名就叫秦罗敷。姿态可爱无人比，妈妈为你把婚求。
          - ancient: <名>余曰正则兮，字余曰灵均。（《离骚》）
            url: xxxx
            vernacular: 父亲把我的名取为正则，同时把我的字叫作灵均。
          - ancient: 以故其后<名>之曰"褒禅"。（《游褒禅山记》）
            url: xxxx
            vernacular: 因为这个缘故，后人就称此山为褒禅山。
          - ancient: 【高考题例】民图像于庐，而奉之如神，<名>日"范公庵"。（《宋史-范纯礼传》）
            url: xxxx
            vernacular: 百姓在房中悬挂“他的”画像，把他像神仙一样供奉，取名为“范公庵”
      - trans: ❷称说;说出。
        sentences:
          - ancient: 后世之谬其传而莫能<名>者，何可胜道也哉！（《游褒禅山记》）
            url: xxxx
            vernacular: 后世讹传而无人弄清其真相的事，哪能说得完呢？
          - ancient: 人有百口，口有百舌，不能<名>其一处也。（《口技》）
            url: xxxx
            vernacular: 即使一个人有上百张嘴，每张嘴里有上百条舌头，也不能说出其中的一个地方来啊
      - trans: ❸出名；有名。
        sentences:
          - ancient: 山不在高，有仙则<名>。（《陋室铭》）
            url: xxxx
            vernacular: 山不在于高，有了神仙就会有名气。
  - word: 名
    type: 【形容词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: 著名的;有名声的。
        sentences:
          - ancient: 故虽有<名>马，祗辱于奴隶人之手，骈死于槽栃之间，不以千里称也。(唐代韩愈的《马说》）
            url: xxxx
            vernacular: 因此虽然有名贵的马，也只能在仆役的手中受辱，和普通的马一同死在马厩里，不能因日行千里而闻名于世。
