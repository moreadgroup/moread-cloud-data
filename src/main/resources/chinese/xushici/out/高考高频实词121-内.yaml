---
words:
  - word: 内
    type: 【名词】
    phonetic: nei4
    tags:
      - 高中
    samples:
      - trans: ❶内部（与"外"相对）。
        sentences:
          - ancient: 然侍卫之臣不懈于<内>，忠志之士忘身于外者，盖追（追念）先帝之殊遇，欲报之于陛下也。（《出师表》）
            url: xxxx
            vernacular: 不过宫廷里侍从护卫的官员不懈怠，战场上忠诚有志的将士们奋不顾身，大概是他们追念先帝对他们的特别的知遇之恩（作战的原因），想要报答在陛下您身上。
          - ancient: 少间，帘<内>掷一纸出，即道人意中事，无毫发爽（差错）。（《促织》）
            url: xxxx
            vernacular: 一会儿，室内丢一张纸条出来，那上面就写着求神的人心中所想问的事情，没有丝毫差错。
          - ancient: 外无期功强近之亲，<内>无应门五尺之僮。（《陈情表》）
            url: xxxx
            vernacular: 在外面没有比较亲近的亲戚，在家里又没有照应门户的童仆
      - trans: ❷内心。
        sentences:
          - ancient: 色（外表）厉（威严）而<内>荏（ren3，虚弱）。（《论语・阳货》）
            url: xxxx
            vernacular: 外表强硬，内心虚弱。
          - ancient: 兮将军外，托服从之名而为怀犹豫之计，事急而不断，祸至无日矣！（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 现在将军您外表上假托顺从的名义（当时孙权接受讨虏将军的封号，名义上是向汉王朝称臣的， 而曹“挟天子以令诸侯”，所以孙权在名义上也服从曹操。），而内心却怀有犹豫不决的心思。 情况禁忌而不做决断，祸事很快就会降临了。
          - ancient: 定乎<内>外之分，辩乎荣辱之境，斯已矣。（《逍遥游》）
            url: xxxx
            vernacular: 他认定了对自己和对外物的分寸，分辨清楚荣辱的界限，就觉得不过如此罢了。
          - ancient: 未饮心先醉，眼中流血，心<内>成灰。（《长亭送别》）
            url: xxxx
            vernacular: 没有喝酒心却先醉，眼里流血，内心如同死灰
      - trans: ❸内脏。
        sentences:
          - ancient: 见此崩五<内>，恍惚生狂痴。（汉•蔡琰《悲愤诗》）
            url: xxxx
            vernacular: 我的五脏崩裂一样的沉痛，恍恍惚惚如痴如狂。
      - trans: ❹内室;卧房。
        sentences:
          - ancient: 先为筑室，家有一堂二<内>。（《汉书•晁错传》）
            url: xxxx
            vernacular: 原来的人建造房屋，家中设立一个客厅两个卧室。先是原来的意思
          - ancient: 而如姬最幸，出入王卧<内>，力能窃之。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 在妻妾中如姬最受宠爱，她出入魏王的卧室很随便，只要尽力是能偷出兵符来的
      - trans: ❺皇宫，尊称大内。
        sentences:
          - ancient: 西宫南<内>多秋草，落叶满阶红不扫。（《长恨歌》）
            url: xxxx
            vernacular: 西宫、南内到处都是枯黄的秋草;台阶上落满了红叶，无人清扫。
      - trans: ❻旧指妻妾。
        sentences:
          - ancient: 齐侯好<内>。（《左传•僖公十七年》）
            url: xxxx
            vernacular: 齐侯贪恋妻妾姬侍
          - ancient: 以其<内>实（指妻妾与宝物）迁于卢蒲嫳（pei4）氏，易<内>而饮酒。（《左传•襄公二+八年》）
            url: xxxx
            vernacular: 就带着他的妻妾财物迁到卢蒲嫳家里，交换妻妾而喝酒。
      - trans: ❼泛指女子。
        sentences:
          - ancient: 辨外（指男子）、<内>而时禁。（《周礼•天官•宫正》）
            url: xxxx
            vernacular: xxxx
