    samples:
      - trans: 同"纳"。收进;放入。
        sentences:
          - ancient: 有不被尧舜之泽者，若己推而<内>之沟中。（《孟子・万章上》）
            url: xxxx
            vernacular: 要是有一个男的或一个女的没有辛受到尧舜之道的恩泽的，就像是自己把他们推入了山沟似的。
          - ancient: 哙即带剑拥盾入军门。交戟之卫士欲止不<内>。（《鸿门宴》）
            url: xxxx
            vernacular: 樊哙拿着剑，持着盾牌，冲入军门。持戟交叉守卫军门的卫士想阻止他进去
          - ancient: 距关，毋<内>诸侯，秦地可尽王也。（《鸿门宴》）
            url: xxxx
            vernacular: 守住函谷关，不要放诸侯进来，秦国的土地可以全部占领而称王。
          - ancient: 亡走赵，赵不<内>。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 他逃往赵国，赵国不肯接纳。
