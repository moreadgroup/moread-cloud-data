---
words:
  - word: 坐
    type: 【名词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: 同"座"。座位。
        sentences:
          - ancient: 请以剑舞，因击沛公于<坐>，杀之。（《鸿门宴》）
            url: xxxx
            vernacular: 请求舞剑助兴，趁机把刘邦击倒在座位上，杀掉他。
          - ancient: 【高考题例】经略使韩缜语之日："君奇士也，他日当据吾<坐>。（《宋史•何灌传》）
            url: xxxx
            vernacular: 河东经略使韩缜对他说：“您是个奇才，将来总有一天会坐上我今天的座位。”
  - word: 坐
    type: 【动词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: ❶坐。古人席地而坐，两膝着地，臀部压在脚后跟上;也指臀部着物而坐。
        sentences:
          - ancient: 项王、项伯东向<坐>，亚父南向<坐>——亚父者，范增也。（《鸿门宴》）
            url: xxxx
            vernacular: 项羽、项伯面向东坐；亚父面向南坐──亚父这个人，就是范增；
          - ancient: <坐>潭上，四面竹树环合。（《小石潭记》）
            url: xxxx
            vernacular: 我坐在潭边，四下里竹林和树木包围着
      - trans: ❷犯……罪。
        sentences:
          - ancient: 王曰："何<坐>？"曰："<坐>盗。"（《晏子使楚》）
            url: xxxx
            vernacular: 大王（接着再）问：‘（他）犯了什 么罪？’（我就）回答：‘（他）犯了偷窃罪。’
          - ancient: 【高考题例】诏降一级致仕，瑾恨未已，<坐>以遗失部籍，逮文下诏狱。（《明史•韩文传》）
            url: xxxx
            vernacular: 皇帝下诏降韩文一级官职退休，郎中陈仁贬谪为钧州同知。刘瑾并未解恨，以遗失户籍档案定罪，逮捕韩文和侍郎张缙入钦犯监狱。
      - trans: ❸株连受罚。
        sentences:
          - ancient: 副有罪，当相<坐>。（《苏武传》）
            url: xxxx
            vernacular: 副使有罪，应该连坐到你。
          - ancient: 【高考题例】时平原多盗贼，憙与诸郡讨捕，斩其渠帅，余党当<坐>者数千人。（《后汉书•赵憙传》）
            url: xxxx
            vernacular: 当时平原有很多盗贼，赵憙和周围其他各郡（一起通力）追捕，杀死他们的头领，余党（经过）判决受株连的有好几千人。
      - trans: ❹诉讼时在法官面前对质。
        sentences:
          - ancient: 晋人使与邾大夫<坐>。（《左传•昭公二十三年》）
            url: xxxx
            vernacular: 晋国人让他和邾大夫在法官面前对质
      - trans: ❺驻守。
        sentences:
          - ancient: 楚人<坐>其北门，而覆诸山下。（《左传•桓公十二年》）
            url: xxxx
            vernacular: 坐：守，等待。覆：设伏。
      - trans: ❻比喻放弃行动，不做努力。
        sentences:
          - ancient: 与其<坐>而待亡，孰若起而拯之？（《冯婉贞》）
            url: xxxx
            vernacular: 与其坐着等死，哪里比得上奋起抵抗拯救我们的村庄？
  - word: 坐
    type: 【副词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: 即将。
        sentences:
          - ancient: 寒英<坐>销落，何用慰远客？（唐•柳宗元《早梅》）
            url: xxxx
            vernacular: 寒风中花朵就要凋落，又能用什么来抚慰远客?
  - word: 坐
    type: 【介词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: ❶因为……犯法；因为……受牵连。
        sentences:
          - ancient: 会李竟<坐>与诸侯王交通，辞语及霍氏，有诏：“（霍）云、（霍）山不宜宿卫，免就第。”（《汉书•霍光传》）
            url: xxxx
            vernacular: 正好李竟因为被指控结交诸侯王而被朝廷问罪，供词中涉及到霍氏家族，于是汉宣帝下诏：“霍云、霍山不再适合在宫中任职，免职回家。”
          - ancient: （诸葛）诞麾下数百人，<坐>不降见斩。（《三国志•魏书•诸葛诞传》）
            url: xxxx
            vernacular: 诸葛诞死后，其部下数百人被俘虏了，魏军劝他们投降，这几百人宁死不降。
      - trans: ❷由于；因为。
        sentences:
          - ancient: 耕者忘其犁，锄者忘其锄。来归相怨怒，但<坐>观罗敷。（《陌上桑》）
            url: xxxx
            vernacular: 耕地的人忘记了自己在犁地，锄地的人忘记了自己在锄地；回来后相互埋怨，只是因为仔细看了罗敷的美貌。
          - ancient: 停车<坐>爱枫林晚，霜叶红于二月花。（《山行》）
            url: xxxx
            vernacular: 停下马车是因为喜爱深秋枫林的晚景，枫叶秋霜染过，艳比二月春花。
          - ancient: 【高考题例】爽懦惑不能用，遂委身受戮，芝<坐>爽下狱，当死，而口不讼直，志不苟免，宣帝嘉之，赦而不诛。（《晋书•鲁芝传》）
            url: xxxx
            vernacular: 曹爽懦弱又被人迷惑，因而没有听取鲁芝的意见，于是束手就擒。鲁芝也受到牵连而被下狱，论理当死，但他始终凛然不阿，始终不改坚贞的气节。宣帝很喜欢他，于是赦免了他。
