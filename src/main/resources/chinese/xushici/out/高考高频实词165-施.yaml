---
words:
  - word: 施
    type: 【名词】
    phonetic: shi1
    tags:
      - 高中
    samples:
      - trans: 恩惠;好处。
        sentences:
          - ancient: 楚有三<施>，我有三怨，怨雠已多，将何以战？（《左传•僖公二十八年》）
            url: xxxx
            vernacular: 楚对三国都有恩惠，我们对三国都结下怨仇，怨仇已经多了，将凭什么去作战?
          - ancient: 君（指秦穆公）有<施>于晋君，晋君无<施>于其众。（《国语•晋落三》）
            url: xxxx
            vernacular: 您对晋君有过帮助，晋君却对他的百姓不施恩德。
  - word: 施
    type: 【动词】
    phonetic: shi1
    tags:
      - 高中
    samples:
      - trans: ❶散布。
        sentences:
          - ancient: 云行雨<施>，品物流形。（《周易•乾卦》）
            url: xxxx
            vernacular: 云行雨施，品物流形在这里是解释乾卦的卦德“亨”。大意是，乾能用天之德，使运气流行，雨泽施布，让万物生长、感受天恩。
          - ancient: 君子所性，仁义礼智根于心，其生色也，睟然（睟sui4，润泽）见于面，盎于背，<施>于四体，四体不言而喻。（《孟子•点心上》）
            url: xxxx
            vernacular: 君子的本性，仁义礼智植根于内心，外表神色清和润泽， 呈现于脸面，流溢于肩背，充实于四肢，四肢的动作，不用言语， 别人也能理解。
      - trans: ❷摆列;安放。
        sentences:
          - ancient: <施>薪若一，火就燥也。（《荀子•劝学》）
            url: xxxx
            vernacular: 柴是一样的，但燃烧起来火势总是往干燥的方向走。
          - ancient: 中有都柱，傍行八道，<施>关发机。（《张衡传》）
            url: xxxx
            vernacular: 内部中央有根粗大的铜柱，铜柱的周围伸出八条滑道，还装置着枢纽，用来拨动机件。
          - ancient: 于厅事之东北角，<施>八尺屏障。（《口技》）
            url: xxxx
            vernacular: 在大厅的东北角，安放了一座八尺高的屏风
      - trans: ❸推行;实行。
        sentences:
          - ancient: 己所不欲，勿<施>于人。（《论语•颜渊》）
            url: xxxx
            vernacular: 自己不愿意做的事情，不要强加给别人。
          - ancient: 仁义不<施>而攻守之势异也。（《过秦论》）
            url: xxxx
            vernacular: 就因为不施行仁政而使攻守的形势发生了变化啊。
          - ancient: 时北兵已迫修门外，战、守、迁皆不及<施>。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 当时元兵已经逼近都城北门外，交战、防守、转移都来不及做了。
          - ancient: 愚以为宫中之事，事无大小，悉以咨之，然后<施>行，必能裨补阙漏，有所广益。（《出师表》）
            url: xxxx
            vernacular: 我认为宫中之事，无论事情大小，都拿来跟他商讨，这样以后再去实施，一定能够弥补缺点和疏漏之处，得到更多的好处。
      - trans: ❹加;施加。
        sentences:
          - ancient: 古人所以重<施>刑于大夫者，殆为此也。（《报任安书》）
            url: xxxx
            vernacular: 古人之所以慎重地对大夫用刑，就是因为这个缘故。
      - trans: ❺用。
        sentences:
          - ancient: 妾不堪驱使，徒留无所<施>，便可白公姥，及时相遣归。（《孔雀东南飞》）
            url: xxxx
            vernacular: 我既然担当不了使唤，白白留着也没有什么用。（您）现在就可以去禀告婆婆，趁早把我遣送回娘家。
      - trans: ❻给予。
        sentences:
          - ancient: （苏）武所得赏赐，尽以<施>予昆弟（兄和弟）故人。（《汉书•苏武传》）
            url: xxxx
            vernacular: 苏武把所得的赏赐，全部施送给弟弟苏贤和过去的邻里朋友
          - ancient: 人贱物亦鄙，不足迎后人，留待作遗<施>，于今无会因。（《孔雀东南飞》）
            url: xxxx
            vernacular: 人既然低贱东西自然也卑陋，不值得用它们来迎娶后来的新人。你留着等待以后有机会施舍给别人吧，走到今天这一步今后不可能再相会相亲。
      - trans: ❼陈尸示众。
        sentences:
          - ancient: 及文公入，秦人杀冀芮而<施>之。（《国语•楚语上》）
            url: xxxx
            vernacular: 等到晋文公回国后，秦国人杀了冀芮，并陈尸示众。
