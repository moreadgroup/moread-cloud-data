---
words:
  - word: 敢
    type: 【动词】
    phonetic: gan3
    tags:
      - 高中
    samples:
      - trans: ❶助动词。有胆量;有勇气。
        sentences:
          - ancient: 秦人开关延（迎战）敌，九国之师，逡巡而不<敢>进。（《过秦论》）
            url: xxxx
            vernacular: 秦人打开函谷关口迎战敌人，九国的军队有所顾虑徘徊不敢入关。
          - ancient: 如曰今日当一切不事事，守前所为而已，则非某之所<敢>知。（宋•王安石《答司马谏议书》）
            url: xxxx
            vernacular: 如果说现在应该什么事都不去做，墨守前人的陈规旧法就是了，那就不是我敢领教的了。
      - trans: ❷助动词。怎敢；岂敢。
        sentences:
          - ancient: 长者虽有问，役夫<敢>申恨？（《兵车行》）
            url: xxxx
            vernacular: 尽管长辈有疑问，服役的人们怎敢申诉怨恨？
          - ancient: 奉事循公姥，进止<敢>自专？（《孔雀东南飞》）
            url: xxxx
            vernacular: 侍奉公婆都顺着他们的心意，一举一动哪里敢自作主张不守本分？
          - ancient: 【高考题例】勤王<敢>道远，私向梦中归。（唐•岑参《发临洗将赴北庭留别》）
            url: xxxx
            vernacular: 为王事尽力岂敢说路远，只希望能从梦中返归。
          - ancient: 【高考题例】燧怒日："初仕<敢>欺心耶!"（《宋史•萧燧传》）
            url: xxxx
            vernacular: 萧燧生气说:(我)刚刚做官怎么敢欺骗自己的良心呢!
  - word: 敢
    type: 【副词】
    phonetic: gan3
    tags:
      - 高中
    samples:
      - trans: 谦辞，有冒昧的意思。
        sentences:
          - ancient: 若亡郑而有益于君，<敢>以烦执事。（《烛之武退秦师》）
            url: xxxx
            vernacular: 假如灭掉郑国对您有好处，怎敢冒昧地拿这件事情来麻烦您。
          - ancient: <敢>竭鄙怀，恭疏短引，一言均赋，四韵俱成。（《滕王阁序》）
            url: xxxx
            vernacular: 我只是冒昧地尽我微薄的心意，作了短短的引言。在座诸位都按各自分到的韵字赋诗，我已写成了四韵八句。
