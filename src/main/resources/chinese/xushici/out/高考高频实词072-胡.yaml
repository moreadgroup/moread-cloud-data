words:
  - word: 胡
    type: 【名词】
    phonetic: hu2
    tags:
      - 高中
    samples:
      - trans: ❶兽颔下的垂肉。
        sentences:
          - ancient: 前虞（担忧）跋（踏）<胡>，后恐疐尾（zhi4，跌倒）尾，三纳之而未克，徘徊容与（徘徊不进的样子），追者益近。（《中山狼传》）
            url: xxxx
            vernacular: 先装前身怕碰伤狼的下巴肉，先装后身又唯恐压住狼的尾巴，一连几次都没能把狼装进去。正在犹豫不定、迟疑不决的时候，追赶的人越来越近了。
      - trans: ❷我国古代西北部民族的统称。
        sentences:
          - ancient: <胡>人不敢南下而牧马，士不敢弯弓而报怨。（《过秦论》）
            url: xxxx
            vernacular: 胡人不敢向下到南边来放牧，勇士不敢拉弓射箭来报仇。
          - ancient: 旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山<胡>骑鸣啾啾。（《木兰诗》）
            url: xxxx
            vernacular: 早上辞别黄河上路，晚上到达黑山（燕山）脚下，听不见父母呼唤女儿的声音，但能听到燕山胡兵战马啾啾的鸣叫声。
  - word: 胡
    type: 【代词】
    phonetic: hu2
    tags:
      - 高中
    samples:
      - trans: 什么;怎么。
        sentences:
          - ancient: 即不幸有方二三千里之旱，国<胡>以相恤？（《论积贮疏》）
            url: xxxx
            vernacular: 假如不幸有纵横二三千里地方的大旱灾，国家用什么去救济灾区？
          - ancient: <胡>为乎遑遑欲何之？（《归去来兮辞》）
            url: xxxx
            vernacular: 为什么心神不定，还想去什么地方？
          - ancient: 不狩不猎，<胡>瞻尔庭有县貆（huan2，小貉）兮？（《诗经•魏风•伐檀》）
            url: xxxx
            vernacular: 不冬狩来不夜猎，为何见你庭院猪獾悬啊？
          - ancient: 归去来兮，田园将芜<胡>不归？（《归去来兮辞》）
            url: xxxx
            vernacular: 回家去吧！田园快要荒芜了，为什么不回去呢？
          - ancient: 其险也若此，嗟尔远道之人<胡>为乎来哉！（《蜀道难》）
            url: xxxx
            vernacular: 这样危险的地方，唉呀呀你这个远方而来的客人，为什么非要来这里不可呀！
