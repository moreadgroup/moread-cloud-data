---
words:
  - word: 致
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 情致;情趣。
        sentences:
          - ancient: 虽世殊事异，所以兴怀，其<致>一也。（《兰亭集序》）
            url: xxxx
            vernacular: 纵使时代变了，事情不同了，但触发人们情怀的原因，他们的思想情趣是一样的。
  - word: 致
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶给予;送给。
        sentences:
          - ancient: 同志者或不远千里而<致>，耕获菑畲。（明•徐光启《甘薯疏序》）
            url: xxxx
            vernacular: ⑨菑畲——菑(zi)，开垦一年的土地。畲(yu)，开垦三年的土地。菑畲， 引申为开荒、耕耘。
          - ancient: 宁南南下，皖帅欲结欢宁南，<致>敬亭于幕府。（《柳敬亭传》）
            url: xxxx
            vernacular: 宁南侯左良玉渡江南下时，安徽提督社宏域想结交左良玉，介绍柳敬亭到（左良玉的）府署。
          - ancient: 于是有缚广武君而<致>戏下者，信乃解其缚，东乡坐，西乡对，师事之。（《史记•淮阴侯列传》）
            url: xxxx
            vernacular: 不一会儿，就有人捆绑着广武君送到军营，韩信亲自给他解开绳索，请他面向东坐，自己面向西对坐着，像对待老师那样对待他。
          - ancient: 单于素闻广贤，令曰："得李广必生<致>之。"（《史记•李将军列传》）
            url: xxxx
            vernacular: 单于平时就听说李广很有才能，下令说：“俘获李广一定要活着送来。”
      - trans: ❷归还;交回。
        sentences:
          - ancient: 子尾多受邑而稍<致>诸君，君以为忠而甚宠之。（《左传•襄公二十八年》）
            url: xxxx
            vernacular: 子尾接受城邑后又逐渐的奉还给国君一部分，国君认为他很忠诚，因而很宠信他。
          - ancient: 既而曰："若此乎，古之道不即人心。"退而<致>仕。（《公羊传•宣公元年》）
            url: xxxx
            vernacular: “致仕”最初是辞官不做的一种方法
          - ancient: 【高考题例】旋（不久）以太傅<致>仕，元丰元年卒，年八十。（《宋史•會公亮传》）
            url: xxxx
            vernacular: 回到京师，很快就在太傅任上退休。元丰元年（1078），去世，终年八十岁。
      - trans: ❸表达;表示。
        sentences:
          - ancient: 其存君兴国而欲反复之，一篇之中，三<致>志焉。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 屈原关怀君王，想振兴国家改变楚国的形势，一篇作品中，都再三表现出来这种想法。
          - ancient: （鲁）肃宣（孙）权旨，论天下事势，<致>殷勤之意。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 鲁肃转达孙权的意思，（和他）讨论天下大事的势态，表示恳切慰问的心意
          - ancient: 季父愈闻汝丧之七日，乃能衔哀<致>诚。（《祭十二郎文》）
            url: xxxx
            vernacular: 叔父韩愈在听说你去世后的第七天，才得以含着哀痛向你表达诚意
          - ancient: 【高考题例】炀帝嗣位，被追入朝，百姓攀恋，累日不能出境，诣阙上书<致>请者，前后数百人。（《北史•来护儿传》）
            url: xxxx
            vernacular: 炀帝继位，来护儿被召入朝，百姓留恋怀念他。许多日仍不能出境，到朝中上书请求将来护儿留下来的人，前后有几百人。
      - trans: ❹到;达到。
        sentences:
          - ancient: 假（借助）舆马者，非利足也，而<致>千里。（《劝学》）
            url: xxxx
            vernacular: 借助车马的人，并不是脚走得快，却可以达到千里之外
          - ancient: 然秦以区区之地，<致>万乘之势，序八州而朝同列，百有余年矣。（《过秦论》）
            url: xxxx
            vernacular: 然而秦凭借着它的小小的地方，发展到兵车万乘的国势，管辖全国，使六国诸侯都来朝见，已经一百多年了
      - trans: ❺得到;取得。
        sentences:
          - ancient: 家贫，无从<致>书以观。（《送东阳马生序》）
            url: xxxx
            vernacular: 家里贫穷，无法得到书来看
          - ancient: 山阴李姓，以杀人系狱，每岁<致>数百金。（《狱中杂记》）
            url: xxxx
            vernacular: 山阴有个姓李的，因犯杀人罪坐牢，每年都赚上几百两银子
      - trans: ❻招致;招来。
        sentences:
          - ancient: 乃<致>其父母昆弟而誓之。（《勾践灭吴》）
            url: xxxx
            vernacular: 又招集他的父辈兄弟和他的兄弟发誓说
          - ancient: 彼于<致>福者，未数数然也。（《逍遥游》）
            url: xxxx
            vernacular: 他对于招福的事，没有拼命追求。
          - ancient: 诸侯恐惧，会盟而谋弱秦，不爱（吝惜）珍器重宝肥饶之地，以<致>天下之士。（《过秦论》）
            url: xxxx
            vernacular: 诸侯恐慌害怕，集会结盟，商议削弱秦国。不吝惜奇珍贵重的器物和肥沃富饶的土地，用来招纳天下的优秀人才
          - ancient: 士以此方数千里争往归之，<致>食客三千人。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 因此，方圆几千里以内的士人都争着去归附他，他招来了食客三千人。
      - trans: ❼致使;使得。
        sentences:
          - ancient: 女行无偏斜，何意<致>不厚（生嫌结怨）？（《孔雀东南飞》）
            url: xxxx
            vernacular: 她的行为没有什么不正当，哪里知道竟会招致你的不满得不到慈爱亲厚。
      - trans: ❽用尽;献出。
        sentences:
          - ancient: 夫民，神之主也，是以圣王先成民而后<致>力于神。（《左传•桓公六年》）
            url: xxxx
            vernacular: 人民才是鬼神的主人啊。圣明的君主总是先把人民的事情办好，再致力于祭祀鬼神。
          - ancient: 事父母能竭其力，事君能<致>其身。（《论语•学而》）
            url: xxxx
            vernacular: 侍奉父母，能够竭尽全力；服侍君主，能够献出自己的生命
          - ancient: 衡善机巧，尤<致>思于天文阴阳历算。（《张衡传》）
            url: xxxx
            vernacular: 张衡善于器械制造方面的巧思，尤其在天文、气象和历法的推算等方面很用心。
          - ancient: 薄衣食，<致>孝于鬼神。卑宫室，<致>费于沟淢（xu4，沟渠）。（《史记•夏本纪》）
            url: xxxx
            vernacular: 他节衣缩食，尽力孝敬鬼神。居室简陋，把资财用于治理河川。
  - word: 致
    type: 【形容词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 通"緻"。细密;细致。
        sentences:
          - ancient: 案其狱，皆文<致>不可得反。（《汉书•严延年传》）
            url: xxxx
            vernacular: 检查他裁断的案件，都文理致密，不可推翻
  - word: 致
    type: 【副词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 极;尽。
        sentences:
          - ancient: 彼非本政教也， 非<致>隆高也，非綦文理也，非服人之心也。（《荀子•仲尼》）
            url: xxxx
            vernacular: 因为五霸不把政治教化作为治国的根本，没有尽力推崇礼仪，教化人民，不能使人心悦诚服
