---
words:
  - word: 尚
    type: 【名词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: 同"上"。
        sentences:
          - ancient: 舜<尚>（谓以匹夫而见天子）见帝。（《孟子•万章下》）
            url: xxxx
            vernacular: 舜 上殿 拜见 天子
  - word: 尚
    type: 【动词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶崇尚；注重。
        sentences:
          - ancient: 君子<尚>勇乎？（《论语•阳货》）
            url: xxxx
            vernacular: 君子崇尚勇敢吗？
          - ancient: 宣德间，宫中<尚>促织之戏，岁征民间。（《促织》）
            url: xxxx
            vernacular: 明朝宣德年间，皇室里盛行斗蟋蟀的赌博，每年都要向民间征收。
          - ancient: 【高考题例】色<尚>黄，数用五，为官名，悉更秦之法。（《史记:屈原贾生列传》）
            url: xxxx
            vernacular: 崇尚黄色，遵用五行之说，重新确定官名，全部变更秦朝的法度。
          - ancient: 【高考题例】涣少好侠，<尚>气力，数通剽轻少年。晩而改节，敦儒学，习《尚书》，读律令，略举大义。（《后汉书•王涣传》）
            url: xxxx
            vernacular: 王涣年少时喜好行侠仗义打抱不平，崇尚力气和武艺，与强悍轻捷的少年交往频繁。后来才改变了自己的志向，钻研儒学，学习《尚书》，研读律令，大体明晓了这些书典的主要旨义。
      - trans: ❷超过。
        sentences:
          - ancient: 好仁者，无以<尚>之。（《论语•里仁》）
            url: xxxx
            vernacular: 喜欢仁德的人，没有什么能再超越他。
      - trans: ❸特指娶公主为妻。
        sentences:
          - ancient: 公主者，孝文帝女也，（周）勃太子胜之<尚>之。（《史记•绛侯周勃世家》）
            url: xxxx
            vernacular: 公主，就是孝文帝的女儿，周勃的长子周胜之娶她为妻
          - ancient: 【高考题例】田文既死，公叔为相，<尚>魏公主，而害吴起。（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 田文死后，公叔出任国相，娶了魏君的女儿，却畏忌吴起。
      - trans: ❹主管。
        sentences:
          - ancient: 襄平侯纪通<尚>符节，乃令持节矫内勃北军。（《汉书•高后纪》）
            url: xxxx
            vernacular: 襄平侯纪通主管调兵符节，周勃令他持节假传圣旨，说准许周勃进入北军。
      - trans: ❺夸耀;炫耀。
        sentences:
          - ancient: 君子不自大其事，不自<尚>其功。（《礼记•表记》）
            url: xxxx
            vernacular: 君子不自我夸耀自己做的事，不自己宣传自己的功劳。
  - word: 尚
    type: 【形容词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶崇高;高尚。
        sentences:
          - ancient: 南阳刘子骥，高<尚>士也，闻之，欣然规往（谋划着前往）。（《桃花源记》）
            url: xxxx
            vernacular: 南阳人刘子骥，是个志向高洁的隐士，听到这件事后，高兴地计划前往。
      - trans: ❷自大。
        sentences:
          - ancient: 虽才高于世，而无骄<尚>之情。（《张衡传》）
            url: xxxx
            vernacular: 虽然才华比一般的人高，但并不因此而骄傲自大。
  - word: 尚
    type: 【副词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶尚且。
        sentences:
          - ancient: 臣以为布衣之交<尚>不相欺，况大国乎？（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 但是我认为平民百姓之间的交往尚且互相不欺骗，更何况是大国之间呢！
          - ancient: 且庸人<尚>羞之，况于将相乎！（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 平庸的人尚且对这种情况感到羞耻，何况是将相呢?
      - trans: ❷还;仍然。
        sentences:
          - ancient: 谢公宿处今<尚>在，渌水荡漾清猿啼。（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 谢灵运住的地方如今还在，清澈的湖水荡漾，猿猴清啼。
          - ancient: 凭谁问，廉颇老矣，<尚>能饭否？（《永遇乐•京口北固亭怀古》）
            url: xxxx
            vernacular: 还有谁会问，廉颇老了，自己还能吃饭吗？
          - ancient: 今不听吾计，后虽欲复见我，<尚>可得乎？（《苏武传》）
            url: xxxx
            vernacular: 今天不听我的安排，以后再想见我，还能得到机会吗
          - ancient: 且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家，安危不可知，子卿<尚>复谁为乎？（《苏武传》）
            url: xxxx
            vernacular: 并且皇上年纪大了，法令随时变更，大臣无罪而全家被杀的有十几家，安危不可预料，你还打算为谁守节呢？
          - ancient: 【高考题例】臂健<尚>嫌弓力软，眼明犹识阵云高。（宋•曹翰《内宴奉诏作》）
            url: xxxx
            vernacular: 膀臂强健，尚嫌铁弓弓力太软；眼睛明亮，仍能看得清战地上高飘的烟云。
      - trans: ❸差不多；几乎。
        sentences:
          - ancient: 以能保我子孙黎民，<尚>亦有利哉！（《礼记•大学》）
            url: xxxx
            vernacular: 任用这样的人来保我的子孙黎民，一定会有好处啊!
      - trans: ❹表示祈求或命令。
        sentences:
          - ancient: 曰："平公之灵，<尚>辅相余!"（《左传•昭公二—年》）
            url: xxxx
            vernacular: 平公的威灵，还在保佑我！
