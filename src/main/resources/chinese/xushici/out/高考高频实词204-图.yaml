            url: xxxx
            vernacular: 温州的雁荡山，天下间奇秀，然而自古的地理图书上，却没有记载过此处。
          - ancient: 轲既取<图>奉之，发<图>，<图>穷而匕首见。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲拿来地图之后捧着，打开地图，地图全部展开后露出了匕首。
      - trans: ❸法度。
