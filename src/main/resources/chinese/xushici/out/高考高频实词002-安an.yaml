---
words:
  - word: 安
    type: 【动词】
    phonetic: an1
    tags:
      - 高中
    samples:
      - trans: ❶使安定。
        sentences:
          - ancient: 夫如是，故远人不服，则修文德以来之；既来之，则<安>之。（《季氏将伐颛臾》）
            url: https://baike.baidu.com/item/%E5%AD%A3%E6%B0%8F%E5%B0%86%E4%BC%90%E9%A2%9B%E8%87%BE
            vernacular: 依照这个道理，原来的远方的人不归服，就发扬文治教化来使他归服；使他来了之后，就要使他安定下来。
          - ancient: 君人者，诚能见可欲，则思知足以自戒;将有作，则思知止以<安>人。（《谏太宗十思疏》）
            url: https://baike.baidu.com/item/%E8%B0%8F%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F
            vernacular: 做国君的人，如果真的能够做到一见到能引起（自己）喜好的东西就要想到用知足来自我克制，将要兴建什么就要想到适可而止来使百姓安定
          - ancient: 【高考题例】其间岂无刚直之人，而弗胜龃龉，多不能<安>其身。（《明史•陈登云传》）
            url: https://www.163.com/dy/article/GAAB726N0536KV8E.html
            vernacular: 其间难道没有刚正的人吗，但不胜被攻击倾轧，没有安身的地方。
      - trans: ❷安抚;抚慰。
        sentences:
          - ancient: 时时为<安>慰，久久莫相忘！（《孔雀东南飞》）
            url: https://baike.baidu.com/item/%E5%AD%94%E9%9B%80%E4%B8%9C%E5%8D%97%E9%A3%9E/29019
            vernacular: 但愿时刻有安慰，天长地久莫相忘。
          - ancient: 若备与彼协心，上下齐同，则宜抚<安>，与结盟好。（《资治通鉴•汉纪五十七》）
            url: https://gsw.chengyucd.com/26702.html
            vernacular: 如果刘备和你同心协力，共同管理，就可以安抚百姓，与其结盟比较好
      - trans: ❸安置。
        sentences:
          - ancient: 探马报曰：“离山十里有王平<安>营。“（《三国演义》九十五回）
            url: https://zhidao.baidu.com/question/760577876154394444.html
            vernacular: 距山十里地有王平在那里安营扎寨。
          - ancient: 今水大而急，不得<安>柱。（三国•诸葛亮《与兄瑾书》）
            url: xxxx
            vernacular: 现在山水大而急，已无法立柱
  - word: 安
    type: 【形容词】
    phonetic: an1
    tags:
      - 高中
    samples:
      - trans: ❶安稳;安全（与“危“相对）。
        sentences:
          - ancient: 风雨不动<安>如山。（《茅屋为秋风所破歌》）
            url: https://baike.baidu.com/item/%E8%8C%85%E5%B1%8B%E4%B8%BA%E7%A7%8B%E9%A3%8E%E6%89%80%E7%A0%B4%E6%AD%8C/2813957
            vernacular: 房子在风雨中也不为所动，安稳得像是山一样？
          - ancient: 谢庄遂<安>。（《冯婉贞》）
            url: https://baike.baidu.com/item/%E5%86%AF%E5%A9%89%E8%B4%9E
            vernacular: 谢庄于是得到了保全。
          - ancient: 何方圜之能周兮？夫孰异道而相<安>？（《离骚》）
            url: https://baike.baidu.com/item/%E7%A6%BB%E9%AA%9A/1045
            vernacular: 方和圆怎能够互相配合，志向不同何能彼此相安。
          - ancient: 且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家，<安>危不可知，子卿尚复谁为乎？（《苏武传》）
            url: https://baike.baidu.com/item/%E8%8B%8F%E6%AD%A6%E4%BC%A0
            vernacular: 并且皇上年纪大了，法令随时变更，大臣无罪而全家被杀的有几十家，安危不可预料。你还打算为谁守节呢？
      - trans: ❷安定;安逸。
        sentences:
          - ancient: 倚南窗以寄傲，审容膝之易<安>。（《归去来兮辞》）
            url: xxxx
            vernacular: 倚着南窗寄托我的傲世之情，深知这狭小之地容易使我心安。
          - ancient: 今日割五城，明日割十城，然后得一夕<安>寝。（《六国论》）
            url: xxxx
            vernacular: 今天割掉五座城，明天割掉十座城，这才能睡一夜安稳觉。
  - word: 安
    type: 【代词】
    phonetic: an1
    tags:
      - 高中
    samples:
      - trans: 哪里；哪儿。
        sentences:
          - ancient: 项王曰：“沛公<安>在？“（《鸿门宴》）
            url: xxxx
            vernacular: 沛公在哪里？
          - ancient: 将军迎操，欲<安>所归乎？（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 将军迎操，欲安所归乎翻译过来的意思是将军要是迎顺曹操，到底是想要得到一个什么归宿呢。
          - ancient: 方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今<安>在哉？（《赤壁赋》）
            url: xxxx
            vernacular: 当初他攻陷荆州，夺得江陵，沿长江顺流东下，麾下的战船延绵千里，旌旗将天空全都蔽住，在江边持酒而饮，横执矛槊吟诗作赋，委实是当世的一代枭雄，而今天又在哪里呢？
          - ancient: 信不足，<安>有不信。（《老子》十七章）
            url: xxxx
            vernacular: 国君缺乏诚信，于是老百姓就不信任他。
  - word: 安
    type: 【副词】
    phonetic: an1
    tags:
      - 高中
    samples:
      - trans: 怎么；哪里。
        sentences:
          - ancient: 嗟乎，燕雀<安>知鸿鹄之志哉！（《陈涉世家》）
            url: xxxx
            vernacular: 唉！燕雀怎么能知道鸿鹄的志向呢？
          - ancient: 臣死且不避，卮（zhi1，古代酒器）酒<安>足辞！（《鸿门宴》）
            url: xxxx
            vernacular: 我死都不怕，一杯酒有什么可推辞的？
          - ancient: 终不得归汉，空自苦亡人之地，信义<安>所见乎？（《苏武传》）
            url: xxxx
            vernacular: 你终究不能回归本朝了，白白地在荒无人烟的地方受苦，你对汉廷的信义又怎能有所表现呢？
          - ancient: 不然，令五人者保其首领，以老于户牖之下，则尽其天年，人皆得以隶使之，<安>能屈豪杰之流，扼腕墓道，发其志士之悲哉？（《五人墓碑记》）
            url: xxxx
            vernacular: 不这样的话，假使让这五个人保全头颅，一直生活到老，尽享天年，人人都能够像奴仆一样使唤他们，又怎么能让豪杰们屈身下拜，在墓道上扼腕惋惜，抒发他们有志之士的悲叹呢？
          - ancient: <安>能以身之察察，受物之汶汶者乎？（《渔父》）
            url: xxxx
            vernacular: 怎么可能只顾着看自己，忽略了周围的事物？如此的人怎么能够体察世间涟漪的变化呢？
          - ancient: 自为歌诗曰：“大风起兮云飞扬，威加海内兮归故乡，<安>得猛士兮守四方!“（《史记•高祖本纪》）
            url: xxxx
            vernacular: 大风刮起来了，云随着风翻腾奔涌啊，威武平天下，衣锦归故乡，怎样才能得到勇士啊为国家镇守四方！
          - ancient: 孔子曰:“有是乎！由，譬使仁者而必信，<安>有伯夷、叔齐？使知者而必行，<安>有王子比干？“（《史记•孔子世家》）
            url: xxxx
            vernacular: 有这样的说法吗?仲由，假使达到仁的人一定能受到信任，怎么会有伯夷、叔齐(被饿死)?假使达到智的人就一定能推行学说，怎么会有王子比干(被剖心)?
          - ancient: <安>能摧眉折腰事权贵，使我不得开心颜！（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 岂能卑躬屈膝去侍奉权贵？那将使我不再有舒心畅意的笑颜！
          - ancient: 【高考题例】夫台谏为天下持是非，而使人贱辱至此，<安>望其抗颜宜绳，为国家锄大奸、歼巨蠹哉！（《明史•陈登云传》）
            url: xxxx
            vernacular: 台谏是为天下主持是非的，而使人践踏到这种地步，怎能希望他不顾情面，正直地处理事情，为国除掉奸人、消灭败类呢！
          - ancient: 燧谓：“东西异路，不当与，然<安>忍于旧治坐视?“（《宋史•萧燧传》）
            url: xxxx
            vernacular: 萧燧说：“东部西部不属同路，按说不该给粮食，但哪能忍心对原管辖地区不管不问呢?”
  - word: 安
    type: 【连词】
    phonetic: an1
    tags:
      - 高中
    samples:
      - trans: 乃;就;于是。
        sentences:
          - ancient: 既而皆入其地，王<安>挺志。（《国语•吴语》）
            url: xxxx
            vernacular: 等到他们都回到本国以后，君王就可以安下心
          - ancient: 因久坐，<安>从容谈三国之相怨。（《战国策•魏策一》）
            url: 出于坐了很长时间，不紧不慢地闲谈，那三个国家的相国就产生了怨恨。
            vernacular: 齐王将见燕赵楚之相于卫
