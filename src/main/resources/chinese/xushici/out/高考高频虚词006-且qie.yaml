---
words:
  - word: 且
    type: 【代词】
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: 此。
        sentences:
          - ancient: 匪<且>有<且>，匪今斯今，振古（自古）如兹。（《诗经・周颂•载芟》）
            url: xxxx
            vernacular: 不是现在才这样，不是今年才这样，万古都有这景象。
  - word: 且
    type: 【副词】
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: ❶将近。
        sentences:
          - ancient: 北山愚公者，年<且>九十。（《愚公移山》）
            url: xxxx
            vernacular: 北山下面有个名叫愚公的人，年纪快到90岁了
      - trans: ❷将要。
        sentences:
          - ancient: 不者，若属（你们这帮人）皆<且>为所虏！（《鸿门宴》）
            url: xxxx
            vernacular: 不然的话，你们都将被他所俘虏！
          - ancient: 以为<且>噬（咬）己也，甚恐。（《黔之驴》）
            url: xxxx
            vernacular: 认为驴要咬自己，非常害怕。
          - ancient: 有怠而欲出者，曰："不出，火<且>尽。”（《游褒禅山记》）
            url: xxxx
            vernacular: "有个懈怠而想退出的伙伴说:“再不出去,火把就要熄灭了。”"
          - ancient: 【高考题例】殚其财，竭其力，卒不效，<且>死，乃交责之日，是医之误，而用巫之晩也。（《赠医者汤伯高序》）
            url: xxxx
            vernacular: 用尽他们的钱财，耗尽他们的精力，最终不见效，将要死了，反而相互指责说，这是医生的失误，而找巫师太晚了。
          - ancient: 与之校，<且>生事。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 和他们计较，会生事端.
      - trans: ❸暂且;姑且。
        sentences:
          - ancient: 存者<且>偷生，死者长已矣。（《石壕吏》）
            url: xxxx
            vernacular: 活着的人姑且活一天算一天，死去的人就永远不会复生了！
          - ancient: <且>放白鹿青崖间，须行即骑访名山。（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 暂且把白鹿放在青青的山崖间，要想远行时就骑上它去探访名山。
          - ancient: 誓不相隔卿，<且>暂还家去。（《孔雀东南飞》）
            url: xxxx
            vernacular: 我发誓不同你断绝，你暂且回到娘家去
  - word: 且
    type: 【连词】
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: ❶表示递进。而且;并且。
        sentences:
          - ancient: 凡四方之士无有不过而拜<且>泣者，斯固（的确是）百世之遇也。（《五人墓碑记》）
            url: xxxx
            vernacular: 所有四方的有志之士经过这里没有不跪拜流泪的，这实在是百代难得的际遇啊。
          - ancient: 磐石方<且>厚，可以卒千年。（《孔雀东南飞》）
            url: xxxx
            vernacular: 祝贺你能够高升!大石方正又坚厚，可以千年都不变。
          - ancient: 晋侯、秦伯围郑，以其无礼于晋，<且>贰于楚也。（《烛之武退秦师》）
            url: xxxx
            vernacular: 晋文公、秦穆公出兵围攻郑国，因为郑国曾对文公无礼，并且郑国同时依附于楚国与晋国。
          - ancient: <且>夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。（《赤壁赋》）
            url: xxxx
            vernacular: 何况天地之间，凡物各有自己的归属，若不是自己应该拥有的，即令一分一毫也不能求取。
          - ancient: 【高考题例】<且>鲁卫兄弟之国也，而君用起，则是奔卫。（《史记，孙子吴起列传》）
            url: xxxx
            vernacular: 况且鲁国和卫国是兄弟国家，鲁君要是重用吴起，就等于抛弃了卫国。
      - trans: ❷表示让步。尚且。
        sentences:
          - ancient: <且>壮士不死即已，死即举大名（成大名）耳。（《陈涉世家》）
            url: xxxx
            vernacular: 况且壮士不死便罢了，要死就该成就伟大的名声啊
          - ancient: 臣死<且>不避，卮酒安足辞！（《鸿门宴》）
            url: xxxx
            vernacular: 我死都不怕，一杯酒有什么可推辞的？
          - ancient: <且>欲与常马等不可得，安求其能千里也？（《马说》）
            url: xxxx
            vernacular: 想要和普通的马一样尚且做不到，怎么能够要求它（日行）千里呢？
          - ancient: <且>庸人尚羞之（以之为羞），况于将相乎？（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 一般人尚且感到羞耻，更何况是身为将相的人呢？
      - trans: ❸表示假设。假如；如果。
        sentences:
          - ancient: <且>静郭君听辨（人名）而为之也，必无今日之患也。（《吕氏春秋•知士》）
            url: xxxx
            vernacular: 如果静郭君听，辨别并这样做了，就不会有今天的祸患啊
      - trans: ❹表示并列。其一，连接形容词。又。
        sentences:
          - ancient: 上<且>怒<且>喜。（《史记•淮阴侯列传》）
            url: xxxx
            vernacular: 上又怒又喜
      - trans: ❹表示并列。其二，连接【动词】。一面一面
        sentences:
          - ancient: 百工之事，固不可耕<且>为也。（《孟子•滕文公上》）
            url: xxxx
            vernacular: 说一个人不可能既要种地又要制造自己所需要的一切生活用品和生产工具。
      - trans: ❺表示转折。却;可是。
        sentences:
          - ancient: 穷<且>益坚，不坠青云之志。（《滕王阁序》）
            url: xxxx
            vernacular: 境遇虽然困苦，但节操应当更加坚定，决不能抛弃自己的凌云壮志。
      - trans: ❻表示选择。还是;抑或。
        sentences:
          - ancient: 富贵者骄人乎？<且>贫贱者骄人乎？（《史记•魏世家》）
            url: xxxx
            vernacular: 是富贵的人能对人自高自大呢，还是贫贱的人能对人自高自大呢？
  - word: 且
    type: 【助词】
    phonetic: qie3
    tags:
      - 高中
    samples:
      - trans: 用在句首。
        sentences:
          - ancient: <且>夫水之积也不厚，则其负大舟也无力。（《逍遥游》）
            url: xxxx
            vernacular: 水汇积不深，它浮载大船就没有力量。
