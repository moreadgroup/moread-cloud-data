---
words:
  - word: 岁
    type: 【名词】
    phonetic: sui4
    tags:
      - 高中
    samples:
      - trans: ❶木星。
        sentences:
          - ancient: 昨夜斗回北，今朝<岁>起东。（唐•孟浩然《田家元日》）
            url: xxxx
            vernacular: 昨天夜里北斗星的斗柄转向东方，今天早晨新的一年又开始了。
      - trans: ❷年。
        sentences:
          - ancient: 自吾氏三世居是乡，积于今六十<岁>矣。（《捕蛇者说》）
            url: xxxx
            vernacular: 自从我家三代住到这个地方，累计到现在，已经六十年了
          - ancient: 潯阳地僻无音乐，终<岁>不闻丝竹声。（《琵琶行》）
            url: xxxx
            vernacular: 浔阳这地方荒凉偏僻没有音乐，一年到头也听不见管弦奏鸣。
          - ancient: 桑之落矣，其黄而陨。自我徂尔，三<岁>食贫。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 桑树落叶的时候，它的叶子枯黄，纷纷掉落了。自从嫁到你家，多年来忍受贫苦的生活。
      - trans: ❸时间;光阴。
        sentences:
          - ancient: 日月逝矣，<岁>不我与。（《论语•阳货》）
            url: xxxx
            vernacular: 时间消逝了，年岁是不等待人的。
          - ancient: 汩（yu4，迅疾）余若将不及兮，恐年<岁>之不吾与。（《离骚》）
            url: xxxx
            vernacular: 光阴似箭我好像跟不上，岁月不等待人令我心慌。
      - trans: ❹年成;年景。
        sentences:
          - ancient: 王无罪（归罪于）<岁>，斯天下之民至焉。（《寡人之于国也》）
            url: xxxx
            vernacular: 大王不要归罪于年成，这样，普天下的百姓便会涌向您这儿来了。
          - ancient: 苟无<岁>，何以有民？（《赵威后问齐使》）
            url: xxxx
            vernacular: 假如没有收成，哪里有百姓？
      - trans: ❺每年;一年。
        sentences:
          - ancient: 其始，太医以王命聚之，<岁>赋其二。（《捕蛇者说》）
            url: xxxx
            vernacular: 起初，太医用皇帝的命令征集这种蛇，每年征收这种蛇两次
          - ancient: 今诸生学于太学，县官日有廩稍（官府发给的膳食津贴）之供，父母<岁>有裘葛之遗，无冻馁之患矣。（《送东阳马生序》）
            url: xxxx
            vernacular: 如今的学⽣们在太学中学习，朝廷每天供给膳⾷，⽗母每年都赠给冬天的⽪⾐和夏天的葛⾐，没有冻饿的忧虑了
  - word: 岁
    type: 【量词】
    phonetic: sui4
    tags:
      - 高中
    samples:
      - trans: 计算年龄的单位。
        sentences:
          - ancient: 乡人长於伯兄一<岁>，则谁敬？（《孟子•告子上》）
            url: xxxx
            vernacular: 本乡有人比你大哥大一岁，你恭敬谁？
          - ancient: 成有子九<岁>，窥父不在，窃发（掀开）盆。（《促织》）
            url: xxxx
            vernacular: 成名有个儿子，年九岁，看到爸爸不在（家），偷偷打开盆子来看。
          - ancient: 臣少多疾病，九<岁>不行，零丁孤苦，至于成立。（《陈情表》）
            url: xxxx
            vernacular: 臣小的时候经常生病，九岁时不能走路。孤独无靠，一直到成人自立。
