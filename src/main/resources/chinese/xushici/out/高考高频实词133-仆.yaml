---
words:
  - word: 仆
    type: 【动词】
    phonetic: pu1
    tags:
      - 高中
    samples:
      - trans: ❶向前倒下。
        sentences:
          - ancient: 樊哙侧其盾以撞，卫士<仆>地。（《鸿门宴》）
            url: xxxx
            vernacular: 樊哙侧着盾牌撞去，卫士跌倒在地上。
      - trans: ❷泛指倒下。
        sentences:
          - ancient: 既已消<仆>，还合粪土。（《后汉书•赵咨传》）
            url: xxxx
            vernacular: "消仆 [xiāo pú] 谓死亡。"
      - trans: ❸打倒。
        sentences:
          - ancient: 众不能堪，抶（chi4，击）而<仆>之。（《五人墓碑记》）
            url: xxxx
            vernacular: 大家不能再忍受了，把他们打倒在地。
  - word: 仆
    type: 【名词】
    phonetic: pu2
    tags:
      - 高中
    samples:
      - trans: ❶奴隶的一个等级。
        sentences:
          - ancient: 人有十等……隶臣僚，僚臣<仆>，<仆>臣台。（《左传•昭公七年》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷泛指奴隶、仆役。
        sentences:
          - ancient: 民之无辜，并其臣<仆>。（《诗经•小雅•正月》）
            url: xxxx
            vernacular: 平民百姓无罪过，也成奴仆居末流
          - ancient: 命<仆>安排新暖阁，呼童熨贴旧寒衣。（宋•刘克庄《冬景》）
            url: xxxx
            vernacular: 命令我安排新暖阁，呼唤童子熨帖旧寒衣。
          - ancient: 时夫<仆>俱阻险行后，余亦停弗上。（明•徐霞客《游黄山日记》）
            url: xxxx
            vernacular: 这时夫役和仆人都被险峻的山路阻挡落在了后面，我也停下来不在向上攀登。
          - ancient: 僮<仆>欢迎，稚子候门。三径就荒，松菊犹存。（《归去来兮辞》）
            url: xxxx
            vernacular: 家僮欢快地迎接我，幼儿们守候在门庭等待。院子里的小路快要荒芜了，松树菊花还长在那里；
      - trans: ❸车夫;驾车的人。
        sentences:
          - ancient: 将适陈，过匡，颜刻为<仆>。（《史记•孔子世家》）
            url: xxxx
            vernacular: 孔子打算前往陈国，经过匡邑，颜刻当驾车的。
          - ancient: 趋出，授绥而乘，其<仆>将驰。（《吕氏春秋•知分》）
            url: xxxx
            vernacular: 晏子说完就快步走出来，拉着车夫递过来的绳子上了车，他的车夫要赶马快跑。
      - trans: ❹自称的谦辞。
        sentences:
          - ancient: <仆>非敢如是也。（《报任安书》）
            url: xxxx
            vernacular: 我是不敢这样做的。
  - word: 仆
    type: 【代词】
    phonetic: pu2
    tags:
      - 高中
    samples:
      - trans: 谦称自己。
        sentences:
          - ancient: 意气勤勤恳恳，若望（你埋怨）<仆>不相师，而用流俗人之言。（《报任安书》）
            url: xxxx
            vernacular: 情意十分恳切诚挚，好像抱怨我没有遵从您的教诲，而是追随了世俗之人的意见。
          - ancient: 假令<仆>伏法受诛，若九牛亡（失去）一毛，与蝼蚁何以（有什么）异？（《报任安书》）
            url: xxxx
            vernacular: 假如我伏法被杀，那好像是九牛的身上失掉一根毛，同蝼蚁又有什么区别。
