      - trans: ❶我国古代对东部各少数民族的统称。后泛指少数民族。
        sentences:
          - ancient: 至于海邦，淮<夷>来同。（《诗经•鲁颂•閟宫》）
            url: xxxx
            vernacular: 一直拓展到达那海边之国，淮夷诸族归属到鲁侯跟前。
          - ancient: 西和诸戎，南抚<夷>越，外结好孙权，内修政理。（《三国志•蜀书•诸葛亮传》）
            url: xxxx
            vernacular: 往西通和各个戎族，往南安抚夷，越等族，对外和孙权交结和好，对内修好政治
          - ancient: 北蛮<夷>之鄙人，未尝见天子，故振慑，愿大王少假借之，使毕使于前。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 北方边远地区的人，没有见过天子，所以有些害怕，望大王能够稍稍原谅他，让他在大王的面前完成他的使命。
          - ancient: 台隍枕<夷>夏之交，宾主尽东南之美。（《滕王阁序》）
            url: xxxx
            vernacular: 城池座落在夷夏交界的要害之地，主人与宾客，集中了东南地区的英俊之才。
          - ancient: 【高考题例】天水<夷>夏慕德，老幼赴阙献书，乞留芝。（《晋书•鲁芝传》）
            url: xxxx
            vernacular: 天水各族百姓都非常仰慕他的美德，老人和小孩到朝廷上书，请求留下鲁芝。
      - trans: ❷指外国或外国人。
        sentences:
          - ancient: 逆<夷>各狐凭鼠伏，潜避两炮台中，不敢出入。（《广东军务记•三元里抗英》）
            url: xxxx
            vernacular: xxxx
      - trans: ❸平辈。
