      - trans: ❷愉悦。
        sentences:
          - ancient: 风雨凄凄，鸡鸣喈喈。既见君子，云胡不<夷>？（《诗经•郑风•风雨》）
            url: xxxx
            vernacular: 风吹雨打多凄凄，雄鸡啼叫声不停。既已见到意中人，心中怎能不宁静!
          - ancient: 与之论辨，言和而色<夷>。（《送东阳马生序》）
