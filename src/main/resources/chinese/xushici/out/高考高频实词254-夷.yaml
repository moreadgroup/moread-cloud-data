          - ancient: 黥布，天下猛将也，善用兵，今诸将皆陛下故等<夷>。（《史记•留侯世家》）
            url: xxxx
            vernacular: 黥布是天下的猛将，很会用兵，现今的各位将领都是陛下过去的同辈
      - trans: ❹同"痍"。创伤。
        sentences:
          - ancient: 子反（楚国大臣）命军吏察<夷>伤，补卒乘，缮甲兵，展车马，鸡鸣而食，唯命是听。（《左传•成公十六年
            url: xxxx
            vernacular: 子反命令军官视察伤情，补充步兵车兵，修理盔甲武器，陈列战车马匹，鸡叫的时候吃饭，唯主帅的命令是听。
