---
words:
  - word: 壁
    type: 【名词】
    phonetic: bi4
    tags:
      - 高中
    samples:
      - trans: ❶墙壁。
        sentences:
          - ancient: 徘徊四顾，见虫伏<壁>上。（《促织》）
            url: xxxx
            vernacular: 他东张西望，四下寻找，才看见蟋蟀趴在墙壁上。
          - ancient: 其被轰击者，则断<壁>垝（gui3，残破）楼，或黔（熏黑）其庐，或赭（zhe3，烧红）其垣。（清•薛福成《观巴藜油画记》）
            url: xxxx
            vernacular: 那些遭到炮击的地方，就见断壁破楼，有的熏黑了房屋，有的烧红了围墙。
      - trans: ❷陡峭的山崖。
        sentences:
          - ancient: 至莫（暮）夜月明，独与迈乘小舟，至绝<壁>下。（《石钟山记》）
            url: xxxx
            vernacular: 到了晚上月光明亮，特地和苏迈坐着小船到断壁下面，到断壁下面。
      - trans: ❸军营的围墙，引申为军营。
        sentences:
          - ancient: 诸侯军救巨鹿下者十余<壁>，莫敢纵兵。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 前来援救巨鹿的诸侯各军筑有十几座营垒，没有一个敢发兵出战。
          - ancient: 帝晨驰入韩信、张耳<壁>，夺之军。（《汉书•高帝纪上》）
            url: xxxx
            vernacular: 清晨，自称为汉王使者， 驱驰入张耳、 韩信的阵地， 亲自掌握这支队伍。
          - ancient: 及楚击秦，诸将皆从<壁>上观。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 到楚军进攻秦军时，各路将士都在营帐中观看。
          - ancient: 汉王复入<壁>，深堑而守之。（《史记•高祖本纪》）
            url: xxxx
            vernacular: "汉王重新回到城堡中，墙外挖深沟而坚守。"
  - word: 壁
    type: 【动词】
    phonetic: bi4
    tags:
      - 高中
    samples:
      - trans: 筑营驻扎。
        sentences:
          - ancient: 魏王恐，使人止晋鄙，留军<壁>邺，名为救赵，实持两端以观望。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 魏王很害怕，就派人阻止晋鄙进军，把军队留在邺城扎营驻守，名义上是救赵国，实际上是采取两面倒的策略来观望形势的发展。
          - ancient: 项王军<壁>垓下，兵少食尽。（《项羽之死》）
            url: xxxx
            vernacular: 项王的部队驻守在垓下，兵少粮尽。
