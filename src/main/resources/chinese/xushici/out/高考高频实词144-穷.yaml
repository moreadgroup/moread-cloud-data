---
words:
  - word: 穷
    type: 【名词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: 尽头。
        sentences:
          - ancient: 天高地迥（远），觉宇宙之无<穷>；兴尽悲来，识盈虚（盈满和亏损）之有数。（《滕王阁序》）
            url: xxxx
            vernacular: 天高地远，感到宇宙浩渺无垠;兴致消尽，悲哀涌来，认识到事物的兴衰成败自有定数。
          - ancient: 四时之景不同，乐亦无<穷>也。（《醉翁亭记》）
            url: xxxx
            vernacular: 随着时间季节不同，快乐也是没有穷尽的
  - word: 穷
    type: 【动词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: ❶极;尽。
        sentences:
          - ancient: 而世又不与能死节者比，特以为智<穷>罪极，不能自免，卒就死耳。（《报任安书》）
            url: xxxx
            vernacular: 世人又不会拿我之死与能殉节的人相比，只会认为我是智尽无能、罪大恶极，不能免于死刑，而终于走向死路罢了！
          - ancient: 轲既取图奉之，发图，图<穷>而匕首见。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲拿了地图捧送给秦王，打开地图，地图全部打开，匕首就露了出来。
      - trans: ❷寻求尽头;到达尽头。
        sentences:
          - ancient: 渔人甚异之，复前行，欲<穷>其林。（《桃花源记》）
            url: xxxx
            vernacular: 渔人对此感到非常诧异。他继续向前行船，想要走到林子的尽头。
          - ancient: 问其深，则其好游者不能<穷>也。（《游褒禅山记》）
            url: xxxx
            vernacular: 打问它的深度，就是那些喜欢游险的人也未能走到尽头
      - trans: ❸追究到底。
        sentences:
          - ancient: 事之至难解者，问之人以<穷>其短。（清•刘开《问说》）
            url: xxxx
            vernacular: 最难做到的事情是，向某人请教直到无以作答.
      - trans: ❹用尽。
        sentences:
          - ancient: <穷>予生之光阴以疗梅也哉！（《病梅馆记》）
            url: xxxx
            vernacular: 竭尽我毕生的时间来治疗病梅呢！
      - trans: ❺遍及。
        sentences:
          - ancient: 渔舟唱晩，响<穷>彭蠡之滨。（《滕王阁序》）
            url: xxxx
            vernacular: 傍晚时分，渔夫在渔船上歌唱，那歌声响彻彭蠡湖滨
  - word: 穷
    type: 【形容词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: ❶走投无路，陷入困境。
        sentences:
          - ancient: 人<穷>则反本，故劳苦倦极，未尝不呼天也。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 人处于困境就会追念本源，所以到了极其劳苦疲倦的时候，没有不呼叫上天的。
          - ancient: <穷>且益坚，不坠青云之志。（《滕王趋阁序》）
            url: xxxx
            vernacular: 遭遇穷困而意志更加坚定，在任何情况下也不放弃自己的凌云之志。
          - ancient: <穷>则独善其身，达（得志）则兼济天下。（《孟子・尽心上》）
            url: xxxx
            vernacular: 不见用的时候就只顾自我修养，见用的时候就要为天下人造福。（不得志的时候就要管好自己的道德修养，得志的时候就要努力让天下人都能得到好处。)
          - ancient: 人情同于怀土兮，岂<穷>达而异心？（汉•王粲《登楼赋》）
            url: xxxx
            vernacular: 人思念故乡的感情是相同的，岂会因为穷困还是显达而表现不同？
          - ancient: 樊将军以<穷>困来归丹，丹不忍以己之私，而伤长者之意，愿足下更虑之！（《荆轲刺秦王》）
            url: xxxx
            vernacular: 樊将军因为走投无路处境窘迫而来归附我，我不忍心由于自己个人的私仇而伤害长者的心意，希望您另外考虑对策吧。
      - trans: ❷生活贫穷。
        sentences:
          - ancient: 为宫室之美、妻妾之奉、所识<穷>乏者得（通"德"，感恩）我与？（《鱼我所欲也》）
            url: xxxx
            vernacular: 为了住宅的华丽、妻妾的侍奉、让所认识穷困贫乏的人感激他们的恩德而接受了它。
          - ancient: 子孙习其家凤，今多<穷>困。（《训俭示康》）
            url: xxxx
            vernacular: 子孙习染他的这种家风，现在大多穷困了。
