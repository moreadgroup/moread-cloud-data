---
words:
  - word: 阙
    type: 【名词】
    phonetic: que4
    tags:
      - 高中
    samples:
      - trans: ❶古代王宫、祠庙门前两边的高大建筑物，左右各一，中间为通道。
        sentences:
          - ancient: 人有当<阙>而哭者。（《战国策•齐策六》）
            url: xxxx
            vernacular: 有人在宫门前啼哭
          - ancient: 城<阙>辅三秦，风烟望五津。（唐•王勃《送杜少府之任蜀州》）
            url: xxxx
            vernacular: 三秦之地守护着长安，透过迷茫的烟雾遥望蜀地。
          - ancient: 不知天上宫<阙>，今夕是何年。（《水调歌头•明月几时有》）
            url: xxxx
            vernacular: 不知道天上的宫殿，今晚是哪一年。
      - trans: ❷墓道前两边的石牌坊。
        sentences:
          - ancient: 音尘绝，西风残照，汉家陵<阙>。（唐•李白《忆秦娥》）
            url: xxxx
            vernacular: 良人不见、音信断绝，只有西风萧瑟，残阳似血，拂照着那汉家帝王墓道前两边的石牌坊。
      - trans: ❸帝王所居之处；宫殿。
        sentences:
          - ancient: （曹）操乃诣<阙>贡献，禀公卿以下，因奏韩暹、张杨之罪。（《后汉书•董卓传》）
            url: xxxx
            vernacular: 曹操于是到朝廷贡奉物，赠给公卿以下百官，趁机奏报韩暹、张杨的罪过。
          - ancient: 【高考题例】即偕诸大臣伏<阙>上疏，疏入，帝惊泣不食，瑾等大惧。（《明史•韩文传》）
            url: xxxx
            vernacular: （韩文）立即偕同各位大臣匍匐在金銮宝殿给皇帝上书，奏章递入皇宫，皇帝吃惊得哭泣着吃不下饭，刘瑾等人十分恐惧。
          - ancient: 炀帝嗣位，被追入朝，百姓攀恋，累日不能出境，诣<阙>上书致请者，前后数百人。（《北史•来护儿传》）
            url: xxxx
            vernacular: 炀帝继位，来护儿被召入朝，百姓留恋怀念他。许多日仍不能出境，到朝中上书请求将来护儿留下来的人，前后有几百人。
  - word: 阙
    type: 【名词】
    phonetic: que1
    tags:
      - 高中
    samples:
      - trans: ❶空隙;缺口。
        sentences:
          - ancient: 自三峡七百里中，两岸连山，略无<阙>处。（《三峡》）
            url: xxxx
            vernacular: 在三峡七百里之间，两岸都是连绵的高山，完全没有中断的地方
      - trans: ❷空缺。
        sentences:
          - ancient: 【高考题例】先是，察官<阙>，朝论多属燧，以未历县，遂除左司谏。（《宋史•萧燧传》）
            url: xxxx
            vernacular: 在此之前，监察御史有了缺额（察官，监察御史的别称），朝中的议论大多属意萧燧，但因为他没有在县任职的经历，于是任命他为左司谏。
      - trans: ❸过失;弊病。
        sentences:
          - ancient: 愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补<阙>漏，有所广益。（《出师表》）
            url: xxxx
            vernacular: 我认为宫中之事，无论事情大小，都拿来跟他商讨，这样以后再去实施，一定能够弥补缺点和疏漏之处。
          - ancient: 有可以救济人病（指民疾），裨补（增益;完补）时<阙>。（唐•白居易《与元尤屯》）
            url: xxxx
            vernacular: 救人民疾苦，弥补时政的缺失
          - ancient: 【高考题例】臣任功曹王涣以简贤选能，主簿镡显拾遗补<阙>，臣奉宣诏书而已。（《后汉书•王涣传》）
            url: xxxx
            vernacular: 臣任用功曹王涣来选用贤明有才能的人，任用主簿坛显来纠正过失补充遗漏。臣不过捧读韶书罢了。
  - word: 阙
    type: 【动词】
    phonetic: que1
    tags:
      - 高中
    samples:
      - trans: ❶同"缺"。空（kong4）着，留待以后处理。
        sentences:
          - ancient: 君子于其所不知，盖<阙>如也。（《论语•子路》）
            url: xxxx
            vernacular: 君子对于他所不知道的学问， 宁可暂缺， 但不瞎说。
      - trans: ❷同"缺"。缺少。
        sentences:
          - ancient: 南渡桂水<阙>舟楫。（唐•杜甫《暮归》）
            url: xxxx
            vernacular: 想南去渡过桂水却没有船只，想北回秦川又到处战乱不息。
          - ancient: 小子不敏，请悉论先人所次旧闻，弗敢<阙>。（《史记•太史公自序》）
            url: xxxx
            vernacular: 儿子虽然驽笨，但我会详细编纂先人所整理的史实古事，不敢有缺。
      - trans: ❸损伤；损害。
        sentences:
          - ancient: 既东封郑，又欲肆其西封，若不<阙>秦，将焉取之？<阙>秦以利晋，唯君图之。（《烛之武退秦师》）
            url: xxxx
            vernacular: (现在它）已经在东边使郑国成为它的边境，又想要向西扩大边界。如果不使秦国土地亏损，将从哪里得到（他所奢求的土地）呢？削弱秦国对晋国有利，希望您考虑这件事！
