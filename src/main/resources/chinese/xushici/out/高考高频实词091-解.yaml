---
words:
  - word: 解
    type: 【名词】
    phonetic: jie3
    tags:
      - 高中
    samples:
      - trans: ❶见识;见解。
        sentences:
          - ancient: 融玄义无师法，而神<解>过人。（《南史•张融传》）
            url: xxxx
            vernacular: 张融的玄学没有师承，但是体会解悟超过常人
      - trans: ❷乐曲或诗歌的章节。
        sentences:
          - ancient: 《古今乐录》曰：'伧（chen）歌以一句为一<解>，中国以一章为一<解>'。（《乐府诗集•相和歌辞解题》）
            url: xxxx
            vernacular: 南北朝时期北地乐府民歌一句话作为一个乐曲章节，
          - ancient: 乃歌一<解>以送之。（唐•李贺《送沈亚之歌》并序）
            url: xxxx
            vernacular: 于是创作一首诗歌赠送给他。
  - word: 解
    type: 【动词】
    phonetic: jie3
    tags:
      - 高中
    samples:
      - trans: ❶剖开;分割肢体。
        sentences:
          - ancient: 庖丁为文惠君<解>牛。（《庄子•养生主》）
            url: xxxx
            vernacular: 庖丁给梁惠王宰牛。
          - ancient: 及入，宰夫将<解>鼋（yuan2，大鳖），相视而笑。（《左传•宣公四年》）
            url: xxxx
            vernacular: 两人进宫后，果然发现厨子正将一只煮熟了的巨大老鳖切块儿装盘（那时诸侯家的食器为“鼎”），两人会心地相视一笑。
          - ancient: 虽体<解>吾犹未变会，岂余心之可惩？（《离骚》）
            url: xxxx
            vernacular: 即使粉身碎骨也不改变，难道我能受警戒而彷徨？
          - ancient: 【高考题例】宁海民陈德仲支<解>黎异，异妻屡诉不得直。鼎乃逮德仲，鞠实，立正其罪。（《明史•熊鼎传》）
            url: xxxx
            vernacular: 宁海人陈德仲肢解了黎异，黎异的妻子多次投诉不得伸冤。熊鼎逮捕了陈德仲，审讯核实实情，立刻就治了他的罪。
      - trans: ❷分散；裂开。
        sentences:
          - ancient: 晋文公<解>曹地以分诸侯。（《国语•鲁语上》）
            url: xxxx
            vernacular: 晋文公分割曹国的土地，分给各诸侯国。
          - ancient: 秦之积衰，天下土崩瓦<解>，虽有周旦之材，无所复陈其巧。（《史记•秦始皇本纪》）
            url: xxxx
            vernacular: 秦朝的衰弱是长久而成的，当时天下已像土墙倒塌，房瓦破裂，即使有周公旦那样的才能，也无法施展他的良策
      - trans: ❸解开;解下。
        sentences:
          - ancient: 善结，无绳约（yue1，绳索）而不可<解>。（《老子》二十七章）
            url: xxxx
            vernacular: 最巧妙的结法，是不用绳带，却也无法轻易解开。
          - ancient: <解>其棕缚，以五年为期，必复之全之。（《病梅馆记》）
            url: xxxx
            vernacular: 解开捆绑它们棕绳的束缚；把五年作为期限，一定使它们恢复和使它们完好。
          - ancient: 於是有缚广武君而致（送到）戏（旗帜）下者，信乃<解>其缚（绳索），东乡（向）坐，西乡对，师事（侍奉）之。（《史记•淮阴侯列传》）
            url: xxxx
            vernacular: 不一会儿，就有人捆绑着广武君送到军营，韩信亲自给他解开绳索，请他面向东坐，自己面向西对坐着，像对待老师那样对待他。
      - trans: ❹解除;消除。
        sentences:
          - ancient: 挫其锐，<解>其纷（杂乱）；和其光，同其尘。（《老子》五十六章）
            url: xxxx
            vernacular: 挫去人们的锋芒，解脱他们的纷争，收敛他们的光耀，混同他们的尘世。
          - ancient: 今有一言，可以<解>燕国之患而报将军之仇者，何如？（《荆轲刺秦王》）
            url: xxxx
            vernacular: 现在有一个建议，可以用来解除燕国的忧患，报将军的深仇大恨，怎么样？
          - ancient: 【高考题例】后怒<解>，方被引入，谓日："公意乃尔，朕复何望!" 护儿因不敢言。（《北史•来护儿传》）
            url: xxxx
            vernacular: 稍后怒气缓解，才叫人引进，对护儿说:“公意既然如此，朕还有什么指望呢?”护儿于是不敢说话。
      - trans: ❺摆脱（困境），认……中解脱。
        sentences:
          - ancient: 沛公以樊哙、张良故，得<解>归。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 沛公因为是带着樊哙、张良去的，才得以脱身返回。
      - trans: ❻溶解;溶化。
        sentences:
          - ancient: 于时冰皮始<解>，波色乍明。（《满井游记》）
            url: xxxx
            vernacular: 在这时河上的冰面刚刚融化，水波开始发出亮光
      - trans: ❼排解;调停。
        sentences:
          - ancient: 所贵于天下之士者，为人排患、释难、<解>纷乱而无所取也。（《战国策•赵策三》）
            url: xxxx
            vernacular: 天下之士所看重的，是替人排除忧患，解除危难，排解纷乱而不收取任何报酬。
      - trans: ❽解说;解析。
        sentences:
          - ancient: 孔子自<解>，安能<解>乎？（《论衡•问孔》）
            url: xxxx
            vernacular: 孔子自己辩解，怎么能辩解得了呢？
          - ancient: 师者，所以传道受业<解>惑也。（《师说》）
            url: xxxx
            vernacular: 老师，就是传授道理、教授学业、解释疑难问题的人。
      - trans: ❾懂得;理解。
        sentences:
          - ancient: 大惑者终身不<解>，大愚者终身不灵。（《庄子•天地》）
            url: xxxx
            vernacular: 真正迷惑的人，一辈子也不会醒悟；真正愚昧的人，一辈子也不会明白。
          - ancient: 好读书，不求甚<解>。（晋•陶渊明《五柳先生传》）
            url: xxxx
            vernacular: 喜欢读书，只领会要旨不在一字一句的解释上过分探究
          - ancient: 惑而不从师，其为惑也，终不<解>矣。（《师说》）
            url: xxxx
            vernacular: 有了疑惑，如果不跟老师学习，那些成为困惑的问题，就始终不能解开。
  - word: 解
    type: 【形容词】
    phonetic: xie4
    tags:
      - 高中
    samples:
      - trans: 通"懈"。懈怠。
        sentences:
          - ancient: 秦人熹，秦军<解>，因大破之。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 秦地的人都很高兴，秦军松懈，于是大破秦军。
          - ancient: 而（李）广身自以大黄（弓弩名）射其裨将，杀数人，胡虏益<解>。（《史记•李将荤列传》）
            url: xxxx
            vernacular: 而李广亲自用大黄弩弓射匈奴的副将，杀死了好几个，匈奴军才渐渐散开。
