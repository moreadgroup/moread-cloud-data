---
words:
  - word: 中
    type: 【名词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: ❶处在两端之间的；中间；当中。
        sentences:
          - ancient: 击其首则尾至，击其尾则首至，击其<中>则首尾俱至。（《孙子•九地》）
            url: xxxx
            vernacular: 击它的头部，它的尾部弹过来救应，击它的尾部，它的头部弹过来救应，击它的腰部，它的头尾一齐弹过来救应。
          - ancient: 浑然而<中>处者，世谓之元气。（唐•柳宗元《天说》）
            url: xxxx
            vernacular: 那弥漫充塞在天地之间的东西，人们称它为元气
          - ancient: 舟回至两山间，将入港口，有大石当<中>流，可坐百人，空<中>而多窍。（《石钟山记》）
            url: xxxx
            vernacular: 船回到两山之间，将要进入港口，有块大石头正对着水的中央，上面可坐百来个人，中间是空的，而且有许多窟窿
          - ancient: 座<中>泣下谁最多？江州司马青衫湿。（《琵琶行》）
            url: xxxx
            vernacular: 要问在座之中谁流的眼泪最多？我江州司马泪水湿透青衫衣襟！
      - trans: ❷里;内。
        sentences:
          - ancient: 以<中>有足乐者，不知口体之奉不若人也。（《送东阳马生序》）
            url: xxxx
            vernacular: 因为心中有足以使自己高兴的事，并不觉得吃穿的享受不如人家。
          - ancient: 一屠晩归，担<中>肉尽，止有剩骨。（《狼》）
            url: xxxx
            vernacular: 一个屠户傍晚回来，担子里的肉已经卖完了，只剩下骨头。
          - ancient: 相与枕藉乎舟<中>，不知东方之既白。（《赤壁赋》）
            url: xxxx
            vernacular: 大家互相枕着垫着睡在船上，不知不觉东方已经露出白色的曙光。
          - ancient: 箱帘六七十，绿碧青丝绳，物物各自异，种种在其<中>。（《孔雀东南飞》）
            url: xxxx
            vernacular: 大大小小的箱子有六七十个，都是用碧绿的丝线捆扎紧。里面的东西都各不相同，各种各样的东西都收藏其中。
      - trans: ❸中心。
        sentences:
          - ancient: 溯游从之，宛在水<中>央。（《诗经•秦风•兼葭》）
            url: xxxx
            vernacular: 顺着流水去找她，仿佛在那水中央。
          - ancient: <中>有都柱，傍行八道，施关发机。（《张衡传》）
            url: xxxx
            vernacular: 内部中央有根粗大的铜柱，铜柱的周围伸出八条滑道，还装置着枢纽，用来拨动机件。
      - trans: ❹内心;胸中。
        sentences:
          - ancient: 荃（香草名。这里比喻君王）不察余之<中>情兮，反信谗而齎（ji4，盛）怒。（《离骚》）
            url: xxxx
            vernacular: 你不深入了解我的忠心，反而听信谗言对我发怒。
          - ancient: 明明如月，何时可掇？忧从<中>来，不可断绝。（《短歌行》）
            url: xxxx
            vernacular: 当空悬挂的皓月哟，什么时候可以摘取呢？心中深深的忧思，喷涌而出不能停止。
          - ancient: 淮阴屠中少年有侮信者，曰："若（你）虽长大，好带刀剑，<中>情怯耳。"（《史记.淮阴一侯列殆》）
            url: xxxx
            vernacular: 在淮阴有一群恶少当众羞辱韩信。有一个屠夫对韩信说:"你虽然长得又高又大，喜欢带着剑，其实你胆子小得很!
      - trans: ❺内脏
        sentences:
          - ancient: 阴阳之类，经脉之道，五<中>所主，何藏最贵？（《素问•阴阳类论》）
            url: xxxx
            vernacular: 按照阴阳的分析方法和关于经脉的理论，以及五脏主时的规律，你认为哪一脏最重要？
      - trans: ❻中期。
        sentences:
          - ancient: <中>兴机会，庶几在此。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 复兴宋朝的机会，大概就在此一举了。
      - trans: ❼中等。
        sentences:
          - ancient: 才能不及<中>人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
            url: xxxx
            vernacular: 才能不如普通人，并没有孔丘，墨翟那样的贤德，也不像陶朱、猗顿那样富有
      - trans: ❽中原。
        sentences:
          - ancient: 四十三年，望<中>犹记，烽火扬州路（宋元时期的行政区域名）。（《永遇乐•京口北固亭怀古力
            url: xxxx
            vernacular: 四十三年过去了，如今瞭望长江北岸，还记得扬州战火连天的情景。
  - word: 中
    type: 【形容词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: ❶正;不偏斜。
        sentences:
          - ancient: 故道之所善，<中>则可从，畸则不可为，匿则大惑。（《荀子•天论》）
            url: xxxx
            vernacular: 因此，任何一项政策举措都要用道贯来鉴定，它鉴定为正确的，就该依从；偏离了它，就不可以实行；要是根本不用它作鉴定就付诸行动，那就是极大的欺骗。
      - trans: ❷中等;不高不低。
        sentences:
          - ancient: 才能不及<中>人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
            url: xxxx
            vernacular: 才能不如普通人，并没有孔丘，墨翟那样的贤德，也不像陶朱、猗顿那样富有
          - ancient: <中>家以上，皆竭资取保。（《狱中杂记》）
            url: xxxx
            vernacular: 中等以上的人家，都尽其所有出钱取保
  - word: 中
    type: 【数词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: 半;一半。
        sentences:
          - ancient: 曰黄昏以为期兮，羌<中>道而改路。（《离骚》）
            url: xxxx
            vernacular: 我们两个定好在黄昏成亲，你为什么在半途就改变心意了呢。
          - ancient: 先帝创业未半而<中>道崩殂（殂cu2，指皇帝死亡），今天下三分，益州疲弊，此诚危急存亡之秋也。（《出师表》）
            url: xxxx
            vernacular: 先帝开创的大业未完成一半却中途去世了。现在天下分为三国，蜀汉国力薄弱，处境艰难。这确实是国家危急存亡的时期啊。
          - ancient: 夫子积学，当日知其所亡，以就懿（美好）德。若<中>道而归，何异断斯织乎？（《后汉书：列女传》）
            url: xxxx
            vernacular: 你积累学问，就应当‘每天都学到自己不懂的东西’，以此成就自己的美德；你中途就回来了，那同切断这丝织品又有什么不同呢？
          - ancient: 蟋蟀何感，<中>夜哀鸣。（晋•傅玄《短歌行》）
            url: xxxx
            vernacular: 蟋蟀有什么情感呢? 半夜里它还在哀哀地鸣叫。
          - ancient: 谢（辞别）家事夫婿，<中>道还兄门。（《孔雀东南飞》）
            url: xxxx
            vernacular: 离开了家出嫁侍奉丈夫，中途又回到哥哥家里
          - ancient: 穷睇眄于<中>天，极娱游于暇日。（《滕王阁序》）
            url: xxxx
            vernacular: 向天空中极目远眺，在假日里尽情欢娱。
  - word: 中
    type: 【动词】
    phonetic: zhong4
    tags:
      - 高中
    samples:
      - trans: ❶符合;适合。
        sentences:
          - ancient: 木直<中>绳（测直的工具），輮（通"煣"，用火烤使之弯曲）以为轮，其曲<中>规（测圆的工具）。（《劝学》）
            url: xxxx
            vernacular: 一块木材直得合乎墨线，假如用火烤使它弯曲做成车轮，它的弧度就可以符合圆规.
          - ancient: 然睹促织，隐<中>胸怀。（《促织》）
            url: xxxx
            vernacular: 但是看到上面画着蟋蟀，暗合自己的心事
          - ancient: 【高考题例】景监日："子何以<中>吾君？吾君之欢甚也。"（《史记•商君列传》）
            url: xxxx
            vernacular: 景监对卫鞅说：“你用什么说中我国君的心意?我的国君高兴得很啊。”
      - trans: ❷正中目标。
        sentences:
          - ancient: 射者<中>，弈者胜。（《醉翁亭记》）
            url: xxxx
            vernacular: 投壶的人中了，下棋的赢了
          - ancient: 成骇立愕呼，幸啄不<中>，虫跃去尺有咫（古代长度单位）。（《促织》）
            url: xxxx
            vernacular: 成名吓得（站在那里）惊叫起来，幸喜没有啄中，小蟋蟀一跳有一尺多远。
          - ancient: 荆轲废，乃引其匕首提（掷）秦王，不<中>，<中>柱。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲伤残倒地了，就举起匕首投向秦王，没投中，击中了柱子。
          - ancient: 【高考题例】敌攻石尖山，浩冒阵而前，流矢<中>左肋。（《宋史•郭浩传》）
            url: xxxx
            vernacular: 敌人攻打石尖山，郭浩迎着敌阵前进，被流箭射中左肋
          - ancient: 整弓复<中>之，观者诵叹，帝亲赐酒劳之。（《宋史•何灌传》）
            url: xxxx
            vernacular: 整理弓箭再次射中箭靶，观看的人都赞叹，皇上亲自赐酒犒劳他。
      - trans: ❸遭受;遭遇。
        sentences:
          - ancient: （曹）操虽心知<中>计，却不肯认错。（《三国演义》四十五回）
            url: xxxx
            vernacular: xxxx
      - trans: ❹中伤;使受到伤害。
        sentences:
          - ancient: （何）显怒，欲以吏事<中>商。（《汉书•何武传》）
            url: xxxx
            vernacular: 何显大怒，想要藉官吏职事中伤求商。
      - trans: ❺科举及第;考中。
        sentences:
          - ancient: 三年大比（乡试），以诸生试之直省，曰乡试。<中>式者为举人。（《明史•选举志》）
            url: xxxx
            vernacular: 三年大考，以诸生在直省考试，叫做乡试。考试合格的便是举人。
      - trans: ❻通"仲"。如：中夏、中冬。
