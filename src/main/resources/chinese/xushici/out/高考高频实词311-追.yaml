---
words:
  - word: 追
    type: 【动词】
    phonetic: zhui1
    tags:
      - 高中
    samples:
      - trans: ❶追赶;追击。
        sentences:
          - ancient: 秦有余力而制其弊，<追>亡逐北，伏尸百万，流血漂橹。（《过秦论》）
            url: xxxx
            vernacular: 秦有剩余的力量趁他们困乏而制服他们，追赶逃走的败兵，百万败兵横尸道路，流淌的血液可以漂浮盾牌。
          - ancient: 穷饿无聊，<追>购又急，天高地迥，号呼靡及。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 困窘饥饿，无依无靠，元军悬赏追捕得又很紧急，天高地远，号呼不应。
          - ancient: 曹操之众，远来疲敝，闻<追>豫州（刘备，任豫州牧），轻骑一日一夜行三百余里。（《资治痛鉴•汉纪五十七》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷跟随。
        sentences:
          - ancient: 背绳墨以<追>曲兮，竞周容以为度。（《离骚》）
            url: xxxx
            vernacular: 违背是非标准追求邪曲，争着苟合取悦作为法则。
      - trans: ❸追索。
        sentences:
          - ancient: 宰严限<追>比（官吏限定时间命令吏役办某事，越期要受杖责），旬余，杖至百。（《促织》）
            url: xxxx
            vernacular: 县官严定期限，严厉追逼，成名在十几天中被打了上百板子
      - trans: ❹追思;追念。
        sentences:
          - ancient: 然侍卫之臣不懈于内，忠志之士忘身于外者，盖<追>先帝之殊遇（恩遇），欲报之于陛下也。（《出师表》）
            url: xxxx
            vernacular: 不过宫廷里侍从护卫的官员不懈怠，战场上忠诚有志的将士们奋不顾身，大概是他们追念先帝对他们的特别的知遇之恩（作战的原因），想要报答在陛下您身上。
          - ancient: 此情可待成<追>忆？只是当时已惘然。（唐•李商隐《锦瑟》）
            url: xxxx
            vernacular: xxxx
      - trans: ❺弥补;挽救。
        sentences:
          - ancient: 悟已往之不谏，知来者之可<追>。（《归去来兮辞》）
            url: xxxx
            vernacular: 认识到过去的错误已经不可挽回，知道未来的事还来得及补救。
          - ancient: <追>尊庄襄王为太上皇。（《史记•秦始皇本纪》）
            url: xxxx
            vernacular: xxxx
          - ancient: 【高考题例】太祖即吴王位，<追>封云东丘郡侯，立忠臣祠祀之。（《明史•花云传》）
            url: xxxx
            vernacular: 太祖做了吴王后，追封花云为东丘郡侯，建造忠臣祠祭祀他。
