---
words:
  - word: 拟
    type: 【动词】
    phonetic: ni3
    tags:
      - 高中
    samples:
      - trans: ❶揣度;斟酌。
        sentences:
          - ancient: <拟>之而后言，议之而后动。（《周易•系辞上》）
            url: xxxx
            vernacular: 斟酌天下最好的实际情况以后才记载下来的，是选择天下最好的活动以后才付诸创作行动的，经斟酌选择的这些典型活动可用来帮助人们将所进行的各种活动向合情合理的方向改变。
      - trans: ❷打算。
        sentences:
          - ancient: 丈人祠西佳气浓，缘云<拟>住最高峰。（唐•杜甫《丈人山》）
            url: xxxx
            vernacular: 丈人祠的西边风景独好，因为云彩都在最高峰之上。
          - ancient: 闻说双溪春尚好，也<拟>泛轻舟。（宋•李清照《武陵春•春晚》）
            url: xxxx
            vernacular: 听人说双溪的春色还不错，那我就去那里划划船，姑且散散心吧。
          - ancient: 【高考题例】初，选人调（调动职位）<拟>（打算任用），先南曹，次考功。（《宋史•许将传》）
            url: xxxx
            vernacular: 当初，选拔调动人才，先要经过南曹，接着是考功。
      - trans: ❸比拟。
        sentences:
          - ancient: 自数十里外望之，碧峰曖然孤起，上干云霄，已非它山可<拟>。（《过小孤山大孤山》）
            url: xxxx
            vernacular: 从几十里外看去，小孤山碧绿的山峰高高耸立着，直插云霄，已经不是别的山可以相比的了。
      - trans: ❹比画；做样子。
        sentences:
          - ancient: 挟儿南驰，取胡儿弓引满以<拟>追骑。（宋•黄庭坚《题摹燕郭尚父图》）
            url: xxxx
            vernacular: xxxx
          - ancient: 复举剑<拟>之，武不动。（《苏武传》）
            url: xxxx
            vernacular: 卫律又举剑对准苏武，苏武岿然不动。
      - trans: ❺模仿;模拟。
        sentences:
          - ancient: 宦者得志，无所惮畏，并起第宅，<拟>则宫室。（《后汉书•张让传》）
            url: xxxx
            vernacular: 宦官得志，无所畏惧，大家仿照宫室营造私人住宅。
          - ancient: （张）衡乃<拟>班固《两都》作《二京赋》，因以讽谏。（《张衡传》）
            url: xxxx
            vernacular: 张衡于是模仿班固的《两都赋》写了《二京赋》，用它来（向朝廷）讽喻规劝。
      - trans: ❻类似。
        sentences:
          - ancient: 吾观《太玄》，方知子云妙极道术，乃与五经相<拟>，非徒传记之属。（《后汉书•张衡传》）
            url: xxxx
            vernacular: 我阅读了《太玄经》，才知扬雄精妙地穷尽了天地和人事的法则，竟然可以和《五经》所阐述的道理相比拟，而且不仅仅是经书注释一类的书籍
      - trans: ❼起草;撰写。
        sentences:
          - ancient: 皇上欲幵懋（mao4）勤殿，设顾问官，命君<拟>旨。（清•梁启超《谭嗣同》）
            url: xxxx
            vernacular: 皇上想开懋勤殿设顾问官，指令谭君起草诏书
