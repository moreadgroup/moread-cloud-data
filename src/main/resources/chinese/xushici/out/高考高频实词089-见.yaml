---
words:
  - word: 见
    type: 【名词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: 见解;见识。
        sentences:
          - ancient: 谡大笑曰：汝真女子之<见>！兵法云："凭高视下，势如劈竹。"若魏兵到来，吾教他片甲不回！"（《三国演义》九十五回）
            url: xxxx
            vernacular: 马谡大笑地说：你真是女子的思维！兵法上说：“高处俯视下面，就像砍竹一样容易。”如果魏国的军队来了，我将使他们片甲不回！”
  - word: 见
    type: 【动词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: ❶看到。
        sentences:
          - ancient: 屈平属（Zhu3，撰写）草稿未定，上官大夫<见>而欲夺之，屈平不与。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 楚怀王派屈原制定国家的法令，屈原编写的草稿尚未定稿，上官大夫看见了，就想把草稿强取为己有，屈原不赞同。
          - ancient: 虎<见>之，庞然大物也，以为神，蔽林间窥之。（《黔之驴》）
            url: xxxx
            vernacular: 老虎看到它是个庞然大物，以为它是什么神物，就躲在树林里偷偷看它。
      - trans: ❷见面;会面。
        sentences:
          - ancient: 移船相近邀相<见>，添酒回灯重开宴。（《琵琶行》）
            url: xxxx
            vernacular: 我们移船靠近邀请她出来相见；叫下人添酒回灯重新摆起酒宴。
      - trans: ❸拜见;谒见。
        sentences:
          - ancient: 公将战，曹刿请<见>。（《曹刿论战》）
            url: xxxx
            vernacular: 鲁庄公将要迎战，曹刿请求鲁庄公接见自己。
          - ancient: 孟子<见>梁惠王。（《孟子•梁惠王上》）
            url: xxxx
            vernacular: 孟子拜见梁惠王
      - trans: ❹召见;接见。
        sentences:
          - ancient: 于是<见>公输盘。（《公输》）
            url: xxxx
            vernacular: 于是，召见公输盘。
          - ancient: 秦王坐章台（秦国宫殿名）<见>相如。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 秦王坐在章台上接见蔺相如。
          - ancient: 愿得将军之首以献秦，秦王必喜而善<见>臣。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 希望借你樊将军的头献给秦王，秦王一定高兴而又友好地接见我。
      - trans: ❺知道;懂得。
        sentences:
          - ancient: 齿豁头童方悟此，乃翁<见>事可怜迟。（宋•陆游《示儿》）
            url: xxxx
            vernacular: 当齿齐的头发少年还没领悟到这个道理时，快要变成白发苍苍的老人才明白为时已晚。
  - word: 见
    type: 【副词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: ❶在动词前，表示被动。相当于"被"。
        sentences:
          - ancient: 信而<见>疑，忠而被谤。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 诚信而被怀疑，尽忠却被诽谤
          - ancient: 欲予秦，秦城恐不可得，徒（白白地）<见>欺。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 如果把宝玉给了秦国，秦国的城邑恐怕不可能得到，白白地受到欺骗
          - ancient: 事如此，此必及我，<见>犯乃死，重负国。（《苏武传》）
            url: xxxx
            vernacular: 事情到了如此地步，这样一定会牵连到我们。受到侮辱才去死，更对不起国家！
          - ancient: 然则将军之仇报，而燕国<见>陵之耻除矣。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 这样，那么将军的仇报了，燕国被欺侮的耻辱也就洗雪了。
          - ancient: 【高考题例】公居伊周（商伊尹和西周周公，后并称，指执掌朝:政的大臣）之位，一旦以罪<见>黜，虽欲牵黄犬（比喻过着悠闲的日子），复可得乎！（《晋书.鲁芝传》）
            url: xxxx
            vernacular: 先生您处在伊周的高位，一旦获罪被罢免，即使想拉一条狗都不可以了(更不要说统领人)
      - trans: ❷加在【动词】前用于指称自己，表示承受别人的某种动作行为。
        sentences:
          - ancient: 遍报诸所尝<见>德者。（《史记•苏秦列传》）
            url: xxxx
            vernacular: 并且报答了以前所有对他有恩德的人。
          - ancient: 生孩六月，慈父<见>背（弃我而死去）。（《陈情表》）
            url: xxxx
            vernacular: 刚出生六个月，父亲就弃我而死去。
          - ancient: 君既若<见>录，不久望君来。（《孔雀东南飞》）
            url: xxxx
            vernacular: 既然承蒙你这样的记着我，不久之后我会殷切地盼望着你来。
  - word: 见
    type: 【动词】
    phonetic: xian2
    tags:
      - 高中
    samples:
      - trans: 同"现"。❶显现；出现。
        sentences:
          - ancient: （荆）轲既取图奏（进献）之，秦王发图，图穷而匕首<见>。（《史记•刺客列传》）
            url: xxxx
            vernacular: 荆轲拿了地图捧送给秦王，打开地图，地图全部打开，匕首就露了出来。
          - ancient: 何时眼前突兀<见>此屋，吾庐独破受冻死亦足！（《茅屋为秋风所破歌》）
            url: xxxx
            vernacular: 什么时候眼前出现这样高耸的房屋，到那时即使我的茅屋被秋风所吹破，我自己受冻而死也心甘情愿！
      - trans: ❷表现。
        sentences:
          - ancient: 造父者，天下之善御者也，无舆马则无所<见>其能。（《荀子•儒效》）
            url: xxxx
            vernacular: 造父，是天下最擅长驾驶车马的人，但如果没有车马，就不能表现他的才能
          - ancient: 退而论书策，以舒其愤，思垂空文以自<见>。（《报任安书》）
            url: xxxx
            vernacular: 便退隐著书立说来抒发他们的怨愤，想到活下来从事著作来表现自己的思想。
      - trans: ❸引见。
        sentences:
          - ancient: 子墨子曰："胡不<见>我于王？"（《公输》）
            url: xxxx
            vernacular: 墨子先生说：“为什么不向楚王引见我呢？”
  - word: 见
    type: 【形容词】
    phonetic: xian2
    tags:
      - 高中
    samples:
      - trans: 现成的。
        sentences:
          - ancient: 发近县<见>卒万六千人。（《汉书•文帝纪》）
            url: xxxx
            vernacular: 征发近县现成的士卒一万六千人
