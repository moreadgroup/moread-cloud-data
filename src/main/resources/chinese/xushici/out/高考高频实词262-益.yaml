---
words:
  - word: 益
    type: 【名词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶益处;好处。
        sentences:
          - ancient: 满招损，谦受<益>。（《尚书•大禹谟》）
            url: xxxx
            vernacular: 骄傲自满招致损害，谦虚谨慎得到益处。
          - ancient: 愚以为宫中之事，事无大小，悉（都）以咨之，然后施行，必能裨补阙漏，有所广<益>。（《出席表》）
            url: xxxx
            vernacular: 我（诸葛亮）认为朝廷中的事，无论大事小事，都应该拿来向郭攸之，费祎，董允咨询，然后再去施行，一定能够弥补缺点和不足，得到更多的成效。
          - ancient: 若亡郑而有<益>于君，敢以烦执事。（《烛之武退秦师》）
            url: xxxx
            vernacular: 假如灭掉郑国对您有好处，怎敢冒昧地拿这件事情来麻烦您。
          - ancient: 今虽欲自雕琢，曼辞以自饰，无<益>，于俗不信，适足取辱耳。（《报任安书》）
            url: xxxx
            vernacular: 现在我虽然想自我雕饰一番，用美好的言辞来为自己开脱，这也没有好处，因为世俗之人是不会相信的，只会使我自讨侮辱啊。
      - trans: ❷古代益州的简称，在今四川省境内。
        sentences:
          - ancient: 若跨有荆、<益>，保其岩阻（指形势险要的地方），西和诸戎……（《隆中对》）
            url: xxxx
            vernacular: 如果能占据荆、益两州，守住险要的地方，和西边的各个民族和好
          - ancient: 雍<益>二州，顺流而东；青徐战士，列江而西。（晋•孙楚《为石仲容与孙皓书》）
            url: xxxx
            vernacular: xxxx
      - trans: ❸六十四卦之一，卦形为震下巽上。
        sentences:
          - ancient: <益>，利有攸往，利涉大川。（《周易•益卦》）
            url: xxxx
            vernacular: “利有攸往”，是说君主坚持中正之道，会有喜庆。“利涉大川”，上巽为木，用来造船则可以渡过大河，下震为动，敏于行动，言辞谦逊，日新月异的成长，没有尽头。
  - word: 益
    type: 【动词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶"溢"的本字，水溢出来，引申为水涨。
        sentences:
          - ancient: 滩水暴<益>，荆人弗知，循表（标志）而夜涉，溺死者千有余人，军惊而坏都舍。（《吕氏暮秋•察今》）
            url: xxxx
            vernacular: 澭水突然上涨，楚人不知道。依然按之前的标志在黑夜渡河，结果淹死一千多人，楚军惊恐万状，溃不成军，就像都市里的房屋倒塌一样。
      - trans: ❷增加;增补。
        sentences:
          - ancient: 先王之法，经乎上世而来者也，人或<益>之，人或损之，胡可得而法？（《吕氏春秋•察今》）
            url: xxxx
            vernacular: 先王的法今制度，是经历了漫长的古代流传下来的，人们有的增补它，有的删减它，怎么能够取法它呢？
          - ancient: 至于斟酌损<益>，进尽忠言，则（郭）攸之、（费）祎、（董）允之任也。（《出师表》）
            url: xxxx
            vernacular: 至于处理事务，斟酌情理，有所兴革，毫无保留地进献忠诚的建议，那就是郭攸之、费祎、董允等人的责任了。
          - ancient: 所以动心忍性，曾<益>其所不能。（《生于忧患，死于安乐》）
            url: xxxx
            vernacular: 这样来激励他的心志，使他性情坚忍，增加他所不具备的能力。
          - ancient: 孔子学鼓琴师襄子，十日不进。师襄子曰："可以<益>矣。"（《史记•孔子世家》）
            url: xxxx
            vernacular: 孔子向师襄子学琴，学了十天仍没有学习新曲子，师襄子对他说：“可以增加学习内容了。”
      - trans: ❸得到利益。
        sentences:
          - ancient: 其志足，天下<益>之；不足，天下说之。（《商君书•画策》）
            url: xxxx
            vernacular: 他统一天下的理想能实现，天下的人都愿意辅佐他；他的理想如不能实现，天下的人也喜欢他。
      - trans: ❹助;有助于。
        sentences:
          - ancient: 为人臣者，宠有孝弟长幼顺明之节，通有补民<益>主之业，此两者臣之分也。（《史记•赵世家》）
            url: xxxx
            vernacular: 为人臣的人，得宠时应有孝、悌、长、幼、顺、明的品德，国家顺达时该有利于百姓，有益君主的业绩，这两点是身为人臣的本分。
  - word: 益
    type: 【形容词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: 富裕;富足。
        sentences:
          - ancient: 其友皆孝悌（ti4，敬爱、顺从兄长）纯谨畏令，如此者，其家必日<益>。（《吕氏春秋•贵当》）
            url: xxxx
            vernacular: 观察平民，如果他的朋友都很孝教和顺，忠厚恭谨、敬畏王命，这样的平民，他家里一定会日益富足
  - word: 益
    type: 【副词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶更;越发。
        sentences:
          - ancient: 老当<益>壮，宁移白首之心？穷（处境艰难）且<益>坚，不坠青云之志。（《滕王阁序》）
            url: xxxx
            vernacular: 年纪大了应当更有壮志，哪能在白发苍苍时改变自己的心志？处境艰难反该更加坚强，不能放弃凌云之志。
          - ancient: 单于<益>骄，非汉所望也。（《苏武传》）
            url: xxxx
            vernacular: 单于越发傲慢，不是汉所期望的那样。
          - ancient: 律知武终不可胁，白单于。单于愈<益>欲降之。（《苏武传》）
            url: xxxx
            vernacular: 卫律知道苏武终究不可胁迫投降，报告了单于。单于越发想要使他投降。
          - ancient: 是故圣<益>圣，愚<益>愚。（《师说》）
            url: xxxx
            vernacular: 因此，圣人更加圣明，愚人更加愚昧。
          - ancient: 既加冠，<益>慕圣贤之道。（《送东阳马生序》）
            url: xxxx
            vernacular: 成年以后，我更加仰慕古代圣贤的学说
          - ancient: 【高考题例】极陈时弊十事，语多斥权幸，权幸<益>深嫉之。（《明史•傅珪传》）
            url: xxxx
            vernacular: 极力奏陈其时社会弊病十件事，话语多指斥受宠的权贵，权贵愈加痛恨他。
      - trans: ❷渐渐;逐渐。
        sentences:
          - ancient: 日三四里，少<益>嗜食，和（舒适）于身也。（《触龙说赵太后》）
            url: xxxx
            vernacular: 每天走上三四里，就慢慢地稍微增加点食欲，身上也比较舒适了。
          - ancient: <益>习其声，又近出前后，终不敢搏。（《黔之驴》）
            url: xxxx
            vernacular: 渐渐地老虎熟悉了驴的叫声，又前前后后地靠近它，但始终不敢与它搏斗。
          - ancient: 武<益>愈，单于使使晓武，会论虞常，欲因（趁着）此时降武。（《苏武传》）
            url: xxxx
            vernacular: 苏武的伤势逐渐好了。单于派使者通知苏武，一起来审处虞常，想借这个机会使苏武投降。
          - ancient: 稍<益>近之，高渐离乃以铅置筑中，复进得近，举筑朴秦皇帝，不中。（《史记•刺客列传》）
            url: xxxx
            vernacular: 渐渐地更加接近秦始皇。高渐离便把铅放进筑中，再进宫击筑靠近时，举筑撞击秦始皇，没有击中。
