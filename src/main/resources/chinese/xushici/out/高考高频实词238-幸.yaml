---
words:
  - word: 幸
    type: 【动词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶宠爱。
        sentences:
          - ancient: 今入关，财物无所取，妇女无所<幸>，此其志不在小。（《鸿门宴》）
            url: xxxx
            vernacular: 如今入了关，财物什么都不拿，也不迷恋女色，这样看来，他的野心不小。
          - ancient: —肌一容，尽态极妍，缦立远视，而望<幸>焉。（《阿房宫赋》）
            url: xxxx
            vernacular: 每一片肌肤，每一种容颜，都美丽娇媚得无以复加。宫妃们久久地站着，远远地探视，盼望着皇帝来临。
          - ancient: 夫赵强而燕弱，而君<幸>于赵王，故燕王欲结于君。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 赵国强，燕国弱，而您受宠于赵王，所以燕王想要和您结交。
      - trans: ❷皇帝亲临某地。
        sentences:
          - ancient: 帝初<幸>甘泉。（《史记•孝文本纪》）
            url: xxxx
            vernacular: 文帝初次幸临甘泉宫。
          - ancient: 吾君方<幸>玄珠阁，与太阳道士讲《火经》，少选（一会儿）当毕。（《柳毅传》）
            url: xxxx
            vernacular: 我们的大王在玄珠阁，正跟太阳道士谈论火经，不多时就完毕了。
          - ancient: 【高考题例】建初五年，憙疾病，帝亲<幸>视。（《后汉书•赵憙传》）
            url: xxxx
            vernacular: 建初五年，赵憙生病，帝亲临探视。
          - ancient: 陛下今<幸>江都，是臣衣锦之地，臣荷（受）恩深重，不敢专为身谋。（《北史•来护儿传》）
            url: xxxx
            vernacular: 陛下如今巡幸江都，（那里）是臣衣锦还乡之地，臣深受恩宠，不敢只为自己打算。
      - trans: ❸庆幸。
        sentences:
          - ancient: 长男即自入室取金持去，独自欢<幸>。（《史记•越王勾践世家》）
            url: xxxx
            vernacular: 大儿子便入室取走黄金离开庄生，私自庆幸黄金失而复得。
      - trans: ❹希望。
        sentences:
          - ancient: （窦）婴乃使昆弟子上书言之，<幸>得召见。（《汉书•灌夫传》）
            url: xxxx
            vernacular: 窦婴只好叫他的侄子上书皇帝报告受遣诏的事，希望能得到再被召见的机会。
          - ancient: 不堪吏人妇，岂合令郎君？<幸>可广问讯，不得便相许。（《孔雀东南飞》）
            url: xxxx
            vernacular: 不配做小吏的妻子，哪里适合再嫁你们公子为妻？希望你多方面打听打听，我不能就这样答应你。
          - ancient: 阙然久不报，<幸>勿为过。（《报任安书》）
            url: xxxx
            vernacular: 隔了很久没有复信，希望不要责怪。
          - ancient: 冀<幸>君之一悟，俗之一改也。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 他希望国君总有一天醒悟，世俗总有一天改变。
          - ancient: 【高考题例】芳华<幸>勿谢，嘉树欲相依。（南朝梁•刘孝绰《咏;素蝶诗》）
            url: xxxx
            vernacular: 百花千万不要凋谢啊，这美好的树木乃是欲相依起舞之处。
  - word: 幸
    type: 【形容词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶侥幸，偶然有所得益或意外免去灾患。
        sentences:
          - ancient: 君不如肉袒伏斧质请罪，则<幸>得脱矣。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 您不如脱掉上衣，露出肩背，伏在斧刃之下请求治罪，这样也许侥幸被赦免。
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥<幸>，保卒余年。（《陈情表》）
            url: xxxx
            vernacular: 希望陛下能怜悯我愚昧诚心，满足我微不足道的心愿，使祖母刘氏能够侥幸保全她的余生。
      - trans: ❷幸运。
        sentences:
          - ancient: 则吾斯役之不<幸>，未若复吾赋不<幸>之甚也。（《捕蛇者说》）
            url: xxxx
            vernacular: 然而我干这差事的不幸，还比不上恢复我缴纳赋税的不幸那么厉害呀。
          - ancient: 知<幸>与不<幸>，则其读书也必专。（《黄生借书说》）
            url: xxxx
            vernacular: （黄生）懂得了（借到书的）幸运和（借不到书的）不幸运，那么他读书一定会专心
          - ancient: 今仆不<幸>，早失父母，无兄弟之亲，独身孤立，少卿视仆于妻子何如哉？（《报任安书》）
            url: xxxx
            vernacular: 如今我很不幸，早早地失去双亲，又没有兄弟互相爱护，独身一人，孤立于世，少卿你看我对妻室儿女又怎样呢？
          - ancient: 呜呼！予之生也<幸>，而<幸>生也何为？（《〈指南录〉后序》）
            url: xxxx
            vernacular: 我能死里逃生算是幸运了，可幸运地活下来要干什么呢？
  - word: 幸
    type: 【副词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶侥幸;幸亏。
        sentences:
          - ancient: 贼二人得我，我<幸>皆杀之矣。（《童区寄传》）
            url: xxxx
            vernacular: 两个强盗绑架了我，幸好我把他们都杀了
          - ancient: 其伤于缚者，即<幸>留（存活），病数月乃瘳（chou1，病愈），或竟成痼疾。（《狱中糸记》）
            url: xxxx
            vernacular: 其中被捆绑受伤的，即便幸而留下，也必须病几个月才能好，甚或成为一辈子也治不好的暗伤。
          - ancient: 儿已薄禄相，<幸>复得此妇。（《孔雀东南飞》）
            url: xxxx
            vernacular: 儿已经没有做高官享厚禄的福相，幸而娶得这样一个好媳妇。
          - ancient: 适为虞人逐，其来甚速，<幸>先生生（使活下来）我。（《中山狼传》）
            url: xxxx
            vernacular: 刚才被看山人追赶，他们来的太快，所幸先生救了我。
          - ancient: 今事有急，故<幸>来告良。（《鸿门宴》）
            url: xxxx
            vernacular: 现在事情危急，因此他特意来告知我。
      - trans: ❷表示敬意，即对方这样做使自己感到幸运。
        sentences:
          - ancient: 臣从其计，大王亦<幸>赦臣。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 臣听从了他的意见，大王也开恩赦免了为臣。
