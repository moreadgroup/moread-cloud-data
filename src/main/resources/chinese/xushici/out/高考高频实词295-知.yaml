  - word: 知
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 通"智"。智慧;聪明。
        sentences:
          - ancient: 故木受绳则直，金（金属）就砺（磨刀石）则利，君子博学而日参省（检验考察）乎己，则<知>明而行无过矣。（《劝学》）
            url: xxxx
            vernacular: 所以木材经过墨线加工才能取直，金属刀剑在磨刀石上磨过才能锋利，君子学习广泛，而又能每天检查反省自己，那就会见识高明而行为不会犯错误了。
          - ancient: 小<知>不及大<知>，小年不及大年。（《逍遥游》）
            url: xxxx
            vernacular: 小智比不上大智，短命比不上长寿。
          - ancient: 故夫<知>效一官，行比一乡，德合一君，而征一国者，其自视也，亦若此矣。而宋荣子犹然笑之。（《逍遥游》）
            url: xxxx
            vernacular: 同样地，那些才智胜任一个官职、能力在一乡中优秀出众、德行能投合一个君王的心意的，能力能够取得全国信任的，他们看待自己时，其实也像斥鴳的见识。所以宋荣子就讥笑他们。
