      - trans: ❶使恼怒。
        sentences:
          - ancient: （吴）广故数言欲亡，忿<恚>尉。（《陈涉世家》）
            url: xxxx
            vernacular: 吴广故意多次说想要逃跑，使将尉恼怒
      - trans: ❷怨恨。
        sentences:
          - ancient: 【高考题例】被重刑厚罚而不怨<恚>，而巫之祸盘错深固不解矣。（元•揭俟斯《赠医者汤伯高序》）
            url: xxxx
            vernacular: 即使被处以沉重的刑罚，也不怨恨，因为巫术祸害已盘根错节，根深蒂固而难以解决。
  - word: 恚
    type: 【形容词】
    phonetic: hui4
    tags:
      - 高中
    samples:
      - trans: 恼怒。
        sentences:
          - ancient: （洪）承畴大<恚>，急呼麾下驱出斩之。（《梅花岭记》）
            url: xxxx
            vernacular: 洪承畴（听后）非常恼怒，急忙叫部下（把他）推出去杀了。
