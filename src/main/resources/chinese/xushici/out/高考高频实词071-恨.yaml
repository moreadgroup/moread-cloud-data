---
words:
  - word: 恨
    type: 【名词】
    phonetic: hen4
    tags:
      - 高中
    samples:
      - trans: ❶怨恨。
        sentences:
          - ancient: 然而<恨>贯肌骨，亦何能愧避？（《柳毅传》）
            url: xxxx
            vernacular: 但是我的怨恨铭心刻骨，又怎能觉得惭愧而回避不说呢？
          - ancient: 商女不知亡国<恨>，隔江犹唱后庭花。（唐•杜牧《泊秦淮》）
            url: xxxx
            vernacular: 卖唱的歌女不知道什么是亡国之恨，隔着江水仍在高唱着《玉树后庭花》。
          - ancient: 生人作死别，<恨><恨>那可论？（《孔雀东南飞》）
            url: xxxx
            vernacular: 活着的人却要做死的离别，心中抱恨哪里能够说得完。
          - ancient: 别有幽愁暗<恨>生，此时无声胜有声。（《琵琶行》）
            url: xxxx
            vernacular: 像另有一种愁思幽恨暗暗滋生；此时闷闷无声却比有声更动人。
      - trans: ❷遗憾。
        sentences:
          - ancient: 纤云弄巧，飞星传<恨>。（《鹊桥仙》）
            url: xxxx
            vernacular: 纤薄的云彩在天空中变幻多端，天上的流星传递着相思的愁怨
  - word: 恨
    type: 【动词】
    phonetic: hen4
    tags:
      - 高中
    samples:
      - trans: ❶遗憾;不满。
        sentences:
          - ancient: 陈涉少时，尝与人佣耕，辍耕之（走到）垄上，怅<恨>久之。（《陈涉世家》）
            url: xxxx
            vernacular: 陈涉年少的时候，曾经和别人一起被雇佣耕地，有一天他停止耕作走到田埂高地上休息，因失望而叹恨了好一阵子
          - ancient: 先帝在时，每与臣论此事，未尝不叹息痛<恨>于桓、灵也。（《出师表》）
            url: xxxx
            vernacular: 先帝在世的时候，每逢跟我谈论这些事情，对于桓帝、灵帝没有一次不（发出叹息）感到痛心遗憾的。
          - ancient: 所以隐忍苟活，幽于粪土之中而不辞者，<恨>私心有所不尽。（《报任安书》）
            url: xxxx
            vernacular: 我之所以忍受着屈辱苟且活下来，陷在污浊的监狱之中却不肯死，是遗憾我内心的志愿有未达到的
      - trans: ❷怨恨;悲伤。
        sentences:
          - ancient: 艰难苦<恨>繁霜鬓，潦倒新停浊酒杯。（《登高》）
            url: xxxx
            vernacular: 历尽了艰难苦恨白发长满了双鬓，衰颓满心偏又暂停了浇愁的酒杯。
          - ancient: <恨>相见得迟，怨归去得疾。……此<恨>谁知！（《长亭送别》）
            url: xxxx
            vernacular: 恨相见得太迟，怨离别得太快。... 这离愁别恨有谁能理解？
