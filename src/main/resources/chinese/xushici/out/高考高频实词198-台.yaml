---
words:
  - word: 台
    type: 【名词】
    phonetic: tai2
    tags:
      - 高中
    samples:
      - trans: ❶高而平的建筑物，可供瞭望远方或表演歌舞。
        sentences:
          - ancient: 歌<台>暖响，春光融融;舞殿冷袖，风雨凄凄。（《阿房宫赋》）
            url: xxxx
            vernacular: 歌台上由于歌声响亮而充满暖意，有如春光融和；舞殿上由于舞袖飘拂而充满寒意，有如风雨凄凉。
          - ancient: 舞榭（台上的房子）歌<台>，风流总被雨打风吹去。（《永遇乐•京口北固亭怀古》）
            url: xxxx
            vernacular: 当年的舞榭歌台还在，英雄人物却随着岁月的流逝早已不复存在。
          - ancient: 秦王坐章<台>见相如，相如奉璧奏秦王。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 秦王坐在章台上接见蔺相如，相如捧璧呈献给秦王。
          - ancient: 万里悲秋常作客，百年多病独登<台>。（《登高》）
            url: xxxx
            vernacular: 悲对秋景感慨万里漂泊常年为客，一生当中疾病缠身今日独上高台。
      - trans: ❷像台状的器物。
        sentences:
          - ancient: 一去紫<台>连朔漠，独留青冢向黄昏。（唐•杜甫《咏怀古迹.其三》）
            url: xxxx
            vernacular: 从紫台一去直通向塞外沙漠，最后只留荒郊上的一座孤坟对着黄昏。
          - ancient: 可怜楼上月徘徊，应照离人妆镜<台>。（唐•张若虚《春江花月夜》）
            url: xxxx
            vernacular: 可怜楼上不停移动的月光，应该照耀着离人的梳妆台。
      - trans: ❸官署名。汉设御史台、兰台。
        sentences:
          - ancient: 汝是大家子，仕宦于<台>阁（尚书台），慎勿为妇死，贵贱情何薄！（《孔雀东南飞》）
            url: xxxx
            vernacular: 你是大户人家的子弟，一直做官在官府台阁。千万不要为了一个妇人去寻死，贵贱不同你将她遗弃怎能算情薄？
          - ancient: 嗟余听鼓应官去，走马兰<台>类转蓬。（唐•李商隐《无题》）
            url: xxxx
            vernacular: 可叹呵，听到五更鼓应该上朝点卯；策马赶到兰台，像随风飘转的蓬蒿。
          - ancient: 【高考题例】夫<台>谏为天下持是非，而使人贱辱至此，安望其抗颜直绳，为国家除大奸、歼巨蠹哉！（《明史，陈登云传》）
            url: xxxx
            vernacular: 台谏是为天下主持是非的，而使人践踏到这种地步，怎能希望他不顾情面，正直地处理事情，为国除掉奸人、消灭败类呢！
          - ancient: 公亮明练文法，更践久，习知朝廷<台>阁典宪。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 曾公亮熟习写文章的章法，任职以后，熟悉懂得了朝廷台阁的规章
      - trans: ❹卑贱的职位。
        sentences:
          - ancient: 宜有期度，舆马<台>隶，应为科品。（《后汉书•光武十王列传》）
            url: xxxx
            vernacular: 应有期度，舆马台隶，应有规定。
      - trans: ❺对人的尊称。古代下属称上级为宪台、堂台；朋友汤间尊称为兄台、台下。
        sentences:
          - ancient: 望<台>下轻轻放手。（《长生殿•进果》）
            url: xxxx
            vernacular: xxxx
      - trans: ❻星名，即三台（六颗星）。
        sentences:
          - ancient: 在人曰三公，在天曰三<台>。（《晋书•天文志上》）
            url: xxxx
            vernacular: xxxx
