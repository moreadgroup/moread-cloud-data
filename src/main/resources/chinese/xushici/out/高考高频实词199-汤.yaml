---
words:
  - word: 汤
    type: 【名词】
    phonetic: tang1
    tags:
      - 高中
    samples:
      - trans: ❶热水;开水。
        sentences:
          - ancient: 日初出沧沧凉凉，及其日中如探<汤>，此不为近者热而远者凉乎？（《两小儿辩日》）
            url: xxxx
            vernacular: 太阳刚出来的时候有清凉的感觉，等到中午的时候像手伸进热水里一样热，这不是近的时候感觉热而远的时候感觉凉吗？
          - ancient: 至舍，四支僵劲不能动，媵人持<汤>沃灌，以衾拥覆，久而乃和（暖和过来）。（《送东阳马生序》）
            url: xxxx
            vernacular: 到学舍后，四肢僵硬不能动弹，服侍的仆人拿着热水（为我）浇洗，用被子裹着我，很久才暖和起来。
          - ancient: 臣知欺大王之罪当诛，臣请就（赴）<汤>镬。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 我知道欺骗大王是应该被诛杀的，我愿意接受汤镬之刑。
      - trans: ❷中药加水煎制而成的汤剂。
        sentences:
          - ancient: 更适阴阳，但服<汤>二旬而复故。（《史记•扁鹊仓公列传》）
            url: xxxx
            vernacular: 进一步调和阴阳，仅仅吃了汤剂二十天就身体恢复和从前一样了。
          - ancient: 而刘夙婴（患）疾病，常在床蓐（同"褥"，病席），臣侍<汤>药，未曾废离。（《陈情表》）
            url: xxxx
            vernacular: 但祖母刘氏又早被疾病缠绕，常年卧床不起，我侍奉她吃饭喝药，从来就没有离开她。
      - trans: ❸商朝第一个君王。
        sentences:
          - ancient: <汤>之时，八年七旱，而崖不为加损。（《秋水》）
            url: xxxx
            vernacular: 商汤的时代八年里有七年大旱，而岸边的水位不会因此下降
          - ancient: 上称帝喾，下道齐桓，中述<汤>武，以刺世事。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 他）远古提到帝喾，近古提到齐桓公，中古提到商汤、周武王，利用古代帝王这些事用来讽刺当世社会。
          - ancient: 【高考题例】禹、<汤>罪己，其兴也勃焉；桀、纣罪人，其亡也忽焉。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 禹和汤怪罪自己，他们的兴盛很迅速，势不可挡，桀和纣怪罪他人，他们的灭亡也很迅速，突如其来。
