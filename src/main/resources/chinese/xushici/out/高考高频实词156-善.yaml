---
words:
  - word: 善
    type: 【名词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: 好事;好的行为。
        sentences:
          - ancient: 积<善>成德，而神明自得，圣心备焉。（《劝学》）
            url: xxxx
            vernacular: 积累善行养成高尚的品德，自然会心智澄明，也就具有了圣人的精神境界。
          - ancient: 刑过不避大臣，赏<善>不遗匹夫。（《韩非子•有度》）
            url: xxxx
            vernacular: 惩罚有罪行的人，不能因是高官显宦而回避；奖赏有功劳的人，不能因是小民百姓而遗忘
          - ancient: 简能而任之，择<善>而从之。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 选拔有才能的人而任用他们，挑选好的意见而听从它。
  - word: 善
    type: 【动词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: ❶赞许。
        sentences:
          - ancient: 昔者管子有言，丘（孔子自称）甚<善>之。（《庄子•至乐》）
            url: xxxx
            vernacular: 当年管仲有句话，我认为说得很好
          - ancient: 亦余心之所<善>兮，宝九死其犹未悔。（《离骚》）
            url: xxxx
            vernacular: 这是我心中追求的东西，就是多次死亡也不后悔。
          - ancient: <善>万物之得时，感吾生之行休。（《归去来兮辞》）
            url: xxxx
            vernacular: （我）羡慕万物恰逢繁荣滋长的季节，感叹自己一生行将告终。
      - trans: ❷喜好。
        sentences:
          - ancient: 王如<善>之，则何为不行？（《孟子•梁惠王下》）
            url: xxxx
            vernacular: 您如果认为这话好，那为什么不实行呢?
      - trans: ❸擅长;善于。
        sentences:
          - ancient: 衡少<善>属文，游于三辅，因入京师。（《张衡传》）
            url: xxxx
            vernacular: 张衡年轻时就擅长写文章，曾到“三辅”一带游学，趁机进了洛阳
          - ancient: 衡<善>机巧，尤致思于天文阴阳历算。（《张衡传》）
            url: xxxx
            vernacular: 张衡善于器械制造方面的巧思，尤其在天文气象和历法的推算等方面很用心。
          - ancient: 安帝雅闻衡<善>术学，公车特征拜郎中，再迁为太史令。（《张衡传》）
            url: xxxx
            vernacular: 汉安帝常听说他擅长术数方面的学问，命公车特地征召他，任命他为郎中。两次迁升为太史令。
          - ancient: 陈康肃公<善>射，当世无双，公亦以此自矜。（《卖油翁》）
            url: xxxx
            vernacular: 康肃公陈尧咨擅长射箭，当时世上没有第二个人能跟他相媲美，他也就凭着这种本领而自夸。
          - ancient: 京中有<善>口技者。（《口技》）
            url: xxxx
            vernacular: 京城里有个擅长表演口技的人。
          - ancient: 【高考题例】少聪敏好学，<善>属文。（《旧唐书•李揆传》）
            url: xxxx
            vernacular: 少年时聪敏好学，善于写文章。
      - trans: ❹擦拭；整治。
        sentences:
          - ancient: <善>刀而藏之。（《庄子•养生主》）
            url: xxxx
            vernacular: 把刀擦拭干净收藏起来。(比喻适可而止，自敛其才。)
      - trans: ❺爱惜。
        sentences:
          - ancient: <善>日者王，<善>时者霸。（《荀子•强国》）
            url: xxxx
            vernacular: 所以珍惜每一天的君主就能称王天下，珍惜每一季度的君主就能称霸诸侯。(善，善于；日者，每天的日常工作；王，名词活用为动词，称王；时者，四季注重工作成效；霸，名词活用为动词，称霸。)
      - trans: ❻与……交好。
        sentences:
          - ancient: 楚左尹项伯者，项羽季父也，素<善>留侯张良。（《鸿门宴》）
            url: xxxx
            vernacular: 楚军的左尹项伯，是项羽的叔父，一向同留侯张良交好。
      - trans: ❼经常出现;容易发生。
        sentences:
          - ancient: 岸<善>崩，乃凿井，深者四十余丈。（《史记•河渠书》）
            url: xxxx
            vernacular: 由于土岸容易塌方，于是沿流凿井，最深有的达到四十多丈。
          - ancient: 长夏<善>病洞泄寒中，秋<善>病风疟。（《素问•金匮真言论》）
            url: xxxx
            vernacular: 长夏季节，人们容易得潮湿、燥热的病症，如疟疾、泄泻等；而在秋季，人们则容易感染风寒、风疟等病症。
  - word: 善
    type: 【形容词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: ❶美好（与"恶""相对）。
        sentences:
          - ancient: 武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其<善>意。（《苏武传》）
            url: xxxx
            vernacular: 汉武帝赞许他这种通晓情理的做法，于是派遣苏武以中郎将的身份出使，持旄节护送扣留在汉的匈奴使者回国，顺便送给单于很丰厚的礼物，以答谢他的好意。
          - ancient: 夫列子御风而行，泠然<善>也，旬有五日而后反。（《逍遥游》）
            url: xxxx
            vernacular: 列子乘风而行，飘然自得，驾轻就熟。十五天以后返回；
          - ancient: 择其<善>者而从之，其不<善>者而改之。（《论语•述而》）
            url: xxxx
            vernacular: 选择别人的优点去学习，他们的缺点（如果我有）就去改正它。
          - ancient: 陛下亦宜自谋，以咨诹（zou1，询问）<善>道，察纳雅言，深追先帝遗诏。（《出师表》）
            url: xxxx
            vernacular: 陛下也应自行谋划，毫无保留地进献忠诚的建议，采纳正确的言论，深切追念先帝临终留下的教诲。
          - ancient: 【高考题例】时宦官甘昪之客胡与可、都承旨王抃之族叔秬皆持节于外，有所依凭，无<善>状，燧皆奏罢之。（《宋史•萧燧传》）
            url: xxxx
            vernacular: 当时宦官甘升的门客胡兴可、都承旨王抃的族叔王秬都在外做地方官，因为有所倚仗，没有好的表现，萧燧都上奏罢免了他们
      - trans: ❷友好;友善。
        sentences:
          - ancient: 惟博陵崔州平、颍川徐庶元直与亮友<善>，谓为信然。（《隆中对》）
            url: xxxx
            vernacular: 只有博陵的崔州平，颍川（河南禹州）的徐庶与诸葛亮关系甚好，说确实是这样。
      - trans: ❸熟悉。
        sentences:
          - ancient: 这人好生面<善>。（《三国演义》十九回）
            url: xxxx
            vernacular: xxxx
  - word: 善
    type: 【副词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: 好好地。
        sentences:
          - ancient: 是良史也，子<善>视之。（《左传•昭公十三年》）
            url: xxxx
            vernacular: 这个人是好史官，你要好好看待他。
          - ancient: 今人有大功而击之，不义也，不如因<善>遇之。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 现在人家有了大功，却要攻打他，这是不讲信义，不如趁此好好对待他。
          - ancient: 【高考题例】城破，吾夫必死，吾义不独存，然不可使花氏无后，若等<善>抚之。（《明史•花云传》）
            url: xxxx
            vernacular: 城被攻破，我丈夫必定会死，我为了道义决不一个人活下去，但不能使花氏家族没有了后人，你们一定要好好抚养他啊。
