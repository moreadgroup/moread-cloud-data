    phonetic: zhu4
    tags:
      - 高中
    samples:
      - trans: 宗庙中主持祭礼的人。
        sentences:
          - ancient: 仆之先人非有剖符丹书之功，文史星历，近乎卜<祝>之间。（《报任安书》）
            url: xxxx
            vernacular: 我的祖先没有剖符丹书的功劳，职掌文献史料、天文历法工作的官员，地位接近于算卦、赞礼的人
  - word: 祝
    type: 【动词】
    phonetic: zhu4
    tags:
      - 高中
    samples:
      - trans: 祈祷。
        sentences:
          - ancient: 祭祀必<祝>之，<祝>曰："必勿使反。"（《触龙说赵太后》）
            url: xxxx
            vernacular: 但每逢祭祀您一定为她祈祷，祈祷说：‘千万不要被赶回来啊’
          - ancient: 巫从旁望空代<祝>，唇吻翕辟（一开一合），不知何词。（《促织》）
            url: xxxx
            vernacular: 巫婆在旁边望着空中替他们祷告，嘴唇一张一合，不知在说些什么。
