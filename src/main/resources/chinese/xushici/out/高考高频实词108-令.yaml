---
words:
  - word: 令
    type: 【名词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶法令。
        sentences:
          - ancient: 所谓损有余、补不足，<令>出而民利者也。（汉•晁错《论贵粟疏》）
            url: xxxx
            vernacular: 从富有的人那里得到货物来供政府用，那么贫苦百姓所担负的赋税就可以减轻，这就叫做拿富有的去补不足的，法令一颁布百姓就能够得益。
          - ancient: 王使屈平为<令>，众莫不知，每一<令>出，平伐（夸耀）其功。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 君王让屈原制定法令，大家没人不知道的，每出一道法令，屈原就炫耀自己的功劳
          - ancient: 且陛下春秋高，法<令>亡常，大臣亡罪夷灭者数十家。（《苏武传》）
            url: xxxx
            vernacular: 并且皇上年纪大了，法令随时变更，大臣无罪而全家被杀的有几十家，安危不可预料。
      - trans: ❷命令。
        sentences:
          - ancient: <令>初下，群臣进谏，门庭若市。（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 政令刚一下达，许多大臣都来进献谏言，宫门和庭院像集市一样热闹
          - ancient: 留二日，维扬帅下逐客之<令>。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 留住了两天，驻守维扬的统帅竟下了逐客令。
      - trans: ❸辞令，应酬的言辞。
        sentences:
          - ancient: 其次不辱辞<令>，其次诎体受辱。（《报任安书》）
            url: xxxx
            vernacular: 再次是不因别人的言语而受辱，再次是被捆绑在地而受辱
          - ancient: 博闻强志，明于治乱，娴于辞<令>。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: （屈原他）知识广博，记忆力很强，明了国家治乱的道理，擅长外交辞令。
      - trans: ❹封建时代中央机构的长官。如尚书令、中书令等。
        sentences:
          - ancient: 公车特征拜郎中，再迁为太史<令>。（《张衡传》）
            url: xxxx
            vernacular: 命公车特地征召他，任命他为郎中。两次迁升为太史令。
      - trans: ❺县令。
        sentences:
          - ancient: 魏文侯时，西门豹为邺<令>。（汉•褚少孙《西门豹治邺》）
            url: xxxx
            vernacular: 魏文侯时，西门豹担任邺都城的县令。
          - ancient: 有华阴<令>，欲媚上官。（《促织》）
            url: xxxx
            vernacular: 有个华阴县的县官，想巴结上司。
      - trans: ❻时令;时节。
        sentences:
          - ancient: 时<令>一反常，生灵受其病。（唐•白居易《赠友》）
            url: xxxx
            vernacular: xxxx
          - ancient: 群葩（pa1，花）当<令>时，只在花开之数日。（《芙蕖》）
            url: xxxx
            vernacular: 各种花正当时（惹人注目）的时候，只在花开的那几天
      - trans: ❼小令，词曲中较短小的一种体制。
        sentences:
          - ancient: 醉翻衫袖抛小<令>，笑掷骰盘呼大釆。（唐•白居易《就花枝》）
            url: xxxx
            vernacular: xxxx
  - word: 令
    type: 【动词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶使;让。
        sentences:
          - ancient: 有复言<令>长安君为质（人质）者，老妇必唾其面。（《触龙说赵太后》）
            url: xxxx
            vernacular: 有再说让长安君去做人质的人，我一定朝他脸上吐唾沫!
          - ancient: <令>壮者无取（通"娶"）老妇，<令>老者无取壮妻。（《勾践灭吴》）
            url: xxxx
            vernacular: 青壮年不准娶老年妇人，老年不能娶青壮年的妻子
          - ancient: 何不作衣裳？莫<令>事不举！（《孔雀东南飞》）
            url: xxxx
            vernacular: 你为什么还不做好衣裳？不要让事情办不成！
          - ancient: 瞻顾遗迹，如在昨日，<令>人长号不自禁。（《项脊轩志》）
            url: xxxx
            vernacular: 瞻仰回顾旧日事物，就像发生在昨天一样，让人忍不住放声大哭。
      - trans: ❷下令。
        sentences:
          - ancient: 汉王乃<令>张耳与韩信遂东下井隆击赵。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 汉王下令张耳与韩信东下井隆进攻赵
          - ancient: 数月以来，皇上有所询问，则<令>总理衙门传旨。（清•梁启超《谭嗣同》）
            url: xxxx
            vernacular: 几个月以来，皇上有什么事情要询问，就命令总理衙门传达圣旨
          - ancient: 《传》曰"其身正，不<令>而行;其身不正，虽<令>不从"。其（大概）李将军之谓也？（《史记•李将军列传》）
            url: xxxx
            vernacular: 自身端正，不用命令人们就会遵行；自身不端正，虽发命令也没有人听从。
  - word: 令
    type: 【形容词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶美;善;好。
        sentences:
          - ancient: 君之不<令>民，父之不孝子，兄之不悌（ti4，尊敬兄长）弟，皆乡里之所釜(鬲瓦)者（用炊具釜(鬲瓦)吃饭的人，指所有的人）而逐之。（《吕氏春秋•安死》）
            url: xxxx
            vernacular: 国君的刁滑之民，父亲的不孝之子，兄长的忤逆之弟，他们都是被乡里一致驱遂的人。
          - ancient: 年始十八九，便言（很会说话）多<令>才。（《孔雀东南飞》）
            url: xxxx
            vernacular: 年龄只有十八九岁，口才很好文才也比别人强。
      - trans: ❷称呼别人亲属时，前面加""令"，表示尊敬。
        sentences:
          - ancient: 不堪吏人妇，岂合<令>郎君？（《孔雀东南飞》）
            url: xxxx
            vernacular: 不配做小吏的妻子，哪里适合再嫁你们公子为妻？
          - ancient: <令>妻早谢，稚子四岁。（唐•刘禹锡《为鄂州李大夫祭柳员外文》）
            url: xxxx
            vernacular: xxxx
  - word: 令
    type: 【连词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: 假如;假设。
        sentences:
          - ancient: <令>五人者保其首领（性命）以老于户牖（牖you3，指家中）之下，则尽其天年，人皆得以隶使之。（《五人墓碑记》）
            url: xxxx
            vernacular: 假使五人保全了性命，老死在家里，平平安安地度过一生，那么，人人都可以把他们当作奴仆来使唤
          - ancient: 假<令>仆伏法受诛，若九牛亡（失去）一毛，与蝼蚁何以异？（《报任安书》）
            url: xxxx
            vernacular: 假如我伏法被杀，那好像是九牛的身上失掉一根毛，同蝼蚁又有什么区别？
