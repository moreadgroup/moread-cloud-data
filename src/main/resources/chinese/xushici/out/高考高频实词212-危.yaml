---
words:
  - word: 危
    type: 【名词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶高处。
        sentences:
          - ancient: 拱木不生<危>，松柏不生埤（指地势低下的地方）。（《国语•晋语八》）
            url: xxxx
            vernacular: 大树不能生长在屋脊上，松柏不能生长在矮墙上。
      - trans: ❷屋脊。
        sentences:
          - ancient: 有玄（黑色）鹤二八，自南方来，集于廊门之<危>。（《论衡.感虚》）
            url: xxxx
            vernacular: 一群玄鹤，共28只，从南方飞来，聚集在郎门垝上。
  - word: 危
    type: 【动词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶危害。
        sentences:
          - ancient: 抑（难道）王兴甲兵，<危>士臣，构怨于诸侯，然后快于心与？（《齐桓晋文之事》）
            url: xxxx
            vernacular: 还是说（大王）您发动战争，使将士冒生命的危险，与各诸侯国结怨，这样心里才痛快么？
      - trans: ❷畏惧;忧惧。
        sentences:
          - ancient: 臣闭其外也已远矣，而守其内也已固矣，虽国小，犹不<危>之也。（《韩非子•外储说左上》）
            url: xxxx
            vernacular: 我对外关闭得已足够严了，在内防卫得已足够牢了，虽然国家不大，也还不认为会有什么危险。
  - word: 危
    type: 【形容词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶高。
        sentences:
          - ancient: 噫吁嚱，<危>乎高哉！蜀道之难，难于上青天！（《蜀道难》）
            url: xxxx
            vernacular: 啊！何其高竣，何其峭险！蜀道太难走呵，简直难于上青天
      - trans: ❷危险;危急（与"安"相对）。
        sentences:
          - ancient: 但以刘日薄西山，气息奄奄，人命<危>浅，朝不虑夕。（《陈情表》）
            url: xxxx
            vernacular: 只是因为祖母刘氏寿命即将终了，气息微弱，生命垂危，早上不能想到晚上怎样。
          - ancient: 国<危>矣，若使烛之武见秦君，师必退。（《烛之武退秦师》）
            url: xxxx
            vernacular: 国家很危险了！如果派烛之武去见秦国的国君，秦国的军队必定撤退。
          - ancient: 先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚<危>急存亡之秋也。（《出师表》）
            url: xxxx
            vernacular: 先帝开创大业未完成一半却中途去世了。现在天下分为三国，我们蜀汉人力疲惫，民生凋敝，这实在是国家危急存亡的时刻啊。
      - trans: ❸端正。
        sentences:
          - ancient: 猎（揽）缨正襟<危>坐。（《史记・日者列传》）
            url: xxxx
            vernacular: 猎缨：整理冠带、使之端正，表示恭敬。正襟：纠正衣襟。危坐：端正地坐着。
          - ancient: 苏子愀然，正襟<危>坐而问客曰……（《赤壁赋》）
            url: xxxx
            vernacular: 苏轼的容色忧愁凄怆，（他）整好衣襟坐端正向客人问道……
  - word: 危
    type: 【副词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 几乎:将要。
        sentences:
          - ancient: 今儿安在，<危>杀之矣。（《汉书•外戚传下》）
            url: xxxx
            vernacular: 现在孩子哪裹去了？已被她们害死了吧！
