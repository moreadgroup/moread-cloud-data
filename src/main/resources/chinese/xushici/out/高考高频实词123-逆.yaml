          - ancient: 庶长壮与大臣、诸侯、公子为<逆>皆诛。（《史记•秦本纪》）
            url: xxxx
            vernacular: 庶长壮与大臣、诸侯、公子谋篡王位，皆被处死
          - ancient: 数（责备）吕师孟叔侄为<逆>。（《〈指南录〉后序》）
            url: xxxx
