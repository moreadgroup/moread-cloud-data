    samples:
      - trans: ❶迎接。
        sentences:
          - ancient: 郑子产聘于晋。晋侯有疾，韩宣子<逆>客。（《左传・昭公七年》）
            url: xxxx
            vernacular: 郑国的子产到晋国聘问。晋平公有病。韩宣子迎接客人
          - ancient: 寓<逆>旅，主人日再食。（《送东阳马生序》）
            url: xxxx
            vernacular: 寄居在旅馆，店主人每天供给两顿饭
          - ancient: 夫天地者，万物之<逆>旅也;光阴者，百代之过客也。（唐•李白《春夜宴从弟桃花园序》）
            url: xxxx
            vernacular: 天地是迎接万物的客舍，光阴是古往今来的过客。
      - trans: ❷违背;对抗（与"顺"相对）。
        sentences:
          - ancient: 而君<逆>寡人者，轻寡人与？（《唐雎不辱使命》）
            url: xxxx
            vernacular: 但是他违背我的意愿，这不是看不起我吗？
          - ancient: 且以一璧之故<逆>强秦之欢，不可。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 况且为了一块璧玉的缘故就使强大的秦国不高兴，也是不应该的。
          - ancient: 子不反亲，臣不<逆>君，兄弟之通义也。（《史记•赵世家》）
            url: xxxx
            vernacular: 子女不可以反对父母，臣子不可以违背君王，这是兄弟间通行的道义。
      - trans: ❸反常;乖于常理。
        sentences:
          - ancient: 行辟而坚，饰非而好，玩奸而泽，言辩而<逆>，古之大禁也。（《荀子•非十二子》）
            url: xxxx
            vernacular: 为非作歹而又很坚决，文过饰非而似很完美，玩弄奸计而似有恩泽，能言善辩而违反常理，这些是古代特别加以禁止的。
      - trans: ❹抗拒；抵抗（与"顺"相对）。
        sentences:
          - ancient: 遂以周瑜、程普为左右督，将兵与备并力<逆>（曹）操。 （《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 于是任命周瑜、程普为正、副统帅，率兵与刘备同力迎战曹操。
          - ancient: 燕王诚振怖大王之威，不敢举兵以<逆>军吏，愿举国为内臣，比诸侯之列。（《史记•刺客列传》）
            url: xxxx
            vernacular: 燕王确实害怕大王的声威，不敢出兵抵抗我国的军队，希望全国做臣子，排在诸侯行列里
      - trans: ❺叛乱。
