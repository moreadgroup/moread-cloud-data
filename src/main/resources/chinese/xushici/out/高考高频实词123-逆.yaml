      - trans: ❻揣，测。
        sentences:
          - ancient: 以意<逆>志，是为得之。（《孟子•万章上》）
            url: xxxx
            vernacular: 能以自己的切身体会去推测作者的本意，这才是懂得了阅读作品的正确方法。
