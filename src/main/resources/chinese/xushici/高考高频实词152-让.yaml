---
words:
  - word: 让
    type: 【动词】
    phonetic: rang4
    tags:
      - 高中
    samples:
      - trans: ❶责备;责怪。
        sentences:
          - ancient: 平原君使者冠盖相属（zhu3，接连不断）于魏，让魏公子曰	（《史记•魏公子顷］传》）
          - ancient: 使者大喜，如惠语以让单于。（《苏武传》）
      - trans: ❷谦让;退让。
        sentences:
          - ancient: 侯生摄敝衣冠，直上载公子上座，不让，欲以观公让子。（《史记•魏公子列传》）
          - ancient: 大行不顾细谨（细小的地忍方），大礼不辞小让。（《鸿门宴》）
          - ancient: 禹拜稽首，让于契、后稷、皋陶。（《史记•夏本纪》）
      - trans: ❸把自己的权力、职位等交给别人。
        sentences:
          - ancient: 信贤而任之，君之明也；让贤而下之，臣之忠也。 （《吕氏春秋•慎人》）
