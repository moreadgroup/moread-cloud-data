---
words:
  - word: 让
    type: 【动词】
    phonetic: rang4
    tags:
      - 高中
    samples:
      - trans: ❶责备;责怪。
        sentences:
          - ancient: 平原君使者冠盖相属（zhu3，接连不断）于魏，<让>魏公子曰（《史记•魏公子顷］传》）
            url: xxxx
            vernacular: 平原君的使臣连续不断地来到魏国，责备魏公子道
          - ancient: 使者大喜，如惠语以<让>单于。（《苏武传》）
            url: xxxx
            vernacular: 汉使者万分高兴，按照常惠所教的话去责备单于。
      - trans: ❷谦让;退让。
        sentences:
          - ancient: 侯生摄敝衣冠，直上载公子上座，不<让>，欲以观公子。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 侯先生整理了一下破旧的衣帽，就径直上了车子坐在公子空出的尊贵座位，丝毫没有谦让的意思，想借此观察一下公子的态度。
          - ancient: 大行不顾细谨（细小的地忍方），大礼不辞小<让>。（《鸿门宴》）
            url: xxxx
            vernacular: 做大事不必顾及小节，讲大礼不必计较小的谦让。
          - ancient: 禹拜稽首，<让>于契、后稷、皋陶。（《史记•夏本纪》）
            url: xxxx
            vernacular: 禹叩头拜谢，谦让给契、后稷、皋陶。
      - trans: ❸把自己的权力、职位等交给别人。
        sentences:
          - ancient: 信贤而任之，君之明也；<让>贤而下之，臣之忠也。 （《吕氏春秋•慎人》）
            url: xxxx
            vernacular: 信任贤才而任用他，这是君主英明，让位给贤人而自己甘居贤人之下，这是臣子的忠诚。
