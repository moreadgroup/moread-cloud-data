---
words:
  - word: 奇
    type: 【名词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶奇妙的稀奇的事物。
        sentences:
          - ancient: 而有<奇>若此，前未一探。（明•徐霞客《游黄山日记》）
            url: xxxx
            vernacular: 而有这样的奇景，前次游山却未来探访
      - trans: ❷泛指出人意表的计谋或策略等。
        sentences:
          - ancient: 权谋者，以正守国，以<奇>用兵。（《汉书•艺文志》）
            url: xxxx
            vernacular: 以无为、清静之道去治理国家,以奇巧、诡秘的办法去用兵
  - word: 奇
    type: 【动词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: 以为奇妙;认为奇特。
        sentences:
          - ancient: 大将军邓骘（zhi4）<奇>其才，累召不应。（《张衡传》）
            url: xxxx
            vernacular: 大将军邓骘认为他的才能出众，屡次征召他，他也不去应召。
          - ancient: 每闻琴瑟之声，则应节而舞，益<奇>之。（《促织》）
            url: xxxx
            vernacular: 每当听到琴瑟的弦音,就会随着节奏（旋律）翩然起舞,（某某）更加的感到神奇.
          - ancient: 梁掩其口，曰:"毋妄言，族矣!"梁以此<奇>籍。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 项梁急忙捂住他的嘴，说：“不要胡说，要满门抄斩的！”但项梁却因此而感到项籍很不一般。
          - ancient: 【高考题例】邓愈镇江西，数延见，<奇>其才，荐之。（《明史•熊鼎传》）
            url: xxxx
            vernacular: 邓愈镇守江西的时候，多次邀请熊鼎相会，为他的才能感到惊奇，（向朝廷）推荐他。
          - ancient: 【高考题例】<奇>其才，俾将兵略地，所至辄克。（《明史•花云传》）
            url: xxxx
            vernacular: 太祖认为他是个奇才，就让他带兵攻占城邑，所到之处总被攻克。
  - word: 奇
    type: 【形容词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: ❶奇妙;稀奇。
        sentences:
          - ancient: 以赂秦之地，封天下之谋臣，以事秦之心，礼天下之<奇>才，并力西向，则吾恐秦人食之不得下咽也。（《六国论》）
            url: xxxx
            vernacular: 如果六国诸侯用贿赂秦国的土地来封给天下的谋臣，用侍奉秦国的心来礼遇天下的奇才，齐心合力地向西对付秦国，那么，我恐怕秦国人饭都不能咽下去。
          - ancient: 市中游侠儿得佳者笼养之，昂其直（同"值"，价格），居为<奇>货。（《促织》）
            url: xxxx
            vernacular: 于是市上的那些游手好闲的年轻人，捉到好的蟋蟀就用竹笼装着喂养它，抬高它的价格；储存起来，当作珍奇的货物一样等待高价出售。
          - ancient: 余与四人拥火以入，入之愈深，其进愈难，而其见愈<奇>。（《游褒禅山记》）
            url: xxxx
            vernacular: 我与四个人打着火把走进去，进去越深，前进越困难，而所见到的景象越奇妙。
      - trans: ❷出乎意料而使人不测。
        sentences:
          - ancient: 愿足下假（给予）臣<奇>兵三万人。（《史记•淮阴侯列传》）
            url: xxxx
            vernacular: 希望您临时调拨三万奇兵给我
  - word: 奇
    type: 【副词】
    phonetic: qi2
    tags:
      - 高中
    samples:
      - trans: 极;甚。
        sentences:
          - ancient: 翩翩三青鸟，毛色<奇>可怜（喜爱）。（晋•陶渊明《读〈山海经〉》）
            url: xxxx
            vernacular: 翩翩飞舞三青鸟，毛色鲜明甚好看。
  - word: 奇
    type: 【名词】
    phonetic: ji1
    tags:
      - 高中
    samples:
      - trans: ❶单数（与"偶""耦"相对）。
        sentences:
          - ancient: 每<奇>日未尝不视朝，对宰相群臣延访政事,久之方罢。（《资治通鉴•唐纪五十九》）
            url: xxxx
            vernacular: 每逢单日都去上朝,向宰相和群臣百官访询朝政大事,很晚才罢朝。
          - ancient: 阳卦<奇>，阴卦耦。（《周易•系辞下》）
            url: xxxx
            vernacular: 阳卦中阳爻为单数,阴卦中阳爻为双数
      - trans: ❷零头;余数。
        sentences:
          - ancient: 舟首尾长约八分有<奇>，高可二黍许。（《核舟记》）
            url: xxxx
            vernacular: 船头到船尾大约长八分多一点，大约有两个黄米粒那么高。
  - word: 奇
    type: 【形容词】
    phonetic: ji1
    tags:
      - 高中
    samples:
      - trans: 命运不好。
        sentences:
          - ancient: 数<奇>谪关塞，道广存箕颍。（唐•杜甫《西枝村寻置草堂地夜宿赞公土室》）
            url: xxxx
            vernacular: 数奇：命运不好。谪：贬谪。
          - ancient: 大将军青亦阴受上诫，以为李广老，数<奇>，毋令当单于，恐不得所欲。（《史记•李将军列传》）
            url: xxxx
            vernacular: 大将军卫青曾暗中受到皇上的警告，认为李广年老，命运不好，不要让他与单于对敌，恐怕不能实现俘获单于的愿望。
