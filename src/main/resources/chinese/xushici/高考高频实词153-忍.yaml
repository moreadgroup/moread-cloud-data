---
words:
  - word: 忍
    type: 【动词】
    phonetic: ren3
    tags:
      - 高中
    samples:
      - trans: ❶忍耐;忍受。
        sentences:
          - ancient: 且相如素（本来）贱人，吾羞，不<忍>为之下！（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 况且蔺相如本来就出身卑贱，我感到羞耻，无法容忍在他的下面。
          - ancient: 顽童之为是心也，诚不可<忍>。（《柳毅传》）
            url: xxxx
            vernacular: 那小子存这样的心，确实难以容忍
          - ancient: 屈心而抑志兮，<忍>尤而攘诟。（《离骚》）
            url: xxxx
            vernacular: 宁愿委曲心志压抑情感，宁把斥责咒骂统统承担。
          - ancient: 予分当引决，然而隐<忍>以行。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 我按理应当自杀，然而仍然含恨忍辱地前去。
      - trans: ❷克制。
        sentences:
          - ancient: 志<忍>私，然后能公;行<忍>情性，然后能修，知而好问然后能才。（《荀子・儒效》）
            url: xxxx
            vernacular: 在意志上能够抑制私欲然后才能为公，在行为上能抑制感情然后才能有好的品质，聪明并且善于请教别人然后才能成为有才干的人。
      - trans: ❸狠心;硬着心肠。
        sentences:
          - ancient: 君王为人不<忍>。（《鸿门宴》）
            url: xxxx
            vernacular: 君王对待他人仁慈。
          - ancient: 百姓皆以王为爱也，臣固（的确）知王之不<忍>也。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 百姓都认为大王吝啬(一头牛)。(但是)我知道您是出于于心不忍(的缘故)。
          - ancient: 恻隐不<忍>，仁之气也。（《论衡•本性》）
            url: xxxx
            vernacular: 有恻隐之心，便生不忍之意；不忍之意，是人所禀仁德之气。
          - ancient: 荆轲知太子不<忍>，乃遂私见樊於期。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 荆轲知道太子不忍心，于是就私下去见樊於期。
          - ancient: 【高考题例】东西异路，不当与，然安<忍>于旧治坐视？（《宋史•萧燧传》）
            url: xxxx
            vernacular: 东部西部不属同路，按说不该给粮食，但哪能忍心对原管辖地区不管不问呢?
