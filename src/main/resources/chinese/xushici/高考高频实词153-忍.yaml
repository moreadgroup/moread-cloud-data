忍ren
【动词】❶忍耐;忍受。
【例句】且相如素（本来）贱人，吾羞，不忍为之下！（《廉颇蔺相如列传》）丨液童之为是心也，诚不可忍。（《柳毅传》）丨屈心而抑志兮，忍尤而攘诟。（《离骚》）丨予分当引决，然而隐忍以行。（《〈指南录〉后序》）
❷克制。
【例句】志忍私，然后能公;行忍情性，然后能修。（《荀子・儒效》）
❸狠心;硬着心肠。
【例句】君王为人不忍。（《鸿门宴》）丨百姓皆以王为爱也,臣固（的确）知王之不忍也。（《齐桓晋文之事》）丨恻隐不忍,仁之气也。（《论衡•本性》）丨荆轲知太子不忍,乃遂私见樊於期。（《荆轲刺秦王》）
【高考题例】东西异路，不当与,然安忍于旧治坐视？（《宋史•萧燧传》）
