words:
  - word: 迩
    type: 【形容词】
    phonetic: er
    tags:
      - 高中
    samples:
      - trans: ❶近。
        sentences:
          - ancient: 其称文小而其指极大，举类迩而见义远。（《史记・屈原贾生列传》）
          - ancient: 迩年狱讼,情稍重，京兆、五城即不敢专决。（《狱中杂记》）
      - trans: ❷浅近。
        sentences:
          - ancient: 以大知（通"智"）而察及迩言，非苟为谦，诚取善之弘也。（清•刘开《问说》）