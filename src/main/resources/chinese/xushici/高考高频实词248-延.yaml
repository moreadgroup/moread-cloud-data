---
words:
  - word: 延
    type: 【名词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: ❶通"綖"。盖在冕板上的黑布。
        sentences:
          - ancient: 天子玉藻,十有二旒（liu2,冠冕前后悬垂的玉串）,前后邃（sui4）延。（《礼记•关藻》）
      - trans: ❷通"蜒"。墓道。
        sentences:
          - ancient: 隧，若今延道。（《春秋左传集解•隐公元年》"隧而相见""杜预注）

  - word: 延
    type: 【动词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: ❶延长;延续。
        sentences:
          - ancient: 延及孝文王、庄襄王，享国之日浅（少），国家无事（战事）。（《过秦论》）
          - ancient: 今日之事,何不使莪得早处囊中，以苟延残喘乎？（《中山狼传》）
      - trans: ❷扩大范围。
        sentences:
          - ancient: 去北军二里余，同时发火，火烈风猛，船往如箭,烧尽北船，延及岸上营落。（《资治通鉴•汉纪五十七》）
      - trans: ❸引进;迎接。
        sentences:
          - ancient: 秦人开关延敌，九国之师（军队），逡qūn巡xún而不敢进。（《过秦论》）
      - trans: ❹邀请。
        sentences:
          - ancient: 于是沛公起，摄衣谢之，延上坐。（《史记•高祖本纪》）
          - ancient: 余人各复延至其家，皆出酒食。（《桃花源记》）

          - ancient: 【高考题例】邓愈镇江西,数延见，奇其才,荐之。（《明史•熊鼎传》）
          - ancient: 时吴氏家延师儒，鼎就学,吴氏亦子育之，使学。（明•方孝孺《詹鼎传》）
  - word: 延
    type: 【形容词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: 长久。
        sentences:
          - ancient: 悔相道之不察兮，延伫乎吾将反。（《离骚》）

