延yan2
【名词】❶通"綖"。盖在冕板上的黑布。
【例句】天子玉藻,十有二旒（liu2,冠冕前后悬垂的玉串）,前后邃（sui4）延。（《礼记•关藻》）
2通"蜒"。墓道。
【例句】隧，若今延道。（《春秋左传集解•隐公元年》"隧而相见""杜预注）

【动词】❶延长;延续。
【例句】延及孝文王、庄襄王，享国之日浅（少），国家无事（战事）。（《过秦论》）丨今日之事,何不使莪得早处囊中，以苟延残喘乎？（《中山狼传》）
❷扩大范围。
【例句】去北军二里余，同时发火，火烈风猛，船往如箭,烧尽北船，延及岸上营落。（《资治通鉴•汉纪五十七》）
❸引进;迎接。
【例句】秦人开关延敌，九国之师（军队），逡qūn巡xún而不敢进。（《过秦论》）
❹邀请。
【例句】于是沛公起，摄衣谢之，延上坐。（《史记•高祖本纪》）丨余人各复延至其家，皆出酒食。（《桃花源记》）

【高考题例】邓愈镇江西,数延见，奇其才,荐之。（《明史•熊鼎传》）丨时吴氏家延师儒，鼎就学,吴氏亦子育之，使学。（明•方孝孺《詹鼎传》）


	
【形容词】：长久。
【例句】悔相道之不察兮，延伫乎吾将反。（《离骚》）

