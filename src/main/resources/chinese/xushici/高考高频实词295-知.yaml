【名词】通"智"。智慧;聪明。
【例句】故木受绳则直，金（金属）就砺（磨刀石）则利，君子博学而日参省（检验考察）乎己，则知明而行无过矣。（《劝学》）丨小知不及大知，小年不及大年。（《逍遥游》）丨故夫知效一官，行比一乡，德合一君,而征一国者，其自视也，亦若此矣。（《逍遥游》）

