【名词】❶知识。
【例句】两小儿笑曰："孰为汝多知乎「"（《两小儿辩日》）
❷交往。
【例句】故绝宾客之知。（《报任安书》）
❸朋友;知己。
【例句】遂如故知。（《左传•昭公二十八年》）丨悲歌辞旧爱,衔泪觅新知。（南朝宋•鲍照《咏双燕》）
❹知觉;感觉。
【例句】手等有痛痒之知。（汉•范缜《神灭论》）丨死而有知，其几何离？其无知，悲不几时，而不悲者无穷期矣。（《祭十二郎文》）
❺见解;见识。
【例句】有独知之虑（思虑）者。（《商君书•更法》）

【动词】❶知道;了解。
【例句】呜呼！孰知赋敛之毒，有甚是蛇者乎！（《捕蛇者一说》）丨人非生而知之者，孰能无惑？（《师说》）丨知己知彼,
百战不殆（危险）。（《孙子兵法•谋攻》）丨朝菌不知晦朔,蟪蛄不知春秋，此小年也。（《逍遥游》）丨居则曰："不吾知也。"如或知尔，则何以哉？（《子路、曾晳、冉有、公西华侍坐》）丨不吾知其亦已兮，苟余情其信芳。（《离骚》）

【高考题例】吾唯知吾君可帝中国尔，苟立异姓，吾当死之。《宋史•孙傅传》）	

❷主持;掌握。	
【例句】吾与之共知越国之政。（《勾践灭吴》）
【高考题例】还朝，用为三司盐铁判官，以比部员外郎出知遂州。（《宋史•范纯礼传》）丨明年,知秦州，又改郓yun4州。（《宋史•许将传》）丨举进士甲科，知会稽县。（《宋史・曾公亮传》）
❸识别。
【例句】其真不知马也！（《马说》）
❹交好;投合。
【例句】公孙明知叔孙于齐。（《左传•昭公四年》）
❺表现;显现。
【例句】文侯不悦，知于颜色。（《吕氏春秋•自知》）
