---
words:
  - word: 察
    type: 【动词】
    phonetic: cha2
    tags:
      - 高中
    samples:
      - trans: ❶观察。
        sentences:
          - ancient: 仰观宇宙之大，俯<察>品类之盛，所以游目骋怀，足以极视听之娱。（《兰亭集序》）
            url: xxxx
            vernacular: 仰首观览到宇宙的浩大，俯看观察大地上众多的万物，用来舒展眼力，开阔胸怀，足够来极尽视听的欢娱，实在很快乐。
          - ancient: 徐而<察>之，则山下皆石穴罅（xia4，缝隙），不知其浅深。（《石钟山记》）
            url: xxxx
            vernacular: 我慢慢地观察，山下都是石穴和缝隙，不知它们有多深
          - ancient: 悔相道之不<察>兮，延伫乎吾将反。（《离骚》）
            url: xxxx
            vernacular: 后悔当初不曾看清前途，迟疑了一阵我又将回头。
      - trans: ❷看清;明辨。
        sentences:
          - ancient: 明足以<察>秋毫之末，而不见舆薪。（《齐桓晋文之事》）
            url: xxxx
            vernacular: （我的）眼力足以看清鸟兽秋天新生细毛的末梢，却看不到整车的柴草。
      - trans: ❸知晓;明了。
        sentences:
          - ancient: 谋利而得害，犹弗<察>也。（《吕氏春秋•召类》）
            url: xxxx
            vernacular: 谋求利益而遭到伤害,还不清楚的
      - trans: ❹考察;审察。
        sentences:
          - ancient: 陛下亦宜自谋，以咨诹（诹ZOU1，咨询）善道，<察>纳雅言，深追先帝遗诏。（《出姉弟》）
            url: xxxx
            vernacular: 陛下也应自行谋划，毫无保留地进献忠诚的建议，采纳正确的言论，深切追念先帝临终留下的教诲。
          - ancient: 向<察>众人之议，专欲误将军，不足与图大事。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 刚才考察众人的议论,完全是要误害将军。
          - ancient: <察>邻国之政，无如寡人之用心者。（《孟子•梁惠王上》）
            url: xxxx
            vernacular: 看看邻国的君主主办政事，没有像我这样尽心尽力的。
      - trans: ❺推荐、选拔官吏。
        sentences:
          - ancient: 严仲子乃<察>举吾弟困污之中而交之。（《史记•刺客列传》）
            url: xxxx
            vernacular: xxxx
          - ancient: 前太守臣逵，<察>臣孝廉，后刺史臣荣，举臣秀才。（《陈情表》）
            url: xxxx
            vernacular: 先有名叫逵的太守察举臣为孝廉，后又有名叫荣的刺史推举臣为优秀人才。
      - trans: ❻体察;理解。
        sentences:
          - ancient: 怨灵修之浩荡兮，终不<察>夫民心。（《离骚》）
            url: xxxx
            vernacular: 我怨恨我那君王（楚怀王）过分荒唐，始终不能明了我心迹啊。
  - word: 察
    type: 【形容词】
    phonetic: cha2
    tags:
      - 高中
    samples:
      - trans: 精明。
        sentences:
          - ancient: 水至清则无鱼，人至<察>则无徒。（汉.东方朔《答客难》）
            url: xxxx
            vernacular: 水太清了，鱼就无法生存，要求别人太严了，就没有伙伴。
