状zhuang4
.【名词】❶形状;样子。
【例句】居右者椎髻仰面,左手倚一横木，右手攀右趾，若啸呼状。（《核舟记》）丨以筒水灌之，始出，状极俊健。（《促织》）丨吕公者，好相人，见高祖状貌，因重敬之，引入坐。（《史记•高祖本纪》）
❷景色;景象。
【例句】予观夫巴陵胜（优美）状,在洞庭一湖。（《岳阳楼记》）丨大孤状类西梁。（《过小孤山大孤山》）
❸好的样子。有时意谓礼貌。
【例句】行视鲧之治水无状,乃殛（ji2,诛杀）鲧于羽山以死。（《史记•夏本纪》）丨诸侯吏卒异时（过去）故徭使屯戍过秦中，秦中吏卒遇之多无状。（《吏适•项羽本纪》）

【高考题例】贾生自伤为傅无状，哭泣岁余,亦死。（《史记•屈原贾生列传》）
❹情形;情况。
【例句】单于使卫律治其事，张胜闻之，恐前语发，以状语武。（《苏武传》）丨行过夷门，见侯生，具告所以欲死秦军状。（《史记•魏公子列传》）

【高考题例】上因感鬼神事，而问鬼神之本。贾生因具道所以然之状。（《史记•屈原贾生列传》）
❺文体的一种，用于下对上叙事或申诉的文件。
【例句】太尉自州以状白（报告）府。（唐•柳宗元《段太尉逸事状》）丨故例，谪戍者移顺天府羁候，时方冬停遣，李具状求在狱候春发遣,至再三，不得所请，怅然而出。（《狱中杂记》）

【动词】❶陈述;描绘。
【例句】先生不平，具状其囊狼怜惜之意。（《中山狼传》）
❷表示一种揣测，犹言"看样子""看来"。
【例句】状河伯留客之久，若皆罢去归矣。（汉•褚少孙《西门豹治邺》）