---
words:
  - word: 状
    type: 【名词】
    phonetic: zhuang4
    tags:
      - 高中
    samples:
      - trans: ❶形状;样子。
        sentences:
          - ancient: "居右者椎髻仰面，左手倚一横木，右手攀右趾，若啸呼<状>。（《核舟记》）"
            url: xxxx
            vernacular: 位于右边的撑船者梳着椎形发髻，仰着脸，左手倚着一根横木上，右手扳着右脚趾头，好像在大声呼喊的样子。
          - ancient: 掭以尖草，不出；以筒水灌之，始出，<状>极俊健。（《促织》）
            url: xxxx
            vernacular: 他用细草撩拨，蟋蟀不出来；又用竹筒取水灌进石洞里，蟋蟀才出来，形状极其俊美健壮。
          - ancient: 吕公者，好相人，见高祖<状>貌，因重敬之，引入坐。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 吕公喜好为人看相，见高祖刘邦相貌堂堂，因而特别敬佩他，让他入座。
      - trans: ❷景色;景象。
        sentences:
          - ancient: "予观夫巴陵胜（优美）<状>，在洞庭一湖。（《岳阳楼记》）"
            url: xxxx
            vernacular: 我观看那巴陵郡的美好景色，全在洞庭湖上。
          - ancient: 大孤<状>类西梁，虽不可拟小姑之秀丽。（《过小孤山大孤山》）
            url: xxxx
            vernacular: 大孤山的样子像西梁山，虽然比不上小孤山那样秀丽
      - trans: ❸好的样子。有时意谓礼貌。
        sentences:
          - ancient: "行视鲧之治水无<状>，乃殛（ji2，诛杀）鲧于羽山以死。（《史记•夏本纪》）"
            url: xxxx
            vernacular: (舜)在巡行中发现鲧治水实在不像话，就把鲧流放到羽山，后来鲧就死在那里。
          - ancient: 诸侯吏卒异时（过去）故徭使屯戍过秦中，秦中吏卒遇之多无<状>。（《吏适•项羽本纪》）
            url: xxxx
            vernacular: xxxx
          - ancient: "【高考题例】贾生自伤为傅无<状>，哭泣岁余，亦死。（《史记•屈原贾生列传》）"
            url: xxxx
            vernacular: 贾谊认为自己这个老师没有当好，很伤心，哭泣了一年多，也就死去了。
      - trans: ❹情形;情况。
        sentences:
          - ancient: 单于使卫律治其事，张胜闻之，恐前语发，以<状>语武。（《苏武传》）
            url: xxxx
            vernacular: 单于派卫律审理这一案件。张胜听到这个消息，担心他和虞常私下所说的那些话被揭发，便把事情经过告诉了苏武。
          - ancient: 行过夷门，见侯生，具告所以欲死秦军<状>。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 公子带着车队走过东门时，去见侯先生，把打算同秦军拼一死命的情况全都告诉了侯先生。
          - ancient: 【高考题例】上因感鬼神事，而问鬼神之本。贾生因具道所以然之<状>。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 文帝有感于鬼神之事，便询问鬼神的本源。贾谊就详细说明了鬼神形成的情形。
      - trans: ❺文体的一种，用于下对上叙事或申诉的文件。
        sentences:
          - ancient: 太尉自州以<状>白（报告）府，愿计事。（唐•柳宗元《段太尉逸事状》）
            url: xxxx
            vernacular: 段太尉从泾州用文书报告白孝德，表示愿意为他出谋划策。
          - ancient: "故例，谪戍者移顺天府羁候，时方冬停遣，李具<状>求在狱候春发遣，至再三，不得所请，怅然而出。（《狱中杂记》）"
            url: xxxx
            vernacular: 按照旧例，充军的人都移押顺天府待命；这时正是冬天，停止发遣，姓李的具状要求仍回刑部监狱等候春天发遣，要求再三，都没批准，还老大不高兴呢！
  - word: 状
    type: 【动词】
    phonetic: zhuang4
    tags:
      - 高中
    samples:
      - trans: ❶陈述;描绘。
        sentences:
          - ancient: 先生不平，具<状>其囊狼怜惜之意。（《中山狼传》）
            url: xxxx
            vernacular: 先生认为不公平，具体地说出他把狼装到袋子中的怜惜狼的意思。
      - trans: ❷表示一种揣测，犹言"看样子""看来"。
        sentences:
          - ancient: <状>河伯留客之久，若皆罢去归矣。（汉•褚少孙《西门豹治邺》）
            url: xxxx
            vernacular: 看样子河伯留客要留很久，你们都散了吧，离开这儿回家去吧。
