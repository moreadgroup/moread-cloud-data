---
words:
  - word: 响
    type: 【名词】
    phonetic: xiang3
    tags:
      - 高中
    samples:
      - trans: ❶回声。
        sentences:
          - ancient: 空谷传<响>，哀转（悲哀婉转）久绝。（《三峡》）
            url: xxxx
            vernacular: 空荡的山谷里传来猿叫的回声，悲哀婉转，很久才消失。
          - ancient: 斩木为兵，揭竿为旗，天下云集<响>应，赢（担着）粮而景（像影子—样）从。（《过秦论》）
            url: xxxx
            vernacular: 斩断木头作兵器，举起旗杆造反，天下百姓纷纷响应，背着粮食投身到起义队伍中
      - trans: ❷声音。
        sentences:
          - ancient: 知不可乎骤得，托遗<响>于悲风。（《赤壁赋》）
            url: xxxx
            vernacular: （我）知道这些不可能屡屡得到，托寄在悲凉的秋风中罢了。
          - ancient: 渔舟唱晩，<响>穷彭蠡之滨。（《滕王阁序》）
            url: xxxx
            vernacular: 傍晚时分，渔夫在渔船上歌唱，那歌声响彻彭蠡湖滨
          - ancient: 歌台暖<响>，春光融融;舞殿冷袖，风雨凄凄。（《阿房宫赋》）
            url: xxxx
            vernacular: 歌台上由于歌声响亮而充满暖意，有如春光融和；舞殿上由于舞袖飘拂而充满寒意，有如风雨凄凉。
      - trans: ❸音讯。
        sentences:
          - ancient: 衔命来征，思闻嘉<响>，果烦来使，告以德音。（《三国志•蜀书•后主传》注引王隐《蜀记》）
            url: xxxx
            vernacular: xxxx
