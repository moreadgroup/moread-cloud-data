---
words:
  - word: 胜
    type: 【动词】
    phonetic: sheng1
    tags:
      - 高中
    samples:
      - trans: ❶承担得了；经受得起。
        sentences:
          - ancient: 沛公（指刘邦）不胜杯杓，不能辞。（《鸿门宴》）
          - ancient: 德不处其摩，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。（《谏太宗十思疏》）
          - ancient: 臣不胜犬马怖惧之情,谨拜表以闻。（《陈情表》）
          - ancient: 驴不胜怒，蹄之。（《黔之驴》）
          - ancient: 【高考题例】其间岂无刚頁之人，而弗胜龃龉（比喻意见不合），多不能安其身。（《明史•陈登云"传"》）
          - ancient: 【高考题例】水浅不胜舟，陆当用车八千乘，沿边方登（丰收）麦，愿以运费增价就籴（买）之。（《宋史•何灌传》）
      - trans: ❷尽;完。
        sentences:
          - ancient: 不违农时，谷不可胜食也。（《寡人之于国也》）
          - ancient: 夫秦王有虎狼之心,杀人如不能举（尽），刑人如恐不胜，天下皆叛之。（《鸿门宴》）
          - ancient: 后世之谬其传而莫能名者,何可胜道也哉！（《游褒禅山记》）
          - ancient: 古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。（《报任安书》）

  - word: 胜
    type: 【名词】
    phonetic: sheng4
    tags:
      - 高中
    samples:

      - trans: 优越美好的人或事物。
        sentences:
          - ancient: 宣武（桓温）集诸名胜（名流）讲《易》，日说一卦。（《世说航语•文学》）
          - ancient: 见怪石特出，度其下必有殊胜。（唐•柳宗元《永州崔中丞万石亭记》）

  - word: 胜
    type: 【动词】
    phonetic: sheng4
    tags:
      - 高中
    samples:
      - trans: ❶胜利。
        sentences:
          - ancient: 赵尝五战于秦，二败而三胜。（《六国论》）
      - trans: ❷制服;战胜（与"败"相对）。
        sentences:
          - ancient: 仁之<胜>不仁也，犹水之<胜>火。（《孟子•告子上》）
          - ancient: 夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。（《六国论》）
      - trans: ❸超过;胜过。
        sentences:
          - ancient: 日出江花红胜火，春来江水绿如蓝。（唐•白居易《忆江南》）
          - ancient: 别有幽愁暗恨生，此时无声胜有声。（《琵琶行》）

  - word: 胜
    type: 【形容词】
    phonetic: sheng4
    tags:
      - 高中
    samples:
      - trans: 优美;美好。
        sentences:
          - ancient: 胜地不常（长存），盛筵难再。（《滕王阁序》）
          - ancient: 予观夫巴陵胜状,在孺庭一湖。（《岳阳楼记》）
          - ancient: 东南形胜，三吴都会，钱塘自古繁华。（宋•柳永《望海潮》）

  - word: 胜
    type: 【副词】
    phonetic: sheng4
    tags:
      - 高中
    samples:
      - trans: 尽，全，都。
        sentences:
          - ancient: 【高考题例】在职九年，稽核财赋,修筑陂塘埒岸，不可胜计。（明•张岳《张祖传》）

