归㊀gui1
【动词】❶返回；回去。
【例句】将军百战死,壮士十年归。（《木兰诗》）丨一屠晚归，归担中肉尽，止有剩骨。（《狼》）丨卿但暂还家，吾今且报府。不久当归还,还必相迎取。（《孔雀东南飞》）丨屈节辱命，虽生，何面目以归汉！（《苏武传》）
❷归还;送回。
【例句】城入赵而璧留秦;城不入，臣请完璧归赵。（《廉颇蔺相如列传》）丨知幸与不幸，则其读书也必专，而其归书也必速。（《黄生借书说》）
❸归附；归属。
【例句】孙讨虏（指孙权）聪明仁惠，敬贤礼士，江表英豪，咸归附之。（《檎治通鉴•汉纪五十七》）丨迩年狱讼，情稍重，京兆、五城即不敢专决；又九门提督所访缉纠诘，皆归刑部。（《狱中杂记》）丨聊乘化以归尽，乐夫天命复奚疑！（《归去来兮辞》）丨苏君，律前负汉归匈奴，幸蒙大恩，赐号称王。（《苏武传》）
❹汇聚。
【例句】况刘豫州（指刘备）王室之胄，英才盖世，众士慕仰，若水之归海。资治通鉴•汉纪五十七》）丨大率用根者，若有宿根，须取无茎叶时釆，则津泽皆归其根。（《梦溪笔谈•药议》）
❺出嫁。
【例句】余既为此志,后五年，吾妻来归。（《项脊轩志》）
❻称许。
【高考题例】其幸而恒处于有可慕、有可惧之地，则可以终其身而不至于坏,而世遂以全节归之。（明•唐顺之《赠郡侯郭文麓升副使序》）


归㊁kui4
通"馈"。赠送。
【例句】自牧（野外）归荑，洵（的确）美且异。（《诗经•邶风•静女》"）丨阳货欲见孔字，孔子不见，归孔子豚。（《论语•阳货》）
