---
words:
  - word: 归
    type: 【动词】
    phonetic: gui1
    tags:
      - 高中
    samples:
      - trans: ❶返回；回去。
        sentences:
          - ancient: 将军百战死，壮士十年归。（《木兰诗》）
          - ancient: 一屠晚归，担中肉尽，止有剩骨。（《狼》）
          - ancient: 卿但暂还家，吾今且报府。不久当归还，还必相迎取。（《孔雀东南飞》）
          - ancient: 屈节辱命，虽生，何面目以归汉！（《苏武传》）
      - trans: ❷归还;送回。
        sentences:
          - ancient: 城入赵而璧留秦;城不入，臣请完璧归赵。（《廉颇蔺相如列传》）
          - ancient: 知幸与不幸，则其读书也必专，而其归书也必速。（《黄生借书说》）
      - trans: ❸归附；归属。
        sentences:
          - ancient: 孙讨虏（指孙权）聪明仁惠，敬贤礼士，江表英豪，咸归附之。（《檎治通鉴•汉纪五十七》）
          - ancient: 迩年狱讼，情稍重，京兆、五城即不敢专决；又九门提督所访缉纠诘，皆归刑部。（《狱中杂记》）
          - ancient: 聊乘化以<归>尽，乐夫天命复奚疑！（《归去来兮辞》）
          - ancient: 苏君，律前负汉归匈奴，幸蒙大恩，赐号称王。（《苏武传》）
      - trans: ❹汇聚。
        sentences:
          - ancient: 况刘豫州（指刘备）王室之胄，英才盖世，众士慕仰，若水之归海。资治通鉴•汉纪五十七》）
          - ancient: 大率用根者，若有宿根，须取无茎叶时釆，则津泽皆归其根。（《梦溪笔谈•药议》）
      - trans: ❺出嫁。
        sentences:
          - ancient: 余既为此志，后五年，吾妻来归。（《项脊轩志》）
      - trans: ❻称许。
        sentences:
          - ancient: 【高考题例】其幸而恒处于有可慕、有可惧之地，则可以终其身而不至于坏，而世遂以全节归之。（明•唐顺之《赠郡侯郭文麓升副使序》）
  - word: 归
    type: 【动词】
    phonetic: kui4
    tags:
