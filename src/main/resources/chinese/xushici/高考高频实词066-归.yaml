    samples:
      - trans: 通"馈"。赠送。
        sentences:
          - ancient: 自牧（野外）归荑，洵（的确）美且异。（《诗经•邶风•静女》"）
          - ancient: 阳货欲见孔字，孔子不见，归孔子豚。（《论语•阳货》）
