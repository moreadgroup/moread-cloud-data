---
words:
  - word: 得
    type: 【名词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: 收获；结果（与"失"相对）。
        sentences:
          - ancient: 古人之观于天地、山川、草木、虫鱼、鸟兽，往往有<得>，以其求思之深而无不在也。（《游褒禅山记》）
            url: xxxx
            vernacular: 古人观察天地、山川、草木、虫鱼、鸟兽，往往有所得益，是因为他们探究、思考深邃而且广泛。
  - word: 得
    type: 【动词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: ❶得到；获得（与"失"相对）。
        sentences:
          - ancient: 秦以攻取之外，小则获邑，大则<得>城。（《六国论》）
            url: xxxx
            vernacular: 秦国除了用战争夺取土地以外，还收到诸侯的贿赂，小的就获得邑镇，大的就获得城池。
          - ancient: 岂<得>之难而失之易欤？（《伶官传序》）
            url: xxxx
            vernacular: 难道说是因为取得天下难，而失去天下容易才像这样的吗？
          - ancient: 事所以不成者，乃欲以生劫之，必<得>约契以报太子也。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 事情之所以没有成功，是想活生生地劫持你，一定要得到约契来回报燕太子啊!
      - trans: ❷可以;可能。
        sentences:
          - ancient: 沛公军霸上，未<得>与项羽相见。（《鸿门宴》）
            url: xxxx
            vernacular: 刘邦驻军霸上，还没有能和项羽相见
          - ancient: 以是人多以书假（借）余，余因<得>遍观群书。（《送东阳马生序》）
            url: xxxx
            vernacular: 因此有很多人都愿意把书借给我，于是我能够遍观群书。
          - ancient: 既其出，则或咎其欲岀者，而余亦悔其随之而不<得>极夫游之乐也。（《游褒禅山记》）
            url: xxxx
            vernacular: 我们出洞以后，就有人埋怨那主张退出的人，我也后悔跟他出来，而未能极尽游洞的乐趣。
      - trans: ❸通"德"。感激;感恩。
        sentences:
          - ancient: 为宫室之美、妻妾之奉、所识穷乏者<得>我与？（《鱼我所欲也》）
            url: xxxx
            vernacular: 是为了住宅的华丽，妻妾的侍奉和熟识的穷人感激我吗？
      - trans: ❹适合;投合。
        sentences:
          - ancient: 某亦守法，与公甚相<得>也。（明•崔铁《记王忠肃公翱三事》）
            url: xxxx
            vernacular: 这个太监也奉公守法，同王公相处得很好。
  - word: 得
    type: 【形容词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: ❶得当;合适。
        sentences:
          - ancient: 古人云："以地事秦，犹抱薪救火，薪不尽，火不灭。"此言<得>之。（《六国论》）
            url: xxxx
            vernacular: 古人说：“用土地侍奉秦国，就好像抱柴救火，柴不烧完，火就不会灭。”这话说的很正确。
      - trans: ❷满足;得意。
        sentences:
          - ancient: 虽趣舍万殊，静躁不同，当其欣于所遇，暂<得>于己，快然自足，不知老之将至。（《兰亭集序》）
            url: xxxx
            vernacular: 虽然各有各的爱好，安静与躁动各不相同，但当他们对所接触的事物感到高兴时，一时感到自得，感到高兴和满足，竟然不知道衰老将要到来。
          - ancient: "夫十有一月之中，凡富贵之子，慷慨<得>志之徒，其疾病而死，死而湮没不足道者，亦已众矣，况草野之无闻者欤！（《五人墓碑记》）"
            url: xxxx
            vernacular: 在这十一个月当中，那班富贵之士和志得意满。官运亨通的人，他们患病而死，死了而埋没不足称道的，也太多了，何况乡间的没有声名的人呢?
