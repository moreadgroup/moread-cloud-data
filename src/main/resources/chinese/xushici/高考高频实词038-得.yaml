---
words:
  - word: 得
    type: 【名词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: 收获；结果（与"失"相对）。
        sentences:
          - ancient: 【例句】古人之观于天地、山川、草木、虫鱼、鸟兽，往往有得，以其求思之深而无不在也。（《游褒禅山记》）

  - word: 得
    type: 【动词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: ❶得到；获得（与"失"相对）。
        sentences:
          - ancient: 【例句】秦以攻取之外，小则获邑，大则得城。（《六国论》）
          - ancient: 岂得之难而失之易欤？（《伶官传序》）
          - ancient: 事所以不成者，乃欲以生劫之，必得约契以报太子也。（《荆轲刺秦王》）
      - trans: ❷可以;可能。
        sentences:
          - ancient: 【例句】沛公军霸上，未得与项羽相见。（《鸿门宴》）
          - ancient: 以是人多以书假（借）余，余因得遍观群书。（《送东阳马生序》）
          - ancient: 既其出，则或咎其欲岀者，而余亦悔其随之而不得极夫游之乐也。（《游褒禅山记》）
      - trans: ❸通"德"。感激;感恩。
        sentences:
          - ancient: 【例句】为宫室之美、妻妾之奉、所识穷乏者得我与？（《鱼我所欲也》）
      - trans: ❹适合;投合。
        sentences:
          - ancient: 【例句】某亦守法，与公甚相得也。（明•崔铁《记王忠肃公翱三事》）

  - word: 得
    type: 【形容词】
    phonetic: de2
    tags:
      - 高中
    samples:
      - trans: ❶得当;合适。
        sentences:
          - ancient: 【例句】古人云："以地事秦，犹抱薪救火，薪不尽，火不灭。"此言得之。（《六国论》）
      - trans: ❷满足;得意。	吊
        sentences:
          - ancient: 【例句】虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至。（《兰亭集序》）
          - ancient: 夫十有一月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣,况草野之无闻者欤！（《五人墓碑记》）