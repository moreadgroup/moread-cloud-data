要㊀yao1㊁yao4
要㊀yao1
【名词】"腰"的本字。
【例句】量要而带之。（《荀子•礼论》）丨初，赵盾在时，梦见叔带持要而哭，甚悲；已而笑，拊手且歌。（《史记•赵世家》）
【动词】❶通"邀"。中途拦截。
【例句】吴人要而击之。（《左传•襄公三年》）
❷通"邀"。邀请;约请。
【例句】张良出，要项伯。（《鸿门宴》）丨便要还家，设酒杀鸡作食。（《桃花源记》）
❸约束。
【例句】夫盟，信之要也。（《国语•鲁语下》）
❹相约;约定。
【例句】虽与府吏要，渠会（和他相会）永无缘。（《孔雀东南飞》）
❺威胁;要挟。
【例句】夫仲达（司马懿）以所能要其君。（宋•陈亮《诸葛一孔明》）丨惟打皮（死刑）无可要，然犹质（扣留头颅，当作抵押）其首。（《狱中杂记》）
❻求取。
【例句】今之人修其天爵，以要人爵。（《孟子•告子上》）
❼制止。
【例句】皇太后固要帝，帝乃止。（《史记•孝文本纪》）
❽核实。
【例句】异其死刑之罪而要之。（《周礼•秋官•乡士》）
要㊁yao4
【名词】关键;要领。
【例句】事在四方，要在中央。（《韩非子•扬权》）

【动词】❶概括;总结。
【例句】要之,死日然后是非乃定。（《报任安书》）
❷必须;需要。
【例句】凡先王之法，有要于时也。（《吕氏春秋•察今》）丨天子遍教词客赋，宫中要唱洞箫词。（唐•徐铉《柳枝词》）
❸索取。
【例句】足下前要仆文章古书。（唐•柳宗元《贺进士参元失火书》）
❹打算;希望。
【例句】要留清白在人间。（明•于谦《石灰吟》）
❺将要;想要。
【例句】囊锥刚要出头来，不道甚时节。（宋•胡铃《好事近》）

【形容词】❶简要。
【例句】儒者博而寡要。（《史记•太史公自序》）
❷显要;重要。
【例句】诚经传之典略，闺庭之要训也。（唐•杜之松《答王绩书》）丨部中老胥，家藏伪章,文书下行直省，多潜（暗地）易（更改）之，增减要语，奉行者莫辨也。（《狱中杂记》）丨东割膏腴之地，北收要害之郡。（《过秦论》）
