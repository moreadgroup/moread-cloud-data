---
words:
  - word: 要
    type: 【名词】
    phonetic: yao1
    tags:
      - 高中
    samples:
      - trans: “腰”的本字。
        sentences:
          - ancient: 量要而带之。（《荀子•礼论》）
          - ancient: 初，赵盾在时，梦见叔带持要而哭，甚悲；已而笑，拊手且歌。（《史记•赵世家》）

  - word: 要
    type: 【动词】
    phonetic: yao1
    tags:
      - 高中
    samples:
      - trans: ❶通"邀"。中途拦截。
        sentences:
          - ancient: 吴人要而击之。（《左传•襄公三年》）
      - trans: ❷通"邀"。邀请;约请。
        sentences:
          - ancient: 张良出，要项伯。（《鸿门宴》）
          - ancient: 便要还家，设酒杀鸡作食。（《桃花源记》）
      - trans: ❸约束。
        sentences:
          - ancient: 夫盟，信之要也。（《国语•鲁语下》）
      - trans: ❹相约;约定。
        sentences:
          - ancient: 虽与府吏要，渠会（和他相会）永无缘。（《孔雀东南飞》）
      - trans: ❺威胁;要挟。
        sentences:
          - ancient: 夫仲达（司马懿）以所能要其君。（宋•陈亮《诸葛一孔明》）
          - ancient: 惟打皮（死刑）无可要，然犹质（扣留头颅，当作抵押）其首。（《狱中杂记》）
      - trans: ❻求取。
        sentences:
          - ancient: 今之人修其天爵，以要人爵。（《孟子•告子上》）
      - trans: ❼制止。
        sentences:
          - ancient: 皇太后固要帝，帝乃止。（《史记•孝文本纪》）
      - trans: ❽核实。
        sentences:
          - ancient: 异其死刑之罪而要之。（《周礼•秋官•乡士》）

  - word: 要
    type: 【名词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: 关键;要领。
        sentences:
          - ancient: 事在四方，要在中央。（《韩非子•扬权》）

  - word: 要
    type: 【动词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: ❶概括;总结。
        sentences:
          - ancient: 要之,死日然后是非乃定。（《报任安书》）
      - trans: ❷必须;需要。
        sentences:
          - ancient: 凡先王之法，有要于时也。（《吕氏春秋•察今》）
          - ancient: 天子遍教词客赋，宫中要唱洞箫词。（唐•徐铉《柳枝词》）
      - trans: ❸索取。
        sentences:
          - ancient: 足下前要仆文章古书。（唐•柳宗元《贺进士参元失火书》）
      - trans: ❹打算;希望。
        sentences:
          - ancient: 要留清白在人间。（明•于谦《石灰吟》）
      - trans: ❺将要;想要。
        sentences:
          - ancient: 囊锥刚要出头来，不道甚时节。（宋•胡铃《好事近》）

  - word: 要
    type: 【形容词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: ❶简要。
        sentences:
          - ancient: 儒者博而寡要。（《史记•太史公自序》）
      - trans: ❷显要;重要。
        sentences:
          - ancient: 诚经传之典略，闺庭之要训也。（唐•杜之松《答王绩书》）
          - ancient: 部中老胥，家藏伪章,文书下行直省，多潜（暗地）易（更改）之，增减要语，奉行者莫辨也。（《狱中杂记》）
          - ancient: 东割膏腴之地，北收要害之郡。（《过秦论》）
