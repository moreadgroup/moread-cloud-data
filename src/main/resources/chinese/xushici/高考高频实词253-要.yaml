---
words:
  - word: 要
    type: 【名词】
    phonetic: yao1
    tags:
      - 高中
    samples:
      - trans: “腰”的本字。
        sentences:
          - ancient: 故量食而食之，量<要>而带之。（《荀子•礼论》）
            url: xxxx
            vernacular: 这样就好象要根据饭量吃东西，根据腰的粗细扎腰带。
          - ancient: 初，赵盾在时，梦见叔带持<要>而哭，甚悲；已而笑，拊手且歌。（《史记•赵世家》）
            url: xxxx
            vernacular: 当初，赵盾在世的时候，曾梦见叔带抱着他的腰痛哭，非常悲伤;之后又大笑，还拍着手唱歌。
  - word: 要
    type: 【动词】
    phonetic: yao1
    tags:
      - 高中
    samples:
      - trans: ❶通"邀"。中途拦截。
        sentences:
          - ancient: 吴人<要>而击之，获邓廖。（《左传•襄公三年》）
            url: xxxx
            vernacular: 吴军拦阻攻击楚军，俘掳了邓廖。
      - trans: ❷通"邀"。邀请;约请。
        sentences:
          - ancient: 张良出，<要>项伯。（《鸿门宴》）
            url: xxxx
            vernacular: 张良出去，邀请项伯。
          - ancient: 便<要>还家，设酒杀鸡作食。（《桃花源记》）
            url: xxxx
            vernacular: 村里有人就邀请他到自己家里去（做客），设酒杀鸡做饭来款待他。
      - trans: ❸约束。
        sentences:
          - ancient: 夫盟，信之<要>也。（《国语•鲁语下》）
            url: xxxx
            vernacular: 诸侯盟会，由信义把他们结合在一起。
      - trans: ❹相约;约定。
        sentences:
          - ancient: 虽与府吏<要>，渠会（和他相会）永无缘。（《孔雀东南飞》）
            url: xxxx
            vernacular: 虽然同府吏有过誓约，但同他相会永远没有机缘。
      - trans: ❺威胁;要挟。
        sentences:
          - ancient: 夫仲达（司马懿）以所能<要>其君。（宋•陈亮《诸葛一孔明》）
            url: xxxx
            vernacular: xxxx
          - ancient: 惟大辟（死刑）无可<要>，然犹质（扣留头颅，当作抵押）其首。（《狱中杂记》）
            url: xxxx
            vernacular: 判了死刑砍头的没什么花样，但仍然扣下犯人被砍掉的头颅，跟犯人家属要钱赎回安葬。
      - trans: ❻求取。
        sentences:
          - ancient: 今之人修其天爵，以<要>人爵。（《孟子•告子上》）
            url: xxxx
            vernacular: 现在的人修养天赐的爵位，其目的就在于得到人授的爵位
      - trans: ❼制止。
        sentences:
          - ancient: 皇太后固<要>帝，帝乃止。（《史记•孝文本纪》）
            url: xxxx
            vernacular: 皇太后坚决阻拦文帝，文帝这才作罢。
      - trans: ❽核实。
        sentences:
          - ancient: 异其死刑之罪而<要>之。（《周礼•秋官•乡士》）
            url: xxxx
            vernacular: 区别死罪或施刑之罪而写出判决意见
  - word: 要
    type: 【名词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: 关键;要领。
        sentences:
          - ancient: 事在四方，<要>在中央。（《韩非子•扬权》）
            url: xxxx
            vernacular: 处理各种各样繁多的事务，在于周围四方的臣民，而国家的最高权力要掌握在君主一人手中。
  - word: 要
    type: 【动词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: ❶概括;总结。
        sentences:
          - ancient: "<要>之,死日然后是非乃定。（《报任安书》）"
            url: xxxx
            vernacular: 简单地说，人要到死后的日子，然后是非才能够论定。
      - trans: ❷必须;需要。
        sentences:
          - ancient: 凡先王之法，有<要>于时也。（《吕氏春秋•察今》）
            url: xxxx
            vernacular: 凡是先王的法令制度，是适应当时的需要的。
          - ancient: 天子遍教词客赋，宫中<要>唱洞箫词。（唐•徐铉《柳枝词》）
            url: xxxx
            vernacular: xxxx
      - trans: ❸索取。
        sentences:
          - ancient: 足下前<要>仆文章古书，极不忘，候得数十篇乃并往耳。（唐•柳宗元《贺进士参元失火书》）
            url: xxxx
            vernacular: 您先前要我的文章古书，我始终没有忘记，只是想等到有几十篇后再一起带给您而已。
      - trans: ❹打算;希望。
        sentences:
          - ancient: 粉骨碎身浑不怕，<要>留清白在人间。（明•于谦《石灰吟》）
            url: xxxx
            vernacular: 即使化成粉末，也毫无畏惧、要把清白留在人间
      - trans: ❺将要;想要。
        sentences:
          - ancient: 囊锥刚<要>出头来，不道甚时节。（宋•胡铃《好事近》）
            url: xxxx
            vernacular: 你硬要象囊中锥出头逞能，却不想想这是什么世道时节!
  - word: 要
    type: 【形容词】
    phonetic: yao4
    tags:
      - 高中
    samples:
      - trans: ❶简要。
        sentences:
          - ancient: 儒者博而寡<要>，劳而少功，是以其事难尽从。（《史记•太史公自序》）
            url: xxxx
            vernacular: 儒家学说博大，但缺少治国的切要纲领，出的力气大而收的功效少
      - trans: ❷显要;重要。
        sentences:
          - ancient: 诚经传之典略，闺庭之<要>训也。（唐•杜之松《答王绩书》）
            url: xxxx
            vernacular: 真是经、传的典雅概括，家庭闺门的重要法则。
          - ancient: "部中老胥，家藏伪章,文书下行直省，多潜（暗地）易（更改）之，增减<要>语，奉行者莫辨也。（《狱中杂记》）"
            url: xxxx
            vernacular: 部里的老职员家里都收藏着假印信，公文下行到省级的，往往偷偷动手脚，增减着紧要的字眼，奉行的人是看不出来的。
          - ancient: 东割膏腴之地，北收<要>害之郡。（《过秦论》）
            url: xxxx
            vernacular: 向东割取肥沃的地区，向北占领非常重要的地区。
