岁sui4
【名词】❶木星。
【例句】昨夜斗回北，今朝岁起东。（唐•孟浩然《田家元日》）
❷年。
【例句】自吾氏三世居是乡，积于今六十岁矣。（《捕蛇者说》）丨潯阳地僻无音乐，终岁不闻丝竹声。（《琵琶行》）丨桑之落矣，其黄而陨。自我徂尔，三岁食贫。（《诗经•卫风•氓》）
❸时间;光阴。
【例句】日月逝矣，岁不我与。（《论语•阳货》）丨汩（yu4,迅疾）余若将不及兮，恐年岁之不吾与。（《离骚》）
❹年成;年景。
【例句】王无罪（归罪于）岁，斯天下之民至焉。（《寡人之于
国也》）丨苟无岁，何以有民？（《赵威后问齐使》）
❺每年;一年。
【例句】其始，太医以王命聚之，岁赋其二。（《捕蛇者说》）丨今诸生学于太学,县官日有廩稍（官府发给的膳食津贴）之供,父母岁有裘葛之遗,无冻馁之患矣。（《送东阳马生序》）

【量词】计算年龄的单位。
【例句】乡人长于伯兄一岁，则谁敬？（《孟子•告子上》）丨成有子九岁，窥父不在，窃发（掀开）盆。（《促织》）丨臣少多疾病，九岁不行，零丁孤苦,至于成立。（《陈情表》）

