遂Sui4
【名词】❶田间水沟。
【例句】广二尺，深二尺，谓之遂。（《周礼•考工记•匠人》）
❷水中的通道。
【例句】迷者不问路,溺者不问遂。（《荀子•大略》）
【动词】❶进展顺利;成功。
【例句】何往而不遂？（《淮南子•精神训》）丨功遂身退，天之道。（《老子》九章）丨吾闻先生事魏不遂，事楚而去。（《汉书•张陈王周传》）
❷称心;如意。
【例句】世乱遭飘荡,生还偶然遂。（《羌村三首》）丨言既遂矣，至于暴矣。（《诗经•卫风•氓》）
❸前进;前往。
【例句】羝羊触藩，不能退,不能遂，无攸利。（《周易，大壮卦》）
❹举荐;提升。
【例句】显忠遂良。（《尚书•仲虺之诰》）
❺顺利地成长。
【例句】六畜遂，五谷殖。（《韩非子•难二》）
❻养育。
【例句】早缫而绪，早织而缕，字而幼孩，遂而鸡豚。（《种树斐橐驼传》）

【副词】❶于是;就。
【例句】臣请遂道王者诸侯强弱存亡之效，安危之势。（《荀子•议兵》）丨如不能守以终丧,则遂取以来。（《祭十二郎文》）丨荆轲知太子不忍，乃遂私见樊於期。（《荆轲刺秦王》）丨山东豪俊遂并起而亡秦族矣。（《过秦论》）丨阉竖恐终为其患，遂共谗之。（《张衡传》）
❷终;竟。
【例句】遂使之行成于吴。（《勾践灭吴》）丨太守即遣人随其往，寻向所志，遂迷，不复得路。（《桃花源记》）丨曹操比于袁绍，则名微而众寡。然操遂能克绍，以弱为强者，非惟天时,抑亦人谋也。（《隆中对》）
