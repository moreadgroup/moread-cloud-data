---
words:
  - word: 遂
    type: 【名词】
    phonetic: Sui4
    tags:
      - 高中
    samples:
      - trans: ❶田间水沟。
        sentences:
          - ancient: 广二尺，深二尺，谓之遂。（《周礼•考工记•匠人》）
      - trans: ❷水中的通道。
        sentences:
          - ancient: 迷者不问路,溺者不问遂。（《荀子•大略》）

  - word: 遂
    type: 【动词】
    phonetic: Sui4
    tags:
      - 高中
    samples:
      - trans: ❶进展顺利;成功。
        sentences:
          - ancient: 何往而不遂？（《淮南子•精神训》）
          - ancient: 功遂身退，天之道。（《老子》九章）
          - ancient: 吾闻先生事魏不遂，事楚而去。（《汉书•张陈王周传》）
      - trans: ❷称心;如意。
        sentences:
          - ancient: 世乱遭飘荡,生还偶然遂。（《羌村三首》）
          - ancient: 言既遂矣，至于暴矣。（《诗经•卫风•氓》）
      - trans: ❸前进;前往。
        sentences:
          - ancient: 羝羊触藩，不能退,不能遂，无攸利。（《周易，大壮卦》）
      - trans: ❹举荐;提升。
        sentences:
          - ancient: 显忠遂良。（《尚书•仲虺之诰》）
      - trans: ❺顺利地成长。
        sentences:
          - ancient: 六畜遂，五谷殖。（《韩非子•难二》）
      - trans: ❻养育。
        sentences:
          - ancient: 早缫而绪，早织而缕，字而幼孩，遂而鸡豚。（《种树斐橐驼传》）

  - word: 遂
    type: 【副词】
    phonetic: Sui4
    tags:
      - 高中
    samples:
      - trans: ❶于是;就。
        sentences:
          - ancient: 臣请遂道王者诸侯强弱存亡之效，安危之势。（《荀子•议兵》）
          - ancient: 如不能守以终丧,则遂取以来。（《祭十二郎文》）
          - ancient: 荆轲知太子不忍，乃遂私见樊於期。（《荆轲刺秦王》）
          - ancient: 山东豪俊遂并起而亡秦族矣。（《过秦论》）
          - ancient: 阉竖恐终为其患，遂共谗之。（《张衡传》）
      - trans: ❷终;竟。
        sentences:
          - ancient: 遂使之行成于吴。（《勾践灭吴》）
          - ancient: 太守即遣人随其往，寻向所志，遂迷，不复得路。（《桃花源记》）
          - ancient: 曹操比于袁绍，则名微而众寡。然操遂能克绍，以弱为强者，非惟天时,抑亦人谋也。（《隆中对》）
