幸xing4
【动词】❶宠爱。
【例句】今入关，财物无所取，妇女无所幸，此其志不在小。（《鸿门宴》）丨—肌一容，尽态极妍，缦立远视，而望幸焉。（《阿房宫赋》）丨夫赵强而燕弱，而君幸于赵王，故燕王欲结于君。（《廉颇蔺相如列传》）
❷皇帝亲临某地。
【例句】帝初幸甘泉。（《史记•孝文本纪》）丨吾君方幸玄珠阁,与太阳道士讲《火经》,少选（一会儿）当毕。（《柳毅传》）
【高考题例】建初五年,憙疾病，帝亲幸视。（《后汉书•赵憙传》）丨陛下今幸江都，是臣衣锦之地，臣荷（受）恩深重，不敢专为身谋。（《北史•来护儿传》）
❸庆幸。
【例句】长男••••••独自欢幸。（《史记•越王勾践世家》）
❹希望。
【例句】（窦）婴乃使昆弟子上书言之，幸得召见。（《汉书•灌夫传》）丨不堪吏人妇，岂合令郎君？幸可广问讯,不得便相许。（《孔雀东南飞》）丨阙然久不报，幸勿为过。（《报任安书》）丨冀幸君之一悟，俗之一改也。（《史记•屈原贾生列传》）
【高考题例】芳华幸勿谢,嘉树欲相依。（南朝梁•刘孝绰《咏;素蝶诗》）

【形容词】❶侥幸，偶然有所得益或意外免去灾患。
【例句】君不如肉袒伏斧质请罪,则幸得脱矣。（《廉颇蔺相如列传》）丨愿陛下矜悯愚诚，听臣微志，庶刘侥幸,保卒余年。（《陈情表》）
❷幸运。
【例句】则吾斯役之不幸，未若复吾赋不幸之甚也。（《捕蛇者说》）丨知幸与不幸，则其读书也必专。（《黄生借书说》）丨今仆不幸，早失父母，无兄弟之亲，独身孤立，少卿视仆于妻子何如哉？（《报任安书》）丨呜呼！予之生也幸,而幸生也何为？（《〈指南录〉后序》）

【副词】❶侥幸;幸亏。
【例句】贼二人得我，我幸皆杀之矣。（《童区寄传》）丨其伤于缚者，即幸留（存活），病数月乃瘳（chou1,病愈），或竟成痼疾。（《狱中糸记》）丨儿已薄禄相，幸复得此妇。（《孔雀东南飞》）丨适为虞人逐，其来甚速，幸先生生（使活下来）我。（《中山狼传》）丨今事有急，故幸来告良。（《鸿门宴》）
❷表示敬意，即对方这样做使自己感到幸运。
【例句】臣从其计，大王亦幸赦臣。（《廉颇蔺相如列传》）	
