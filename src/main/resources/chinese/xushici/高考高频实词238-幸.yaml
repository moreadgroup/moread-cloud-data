---
words:
  - word: 幸
    type: 【动词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶宠爱。
        sentences:
          - ancient: 今入关，财物无所取，妇女无所幸，此其志不在小。（《鸿门宴》）
          - ancient: —肌一容，尽态极妍，缦立远视，而望幸焉。（《阿房宫赋》）
          - ancient: 夫赵强而燕弱，而君幸于赵王，故燕王欲结于君。（《廉颇蔺相如列传》）
      - trans: ❷皇帝亲临某地。
        sentences:
          - ancient: 帝初幸甘泉。（《史记•孝文本纪》）
          - ancient: 吾君方幸玄珠阁,与太阳道士讲《火经》,少选（一会儿）当毕。（《柳毅传》）
          - ancient: 【高考题例】建初五年,憙疾病，帝亲幸视。（《后汉书•赵憙传》）
          - ancient: 陛下今幸江都，是臣衣锦之地，臣荷（受）恩深重，不敢专为身谋。（《北史•来护儿传》）
      - trans: ❸庆幸。
        sentences:
          - ancient: 长男••••••独自欢幸。（《史记•越王勾践世家》）
      - trans: ❹希望。
        sentences:
          - ancient: （窦）婴乃使昆弟子上书言之，幸得召见。（《汉书•灌夫传》）
          - ancient: 不堪吏人妇，岂合令郎君？幸可广问讯,不得便相许。（《孔雀东南飞》）
          - ancient: 阙然久不报，幸勿为过。（《报任安书》）
          - ancient: 冀幸君之一悟，俗之一改也。（《史记•屈原贾生列传》）
          - ancient: 【高考题例】芳华幸勿谢,嘉树欲相依。（南朝梁•刘孝绰《咏;素蝶诗》）

  - word: 幸
    type: 【形容词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶侥幸，偶然有所得益或意外免去灾患。
        sentences:
          - ancient: 君不如肉袒伏斧质请罪,则幸得脱矣。（《廉颇蔺相如列传》）
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥幸,保卒余年。（《陈情表》）
      - trans: ❷幸运。
        sentences:
          - ancient: 则吾斯役之不幸，未若复吾赋不幸之甚也。（《捕蛇者说》）
          - ancient: 知幸与不幸，则其读书也必专。（《黄生借书说》）
          - ancient: 今仆不幸，早失父母，无兄弟之亲，独身孤立，少卿视仆于妻子何如哉？（《报任安书》）
          - ancient: 呜呼！予之生也幸,而幸生也何为？（《〈指南录〉后序》）

  - word: 幸
    type: 【副词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶侥幸;幸亏。
        sentences:
          - ancient: 贼二人得我，我幸皆杀之矣。（《童区寄传》）
          - ancient: 其伤于缚者，即幸留（存活），病数月乃瘳（chou1,病愈），或竟成痼疾。（《狱中糸记》）
          - ancient: 儿已薄禄相，幸复得此妇。（《孔雀东南飞》）
          - ancient: 适为虞人逐，其来甚速，幸先生生（使活下来）我。（《中山狼传》）
          - ancient: 今事有急，故幸来告良。（《鸿门宴》）
      - trans: ❷表示敬意，即对方这样做使自己感到幸运。
        sentences:
          - ancient: 臣从其计，大王亦幸赦臣。（《廉颇蔺相如列传》）	
