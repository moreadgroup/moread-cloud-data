---
words:
  - word: 暮
    type: 【名词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: 日落的时候;傍晚（与""朝"相对）。
        sentences:
          - ancient: 旦辞爷娘去,暮宿黄河边。（《木兰诗》）
          - ancient: 暮投石壕村,有吏夜捉人。（《石壕吏》）


  - word: 暮
    type: 【形容词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: 晩;时间将尽。
        sentences:
          - ancient: 烈士暮年，壮心不已。（汉•曹操《龟虽寿》）
          - ancient: 暮春三月，江南草长。（《与陈伯之书》）

