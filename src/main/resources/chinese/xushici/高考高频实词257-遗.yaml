遗㊀yi2
【名词】❶遗失的东西。
【例句】风俗之美，男女自不取于涂（途），而百姓羞拾遗。（《荀子•正论》）
【高考题例】行之十年，秦民大说，道不拾遗，山无盗贼,家给人足。（《史记•商君列传》）
❷遗漏的事物。
【例句】臣愿为中郎，出入禁阙（ta4,门），补过拾遗。（《史记•汲黯列传》）

【动词】❶遗失;丢失。
【例句】秦无亡矢遗镞（zu2,箭头，也指箭）之费，而天下诸侯已困矣。（《过秦论》）丨羊子尝行路,得遗金一饼。（《后汉书•列女传》）
❷遗漏;忽略。
【例句】句读（读dou4,古人指文辞休止和停顿处）之不知,惑之不解,或师焉，或不（通"否"）焉，小学而大遗，吾未见其明也。（《师说》）,
❸遗留，特指死去的人留下的。
【例句】诚宜开张（扩大）圣听，以光先帝遗德，恢弘志士之气。（《出师》）丨孝公既没，惠文、武、昭襄蒙故业，因遗策。（《过秦论》）丨知不可乎骤得，托遗响于悲风。（《赤壁赋》）丨瞻顾遗迹，如在昨日，令人长号不自禁。（《项脊轩志》）丨此三者，吾遗恨也。（《伶官传序》）
❹排泄（大小便）。
【例句】廉将军虽老，尚善饭；然与臣坐，顷之三遗矢（通""屎"，粪便）矣。（《史记•廉颇蔺相如列传》）
❺抛弃。
【例句】今天不遗斯民，始旱而赐之以雨。（宋•苏轼《喜雨亭记》）丨飘飘乎如遗世独立，羽化而登仙。（《赤壁赋》）
❻剩下。
【例句】生民百遗一。（汉•曹操《蒿里行》）
遗㊁wei4
.【动词】❶赠送;给予。
【例句】侍中、侍郎郭攸之、费祎、董允等，此皆良实,志虑忠纯,是以先帝简拔（选拔）以遗陛下。（《出师表》）丨既至匈奴，置币遗单于（《苏武传》）丨人贱物亦鄙,不足迎后人,留待作遗施,于今无会因。（《孔雀东南飞》）
❷送。
【例句】强国之民，父遗其子，兄遗其弟，妻遗其夫，皆曰："不得（杀敌立功），无返。"（《商君书•画策》）丨使人遗赵王书，愿以十五城请易（换取）璧。（《廉颇蔺相如列传》）丨公子姊为赵惠文王弟平原君夫人，数遗魏王及公子书，请救于魏。（《史记•魏公子列传》）

【高考题例】邓奉反于南阳,憙素与奉善,数遗书切责之，而谗者因（趁机）言憙与奉合谋，帝以为疑。（《后汉书•赵憙传》）

