---
words:
  - word: 伐
    type: 【名词】
    phonetic: fa2
    tags:
      - 高中
    samples:
      - trans: 功业。
        sentences:
          - ancient: 公子诚一开口请如姬，如姬必许诺，则得虎符夺晋鄙军，北救赵而西却秦，此五霸之<伐>也。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 公子果真一开口请求如姬帮忙,如姬必定答应,那么就能得到虎符而夺了晋鄙的军权,北边可救赵国,西边能抵御秦国,这是像春秋五霸那样的功业啊.
          - ancient: "怀王者，吾家项梁所立耳，非有功<伐>,何以得主约!（《史记•高祖本纪》）"
            url: xxxx
            vernacular: 怀王这个人，我家项梁所立，没有什么功劳，凭什么主持约定
          - ancient: 自矜功<伐>，奋其私智而不师古。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 自己夸耀功劳，独逞个人的私欲，而不效法古人
          - ancient: 北救赵而西却秦，此五霸之<伐>也。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 北边可救赵国,西边能抵御秦国,这是像春秋五霸那样的功业啊.
  - word: 伐
    type: 【动词】
    phonetic: fa2
    tags:
      - 高中
    samples:
      - trans: ❶砍伐。
        sentences:
          - ancient: 卖炭翁，<伐>薪烧炭南山中。（唐•白居易《卖炭翁》）
            url: xxxx
            vernacular: 有位卖炭的老翁，整年在南山里砍柴烧炭。
          - ancient: "斯亦<伐>根以求木茂,塞源而欲流长者也。（《谏太宗十思疏》）"
            url: xxxx
            vernacular: 这就像砍伐树木的根却要求树木茂盛，阻塞水的源头却希望水流得长远一样啊！
      - trans: ❷讨伐;进攻。
        sentences:
          - ancient: 十年春，齐师<伐>我。（《曹刿论战》）
            url: xxxx
            vernacular: 鲁庄公十年的春天，齐国军队攻打鲁国。
          - ancient: "将军身被坚执锐，<伐>无道,诛暴秦，复立楚国之社稷，功宜为王。（《陈涉世家》）"
            url: xxxx
            vernacular: 将军亲自穿着铁甲,手里拿锐利的武器,讨伐昏庸无道的暴君,诛灭凶残暴虐的秦王,重建楚国,论功劳应当称王。
          - ancient: 其后秦<伐>赵，拔石城。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 此后秦国攻打赵国，夺取了石城。
      - trans: ❸自夸;炫耀。
        sentences:
          - ancient: 自<伐>者无功；功成者堕，名成者亏。。（《庄子•山木》）
            url: xxxx
            vernacular: 自吹自擂的人不会成就功业；功业成就了而不知退隐的人必定会毁败，名声彰显而不知韬光隐晦的必定会遭到损伤。
          - ancient: "每一令出，平（屈原,名平）<伐>其功，曰以为\"非我莫能为\"也。（《史记•,屈原贾生列传》）"
            url: xxxx
            vernacular: 每出一道法令，屈原就炫耀自己的功劳，说：‘除了我，没有人能制定法令了’。
          - ancient: 假令韩信学道谦让，不<伐>己功，不矜其能，则庶几哉。（《史记•淮阴侯列传》）
            url: xxxx
            vernacular: 假如韩信懂得谦卑谦下，不自我炫耀功劳，不骄傲自己的能力，差不多可平安无事，保其余生。
