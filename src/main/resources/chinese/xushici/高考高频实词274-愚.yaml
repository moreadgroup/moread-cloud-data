愚yu2
【动词】欺骗;愚弄。
【例句】于是废先王之道，焚百家之言，以愚黔首。（《过秦论》）

【形容词】愚昧;愚笨。
【例句】是故圣益圣，愚益愚。（《师说》）丨人君无愚智贤不肖，莫不欲求忠以自为，举贤以自佐。（《史记•屈原贾生列传》）丨故余虽愚,卒获有所闻。（《送东阳马生序》）

【代词】代词用作自称的谦辞。我。
【例句】愚以为宫中之事，事无大小，悉（全）以咨之，然后施行,必能裨补阙漏，有所广益。（《出席表》）丨愚谓大计不如迎之。（《资治通鉴•汉纪五十七》）
