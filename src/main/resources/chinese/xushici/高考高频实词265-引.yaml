引yin3
【名词】❶乐曲体裁名，也是乐府诗体的一种。如李贺有《李凭箜篌》等。
【例句】故聆曲引者,观法于节奏。（汉•马融《长笛赋》）
❷文体名，即序。
【例句】敢竭鄙怀，恭疏短引，一言均赋，四韵俱成。（《滕王阁序》）

【动词】❶拉弓。
【例句】齐宣王好射，说（通""悦"）人之谓己能用强弓也。其尝所用不过三石，以示左右，左右皆试引之，中关而止。（《吕氏春秋•壅塞》）丨林暗草惊风,将军夜引弓。（唐•卢纶《和张仆射塞下曲》）❷牵;拉;拽。
【例句】左右或欲引相如去。（《廉颇蔺相如列传》）丨已而相如出，望见廉颇，相如引车避匿。（《廉颇蔺相如列传》）
❸引导;带领。
【例句】秦王斋五曰后,乃设九宾礼于廷，引赵使者蔺相如。（《廉颇蔺相如列传》）丨又有清流激湍，映带（围绕）左右，引以为流觞曲水（让酒杯漂在环形清流中，飘到谁面前谁就取来饮酒），列坐其次。（《兰亭集序》）丨武夫揭（分开）水指路，引毅以进。（《柳毅传》）丨（曹）操引军从年容道步走。（《资治通鉴•汉纪五十七》）丨沛公引兵西，遇彭越昌邑，因与俱攻秦军，战不利。（《史记•高祖本纪》）丨夜半时，胡兵亦以为汉有伏军于旁欲夜取之，胡皆引兵而去。（《史记・李将军列传》）
❹避开;退避。
【例句】语竟，引别东去。不数十步，回望女与羊，俱亡所见矣。（《柳毅传》）丨时（曹）操军众已有疾疫，初一交战，操军不利，引次江北。（《资治通鉴•汉纪五十七》）
❺引用。
【例句】子游引前言以距（通"拒",拒绝）孔子。（《论衡•问孔》）丨乃引"天亡我，非用兵之罪也"，岂不谬哉！（《史记•项羽本纪》）
❻举;拿。
【例句】引壶觞以自酌，眄（mian3,斜视）庭柯（树枝）以怡颜。（《归去来兮辞＞）丨妻乃引刀趋机而言曰……（《后汉书•列女传》）丨荆轲废，乃引其匕首提秦王，不中，中柱。（《荆轲刺秦王》）
❼召请;邀请。
【例句】公子引侯生坐上坐，遍赞宾客，宾客皆惊。（《史记•魏公子列传》）
❽伸长。
【例句】如有不嗜杀人者，则天下之民皆引领（脖子）而望之矣。（《孟子见梁襄王》）
❾招引；招来。
【例句】李怒……每得降卒,必亲引问委曲（事情的原委或底细），由是贼中险易远近虚实尽知之。丨《资治通鉴•唐纪五十六》）丨后迁侍中，帝引在帷幄，讽议左右。（《张衡传》）
❿延长;连续。
【例句】每至晴初霜旦，林寒涧肃，常有高猿长啸，属（zhu3,连续）引凄异，空谷传响，哀转久绝。（《三峡》）
11失去。
【例句】是谓乱军引胜。（《孙子兵法•谋攻》）
12引进;荐举。
【例句】奖引后进，如恐不及。（《宋史•欧阳修传》）
13向上起。
【例句】未至身，秦王惊，自引而起,绝袖。（《荆轲刺秦王》）
14揭发;检举。
【例句】虞常果引张胜。（《苏武传》）
15退隐;隐藏。
【例句】身直为闺阁之臣，宁得自引深藏于岩穴邪？（《报任安书》）
16自杀。
【例句】予分当引决，然而隐忍以行。（《〈指南录〉后序》）丨至于鞭箠之间，乃欲引节,斯不亦远乎！（《报任安书》）

