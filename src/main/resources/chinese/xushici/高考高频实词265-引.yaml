---
words:
  - word: 引
    type: 【名词】
    phonetic: yin3
    tags:
      - 高中
    samples:
      - trans: ❶乐曲体裁名，也是乐府诗体的一种。如李贺有《李凭箜篌》等。
        sentences:
          - ancient: 故聆曲引者,观法于节奏。（汉•马融《长笛赋》）
      - trans: ❷文体名，即序。
        sentences:
          - ancient: 敢竭鄙怀，恭疏短引，一言均赋，四韵俱成。（《滕王阁序》）

  - word: 引
    type: 【动词】
    phonetic: yin3
    tags:
      - 高中
    samples:
      - trans: ❶拉弓。
        sentences:
          - ancient: 齐宣王好射，说（通""悦"）人之谓己能用强弓也。其尝所用不过三石，以示左右，左右皆试引之，中关而止。（《吕氏春秋•壅塞》）
          - ancient: 林暗草惊风,将军夜引弓。（唐•卢纶《和张仆射塞下曲》）
      - trans: ❷牵;拉;拽。
        sentences:
          - ancient: 左右或欲引相如去。（《廉颇蔺相如列传》）
          - ancient: 已而相如出，望见廉颇，相如引车避匿。（《廉颇蔺相如列传》）
      - trans: ❸引导;带领。
        sentences:
          - ancient: 秦王斋五曰后,乃设九宾礼于廷，引赵使者蔺相如。（《廉颇蔺相如列传》）
          - ancient: 又有清流激湍，映带（围绕）左右，引以为流觞曲水（让酒杯漂在环形清流中，飘到谁面前谁就取来饮酒），列坐其次。（《兰亭集序》）
          - ancient: 武夫揭（分开）水指路，引毅以进。（《柳毅传》）
          - ancient: （曹）操引军从年容道步走。（《资治通鉴•汉纪五十七》）
          - ancient: 沛公引兵西，遇彭越昌邑，因与俱攻秦军，战不利。（《史记•高祖本纪》）
          - ancient: 夜半时，胡兵亦以为汉有伏军于旁欲夜取之，胡皆引兵而去。（《史记・李将军列传》）
      - trans: ❹避开;退避。
        sentences:
          - ancient: 语竟，引别东去。不数十步，回望女与羊，俱亡所见矣。（《柳毅传》）
          - ancient: 时（曹）操军众已有疾疫，初一交战，操军不利，引次江北。（《资治通鉴•汉纪五十七》）
      - trans: ❺引用。
        sentences:
          - ancient: 子游引前言以距（通"拒",拒绝）孔子。（《论衡•问孔》）
          - ancient: 乃引"天亡我，非用兵之罪也"，岂不谬哉！（《史记•项羽本纪》）
      - trans: ❻举;拿。
        sentences:
          - ancient: 引壶觞以自酌，眄（mian3,斜视）庭柯（树枝）以怡颜。（《归去来兮辞＞）
          - ancient: 妻乃引刀趋机而言曰……（《后汉书•列女传》）
          - ancient: 荆轲废，乃引其匕首提秦王，不中，中柱。（《荆轲刺秦王》）
      - trans: ❼召请;邀请。
        sentences:
          - ancient: 公子引侯生坐上坐，遍赞宾客，宾客皆惊。（《史记•魏公子列传》）
      - trans: ❽伸长。
        sentences:
          - ancient: 如有不嗜杀人者，则天下之民皆引领（脖子）而望之矣。（《孟子见梁襄王》）
      - trans: ❾招引；招来。
        sentences:
          - ancient: 李怒……每得降卒,必亲引问委曲（事情的原委或底细），由是贼中险易远近虚实尽知之。
          - ancient: 《资治通鉴•唐纪五十六》）
          - ancient: 后迁侍中，帝引在帷幄，讽议左右。（《张衡传》）
      - trans: ❿延长;连续。
        sentences:
          - ancient: 每至晴初霜旦，林寒涧肃，常有高猿长啸，属（zhu3,连续）引凄异，空谷传响，哀转久绝。（《三峡》）
      - trans: 11失去。
        sentences:
          - ancient: 是谓乱军引胜。（《孙子兵法•谋攻》）
      - trans: 12引进;荐举。
        sentences:
          - ancient: 奖引后进，如恐不及。（《宋史•欧阳修传》）
      - trans: 13向上起。
        sentences:
          - ancient: 未至身，秦王惊，自引而起,绝袖。（《荆轲刺秦王》）
      - trans: 14揭发;检举。
        sentences:
          - ancient: 虞常果引张胜。（《苏武传》）
      - trans: 15退隐;隐藏。
        sentences:
          - ancient: 身直为闺阁之臣，宁得自引深藏于岩穴邪？（《报任安书》）
      - trans: 16自杀。
        sentences:
          - ancient: 予分当引决，然而隐忍以行。（《〈指南录〉后序》）
          - ancient: 至于鞭箠之间，乃欲引节,斯不亦远乎！（《报任安书》）

