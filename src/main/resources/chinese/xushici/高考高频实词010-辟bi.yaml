---
words:
- word: 辟
  type: 【名词】
  phonetic: bi4
  tags:
  - 高中
  samples:
  - trans: ❶法。
    sentences:
    - ancient: 举罪定名，国有常<辟>。（《魏书•刑罚志》）
      url: xxxx
      vernacular: 常辟：固定的法规。
  - trans: ❷君主。
    sentences:
    - ancient: 惟<辟>作福，惟<辟>作威，惟<辟>玉食。（《尚书•洪范》）
      url: xxxx
      vernacular: 只有天子才会为民造福，只有天子才能给民惩戒，只有天子才能享用美食。
    - ancient: 故政事乱，则冢宰之罪也；国家失俗，则<辟>公之过也。（《荀子•王制》）
      url: xxxx
      vernacular: 所以政事混乱，就是宰相的罪过；国家风俗败坏，就是诸侯的过错。
  - trans: ❸罪过。
    sentences:
    - ancient: 土不备垦，<辟>在司寇。（《国语•周语上》）
      url: xxxx
      vernacular: 田地不全部翻遍,将由司寇治罪。
- word: 辟
  type: 【动词】
  phonetic: bi4
  tags:
  - 高中
  samples:
  - trans: ❶征召；招聘。
    sentences:
    - ancient: 永元中，举孝廉不行，连<辟>公府不就。（《张衡传》）
      url: xxxx
      vernacular: 永元年间，他被推举为孝廉，却不应荐，屡次被公府征召，都没有就任。
    - ancient: 昔王子师为豫州，未下车（指官吏初到任）即<辟>荀慈明。（唐•李白《与韩荆州书》）
      url: xxxx
      vernacular: 从前王允当豫州刺史，上任途中就征召荀爽为从事。
  - trans: ❷通"避"。避免;躲避。
    sentences:
    - ancient: 所恶者有甚于死者，故患有所不<辟>也。（《鱼我所欲也》）
      url: xxxx
      vernacular: 厌恶的有比死亡更厉害的东西，所以有的灾祸我不躲避。
    - ancient: 三年丧毕，禹辞<辟>舜之子商均于阳城。（《史记•夏本纪》）
      url: xxxx
      vernacular: 服丧三年完毕，禹为了把帝位让给舜的儿子商均，躲避到阳城。
    - ancient: 师襄子<辟>席再拜，曰："师盖云《文王操》也。"（《史记•孔子世家》）
      url: xxxx
      vernacular: 师襄子离开坐席连行两次拜礼，说：”我所教的正是《文王操》啊。“
    - ancient: 淮阴侯挈其手，<辟>左右与之步于庭。（《史记•淮阴侯列传》）
      url: xxxx
      vernacular: 淮阴侯拉着他的手避开左右侍从在庭院里漫步。
  - trans: ❸通"璧"。腿瘸。
    sentences:
    - ancient: 王梁、造父者，天下之善驭者也，不能以<辟>马毁舆致远。（《荀子•正论》）
      url: xxxx
      vernacular: 王良、造父，是天下善驾车的人，但不能依靠瘸马和坏车到达远方。
- word: 辟
  type: 【动词】
  phonetic: pi4
  tags:
  - 高中
  samples:
  - trans: ❶开;打开。
    sentences:
    - ancient: 语毕而宫门<辟>。（《柳毅传》）
      url: xxxx
      vernacular: 才说完话，宫门大开。
    - ancient: 巫从旁望空代祝，唇吻翕（xi，合）<辟>，不知何词。（《促织》）
      url: xxxx
      vernacular: 巫婆在旁边望着空中替他们祷告，嘴唇一张一合，不知在说些什么。
  - trans: ❷开辟;开设。
    sentences:
    - ancient: 欲<辟>土地，朝秦楚，莅（li统治）中国而抚四夷也。（《齐桓晋文之事》）
      url: xxxx
      vernacular: 是想开拓疆土，使秦国、楚国来朝见，统治整个中原地区，安抚四方的少数民族。
    - ancient: 予本非文人画士，甘受诟厉，<辟>病梅之馆以贮之。（《病梅馆记》）
      url: xxxx
      vernacular: 我本来不是文人画士，心甘情愿受到辱骂，开设一个病梅馆来贮存它们。 
    - ancient: 前<辟>四窗，垣墙周庭，以当南日，日影反照，室始洞然。（《项脊轩志》）
      url: xxxx
      vernacular: 向前开了四扇窗子，用矮墙在庭院周围环绕，用来挡住南面射来的日光，日光反射照耀，室内才明亮起来。
    - ancient: 【高考题例】<辟>公舍以待来诉者，士无留难。（《宋史•许将传》）
      url: xxxx
      vernacular: 设公堂接待前来上诉的人，士人没有无理阻止，故意刁难。
    - ancient: 田畴垦<辟>，有加于旧。（《宋书•谢弘微传》）
      url: xxxx
      vernacular: 田地的开垦种植,比原来更有增加。
  - trans: ❸排除;驳斥。
    sentences:
    - ancient: 禹有功，抑下鴻，<辟>除民害逐共工。（《荀子•成相》）
      url: xxxx
      vernacular: xxxx
    - ancient: <辟>邪说，难壬人（佞人，巧言谄媚的人），不为拒谏。（宋•王安石《答苛耳谏议书》）
      url: xxxx
      vernacular: 抨击不正确的言论,驳斥巧辩的坏人,(这)不能算是拒绝接受(他人的)规劝。
  - trans: ❹治罪;诛杀。
    sentences:
    - ancient: 我之弗<辟>，我无以告我先王。（《尚书•金滕》）
      url: xxxx
      vernacular: 如不避居东都则无以面对先王
  - trans: ❺通"譬"。比喻。
    sentences:
    - ancient: <辟>也者举他物而以明之也。（《墨子•小取》）
      url: xxxx
      vernacular: 辟，是举别的事物来说明这一事物。
