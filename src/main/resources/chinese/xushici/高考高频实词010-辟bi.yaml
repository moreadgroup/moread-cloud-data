  - trans: ❶幽僻;偏僻。
    sentences:
    - ancient: 扈江离与<辟>芷兮，纫秋兰以为佩。（《离骚》）
      url: https://zhuanlan.zhihu.com/p/464311492
      vernacular: 我把江离芷草披在肩上，把秋兰结成索佩挂身旁。白芷，香草名，也叫“辟芷”
  - trans: ❷通"僻"。不正;邪僻。
    sentences:
    - ancient: 故君子居必择乡，游必就士，所以防邪<辟>而近中正也。（《荀子•劝学》）
      url: xxxx
      vernacular: 所以君子居住要选择好的环境，出游必定要接近有学问品行的人，才能够防微杜渐保其中庸正直。
    - ancient: 苟无恒心，放<辟>邪侈，无不为已。（《齐桓晋文之事》）
      url: xxxx
      vernacular: 如果没有稳定不变的思想，就会胡作非为，坏事没有不干的了。
  - trans: ❸通"僻"。偏斜。
    sentences:
    - ancient: 行三里，<辟>矛戟，结幡旗。（汉•曹操《军令》）
      url: xxxx
      vernacular: xxxx
