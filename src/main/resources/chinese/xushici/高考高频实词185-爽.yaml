爽shuang3
【名词】差错。
【例句】女也不爽，士贰（不专一）其行。（《诗经•卫风•氓》）丨少间，帘内掷一纸出，即道人意中事，无毫发爽。（《促织》）

【动词】违背;违犯。
【例句】为朝廷爽法？（《新唐书•蒋乂传》）

【形容词】❶明朗;清爽。
【例句】爽籁发而清风生，纤歌凝而白云遏。（《滕王阁序》）丨酌贪泉而觉爽，处涸辙以犹欢。（《滕王阁序》）
❷直爽;豪放。
【例句】少有逸才，风姿英爽，气盖一时。（《晋书•王济传》）

