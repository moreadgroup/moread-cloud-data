      - trans: ❷非正式的;暂时代理的。
        sentences:
          - ancient: 乃相与共立羽为<假>上将军。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 于是大家一起立项羽为代理上将军。
          - ancient: 武与副中郎将张胜及<假>吏常惠等募士斥候百余人俱。（《苏武传》）
            url: xxxx
            vernacular: 苏武同副中郎将张胜以及临时委派的使臣属官常惠等，加上招募来的士卒、侦察人员百多人一同前往。
  - word: 假
    type: 【连词】
    phonetic: jia3
