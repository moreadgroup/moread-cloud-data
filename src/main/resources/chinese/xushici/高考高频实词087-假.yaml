      - trans: 假如;如果。
        sentences:
          - ancient: <假>令仆伏法受诛，若九牛亡一毛，与蝼蚁何以异?（《报任安书》）
            url: xxxx
            vernacular: 假如我伏法被杀，那好像是九牛的身上失掉一根毛，同蝼蚁又有什么区别？
