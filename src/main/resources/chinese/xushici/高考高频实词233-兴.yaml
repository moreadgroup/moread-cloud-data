---
words:
  - word: 兴
    type: 【动词】
    phonetic: xing1
    tags:
      - 高中
    samples:
      - trans: ❶起来。
        sentences:
          - ancient: 从者病，莫能<兴>。（《史记•孔子世家》）
            url: xxxx
            vernacular: 随从的弟子疲惫不堪，饿得站不起来。
          - ancient: 夙<兴>夜寐，靡有朝矣。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 起早睡迟，朝朝如此，不能计算了。
          - ancient: 泰山崩于前而色不变，麋鹿<兴>于左而目不瞬（眨眼）。（宋•苏洵《心术》）
            url: xxxx
            vernacular: 泰山在眼前崩塌而面不改色，麋鹿在身边奔突而不眨眼睛
      - trans: ❷兴起。
        sentences:
          - ancient: 积土成山，风雨<兴>焉。（《劝学》）
            url: xxxx
            vernacular: 堆积土石成了高山，风雨从这里兴起
          - ancient: 每览昔人<兴>感之由，若合一契。（《兰亭集序》）
            url: xxxx
            vernacular: 每当我看到前人兴怀感慨的原因，与我所感叹的好像符契一样相合
          - ancient: 政通人和，百废具<兴>。（《岳阳楼记》）
            url: xxxx
            vernacular: 政事顺利，百姓和乐，各种荒废的事业都兴办起来了。
          - ancient: 【高考题例】贾生谏，以为患之<兴>自此起矣。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 贾谊谏阻，认为这样做祸患就会由此产生。
      - trans: ❸发动。
        sentences:
          - ancient: 怀王怒，大<兴>师伐秦。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 怀王发怒，大规模出动军队去讨伐秦国。
          - ancient: 燕王诚振怖大王之威，不敢<兴>兵以拒大王。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 燕王确实非常害怕大王您的威风，不敢出兵来抗拒
          - ancient: "【高考题例】陛下<兴>军旅,百姓易咨怨。（《北史•来护儿传》）"
            url: xxxx
            vernacular: 陛下兴起战事，易于引起百姓叹息怨恨。
      - trans: ❹使兴盛。
        sentences:
          - ancient: 忧劳可以<兴>国，逸豫（安闲享乐）可以亡身，自然之理也。（《伶官传序》）
            url: xxxx
            vernacular: 忧虑辛劳会使国家兴盛，安闲享乐会使自身灭亡，这是自然的道理。
  - word: 兴
    type: 【形容词】
    phonetic: xing1
    tags:
      - 高中
    samples:
      - trans: 兴盛;复兴。
        sentences:
          - ancient: 夜篝火，狐鸣呼曰："大楚<兴>，陈胜王。"（《陈涉世家》）
            url: xxxx
            vernacular: 陈胜又暗地里派吴广到驻地旁边丛林里的神庙中，在夜间提着灯笼，作狐狸嗥叫的凄厉的声音大喊：“大楚将兴，陈胜为王。”
          - ancient: 考之行事，综其终始，稽其成败<兴>坏之理。（《报任安书》）
            url: xxxx
            vernacular: 粗略地考订其事实，综述其事实的本末，推究其成败盛衰的道理
          - ancient: 中<兴>机会，庶几（或许）在此。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 复兴宋朝的机会，大概就在此一举了。
  - word: 兴
    type: 【名词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: ❶兴致。
        sentences:
          - ancient: "<兴>尽悲来,识盈虚（盈满和亏损）之有数。（《滕王阁序》）"
            url: xxxx
            vernacular: 欢乐逝去，悲哀袭来，我知道了事物的兴衰成败是有定数的。
          - ancient: 遥襟甫畅，逸<兴>遄飞（chuan2fei）。（《滕王阁序》）
            url: xxxx
            vernacular: 胸襟刚感到舒畅，超逸的兴致立即兴起
      - trans: ❷诗歌的一种表现手法，"六义（风、雅、颂、赋、比、兴）"之一。
        sentences:
          - ancient: <兴>者，先言他物以引起所咏之词也。（宋•朱熹《诗集传》）
            url: xxxx
            vernacular: 借助其他事物为所咏之内容作铺垫。
  - word: 兴
    type: 【动词】
    phonetic: xing4
    tags:
      - 高中
    samples:
      - trans: 喜欢;感兴趣。
        sentences:
          - ancient: 不<兴>其艺，不能乐学。（《礼记•学记》）
            url: xxxx
            vernacular: 如果不喜欢这种技艺，就不能心情愉悦地去学习它。说明只有具有兴趣，才能主动去学习。
