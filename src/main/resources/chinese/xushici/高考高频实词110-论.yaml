---
words:
  - word: 论
    type: 【动词】
    phonetic: lun2
    tags:
      - 高中
    samples:
      - trans: 编撰。
        sentences:
          - ancient:退而论书策，以舒其愤，思垂空文以自见。（《报任安书》）

  - word: 论
    type: 【名词】
    phonetic: lun4
    tags:
      - 高中
    samples:
      - trans: 学说;观点。
        sentences:
          - ancient: 夫持帝王之论，说霸者之主，虽精见距。（《论衡・逢遇》）

  - word: 论
    type: 【动词】
    phonetic: lun4
    tags:
      - 高中
    samples:
      - trans: ❶讨论;议论。
        sentences:
          - ancient: 每与臣论此事，未尝不叹息痛恨于桓、灵也。（《出师表》）
          - ancient: 肃宣（孙）权旨，论天下事势，致殷勤之意。（《资治通鉴•汉纪五十七》）
          - ancient: 千载琵琶作胡语，分明怨恨曲中论。（唐•杜甫《咏怀古迹•其三》）
          - ancient: 生人作死别，恨恨那可论?（《孔雀东南飞》）
      - trans: ❷评定赏罚;判决。
        sentences:
          - ancient: 宜付有司论其刑赏。（《出师表》）
          - ancient: 二世二年七月,具（李）斯五刑，论腰斩咸阳市。（《史记•李斯列传》）
          - ancient: 武益愈（痊愈），单于使使晓（告知）武，会论虞常，欲因（趁）此时降武。（《苏武传》）,
          - ancient: 【高考题例】将论囚，敞日："冤也。"（《宋史•刘敞传》）
      - trans: ❸说。
        sentences:
          - ancient: 问今是何世，乃不知有汉，无论魏晋。（《桃花源记》）
