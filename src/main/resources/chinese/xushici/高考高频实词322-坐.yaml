---
words:
  - word: 坐
    type: 【名词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: 同"座"。座位。
        sentences:
          - ancient: 请以剑舞，因击沛公于坐,杀之。（《鸿门宴》）
          - ancient: 【高考题例】经略使韩缜语之日："君奇士也，他日当据吾坐。（《宋史•何灌传》）

  - word: 坐
    type: 【动词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: ❶坐。古人席地而坐，两膝着地,臀部压在脚后跟上;也指臀部着物而坐。
        sentences:
          - ancient: 项王、项伯东向坐。（《鸿门宴》）
          - ancient: 坐潭上，四面竹树环合。（《小石潭记》）
      - trans: ❷犯……罪。
        sentences:
          - ancient: 王曰："何坐？"曰："坐盗。"（《晏子使楚》）
          - ancient: 【高考题例】诏降一级致仕，瑾恨未已，坐以遗失部籍,逮文下诏狱。（《明史•韩文传》）
      - trans: ❸株连受罚。
        sentences:
          - ancient: 副有罪，当相坐。（《苏武传》）
          - ancient: 【高考题例】时平原多盗贼，憙与诸郡讨捕，斩其渠帅,余党当坐者数千人。（《后汉书•赵憙传》）
      - trans: ❹诉讼时在法官面前对质。
        sentences:
          - ancient: 晋人使与郝大夫坐。（《左传•昭公二十三年》）
      - trans: ❺驻守。
        sentences:
          - ancient: 楚人坐其北门。（《左传•桓公十二年》）
      - trans: ❻比喻放弃行动，不做努力。
        sentences:
          - ancient: 与其坐而待亡，孰若起而拯之？（《冯婉贞》）

  - word: 坐
    type: 【副词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: 即将。
        sentences:
          - ancient: 寒英坐销落,何用慰远客？（唐•柳宗元《早梅》）

  - word: 坐
    type: 【介词】
    phonetic: zuo4
    tags:
      - 高中
    samples:
      - trans: ❶因为……犯法；因为……受牵连。
        sentences:
          - ancient: 会李竟坐与诸侯王交通，辞语及霍氏，有诏（霍）云、（霍）山不宜宿卫，免就第。（《汉书•霍光传》）
          - ancient: （诸葛）诞麾下数百人,坐不降见斩。（《三国志•魏书•诸葛诞传》）
      - trans: ❷由于；因为。
        sentences:
          - ancient: 耕者忘其犁,锄者忘其锄。来归相怨怒，但坐观罗敷。（《陌上桑》）
          - ancient: 停车坐爱枫林晚，霜叶红于二月花。（《山行》）
          - ancient: 【高考题例】爽懦惑不能用，遂委身受戮,芝坐爽下狱，当死，而口不讼直，志不苟免，宣帝嘉之，赦而不诛。（《晋书•鲁芝传》）



