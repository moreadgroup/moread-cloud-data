      - trans: ❶早晨。
        sentences:
          - ancient: 受命以来，<夙>夜忧叹。（《出师表》）
            url: xxxx
            vernacular: 接受遗命以来，我日夜忧虑叹息
          - ancient: "策蹇驴（跛驴），囊图书，<夙>行失道，望尘惊悸。（《中山狼传》）"
            url: xxxx
            vernacular: 赶着跛脚驴，袋子装着图书，清晨赶路迷了路，望见扬起的尘埃非常害怕。
          - ancient: "三岁为妇，靡室劳矣。<夙>兴夜寐，靡有朝矣。（《诗经•卫风•氓》）"
            url: xxxx
            vernacular: 婚后多年守妇道，繁重家务劳动没有不干的。起早睡迟，朝朝如此，不能计算了。
          - ancient: "【高考题例】此儿深中<夙>敏，方成佳器（良材），有子如此，足矣。 （《宋书•谢弘微传》）"
            url: xxxx
            vernacular: 这个孩子深沉早慧，将成为才行出众之人，有这样的儿子，满足了。
      - trans: ❷早先;过去。
        sentences:
          - ancient: 臣以险衅（艰难祸患），<夙>遭闵凶（丧亲之忧）。（《陈情表》）
            url: xxxx
            vernacular: 我因命运不好，很早就遭遇到了不幸
          - ancient: 而刘<夙>婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）
            url: xxxx
            vernacular: 但祖母刘氏又早被疾病缠绕，常年卧床不起，我侍奉她吃饭喝药，从来就没有离开她。
