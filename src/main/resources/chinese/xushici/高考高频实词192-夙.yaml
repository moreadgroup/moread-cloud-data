夙su4
【名词】❶早晨。
【例句】受命以来，夙夜忧叹。（《出师表》）丨策蹇驴（跛驴）,囊图书，夙行失道，望尘惊悸。（《中山狼传》）丨三岁为妇,靡室劳矣。夙兴夜寐，靡有朝矣。（《诗经•卫风•氓》）
【高考题例】此儿深中夙敏，方成佳器（良材），有子如此,足矣。
（《宋书•谢弘微传》）
❷早先;过去。
【例句】臣以险衅（艰难祸患），夙遭闵凶（丧亲之忧）。（《陈情表》）丨而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）