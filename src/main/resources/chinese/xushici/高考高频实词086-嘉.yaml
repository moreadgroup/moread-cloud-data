words:
  - word: 嘉
    type: 【动词】
    phonetic: jia1
    tags:
      - 高中
    samples:
      - trans: 赞许;嘉奖。
        sentences:
          - ancient: 余嘉其能行古道，作《师说》以贻（yi2，赠送）之。（《师说》）
          - ancient: 上大嘉悦，诏赐抚臣名马衣缎。（《促织》）
          - ancient: 武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者。（《苏武传》）
          - ancient: 【高考题例】宣帝嘉之，赦而不诛，俄而起为并州刺史。（《晋书•鲁芝传》）

  - word: 嘉
    type: 【形容词】
    phonetic: jia1
    tags:
      - 高中
    samples:
      - trans: 美好。
        sentences:
          - ancient: 我有嘉宾，鼓瑟吹笙。（《诗经•小雅•鹿鸣》）
          - ancient: 嘉木异石错（交错）置，皆山水之奇者，以予故，咸以愚辱焉。（唐•柳宗元《愚溪诗序》）
          - ancient: 皇览揆余于初度兮，肇锡余以嘉名。（《离骚》）