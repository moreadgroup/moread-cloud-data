      - trans: ❶仔细考察、研究。
        sentences:
          - ancient: 故审堂下之阴，而知日月之行，阴阳之变。（《吕氏春秋•察今》）
      - trans: ❷审讯;审问。
        sentences:
          - ancient: 余经秋审皆减等发配。（《狱中杂记》）

  - word: 审
    type: 【形容词】
    phonetic: shen3
    tags:
      - 高中
    samples:
      - trans: ❶周密;详细。
        sentences:
          - ancient: 审问而明辨之也。（清•刘开《问说》）
          - ancient: 审视，巨身修（长）尾，青项金翅。（《促织》）
      - trans: ❷慎重。
        sentences:
          - ancient: 故曰："兵者，凶器也。"不可不审用也。（《韩非子•存韩》）
      - trans: ❸清楚;明白。
        sentences:
          - ancient: 由此言之，勇怯，势也；强弱，形也。审矣,何足怪乎？（《报任安书》）
          - ancient: 当局称迷，傍观见审。（《旧唐书•元行冲传》）

