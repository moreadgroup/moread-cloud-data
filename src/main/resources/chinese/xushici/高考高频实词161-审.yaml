审shen3
【动词】❶仔细考察、研究。
【例句】故审堂下之阴，而知日月之行，阴阳之变。（《吕氏春秋•察今》）
❷审讯;审问。
【例句】余经秋审皆减等发配。（《狱中杂记》）

【形容词】❶周密;详细。
【例句】审问而明辨之也。（清•刘开《问说》）丨审视，巨身修（长）尾，青项金翅。（《促织》）
❷慎重。
【例句】故曰："兵者，凶器也。"不可不审用也。（《韩非子•存韩》）
❸清楚;明白。
【例句】由此言之，勇怯，势也；强弱，形也。审矣,何足怪乎？（《报任安书》）丨当局称迷，傍观见审。（《旧唐书•元行冲传》）

【副词】的确;确实。