---
words:
  - word: 路
    type: 【名词】
    phonetic: lu4
    tags:
      - 高中
    samples:
      - trans: ❶道路。
        sentences:
          - ancient: 缘溪行，忘路之远近。（《桃花源记》）
          - ancient: 无为在歧路，儿女共沾巾。（唐•王勃《送杜少府之任蜀州》）
          - ancient: 回朕车以复路兮，及行迷之未远。（《离骚》）
          - ancient: 问征夫以前路，恨晨光之熹微。（《归去来兮辞》）
      - trans: ❷途径；门路。
        sentences:
          - ancient: 以塞忠谏之路也。（《出师表》）
          - ancient: 无路请缨，等终军之弱冠;有怀投笔，慕宗悫之长风。（《滕王阁序》）
          - ancient: 【高考题例】胸中磊落藏五兵，欲试无路空峥嵘（宋•陆游《题醉中所作草书卷后》）
      - trans: ❸职位;政权。
        sentences:
          - ancient: 夫子当路于齐。（《孟子•公孙丑上》）
          - ancient: 当涂（道路）者升青云，失<路>者委沟渠。（汉•扬雄《解嘲》）
      - trans: ❹通"辂"。车。
        sentences:
          - ancient: 杜洩（人名）将以路葬。（《左传•昭公四年》）
          - ancient: 彼路斯何？君子之车。（《诗经•小雅•采薇》）
          - ancient: 筚路（驾着柴车）蓝缕，以启山林。（《左传•宣公十二年）），
      - trans: ❺行政区划名。宋时相当于现在的省;元时降为二等政区，隶属于省，与府相当。
        sentences:
          - ancient: 予除（拜官授职）右丞相兼枢密使，都督诸路军马。（《〈指南录〉后序》）
          - ancient: 四十三年，望中犹记，烽火扬州路。（《永遇乐•京口北固亭怀古》）
          - ancient: 【高考题例】甫半岁，得善田二万六千顷，募士七千四百人，为他路最。（《宋史•何灌传》）
          - ancient: 东西异路，不当与，然安忍于旧治坐视？（《宋史•萧燧传》）
          - ancient: 浩招辑流亡，开营田，以其规置颁示诸路。（《宋史•郭浩传》）
  - word: 路
    type: 【形容词】
    phonetic: lu4
    tags:
      - 高中
    samples:
      - trans: 疲乏;羸弱。
        sentences:
          - ancient: 且一人之身而百工之所为备，如必自为而后用之，是率天下而路也。（《孟子•滕文公上》）