---
words:
  - word: 微
    type: 【名词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 细小的事物。
        sentences:
          - ancient: 夫祸患常积于忽微，而智勇多困于所溺（所沉迷的人或事物），岂独伶人也哉？（《伶官传序＞）""

  - word: 微
    type: 【动词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 隐蔽;隐藏。
        sentences:
          - ancient: 白公奔山而缢（吊死），其徒微之。（《左传•哀公十六年》）丨衡常思图身,之事，以为吉凶倚伏，幽微难明，乃作《思玄赋》以宣寄情志。（《张衡传》）

  - word: 微
    type: 【形容词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶小；细；少。
        sentences:
          - ancient: 曹操比于袁绍，则名微而众寡，曹操遂能克（战胜）绍，以弱为强者，非惟天时,抑亦人谋也。（《隆中"对》）丨君能除之，固当窥（通"跬"，即半步）左足以效微力。（《中山狼传》）
      - trans: ❷（身份、地位）卑贱;低下。
        sentences:
          - ancient: 今臣亡国贱俘，至微至陋（鄙陋），过蒙拔擢（提拔），宠命优渥（恩宠优厚）o（《陈情表》）丨勃（王勃自称）三尺微命,一介书生。（《滕王阁序》）
      - trans: ❸精妙;微妙。
        sentences:
          - ancient: 其文约，其辞微,其志洁，其行廉。（《史记•屈原贾生列传》）
      - trans: ❹衰败;衰弱。
        sentences:
          - ancient: 周室卑微，诸侯相兼。（《史记•李斯列传》）

  - word: 微
    type: 【副词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶暗地;悄悄地。
        sentences:
          - ancient: 公子引车入市，侯生下见其客朱亥，俾倪，故久立与其客语，微察公子。（《史记•魏公子列传》）丨李牧不受命,赵使人微捕得李牧,斩之。（《史记•廉颇蔺相如列传》）
      - trans: ❷略微;稍微。
        sentences:
          - ancient: 见其发矢十中八九，但微颔之。（《卖油翁》）丨东坡现右足，鲁直现左足，各微侧，其两膝相比（紧靠）者，各隐卷底衣褶中。（《核舟记》）
      - trans: ❸不;非。
        sentences:
          - ancient: 微与之期，践墨随敌，以决战事。（《孙子兵法•九地》）丨微独赵，诸侯有在者乎？（《触龙说赵太后》）丨虽读《礼》《传》，微爱属文（写文章）。（《颜氏家训•序致》）丨向（先前）也使予委骨于草莽，予虽浩然无所愧作，然微以百文于君亲，君亲其谓予何？（《〈指南录〉后序》）丨微太子言,臣愿得谒之。（《荆轲刺秦王》）

  - word: 微
    type: 【连词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 假使不是;假使没有。
        sentences:
          - ancient: 不可。微夫人之力不及此。（《烛之武退秦师》）丨微二子者，楚不国矣。（《左传•哀公十六年》）丨微夫子之发吾覆也，吾不知天地之大全也。（《庄子.田子方》）

