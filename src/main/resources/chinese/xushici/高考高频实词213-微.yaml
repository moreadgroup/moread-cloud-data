---
words:
  - word: 微
    type: 【名词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 细小的事物。
        sentences:
          - ancient: 夫祸患常积于忽<微>，而智勇多困于所溺（所沉迷的人或事物），岂独伶人也哉？（《伶官传序＞）""
            url: xxxx
            vernacular: 祸患常常是由微小的事情积累而成的，聪明勇敢的人反而常被所溺爱的人或事困扰，难道只有宠爱伶人才会这样吗？
  - word: 微
    type: 【动词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 隐蔽;隐藏。
        sentences:
          - ancient: 白公奔山而缢（吊死），其徒<微>之。（《左传•哀公十六年》）
            url: xxxx
            vernacular: 白公胜逃到山上然后吊死了，他的部下把他的尸体藏了起来。
          - ancient: "衡常思图身,之事，以为吉凶倚伏，幽<微>难明，乃作《思玄赋》以宣寄情志。（《张衡传》）"
            url: xxxx
            vernacular: 我常常思虑图谋全身之事，以为吉凶变幻无定，隐微难以明知，于是作《思玄赋》，以宣示寄托情志。
  - word: 微
    type: 【形容词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶小；细；少。
        sentences:
          - ancient: "曹操比于袁绍，则名<微>而众寡，曹操遂能克（战胜）绍，以弱为强者，非惟天时,抑亦人谋也。（《隆中对》）"
            url: xxxx
            vernacular: 曹操与袁绍相比，声望少之又少，然而曹操最终之所以能打败袁绍，凭借弱小的力量战胜强大的原因，不仅依靠的是天时好，而且也是人的谋划得当。
          - ancient: 君能除之，固当窥（通"跬"，即半步）左足以效<微>力。（《中山狼传》）
            url: xxxx
            vernacular: 您能除掉他，我本来应当献出微薄之力。
      - trans: ❷（身份、地位）卑贱;低下。
        sentences:
          - ancient: 今臣亡国贱俘，至<微>至陋（鄙陋），过蒙拔擢（提拔），宠命优渥（恩宠优厚）（《陈情表》）
            url: xxxx
            vernacular: 现在我是一个低贱的亡国俘虏，十分卑微浅陋，受到过分提拔，恩宠优厚
          - ancient: "勃（王勃自称）三尺<微>命,一介书生。（《滕王阁序》）"
            url: xxxx
            vernacular: 我地位卑微，只是一介书生。
      - trans: ❸精妙;微妙。
        sentences:
          - ancient: "其文约，其辞<微>,其志洁，其行廉。（《史记•屈原贾生列传》）"
            url: xxxx
            vernacular: 文辞简约，描写生动，志向高洁，品行清廉。
      - trans: ❹衰败;衰弱。
        sentences:
          - ancient: 周室卑<微>，诸侯相兼。（《史记•李斯列传》）
            url: xxxx
            vernacular: 自从秦孝公以来，周朝卑弱衰微，诸侯之间互相兼并
  - word: 微
    type: 【副词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: ❶暗地;悄悄地。
        sentences:
          - ancient: 公子引车入市，侯生下见其客朱亥，俾倪，故久立与其客语，<微>察公子。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 公子就驱车进入肉市。侯生下了车，会见他的朋友朱亥，斜着眼睛傲视着，故意久久地站着跟他的朋友谈话，（一面）暗暗地观察公子
          - ancient: "李牧不受命,赵使人<微>捕得李牧,斩之。（《史记•廉颇蔺相如列传》）"
            url: xxxx
            vernacular: 李牧不接受命令，赵王派人暗中乘其不备逮捕了李牧，把他杀了。
      - trans: ❷略微;稍微。
        sentences:
          - ancient: 见其发矢十中八九，但<微>颔之。（《卖油翁》）
            url: xxxx
            vernacular: 卖油的老头看他射十箭中了八九箭，但只是微微点点头。
          - ancient: 东坡现右足，鲁直现左足，各<微>侧，其两膝相比（紧靠）者，各隐卷底衣褶中。（《核舟记》）
            url: xxxx
            vernacular: 苏东坡露出右脚，鲁直露出左脚，身子都略微侧斜，他们互相靠近的两膝，都被遮蔽在手卷下边的衣褶里。
      - trans: ❸不;非。
        sentences:
          - ancient: 先其所爱，<微>与之期。践墨随敌，以决战事。（《孙子兵法•九地》）
            url: xxxx
            vernacular: 首先要夺取敌人最关紧要的地方，而不要同敌人约期交战。实施计划要随着敌情的变化而不断加以改变，以求战争的胜利。
          - ancient: <微>独赵，诸侯有在者乎？（《触龙说赵太后》）
            url: xxxx
            vernacular: 不仅是赵国，其他诸侯国君的被封侯的子孙的后继人有还在的吗？
          - ancient: 虽读《礼》《传》，<微>爱属文（写文章）。（《颜氏家训•序致》）
            url: xxxx
            vernacular: xxxx
          - ancient: 向（先前）也使予委骨于草莽，予虽浩然无所愧作，然<微>以百文于君亲，君亲其谓予何？（《〈指南录〉后序》）
            url: xxxx
            vernacular: 以前，假使我把尸骨抛在荒野里，我虽然正大光明问心无愧，但在君王和父母前无法文饰自己的过错，国君和父母又将会怎么讲我呢？
          - ancient: "<微>太子言,臣愿得谒之。（《荆轲刺秦王》）"
            url: xxxx
            vernacular: 即使太子不说，我也要请求行动。
  - word: 微
    type: 【连词】
    phonetic: wei1
    tags:
      - 高中
    samples:
      - trans: 假使不是;假使没有。
        sentences:
          - ancient: 不可。<微>夫人之力不及此。（《烛之武退秦师》）
            url: xxxx
            vernacular: 不行。假如没有那个人的力量，我是不会到这个地步的。
          - ancient: <微>二子者，楚不国矣。（《左传•哀公十六年》）
            url: xxxx
            vernacular: 如果没有子西、子期他们两位，楚国早就不成国家了
          - ancient: <微>夫子之发吾覆也，吾不知天地之大全也。（《庄子.田子方》）
            url: xxxx
            vernacular: 没有先生揭开我之蒙蔽，我就不知道天地大全之理啊！
