---
words:
  - word: 废
    type: 【动词】
    phonetic: fei4
    tags:
      - 高中
    samples:
      - trans: ❶倒塌。
        sentences:
          - ancient: 往古之时,四极废，九州裂。（《淮南子•览冥训》）
      - trans: ❷停止;废弃。如成语"半途而废"。
        sentences:
          - ancient: 君子不以言举人，不以人废言。（《论语•卫灵公》）
          - ancient: 而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）
          - ancient: 杞国有人忧天地崩坠，身亡所寄，废寝食者。（《杞人忧天》）
          - ancient: 【高考题例】援不至，遂没焉,时车驾驻大名，闻之震悼,废朝二日，赠侍中。（《宋史•康保裔传》）
      - trans: ❸荒废;废弃。
        sentences:
          - ancient: 何可废也？以羊易（代替）之。（《齐桓晋文之事》）
          - ancient: 越明年（到了第二年），政通人和，百废具兴。（《岳阳楼》）
          - ancient: 予在患难中，间以诗记所遭，今存其本不忍废。（《〈指南录〉后序》）
          - ancient: 于是废先王之道，焚百家之言，以愚黔首。（《过秦论》）
      - trans: ❹废黜；罢免。
        sentences:
          - ancient: 老贼欲废汉自立久矣，徒忌二袁、吕布、刘表与孤耳。（《资治通鉴•汉纪五十七》）
      - trans: ❺残废。
        sentences:
          - ancient: 荆轲废，乃引（举起）匕首提（di3,投，抛）秦王,不中,中柱。（《战国策•燕策三》）