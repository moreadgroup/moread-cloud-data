---
words:
  - word: 爱【名词】
    phonetic: ai4
    tags:
      - 高中
    samples:
      - trans: 恩惠。
        sentences:
          - ancient: 【例句】及子产卒，仲尼闻之，出涕曰："古之遗爱也。"（《左传•昭公二十年》）
            url: https://hanyu.baidu.com/shici/detail?pid=9b04e453a49f4d55bcb635eef97a2132
            vernacular: 等到子产逝世，孔子听说了，哭泣道：“（他）是古代圣贤继承人啊。(【子产继承了】古人仁爱的遗风啊)”
  - word: 爱【动词】
    phonetic: ai4
    tags:
      - 高中
    samples:
      - trans: ❶喜爱;爱护。
        sentences:
          - ancient: 【例句】吴广素爱人，士卒多为用者。（《陈涉世家》）
            url: https://baike.baidu.com/item/%E9%99%88%E6%B6%89%E4%B8%96%E5%AE%B6/730692
            vernacular: 吴广向来爱护士兵，士兵大多愿意听他差遣
          - ancient:  丨爱其子,择师而教之。（《师说》）
            url: https://baike.baidu.com/item/%E5%B8%88%E8%AF%B4/75226
            vernacular: 人们爱他们的孩子，就选择老师来教他
          - ancient: 丨少无适俗韵，性本爱丘山。（《归园田居》）
            url: https://baike.baidu.com/item/%E5%BD%92%E5%9B%AD%E7%94%B0%E5%B1%85/387
            vernacular: 少小时就没有随俗气韵，自己的天性是热爱自然。
      - trans: ❷爱好。
        sentences:
          - ancient: 【例句】秦爱纷奢,人亦念其家。（《阿房宫赋》）
            url: https://baike.baidu.com/item/%E9%98%BF%E6%88%BF%E5%AE%AB%E8%B5%8B/2196073
            vernacular: 秦人喜欢奢侈，六国人也眷念故家。
          - ancient:  丨晋陶渊明独爱菊。（《爱莲说》）
            url: https://baike.baidu.com/item/%E7%88%B1%E8%8E%B2%E8%AF%B4/2196218
            vernacular: 晋朝陶渊明只喜爱菊花。
      - trans: ❸爱惜。
        sentences:
          - ancient: 【例句】向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。（《六国论》）
            url: https://baike.baidu.com/item/%E5%85%AD%E5%9B%BD%E8%AE%BA/203
            vernacular: 假使当初韩、魏、楚三国都各自珍惜自己的土地，齐国不依附秦国，燕国的刺客不去秦国，赵国的良将李牧还活着，那么胜败存亡的命运，如果与秦国较量，也许还不容易估量呢。
          - ancient:  丨国事至此,予不得爱身；意北亦尚可以口舌动也。（《〈指南录〉后序》）
            url: https://baike.baidu.com/item/%E6%8C%87%E5%8D%97%E5%BD%95%E5%90%8E%E5%BA%8F
            vernacular: 国事到了这种地步，我不能顾惜自己了；估计元方也许可以用言辞打动。
      - trans: ❹吝惜。
        sentences:
          - ancient: 【例句】百姓皆以王为爱也，臣固知王之不忍也。（《齐桓晋文之事》)
            url: https://baike.baidu.com/item/%E9%BD%90%E6%A1%93%E6%99%8B%E6%96%87%E4%B9%8B%E4%BA%8B
            vernacular: 百姓都认为大王是爱惜（一头牛）。（但是）诚然我知道您是出于于心不忍（的缘故）。
          - ancient:  丨诸侯恐惧，会盟而谋弱秦,不爱珍器重宝肥饶之地,以致天下之士，合从缔交，相与为一。（《过秦论》）
            url: https://baike.baidu.com/item/%E8%BF%87%E7%A7%A6%E8%AE%BA
            vernacular: 诸侯恐慌害怕，集会结盟，商议削弱秦国，不吝惜奇珍贵重的器物和肥沃富饶的土地，用来招纳天下的优秀人才，采用合纵的策略缔结盟约，互相援助，成为一体。
      - trans: ❺爱慕;欣赏。
        sentences:
          - ancient:  【例句】予独爱莲之出淤泥而不染。（《爱莲说》）
            url: https://baike.baidu.com/item/%E7%88%B1%E8%8E%B2%E8%AF%B4/2196218
            vernacular: 我唯独喜爱莲花，它从淤泥中长出来，却不沾染污秽
      - trans: ❻隐藏;躲藏。
        sentences:
          - ancient:  【例句】爱而不见，搔首踟蹰（《邶风•静女》）
            url: https://baike.baidu.com/item/%E9%82%B6%E9%A3%8E%C2%B7%E9%9D%99%E5%A5%B3
            vernacular: 故意躲藏让我找，急得抓耳又挠腮。
  - word: 爱【形容词】
    phonetic: ai4          
    tags:
      - 高中
    samples: 
      - trans: 吝啬。
        sentences:
          - ancient: 【高考题例】幸而亟来，终日与吾子言，不敢倦,不敢爱，不敢肆。（《答严厚舆秀才论为师道书》）
            url: https://baike.baidu.com/item/%E7%AD%94%E4%B8%A5%E5%8E%9A%E8%88%86%E7%A7%80%E6%89%8D%E8%AE%BA%E4%B8%BA%E5%B8%88%E9%81%93%E4%B9%A6/23560131
            vernacular: 我如果有幸，能让您来到我这里，我将整天和您讨论问题，不敢懈怠，不敢吝啬，不敢放肆。
 
          
             
