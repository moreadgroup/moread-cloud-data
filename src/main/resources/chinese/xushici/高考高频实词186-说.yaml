说㊀shuo1
【名词】❶说法;主张。
【例句】劳苦而功高如此,未有封侯之赏，而听细说（小人的谗言），欲诛有功之人，此亡秦之续耳。（《鸿门宴））丨是说也，人常疑之。（《石钟山记》）
❷文体的一种。
【例句】为一说，使与书俱。（《黄生借书说》）丨余嘉其能行古道，作《师说》以贻之。（《师说》）

【动词】❶解释;说明。
【例句】余不敢以麋鹿自封也，欲遍布之，恐不可户说，辄以是疏先焉。（明•徐光启《甘薯疏序》）
❷陈述;诉说。
【例句】低眉信手续续弹，说尽心中无限事。（《琵琶行》）丨便纵有千种风情，更与何人说？（《雨霖铃》）丨直说太守家，有此令郎君，既欲结大义，故遣来贵门。（《孔雀东南飞》）

说㊁shui4
【动词】劝说;说服。
【例句】范增说项羽曰："……急击勿失！"（《鸿门宴》）丨（鲁）肃请得奉命吊（刘）表二子，并慰劳其军中用事者,及说备使抚表众。（《资治通鉴•汉纪五十七》）丨单于闻陵与子卿素厚，故使陵来说足下，虚心欲相待。（《苏武传》）

说㊂tuo1
【动词】通"脱"。解脱。
【例句】士之耽兮，犹可说也。女之耽兮，不可说也！（《诗经•卫风•氓》）
说@yue4
【形容词】通"悦"。高兴。
【例句】学而时习之，不亦说乎？（《论语•学而》）丨公输盘不说。（《公输》）丨秦伯说，与郑人盟。（《烛之武退秦师》）丨诚能得樊将军首,与燕督亢之地图献秦王，秦王必说见臣,臣乃得有以报太子。（《荆轲刺秦王》）

【高考题例】行之十年，秦民大说，道不拾遗，山无盗贼,家给人
足。（《史记.商君列传》）

