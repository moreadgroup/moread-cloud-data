---
words:
  - word: 说
    type: 【名词】
    phonetic: shuo1
    tags:
      - 高中
    samples:
      - trans: ❶说法;主张。
        sentences:
          - ancient: 劳苦而功高如此,未有封侯之赏，而听细说（小人的谗言），欲诛有功之人，此亡秦之续耳。（《鸿门宴））
          - ancient: 是说也，人常疑之。（《石钟山记》）
      - trans: ❷文体的一种。
        sentences:
          - ancient: 为一<说>，使与书俱。（《黄生借书说》）
          - ancient: 余嘉其能行古道，作《师<说>》以贻之。（《师说》）

  - word: 说
    type: 【动词】
    phonetic: shuo1
    tags:
      - 高中
    samples:
      - trans: ❶解释;说明。
        sentences:
          - ancient: 余不敢以麋鹿自封也，欲遍布之，恐不可户说，辄以是疏先焉。（明•徐光启《甘薯疏序》）
      - trans: ❷陈述;诉说。
        sentences:
          - ancient: 低眉信手续续弹，说尽心中无限事。（《琵琶行》）
          - ancient: 便纵有千种风情，更与何人说？（《雨霖铃》）
          - ancient: 直说太守家，有此令郎君，既欲结大义，故遣来贵门。（《孔雀东南飞》）

  - word: 说
    type: 【动词】
    phonetic: shui4
    tags:
      - 高中
    samples:
      - trans: 劝说;说服。
        sentences:
          - ancient: 范增说项羽曰："……急击勿失！"（《鸿门宴》）
          - ancient: （鲁）肃请得奉命吊（刘）表二子，并慰劳其军中用事者,及说备使抚表众。（《资治通鉴•汉纪五十七》）
          - ancient: 单于闻陵与子卿素厚，故使陵来说足下，虚心欲相待。（《苏武传》）

  - word: 说
    type: 【动词】
    phonetic: tuo1
    tags:
      - 高中
    samples:
      - trans: 通"脱"。解脱。
        sentences:
          - ancient: 士之耽兮，犹可<说>也。女之耽兮，不可<说>也！（《诗经•卫风•氓》）
  - word: 说
    type: 【形容词】
    phonetic: yue4
    tags:
      - 高中
    samples:
      - trans: 通"悦"。高兴。
        sentences:
          - ancient: 学而时习之，不亦说乎？（《论语•学而》）
          - ancient: 公输盘不说。（《公输》）
          - ancient: 秦伯说，与郑人盟。（《烛之武退秦师》）
          - ancient: 诚能得樊将军首,与燕督亢之地图献秦王，秦王必说见臣,臣乃得有以报太子。（《荆轲刺秦王》）
          - ancient: 【高考题例】行之十年，秦民大说，道不拾遗，山无盗贼,家给人足。（《史记.商君列传》）

