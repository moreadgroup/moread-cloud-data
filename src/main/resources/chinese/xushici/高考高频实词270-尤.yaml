尤 you2
【名词】过失;罪过。
【例句】废（习惯）为残贼，莫知其尤。（《诗经•小雅•四月》）丨言寡尤，行寡悔,禄在其中矣。（《论语•为政》）丨进不入以离尤兮，退将复修吾初服。（《离骚》）

【动词】指责;归咎。
【例句】不怨天，不尤人。（《论语•宪问》）丨吾实为之，其又何尤！（《祭十二郎文》）

【形容词】优异;突出。
【例句】夫子，物之尤也。（《庄子•徐无鬼》）丨天，有形之大者也;人，动物之尤者也。（唐•刘禹锡《天论》）

【副词】更加;特别。
【例句】爱是溪，入二三里，得其尤绝者家（建造住宅）焉。
（唐•柳宗元《愚溪诗序》）丨然是说也，余尤疑之。（《石钟山记》）丨衡善机巧，尤致思于天文阴阳历算。（《张衡传》）丨况臣孤苦，特为尤甚。（《陈情表》）
