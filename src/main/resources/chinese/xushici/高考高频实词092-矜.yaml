---
words:
  - word: 矜
    type: 【动词】
    phonetic: jin1
    tags:
      - 高中
    samples:
      - trans: ❶损耗。
        sentences:
          - ancient: "愁其五脏以为仁义，<矜>其血气以规法度。（《庄子・在宥》）"
            url: xxxx
            vernacular: 满心焦虑地推行仁义，并耗费心血来制定法度。
      - trans: ❷挥动。
        sentences:
          - ancient: "艴然充盈、手足<矜>者，兵革之色也。（《吕氏春秋•重言》）"
            url: xxxx
            vernacular: 怒气冲冲、手足挥动，这是要用兵打仗的神色。
      - trans: ❸怜悯；同情。
        sentences:
          - ancient: 伏惟圣朝以孝治天下，凡在故老，犹蒙<矜>育况臣孤苦，特为尤甚。（《陈情表》）
            url: xxxx
            vernacular: 我想晋朝是用孝道来治理天下的，凡是年老而德高的旧臣，尚且还受到怜悯养育，况且我孤单凄苦，程度更为严重呢。
          - ancient: 愿陛下<矜>悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）
            url: xxxx
            vernacular: 希望陛下能怜悯我愚昧诚心，满足我微不足道的心愿，使祖母刘氏能够侥幸保全她的余生。
          - ancient: "【高考题例】皆令门下覆视，有据法当死而情可<矜>者，录状以闻。（《通鉴经事本末•贞观君臣论治》）"
            url: xxxx
            vernacular: （这些规定）都由门下省督查，有依据法律应当处死而情理上有值得同情的，记下情况上报朝廷。
      - trans: ❹顾惜。
        sentences:
          - ancient: 不<矜>细行，终累大德。（《尚书•旅葵》）
            url: xxxx
            vernacular: 不顾惜小节方面的修养，到头来会伤害大节，酿成终生的遗憾。
      - trans: ❺自夸；自得。
        sentences:
          - ancient: 且臣少仕伪朝，历职郎署，本图宦达，不<矜>名节。（《陈情表》）
            url: xxxx
            vernacular: 况且我年轻的时候曾经做过蜀汉的官，担任过郎官职务，本来希图宦达，不顾惜名声节操。
          - ancient: 陈康肃公善射，当世无双，公亦以此自<矜>。（《卖油翁》）。
            url: xxxx
            vernacular: 康肃公陈尧咨擅于射箭，世上没有第二个人能跟他相媲美，他也就凭着这种本领而自夸。
          - ancient: 【高考题例】宰相李揆<矜>能忌贤，以休烈修国史与己斉列，嫉之。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 宰相李揆嫉贤妒能，认为休烈凭着编写史书的功劳地位和自己不相上下，痛恨他
  - word: 矜
    type: 【形容词】
    phonetic: jin1
    tags:
      - 高中
    samples:
      - trans: ❶庄重;慎重。
        sentences:
          - ancient: 君子<矜>而不争，群而不党（结成团伙）。（《论语•卫灵公》）
            url: xxxx
            vernacular: 君子庄重又谨慎，而不与别人争执，虽然合群而不结党营私。
      - trans: ❷得意的;骄傲的。
        sentences:
          - ancient: 未尝敢以<矜>气作之，惧其偃蹇而骄也。（《答韦中立论师道书》）
            url: xxxx
            vernacular: 从来不敢用骄傲的心理去写作，恐怕文章盛气凌人而又狂妄。
