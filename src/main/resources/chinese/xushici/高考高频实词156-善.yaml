---
words:
  - word: 善
    type: 【名词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: 好事;好的行为。
        sentences:
          - ancient: 积善成德，而神明自得，圣心备焉。（《劝学》）
          - ancient: 刑过不避大臣，赏善不遗匹夫。（《韩非子•有度》）
          - ancient: 简能而任之，择善而从之。（《谏太宗十思疏》）
  - word: 善
    type: 【动词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: ❶赞许。
        sentences:
          - ancient: 昔者管子有言，丘（孔子自称）甚善之。（《庄子•至乐》）
          - ancient: 亦余心之所善兮，宝九死其犹未悔。（《离骚》）
          - ancient: 善万物之得时，感吾生之行休。（《归去来兮辞》）
      - trans: ❷喜好。
        sentences:
          - ancient: 王如善之，则何为不行？（《孟子•梁惠王下》）
      - trans: ❸擅长;善于。
        sentences:
          - ancient: 衡少善属文，游于三辅，因入京师。（《张衡传》）
          - ancient: 衡善机巧，尤致思于天文阴阳历算。（《张衡传》）
          - ancient: 安帝雅闻衡善术学，公车特征拜郎中，再迁为太史令。（《张衡传》）
          - ancient: 陈康肃公善射，当世无双，公亦以此自矜。（《卖油翁》）
          - ancient: 京中有善口技者。（《口技》）
          - ancient: 【高考题例】少聪敏好学，善属文。（《旧唐书•李揆传》）
      - trans: ❹擦拭；整治。
        sentences:
          - ancient: 善刀而藏之。（《庄子•养生主》）
      - trans: ❺爱惜。
        sentences:
          - ancient: 善日者王，善时者霸。（《荀子•强国》）
      - trans: ❻与……交好。
        sentences:
          - ancient: 楚左尹项伯者，项羽季父也，素善留侯张良。（《鸿门宴》）
      - trans: ❼经常出现;容易发生。
        sentences:
          - ancient: 岸善崩，乃凿井，深者四十余丈。（《史记•河渠书》）
          - ancient: 秋善病风疟。（《素问•金匮真言论》）

  - word: 善
    type: 【形容词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: ❶美好（与"恶""相对）。
        sentences:
          - ancient: 武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其善意。（《苏武传》）
          - ancient: 夫列子御风而行，泠然善也，旬有五日而后反。（《逍遥游》）
          - ancient: 择其善者而从之，其不善者而改之。（《论语•述而》）
          - ancient: 陛下亦宜自谋，以咨诹（zou1，询问）善道，察纳雅言，深追先帝遗诏。（《出师表》）
          - ancient: 【高考题例】时宦官甘畀……持节于外，有所依凭，无善状，燧皆奏罢之。（《宋史•萧燧传》）
      - trans: ❷友好;友善。
        sentences:
          - ancient: 惟博陵崔州平、颍川徐庶元直与亮友善，谓为信然。（《隆中对》）
      - trans: ❸熟悉。
        sentences:
          - ancient: 这人好生面善。（《三国演义》十九回）

  - word: 善
    type: 【副词】
    phonetic: shan4
    tags:
      - 高中
    samples:
      - trans: 好好地。
        sentences:
          - ancient: 子善视之。（《左传•昭公十三年》）
          - ancient: 今人有大功而击之，不义也，不如因善遇之。（《史记•项羽本纪》）
          - ancient: 【高考题例】城破，吾夫必死，吾义不独存，然不可使花氏无后，若等善抚之。（《明史•花云传》）
