---
words:
  - word: 蒙
    type: 【动词】
    phonetic: meng2
    tags:
      - 高中
    samples:
      - trans: ❶覆盖;遮住。
        sentences:
          - ancient: 青树翠蔓，蒙络摇缀。（《小石潭记》）
          - ancient: 今（曹）操得荆州，奄（yan3,包括）有其地，刘表治水军,蒙冲斗舰乃以千数，操忠浮以沿江。（《资治通鉴•汉纪五十七》）
      - trans: ❷隐瞒;欺骗。
        sentences:
          - ancient: 下义其罪，上赏其奸，上下相蒙，难与处矣。（《左传•僖公二十四年》）
          - ancient: 上下蒙冒，吁号不闻。（唐•柳宗元《驳复仇议》）
      - trans: ❸遭受;承受。
        sentences:
          - ancient: 安能以皓皓之白，而蒙世之温蠖（蠖huo4,昏聩）乎?（《史记•屈原贾生列传》）
          - ancient: 今得杀身百效，虽蒙斧钺汤镬,诚甘乐之。（《苏武传》）
          - ancient: 安能以皓皓之白，而蒙世俗之尘埃乎？（《渔父》）
      - trans: ❹继承。
        sentences:
          - ancient: 孝公既没，惠文、武、昭襄蒙故业，因（沿袭）遗策，南取汉中，西举巴蜀。（《过秦论》）
      - trans: ❺敬辞，承蒙。
        sentences:
          - ancient: 昨日蒙教。（宋•王安石《答司马谏议书》）
          - ancient: 苏君，律前负汉归匈奴，幸蒙大恩，赐号称王。（《苏武传》）
          - ancient: 诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。（《陈情表》）
          - ancient: 凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。（《陈情表》）
          - ancient: 【高考题例】由是数月之间，美声上闻，自此颇承恩遇,遂蒙大用。（《旧唐书•李揆传》）
          - ancient: 【高考题例】臣父不能决胜而死,陛下不以罪其弩幸矣,臣等顾蒙非常之恩！（《宋史•康保裔传》）

  - word: 蒙
    type: 【形容词】
    phonetic: meng2
    tags:
      - 高中
    samples:
      - trans: ❶幼稚。
        sentences:
          - ancient: 匪我求童<蒙>，童<蒙>求我。（《周易•蒙卦》）
          - ancient: 复以蒙稚，猥同艰难。（《宋书•文帝纪》）
      - trans: ❷愚昧。
        sentences:
          - ancient: 韩氏之兵非削弱也，民非蒙愚也。（《战国策•韩策一》）
