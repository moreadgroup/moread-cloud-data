---
words:
  - word: 司
    type: 【名词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: ❶官署。
        sentences:
          - ancient: 今者无故又创一<司>，号曰制置三<司>条例。（宋•苏轼《上神宗皇帝书》）
            url: xxxx
            vernacular: 现在无缘无故地又创设了一个司，名叫制置三司条例。 制置三司是北宋时期的一个机构，主要负责财政和军事。2 这个机构的建立是为了加强中央对地方的控制，以及加强对边疆的防御。3 该机构的条例是对该机构职责和权力的规定。1
      - trans: ❷官吏。
        sentences:
          - ancient: "郡县逼迫，催臣上道;州<司>临门，急于星火（流星的光）。（《陈情表》）"
            url: xxxx
            vernacular: 郡县长官催促我立刻上路；州官登门督促，比流星坠落还要急迫。
  - word: 司
    type: 【动词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: 主管;掌管。
        sentences:
          - ancient: "何必劳神苦思，代下<司>职，役聪明之耳目，亏无为之大道哉？（《谏太宗十思疏》）"
            url: xxxx
            vernacular: 何必劳神苦思，事事过问代替百官的职务呢？劳损聪明的耳目，违背无为而治的方针呢！
          - ancient: "昔在颛顼，命南正重以<司>天，北正黎以<司>地。（《史记•太史公自序》）"
            url: xxxx
            vernacular: 从前颛顼在位的时候，任命一个名叫重的南正官掌管天文，一个叫黎的北正官掌管地理。
          - ancient: "【高考题例】山东久旱，浙江及南畿水灾，文升请命所<司>振恤，练士卒以备不虞。（《明史•马文升传》）"
            url: xxxx
            vernacular: 山东大旱，浙江及南京闹水灾，文升奏请皇帝命令有关部门赈济抚恤，操练士卒以备不测。
          - ancient: 【高考题例】宜其<司>当代文柄，以变风雅。（唐•李贻孙《欧阳行周文集序》）
            url: xxxx
            vernacular: 宜其司(掌管)当代文柄(考选文士的权柄)，以变风雅(指诗文之事）
