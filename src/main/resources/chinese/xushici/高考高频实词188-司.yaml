司 si1
【名词】❶官署。
【例句】今者无故又创一司，号曰制置三司条例。（宋•苏轼《上神宗皇帝书》）
❷官吏。
【例句】郡县逼迫，催臣上道;州司临门，急于星火（流星的光）。（《陈情表》）	,

【动词】主管;掌管。
【例句】何必劳神苦思，代下司职,役聪明之耳目，亏无为之大道哉？（《谏太宗十思疏》）丨昔在颛顼，命南正重以司天,北正黎以司地。（《史记•太史公自序》）
【高考题例】山东久旱，浙江及南畿水灾,文升请命所司振恤，练士卒以备不虞。（《明史•马文升传》）丨宜其司当代文柄，以变风雅。（唐•李贻孙《欧阳行周文集序》）

