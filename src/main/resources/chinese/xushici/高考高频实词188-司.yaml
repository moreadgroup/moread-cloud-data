    samples:
      - trans: ❶官署。
        sentences:
          - ancient: 今者无故又创一<司>，号曰制置三<司>条例。（宋•苏轼《上神宗皇帝书》）
      - trans: ❷官吏。
        sentences:
          - ancient: 郡县逼迫，催臣上道;州司临门，急于星火（流星的光）。（《陈情表》）	,

  - word: 司
    type: 【动词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: 主管;掌管。
        sentences:
          - ancient: 何必劳神苦思，代下司职,役聪明之耳目，亏无为之大道哉？（《谏太宗十思疏》）
          - ancient: 昔在颛顼，命南正重以<司>天,北正黎以<司>地。（《史记•太史公自序》）
          - ancient: 【高考题例】山东久旱，浙江及南畿水灾,文升请命所司振恤，练士卒以备不虞。（《明史•马文升传》）
          - ancient: 【高考题例】宜其司当代文柄，以变风雅。（唐•李贻孙《欧阳行周文集序》）

