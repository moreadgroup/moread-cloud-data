斯si1
【动词】❶劈开。
【例句】墓门有棘，斧以斯之。（《诗经•陈风•墓门》）
❷同"撕"。
【例句】凡死刑狱上,行刑者先俟于门外,使其党入索财物,名曰"斯罗"（同"撕掳"，即解决，这里是纠缠勒索之意）。（《狱中杂记》）

【代词】指示代词。此;这。
【例句】则吾斯役之不幸，未若复吾赋不幸之甚也。（《捕蛇者说》）丨登斯楼也,则有去国怀乡……（《岳阳楼记》）丨后之览者，亦将有感于斯文。（《兰亭集序》）丨子非三闾大夫与?何故至于斯？（《渔父》）丨每念斯耻，汗未尝不发背沾衣也。（《报任安书》）丨客亦知夫水与月乎？逝者如斯，而未尝往也。（《赤壁赋》）丨是故燕虽小国而后亡，斯用兵之效也。（《六国论》）

【连词】那么;就。
【例句】知惧如是，斯不亡矣。（《左传•成公七年》）丨故九万里,则风斯在下矣，而后乃今培风。（《逍遥游》）丨王无罪岁，斯天下之民至焉。（《寡人之于国也》）
