            vernacular: 知所戒慎恐惧，而又慎重将事的人，绝对不致遭致败亡。
          - ancient: "故九万里，则风<斯>在下矣，而后乃今培风。（《逍遥游》）"
            url: xxxx
            vernacular: 所以，鹏鸟飞到九万里高空，风就在它的身下，然后方能凭借风力飞行
          - ancient: 王无罪岁，<斯>天下之民至焉。（《寡人之于国也》）
