      - trans: ❶劈开。
        sentences:
          - ancient: 墓门有棘，斧以<斯>之。（《诗经•陈风•墓门》）
            url: xxxx
            vernacular: 你家墓道门前长满酸枣枝，挥动起铁斧就可以铲除掉。
      - trans: ❷同"撕"。
        sentences:
          - ancient: "凡死刑狱上，行刑者先俟于门外，使其党入索财物，名曰\"<斯>罗\"（同\"撕掳\"，即解决，这里是纠缠勒索之意）。（《狱中杂记》）"
            url: xxxx
            vernacular: 凡判死刑的，一经判决执行，行刑的人便先等在门外，派同党进去索讨财物，叫做斯罗
  - word: 斯
    type: 【代词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: 指示代词。此;这。
        sentences:
          - ancient: 则吾<斯>役之不幸，未若复吾赋不幸之甚也。（《捕蛇者说》）
            url: xxxx
            vernacular: 然而我干这差事的不幸，还比不上恢复我缴纳赋税的不幸那么厉害呀。
          - ancient: "登<斯>楼也，则有去国怀乡……（《岳阳楼记》）"
            url: xxxx
            vernacular: 这时登上这座楼啊，就会有一种离开国都、怀念家乡
          - ancient: 后之览者，亦将有感于<斯>文。（《兰亭集序》）
            url: xxxx
            vernacular: 后世的读者，也将对这次集会的诗文有所感慨。
          - ancient: 子非三闾大夫与?何故至于<斯>？（《渔父》）
            url: xxxx
            vernacular: 您不是三闾大夫么，为什么落到这步田地？
          - ancient: 每念<斯>耻，汗未尝不发背沾衣也。（《报任安书》）
            url: xxxx
            vernacular: 每当想到这件耻辱的事，冷汗没有不从脊背上冒出来而沾湿衣襟的。
          - ancient: 客亦知夫水与月乎？逝者如<斯>，而未尝往也。（《赤壁赋》）
            url: xxxx
            vernacular: 你可也知道这水与月？不断流逝的就像这江水，其实并没有真正逝去
          - ancient: 是故燕虽小国而后亡，<斯>用兵之效也。（《六国论》）
            url: xxxx
            vernacular: 所以燕虽然是个小国，最后却灭亡，这就是用兵抗秦的效果。
