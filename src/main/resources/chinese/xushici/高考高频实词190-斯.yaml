---
words:
  - word: 斯
    type: 【动词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: ❶劈开。
        sentences:
          - ancient: 墓门有棘，斧以斯之。（《诗经•陈风•墓门》）
      - trans: ❷同"撕"。
        sentences:
          - ancient: 凡死刑狱上,行刑者先俟于门外,使其党入索财物,名曰"斯罗"（同"撕掳"，即解决，这里是纠缠勒索之意）。（《狱中杂记》）

  - word: 斯
    type: 【代词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: 指示代词。此;这。
        sentences:
          - ancient: 则吾斯役之不幸，未若复吾赋不幸之甚也。（《捕蛇者说》）
          - ancient: 登斯楼也,则有去国怀乡……（《岳阳楼记》）
          - ancient: 后之览者，亦将有感于斯文。（《兰亭集序》）
          - ancient: 子非三闾大夫与?何故至于斯？（《渔父》）
          - ancient: 每念斯耻，汗未尝不发背沾衣也。（《报任安书》）
          - ancient: 客亦知夫水与月乎？逝者如斯，而未尝往也。（《赤壁赋》）
          - ancient: 是故燕虽小国而后亡，斯用兵之效也。（《六国论》）

  - word: 斯
    type: 【连词】
    phonetic: si1
    tags:
      - 高中
    samples:
      - trans: 那么;就。
        sentences:
          - ancient: 知惧如是，斯不亡矣。（《左传•成公七年》）
          - ancient: 故九万里,则风斯在下矣，而后乃今培风。（《逍遥游》）
          - ancient: 王无罪岁，斯天下之民至焉。（《寡人之于国也》）
