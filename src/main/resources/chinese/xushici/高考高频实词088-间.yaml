---
words:
  - word: 间
    type: 【名词】
    phonetic: jian1
    tags:
      - 高中
    samples:
      - trans: ❶中间。用于空间。
        sentences:
          - ancient: 虎见之，庞然大物也，以为神，蔽林间窥之。（《黔之驴》）
          - ancient: 月出于东山之上，徘徊于斗牛之间。（《赤壁赋》）
      - trans: ❷期间。用于时间。
        sentences:
          - ancient: 受命于败军之际，奉命于危难之间，尔来二十有一年矣。（《出师表》）
      - trans: ❸不久;一会儿。
        sentences:
          - ancient: 有间，有所穆然深思焉，有所怡然高望而远志焉。（《史记•孔子世家》）
      - trans: ❹差别;不同。
        sentences:
          - ancient: 【高考题例】此禁物也，取之虽强，与盗物民家有间矣。（《宋史•曾公亮传》）	；

  - word: 间
    type: 【量词】
    phonetic: jian1
    tags:
      - 高中
    samples:
      - trans: 用于计算房屋。
        sentences:
          - ancient: 方宅十余亩，草屋八九间。（《归园田居》）
          - ancient: 安得广厦千万间，大庇天下寒士俱欢颜！（《茅屋为秋风所破歌》）

  - word: 间
    type: 【副词】
    phonetic: jian1
    tags:
      - 高中
    samples:
      - trans: 最近;近来。
        sentences:
          - ancient: 间闻足下迁（提升官职），惕然（忧惧的样子）不喜。（三国魏•嵇康《与山巨源绝交书》）

  - word: 间
    type: 【名词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: ❶缝隙;空隙。
        sentences:
          - ancient: 彼节（骨节）者有间，而刀刃者无厚……（《庄子•养生主》）
          - ancient: 晏子为齐相，出，其御之妻从门<间>而窥（同"窥"，从间缝隙里看）其夫。（《史记•管晏列传》）
      - trans: ❷隔阂。
        sentences:
          - ancient: 诸侯有间矣。（《左传•昭公十三年》）
      - trans: ❸机会;空子。
        sentences:
          - ancient: 至京口，得间奔真州。（《〈指南录〉后序》）
          - ancient: 【高考题例】臣在任已闻警，虑夏人必乘间盗边，愿选将设备（设置防备）。（《宋史•郭浩传》）
      - trans: ❹距离;差别。
        sentences:
          - ancient: 则美丑有间矣。（《淮南子•俶真训》）
      - trans: ❺间谍。
        sentences:
          - ancient: 始臣为间，然渠成亦秦之利也。（《史记•河渠书》）

  - word: 间
    type: 【动饲】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: ❶间隔；隔离。
        sentences:
          - ancient: 大川相间，小川相属。（《论衡•别通》）
      - trans: ❷挑拨离间。
        sentences:
          - ancient: 谗人间之，可谓穷（处境困难）矣。（《史记•屈原贾生列传》）
      - trans: ❸侦察。
        sentences:
          - ancient: 内间主之情以告外。（《韩非子•外储说右上》）
      - trans: ❹参与;介入。
        sentences:
          - ancient: 肉食者谋之，又何间焉？（《曹刿论战》）
      - trans: ❺夹杂。
        sentences:
          - ancient: 中间力拉崩倒之声，火爆声，呼呼风声，百千齐作。（《口技》）
      - trans: ❻走小路;走近路。
        sentences:
          - ancient: 沛公已去，间至军中。（《史记•项羽本纪》）

  - word: 间
    type: 【副词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: ❶断断续续。
        sentences:
          - ancient: 数月之后，时时而间进。（《邹忌讽齐王纳谏》）
      - trans: ❷间或;有时。
        sentences:
          - ancient: 予在患难中，间以诗记所遭，今存其本不忍废。（《〈指南录〉后序》）
      - trans: ❸私下;暗地里。
        sentences:
          - ancient: 又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰："大楚兴，陈胜王。"（《陈涉世家》）
          - ancient: 臣诚恐见欺于王而负赵，故令人持璧归，间至赵矣。（《廉颇蔺相如列传》）
          - ancient: 【高考题例】时邑多盗，群丐间作侦探，是以屡屡破获重要案件。（《虞初广志•卷八•记丐俠》）
