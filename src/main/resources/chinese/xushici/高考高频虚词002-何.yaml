---
words:
  - word: 何
    type: 【代词】
    phonetic: he2
    tags:
      - 高中
    samples:
      - trans: ❶哪里;什么。
        sentences:
          - ancient: 胡为乎遑遑欲<何>之？（《归去来兮辞》）
            url: xxxx
            vernacular: 为什么心神不定，想到哪里去呢? 句式:疑问句宾语前置，“何之”即“之何”。
          - ancient: 阁中帝子今<何>在？槛外长江空自流。（《滕王阁序》）
            url: xxxx
            vernacular: 昔日游赏于高阁中的滕王如今无处可觅，只有那栏杆外的滔滔江水空自向远方奔流。
          - ancient: 别君去兮<何>时还？且放白鹿青崖间。须行即骑访名山。（《梦游天姥吟留别》）
            url: xxxx
            vernacular: 解释：告别诸位朋友远去（东鲁）啊，什么时候才能回来？暂且把白鹿放牧在青崖间，等到要远行时就骑上它访名山。
          - ancient: 丞相祠堂<何>处寻？锦官城外柏森森。（《蜀相》）
            url: xxxx
            vernacular: 你要寻访千古垂名的诸葛丞相的祠堂吗?它就坐落在成都城外古柏 环抱、一片翠绿的地方。
          - ancient: <何>以伐为？（《季氏将伐颛臾》）
            url: xxxx
            vernacular: 为什么要讨伐它呢？
          - ancient: 【高考题例】不能肃清凶逆，遂令王室至此，抱恨泉壤，知复<何>言！（《北史•来护儿传》）
            url: xxxx
            vernacular: 不能清除凶恶悖逆之人，终让朝廷落到如此地步，我只能抱憾于黄泉之下，还能再说什么呢？
      - trans: ❷怎么；为什么。
        sentences:
          - ancient: 彼，丈夫也;我，丈夫也。吾<何>畏彼哉？（《孟子•滕文公上》）
            url: xxxx
            vernacular: 他是个男子汉，我也是个男子汉，我为什么要怕他呢?
          - ancient: <何>子居之高，视之下；仪貌之壮，语言之野也!（《论衡•书虚》）
            url: xxxx
            vernacular: 怎么你地位这么高，而看问题这么低下；仪态容貌这么豪壮，而言语这么粗野！
          - ancient: 徐公<何>能及君也？（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 徐公怎么能比得上您呢？
          - ancient: 长桥卧波，未云<何>龙？复道行空，不霁<何>虹？（《阿房宫赋》）
            url: xxxx
            vernacular: 没有起云，为什么有龙?原来是一座长桥躺在水波上。不是雨过天晴，为什么出虹?原来是天桥在空中行走。
          - ancient: 独五人之皦皦jiao3，<何>也？（《五人墓碑记》）
            url: xxxx
            vernacular: 唯独这五个人声名光荣显耀，为什么呢
          - ancient: 昔取之而有余，今守之而不足，<何>也？（《谏太宗十思疏》）
            url: xxxx
            vernacular: 当初创业时，能力绰绰有余；现在守卫天下却力量不足，这是为什么呢？
  - word: 何
    type: 【副词】
    phonetic: he2
    tags:
      - 高中
    samples:
      - trans: 多么。
        sentences:
          - ancient: 青泥<何>盘盘（形容山路曲折盘旋），百步九折萦岩峦。（《蜀道难》）
            url: xxxx
            vernacular: 青泥岭的泥路多么曲曲弯弯，百步九折萦绕着山峦。
          - ancient: 水<何>澹澹，山岛竦峙。（《观沧海》）
            url: xxxx
            vernacular: 海水多么宽阔浩荡，山岛高高地挺立在海边。

