---
words:
  - word: 再
    type: 【数词】
    phonetic: Zai4
    tags:
      - 高中
    samples:
      - trans: ❶第二次。
        sentences:
          - ancient: 一鼓作气,再而衰，三而竭。（《曹刿论战》）
          - ancient: 非再至，焉知其奇若此？（明•徐霞客《游黄山日记》）
      - trans: ❷两次。
        sentences:
          - ancient: 后秦击赵者再，李牧连却（击退）之。（《六国论》）
          - ancient: 谨使臣良奉白璧一双,再拜献大王足下,玉斗一双,再拜奉大将军足下。（《鸿门宴》）
          - ancient: 安帝雅闻衡善术学，公车特征拜郎中，再迁为太史令。（《张衡传》）
          - ancient: 顺帝初，再转复为太史令。（《张衡传》）
          - ancient: 【高考题例】寻复罚米者再，家业荡然（空寂的样子）。（《明史•韩文传》）

  - word: 再
    type: 【副词】
    phonetic: Zai4
    tags:
      - 高中
    samples:
      - trans: 再次，表示同一动作多次重复。
        sentences:
          - ancient: 騑骖（fēicān三匹马驾一辆车）倦路，再寝再兴。（《三国志•魏节•,任城陈萧王传》）
          - ancient: 臣事君，犹子事父也，子为父死，亡所恨,愿勿复再言！（《苏武传》）
