          - ancient: 騑骖（fēicān三匹马驾一辆车）倦路，<再>寝<再>兴。（《三国志•魏节•任城陈萧王传》）
            url: xxxx
            vernacular: xxxx
          - ancient: "臣事君，犹子事父也，子为父死，亡所恨，愿勿复<再>言！（《苏武传》）"
            url: xxxx
            vernacular: 大臣侍奉君王，就像儿子侍奉父亲，儿子为父亲而死，没有什么可遗憾的，希望你不要再说了！
