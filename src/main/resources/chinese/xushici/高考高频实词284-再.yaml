    samples:
      - trans: ❶第二次。
        sentences:
          - ancient: "一鼓作气，<再>而衰，三而竭。（《曹刿论战》）"
            url: xxxx
            vernacular: 第一次击鼓能够振作士兵们的士气，第二次击鼓士兵们的士气就开始低落了，第三次击鼓士兵们的士气就耗尽了。
          - ancient: 非<再>至，焉知其奇若此？（明•徐霞客《游黄山日记》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷两次。
        sentences:
          - ancient: 后秦击赵者<再>，李牧连却（击退）之。（《六国论》）
            url: xxxx
            vernacular: 后来秦国多次攻打赵国。（赵国大将）李牧接连打退秦国的进攻。
          - ancient: "谨使臣良奉白璧一双，<再>拜献大王足下，玉斗一双，<再>拜奉大将军足下。（《鸿门宴》）"
            url: xxxx
            vernacular: 让我奉上白璧一双，拜两拜敬献给大王；玉斗一双，拜两拜献给大将军。
          - ancient: 安帝雅闻衡善术学，公车特征拜郎中，<再>迁为太史令。（《张衡传》）
            url: xxxx
            vernacular: 汉安帝常听说他擅长术数方面的学问，命公车特地征召他，任命他为郎中。两次迁升为太史令。
          - ancient: 顺帝初，<再>转复为太史令。（《张衡传》）
            url: xxxx
            vernacular: （汉）顺帝初年，（张衡）又两次转任，又做了太史令之职。
          - ancient: 【高考题例】寻复罚米者<再>，家业荡然（空寂的样子）。（《明史•韩文传》）
            url: xxxx
            vernacular: 不久又再次罚米，锺玄家业荡然无存。
  - word: 再
