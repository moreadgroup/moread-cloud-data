再Zai4
【数词】❶第二次。
【例句】一鼓作气,再而衰，三而竭。（《曹刿论战》）丨非再至，焉知其奇若此？（明•徐霞客《游黄山日记》）
❷两次。
【例句】后秦击赵者再，李牧连却（击退）之。（《六国论》）丨谨使臣良奉白璧一双,再拜献大王足下,玉斗一双,再拜奉大将军足下。（《鸿门宴》）丨安帝雅闻衡善术学，公车特征拜郎中，再迁为太史令。（《张衡传》）丨顺帝初，再转复为太史令。（《张衡传》）

【高考题例】寻复罚米者再，家业荡然（空寂的样子）。（《明史•韩文传》）

【副词】再次，表示同一动作多次重复。
【例句】騑骖（fēicān三匹马驾一辆车）倦路，再寝再兴。（《三国志•魏节•,任城陈萧王传》）丨臣事君，犹子事父也，子为父死，亡所恨,愿勿复再言！（《苏武传》）
