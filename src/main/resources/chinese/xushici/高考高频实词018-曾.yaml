    samples:
      - trans: 重叠。
        sentences:
          - ancient: 【例句】曾云无温夜,严霜有凝威。（晋•陆机《园葵》）
          - ancient: 荡胸生曾云,决眦入归鸟。（《望岳》）
  - word: 曾
    type: 【副词】
    phonetic: ceng2
    tags:
