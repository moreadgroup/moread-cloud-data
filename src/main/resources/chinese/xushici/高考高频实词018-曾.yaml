---
words:
  - word: 曾
    type: 【动词】
    phonetic: ceng2
    tags:
      - 高中
    samples:
      - trans: 重叠。
        sentences:
          - ancient: <曾>云无温夜，严霜有凝威。（晋•陆机《园葵》）
            url: xxxx
            vernacular: 重迭的云层。曾，通“ 层 ”。
          - ancient: 荡胸生<曾>云，决眦入归鸟。（《望岳》）
            url: xxxx
            vernacular: 层层白云，荡涤胸中沟壑；翩翩归鸟，飞入赏景眼圈。
  - word: 曾
    type: 【副词】
    phonetic: ceng2
    tags:
      - 高中
    samples:
      - trans: 曾经。
        sentences:
          - ancient: 而刘夙婴疾病，常在床蓐，臣侍汤药，未<曾>废离。（《陈情表》）
            url: xxxx
            vernacular: 但祖母刘氏又早被疾病缠绕，常年卧床不起，我侍奉她吃饭喝药，从来就没有离开她。
          - ancient: 寻常巷陌，人道寄奴<曾>住。（《永遇乐•京口北固亭怀古》）
            url: xxxx
            vernacular: 人们说那是当年刘裕曾经住过的地方。
  - word: 曾
    type: 【名词】
    phonetic: zeng1
    tags:
      - 高中
    samples:
      - trans: 与自己隔两代的亲属
        sentences:
          - ancient: 是高<曾>时为一户者，至<曾>元时不分至十户不止。（清•洪亮吉《治平篇》）
            url: xxxx
            vernacular: 高祖、曾祖的时候是一户的人家，传到曾孙、玄孙的时候，不分到十户是不休止的。
          - ancient: 禹之<曾>大父昌意及父稣皆不得在帝位，为人臣。（《史记•夏本纪》）
            url: xxxx
            vernacular: 禹就是黄帝的玄孙和颛顼的孙子。只有禹的曾祖父昌意和父亲鲧都不曾登过帝位，而是做臣子。
          - ancient: 高<曾>之时，隙地未尽辟，闲廛未尽居也。（清•洪亮吉《治平篇》）
            url: xxxx
            vernacular: 高祖、曾祖的时候，空地还没开垦完，空屋子也没有住满。
          - ancient: 孝桓皇帝讳志，肃宗<曾>孙也。（《庐汉书•孝桓帝纪》）
            url: xxxx
            vernacular: 孝桓皇帝刘志，肃宗章帝曾孙
  - word: 曾
    type: 【动词】
    phonetic: zeng1
    tags:
      - 高中
    samples:
      - trans: ❶增加。通"增"。
        sentences:
          - ancient: 所以动心忍性，<曾>益其所不能。（《生于忧患，死于安乐》）
            url: xxxx
            vernacular: 这样来激励他的心志,使他性情坚忍,增加他所不具备的能力。
      - trans: ❷重复。
        sentences:
          - ancient: 矫兹媚以私处兮，愿<曾>思而远身。（战国楚•屈原《九章•惜诵》）
            url: xxxx
            vernacular: 保持自己的美德，离群索居吧，我反复想过隐身远藏。
  - word: 曾
    type: 【副词】
    phonetic: zeng1
    tags:
      - 高中
    samples:
      - trans: 表示出乎意料，相当于"简直""连……""竟"。
        sentences:
          - ancient: 以残年余力，<曾>不能毁山之一毛，其如土石何?（《列子•汤问》）
            url: xxxx
            vernacular: 就凭你残余的岁月、剩下的力气连山上的一棵草都动不了，又能把泥土石头怎么样呢？
          - ancient: 盖将自其变者而观之，则天地<曾>不能以一瞬。（《赤壁赋》）
            url: xxxx
            vernacular: 可见，从事物易变的一面看来，天地间没有一瞬间不发生变化。
          - ancient: 今吾且死而侯生<曾>无一言半辞送我，我岂有所失哉？（《史记•魏公子列传》）
            url: xxxx
            vernacular: 如今我将要死难可是侯先生竟没有一言半语来送我，难道我有什么过错吗。
          - ancient: 【高考题例】而亲贤下士，推毂后进，虽位崇年高，<曾>无倦色。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 而亲贤下士，提携后进，虽位崇年高，却无半点厌倦之意。
