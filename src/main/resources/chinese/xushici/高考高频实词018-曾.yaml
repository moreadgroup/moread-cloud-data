      - trans: 曾经。
        sentences:
          - ancient: 【例句】而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）
          - ancient: 寻常巷陌，人道寄奴曾住。（《永遇乐•京口北固亭怀古》）
  - word: 曾
    type: 【名词】    
    phonetic: zeng1
    tags:
      - 高中
    samples:
      - trans: 与自己隔两代的亲属
        sentences:
          - ancient: 【例句】是高曾时为一户者，至曾元时不分至十户不止。（清•洪亮吉《治平篇》）
          - ancient: 禹之曾大父昌意及父稣皆不得在帝位，为人臣。（《史记•夏本纪》）
          - ancient: 高曾之时，隙地未尽辟。（清•洪亮吉《治平篇》）
          - ancient: 孝桓皇帝讳志，肃宗曾孙也。（《庐汉书•孝桓帝纪》）
  - word: 曾
    type: 【动词】
    phonetic: zeng1
    tags:
      - 高中
    samples:
      - trans: ❶增加。通"增"。
        sentences:
          - ancient: 【例句】所以动心忍性，曾益其所不能。（《生于忧患，死于安乐》）
      - trans: ❷重复。
        sentences:
          - ancient: 【例句】矫兹媚以私处兮，愿曾思而远身。（战国楚•屈原《九章•惜诵》）
  - word: 曾
    type: 【副词】
