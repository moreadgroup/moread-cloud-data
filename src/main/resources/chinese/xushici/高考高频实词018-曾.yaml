    samples:
      - trans: 表示出乎意料，相当于"简直""连……""竟"。
        sentences:
          - ancient: 【例句】以残年余力，曾不能毁山之一毛，其如土石何?（《列子•汤问》）
          - ancient: 盖将自其变者而观之，则天地曾不能以一瞬。（《赤壁赋》）
          - ancient: 今吾且死而侯生曾无一言半辞送我,我岂有所失哉？（《史记•魏公子列传》）
