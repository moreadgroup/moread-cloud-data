---
words:
  - word: 卒
    type: 【名词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: ❶步兵;士兵。
        sentences:
          - ancient: 比（等到）至陈，车六七百乘，骑千余，卒数万人。（《陈涉世家》）
          - ancient: 夫以疲病之卒御狐疑之众，众数虽多，甚未。（《资治通鉴•汉纪五十七》）
          - ancient: 良曰："料大王士卒足以当项王乎？"（《鸿门宴》）
      - trans: ❷古代军队的编制,一百人为卒。
        sentences:
          - ancient: 全卒为上，破卒次之。（《孙子兵法•谋攻》）
      - trans: ❸差役。
        sentences:
          - ancient: 禁卒居中央，牖（you3,在墙壁上开窗）其前以通明，屋极有窗以达气。（《狱中杂记》）

  - word: 卒
    type: 【动词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: ❶死。
        sentences:
          - ancient: 初，鲁肃闻刘表卒。（《资治通鉴•汉纪五十七》）
          - ancient: 唐浮图慧褒始舍于其址，而卒葬之。（《游褒禅山记》）
      - trans: ❷终;尽;结束。
        sentences:
          - ancient: 人始于生而卒于死。（《韩非子•解老》）
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）
          - ancient: 磐石方且厚,可以卒千年;蒲苇一时纫，便作旦夕间。（《孔雀东南飞》）

  - word: 卒
    type: 【副词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: 最终。
        sentences:
          - ancient: 有贤士大夫发五十金，买五人之头而函之，卒与尸合。（《五人墓碑记》）
          - ancient: 盈虚者如彼，而卒莫消长也。（《赤壁赋》）
          - ancient: 【高考题例】及当大事，殺然执持,人不能夺，卒以此忤权幸去。（《明史•傅珪传》）

  - word: 卒
    type: 【副词】
    phonetic: cu4
    tags:
      - 高中
    samples:
      - trans: 通"猝"。突然;仓促。
        sentences:
          - ancient: 卒然问曰:""天下恶乎定?"（《孟子见梁襄王》）
          - ancient: 五万兵难卒合，已选三万人，船粮战具俱办。（《资治通鉴•汉纪五十七》）
          - ancient: 群臣惊愕，卒起不意，尽失其度。（《荆轲刺秦王》）