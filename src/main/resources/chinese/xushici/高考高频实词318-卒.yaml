---
words:
  - word: 卒
    type: 【名词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: ❶步兵;士兵。
        sentences:
          - ancient: 比（等到）至陈，车六七百乘，骑千余，<卒>数万人。（《陈涉世家》）
            url: xxxx
            vernacular: 等到到达陈县，已有战车六七百辆，骑兵一千多，士兵好几万。
          - ancient: 夫以疲病之<卒>御狐疑之众，众数虽多，甚未足畏。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 用疲惫染病的士兵控制三心二意的军队 ，虽然人数多，也不值得畏惧
          - ancient: 良曰："料大王士<卒>足以当项王乎？"（《鸿门宴》）
            url: xxxx
            vernacular: 张良说：估计大王的军队能够抵挡住项王的军队吗？
      - trans: ❷古代军队的编制，一百人为卒。
        sentences:
          - ancient: 全<卒>为上，破<卒>次之。（《孙子兵法•谋攻》）
            url: xxxx
            vernacular: 使敌人整个“卒”的队伍降服是上策，打败敌人一个“卒”的队伍就次一等。
      - trans: ❸差役。
        sentences:
          - ancient: 禁<卒>居中央，牖（you3，在墙壁上开窗）其前以通明，屋极有窗以达气。（《狱中杂记》）
            url: xxxx
            vernacular: 狱卒住在当中的一间，前面有大窗通光线，屋顶有小窗透空气
  - word: 卒
    type: 【动词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: ❶死。
        sentences:
          - ancient: 初，鲁肃闻刘表<卒>。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 当初，鲁肃听说刘表死了
          - ancient: 唐浮图慧褒始舍于其址，而<卒>葬之。（《游褒禅山记》）
            url: xxxx
            vernacular: 唐代和尚慧褒当初在那儿筑室居住， 而死后又葬在那儿。
      - trans: ❷终;尽;结束。
        sentences:
          - ancient: 人始于生而<卒>于死。（《韩非子•解老》）
            url: xxxx
            vernacular: 人以出生开始 以死亡结束
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保<卒>余年。（《陈情表》）
            url: xxxx
            vernacular: 希望陛下能怜悯我的诚心，满足我微不足道的心愿，使祖母刘氏能够侥幸地保全她的余生。
          - ancient: 磐石方且厚，可以<卒>千年;蒲苇一时纫，便作旦夕间。（《孔雀东南飞》）
            url: xxxx
            vernacular: 大石方正又坚厚，可以千年都不变。蒲苇虽然一时坚韧，但只能坚持很短的时间。
  - word: 卒
    type: 【副词】
    phonetic: zu2
    tags:
      - 高中
    samples:
      - trans: 最终。
        sentences:
          - ancient: 有贤士大夫发五十金，买五人之头而函之，<卒>与尸合。（《五人墓碑记》）
            url: xxxx
            vernacular: 有位有名望的人拿出五十两银子，买下五个人的头并用木匣装起来，最终与尸体合到了一起。
          - ancient: 盈虚者如彼，而<卒>莫消长也。（《赤壁赋》）
            url: xxxx
            vernacular: 月亮总是那样有圆有缺，但它终究也没有增减。
          - ancient: 【高考题例】及当大事，毅然执持，人不能夺，<卒>以此忤权幸去。（《明史•傅珪传》）
            url: xxxx
            vernacular: 傅珪到担当大事时，毅然固执地坚持自己的意见，他人不能改变，最终因为这忤逆权贵佞臣而离职。
  - word: 卒
    type: 【副词】
    phonetic: cu4
    tags:
      - 高中
    samples:
      - trans: 通"猝"。突然;仓促。
        sentences:
          - ancient: <卒>然问曰:""天下恶乎定?"（《孟子见梁襄王》）
            url: xxxx
            vernacular: 他见了我之后）突然问道：“天下要怎样才能安定呢？”。 恶（Wū乌）乎：怎样，如何.
          - ancient: 五万兵难<卒>合，已选三万人，船粮战具俱办。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 五万兵难在仓猝之集合起来，已选好三万人，船只、粮草、战斗用具都已办齐.
          - ancient: 群臣惊愕，<卒>起不意，尽失其度。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦国的君臣都惊呆了，事情突然发生，意料不到，大家都失去了常态。
