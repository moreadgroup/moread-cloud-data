卒㊀zu2
【名词】❶步兵;士兵。
【例句】比（等到）至陈，车六七百乘，骑千余，卒数万人。（《陈涉世家》）丨夫以疲病之卒御狐疑之众，众数虽多，甚未。（《资治通鉴•汉纪五十七》）丨良曰："料大王士卒足以当项王乎？"（《鸿门宴》）
❷古代军队的编制,一百人为卒。
【例句】全卒为上，破卒次之。（《孙子兵法•谋攻》）
❸差役。
【例句】禁卒居中央，牖（you3,在墙壁上开窗）其前以通明，屋极有窗以达气。（《狱中杂记》）

【动词】❶死。
【例句】初，鲁肃闻刘表卒。（《资治通鉴•汉纪五十七》）丨唐浮图慧褒始舍于其址，而卒葬之。（《游褒禅山记》）
❷终;尽;结束。
【例句】人始于生而卒于死。（《韩非子•解老》）丨愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）丨磐石方且厚,可以卒千年;蒲苇一时纫，便作旦夕间。（《孔雀东南飞》）

【副词】最终。
【例句】有贤士大夫发五十金，买五人之头而函之，卒与尸合。（《五人墓碑记》）丨盈虚者如彼，而卒莫消长也。（《赤壁赋》）

【高考题例】及当大事，殺然执持,人不能夺，卒以此忤权幸去。（《明史•傅珪传》）

卒㊁cu4
【副词】通"猝"。突然;仓促。
【例句】卒然问曰:""天下恶乎定?"（《孟子见梁襄王》）丨五万兵难卒合，已选三万人，船粮战具俱办。（《资治通鉴•汉纪五十七》）丨群臣惊愕，卒起不意，尽失其度。（《荆轲刺秦王》）