---
words:
  - word: 故
    type: 【名词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶旧的事物。
        sentences:
          - ancient: 子曰："温<故>而知新，可以为师矣。"（《论语.为政》）
            url: xxxx
            vernacular: 温习旧知识从而得知新的理解与体会，凭借这一点就可以成为老师了。
      - trans: ❷旧交。
        sentences:
          - ancient: 君安（怎么）与项伯有<故>？（《鸿门宴》）
            url: xxxx
            vernacular: 你怎么和项伯有交情的？
      - trans: ❸原因;缘故。
        sentences:
          - ancient: 有过于江上者，见人方引婴儿而欲投之江中，婴儿啼，人问其<故>。曰：""此其父善游。"（《吕氏春秋•察今》）
            url: xxxx
            vernacular: 有个经过江边的人，看见一个人正拉着一个小孩要把他投到江里去，小孩吓得直哭。过江的人忙问这样做的原因，那人回答：“这孩子的父亲擅长游泳。”
          - ancient: 既克，公问其<故>。（《曹刿论战》）
            url: xxxx
            vernacular: 战胜齐军后，鲁庄公问他这样做的原因。
          - ancient: 以<故>其后名之曰"褒禅"。（《游褒禅山记》）
            url: xxxx
            vernacular: 因为这个缘故，后人就称此山为褒禅山。
          - ancient: 而五人生于编伍之间，素不闻诗书之训，激昂大义，蹈死不顾，亦曷<故>哉？（《五人墓碑记》）
            url: xxxx
            vernacular: 但这五个人生于民间，从来没受到过诗书的教诲却能被大义所激励，踏上死地也不回头，又是什么缘故呢？
  - word: 故
    type: 【动词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶衰败;衰老。
        sentences:
          - ancient: 弟走从军阿姨死，暮去朝来颜色<故>。（《琵琶行》）
            url: xxxx
            vernacular: 兄弟从军老鸨死家道已经破败；暮去朝来我也渐渐地年老色衰。
      - trans: ❷死亡。
        sentences:
          - ancient: 若年老病<故>者，令其子弟依例荫叙。（《元史•选举志二》）
            url: xxxx
            vernacular: xxxx
          - ancient: 单于召会武官属，前以降及物<故>，凡随武还者九人。（《苏武传》）
            url: xxxx
            vernacular: 单于召集苏武的部下，除了以前已经投降和死亡的，总共跟随苏武回来的有九人。
  - word: 故
    type: 【形容词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶旧的（与"新"相对）。
        sentences:
          - ancient: 凡植木之性，其本欲舒，其培欲平，其土欲<故>，其筑（捣土）欲密。（《种树郭橐驼传》）
            url: xxxx
            vernacular: 但凡种树的方法，它的树根要舒展，它的培土要平均，它根下的土要用原来培育树苗的土，它捣土要结实
      - trans: ❷从前的;原来的。
        sentences:
          - ancient: 羁鸟恋旧林，池鱼思<故>渊。（《归园田居》）
            url: xxxx
            vernacular: 笼子里的鸟儿怀念以前生活的森林，池子里的鱼儿思念原来嬉戏的深潭。
          - ancient: 孝公既没，惠文、武、昭襄蒙<故>业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地。（《过秦论》）.
            url: xxxx
            vernacular: 秦孝公死后，秦惠文王武王昭襄王承接了秦孝公的治国事业，遵循着先人留下来的策略，向南面夺取了汉中，向西南夺取了巴蜀，向东面割得了肥沃的土地
  - word: 故
    type: 【副词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶原来;本来。
        sentences:
          - ancient: 此物<故>非西产;有华阴令欲媚上官，以一头进，试使斗而才。（《促织》）
            url: xxxx
            vernacular: 这东西本来不是陕西出产的。有个华阴县的县官，想巴结上司，把一只蟋蟀献上去，上司试着让它斗了一下，显出了勇敢善斗的才能
      - trans: ❷仍然。
        sentences:
          - ancient: 三日断五匹，大人<故>嫌迟。（《孔雀东南飞》）
            url: xxxx
            vernacular: 三天就能在机上截下五匹布，但婆婆仍然嫌我织得慢。
          - ancient: 交游士林，累官<故>不失州郡也。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 与士大夫们交游,逐级升迁还可能会做州郡的长官
      - trans: ❸故意;特意。
        sentences:
          - ancient: 将尉醉，广<故>数言欲亡，忿恚（hui4，激怒）尉，令辱之，以激怒其众。（《陈涉世家》）
            url: xxxx
            vernacular: 一天）押送戍卒的将尉喝醉了，吴广故意多次说想要逃跑，使将尉恼怒，让他侮辱自己，以便激怒那些士兵们。
          - ancient: 公子往，数请之，朱亥<故>不复谢，公子怪之。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 公子就前往朱亥家，屡次向他问候。朱亥故意不答谢。公子对此感到奇怪。
          - ancient: 然嬴欲就公子之名，<故>久立公子车骑市中，过客以观公子，公子愈恭。（《史记•魏公子列传》）
            url: xxxx
            vernacular: 可我也想成就公子的名声，故意让公子车马久久地停在街市中，借拜访朋友来观察公子，结果公子更加谦恭。
      - trans: ❹从前;以前。
        sentences:
          - ancient: 程不识<故>与李广俱以边太守将军屯。（《史记•李将军列传》）
            url: xxxx
            vernacular: 程不识和李广从前都任边郡太守并兼管军队驻防。
  - word: 故
    type: 【连词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: 所以；因此。
        sentences:
          - ancient: 吾视其辙乱，望其旗靡（mi3，倒下），<故>逐之。（《曹刿论战》）
            url: xxxx
            vernacular: 我看他们车轮碾过的痕迹散乱，望见他们的旗子倒下了，所以决定追击他们。
          - ancient: <故>不积跬步，无以至千里。（《劝学》）
            url: xxxx
            vernacular: 所以不积累一步半步的行程，就没有办法达到千里之远
