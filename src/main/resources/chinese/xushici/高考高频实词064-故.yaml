---
words:
  - word: 故
    type: 【名词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶旧的事物。
        sentences:
          - ancient: 子曰："温故而知新，可以为师矣。"（《论语.为政》）
      - trans: ❷旧交。
        sentences:
          - ancient: 君安（怎么）与项伯有故？（《鸿门宴》）
      - trans: ❸原因;缘故。
        sentences:
          - ancient: 有过于江上者，见人方引婴儿而欲投之江中，婴儿啼，人问其故。曰：""此其父善游。"（《吕氏春秋•察今》）
          - ancient: 既克，公问其故。（《曹刿论战》）
          - ancient: 以故其后名之曰""褒禅"。（《游褒禅山记》）
          - ancient: 而五人生于编伍之间，素不闻诗书之训，激昂大义，蹈死不顾，亦曷故哉？（《五人墓碑记》）
  - word: 故
    type: 【动词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶衰败;衰老。
        sentences:
          - ancient: 弟走从军阿姨死，暮去朝来颜色故。（《琵琶行》）
      - trans: ❷死亡。
        sentences:
          - ancient: 若年老病故者，令其子弟依例荫叙。（《元史•选举志二》）
          - ancient: 单于召会武官属，前以降及物故，凡随武还者九人。（《苏武传》）
  - word: 故
    type: 【形容词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶旧的（与"新"相对）。
        sentences:      
          - ancient: 凡植木之性，其本欲舒，其培欲平，其土欲故，其筑（捣土）欲密。（《种树郭橐驼传》）
      - trans: ❷从前的;原来的。
        sentences:
          - ancient: 羁鸟恋旧林，池鱼思故渊。（《归园田居》）
          - ancient: 孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地。（《过秦论》）.
  - word: 故
    type: 【副词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: ❶原来;本来。
        sentences:
          - ancient: 此物故非西产;有华阴令欲媚上官，以一头进，试使斗而才。（《促织》）
      - trans: ❷仍然。
        sentences:
          - ancient: 三日断五匹，大人故嫌迟。（《孔雀东南飞》）
          - ancient: 交游士林，累官故不失州郡也。（《资治通鉴•汉纪五十七》）
      - trans: ❸故意;特意。
        sentences:
          - ancient: 将尉醉，广故数言欲亡，忿恚（hui4，激怒）尉，令辱之，以激怒其众。（《陈涉世家》）
          - ancient: 公子往，数请之，朱亥故不复谢，公子怪之。（《史记•魏公子列传》）
          - ancient: 然嬴欲就公子之名，故久立公子车骑市中，过客以观公子，公子愈恭。（《史记•魏公子列传》）
      - trans: ❹从前;以前。
        sentences:
          - ancient: 程不识故与李广俱以边太守将军屯。（《史记•李将军列传》）
  - word: 故
    type: 【连词】
    phonetic: gu4
    tags:
      - 高中
    samples:
      - trans: 所以；因此。
        sentences:
          - ancient: 吾视其辙乱，望其旗靡（mi3，倒下），故逐之。（《曹刿论战》）
          - ancient: 故不积跬步，无以至千里。（《劝学》）
