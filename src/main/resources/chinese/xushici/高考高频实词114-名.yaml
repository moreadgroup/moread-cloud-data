---
words:
  - word: 名
    type: 【名词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: ❶名字;名称。
        sentences:
          - ancient: 昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。（《木兰诗》）
          - ancient: 即书诗四句,并自为其名。（《伤仲永》）
      - trans: ❷名号；名分（与"实"相对）。
        sentences:
          - ancient: 古者名位不同，礼亦异数。（《汉书•艺文志》）
          - ancient: 唯名与器，圣人所重。（《后汉书•刘玄传》）
      - trans: ❸名誉;名声。
        sentences:
          - ancient: 曹操比于袁绍，则名微而众寡,然操遂能克绍，以弱为强者，非惟天时,抑亦人谋也。（《隆中对》）
          - ancient: 功与日月齐光兮，名与三王争流。（《后汉书•冯衍传》）

  - word: 名
    type: 【动词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: ❶命名；取名。
        sentences:
          - ancient: 所谓华山洞者，以其乃华山之阳名之也。（《游褒禅山记》）
          - ancient: 东家有贤女，自名秦罗敷，可怜体无比，阿母为汝求。（《孔雀东南飞》）
          - ancient: 名余曰正则兮，字余曰灵均。（《离骚》）
          - ancient: 以故其后名之曰"褒禅"。（《游褒禅山记》）
          - ancient: 【高考题例】民图像于庐，而奉之如神，名日"范公庵"。（《宋史-范纯礼传》）
      - trans: ❷称说;说出。
        sentences:
          - ancient: 后世之谬其传而莫能名者，何可胜道也哉！（《游褒禅山记》）
          - ancient: 人有百口，口有百舌，不能名其一处也。（《口技》）
      - trans: ❸出名；有名。
        sentences:
          - ancient: 山不在高，有仙则名。（《陋室铭》）
  - word: 名
    type: 【形容词】
    phonetic: ming2
    tags:
      - 高中
    samples:
      - trans: 著名的;有名声的。
        sentences:
          - ancient: 故虽有名马，祗辱于奴隶人之手，骈死于槽栃之间,不以千里称也。阳马生序》）