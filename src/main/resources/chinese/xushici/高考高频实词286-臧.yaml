      - trans: 褒扬好的，评价优的。
        sentences:
          - ancient: 宫中府中，俱为一体，陟罚<臧>否，不宜异同。（《出师表》）
            url: xxxx
            vernacular: 皇宫中和朝廷中本都是一个整体，赏罚褒贬，不应该有所不同。
          - ancient: 【高考题例】弘微口不言人短长，而曜好<臧>否人物，曜每言论，弘微常以它语乱之。（《宋书•谢弘微传》）
            url: xxxx
            vernacular: 谢弘微口中从不说别人坏话，而谢曜则喜欢评议人物，每当谢曜在言谈中涉及别人时，谢弘微就常用别的话题岔开。
