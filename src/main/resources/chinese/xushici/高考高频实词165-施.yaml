---
words:
  - word: 施
    type: 【名词】
    phonetic: shi1
    tags:
      - 高中
    samples:
      - trans: 恩惠;好处。
        sentences:
          - ancient: 楚有三施，我有三怨，怨雠已多，将何以战？（《左传•僖公二十八年》）
          - ancient: 君（指秦穆公）有<施>于晋君,晋君无<施>于其众。（《国语•晋落三》）

  - word: 施
    type: 【动词】
    phonetic: shi1
    tags:
      - 高中
    samples:
      - trans: ❶散布。
        sentences:
          - ancient: 云行雨施，品物流形。（《周易•乾卦》）
          - ancient: 其生色也,睟然（睟sui4,润泽）见于面，盎于背，施于四体。（《孟子•点心上》）
      - trans: ❷摆列;安放。
        sentences:
          - ancient: 施薪若一，火就燥也。（《荀子•劝学》）
          - ancient: 中有都柱,傍行八道，施关发机。（《张衡传》）
          - ancient: 于厅事之东北角，施八尺屏障。（《口技》）
      - trans: ❸推行;实行。
        sentences:
          - ancient: 己所不欲，勿施于人。（《论语•颜渊》）
          - ancient: 仁义不施而攻守之势异也。（《过秦论》）
          - ancient: 时北兵已迫修门外，战、守、迁皆不及施。（《〈指南录〉后序》）
          - ancient: 愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。（《出师表》）
      - trans: ❹加;施加。
        sentences:
          - ancient: 古人所以重施刑于大夫者，殆为此也。（《报任安书》）
      - trans: ❺用。
        sentences:
          - ancient: 妾不堪驱使，徒留无所施，便可白公姥，及时相遣归。（《孔雀东南飞》）
      - trans: ❻给予。
        sentences:
          - ancient: （苏）武所得赏赐，尽以施予昆弟（兄和弟）故人。（《汉书•苏武传》）
          - ancient: 人贱物亦鄙，不足迎后人，留待作遗施,于今无会因。（《孔雀东南飞》）
      - trans: ❼陈尸示众。
        sentences:
          - ancient: 及文公入，秦人杀冀芮而施之。（《国语•楚语上》）