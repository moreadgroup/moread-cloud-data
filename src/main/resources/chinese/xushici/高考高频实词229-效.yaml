---
words:
  - word: 效
    type: 【名词】
    phonetic: xiao4
    tags:
      - 高中
    samples:
      - trans: ❶征验;效果。
        sentences:
          - ancient: 是故燕虽小国而后亡，斯用兵之<效>也。（《六国论》）
            url: xxxx
            vernacular: 因此燕虽然是个小国，却后来才灭亡，这就是用兵抗秦的效果。
          - ancient: "如今之紫草，未花时采则根色鲜泽，过而釆则根色暗恶，此其<效>也。（《梦溪笔谈•药议》）"
            url: xxxx
            vernacular: 如现在用的紫草根，未开花时采集的就颜色鲜亮有光泽，花谢了之后再采集的就颜色黯淡而粗糙，这就是证明。
      - trans: ❷任务。
        sentences:
          - ancient: 愿陛下托臣以讨贼兴复之<效>，不效，则治臣之罪。（《出师表》）
            url: xxxx
            vernacular: 希望陛下能够把讨伐曹魏，兴复汉室的任务托付给我，若不能完成，就治我的罪
  - word: 效
    type: 【动词】
    phonetic: xiao4
    tags:
      - 高中
    samples:
      - trans: ❶模仿;效法。
        sentences:
          - ancient: 他植者虽窥伺<效>慕，莫能如也。（《种树郭橐驼传》）
            url: xxxx
            vernacular: 其他种树的人即使暗中观察、羡慕效仿，也没有谁能比得上。
          - ancient: 孟尝高洁，空余报国之情;阮籍猖狂，岂<效>穷途之哭？（《滕王阁序》）
            url: xxxx
            vernacular: 孟尝君心地高洁，但白白地怀抱着报国的热情；阮籍为人放纵不羁，我们怎能学他那种穷途的哭泣！
      - trans: ❷取得成效。
        sentences:
          - ancient: 吾家读书久不<效>，儿之成，则可待乎！（《项脊轩志》）
            url: xxxx
            vernacular: xxxx
          - ancient: 愿陛下托臣以讨贼兴复之效，不<效>，则治臣之罪，以告先帝之灵。（《出师表》）
            url: xxxx
            vernacular: 希望陛下能够把讨伐曹魏，兴复汉室的任务托付给我，若不能完成，就治我的罪，（从而）用来告慰先帝的在天之灵。
          - ancient: 受命以来，夙夜（日夜）忧叹，恐托付不<效>，以伤先帝之明。（《出师表》）
            url: xxxx
            vernacular: 接受遗命以来，我日夜忧虑叹息，只怕先帝托付给我的大任不能实现，以致损伤先帝的知人之明
      - trans: ❸献出；呈献。
        sentences:
          - ancient: 性贪而狠，党（同伙）豺为虐，君能除之，固当窥（通"跬"，迈出）左足以<效>微劳，又肯讳之而不言哉？（《中山狼传》）
            url: xxxx
            vernacular: 生性贪婪而凶狠，和豺为伍作恶，您能除掉它，本就应当尽力以效微劳，又怎么会隐藏它而不说呢！
          - ancient: 今得杀身自<效>，虽蒙斧钺汤镬，诚甘乐之。（《苏武传》）
            url: xxxx
            vernacular: 现在得到牺牲自己以效忠国家的机会，即使受到斧钺和汤镬这样的极刑，我也心甘情愿。
          - ancient: 则智者尽其谋，勇者竭其力，仁者播其惠，信者<效>其忠。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 那么有智慧的人就能充分献出他的谋略，勇敢的人就能完全使出他的力量，仁爱的人就能散播他的恩惠，诚信的人就能献出他的忠诚。
      - trans: ❹交出；授予。
        sentences:
          - ancient: 司城荡意诸来奔，<效>节于府人而出。（《左传•文公八年》）
            url: xxxx
            vernacular: 司城荡意诸逃亡前来，把符节还给府人然后出去。
      - trans: ❺验证。
        sentences:
          - ancient: 何以<效>之？（《论衡•订鬼》）
            url: xxxx
            vernacular: 用什么来验证呢?
      - trans: ❻胜任。
        sentences:
          - ancient: "故夫知<效>一官，行比一乡，德合一君，而征一国者，其自视也，亦若此矣。（《逍遥游》）"
            url: xxxx
            vernacular: 同样地，那些才智胜任一个官职、能力在一乡中优秀出众、德行能投合一个君王的心意的，能力能够取得全国信任的，他们看待自己时，其实也像斥鴳的见识
