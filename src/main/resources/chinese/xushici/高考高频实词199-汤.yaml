汤tang1
【名词】❶热水;开水。
【例句】日初出沧沧凉凉，及其日中如探汤,此不为近者热而远者凉乎？（《两小儿辩日》）丨至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和（暖和过来）。（《送东阳马生序》）丨臣知欺大王之罪当诛，臣请就（赴）汤镬。（《廉颇蔺相如列传》）
❷中药加水煎制而成的汤剂。
【例句】更适阴阳,但服汤二旬而复故。（《史记•扁鹊仓公列传》）丨而刘夙婴（患）疾病,常在床蓐（同"褥"，病席）,臣侍汤药，未曾废离。（《陈情表》）
❸商朝第一个君王。
【例句】汤之时，八年七旱,而崖不加损。（《秋水》）丨上称帝誉，下道齐桓，中述汤武，以刺世事。（《史记•屈原贾生列传》）

【高考题例】禹、汤罪己,其兴也勃焉。（《旧唐书•于休烈传》）