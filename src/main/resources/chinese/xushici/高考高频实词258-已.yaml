已yi3
【动词】❶停止。
【例句】君子曰:学不可以已。（《劝学》）丨且燕赵处秦革灭殆尽之际,可谓智力孤危，战败而亡，诚不得已。（《六国论》）
【高考题例】诏降一级致仕，瑾恨未已，坐以遗失部籍,逮文下诏狱。（《明史•韩文传》）	
❷制止。
【例句】且舜救败，期年已一过，三年已三过。（《韩非子•难一》）
❸治愈;消除。
【例句】然得而腊之以为饵，可以已大风、挛踠（手足弯曲不能伸）、瘘、疠（疫病），去死肌，杀三虫。（《捕航者说》）
❹算了罢了。
【例句】且壮士不死即已，死即举大名耳。（《陈涉世家》）丨闻道有先后，术业有专攻，如是而已。（《师说》）丨已矣乎！寓形宇内复几时？曷不委心任去留？（《归去来兮辞》）丨我决起而飞，抢榆枋而止，时则不至，而控于地而已矣。（《逍遥游》）丨不吾知其亦已兮，苟余情其信芳。（《离骚》）
❺完毕。
【例句】言已大笑，先生亦笑。（《中山狼传》）丨呜乎！胜地不常，盛筵难再，兰亭已矣，梓泽丘墟。（《滕王阁序》）丨既已，无可奈何,乃遂收盛樊於期之首，函封之。（《荆轲刺秦王》）
❻过去;已往。
【例句】夫三代之所以长久者，其已事可知也。（汉•贾谊《陈政事疏》）
❼离开;罢免。
【例句】令尹子文三仕为令尹，无喜色；三已之，无愠色。（《论语•公冶长》）
❽重视并实行。
【例句】喜任侠，已然诺。（《汉书•窦田灌韩传》）

【副词】❶表示动作完成或时间过去。已经。
【例句】舟已行矣，而剑不行，求剑若此，不亦惑乎？（《吕氏春秋•察今》）丨其巫，老女子也，已年七十。（汉•褚少孙《西门豹治邺》）丨故不战而强弱胜负已判矣。（《六国论》）丨沛公已去，间至军中。（《鸿门宴》）
❷表示前后承接，时间相隔短暂。随即;不久就。
【例句】韩王成无军功，项王不使之国，与俱至彭城，废以为侯，已又杀之。（《史记•项羽本纪》）丨庭中始为篱，已为墙，凡再变矣。（《项脊轩志》）
【高考题例】已,又上吏部职掌十事。帝悉褒纳。（《明史•马文升传》）	：
❸表示程度很高或过分。太;过于。
【例句】不亦待其身者已廉乎！（唐•韩愈《原毁》）丨夫十有—月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣；况草野无闻者欤？（《五人墓碑记》）

【连词】通"以"。表示时间、方位、数量的界限。
【例句】自董卓已来，豪杰并起，跨州连郡者不可胜数。（《隆中对》）丨自今已往，吾其无意（没有心思）于人世矣！（《祭十二郎文》）
【助词】用法同"矣"，用在句末，表示对所述事实的确信不疑。相当于"了"。
【例句】苟无恒心，放辟邪侈，无不为已。（《齐桓晋文之事》）丨臣之壮也，犹不如人;今老矣，无能为也已。（《烛之武退秦师》）