---
words:
  - word: 已
    type: 【动词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: ❶停止。
        sentences:
          - ancient: 君子曰:学不可以已。（《劝学》）
          - ancient: 且燕赵处秦革灭殆尽之际,可谓智力孤危，战败而亡，诚不得已。（《六国论》）
          - ancient: 【高考题例】诏降一级致仕，瑾恨未已，坐以遗失部籍,逮文下诏狱。（《明史•韩文传》）
      - trans: ❷制止。
        sentences:
          - ancient: 且舜救败，期年<已>一过，三年<已>三过。（《韩非子•难一》）
      - trans: ❸治愈;消除。
        sentences:
          - ancient: 然得而腊之以为饵，可以已大风、挛踠（手足弯曲不能伸）、瘘、疠（疫病），去死肌，杀三虫。（《捕航者说》）
      - trans: ❹算了罢了。
        sentences:
          - ancient: 且壮士不死即已，死即举大名耳。（《陈涉世家》）
          - ancient: 闻道有先后，术业有专攻，如是而已。（《师说》）
          - ancient: 已矣乎！寓形宇内复几时？曷不委心任去留？（《归去来兮辞》）
          - ancient: 我决起而飞，抢榆枋而止，时则不至，而控于地而已矣。（《逍遥游》）
          - ancient: 不吾知其亦已兮，苟余情其信芳。（《离骚》）
      - trans: ❺完毕。
        sentences:
          - ancient: 言已大笑，先生亦笑。（《中山狼传》）
          - ancient: 呜乎！胜地不常，盛筵难再，兰亭已矣，梓泽丘墟。（《滕王阁序》）
          - ancient: 既已，无可奈何,乃遂收盛樊於期之首，函封之。（《荆轲刺秦王》）
      - trans: ❻过去;已往。
        sentences:
          - ancient: 夫三代之所以长久者，其已事可知也。（汉•贾谊《陈政事疏》）
      - trans: ❼离开;罢免。
        sentences:
          - ancient: 令尹子文三仕为令尹，无喜色；三已之，无愠色。（《论语•公冶长》）
      - trans: ❽重视并实行。
        sentences:
          - ancient: 喜任侠，已然诺。（《汉书•窦田灌韩传》）

  - word: 已
    type: 【副词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: ❶表示动作完成或时间过去。已经。
        sentences:
          - ancient: 舟已行矣，而剑不行，求剑若此，不亦惑乎？（《吕氏春秋•察今》）
          - ancient: 其巫，老女子也，已年七十。（汉•褚少孙《西门豹治邺》）
          - ancient: 故不战而强弱胜负已判矣。（《六国论》）
          - ancient: 沛公已去，间至军中。（《鸿门宴》）
      - trans: ❷表示前后承接，时间相隔短暂。随即;不久就。
        sentences:
          - ancient: 韩王成无军功，项王不使之国，与俱至彭城，废以为侯，已又杀之。（《史记•项羽本纪》）
          - ancient: 庭中始为篱，已为墙，凡再变矣。（《项脊轩志》）
          - ancient: 【高考题例】已,又上吏部职掌十事。帝悉褒纳。（《明史•马文升传》）	：
      - trans: ❸表示程度很高或过分。太;过于。
        sentences:
          - ancient: 不亦待其身者已廉乎！（唐•韩愈《原毁》）
          - ancient: 夫十有—月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣；况草野无闻者欤？（《五人墓碑记》）

  - word: 已
    type: 【连词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: 通"以"。表示时间、方位、数量的界限。
        sentences:
          - ancient: 自董卓已来，豪杰并起，跨州连郡者不可胜数。（《隆中对》）
          - ancient: 自今已往，吾其无意（没有心思）于人世矣！（《祭十二郎文》）

  - word: 已
    type: 【助词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: 用法同"矣"，用在句末，表示对所述事实的确信不疑。相当于"了"。
        sentences:
          - ancient: 苟无恒心，放辟邪侈，无不为已。（《齐桓晋文之事》）
          - ancient: 臣之壮也，犹不如人;今老矣，无能为也已。（《烛之武退秦师》）