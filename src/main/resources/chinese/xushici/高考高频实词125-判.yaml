判pan4
【名词】❶唐宋官制。通常指以高官兼任较低职位的官。
【例句】唐承隋制，至天授中始有试官之格，又有员外之置，寻为检校、试、摄、判、知之名。（《宋史•职官志一》）丨国初,曹翰以观察使判颍州，是以四品临五品州也。（宋•宋敏求《春明退朝录》卷中）
❷判官，地方长官的僚属，佐理政事。
【例句】车前八个天曹判（天上的判官），车后若干递送夫。
（元•睢景臣《高粗还乡》）
❸判决案件的判词。
【例句】南山或可改移，此判终无摇动。（《旧唐书•李元紘传》）

【动词】❶分离;分开。
【例句】遂判为十二，合为七国。（唐•柳宗元《封建论》）
❷分辨；区分。
【例句】判天地之美,析万物之理。（《庄子•天下》）丨故不战而强弱胜负已判矣。（《六国论》）
❸评判;特指裁决诉讼。
【例句】其有争讼，辄求判正。（《后汉书•陈宴传》）丨叔父肇之，坐事系狱，七年不判。（《宋书•许昭先传》）