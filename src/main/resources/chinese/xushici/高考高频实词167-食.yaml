食㊀shi2
【名词】❶食物;吃的东西。
【例句】美其服，饱其食，洁其居,而摩厉（同"磨砺"，切磋）之于义。（《勾践灭吴》）丨卖炭得钱何所营？身上衣裳口中食。（唐•白居易《卖炭翁》）丨武既至海上，廩食（公家供给的口粮）不至。（《苏武传》）
❷粮食。
【例句】夫定国之术，在于强兵足食。（汉•曹操《置屯田令》）
❸俸禄。
【例句】岁终，则稽其医事，以制其食。（《周礼•天官•医师》）丨且出怨言，不食（接受）其食（俸禄）。（《介之推不言禄》）

【动词】❶吃。
【例句】修春秋冬夏之常祭，食天壤山川之故祀，必以时。（《管子•幼官》）丨见其生，不忍见其死；闻其声，不忍食其肉。（《齐桓晋文之事》）丨桑之未落，其叶沃若。于嗟鸠兮,无食桑葚！（《诗经•卫风•氓》）丨蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。（《劝学》）
❷祭祀。
【例句】至今血食。（《陈涉世家》）
❸垦殖。
【例句】我死，则择不食之地而葬我焉。（《礼记•檀弓上》）
❹通"蚀"。日月亏缺或完全不见的现象。
【例句】君子之过也，如日月之食焉。过也，人皆见之；更（改正）也，人皆仰之。（《论语•子张》）
❺接受;享用。
【例句】不食其禄。（《史记•晋世家》）


食㊁si4
【动词】同"饲"。给吃;喂养。
【例句】左右以君贱之也，食以草具（粗劣的食物）。（《冯谖客孟尝君》）丨<食>马者不知其能芋里而<食>也。（《马说》）丨有粮者亦<食>,无粮者亦<食>。（《赵威后问齐使》）