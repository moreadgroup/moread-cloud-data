---
words:
  - word: 食
    type: 【名词】
    phonetic: shi2
    tags:
      - 高中
    samples:
      - trans: ❶食物;吃的东西。
        sentences:
          - ancient: 美其服，饱其食，洁其居,而摩厉（同"磨砺"，切磋）之于义。（《勾践灭吴》）
          - ancient: 卖炭得钱何所营？身上衣裳口中食。（唐•白居易《卖炭翁》）
          - ancient: 武既至海上，廩食（公家供给的口粮）不至。（《苏武传》）
      - trans: ❷粮食。
        sentences:
          - ancient: 夫定国之术，在于强兵足食。（汉•曹操《置屯田令》）
      - trans: ❸俸禄。
        sentences:
          - ancient: 岁终，则稽其医事，以制其食。（《周礼•天官•医师》）
          - ancient: 且出怨言，不食（接受）其<食>（俸禄）。（《介之推不言禄》）

  - word: 食
    type: 【动词】
    phonetic: shi2
    tags:
      - 高中
    samples:
      - trans: ❶吃。
        sentences:
          - ancient: 修春秋冬夏之常祭，食天壤山川之故祀，必以时。（《管子•幼官》）
          - ancient: 见其生，不忍见其死；闻其声，不忍食其肉。（《齐桓晋文之事》）
          - ancient: 桑之未落，其叶沃若。于嗟鸠兮,无食桑葚！（《诗经•卫风•氓》）
          - ancient: 蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。（《劝学》）
      - trans: ❷祭祀。
        sentences:
          - ancient: 至今血食。（《陈涉世家》）
      - trans: ❸垦殖。
        sentences:
          - ancient: 我死，则择不食之地而葬我焉。（《礼记•檀弓上》）
      - trans: ❹通"蚀"。日月亏缺或完全不见的现象。
        sentences:
          - ancient: 君子之过也，如日月之食焉。过也，人皆见之；更（改正）也，人皆仰之。（《论语•子张》）
      - trans: ❺接受;享用。
        sentences:
          - ancient: 不食其禄。（《史记•晋世家》）


  - word: 食
    type: 【动词】
    phonetic: si4
    tags:
      - 高中
    samples:
      - trans: 同"饲"。给吃;喂养。
        sentences:
          - ancient: 左右以君贱之也，<食>以草具（粗劣的食物）。（《冯谖客孟尝君》）
          - ancient: <食>马者不知其能芋里而<食>也。（《马说》）
          - ancient: 有粮者亦<食>,无粮者亦<食>。（《赵威后问齐使》）