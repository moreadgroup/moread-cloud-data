异yi4
【名词】奇特之处。
【例句】成述其异。（《促织》）

【动词】❶分开。
【例句】其兄弟本来异居曾经分析（分开）者，不在此限。（《旧唐书•食货志上》）丨假令仆伏法受诛，若九牛亡一毛，与蜷蚁何以异？（《报任安书》）
❷惊奇;诧异。
【例句】今年九月二十八日，因坐法华西亭，望西山，始指异之。（《始得西山宴游记》）丨渔人甚异之，复前行，欲穷其林。（《桃花源记》）丨父异然，借旁近与之。（《伤仲永》）
【高考题例】所继叔父混名知人，见而异之。（《宋书•谢弘微传》）
❸变化。
【例句】然而成败异变，功业相反,何也？（《过秦论》）丨仁义不施而攻守之势异也。（《过秦论》）

【形容词】❶不同；差别。
【例句】不宜偏私，使内外异法也。（《出师表》）丨而议事每不合，所操之术多异故也。（宋•王安石《答司马谏议书》）丨是（这）何异于刺人而杀之曰"非我也，兵也"？（《寡人之于,国也》）丨人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。（《报任安书》）
【高考题例】东西异路，不当与,然安忍于旧治坐视？（《宋史・萧燧传》）
❷奇特;特殊。
【例句】太后笑曰：""妇人异甚！"（《触龙说赵太后》）丨永州之野产异蛇，黑质（质地）而白章（花纹）。（《捕蛇者说》）丨以为凡是州之山水有异态者，旨我有也，而未始知西山之怪特。（《始得西山宴游记》）
❸优异;杰出。
【例句】无何,宰以卓异闻。（《促织》）
❹别的;另外的。
【例句】，异时（他日）倘得脱颖而出，先生之恩，生死而肉骨也，敢不努力以效龟蛇之诚？（《中山狼传》）丨欲以树艺佐其急,且备异日也。（明•徐光启《甘薯疏序》）丨异日图将好景,归去凤池夸。（宋•柳永《望海潮》）
