---
words:
  - word: 异
    type: 【名词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: 奇特之处。
        sentences:
          - ancient: 成述其异。（《促织》）

  - word: 异
    type: 【动词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶分开。
        sentences:
          - ancient: 其兄弟本来异居曾经分析（分开）者，不在此限。（《旧唐书•食货志上》）
          - ancient: 假令仆伏法受诛，若九牛亡一毛，与蜷蚁何以异？（《报任安书》）
      - trans: ❷惊奇;诧异。
        sentences:
          - ancient: 今年九月二十八日，因坐法华西亭，望西山，始指异之。（《始得西山宴游记》）
          - ancient: 渔人甚异之，复前行，欲穷其林。（《桃花源记》）
          - ancient: 父异然，借旁近与之。（《伤仲永》）
          - ancient: 【高考题例】所继叔父混名知人，见而异之。（《宋书•谢弘微传》）
      - trans: ❸变化。
        sentences:
          - ancient: 然而成败异变，功业相反,何也？（《过秦论》）
          - ancient: 仁义不施而攻守之势异也。（《过秦论》）

  - word: 异
    type: 【形容词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶不同；差别。
        sentences:
          - ancient: 不宜偏私，使内外异法也。（《出师表》）
          - ancient: 而议事每不合，所操之术多异故也。（宋•王安石《答司马谏议书》）
          - ancient: 是（这）何异于刺人而杀之曰"非我也，兵也"？（《寡人之于,国也》）
          - ancient: 人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。（《报任安书》）
          - ancient: 【高考题例】东西异路，不当与,然安忍于旧治坐视？（《宋史・萧燧传》）
      - trans: ❷奇特;特殊。
        sentences:
          - ancient: 太后笑曰：""妇人异甚！"（《触龙说赵太后》）
          - ancient: 永州之野产异蛇，黑质（质地）而白章（花纹）。（《捕蛇者说》）
          - ancient: 以为凡是州之山水有异态者，旨我有也，而未始知西山之怪特。（《始得西山宴游记》）
      - trans: ❸优异;杰出。
        sentences:
          - ancient: 无何,宰以卓异闻。（《促织》）
      - trans: ❹别的;另外的。
        sentences:
          - ancient: ，异时（他日）倘得脱颖而出，先生之恩，生死而肉骨也，敢不努力以效龟蛇之诚？（《中山狼传》）
          - ancient: 欲以树艺佐其急,且备异日也。（明•徐光启《甘薯疏序》）
          - ancient: 异日图将好景,归去凤池夸。（宋•柳永《望海潮》）
