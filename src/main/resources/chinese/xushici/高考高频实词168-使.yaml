使Shi3
、【名词】❶派往别国办理交涉的官员;使者。
【例句】大王遣一介之使至赵，赵立奉璧来。（《廉颇蔺相如列传》）丨一车炭，千余斤，宫使驱将惜不得。（唐•白居易《卖炭翁》）丨时汉连伐胡，数通使相窥观。（《苏武传》）
❷使命。
【例句】时周瑜受使至番阳。（《资治通鉴•汉纪五十七》）
❸朝廷派往地方负责某种政务的官员。如"转运使""节度使"等。【动词】❶命令;派遣。
【例句】乃使蒙恬北筑长城而守藩篱。（《过秦论》）丨秦昭王闻之，使人遗赵王书。（《廉颇蔺相如列传》）丨使杞子、逢孙、杨孙戍之,乃还。（《烛之武退秦师》）丨沛公已出，项王使都尉陈平召沛公。（《鸿门宴》）
❷令;让。
【例句】不如因而厚遇（优厚的待遇）之，使归赵。（《廉颇蔺相如列传》）丨安能摧眉折腰事权贵，使我不得开心颜？（《梦游天姥吟留别》）丨虽有槁暴，不复挺者，輮使之然也。（《劝学》）丨谷与鱼鳖不可胜食，材木不可胜用，是使民养生丧死无憾也。（《寡人之于国也》）丨试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。（《过秦论》）
❸使用；支配。
【例句】尚贤使能。（《荀子•王制》）丨受母钱帛多，不堪母驱使。（《孔雀东南飞》）
❹出使。
【例句】使于四方，不辱君命，可谓士矣。（《论语•子路》）丨是时屈平既疏，不复在位，使于齐。（《史记•屈原贾生列传》）丨宦者令缪贤曰："臣舍人蔺相如可使。"（《廉颇蔺相如列传》）
❺放纵（饮酒）。
【例句】复有人言其勇，使酒难近。（《史记•季布栾布列传》）

【连词】表示假设。假使。
【例句】向使三国各爱其地,齐人勿附于秦，刺客不行……（《六国论》）丨嗟乎！使六国各爱其人,则足以拒秦;使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也?（《阿房宫赋》）
【高考题例】使堤土石幸久不朽，则滕侯之惠利于人物,可以数计哉？（《欧阳文忠公集•偃虹堤记》）
