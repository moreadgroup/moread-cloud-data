---
words:
  - word: 使
    type: 【名词】
    phonetic: Shi3
    tags:
      - 高中
    samples:
      - trans: ❶派往别国办理交涉的官员;使者。
        sentences:
          - ancient: 大王遣一介之使至赵，赵立奉璧来。（《廉颇蔺相如列传》）
          - ancient: 一车炭，千余斤，宫使驱将惜不得。（唐•白居易《卖炭翁》）
          - ancient: 时汉连伐胡，数通使相窥观。（《苏武传》）
      - trans: ❷使命。
        sentences:
          - ancient: 时周瑜受使至番阳。（《资治通鉴•汉纪五十七》）
      - trans: ❸朝廷派往地方负责某种政务的官员。如"转运使""节度使"等。

  - word: 使
    type: 【动词】
    phonetic: Shi3
    tags:
      - 高中
    samples:
      - trans: ❶命令;派遣。
        sentences:
          - ancient: 乃使蒙恬北筑长城而守藩篱。（《过秦论》）
          - ancient: 秦昭王闻之，使人遗赵王书。（《廉颇蔺相如列传》）
          - ancient: 使杞子、逢孙、杨孙戍之,乃还。（《烛之武退秦师》）
          - ancient: 沛公已出，项王使都尉陈平召沛公。（《鸿门宴》）
      - trans: ❷令;让。
        sentences:
          - ancient: 不如因而厚遇（优厚的待遇）之，使归赵。（《廉颇蔺相如列传》）
          - ancient: 安能摧眉折腰事权贵，使我不得开心颜？（《梦游天姥吟留别》）
          - ancient: 虽有槁暴，不复挺者，輮使之然也。（《劝学》）
          - ancient: 谷与鱼鳖不可胜食，材木不可胜用，是使民养生丧死无憾也。（《寡人之于国也》）
          - ancient: 试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。（《过秦论》）
      - trans: ❸使用；支配。
        sentences:
          - ancient: 尚贤使能。（《荀子•王制》）
          - ancient: 受母钱帛多，不堪母驱使。（《孔雀东南飞》）
      - trans: ❹出使。
        sentences:
          - ancient: 使于四方，不辱君命，可谓士矣。（《论语•子路》）
          - ancient: 是时屈平既疏，不复在位，使于齐。（《史记•屈原贾生列传》）
          - ancient: 宦者令缪贤曰："臣舍人蔺相如可使。"（《廉颇蔺相如列传》）
      - trans: ❺放纵（饮酒）。
        sentences:
          - ancient: 复有人言其勇，使酒难近。（《史记•季布栾布列传》）

  - word: 使
    type: 【连词】
    phonetic: Shi3
    tags:
      - 高中
    samples:
      - trans: 表示假设。假使。
        sentences:
          - ancient: 向使三国各爱其地,齐人勿附于秦，刺客不行……（《六国论》）
          - ancient: 嗟乎！<使>六国各爱其人,则足以拒秦;<使>秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也?（《阿房宫赋》）
          - ancient: 【高考题例】使堤土石幸久不朽，则滕侯之惠利于人物,可以数计哉？（《欧阳文忠公集•偃虹堤记》）
