---
words:
  - word: 克
    type: 【动词】
    phonetic: ke4
    tags:
      - 高中
    samples:
      - trans: ❶能够;胜任。
        sentences:
          - ancient: 凡昔元首（君主），承天景命（大命，所谓上天授予王位之命），善始著实繁，克终者盖寡。（《谏太宗十思疏》）
          - ancient: 汝之纯明而不克蒙其泽乎？（《祭十二郎文》）
      - trans: ❷战胜;攻下。
        sentences:
          - ancient: 夫一人奋死，可以对十，十可以对百，百可以对千，千可以对万，万可以克天下矣。（《韩非子•初见秦》）
          - ancient: 以此攻城，何城不克！（《左传•僖公四年》）
          - ancient: 既克，公问其故。（《曹刿论战》）
      - trans: ❸完成。
        sentences:
          - ancient: 日中而克葬。（《左传•宣公八年》）
      - trans: ❹克制;克服。
        sentences:
          - ancient: 奉公克己，矜恤孤羸（lei2，瘦弱）。（《后汉书•周泽传》）
      - trans: ❺好胜;忌刻。
        sentences:
          - ancient: 无好无恶，不忌不克之谓也。（《左传•僖公九年》）
          - ancient: 吾知绍之为人，志大而智小，色厉而胆薄，忌克而少威。（《三国志•魏书•武帝纪》）
      - trans: ❻通"刻"。铭刻。
        sentences:
          - ancient: 谨以克心，非但书诸绅也。（《三国志•吴书•贺齐传》）
      - trans: ❼通"剋"。约定（日期）。
        sentences:
          - ancient: 公乃与克日会战。（《三国志•魏书•武帝纪》）
