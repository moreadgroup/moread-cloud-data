属©shu3
【名词】❶官属;部属。
【例句】以安其属。（唐•柳宗元《封建论》）
❷亲属。
【例句】周文武（周文王、周武王）所封子弟同姓甚众，然后属疏远，相攻击如仇雠（仇敌）。（《史记•秦始皇本纪》）丨本无谋，又非亲属，何胃相坐？（《苏武传》）
❸等;辈。
【例句】不（通"否"）者，若属（你们）皆且为所虏!（《鸿门宴》）丨有宁越、徐尚、苏秦、杜赫之属为（替）之谋。（《过秦论》）
【高考题例】绛、灌、东阳侯、冯敬之属尽害之。（《史记•屈原贾生列传》）	
❹类。
【例句】忠之属也。可以一战。（《曹刿论战》）丨土地平旷，屋舍俨然（整齐的样子），有良田、美池、桑竹之属。（《桃花源记》）

【动词】❶隶属;归属。	属
【例句】十三学得琵琶成，名属教坊第一部。（《琵琶行》）丨时维九月，序属三秋。（《滕王阁序》）
❷掌管。
【例句】在骨髓，司命之所属，无奈何也。（《韩非子•喻老》）

属㊁zhu3
【动词】❶连接;跟随。
【例句】平原君使者冠盖相属于魏。（《史记•魏公子列传》）
❷交付;委托。
【例句】今王之地方（方圆）五千里，带甲百万，而专属之昭奚恤。（《战国策•楚策一》）
【高考题例】国珍弟平章事，有人犯法，属鼎治，鼎论如法。（明•方孝孺《詹鼎传》）	
❸通""嘱"。嘱托。
【例句】属予作文以记之。（《岳阳楼记》）丨使人属孟尝君,愿寄食门下。（《冯谖客孟尝君》）
【高考题例】文日："主少国疑，大臣未附，百姓不信，方是之时，属之于子乎？属之于我乎?"起默然良久，日："属之子矣。.（《史记•孙子吴起列传》）丨丞相有子就举，欲以属公。（《宋史•萧燧传》）
❹聚集;集合。
【例句】乃属其耆老（耆qi2老年人）而告之。（《孟子•梁惠王下》）
❺起草;撰写。
【例句】怀王使屈原造为宪令，屈平属草稿未定，上官大夫见而欲夺之，屈平不与。（《史记•屈原贾生列传》）丨衡少善属文，游于三辅，因入京师。（《张衡传》）
【高考题例】贾生名谊，洛阳人也。年十八，以能诵诗属书闻于郡中。（《史记•屈原贾生列传》）丨自幼好学，善属文。（《旧唐书•于休烈传》）
❻劝;请。
【例句】驾一叶之扁舟，举匏樽（匏pao2，用葫芦做成的酒杯）以相属。（《赤壁赋》）丨举酒属客，诵明月之诗，歌窈窕之章。（《赤壁赋》）
❼倾注。
【例句】酌玄酒，三属于尊。（《仪礼•士昏礼》）


【副词】❶表示恰逢某种情况。相当于"适值""正当"。
【例句】吾子属当重任，曾不能明道处分，以义辅时,而负恃弱众以图力争，师曲为老，将何获济？（《三国志•吴书•鲁肃传》）
❷表示刚刚达到某种程度。相当于"刚刚"。
【例句】天下属安定，何故反乎？（《史记•留侯世家》）