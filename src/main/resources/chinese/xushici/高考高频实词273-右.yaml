右you4
【名词】❶右边（与"左"相对）。
【例句】盖余所至，比好游者尚不能十一（十分之一），然视其左右，来而记之者已少。（《游褒禅山记》）丨旁开小窗，左右各四，共八扇。（《核舟记》）
❷右手。
【例句】左准绳，右规矩，载四时，以开九州，通九道，陂九泽，度九山。（《史记•夏本纪》）
一	❸古代地理位置以西为右，以东为左。
【例句】姜伯约（指姜维）屡出陇右。（三国魏•钟会《檄蜀文》）
❹地位在上的。秦汉以前以右为尊，所以右为较尊贵的地位。
【例句】既罢，归国，以相如功大，拜为上卿，位在廉颇之右。（《廉颇蔺相如列传》）丨既入宫中，举天下所贡蝴蝶、螳螂、油利挞、青丝额一切异状遍试之，无出其右者。（《促织》）


【高考题】同列吕連，地望虽悬，政事在揆之右。（《旧唐书•:李揆传》）

❺豪强。
【例句】又多豪右，共为不轨。（《张衡传》）
【高考题例】朝右皆惮之。（《明史•陈登云传》）

【动词】❶尊重;重视。
【例句】守成尚文，遭遇右武。（《史记•平津侯主父列传》）
❷帮助;偏袒。
【例句】衍将右韩而左（反对，疏远）魏。（《战国策•魏策二》）
❸通"侑"。劝人饮酒、吃饭。
【例句】以享右祭祀。（《周礼•春官•大祝》）