---
words:
  - word: 右
    type: 【名词】
    phonetic: you4
    tags:
      - 高中
    samples:
      - trans: ❶右边（与"左"相对）。
        sentences:
          - ancient: 盖余所至，比好游者尚不能十一（十分之一），然视其左<右>，来而记之者已少。（《游褒禅山记》）
            url: xxxx
            vernacular: 大概我们所到达的地方，比起那些喜欢游险的人来，还不足十分之一，然而看看左右的石壁，来此而题记的人已经很少了。
          - ancient: 旁开小窗，左<右>各四，共八扇。（《核舟记》）
            url: xxxx
            vernacular: 旁边开设有小窗，左右各四扇，一共八扇。
      - trans: ❷右手。
        sentences:
          - ancient: 左准绳，<右>规矩，载四时，以开九州，通九道，陂九泽，度九山。（《史记•夏本纪》）
            url: xxxx
            vernacular: 测定平直的水准和绳墨，划定图式的圆规和方矩
      - trans: ❸古代地理位置以西为右，以东为左。
        sentences:
          - ancient: 姜伯约（指姜维）屡出陇<右>。（三国魏•钟会《檄蜀文》）
            url: xxxx
            vernacular: 姜维多次从陇西出兵。
      - trans: ❹地位在上的。秦汉以前以右为尊，所以右为较尊贵的地位。
        sentences:
          - ancient: 既罢，归国，以相如功大，拜为上卿，位在廉颇之<右>。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 渑池会结束以后，回到赵国，由于蔺相如功劳大，被封为上卿，官位在廉颇之上。
          - ancient: 既入宫中，举天下所贡蝴蝶、螳螂、油利挞、青丝额一切异状遍试之，无出其<右>者。（《促织》）
            url: xxxx
            vernacular: 到了宫里后，凡是全国贡献的蝴蝶、螳螂、油利挞、青丝额及各种稀有的蟋蟀，都与（小蟋蟀）斗过了，没有一只能占它的上风。
          - ancient: 【高考题例】同列吕諲(yīn)，地望虽悬，政事在揆之<右>。（《旧唐书•:李揆传》）
            url: xxxx
            vernacular: 同列的宰相吕諲的地位名望虽然与李揆悬殊，但处理政事的能力却在李揆之上。
      - trans: ❺豪强。
        sentences:
          - ancient: 又多豪<右>，共为不轨。（《张衡传》）
            url: xxxx
            vernacular: 又有很多豪族大户，豪门大户他们一起胡作非为。
          - ancient: 【高考题例】朝<右>皆惮之。（《明史•陈登云传》）
            url: xxxx
            vernacular: xxxx
  - word: 右
    type: 【动词】
    phonetic: you4
    tags:
      - 高中
    samples:
      - trans: ❶尊重;重视。
        sentences:
          - ancient: 守成尚文，遭遇<右>武。（《史记•平津侯主父列传》）
            url: xxxx
            vernacular: 守成：守住先人已得的成功事业。尚文：崇尚文德教化。遭遇：指遇到祸患。右武：崇尚武功。
      - trans: ❷帮助;偏袒。
        sentences:
          - ancient: 衍将<右>韩而左（反对，疏远）魏。（《战国策•魏策二》）
            url: xxxx
            vernacular: 公孙衍亲近韩国而疏远魏国。
      - trans: ❸通"侑"。劝人饮酒、吃饭。
        sentences:
          - ancient: 以享<右>祭祀。（《周礼•春官•大祝》）
            url: xxxx
            vernacular: xxxx
