---
words:
  - word: 徒
    type: 【名词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶同类的人。
        sentences:
          - ancient: 郯（tan2）子之徒，其贤不及孔子。（《师说》）
          - ancient: 将出，日与,其徒置酒酣歌达曙。（《狱中杂记》）
          - ancient: 齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意。（《过秦论》）
          - ancient: 【高考题例】击起之徒因射刺吴起，并中悼王。（《史记•孙子吴起列传》）
      - trans: ❷门徒;弟子。
        sentences:
          - ancient: 善教者则不然，视徒如己。（《吕氏春秋•诬徒》）
          - ancient: 仲尼之徒,无道桓、文之事者，是以后世无传焉。（《齐桓晋文之事》）
      - trans: ❸被判服劳役的人。
        sentences:
          - ancient: 被刑之徒比肩而立。（《汉书•路温舒传》）
          - ancient: 当此之时,见狱吏则头枪地，视徒隶则心惕息,何者？（《报任安书》）
      - trans: ❹步兵。
        sentences:
          - ancient: 帅徒以往。（《左传•昭公二十五年》）
          - ancient: 兴徒兵以攻崔苻之盗,尽杀之，盗少止。（《子产论政宽猛》）
      - trans: ❺众人。
        sentences:
          - ancient: 实繁有徒。（《尚书•仲虺之诰》）
      - trans: ❻徒刑。拘禁罪犯，罚做劳役。
        sentences:
          - ancient: 国初立法以来，有笞（chi1,用竹板或荆条打）、杖、徒、流、死之制。（明•陶宗仪《南村辍耕录》卷二）

  - word: 徒
    type: 【动词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: 步行。
        sentences:
          - ancient: 舍车而徒。（《周易•贲卦》）

  - word: 徒
    type: 【形容词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: 空;光。
        sentences:
          - ancient: 布衣之怒，亦免冠徒跣（光脚），以头抢地（撞地）尔。 （《唐雎不辱使命》）

  - word: 徒
    type: 【副词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶徒然；白白地。
        sentences:
          - ancient: 欲予秦，秦城恐不可得，徒见欺。（《廉颇蔺相如列传》）
          - ancient: 妾不堪驱使,徒留无所施。（《孔雀东南飞》）
      - trans: ❷只;仅仅。
        sentences:
          - ancient: 助之长者，揠（ya4,拔）苗者也。非徒无益，而又害之。（《孟子•公孙丑上》）
          - ancient: 而蔺相如徒以口舌为劳,而位居我上。（《廉颇蔺相如列传》）
          - ancient: 顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。（《廉颇蔺相如列传》）
          - ancient: 【高考题例】揆尝以主司取（择取）士，多不考实,徒峻其堤防,索其书策，深昧（违背）求贤之意也。（《旧唐书•李揆传》）
