---
words:
  - word: 徒
    type: 【名词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶同类的人。
        sentences:
          - ancient: 郯（tan2）子之<徒>，其贤不及孔子。（《师说》）
            url: xxxx
            vernacular: 郯子这些人，他们的贤能都比不上孔子。
          - ancient: "将出，日与其<徒>置酒酣歌达曙。（《狱中杂记》）"
            url: xxxx
            vernacular: 出狱以前，一天到晚都和同党喝酒唱歌，有时直闹到天亮。
          - ancient: 齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之<徒>通其意。（《过秦论》）
            url: xxxx
            vernacular: 齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅等人沟通他们的意见。
          - ancient: 【高考题例】击起之<徒>因射刺吴起，并中悼王。（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 攻打吴起的那帮人趁机用箭射吴起，同时也射中了悼王的尸体。
      - trans: ❷门徒;弟子。
        sentences:
          - ancient: 善教者则不然，视<徒>如己。（《吕氏春秋•诬徒》）
            url: xxxx
            vernacular: 善于教育人的老师就不是这样。他们看待学生如同自己一样
          - ancient: "仲尼之<徒>，无道桓、文之事者，是以后世无传焉。（《齐桓晋文之事》）"
            url: xxxx
            vernacular: 孔子这些人中没有讲述齐桓公、晋文公的事情的人，因此后世没有流传。
      - trans: ❸被判服劳役的人。
        sentences:
          - ancient: 是以死人之血流离于市，被刑之<徒>比肩而立，大辟之计岁以万数（《汉书•路温舒传》）
            url: xxxx
            vernacular: 因此死人的血在街上漂流，受刑的人并肩站着，处死刑的人计算起来每年数以万计
          - ancient: "当此之时，见狱吏则头枪地，视<徒>隶则心惕息，何者？（《报任安书》）"
            url: xxxx
            vernacular: 在这种时候，看见狱吏就叩头触地，看见牢卒就恐惧喘息。这是为什么呢？
      - trans: ❹步兵。
        sentences:
          - ancient: 鬷戾曰：「然则救诸！」帅<徒>以往，陷西北隅以入。。（《左传•昭公二十五年》）
            url: xxxx
            vernacular: 鬷戾说：“那么就去救援他吧！”率领手下人前去，攻破西北角进去。
          - ancient: "兴<徒>兵以攻崔苻之盗，尽杀之，盗少止。（《子产论政宽猛》）"
            url: xxxx
            vernacular: 发步兵去攻击沼地的盗贼，将他们全部杀灭，盗贼（才）稍微被遏止。
      - trans: ❺众人。
        sentences:
          - ancient: 简贤附势，实繁有<徒>。（《尚书•仲虺之诰》）
            url: xxxx
            vernacular: 简慢贤明依从权势的，这种人徒众很多。
      - trans: ❻徒刑。拘禁罪犯，罚做劳役。
        sentences:
          - ancient: "国初立法以来，有笞（chi1，用竹板或荆条打）、杖、<徒>、流、死之制。（明•陶宗仪《南村辍耕录》卷二）"
            url: xxxx
            vernacular: 笞：打脊背。 杖：打屁股。 徒：坐牢。 流：流放。 死：处死
  - word: 徒
    type: 【动词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: 步行。
        sentences:
          - ancient: 初九。贲其趾，舍车而<徒>。象曰：舍车而<徒>，义弗乘也。（《周易•贲卦》）
            url: xxxx
            vernacular: 初九：脚穿花鞋，舍车不乘，徒步而行。《象辞》说：舍车不乘，徒步而行，为显示鞋子之美丽，理应不乘车。
  - word: 徒
    type: 【形容词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: 空;光。
        sentences:
          - ancient: 布衣之怒，亦免冠<徒>跣（光脚），以头抢地（撞地）尔。 （《唐雎不辱使命》）
            url: xxxx
            vernacular: 百姓发怒，也不过就是摘掉帽子，光着脚，把头往地上撞罢了。
  - word: 徒
    type: 【副词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶徒然；白白地。
        sentences:
          - ancient: 欲予秦，秦城恐不可得，<徒>见欺。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 如果把宝玉给了秦国，秦国的城邑恐怕不可能得到，白白地被欺骗
          - ancient: "妾不堪驱使，<徒>留无所施。（《孔雀东南飞》）"
            url: xxxx
            vernacular: 我已经受不了你家这样的驱使，徒然留下来也没有什么用处无法再驱驰。
      - trans: ❷只;仅仅。
        sentences:
          - ancient: "助之长者，揠（ya4，拔）苗者也。非<徒>无益，而又害之。（《孟子•公孙丑上》）"
            url: xxxx
            vernacular: 帮助其生长的，就是这位拔苗的人。不但没有益处，反而带来很大的危害。
          - ancient: "而蔺相如<徒>以口舌为劳，而位居我上。（《廉颇蔺相如列传》）"
            url: xxxx
            vernacular: 而蔺相如只不过靠能说会道立了点功，可是他的地位却在我之上
          - ancient: 顾吾念之，强秦之所以不敢加兵于赵者，<徒>以吾两人在也。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 但是我想到，强大的秦国之所以不敢对赵国用兵，就是因为有我们两人在呀。
          - ancient: "【高考题例】揆尝以主司取（择取）士，多不考实，<徒>峻其堤防，索其书策，深昧（违背）求贤之意也。（《旧唐书•李揆传》）"
            url: xxxx
            vernacular: 李揆认为过去主管科考的部门取士，大多不考查他们实际能力，只是提高标准，索查他们读过的书籍，完全违背求取贤才的意图。
