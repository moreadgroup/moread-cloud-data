---
words:
  - word: 狱
    type: 【名词】
    phonetic: yu4
    tags:
      - 高中
    samples:
      - trans: ❶案件;官司。
        sentences:
          - ancient: 小大之<狱>，虽不能察（弄清楚），必以情。（《曹刿论战》）
            url: xxxx
            vernacular: 大大小小的案件，虽然不能件件都了解得清楚，但一定要处理得合情合理。
          - ancient: 渫（xie4卑污）恶吏忍于鬻（yu4，卖）<狱>，无责也。（《狱中杂记》）
            url: xxxx
            vernacular: 那些无耻而恶毒的司法人员贪赃枉法，原不足深责
          - ancient: 【高考题例】一岁断<狱>，不过数十，威风猛于涣，而文理不及之。（《后汉书•王涣传》）
            url: xxxx
            vernacular: 所以一年中要判的案件，不过几十个。任峻在威猛方面超过王涣，但在文德治理方面比不上王涣。
      - trans: ❷监狱;牢房。
        sentences:
          - ancient: "见<狱>吏则头枪（qiang1,撞）地，视徒隶则心惕息（心惊胆战）。（《报任安苹》）"
            url: xxxx
            vernacular: 看见狱吏就叩头触地，看见牢卒就恐惧喘息。
          - ancient: 余在刑部<狱>，见死而由窦（洞）出者，日三四人。（《狱中杂记》）
            url: xxxx
            vernacular: 当我被关在刑部监狱的时候，看见犯人死了，由墙洞里拖出去，平均每天总有三四个
      - trans: ❸罪状;过失。
        sentences:
          - ancient: 有某姓兄弟，以把持公仓，法应立决，<狱>具矣。（《狱中杂记》）
            url: xxxx
            vernacular: 有某姓兄弟因把持公仓入狱，依法应该立时处决，判词都已拟好了
