狱yu4
【名词】❶案件;官司。
【例句】小大之狱，虽不能察（弄清楚），必以情。（《曹刿论战》）丨渫（xie4卑污）恶吏忍于鬻（yu4，卖）狱，无责也。（《狱中杂记》）
【高考题例】一岁断狱，不过数十，威风猛于涣，而文理不及之。（《后汉书•王涣传》）
❷监狱;牢房。
【例句】见狱吏则头枪（qiang1,撞）地，视徒隶则心惕息（心惊胆战）。（《报任安苹》）丨余在刑部狱，见死而由窦（洞）出者，日三四人。（《狱中杂记》）
❸罪状;过失。
【例句】有某姓兄弟，以把持公仓，法应立决，狱具矣。（《狱中杂记》）

