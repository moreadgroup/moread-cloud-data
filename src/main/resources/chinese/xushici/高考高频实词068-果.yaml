---
words:
  - word: 果
    type: 【名词】
    phonetic: guo3
    tags:
      - 高中
    samples:
      - trans: ❶果子;果实。
        sentences:
          - ancient: 民食果蓏（luo3）蚌蛤。（《韩非子•五蠹》）
      - trans: ❷事情的结果。
        sentences:
          - ancient: 无因无果。（唐•柳宗元《东海若》）
  - word: 果
    type: 【动词】
    phonetic: guo3
    tags:
      - 高中
    samples:
      - trans: 成为事实;实现。
        sentences:
          - ancient: 南阳刘子骥，高士也，闻之，欣然规往。未果，寻（不久）病终。（《桃花源记》）
          - ancient: 明年，丞相薨，吾去汴州，汝不果来。（《祭十二郎文》）
          - ancient: 是年，吾佐戎徐州，使取汝者始行，吾又罢去，汝又不果来。（《祭十二郎文》）
  - word: 果
    type: 【形容词】
    phonetic: guo3
    tags:
      - 高中
    samples:
      - trans: ❶充实;饱。
        sentences:
          - ancient: 适莽苍者，三餐而反，腹犹果然。（《逍遥游》）
      - trans: ❷果敢。
        sentences:
          - ancient: 果者临敌不怀生。（《吴子•论将》）
      - trans: ❸果断;坚决。
        sentences:
          - ancient: 言必信，行必果。（《论语•子路》）
          - ancient: 果行，国人皆劝（劝勉）。（《勾践灭吴》）
  - word: 果
    type: 【副词】
    phonetic: guo3
    tags:
      - 高中
    samples:
      - trans: ❶符合预料的情况;果然。
        sentences:
          - ancient: 将尉醉，广故数言欲亡，忿恚（hui4，激怒）尉，令辱之，以激怒其众。尉果笞广。（《陈涝世家》）
          - ancient: 果不如先愿，又非君所详。（《孔雀东南飞》）
      - trans: ❷究竟。
        sentences:
          - ancient: 夫当今生民之患，果安在哉？（《教战守策》）
      - trans: ❸的确。
        sentences:
          - ancient: 若然者，人果有如木之质，而有异木之知（知觉）矣。（《梁书•范缜传》）
      - trans: ❹终于。
        sentences:
          - ancient: 晋侯在外十九年矣，而果得晋国。（《左传•僖公二十八年》）
