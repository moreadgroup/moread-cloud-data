果guo3
【名词】❶果子;果实。
【例句】民食果蓏（luo3）蚌蛤。（《韩非子•五蠹》）
❷事情的结果。
【例句】无因无果。（唐•柳宗元《东海若》）

【动词】成为事实;实现。
【例句】南阳刘子骥,高士也，闻之，欣然规往。未果，寻（不久）病终。（《桃花源记》）丨明年，丞相薨,吾去汴州，汝不果来。（《祭十二郎文》）丨是年，吾佐戎徐州，使取汝者始行,吾又罢去,汝又不果来。（《祭十二郎文》）

【形容词】❶充实;饱。
【例句】适莽苍者，三餐而反，腹犹果然。（《逍遥游》）
❷果敢。
【例句】果者临敌不怀生。（《吴子•论将》）
❸果断;坚决。
【例句】言必信，行必果。（《论语•子路》）丨果行，国人皆劝（劝勉）。（《勾践灭吴》）

【副词】❶符合预料的情况;果然。
【例句】将尉醉，广故数言欲亡，忿恚（hui4,激怒）尉，令辱之,以激怒其众。尉果笞广。（《陈涝世家》）丨果不如先愿,又非君所详。（《孔雀东南飞》）
❷究竟。
【例句】夫当今生民之患，果安在哉？（《教战守策》）
❸的确。
【例句】若然者，人果有如木之质,而有异木之知（知觉）矣。（《梁书•范缜传》）
❹终于。
【例句】晋侯在外十九年矣,而果得晋国。（《左传•僖公二十八年》）
