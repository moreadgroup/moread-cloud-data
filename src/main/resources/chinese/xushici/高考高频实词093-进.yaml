---
words:
  - word: 进
    type: 【动词】
    phonetic: jin4
    tags:
      - 高中
    samples:
      - trans: ❶前进;向前移动（与"退"相对）。
        sentences:
          - ancient: 吾不欲匹夫之勇也,欲其旅<进>旅退（一同前进，一同后退）。（《勾践灭吴》）
          - ancient: 奉事循公姥，进止敢自专？（《孔雀东南飞》）
          - ancient: 余与四人拥火以入，入之愈深，其进愈难，而其见愈奇。（《游褒禅山记》）
          - ancient: 秦人开关延敌，九国之师，逡巡而不敢进。（《过秦论》）
      - trans: ❷使……前进。
        sentences:
          - ancient: 孔子退，揖巫马期（孔子的学生）而进之。（《论语・述而》）
      - trans: ❸进步;长进。
        sentences:
          - ancient: 君子敬其在己者，而不慕其在天者，是以日进也。（《荀子•天论》）
          - ancient: 孔子学鼓琴师襄子，十日不进。（《史记•孔子世家》）
      - trans: ❹超过;超出。
        sentences:
          - ancient: 臣之所好者道也，进乎技矣。（《庖丁解牛》）
      - trans: ❺进献;献上。
        sentences:
          - ancient: 有华阴令欲媚上官，以一头进。（《促织》）
          - ancient: 荆轲
          - ancient: 奉樊於期头函，而秦武阳奉地图匣，以次进。（《荆轲刺秦王》）
          - ancient: 于是相如前进缶，因跪请秦王。（《廉颇蔺相如列传》）
      - trans: ❻进谏。
        sentences:
          - ancient: 数月之后,时时而间<进>;期年之后，虽欲言,无可<进>者。（《邹忌讽齐王纳谏》）
          - ancient: 至于斟酌损益，进尽忠言，则攸之、祎、允之任也。（《出师表》）
      - trans: ❼出仕;做官。
        sentences:
          - ancient: 臣之进退，实为狼狈。（《陈情表》）
          - ancient: 居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。（《岳阳楼记》）
      - trans: ❽推荐;举荐。
        sentences:
          - ancient: 夫进贤之难者，贤者用且使己废，贵且使己贱，故人难之。（《战国策•楚策三》）
          - ancient: 少卿足下:曩者辱赐书，教以慎于接物，推贤进士为务。（《报任安书》）
          - ancient: 【高考题例】又其兄自有时名，滞于冗官，竟不引进。（《旧唐书•李揆传》）
  - word: 进
    type: 【量词】
    phonetic: jin4
    tags:
      - 高中
    samples: 
      - trans: 旧时庭院的前后层次。
        sentences:
          - ancient: 一层层深阁琼楼，一<进><进>珠宫贝阙。（《西游记》一回）