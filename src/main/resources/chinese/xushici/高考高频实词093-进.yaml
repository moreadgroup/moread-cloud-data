            vernacular: 侍奉公婆都顺着他们的心意，一举一动哪里敢自作主张不守本分？
          - ancient: 余与四人拥火以入，入之愈深，其<进>愈难，而其见愈奇。（《游褒禅山记》）
            url: xxxx
            vernacular: 我与四个人打着火把走进去，进去越深，前进越困难，而所见到的景象也就更加奇妙。
