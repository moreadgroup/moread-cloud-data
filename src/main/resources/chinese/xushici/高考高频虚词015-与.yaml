          - ancient: 【高考题例】凡更张庶事，一切听顺，而外若不<与>之者。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 大凡改变做事计划。
      - trans: ❹对付;抵挡。
        sentences:
          - ancient: 庞煖（xuan1）易<与>耳。（《史记•燕召公世家》）
            url: xxxx
