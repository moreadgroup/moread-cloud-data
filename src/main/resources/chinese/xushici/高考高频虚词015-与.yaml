          - ancient: 王夺之人，霸夺之<与>，强夺之地。（《荀子•王制》）
            url: xxxx
            vernacular: 要称王天下的和别国争夺民众，要称霸诸侯的和别国争夺同盟国，只图逞强的和别国争夺土地。
