      - trans: ❶和;跟;同。
        sentences:
          - ancient: 念<与>世间辞，千万不复全！（《孔雀东南飞》）
            url: xxxx
            vernacular: 他们都想很快地离开人世，无论如何也不愿苟且偷生得保全。
          - ancient: 故方其盛也，举天下豪杰，莫能<与>之争。（《伶官传序》）
            url: xxxx
            vernacular: 因此，当庄宗强盛的时候，普天下的豪杰，都不能跟他抗争
          - ancient: 燕国有勇士秦武阳，年十二，杀人，人不敢<与>忤视。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 燕国有个勇士秦武阳，十二岁的时候就杀过人，人们不敢同他正眼相看。
          - ancient: 沛公曰："君安<与>项伯有故?"（《鸿门宴》）
            url: xxxx
            vernacular: 你怎么和项伯有交情的？
          - ancient: 【高考题例】陵寝皆在邑境，岁时缮治无虚曰，今乃<与>百县均赋，曷若置此，使之奉常时用乎？（《宋史•范纯礼传》）；
            url: xxxx
            vernacular: 陵寝都在本县境内，一年四季修缮整治没有停下来的时间，现在却与其它县平均赋役，不如将赋役搁置下来，用它来供奉平时的用度呢。
      - trans: ❷为；替。
        sentences:
          - ancient: 去时里正<与>裹头，归来头白还戍边。（《兵车行》）
            url: xxxx
            vernacular: 从军出征时尚未成丁，还要里长替裹头巾，回来时已经满头白发，却仍要去戍守边疆。
