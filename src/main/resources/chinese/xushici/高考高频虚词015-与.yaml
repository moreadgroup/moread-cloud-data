            vernacular: 东部西部不属同路，按说不该给粮食，但哪能忍心对原管辖地区不管不问呢?
      - trans: ❷结交。
        sentences:
          - ancient: <与>嬴（指秦国，嬴，秦王的姓）而不助五国也。（《六国论》）
            url: xxxx
