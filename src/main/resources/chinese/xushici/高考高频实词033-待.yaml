---
words:
  - word: 待
    type: 【动词】
    phonetic: dai4
    tags:
      - 高中
    samples:
      - trans: ❶等候;等待。
        sentences:
          - ancient: "今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以<待>大王来。（《鸿门宴》）"
            url: xxxx
            vernacular: 先打败秦军进入咸阳的人封作王。’现在沛公先打败秦军进了咸阳，一点儿东西都不敢动用，封闭了宫室，军队退回到霸上，等待大王到来。
          - ancient: 与子颖坐日观亭，<待>日出。（《登泰山记》）
            url: xxxx
            vernacular: 我和子颍坐在日观亭里，等待日出。
          - ancient: "吾入关，秋毫不敢有所近，籍吏民，封府库，而<待>将军。（《鸿门宴》）"
            url: xxxx
            vernacular: 我进入关中，一点东西都不敢据为己有，登记了官吏、百姓，封闭了仓库等待将军到来。
          - ancient: "<待>圣人之出而投綴道路，不可谓非五人之力也。（《五人墓碑记》）"
            url: xxxx
            vernacular: 直到当今的皇上即位，（魏忠贤畏罪）吊死在路上，不能不说是这五个人的功劳呀。
      - trans: ❷对待。
        sentences:
          - ancient: 古之君子，其责己也重以周（全面），其<待>人也轻以约（简约）。（唐•韩愈《原毁》）
            url: xxxx
            vernacular: 古代的君子，他要求自己严格而周密，他要求别人宽容而简约。
          - ancient: "夫在殷忧必竭诚以<待>下，既得志则纵情以傲物。（《谏太宗十思疏》）"
            url: xxxx
            vernacular: 大凡在深重忧患当中必须竭尽诚意对待臣下，得志以后就放纵自己傲慢地对待一切人。
      - trans: ❸防备。
        sentences:
          - ancient: "今城郭不完，兵甲不备，不可以<待>不虞（意外的事）。（《韩非子•外储说左上》）"
            url: xxxx
            vernacular: 现在内城外城不完整，兵器铠甲不齐备，不能用来应付意外事变。
          - ancient: 赵亦盛设兵以<待>寨，秦不敢动。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 赵国也部署了大批军队来防备秦国，因而秦国也不敢轻举妄动。
      - trans: ❹凭借;依靠。
        sentences:
          - ancient: 彼于致福者，未数数然（数Shuo4拼命追求的样子）也。此虽免乎行，犹有所待者也。（《逍遥游》）
            url: xxxx
            vernacular: 他对于求福的事，没有拼命去追求。这样虽然免了步行，还是有所凭借的。
          - ancient: "盖闻王者莫高于周文，伯（通\"霸\"）者莫高于齐桓，皆<待>贤人而成名。（《汉书•高帝，纪下》）"
            url: xxxx
            vernacular: 听说古代圣王没有谁超过周文王的，霸主没有谁超过齐桓公的，他们都依靠贤人成就功名。
