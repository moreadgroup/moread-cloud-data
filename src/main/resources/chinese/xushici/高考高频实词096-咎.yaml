---
words:
  - word: 咎
    type: 【名词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: ❶灾害;灾祸。
        sentences:
          - ancient: 尔卜尔筮，体（卜筮的卦象）无咎言。以尔车来，以我贿（财物）迁。（《蒔经•卫风•氓》）
      - trans: ❷罪过;过失。
        sentences:
          - ancient: 若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。（《出师表》）
          - ancient: 此梦甚恶,非君之身，乃君之子,然亦君之咎。（《史记•赵世家》）
  
  - word: 咎
    type: 【动词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: ❶责备;追究罪过。
        sentences:
          - ancient: 楚人既咎子兰以劝怀王入秦而不反（通"返"）也。（《史记•屈原贾生列传》）
          - ancient: 既其出，则或咎其欲出者。（《游褒禅山记》）
      - trans: ❷遭灾。
        sentences:
          - ancient: 爱利之心息，而徒疾行威，身必咎矣。（《吕氏春秋•用民》）
