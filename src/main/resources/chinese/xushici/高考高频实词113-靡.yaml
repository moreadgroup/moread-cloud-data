words:
  - word: 靡
    type: 【名词】
    phonetic: mi3
    tags:
      - 高中
    samples:
  - word: 靡
    type: 【动词】
    phonetic: mi3
    tags:
      - 高中
    samples:
      - trans: ❶退却。
        sentences:
          - ancient: 试与他虫斗，虫尽靡。（《促织》）
      - trans: ❷归顺。
        sentences:
          - ancient: 于是赵国以北，辽东以西，皆从风而靡。（《后汉书•王昌传》）
      - trans: ❸倒下。
        sentences:
          - ancient: 吾视其辙乱，望其旗靡，故逐之。（《曹刿论战》）
          - ancient: 故不随俗靡者盖鲜矣。（《训俭示康》）
          - ancient: 左右欲刃相如，相如张目叱之，左右皆靡。（《廉颇蔺相如列传》）
      - trans: ❹无。
        sentences:
          - ancient: 靡不毕见。（《史记•屈原贾生列传》）
          - ancient: 探石发穴,靡计不施。（《促织》）

  - word: 靡
    type: 【形容词】
    phonetic: mi3
    tags:
      - 高中
    samples:
      - trans: ❶细小。
        sentences:
          - ancient: 靡草既凋，温风以至。（南朝梁•沈约《歌赤帝辞》）
      - trans: ❷华丽;美好。
        sentences:
          - ancient: 以为相如《封禅》，靡而不典。（《后汉书•班彪传》）【动词】不。
          - ancient: 天高地迥，号呼靡及。（《〈指南录〉后序》）
          - ancient: 三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。（《诗经•卫风•氓》）
          - ancient: 王事靡盬（gu3）,不遑启处。忧心孔疚，我行不来。名（《诗经.小雅"•釆薇》）