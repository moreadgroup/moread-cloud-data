---
words:
  - word: 靡
    type: 【动词】
    phonetic: mi3
    tags:
      - 高中
    samples:
      - trans: ❶退却。
        sentences:
          - ancient: 试与他虫斗，虫尽<靡>。（《促织》）
            url: xxxx
            vernacular: 试着和别的蟋蟀搏斗，所有的都被斗败了。
      - trans: ❷归顺。
        sentences:
          - ancient: 于是赵国以北，辽东以西，皆从风而<靡>。（《后汉书•王昌传》）
            url: xxxx
            vernacular: 于是赵国以北，辽东以西都忘风披靡。
      - trans: ❸倒下。
        sentences:
          - ancient: 吾视其辙乱，望其旗<靡>，故逐之。（《曹刿论战》）
            url: xxxx
            vernacular: 后来我看到他们的车轮的痕迹混乱了，望见他们的旗帜倒下了，所以下令追击他们。
          - ancient: 故不随俗<靡>者盖鲜矣。（《训俭示康》）
            url: xxxx
            vernacular: 所以不跟着习俗随风倒的人就少了。
          - ancient: 左右欲刃相如，相如张目叱之，左右皆<靡>。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 秦王的侍从们想要杀蔺相如，蔺相如睁圆双眼大声斥骂他们，侍从们都吓得倒退。
      - trans: ❹无。
        sentences:
          - ancient: 明道德之广崇，治乱之条贯，<靡>不毕见。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 阐明道德的广大崇高，治乱的条理，没有不全表现出来的。
          - ancient: "探石发穴，<靡>计不施。（《促织》）"
            url: xxxx
            vernacular: 挖石头，掏大洞，各种办法都用尽了，终究没有找到。
  - word: 靡
    type: 【形容词】
    phonetic: mi3
    tags:
      - 高中
    samples:
      - trans: ❶细小。
        sentences:
          - ancient: <靡>草既凋，温风以至。（南朝梁•沈约《歌赤帝辞》）
            url: xxxx
            vernacular: 小小的草木已经凋零，连风都是带着阳光和温度的风。
      - trans: ❷华丽;美好。
        sentences:
          - ancient: 以为相如《封禅》，<靡>而不典。（《后汉书•班彪传》）
            url: xxxx
            vernacular: 班固认为司马相如的《封禅》，用词华丽而不典雅
  - word: 靡
    type: 【副词】
    phonetic: mi3
    tags:
      - 高中
    samples:
      - trans: 不
        sentences:
          - ancient: 天高地迥，号呼<靡>及。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 天高地远，叫天不灵，叫地不灵。
          - ancient: 三岁为妇，<靡>室劳矣。夙兴夜寐，<靡>有朝矣。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 婚后多年守妇道，繁重家务劳动没有不干的。起早睡迟，朝朝如此，不能计算了。
          - ancient: "王事<靡>盬（gu3），不遑启处。忧心孔疚，我行不来。（《诗经.小雅\"•釆薇》）"
            url: xxxx
            vernacular: 王室差事没个罢，想要休息没闲暇。满怀忧愁太痛苦，生怕从此不回家。
