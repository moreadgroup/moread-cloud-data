---
words:
  - word: 令
    type: 【名词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶法令。
        sentences:
          - ancient: 所谓损有余、补不足，令出而民利者也。（汉•晁错《论贵粟疏》）
          - ancient: 王使屈平为<令>，众莫不知，每一<令>出，平伐（夸耀）其功。（《史记•屈原贾生列传》）
          - ancient: 且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家。（《苏武传》）
      - trans: ❷命令。
        sentences:
          - ancient: 令初下，群臣进谏，门庭若市。（《邹忌讽齐王纳谏》）
          - ancient: 留二日，维扬帅下逐客之令。（《〈指南录〉后序》）
      - trans: ❸辞令，应酬的言辞。
        sentences:
          - ancient: 其次不辱辞令，其次诎体受辱。（《报任安书》）
          - ancient: 博闻强志，明于治乱，娴于辞令。（《史记•屈原贾生列传》）
      - trans: ❹封建时代中央机构的长官。如尚书令、中书令等。
        sentences:
          - ancient: 公车特征拜郎中，再迁为太史令。（《张衡传》）
      - trans: ❺县令。
        sentences:
          - ancient: 魏文侯时，西门豹为邺令。（汉•褚少孙《西门豹治邺》）
          - ancient: 有华阴令，欲媚上官。（《促织》）
      - trans: ❻时令;时节。
        sentences:
          - ancient: 时令一反常，生灵受其病。（唐•白居易《赠友》）
          - ancient: 群葩（pa1，花）当令时，只在花开之数日。（《芙蕖》）
      - trans: ❼小令，词曲中较短小的一种体制。
        sentences:
          - ancient: 醉翻衫袖抛小令，笑掷骰盘呼大釆。（唐•白居易《就花枝》）

  - word: 令
    type: 【动词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶使;让。
        sentences:
          - ancient: 有复言令长安君为质（人质）者，老妇必唾其面。（《触龙说赵太后》）
          - ancient: <令>壮者无取（通"娶"）老妇，<令>老者无取壮妻。（《勾践灭吴》）
          - ancient: 何不作衣裳？莫令事不举！（《孔雀东南飞》）
          - ancient: 瞻顾遗迹，如在昨日，令人长号不自禁。（《项脊轩志》）
      - trans: ❷下令。
        sentences:
          - ancient: 汉王乃令张耳与韩信遂东下井隆击赵。（《史记•高祖本纪》）
          - ancient: 数月以来，皇上有所询问，则令总理衙门传旨。（清•梁启超《谭嗣同》）
          - ancient: 《传》曰"其身正，不<令>而行;其身不正，虽<令>不从"。其（大概）李将军之谓也？（《史记•李将军列传》）

  - word: 令
    type: 【形容词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: ❶美;善;好。
        sentences:
          - ancient: 君之不令民，父之不孝子，兄之不悌（ti4，尊敬兄长）弟，皆乡里之所釜(鬲瓦)者（用炊具釜(鬲瓦)吃饭的人，指所有的人）而逐之。（《吕氏春秋•安死》）
          - ancient: 年始十八九，便言（很会说话）多令才。（《孔雀东南飞》）
      - trans: ❷称呼别人亲属时，前面加""令"，表示尊敬。
        sentences:
          - ancient: 不堪吏人妇，岂合令郎君？（《孔雀东南飞》）
          - ancient: 令妻早谢，稚子四岁。（唐•刘禹锡《为鄂州李大夫祭柳员外文》）

  - word: 令
    type: 【连词】
    phonetic: ling4
    tags:
      - 高中
    samples:
      - trans: 假如;假设。
        sentences:
          - ancient: 令五人者保其首领（性命）以老于户牖（牖you3，指家中）之下，则尽其天牵，，人皆得以隶使之。（《五人墓碑记》）
          - ancient: 假令仆伏法受诛，若九牛亡（失去）一毛，与蝼蚁何以异？（《报任安书》）

