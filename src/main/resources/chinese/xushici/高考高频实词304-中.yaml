中㊀Zhong1
【名词】❶处在两端之间的；中间；当中。
【例句】击其中则首尾俱至。（《孙子•九地》）丨浑然而中处者，世谓之元气。（唐•柳宗元《天说》）丨舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍。（《石钟山记》）丨座中泣下谁最多？江州司马青衫湿。（《琵琶行》）
❷里;内。
【例句】以中有足乐者，不知口体之奉不若人也。（《送东阳马生序》）丨一屠晩归，担中肉尽，止有剩骨。（《狼》）丨相与枕藉乎舟中，不知东方之既白。（《赤壁赋》）丨箱帘六七十，绿碧青丝绳，物物各自异，种种在其中。（《孔雀东南飞》）
❸中心。
【例句】宛在水中央。（《诗经•秦风•兼葭》）丨中有都柱,傍行八道，施关发机。（《张衡传》）
❹内心;胸中。
【例句】荃（香草名。这里比喻君王）不察余之中情兮，反信谗而齎（ji4,盛）怒。（《离骚》）丨明明如月，何时可掇？忧从中来,不可断绝。（《短歌行》）丨淮阴屠中少年有侮信者,曰："若（你）虽长大，好带刀剑，中情怯耳。"（《史记.淮阴一侯列殆》）
❺内脏
【例句】五中所主。（《素问•阴阳类论》）
❻中期。
【例句】中兴机会，庶几在此。（《〈指南录〉后序》）
❼中等。
【例句】才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
❽中原。
【例句】四十三年，望中犹记，烽火扬州路（宋元时期的行政区域名）。（《永遇乐•京口北固亭怀古力

【形容词】❶正;不偏斜。
【例句】故道之所善，中则可从,畸则不可为。（《荀子•天论》）
❷中等;不高不低。
【例句】才能不及中人。（《过秦论》）丨中家以上，皆竭资取保。（《狱中杂记》）

【数词】半;一半。
【例句】曰黄昏以为期兮，羌中道而改路。（《离骚》）丨先帝创业未半而中道崩殂（殂cu2,指皇帝死亡），今天下三分，益州疲弊，此诚危急存亡之秋也。（《出师表》）丨夫子积学，当日知其所亡，以就懿（美好）德。若中道而归，何异断斯织乎？（《后汉书：列女传》）丨蟋蟀何感,中夜哀鸣。（晋•傅玄《短歌行》）丨谢（辞别）家事夫婿,中道还兄门。（《孔雀东南飞》）丨穷睇眄于中天，极娱游于暇日。（《滕王阁序》）
中㊁zhong4
【动词】❶符合;适合。
【例句】木直中绳（测直的工具），輮（通"煣"，用火烤使之弯曲）以为轮，其曲中规（测圆的工,具）。（《劝学》）丨然睹促织，隐中胸怀。（《促象》）
【高考题例】景监日："子何以中吾君？吾君之欢甚也。"（《史记•商君列传》）
❷正中目标。
【例句】射者中，弈者胜。（《醉翁亭记》）丨幸啄不中，虫跃去尺有咫（古代长度单位）。（《促织》）丨荆轲废，乃引其匕首提（掷）秦王，不中，中柱。（《荆轲刺秦王》）
【高考题例】敌攻石尖山，浩冒阵而前，流矢中左肋。（《宋史•郭浩传》）丨整弓复中之，观者诵叹，帝亲赐酒劳之。（《宋史•何灌传》）
❸遭受;遭遇。
【例句】（曹）操虽心知中计,却不肯认错。（《三国演义》四十五回）
❹中伤;使受到伤害。
【例句】（何）显怒，欲以吏事中商。（《汉书•何武传》）
❺科举及第;考中。
【例句】三年大比（乡试），以诸生试之直省，曰乡试。中式者为举人。（《明史•选举志》）
❻通"仲"。如：中夏、中冬。

