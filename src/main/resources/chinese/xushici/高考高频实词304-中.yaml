---
words:
  - word: 中
    type: 【名词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: ❶处在两端之间的；中间；当中。
        sentences:
          - ancient: 击其中则首尾俱至。（《孙子•九地》）
          - ancient: 浑然而中处者，世谓之元气。（唐•柳宗元《天说》）
          - ancient: 舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍。（《石钟山记》）
          - ancient: 座中泣下谁最多？江州司马青衫湿。（《琵琶行》）
      - trans: ❷里;内。
        sentences:
          - ancient: 以中有足乐者，不知口体之奉不若人也。（《送东阳马生序》）
          - ancient: 一屠晩归，担中肉尽，止有剩骨。（《狼》）
          - ancient: 相与枕藉乎舟中，不知东方之既白。（《赤壁赋》）
          - ancient: 箱帘六七十，绿碧青丝绳，物物各自异，种种在其中。（《孔雀东南飞》）
      - trans: ❸中心。
        sentences:
          - ancient: 宛在水中央。（《诗经•秦风•兼葭》）
          - ancient: 中有都柱,傍行八道，施关发机。（《张衡传》）
      - trans: ❹内心;胸中。
        sentences:
          - ancient: 荃（香草名。这里比喻君王）不察余之中情兮，反信谗而齎（ji4,盛）怒。（《离骚》）
          - ancient: 明明如月，何时可掇？忧从中来,不可断绝。（《短歌行》）
          - ancient: 淮阴屠中少年有侮信者,曰："若（你）虽长大，好带刀剑，中情怯耳。"（《史记.淮阴一侯列殆》）
      - trans: ❺内脏
        sentences:
          - ancient: 五中所主。（《素问•阴阳类论》）
      - trans: ❻中期。
        sentences:
          - ancient: 中兴机会，庶几在此。（《〈指南录〉后序》）
      - trans: ❼中等。
        sentences:
          - ancient: 才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
      - trans: ❽中原。
        sentences:
          - ancient: 四十三年，望中犹记，烽火扬州路（宋元时期的行政区域名）。（《永遇乐•京口北固亭怀古力

  - word: 中
    type: 【形容词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: ❶正;不偏斜。
        sentences:
          - ancient: 故道之所善，中则可从,畸则不可为。（《荀子•天论》）
      - trans: ❷中等;不高不低。
        sentences:
          - ancient: 才能不及中人。（《过秦论》）
          - ancient: 中家以上，皆竭资取保。（《狱中杂记》）

  - word: 中
    type: 【数词】
    phonetic: Zhong1
    tags:
      - 高中
    samples:
      - trans: 半;一半。
        sentences:
          - ancient: 曰黄昏以为期兮，羌中道而改路。（《离骚》）
          - ancient: 先帝创业未半而中道崩殂（殂cu2,指皇帝死亡），今天下三分，益州疲弊，此诚危急存亡之秋也。（《出师表》）
          - ancient: 夫子积学，当日知其所亡，以就懿（美好）德。若中道而归，何异断斯织乎？（《后汉书：列女传》）
          - ancient: 蟋蟀何感,中夜哀鸣。（晋•傅玄《短歌行》）
          - ancient: 谢（辞别）家事夫婿,中道还兄门。（《孔雀东南飞》）
          - ancient: 穷睇眄于中天，极娱游于暇日。（《滕王阁序》）

  - word: 中
    type: 【动词】
    phonetic: zhong4
    tags:
      - 高中
    samples:

      - trans: ❶符合;适合。
        sentences:
          - ancient: 木直中绳（测直的工具），輮（通"煣"，用火烤使之弯曲）以为轮，其曲中规（测圆的工,具）。（《劝学》）
          - ancient: 然睹促织，隐中胸怀。（《促象》）
          - ancient: 【高考题例】景监日："子何以中吾君？吾君之欢甚也。"（《史记•商君列传》）
      - trans: ❷正中目标。
        sentences:
          - ancient: 射者中，弈者胜。（《醉翁亭记》）
          - ancient: 幸啄不中，虫跃去尺有咫（古代长度单位）。（《促织》）
          - ancient: 荆轲废，乃引其匕首提（掷）秦王，不中，中柱。（《荆轲刺秦王》）
          - ancient: 【高考题例】敌攻石尖山，浩冒阵而前，流矢中左肋。（《宋史•郭浩传》）
          - ancient: 整弓复中之，观者诵叹，帝亲赐酒劳之。（《宋史•何灌传》）
      - trans: ❸遭受;遭遇。
        sentences:
          - ancient: （曹）操虽心知中计,却不肯认错。（《三国演义》四十五回）
      - trans: ❹中伤;使受到伤害。
        sentences:
          - ancient: （何）显怒，欲以吏事中商。（《汉书•何武传》）
      - trans: ❺科举及第;考中。
        sentences:
          - ancient: 三年大比（乡试），以诸生试之直省，曰乡试。中式者为举人。（《明史•选举志》）
      - trans: ❻通"仲"。如：中夏、中冬。

