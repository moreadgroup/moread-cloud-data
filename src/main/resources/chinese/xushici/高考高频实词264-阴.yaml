阴yin1
【名词】❶山的北面;水的南面（与"阳"相对）。
【例句】吾与汝毕力平险，指通豫南，达于汉阴，可乎？（《愚公移山》）丨泰山之阳，汶水西流；其阴，济水东流。（《登泰山记》）
❷古代哲学术语之一（与"阳"相对）。
【例句】一阴一阳之谓道。（《周易•系辞上》）丨衡善机巧,尤致思于天文阴阳历算。（《张衡传》）
❸阴影;树荫。
【例句】故审堂下之阴，而知日月之行。（《吕氏春秋•察今》）丨最爱湖东行不足（不满足），绿杨阴里白沙堤。（唐•白居易《钱塘湖春行》,）
❹时间;光阴。
【例句】大禹圣人，乃惜寸阴，至于众人，当惜分阴。（《资治通鉴•晋纪十五》）丨夫天地者万物之逆旅也;光阴者百代之过客也。（唐•李白《春夜宴从弟桃花园序》）
❺关于死人或鬼神的事。如阴间、阴司等。
❻指男女生殖器。
【例句】乃私求大阴人嫪毐（ai3）以为舍人。（《史记•吕不韦列传》）

【形容词】❶阴天;不见阳光。
【例句】春不得避风尘，夏不得避暑热,秋不得避阴雨，冬不得避寒冻，四时之间，亡日休息。（汉•晁错《论贵粟疏》）丨衔（包含）远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气豪万千。（《岳阳楼记》）
❷阴暗;寒冷。
【例句】阴风怒号，浊浪排空。（《岳阳楼记》）
❸阴险。
【例句】性阴密，忍（性情残忍）诛杀，不见喜怒。（《新唐书•李林甫传》）,
❹器物或印章上凹下的（文字）。
【例句】盖阴识（古器物上刻铸的文字）难铸，阳识易为。（明•陶宗仪《南村辍耕录》卷十七）
【副词】秘密地;隐密地。
【例句】（张）衡下车（官吏初到任），治威严，整法度，阴知奸党名姓，一时收禽（通"擒"），上下肃然，称为政理。（《张衡传》）丨后随浞野侯没胡中，及卫律所将降者，阴相与谋劫单于母阕氏归汉。（《苏武传》）
：	【高考题例】初荐王安石，及同辅政，知上方向之，阴为子孙计，凡更张庶事，一切听顺，而外若不与之者。（《宋史•曾公亮传》）丨登云谓议不早决,由贵妃家阴沮（阻挠）之。（《明史•陈登云传》）