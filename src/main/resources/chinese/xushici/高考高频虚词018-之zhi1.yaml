---
words:
- word: 之
  type: 【动词】
  phonetic: zhi1
  tags:
  - 高中
  samples:
  - trans: 到......去;往。
    sentences:
    - ancient: 辍耕<之>陇上。（《陈涉世家》）
      url: xxxx
      vernacular: 是停止耕作走到田埂高地上休息。
    - ancient: 商君欲<之>他国。（《史记•商君列传》）
      url: xxxx
      vernacular: 商君打算到别的国家。
    - ancient: 奚以<之>九万里而南为？（《逍遥游》）
      url: xxxx
      vernacular: 为什么要到九万里的高空再而向南飞呢？
    - ancient: 辘辘远听，杳不知其所<之>也。（《阿房宫赋》）
      url: xxxx
      vernacular: 辘辘的车声越听越远，无影无踪，不知道它去到什么地方。
    - ancient: 而又有剪发杜门，佯（假装）狂不知所<之>者。（《五人墓碑记》）
      url: xxxx
      vernacular: 也有的剪发毁容、闭门不出，或假装疯狂不知逃到何处的
    - ancient: 【高考题例】令行于民期年，秦民<之>国都言初令之（的）不便者以千数。（《史记•商君列传》）
      url: xxxx
      vernacular: 法令在民间实行一年,秦人到国都诉说新法不便利的数以千计。
- word: 之
  type: 【代词】
  phonetic: zhi1
  tags:
  - 高中
  samples:
  - trans: ❶表示第三人称。
    sentences:
    - ancient: 学而时习<之>，不亦说乎？（《论语•学而》）
      url: xxxx
      vernacular: 学到知识后按时温习并实践练习，不是一件令人心生喜悦的事吗？
    - ancient: 四方之士来者，必庙礼<之>。（《勾践灭吴》）
      url: xxxx
      vernacular: 对于到越国来的各方有名人士，一定在庙堂上接见，以示尊重
    - ancient: 余嘉其能行古道，作《师说》以贻<之>。（《师说》）
      url: xxxx
      vernacular: 我赞许他能够遵行古人（从师）的途径，写这篇《师说》来赠送他。
    - ancient: 人非生而知<之>者，孰能无惑？（《师说》）
      url: xxxx
      vernacular: 人不是一生下来就懂得知识和道理，谁能没有疑惑？
    - ancient: 【高考题例】贾生数上疏，言诸侯或连数郡，非古之（的）制，可稍削<之>。（《史记•屈原贾生列传》）
      url: xxxx
      vernacular: 贾谊数次上奏,说到有些诸侯兼有数郡,这不是古代的体制,应当渐渐地削减他们的实力
  - trans: ❷有时表示第一人称或第二人称。
    sentences:
    - ancient: 鄙贱之人，不知将军宽<之>（我）至此也！（《廉颇蔺相如列传》）
      url: xxxx
      vernacular: 我这个粗野卑贱的人，想不到将军的胸怀如此宽大啊！
    - ancient: 君（秦孝公）亟定变去之虑，殆无顾天下之议<之>（您）也。（《商君书•更法》）
      url: xxxx
      vernacular: 君王您应该赶快考虑变法的事，应当尽快下定变法的决心，不必顾虑人们的议论。
  - trans: ❸表示近指，这。
    sentences:
    - ancient: 均<之>二策，宁许以负秦曲。（《廉颇蔺相如列传》）
      url: xxxx
      vernacular: 衡量一下两种对策，宁可答应，而让秦国承担理亏的责任。
    - ancient: 巫医乐师百工<之>人，不耻相师。（《师说》）
      url: xxxx
      vernacular: 巫医、乐师、各种工匠这些人，不以互相学习为耻。
    - ancient: 士大夫之族，曰师曰弟子云者，则群聚而笑<之>。（《师说》）
      url: xxxx
      vernacular: 士大夫这一类人，听到称“老师”称“弟子”的人，就聚在一起嘲笑他们。
    - ancient: <之>二虫又何知!（《逍遥游》）
      url: xxxx
      vernacular: 寒蝉和灰雀这两个小东西当然不懂得这些道理
    - ancient: 【高考题例】乃短贾生日："洛阳<之>人，年少初学，专欲擅权，纷乱诸事。"（《史记•屈原贾生列传》）
      url: xxxx
      vernacular: 便在皇帝面前诋毁贾谊说：“这个洛阳人，年轻没有经验，专想揽权，把许多事情都搞乱了。”
- word: 之
  type: 【助词】
  phonetic: zhi1
  tags:
  - 高中
  samples:
  - trans: ❶结构助词，相当于"的"。
    sentences:
    - ancient: 君<之>病在肌肤，不治将益深。（《韩非子•喻老》）
      url: xxxx
      vernacular: 您的病在肌肉和皮肤,不治疗的话将更加严重. 
    - ancient: 老吾老，以及人<之>老；幼吾幼，以及人<之>幼。（《孟子•梁惠王上》）
      url: xxxx
      vernacular: 尊敬我家里的长辈，从而推广到尊敬别人家里的长辈；爱护我家里的儿女，从而推广到爱护别人家里的儿女。
    - ancient: 古<之>学者必有师。（《师说》）
      url: xxxx
      vernacular: 古代求学的人必定有老师。
    - ancient: 壬戌之秋，七月既望，苏子与客泛舟游于赤壁<之>下。（《赤壁赋》）
      url: xxxx
      vernacular: 壬戌年秋，七月十六日，苏轼与友人在赤壁下泛舟游玩。
    - ancient: 【高考题例】其间岂无刚直<之>人，而弗胜龃龉，多不能安其身。（《明史•陈登云传》）
      url: xxxx
      vernacular: 世间怎么会没有正直的人呢? 只是无法忍受麻烦,大多数不能保全自己。
  - trans: ❷结构助词，用于主谓之间，取消句子独立性。
    sentences:
    - ancient: 汝心<之>固，固不可彻，曾不若孀妻弱子。（《愚公移山》）
      url: xxxx
      vernacular: 你的思想真顽固，顽固得没法开窍，连孤儿寡妇都比不上。
    - ancient: 故王<之>不王，不为也，非不能也。（《孟子•梁惠王上》）
      url: xxxx
      vernacular: 所以大王不称王(的原因),只是因为不去做,不是因为不能(称王)
    - ancient: 嗟乎！师道<之>不传也久矣！（《师说》）
      url: xxxx
      vernacular: 唉！（古代）从师（学习）的风尚不流传已经很久了！
    - ancient: 后之视今，亦犹今<之>视昔，悲夫！（《兰亭集序》）
      url: xxxx
      vernacular: 后人看待今人，也就像今人看待前人，可悲呀。
  - trans: ❸在句中起调节音节的作用。
    sentences:
    - ancient: 卒<之>为众人，则其受于人者不至也。（《伤仲永》）
      url: xxxx
      vernacular: 但最终成为一个平凡的人，是因为他后天所受的教育还没有达到要求。
    - ancient: 余扃牖而居，久<之>，能以足音辨人。（《项脊轩志》）
      url: xxxx
      vernacular: 我关着窗子住在里面，时间长了，能够根据脚步声辨别是谁。
    - ancient: 填然鼓<之>，兵刃既接，弃甲曳兵而走。（《寡人之于国也》）
      url: xxxx
      vernacular: 战鼓咚咚敲响，交战激烈了，战败的士兵丢盔弃甲拖着武器逃跑
  - trans: ❹连接动词和前置的宾语。
    sentences:
    - ancient: 苟得闻子大夫之言，何后<之>有？（《勾践灭吴》）
      url: xxxx
      vernacular: 如果能够让我听听您的高见，又有什么晚的呢？
    - ancient: 夫晋，何厌<之>有？（《烛之武退秦师》）
      url: xxxx
      vernacular: 晋国,哪里有满足的时候呢?
    - ancient: 野语有<之>曰'闻道百，以为莫（没有人己若者'，我<之>谓也……（《庄子•秋水》）
      url: xxxx
      vernacular: 有句俗语说，“听到很多道理， 就认为没有人能比得上自己了”，这就是说的我啊。
    - ancient: 太吏公曰：《传》曰"其身正，不令而行;其身不正，虽令不从"。其李将军<之>谓也？（《史记•李将军列传》）
      url: xxxx
      vernacular: 太史公司马迁评论李广说：“《论语》讲了：‘一个在上的人，他自己行为正直，不下命令，教化也能推行；他自己行为不正，即使下了命令，人们也不会听从。’这正好用来说明李将军。
  - trans: ❺定语后置的标志，不译。
    sentences:
    - ancient: 蚓无爪牙之利，筋骨<之>强，上食埃土，下饮黄泉，用心一也。（《劝学》）
      url: xxxx
      vernacular: 蚯蚓没有锋利的爪子和牙齿,强壮的筋骨,向上能吃到泥土,向下能喝到地下的泉水,这是因为它用心专一。
    - ancient: 居庙堂<之>高则忧其民，处江湖之远则忧其君。（《岳阳楼记》）
      url: xxxx
      vernacular: 在朝廷上做官时，就为百姓担忧；不在朝廷做官而处在僻远的江湖中间就为国君忧虑。
