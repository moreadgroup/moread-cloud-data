---
words:
  - word: 志
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶心意。
        sentences:
          - ancient: 诗言志。（《尚书•舜典》）
          - ancient: 提刀而立，为之四顾，为之踌躇满志。（《庄子•养生主》）
          - ancient: 尽吾志也而不能至者,可以无悔矣，其孰能讥之乎？（《游褒禅山记》）
      - trans: ❷志向。
        sentences:
          - ancient: 燕雀安知鸿鹄之志哉？（《陈涉世家》）
          - ancient: 今入关,财物无所取，妇女无所幸（宠幸），此其志不在小。（《鸿门宴》）
          - ancient: 穷且益坚，不坠青云之志。（《滕王阁序》）
          - ancient: 愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）
      - trans: ❸志趣。
        sentences:
          - ancient: 推此志也,虽与日月争光可也。（《史记•屈原贾生列传》）
      - trans: ❹标志;标记。
        sentences:
          - ancient: 襄阳土（本地的）俗，邻居种桑树于界上为志。（《南齐书•韩系伯传》）
      - trans: ❺记事的书或文章。如:《三国志》《项脊轩志》。
        sentences:
          - ancient: 掌邦国之志。（《周礼•春官•小史》）
          - ancient: 余既为此志,后五年，吾妻来归（女子出嫁），时至轩中，从余问古事,或凭几学书。（《项春轩志》）
      - trans: ❻通"痣"。
        sentences:
          - ancient: 腰有紫志。（《梁书•沈约传》）
      - trans: ❼通"帜"。旗帜。
        sentences:
          - ancient: 设兵，张旗志。（《史记•刘敬叔孙通列传》）

  - word: 志
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶记忆;心里留下印象。
        sentences:
          - ancient: 博闻强志，明于治乱，娴于辞令。（《史记•屈原贾生列传》）
      - trans: ❷记述。
        sentences:
          - ancient: 亭以雨名，志喜也。（宋•苏轼《喜雨亭记》）
          - ancient: 故为之文以志。（《始得西山宴游记》）
          - ancient: 《齐谐》者，志怪者也。（《逍遥游》）