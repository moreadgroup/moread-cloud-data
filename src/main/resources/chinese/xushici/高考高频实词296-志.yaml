志zhi4
【名词】❶心意。
【例句】诗言志。（《尚书•舜典》）丨提刀而立，为之四顾，为之踌躇满志。（《庄子•养生主》）丨尽吾志也而不能至者,可以无悔矣，其孰能讥之乎？（《游褒禅山记》）
❷志向。
【例句】燕雀安知鸿鹄之志哉？（《陈涉世家》）丨今入关,财物无所取，妇女无所幸（宠幸），此其志不在小。（《鸿门宴》）丨穷且益坚，不坠青云之志。（《滕王阁序》）丨愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。（《陈情表》）
❸志趣。
【例句】推此志也,虽与日月争光可也。（《史记•屈原贾生列传》）	
❹标志;标记。
【例句】襄阳土（本地的）俗，邻居种桑树于界上为志。（《南齐书•韩系伯传》）
❺记事的书或文章。如:《三国志》《项脊轩志》。
【例句】掌邦国之志。（《周礼•春官•小史》）丨余既为此志,后五年，吾妻来归（女子出嫁），时至轩中，从余问古事,或凭几学书。（《项春轩志》）
❻通"痣"。
【例句】腰有紫志。（《梁书•沈约传》）
❼通"帜"。旗帜。
【例句】设兵，张旗志。（《史记•刘敬叔孙通列传》）
【动词】❶记忆;心里留下印象。
【例句】博闻强志，明于治乱，娴于辞令。（《史记•屈原贾生列传》）
❷记述。
【例句】亭以雨名，志喜也。（宋•苏轼《喜雨亭记》）丨故为之文以志。（《始得西山宴游记》）丨《齐谐》者，志怪者也。（《逍遥游》）