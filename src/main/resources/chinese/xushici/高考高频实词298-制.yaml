制zhi4
【名词】❶规章;准则。
【例句】先王之制：大都不过参（通"三""）国之一，中五之一,小九之一。（《郑伯克段于鄢》）
【高考题例】贾生数上疏，言诸侯或连数郡，非古之制，可稍削之。（《史记•屈原贾生列传》）
❷帝王的命令。
【例句】命为""制"，令为"诏"，天子自称曰""朕"。（《史记・秦始皇本纪》）
❸规模。
【例句】其后二年,余久卧病无聊，乃使人复葺南阁子，其制稍异于前。（《项脊轩志》）丨乃重修岳阳楼，增其旧制。（《岳阳楼记》）
【动词】❶裁制;制作衣服。本字作""製"。
【例句】人情（人之常情）一日不再食则饥，终岁不制衣则寒。（汉•晁错《论贵粟疏》）丨制芰ji4荷以为衣兮，集芙蓉以为裳。（《离骚》）丨其牙机巧制，皆隐在尊中，覆盖周密无际。（《张衡传》）
❷写作;创作。本字作"製"。
【例句】公所制《山居四时序》，言之已详。（南朝梁•任昉《齐竟陵文宣王行状》）
❸控制;节制;制服。
【例句】秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。（《过秦论》）丨履至尊而制六合，执敲扑而鞭笞天下，威振四海。（《过秦论》）丨吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。（《过秦论》）丨瑜（周瑜自称）得精兵五万，自足制之，愿将军勿虑！（《资治通鉴•汉纪五十七》）
❹治理;掌管。
【例句】制国有常，利民为本;从政有经，令行为上。（《史记•赵世家》）
❺规定;制定。
【例句】制礼作乐。（《礼记•明堂传》）丨圣人观乡而顺宜,因事而制礼，所以利其民而厚其国也。（《史记•赵世家》）
❻制止;禁止。
【例句】制以刑（《尚书.吕刑》）

【量词】古代长度单位，一丈八尺为一制。
【例句】季绢三十制当一镒。（《管子•乘马》）


