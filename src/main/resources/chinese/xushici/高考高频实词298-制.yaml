---
words:
  - word: 制
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶规章;准则。
        sentences:
          - ancient: 先王之制：大都不过参（通"三""）国之一，中五之一,小九之一。（《郑伯克段于鄢》）
          - ancient: 【高考题例】贾生数上疏，言诸侯或连数郡，非古之制，可稍削之。（《史记•屈原贾生列传》）
      - trans: ❷帝王的命令。
        sentences:
          - ancient: 命为""制"，令为"诏"，天子自称曰""朕"。（《史记・秦始皇本纪》）
      - trans: ❸规模。
        sentences:
          - ancient: 其后二年,余久卧病无聊，乃使人复葺南阁子，其制稍异于前。（《项脊轩志》）
          - ancient: 乃重修岳阳楼，增其旧制。（《岳阳楼记》）
  - word: 制
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶裁制;制作衣服。本字作""製"。
        sentences:
          - ancient: 人情（人之常情）一日不再食则饥，终岁不制衣则寒。（汉•晁错《论贵粟疏》）
          - ancient: 制芰ji4荷以为衣兮，集芙蓉以为裳。（《离骚》）
          - ancient: 其牙机巧制，皆隐在尊中，覆盖周密无际。（《张衡传》）
      - trans: ❷写作;创作。本字作"製"。
        sentences:
          - ancient: 公所制《山居四时序》，言之已详。（南朝梁•任昉《齐竟陵文宣王行状》）
      - trans: ❸控制;节制;制服。
        sentences:
          - ancient: 秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。（《过秦论》）
          - ancient: 履至尊而制六合，执敲扑而鞭笞天下，威振四海。（《过秦论》）
          - ancient: 吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。（《过秦论》）
          - ancient: 瑜（周瑜自称）得精兵五万，自足制之，愿将军勿虑！（《资治通鉴•汉纪五十七》）
      - trans: ❹治理;掌管。
        sentences:
          - ancient: 制国有常，利民为本;从政有经，令行为上。（《史记•赵世家》）
      - trans: ❺规定;制定。
        sentences:
          - ancient: 制礼作乐。（《礼记•明堂传》）
          - ancient: 圣人观乡而顺宜,因事而制礼，所以利其民而厚其国也。（《史记•赵世家》）
      - trans: ❻制止;禁止。
        sentences:
          - ancient: 制以刑（《尚书.吕刑》）

  - word: 制
    type: 【量词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 古代长度单位，一丈八尺为一制。
        sentences:
          - ancient: 季绢三十制当一镒。（《管子•乘马》）


