---
words:
  - word: 制
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶规章;准则。
        sentences:
          - ancient: "先王之<制>：大都不过参（通\"三\"\"）国之一，中五之一，小九之一。（《郑伯克段于鄢》）"
            url: xxxx
            vernacular: 按先王的规定，大城市的城墙不能超过国都的城墙的三分之一，中等的不能超过五分之一。小的不超过九分之一。
          - ancient: 【高考题例】贾生数上疏，言诸侯或连数郡，非古之<制>，可稍削之。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 贾谊屡次上书，指出诸侯势力过大，有的封地连接数郡，不符合古代的制度，应该逐渐削弱他们的势力。
      - trans: ❷帝王的命令。
        sentences:
          - ancient: 命为"<制>"，令为"诏"，天子自称曰""朕"。（《史记・秦始皇本纪》）
            url: xxxx
            vernacular: 天子之命称为‘制’，天子之令称为‘诏’，天子自称叫‘朕’。
      - trans: ❸规模。
        sentences:
          - ancient: "其后二年，余久卧病无聊，乃使人复葺南阁子，其<制>稍异于前。（《项脊轩志》）"
            url: xxxx
            vernacular: 又过了两年，我很长时间生病卧床没有什么（精神上的）寄托，就派人再次修缮南阁子，格局跟过去稍有不同。
          - ancient: 乃重修岳阳楼，增其旧<制>。（《岳阳楼记》）
            url: xxxx
            vernacular: 于是重新修建岳阳楼，扩大它原有的规模
  - word: 制
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶裁制;制作衣服。本字作""製"。
        sentences:
          - ancient: 人情（人之常情）一日不再食则饥，终岁不<制>衣则寒。（汉•晁错《论贵粟疏》）
            url: xxxx
            vernacular: 人之常情是：一天不吃两顿饭就要挨饿，整年不做衣服穿就会受冻。
          - ancient: <制>芰(ji4)荷以为衣兮，集芙蓉以为裳。（《离骚》）
            url: xxxx
            vernacular: 我要把菱叶裁剪成上衣，我并用荷花把下裳织就。
          - ancient: 其牙机巧<制>，皆隐在尊中，覆盖周密无际。（《张衡传》）
            url: xxxx
            vernacular: 仪器的枢纽和机件制造得很精巧，都隐藏在酒尊形的仪器中，覆盖严密得没有一点缝隙。
      - trans: ❷写作;创作。本字作"製"。
        sentences:
          - ancient: 公所<制>《山居四时序》，言之已详。（南朝梁•任昉《齐竟陵文宣王行状》）
            url: xxxx
            vernacular: xxxx
      - trans: ❸控制;节制;制服。
        sentences:
          - ancient: 秦有余力而<制>其弊，追亡逐北，伏尸百万，流血漂橹。（《过秦论》）
            url: xxxx
            vernacular: 秦有剩余的力量趁他们困乏而制服他们，追赶逃走的败兵，百万败兵横尸道路，流淌的血液可以漂浮盾牌。
          - ancient: 履至尊而<制>六合，执敲扑而鞭笞天下，威振四海。（《过秦论》）
            url: xxxx
            vernacular: 登上皇帝的宝座来统治天下，用严酷的刑罚来奴役天下的百姓。
          - ancient: 吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦<制>其兵。（《过秦论》）
            url: xxxx
            vernacular: 赵奢这些人.制:统率，指挥
          - ancient: 瑜（周瑜自称）得精兵五万，自足<制>之，愿将军勿虑！（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 我只要有精兵五万，就足够可以制服敌军，希望将军不要有所顾虑！
      - trans: ❹治理;掌管。
        sentences:
          - ancient: <制>国有常，利民为本;从政有经，令行为上。（《史记•赵世家》）
            url: xxxx
            vernacular: 管理国家有固定的方法，就是以有利于老百姓为根本，处理政务有不变的法则，就是以法令能切实实行为最好。
      - trans: ❺规定;制定。
        sentences:
          - ancient: <制>礼作乐。（《礼记•明堂传》）
            url: xxxx
            vernacular: xxxx
          - ancient: "圣人观乡而顺宜，因事而<制>礼，所以利其民而厚其国也。（《史记•赵世家》）"
            url: xxxx
            vernacular: 圣人观察乡俗而顺俗制宜，根据实际情况制定礼仪，这是为了利民富国。
      - trans: ❻制止;禁止。
        sentences:
          - ancient: 苗民弗用灵，<制>以刑（《尚书.吕刑》）
            url: xxxx
            vernacular: xxxx
