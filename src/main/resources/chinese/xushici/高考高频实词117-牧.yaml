---
words:
  - word: 牧
    type: 【名词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: ❶放牧之人。
        sentences:
          - ancient: 问樵樵不知，问牧牧不言。（宋•王安石《谢公墩》）
          - ancient: 马有圉（yu3,养马的人），牛有牧，以待百事。（《左传•昭公七"年》）
      - trans: ❷古代称诸侯或地方长官。
        sentences:
          - ancient: 今夫天下之人牧,未有不嗜杀人者也。（《孟子•梁惠王上》）
          - ancient: 臣之辛苦，非独蜀之人士及二州牧伯所见明知,皇天后土，实所共鉴。（《陈情表》）
          - ancient: 【高考题例】萍寄（像浮萍一样漂泊托身）诸州，凡十五六年，其牧守稍薄，则又移居，故其迁徙者，盖（大概）十余州焉。（《旧唐书•李揆传》〉
      - trans: ❸指主管某一专业的官。
        sentences:
          - ancient: 命舟牧覆舟。（《礼记•月令》）
      - trans: ❹牧地;牧场。
        sentences:
          - ancient: 今有受人之牛羊而为之牧之者，则必为之求牧与刍（牧草）矣。（《孟子•公孙丑下》）
      - trans: ❺郊外。
        sentences:
          - ancient: 自牧归荑，洵美且异。（《诗经•郝风•静女》）
      - trans: ❻地名。即牧野，今河南新乡附近。
        sentences:
          - ancient: 致天之届，于牧之野。（《诗经•鲁颂•闔宫》）


  - word: 牧
    type: 【动词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: ❶放牧饲养牲畜。
        sentences:
          - ancient: 牛羊又从而牧之。（《孟子•告子上》）
          - ancient: 胡人不敢南下而牧马，士不敢弯弓而报怨。（《过秦论》）
          - ancient: 杖汉节牧羊,卧起操持，节旄尽落。（《苏武传》）
      - trans: ❷修养。
        sentences:
          - ancient: 念高危，则思谦冲而自牧。（《谏太宗十思疏》）
      - trans: ❸治理。
        sentences:
          - ancient: 【高考题例】况牧民之长，百责所丛。（元•张养浩《三事忠:告》）

