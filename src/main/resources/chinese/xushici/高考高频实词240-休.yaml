---
words:
  - word: 休
    type: 【动词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: ❶休息。
        sentences:
          - ancient: 至于负者（背着东西的人）歌于途，行者<休>于树。（《醉翁亭记》）
            url: xxxx
            vernacular: 至于背着东西的人在路上欢唱，来去行路的人在树下休息
          - ancient: "据其栅，命士少<休>，食干糒（bei4,干粮），整羁（马笼头）靮（di2马缰绳）。（《资治通,鉴•唐纪五十六》\"）"
            url: xxxx
            vernacular: 占据那座营寨。命令士兵稍微休息一会儿，吃干粮，整理好战马的笼头和缰绳。
      - trans: ❷休假。
        sentences:
          - ancient: "会<休>日登楼，见人于后圃有所瘗（yi4,掩埋）藏者。（《新唐书•裴宽传》）"
            url: xxxx
            vernacular: xxxx
          - ancient: 十旬<休>假，胜友如云；千里逢迎，高朋满座。（《滕王阁序》）
            url: xxxx
            vernacular: 正逢十日休假的日子，杰出的友人云集；高贵的宾客，也都不远千里来到这里聚会。
      - trans: ❸停止。
        sentences:
          - ancient: 善（羡慕）万物之得时，感吾生之行<休>。（《归去来兮辞》）
            url: xxxx
            vernacular: （我）羡慕万物恰逢繁荣滋长的季节，感叹自己一生行将告终。
          - ancient: "少年大骇,急解令<休>止。（《促织》）"
            url: xxxx
            vernacular: 少年大惊，急忙分开，使它们停止扑斗。
      - trans: ❹辞退官职。
        sentences:
          - ancient: "谪居澹无事,何异老且<休>。（宋•苏轼《和陶游斜川正月五日与儿子过出游作》）"
            url: xxxx
            vernacular: xxxx
          - ancient: 名岂文章著，官应老病<休>。（唐•杜甫《旅夜书怀》）
            url: xxxx
            vernacular: 名字或许因文章而显著，官位应该在年老多病时便罢休了。
      - trans: ❺旧时称丈夫离弃妻子叫休。
        sentences:
          - ancient: 枕前发尽千般愿，要<休>且待青山烂。（《敦煌曲子词•菩萨蛮》）
            url: xxxx
            vernacular: 枕前已经连连许下千万般誓愿，想要断绝关系要等到青山腐烂
  - word: 休
    type: 【形容词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: ❶美;善。
        sentences:
          - ancient: 士之能垂<休>光、照后世者，亦莫不有后进之士、负天下之望者，为之后焉。（唐•韩愈《与于襄阳书》）
            url: xxxx
            vernacular: 读书人能够把他的美好德行流传下来，照耀后代的，也没有哪一个不是靠在天下有名望的后辈给他做继承人的。
          - ancient: 人君当神器之重，居域中之大，将崇极天之峻，永保无疆之<休>。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 国君处于皇帝的重要位置，在天地间尊大，就要推崇皇权的高峻，永远保持政权的和平美好
      - trans: ❷喜乐。
        sentences:
          - ancient: "晋国有忧,（孙周）未尝不戚（忧虑）；有庆，未尝不怡（愉快）。（单襄公）曰：\"……为晋<休>戚，不背本也。\"（《国语•周语下》）"
            url: xxxx
            vernacular: 听得晋国有不好的消息，没有一次不感到悲伤的；听得晋国有可喜的事情，没有一次不感到高兴的。说：”他能为晋休戚，不忘其本，热爱他的祖国“
  - word: 休
    type: 【副词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: 不要
        sentences:
          - ancient: 洛阳宫殿化为烽，<休>道秦关百二重。（唐•杜甫《诸将五首》之三）
            url: xxxx
            vernacular: 洛阳宫殿早已化为烽火，不必再说秦关兵二万足以当敌百万。
  - word: 休
    type: 【助词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: 句末语气助词。罢；了。
        sentences:
          - ancient: 要来小酌便来<休>，未必明朝风不起。（宋•李清照《玉楼春》）
            url: xxxx
            vernacular: 想要来饮酒赏梅的话便来罢，等到明天说不定要起风了呢！
