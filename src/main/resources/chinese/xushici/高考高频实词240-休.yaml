休xiu
【动词】❶休息。
【例句】至于负者（背着东西的人）歌于途，行者休于树。（《醉翁亭记》）丨据其栅，命士少休，食干糒（bei4,干粮），整羁（马笼头）靮（di2马缰绳）。（《资治通,鉴•唐纪五十六》"）
❷休假。
【例句】会休日登楼，见人于后圃有所瘗（yi4,掩埋）藏者。（《新唐书•裴宽传》）丨十旬休假，胜友如云；千里逢迎，高朋满座。（《滕王阁序》）
❸停止。
【例句】善（羡慕）万物之得时，感吾生之行休。（《归去来兮辞》）丨少亲大骇,急解令休止。（《促织》）
❹辞退官职。
【例句】谪居淡无事,何异老且休。（宋•苏轼《和〈游斜川正月五曰与儿子过出游作〉》）丨名岂文章著，官应老病休。（唐•杜甫《旅夜书怀》）
❺旧时称丈夫离弃妻子叫休。
【例句】枕前发尽千般愿，要休且待青山烂。（《敦煌曲子词•菩萨蛮》）

【形容词】❶美;善。
【例句】士之能垂休光照后世者，亦莫不有后进之士负天下之望者为之后焉。（唐•韩愈《与于襄阳书》）丨人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。（《谏太宗十思疏》）
❷喜乐。
【例句】晋国有忧,（孙周）未尝不戚（忧虑）；有庆，未尝不怡（愉快）。（单襄公）曰："……为晋休戚，不背本也。"（《国语•周语下》）

【副词】不要。	修
【例句】洛阳宫殿化为烽，休道秦关百二重。（唐•杜甫《诸将五首》之三）

【助词】句末语气助词。罢；了。
【例句】要来小酌便来休。（宋•李清照《玉楼春》）
