---
words:
  - word: 休
    type: 【动词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: ❶休息。
        sentences:
          - ancient: 至于负者（背着东西的人）歌于途，行者休于树。（《醉翁亭记》）
          - ancient: 据其栅，命士少休，食干糒（bei4,干粮），整羁（马笼头）靮（di2马缰绳）。（《资治通,鉴•唐纪五十六》"）
      - trans: ❷休假。
        sentences:
          - ancient: 会休日登楼，见人于后圃有所瘗（yi4,掩埋）藏者。（《新唐书•裴宽传》）
          - ancient: 十旬休假，胜友如云；千里逢迎，高朋满座。（《滕王阁序》）
      - trans: ❸停止。
        sentences:
          - ancient: 善（羡慕）万物之得时，感吾生之行休。（《归去来兮辞》）
          - ancient: 少亲大骇,急解令休止。（《促织》）
      - trans: ❹辞退官职。
        sentences:
          - ancient: 谪居淡无事,何异老且休。（宋•苏轼《和〈游斜川正月五曰与儿子过出游作〉》）
          - ancient: 名岂文章著，官应老病休。（唐•杜甫《旅夜书怀》）
      - trans: ❺旧时称丈夫离弃妻子叫休。
        sentences:
          - ancient: 枕前发尽千般愿，要休且待青山烂。（《敦煌曲子词•菩萨蛮》）

  - word: 休
    type: 【形容词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: ❶美;善。
        sentences:
          - ancient: 士之能垂休光照后世者，亦莫不有后进之士负天下之望者为之后焉。（唐•韩愈《与于襄阳书》）
          - ancient: 人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。（《谏太宗十思疏》）
      - trans: ❷喜乐。
        sentences:
          - ancient: 晋国有忧,（孙周）未尝不戚（忧虑）；有庆，未尝不怡（愉快）。（单襄公）曰："……为晋休戚，不背本也。"（《国语•周语下》）

  - word: 休
    type: 【副词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: 不要。	修
        sentences:
          - ancient: 洛阳宫殿化为烽，休道秦关百二重。（唐•杜甫《诸将五首》之三）

  - word: 休
    type: 【助词】
    phonetic: xiu
    tags:
      - 高中
    samples:
      - trans: 句末语气助词。罢；了。
        sentences:
          - ancient: 要来小酌便来休。（宋•李清照《玉楼春》）
