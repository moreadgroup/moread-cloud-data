---
words:
  - word: 尚
    type: 【名词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: 同"上"。
        sentences:
          - ancient: 舜尚（谓以匹夫而见天子）见帝。（《孟子•万章下》）

  - word: 尚
    type: 【动词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶崇尚；注重。
        sentences:
          - ancient: 君子尚勇乎？（《论语•阳货》）
          - ancient: 宣德间，宫中尚促织之戏，岁征民间。（《促织》）
          - ancient: 【高考题例】色尚黄，数用五，为官名，悉更秦之法。（《史记・:屈原贾生列传》）
          - ancient: 【高考题例】涣少好侠，<尚>气力，数通剽轻少年。晩而改节，敦儒学，习《尚书》，读律令，略举大义。（《后汉书•王涣传》）
      - trans: ❷超过。
        sentences:
          - ancient: 好仁者，无以尚之。（《论语•里仁》）
      - trans: ❸特指娶公主为妻。
        sentences:
          - ancient: 公主者，孝文帝女也，（周）勃太子胜之尚之。（《史记•绛侯周勃世家》）
          - ancient: 【高考题例】田文既死，公叔为相，尚魏公主，而害吴起。（《史记•孙子吴起列传》）
      - trans: ❹主管。
        sentences:
          - ancient: 襄平侯纪通尚符节，乃令持节矫内勃北军。（《汉书，高后纪》）
      - trans: ❺夸耀;炫耀。
        sentences:
          - ancient: 不自尚其功。（《礼记•表记》）

  - word: 尚
    type: 【形容词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶崇高;高尚。
        sentences:
          - ancient: 南阳刘子骥，高尚士也，闻之，欣然规往（谋划着前往）。（《桃花源记》）
      - trans: ❷自大。
        sentences:
          - ancient: 虽才高于世，而无骄尚之情。（《张衡传》）

  - word: 尚
    type: 【副词】
    phonetic: shang4
    tags:
      - 高中
    samples:
      - trans: ❶尚且。
        sentences:
          - ancient: 臣以为布衣之交尚不相欺，况大国乎？（《廉颇蔺相如列传》）
          - ancient: 且庸人尚羞之，况于将相乎！（《廉颇蔺相如列传》）
      - trans: ❷还;仍然。
        sentences:
          - ancient: 谢公宿处今尚在。（《梦游天姥吟留别》）
          - ancient: 凭谁问:廉颇老矣，尚能饭否？（《永遇乐•京口北固亭怀古》）
          - ancient: 今不听吾计，后虽欲复见我，尚可得乎？（《苏武传》）
          - ancient: 且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家，安危不可知，子卿尚复谁为乎？（《苏武传》）
          - ancient: 【高考题例】臂健尚嫌弓力软，眼明犹识阵云高。（宋•曹翰《内宴奉诏作》）
      - trans: ❸差不多；几乎。
        sentences:
          - ancient: 以能保我子孙黎民，尚亦有利哉！（《礼记•大学》）
      - trans: ❹表示祈求或命令。
        sentences:
          - ancient: 曰："平公之灵，尚辅相余!"（《左传•昭公二—年》）