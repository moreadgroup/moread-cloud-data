---
words:
  - word: 祖
    type: 【名词】
    phonetic: zu3
    tags:
      - 高中
    samples:
      - trans: ❶祖庙。
        sentences:
          - ancient: 正月上日，受终于文祖。（《尚书•舜典》）
      - trans: ❷祖先;特指祖父。
        sentences:
          - ancient: 吾祖死于是，吾父死于是。（《捕蛇者说》）
          - ancient: 思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。（《六国论》）
          - ancient: 此吾祖太常公宣德间执此以朝，他日汝当用之！（《项脊轩志》）
      - trans: ❸宗派或事业的首创者。
        sentences:
          - ancient: 前年幵阁放柳枝，今年洗心参佛祖。（宋•苏轼《和蔡景繁海州石室》）
      - trans: ❹起初;产生之前。
        sentences:
          - ancient: 浮游乎万物之祖。（《庄子•山木》）

  - word: 祖
    type: 【动词】
    phonetic: zu3
    tags:
      - 高中
    samples:
      - trans: ❶效法;模仿。
        sentences:
          - ancient: 然皆祖屈原之从容辞令,终莫敢直谏。（《史记•屈原贾生列传》）
      - trans: ❷指出行之前祭祀路神。
        sentences:
          - ancient: 至易水上，既祖，取道。（《战国策•燕策三》）

