祖zu3
【名词】❶祖庙。
【例句】正月上日，受终于文祖。（《尚书•舜典》）
❷祖先;特指祖父。
【例句】吾祖死于是，吾父死于是。（《捕蛇者说》）丨思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。（《六国论》）丨此吾祖太常公宣德间执此以朝，他日汝当用之！（《项脊轩志》）
❸宗派或事业的首创者。
【例句】前年幵阁放柳枝，今年洗心参佛祖。（宋•苏轼《和蔡景繁海州石室》）
❹起初;产生之前。
【例句】浮游乎万物之祖。（《庄子•山木》）

【动词】❶效法;模仿。
【例句】然皆祖屈原之从容辞令,终莫敢直谏。（《史记•屈原贾生列传》）
❷指出行之前祭祀路神。
【例句】至易水上，既祖，取道。（《战国策•燕策三》）

