---
words:
  - word: 寻
    type: 【动词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: ❶寻找。
        sentences:
          - ancient: 太守即遣人随其往，<寻>向所志（标记），遂迷，不复得路。（《桃花源记》）
            url: xxxx
            vernacular: 太守立即派人随同渔人前往,渔人他们寻找先前所做的标记,结果迷了路,再也找不到原来通向桃花源的路了。即:副词,立即,马上。
          - ancient: 虽一龙发机，而七首不动，<寻>其方面（方向），乃知震之所在。（《张衡传》）
            url: xxxx
            vernacular: 地震发生时只有一条龙的机关发动，另外七个龙头丝毫不动。按照震动的龙头所指的方向去寻找，就能知道地震的方位。
          - ancient: 既窈窕以<寻>壑，亦崎岖而经丘。（《归去来兮辞》）
            url: xxxx
            vernacular: 既要探寻那幽深的沟壑，又要走过那高低不平的山丘。
      - trans: ❷探究。
        sentences:
          - ancient: 盖<寻>微以知著，原（穷究本原）始以见终。（《抱朴子•嘉盾》）
            url: xxxx
            vernacular: 是因为探寻细微之处就能了解大道理，推究开头就能知道结局。
      - trans: ❸重温。
        sentences:
          - ancient: 权令诸葛瑾报，更<寻>盟好。（《三国志•吴书•吴主传》）
            url: xxxx
            vernacular: 孙权派诸葛瑾回复刘备，答应重新结为盟友。
      - trans: ❹使用。
        sentences:
          - ancient: 三年将<寻>师焉，焉用慎？（《左传•僖公五年》）
            url: xxxx
            vernacular: 三年以后就要用兵，哪里用得着谨慎？
  - word: 寻
    type: 【量词】
