---
words:
  - word: 寻
    type: 【动词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: ❶寻找。
        sentences:
          - ancient: 太守即遣人随其往，寻向所志（标记），遂迷，不复得路。（《桃花源记》）
          - ancient: 虽一龙发机，商七首不动，寻其方面（方向），乃知震之所在。（《张衡传》）
          - ancient: 既窈窕以寻壑，亦崎岖而经丘。（《归去来兮辞》）
      - trans: ❷探究。
        sentences:
          - ancient: 盖寻微以知著，原（穷究本原）始以见终。（《抱朴子•嘉盾》）
      - trans: ❸重温。
        sentences:
          - ancient: 更寻盟好。（《三国志•吴书•吴主传》）
      - trans: ❹使用。
        sentences:
          - ancient: 三年将寻师焉。（《左传•僖公五年》）

  - word: 寻
    type: 【量词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: 古代的长度单位,八尺为一寻。
        sentences:
          - ancient: 千寻铁锁沉江底,一片降幡（降旗）出石头（指南京城）。（唐•刘禹锡《西塞山怀舌》）’

  - word: 寻
    type: 【副词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: 不久;接着。
        sentences:
          - ancient: 媒人去数日，寻遣丞请还，说有兰家女，承籍有宦官。（《孔雀东南飞》）
          - ancient: 诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。（《陈情表》）
          - ancient: 未果，寻病终。（《桃花源记》）
          - ancient: 【高考题例】英宗即位，加中书侍郎兼礼部尚书，寻加户部尚书。（《宋史・曾公亮传》）
          - ancient: 休烈寻转工部侍郎、修国史，献《五代帝王论》，帝甚嘉之。（《旧唐书•于休烈传》）	：

  - word: 寻
    type: 【介词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: 沿着;顺着。
        sentences:
          - ancient: 寻声暗问弹者谁？琵琶声停欲语迟。（《琵琶行》）
          - ancient: 驴仆剑装轻,寻河早早行。（宋•林逋《汴岸晓行》）

