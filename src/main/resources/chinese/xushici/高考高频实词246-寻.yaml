寻xun2
【动词】❶寻找。
【例句】太守即遣人随其往，寻向所志（标记），遂迷，不复得路。（《桃花源记》）丨虽一龙发机，商七首不动，寻其方面（方向），乃知震之所在。（《张衡传》）丨既窈窕以寻壑，亦崎岖而经丘。（《归去来兮辞》）
❷探究。
【例句】盖寻微以知著，原（穷究本原）始以见终。（《抱朴子•嘉盾》）
❸重温。
【例句】更寻盟好。（《三国志•吴书•吴主传》）
❹使用。
【例句】三年将寻师焉。（《左传•僖公五年》）

【量词】古代的长度单位,八尺为一寻。
【例句】千寻铁锁沉江底,一片降幡（降旗）出石头（指南京城）。（唐•刘禹锡《西塞山怀舌》）’

【副词】不久;接着。
【例句】媒人去数日，寻遣丞请还，说有兰家女，承籍有宦官。（《孔雀东南飞》）丨诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。（《陈情表》）丨未果，寻病终。（《桃花源记》）
【高考题例】英宗即位，加中书侍郎兼礼部尚书，寻加户部尚书。（《宋史・曾公亮传》）丨休烈寻转工部侍郎、修国史，献《五代帝王论》，帝甚嘉之。（《旧唐书•于休烈传》）	：

【介词】沿着;顺着。
【例句】寻声暗问弹者谁？琵琶声停欲语迟。（《琵琶行》）丨驴仆剑装轻,寻河早早行。（宋•林逋《汴岸晓行》）

