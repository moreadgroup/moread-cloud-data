      - trans: "古代的长度单位,八尺为一寻。"
        sentences:
          - ancient: "千<寻>铁锁沉江底,一片降幡（降旗）出石头（指南京城）。（唐•刘禹锡《西塞山怀舌》）’"
            url: xxxx
            vernacular: 千丈长的铁链沉入江底，一片降旗挂在石头城头。
  - word: 寻
    type: 【副词】
    phonetic: xun2
    tags:
      - 高中
    samples:
      - trans: 不久;接着。
        sentences:
          - ancient: 媒人去数日，<寻>遣丞请还，说有兰家女，承籍有宦官。（《孔雀东南飞》）
            url: xxxx
            vernacular: 媒人去后不几天，县丞被派府里行。请得太守指示还，遂向县令来说明：“有个姑娘是姓兰，家中世代都为官。
          - ancient: 诏书特下，拜臣郎中，<寻>蒙国恩，除臣洗马。（《陈情表》）
            url: xxxx
            vernacular: 朝廷又特地下了诏书，任命我为郎中，不久又蒙受国家恩命，任命我为太子的侍从。
          - ancient: 未果，<寻>病终，后遂无问津者。（《桃花源记》）
            url: xxxx
            vernacular: 但没有实现，不久后就病死了，后来就再也没有探访桃花源的人了。
          - ancient: 【高考题例】英宗即位，加中书侍郎兼礼部尚书，<寻>加户部尚书。（《宋史・曾公亮传》）
            url: xxxx
            vernacular: 英宗即位，任中书侍郎兼礼部尚书，不久兼任户部尚书。
          - ancient: "休烈<寻>转工部侍郎、修国史，献《五代帝王论》，帝甚嘉之。（《旧唐书•于休烈传》）"
            url: xxxx
            vernacular: 于休烈随即调任工部侍郎、修国史，进献《五代帝王论》，皇上甚为称赞。
