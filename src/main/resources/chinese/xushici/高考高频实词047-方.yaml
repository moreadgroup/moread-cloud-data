---
words:
  - word: 方
    type: 【名词】
    phonetic: fang1
    tags:
      - 高中
    samples:
      - trans: ❶四方形或六个面都是四方形的六面体。
        sentences:
          - ancient: 【例句】磐石方且厚,可以卒千年。（《孔雀东南飞》）
          - ancient: 视之,形若土狗（即蟻姑，一种小虫），梅花翅，方首，长胫，意似良。（《促织》）
          - ancient: 何方圜之能周兮？夫孰异道而相安？（《离骚》）
      - trans: ❷纵横（指称面积）。
        sentences:
          - ancient: 【例句】太行、王屋二山，方七百里，高万仞。（《愚公移山》）
          - ancient: 今齐地方千里，百二十城。（《邹忌讽齐王纳谏》）
          - ancient: 方六七十，如五六十，求也为之，比及三年，可使足民。（《子路、曾晳、冉有、公西华侍坐》）
      - trans: ❸方向；方位。
        sentences:
          - ancient: 【例句】自此以后,乃令史官记地动所从方起。（《张衡传》）
          - ancient: 曹公,豺虎也，挟天子以征四方。（《资治通鉴•汉纪五十七》）
          - ancient: 相与枕藉乎舟中，不知东方之既白。（《赤壁赋》）
      - trans: ❹方面;地方。
        sentences:
          - ancient: 【例句】有朋自远方来，不亦乐乎？（《论语•学而》）
      - trans: ❺边,一面
        sentences:
          - ancient: 【例句】所谓伊人，在水一方。（《诗经•秦风•兼葭》）		❻道理。
          - ancient: 【例句】吾将长见笑于大方之家（修养很高、明白道理的人）。（《秋水》）
          - ancient: 由也为芝，化友三年，可使有勇，且知方也。（《子路、曾晳、冉有、公西华侍坐》）
      - trans: ❼方法;办法。
        sentences:
          - ancient: 【例句】与之为无方，则危吾国；与之为有方，则危吾身。（《庄子•人间世》）
          - ancient: 而十四司正副郎好事者及书吏、狱官、禁卒，皆利系者之多，少有连,必多方钩致。（《狱中杂记》）
      - trans: ❽原则。
        sentences:
          - ancient: 【例句】处（处理）心有道（道德），行（行动）己有方。（《答李翊书》）

  - word: 方
    type: 【动词】
    phonetic: fang1
    tags:
      - 高中
    samples:
      - trans: ❶比拟;相比较。
        sentences:
          - ancient: 【例句】论功则汤武不足方;语德则尧舜未为远。（唐•魏徵《十渐疏》）
      - trans: ❷并排，并列。
        sentences:
          - ancient: 【例句】今井陉xing2之道，车不得方轨，骑不得成列，行数百里，其势粮食必在其后。（《史记•淮阴侯列传》）

  - word: 方
    type: 【形容词】
    phonetic: fang1
    tags:
      - 高中
    samples:
      - trans: 正直。
        sentences:
          - ancient: 【例句】屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也,方正之不容也，故忧愁幽思而作《离骚》。（《史记•屈原贾生列传》）

  - word: 方
    type: 【副词】
    phonetic: fang1
    tags:
      - 高中
    samples:
      - trans: ❶正在；正。
        sentences:
          - ancient: 【例句】如今人方为刀俎，我为鱼肉，何辞为？（《鸿门宴》）
          - ancient: 方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。（《狼》）
          - ancient: 方欲发使送武等，会缑王与长水虞常等谋反匈奴中。（《苏武传》）
          - ancient: 吴之民方痛心焉，于是乘其厉声以呵，则噪而相逐。（《五人墓碑记》）	
          - ancient: 【高考题例】灌言："水浅不胜舟，陆当用车八千乘，沿边方登麦，愿以运费增价就籴之。"（《宋史•何灌传》）
      - trans: ❷才；刚。
        sentences:
          - ancient: 【例句】向（不久之前）见雷将军，方知足下军令矣。（《资治通鉴•唐纪三十四》）
          - ancient: 予出使至磁州锻坊（作坊）观炼铁,方识真钢。（《梦溪笔谈•辨证一》）
      - trans: ❸将要。.
        sentences:
          - ancient: 【例句】然轼方过临江，当往游焉。（宋•苏轼《答谢民师推官书》）
          - ancient: 余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。（《石钟山记》）

  - word: 方
    type: 【介词】
    phonetic: fang1
    tags:
      - 高中
    samples:
      - trans: 当；正在。
        sentences:
          - ancient: 【例句】方今之务，莫若使民务农而已矣。（汉•晁错《论贵粟疏》）
          - ancient: 方是时，余之力尚足以入，火尚足以明也。（《游褒禅山记》）
          - ancient: 方急时，不及召下兵，以故荆轲逐秦王。（《荆轲刺秦王》）
          - ancient: 【高考题例】文日:"主少国疑，大臣未附，百姓不信，方是之时;属之于子乎？属之于我乎?"（《史记•孙子吴起列传》）：

