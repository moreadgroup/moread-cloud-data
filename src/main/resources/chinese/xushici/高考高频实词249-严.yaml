---
words:
  - word: 严
    type: 【名词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: ❶威严;威信。
        sentences:
          - ancient: 衡下车,治威严，整法度,阴知奸党名姓，一时收禽,上下肃然，称为政理。（《张衡传》）
      - trans: ❷对父亲的尊称。
        sentences:
          - ancient: 家严大喜，急引至舍。（明•袁宏道《拙效传》）

  - word: 严
    type: 【动词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: ❶尊重;尊敬。
        sentences:
          - ancient: 严大国之威以修敬也。（《廉颇蔺相如列传》）
      - trans: ❷戒备。
        sentences:
          - ancient: 可潜稍严，以备不虞。（《世说新语•雅量》）
      - trans: ❸整饬;整顿。
        sentences:
          - ancient: 鸡鸣外欲曙,新妇起严妆。（《孔雀东南飞》）

  - word: 严
    type: 【形容词】
    phonetic: yan2
    tags:
      - 高中
    samples:
      - trans: ❶紧急;急迫。
        sentences:
          - ancient: 事严，虞（充虞，孟子弟子）不敢请。（《孟子•公孙丑下》）
      - trans: ❷严厉;严格。
        sentences:
          - ancient: 虽有高城深池，严法重刑,犹不能禁也。（汉•晁错《论贵粟疏》）
          - ancient: 宰严限（期限）追比，旬余，杖至百，两股间脓血流离，并虫亦不能,行捉矣。（《促织》）
          - ancient: 虽董之以严刑，震之以威怒，终苟免而不怀仁，貌恭而不心服。（《谏太宗十思疏》）
      - trans: ❸猛烈;厉害。
        sentences:
          - ancient: 今日大风寒，寒风摧树木，严霜（浓霜）结庭兰。 （《孔雀东南飞》）
          - ancient: 杀气毒剑戟，严风裂衣裳。（唐•李白《北上行》）
      - trans: ❹严肃;庄重。
        sentences:
          - ancient: 及崔至，则端服严容，大数（责备）张曰……（唐•元稹《莺莺传》）
      - trans: ❺严酷;残忍。
        sentences:
          - ancient: 严杀尽兮弃原野。（战国楚•屈原《国殮》）