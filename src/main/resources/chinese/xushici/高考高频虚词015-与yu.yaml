---
words:
  - word: 与
    type: 【名词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: 朋党;盟国。
        sentences:
          - ancient: 王夺之人，霸夺之与，强夺之地。（《荀子•王制》）
          - ancient: 追击其党与，尽平江淮地。（《后汉书•马成传》）
  - word: 与
    type: 【动词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: ❶给予;授予。
        sentences:
          - ancient: 与尔三矢，尔其（一定）无忘乃（你的）父之志！（《伶官传序》）
          - ancient: 我持白璧一双，欲献项王，玉斗一双，欲与亚父。（《鸿门宴》）
          - ancient: 【高考题例】东西异路，不当与，然安忍于旧治坐视?（《宋史•萧燧传》）
      - trans: ❷结交。
        sentences:
          - ancient: 与嬴（指秦国，嬴，秦王的姓）而不助五国也。（《六国论》）
          - ancient: 合从缔交，相与为一。（《过秦论》）
          - ancient: 失其所与，不知。（《烛之武退秦师》）
      - trans: ❸赞许;赞成。
        sentences:
          - ancient: 夫子喟然叹曰："吾与点也!"（《子路、曾晳、冉有、公西华侍坐》）
          - ancient: 【高考题例】初荐王安石，及同辅政，知上方向之，阴为子孙计，"凡更张庶事，一切听顺，而外若不与之者。（《宋史•曾公亮传》）
      - trans: ❹对付;抵挡。
        sentences:
          - ancient: 庞煖（xuan1）易与耳。（《史记•燕召公世家》）
      - trans: ❺帮助。
        sentences:
          - ancient: 君不与胜者，而与不胜者。（《战国策•齐策一》）
      - trans: ❻等待。
        sentences:
          - ancient: 汩余若将不及兮，恐年岁之不吾与。（《离骚》）
  - word: 与
    type: 【介词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: ❶和;跟;同。
        sentences:
          - ancient: 念与世间辞，千万不复全！（《孔雀东南飞》）
          - ancient: 故方其盛也，举天下豪杰，莫能与之争。（《伶官传序》）
          - ancient: 燕国有勇士秦武阳，年十二，杀人，人不敢与忤视。（《荆轲刺秦王》）
          - ancient: 沛公曰："君安与项伯有故?"（《鸿门宴》）
          - ancient: 【高考题例】陵寝皆在邑境，岁时缮治无虚曰，今乃与百县均赋，曷若置此，使之奉常时用乎？（《宋史•范纯礼传》）；
      - trans: ❷为；替。
        sentences:
          - ancient: 去时里正与裹头，归来头白还戍边。（《兵车行》）
  - word: 与
    type: 【连词】
    phonetic: yu3
    tags:
      - 高中
    samples:
      - trans: 和;跟;同。
        sentences:
          - ancient: 彼与彼年相若也，道相似也。（《师说》）
          - ancient: 芳与泽其杂糅兮，唯昭质其犹未亏。（《离骚》）
          - ancient: 夫子之言性与天道，不可得而闻也。（《论语•公冶长》）
  - word: 与 【助词】    
    phonetic: yu2
    tags:
      - 高中
    samples:
      - trans: ❶用在句末，表示疑问，相当于"吗"""吧""呢"。
        sentences:
          - ancient: 求！无乃尔是过与？（《季氏将伐颛臾》）
      - trans: ❷用在句末，表示反诘，相当于""呢""吗"。
        sentences:
          - ancient: 今恩足以及禽兽，而功不至于百姓者，独何与?  （《齐桓晋文之事》）
      - trans: ❸用在句末，表示感叹，相当于"吧""啊"。
        sentences:
          - ancient: 子曰："语之而不惰者，其（颜）回也与！"（《论语•子罕》
          - ancient: 求之与？抑与之与？（《论语•学而》）
