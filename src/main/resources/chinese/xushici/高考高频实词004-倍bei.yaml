---
words:
  - word: 倍
    type: 【动词】
    phonetic: bei4
    tags:
      - 高中
    samples:
      - trans: ❶通"背"。背叛;违背。
        sentences:
          - ancient: 【例句】与宋致死,虽倍楚可也。子何惧焉？（《左传•襄公二十七年》）
          - ancient: 丨愿伯具言臣之不敢倍德也。（《鸿门宴》）
          - ancient: 丨且民有倍心者，君上之明有所不及也。（《韩非子•难三》）
          - ancient: 丨倍其公法，损其正心,专听其大臣者，危主也。（《管子•任法》）
          - ancient: 丨是遁天倍情，忘其所受。（《庄子•养生主》）
          - ancient: 丨倍道而妄行，则天不能使之吉。（《荀子•天论》）
      - trans: ❷通"背"。背向；背靠。
        sentences:
          - ancient: 【例句】兵法右倍山陵，前左水泽。（《史记•淮阴侯列传》）
          - ancient: 丨不明于心术,而欲行令于人，犹倍招而必射之。（《管子•七法》）
      - trans: ❸背诵。
        sentences:
          - ancient: 【例句】读书倍文，功力兼人。（汉•韩信《韩滂墓志铭》）
          - ancient: 丨郑注:"倍文曰讽。"（《周礼•大司乐》）
          - ancient: 丨牧六岁，则使就从兄受书，夜归，复亲督之倍讽。（清•刘大櫆《郑氏节母传》）
      - trans: ❹增加。
        sentences:
          - ancient: 【例句】焉用亡郑以倍邻？邻之厚，君之薄也。（《烛之武退秦师》）
          - ancient: 丨子为我召之，吾倍其室。（《国语•楚语上》）
  - word: 倍
    type: 【量词】
    phonetic: bei4
    tags:
      - 高中
    samples:
      - trans: 一倍。
        sentences:
          - ancient: 【例句】尝以十倍之地，百万之众，叩关而攻秦。（《过秦论》）
          - ancient: 丨诸侯之所亡（失去），与战败而亡者，其实亦百倍。（《六国论》）,
  - word: 倍
    type: 【副词】
    phonetic: bei4
    tags:
      - 高中
    samples:
      - trans: 加倍。
        sentences:
          - ancient: 【例句】江干（岸）上下十余里间，珠翠罗绮溢目，车马塞途,饮食百物皆倍穹常时。（《观潮》）
          - ancient: 丨田家少闲月，五月人倍忙。（《观刈麦》）
          - ancient: 丨独在异乡为异客，每逢佳节倍思亲。（《九月九日忆山东兄弟》）
