---
words:
  - word: 患
    type: 【名词】
    phonetic: huan4
    tags:
      - 高中
    samples:
      - trans: ❶灾祸;忧患。
        sentences:
          - ancient: 夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？（《伶官传序》）
          - ancient: 今北土未平，马超、韩遂尚在关西,为（曹）操后患。（《资治通鉴•汉纪五十七》）
          - ancient: 阉竖恐终为其患，遂共谗之。（《张衡传》）
          - ancient: 轲曰："今有一言，可以解燕国之患，而报将军之仇者,何如？"（《荆轲刺秦王》）
          - ancient: 【高考题例】贾生谏，以为患之兴自此起矣。（《史记•屈原贾生列传》）
      - trans: ❷毛病;弊病。
        sentences:
          - ancient: 孟子称"人之患在好为人师"。（《答韦中立论师道书》）
      - trans: ❸疾病。
        sentences:
          - ancient: 余能理亡国之刓弊，愈膏肓之患难。（唐•柳宗元《愈膏肓赋》）
  - word: 患
    type: 【动词】
    phonetic: huan4
    tags:
      - 高中
    samples:
      - trans: ❶忧虑;担忧。
        sentences:
          - ancient: 不<患>其众之不足也，而<患>其志行之少耻也。（《勾践灭吴》）
          - ancient: 欲勿予，即患秦兵之来。（《廉颇蔺相如列传》）
          - ancient: 丘也闻有国有家者，不<患>寡而<患>不均，不<患>贫而<患>不安。（《季氏将伐颛臾》）
          - ancient: 则秦之所大欲，诸侯之所大患，固不在战矣。（《六国论》）
          - ancient: 【高考题例】诸侯患楚之强。故楚之贵戚尽欲害吴起。（《史记♦孙子吴起列传》）
      - trans: ❷厌恶;痛恨。
        sentences:
          - ancient: 周处年少时，凶强侠气，为乡里所患。（《世说新语・自新》）
