---
words:
  - word: 啖
    type: 【动词】
    phonetic: dan4
    tags:
      - 高中
    samples:
      - trans: ❶吃;给……吃。
        sentences:
          - ancient: 樊哙覆其盾于地，加彘肩上，拔剑切而<啖>之。（《鴻门宴》）
            url: xxxx
            vernacular: 樊哙把他的盾牌扣在地上，把猪腿放（在盾）上，拔出剑来切着吃。
          - ancient: 先生既墨者，摩顶放踵，思一利天下，又何吝一躯<啖>我而全微命乎？（《中山狼传》）
            url: xxxx
            vernacular: 先生既然是墨家学士，累得从头到脚都是伤，（不就）是想为天下作一点贡献吗，又何必吝惜一副身躯让我吃而保全我的小命呢？
          - ancient: 时座上有健<啖>客，貌甚寝。（《大铁椎传》）
            url: xxxx
            vernacular: 当时座上有个饭量很大的客人，容貌很丑陋
          - ancient: 置之华屋之下，席以露床，<啖>以枣脯。（《史记•滑稽列传》）
            url: xxxx
            vernacular: 安置在华美的房屋中，睡在没有帷帐的床上，用枣脯喂养它。
          - ancient: "异日，与君游于果园，食桃而甘，不尽，以其半<啖>君。（《韩非子•说难》）"
            url: xxxx
            vernacular: 另一天，他和卫君在果园游览，吃桃子觉得甜，没有吃完，就把剩下的半个给卫君吃。
          - ancient: "【高考题例】副使崔应麟见民<啖>泽中雁矢，囊示登云，登云即进之于朝。（《明史•陈登云传》）"
            url: xxxx
            vernacular: 副使崔应麟见到百姓吃湖泽中的雁粪，便装入袋中给陈登云看，陈登云随即送至朝廷。
      - trans: ❷引诱。
        sentences:
          - ancient: "乃用张良计，使郦生、陆贾往说秦将，<啖>以利，因袭攻武关，破之。（《史记•高祖本纪》）"
            url: xxxx
            vernacular: 就用了张良的计策，派郦生，陆贾去游说秦将，并用财利进行引诱，乘此机会前去偷袭武关，攻了下来。
          - ancient: 【高考题例】贼大惧，以利<啖>守兵，得登城。（《宋史•朱昭传》）
            url: xxxx
            vernacular: 敌人十分害怕，于是就利诱守城的兵士，登上了城上。
  - word: 啖
    type: 【形容词】
    phonetic: dan4
    tags:
      - 高中
    samples:
      - trans: 通"淡"。味薄;清淡。
        sentences:
          - ancient: 今太子仁孝，天下皆闻之，吕后与陛下攻苦食<啖>，其可背哉！（《史记•刘敬叔孙通列传》）
            url: xxxx
            vernacular: 现在太子仁义忠孝，是天下人都知道的；吕后与陛下同经艰难困苦，同吃粗茶淡饭，是患难与共的夫妻，怎么可以背弃她呢!
