---
words:
  - word: 见
    type: 【名词】
    phonetic: jian4
    tags:
      - 高中
    samples:
      - trans: 见解;见识。
        sentences:
          - ancient: 【例句】谡大笑曰：""汝真女子之见！兵法云："凭高视下，势如劈竹。"若魏兵到来，吾教他片甲不回！"（《三国演义》九十五回）

  - word: 见
    type: 【动词】
    phonetic: jian4
    tags:
      - 高中
    samples: 
      - trans: ❶看到。
        sentences:
          - ancient: 【例句】屈平属（Zhu3,撰写）草稿未定，上官大夫见而欲夺之，屈平不与。（《史记•屈原贾生列传》）
          - ancient: 虎见之，庞然大物也，以为神,蔽林间窥之。（《黔之驴》）
      - trans: ❷见面;会面。
        sentences:
          - ancient: 【例句】移船相近邀相见，添酒回灯重开宴。（《琵琶行》）
      - trans: ❸拜见;谒见。
        sentences:
          - ancient: 【例句】公将战，曹刿请见。（《曹刿论战》）
          - ancient: 孟子见梁惠王。（《孟子•梁惠王上》）
      - trans: ❹召见;接见。
        sentences:
          - ancient: 【例句】于是见公输盘。（《公输》）
          - ancient: 秦王坐章台（秦国宫殿名）见相如。（《廉颇蔺相如列传》）
          - ancient: 愿得将军之首以献秦,秦王必喜而善见臣。（《荆轲刺秦王》）
      - trans: ❺知道;懂得。
        sentences:
          - ancient: 【例句】齿豁头童方悟此，乃翁见事可怜迟。（宋•陆游《示儿》）

  - word: 见
    type: 【副词】
    phonetic: jian4
    tags:
      - 高中
    samples: 
      - trans: ❶在动词前，表示被动。相当于"被"。
        sentences:
          - ancient: 【例句】信而见疑，忠而被谤。（《史记•屈原贾生列传》）
          - ancient: 欲予秦，秦城恐不可得，徒（白白地）见欺。（《廉颇蔺相如列传》）
          - ancient: 事如此，此必及我，见犯乃死，重负国。（《苏武传》）
          - ancient: 然则将军之仇报，而燕国见陵之耻除矣。（《荆轲刺秦王》）
          - ancient: 【高考题例】公居伊周（商伊尹和西周周公，后并称，指执掌朝:政的大臣）之位,一旦以罪见黜，虽欲牵黄犬（比喻过着悠闲的日子），复可得乎！（《晋书.鲁芝传》）

      - trans: ❷加在【动词】前用于指称自己，表示承受别人的某种动作行为。
        sentences:
          - ancient: 【例句】遍报诸所尝见德者。（《史记•苏秦列传》）
          - ancient: 生孩六月，慈父见背（弃我而死去）。（《陈情表》）
          - ancient: 君既若见录，不久望君来。（《孔雀东南飞》）

  - word: 见
    type: 【动词】
    phonetic: xian2
    tags:
      - 高中
    samples: 
      - trans: 同"现"。❶显现；出现。
        sentences:
          - ancient: 【例句】（荆）轲既取图奏（进献）之，秦王发图，图穷而匕首见。（《史记•刺客列传》）
          - ancient: 何时眼前突兀见此屋，吾庐独破受冻死亦足！（《茅屋为秋风所破歌》）
      - trans: ❷表现。
        sentences:
          - ancient: 【例句】造父者，天下之善御者也，无舆马则无所见其能。（《荀子•儒效》）
          - ancient: 退论书策以舒其愤，思垂空文以自见。（《报任安书》）
      - trans: ❸引见。
        sentences:
          - ancient: 【例句】子墨子曰："胡不见我于王？"（《公输》）

  - word: 见
    type: 【形容词】
    phonetic: xian2
    tags:
      - 高中
    samples: 
      - trans: 现成的。
        sentences:
          - ancient: 【例句】发近县见卒万六千人。（《汉书•文帝纪》）
