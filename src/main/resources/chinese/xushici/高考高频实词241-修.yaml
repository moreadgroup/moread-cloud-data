修xiu1
【动词】❶修饰;装饰。
【例句】美要眇兮宜修。（战国楚•屈原《九歌•湘君》）丨（冯）参为人矜严（庄重严肃），好修容仪。（《汉书•冯奉世传》）丨进不入以离尤兮，退将复修吾初服。制芰（ji4）荷以为衣兮，集芙蓉以为裳。（《离骚》）丨民生各有所乐兮，余独好修以为常。（《离骚》）
❷治理;整饬。
【例句】外结好孙权，内修政理。（《隆中对》）丨是故事修而谤兴,德高而毁来。（唐•韩愈《原毁》）丨余稍为修葺，使不上漏。（《项脊轩志》）丨赖天之灵，宗庙之福，修我戈矛，从王于师，以为前驱，雪九庙之耻，复高祖之业。（《〈指南录〉后序》）
❸修建;修造。
【例句】内立法度，务耕织,修守战之具。（《过秦论》）丨乃重修岳阳楼，增其旧制（旧时的规模），刻唐贤今人诗赋于其上。（《岳阳楼记》）
❹编著;撰写。
【例句】左丘失明，厥（句首语气词）有《国语》；孙子膑脚,《兵法》修列。（《报在安书》）
【高考题例】神宗召对，除集贤校理、同知礼院，编修中书条例。（《宋史•许将传》）
❺学习；遵循。
【例句】是以圣人不期修古，不法常可。（《韩非子•五蠹》）丨怠者不能修，而忌者畏人修。（唐•韩愈《原毁》）
❻修养。
【例句】夫如是，故远人不服，则修文德以来之。（《季氏将伐颛臾(zhuānyú)》）丨君子能修其道，纲而纪之，统而理之，而不能为容。（《史记•孔子世家》）丨臣修身洁行数十年，终不以监门困故而受公子财。（《史记•魏公子列传》）
【高考题例】文升请帝减膳撤乐，修德省愆（罪过）。（《明史・马文升传》）

【形容词】❶长;高。
【例句】修短合度。（三国魏•曹植《洛神赋》）丨盖简（选择）桃核修狭者为之。（《核舟记》）丨有鱼焉，其广数千里，未有知其修者，其名为靦。（《逍遥游》）丨此地有崇山峻岭，茂林修竹,又有清流激湍，映带左右，引以为流觞曲水,列坐其次。（《兰亭集序》）
❷美好;善。
【例句】其修士不能以货赂事人。（《韩非子•孤愤》）丨纷吾既有此内美兮，又重之以修能。（《离骚》）
