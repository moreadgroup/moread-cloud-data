走zou3
【名词】仆人;供驱使的人。用作自称的谦辞。
【例句】太史公牛马走司马迁再拜言。（《报任安书》）
【动词】❶跑。
【例句】双兔傍地走，安能辨我是雄雌？（《木兰诗》）丨耶（通"爷"，父亲）娘妻子走相送，尘埃不见咸阳桥。（《兵车行》）丨荆轲逐秦王，秦王还柱而走。（《荆轲刺秦王》）
【高考题例】及悼王死，宗室大臣作乱而攻吴起,吴起走之（到）王尸而伏之。（《史记•孙子吴起列传》）
❷逃跑。
【例句】填然鼓之，兵刃既接，弃甲曳兵而走。（《寡人之于国也》）
❸奔向；趋向。
【例句】骊山北构而西折，直走咸阳。（《阿房宫赋》）丨永之人争奔走焉。（《捕蛇者说》）
❹移动，滚动。
【例句】轮台九月风夜吼，一川碎石大如斗，随风满地石乱走。（《走马川行奉送封大夫出师西征》）
