夷yi2
【名词】❶我国古代对东部各少数民族的统称。后泛指少数
民族。
【例句】至于海邦，淮夷来同。（《诗经•鲁颂•閟宫》）丨西和诸戎，南抚夷越。（《三国志•蜀书•诸葛亮传》）丨北蛮夷之鄙人，未尝见天子，故振慑，愿大王少假借之，使毕使于前。（《荆轲刺秦王》）丨台隍枕夷夏之交,宾主尽东南之美。（《滕王阁序》）
【高考题例】天水夷夏慕德，老幼赴阙献书，乞留芝。（《晋书•鲁芝传》）
❷指外国或外国人。
【例句】逆夷各狐凭鼠伏,潜避两炮台中，不敢出入。（《广东军务记•三元里抗英》）
❸平辈。
【例句】今诸将皆陛下故等夷。（《史记•留侯世家》）
❹同"痍"。创伤。
【例句】子反（楚国大臣）命军吏察夷伤。（《左传•成公十六年

【动词】❶铲除;削平。
【例句】遂北烧夷齐城郭室屋。（《史记•项羽本纪》）
❷杀;消灭。
【例句】师行三十年，兵所诛屠夷灭死者不可胜数。（《汉书•武五子传》）丨且陛下春秋高，法令亡（无）常，大臣亡罪夷灭者数十家，安危不可知，子卿尚這谁为乎？（《苏武传》）丨如彼竖子用臣之计，陛下安得而夷之乎！（《史记•淮阴侯列传》）丨不务出此，而天下已集，乃谋畔逆，夷灭宗族，不亦宜乎！（《史记•淮阴侯列传》）
【高考题例】坐射起而夷宗死者七十余家。（《史记•孙子吴起列传》）	：
【形容词】❶平坦。
【例句】夫夷以近，则游者众;险以远，则至者少。（《游褒禅山记》）丨其船背稍夷,则题名其上。（《核舟记》）
❷愉悦。
【例句】既见君子，云胡不夷？（《诗经•郑风•风雨》）丨与之论辨，言和而色夷。（《送东阳马生序》）
❸平安;安定。
【高考题例】境内清夷，商人露宿于道。（《后汉书•王涣传》）