---
words:
  - word: 须
    type: 【名词】
    phonetic: xu1
    tags:
      - 高中
    samples:
      - trans: ❶胡子。
        sentences:
          - ancient: 始以强壮出，及还，须发尽白。（《苏武传》）
          - ancient: 高祖为人，隆准而龙颜，美须髯,左股有七十二黑子。（《史记•高祖本纪》）
      - trans: ❷动物的触须。
        sentences:
          - ancient: 俄（一会儿）见小虫跃起，张尾伸须。（《促织》）
      - trans: ❸片刻;一会儿。
        sentences:
          - ancient: 贤能不待次而举,罢（pi2指德行不好的人）不能不待须而废。（《荀子•王制》）
          - ancient: 坐须臾，沛公起如厕，因招樊哙出。（《鸿门宴》）

  - word: 须
    type: 【动词】
    phonetic: xu1
    tags:
      - 高中
    samples:
      - trans: ❶等待;等到。
        sentences:
          - ancient: 是以吴起须故人而食。（《韩非子•外储说左上》）
          - ancient: 且放白鹿青崖间，须行即骑访名山。（《梦游天姥吟留别》）
          - ancient: 寡君须矣，吾子其入也！（《左传•成公十二年》）
      - trans: ❷通"需"。需要。
        sentences:
          - ancient: 敛以时服，不须器物。（《三国志•蜀书•诸葛亮传》）

  - word: 须
    type: 【副词】
    phonetic: xu1
    tags:
      - 高中
    samples:
      - trans: ❶必须;应该。
        sentences:
          - ancient: 烹羊宰牛且为乐，会须一饮三百杯。（《将进酒》）
          - ancient: 白日放歌须纵酒，青春作伴好还乡。（《闻官军收河南河北》）
          - ancient: 我这里青鸾有信频须寄，你却休"金榜无名誓不归"。（《长亭送别》）
      - trans: ❷本;本来。
        sentences:
          - ancient: 你本是赵盾家堂上宾，我须是屠岸贾门下人。（元•纪君祥《赵氏孤儿》一折）
