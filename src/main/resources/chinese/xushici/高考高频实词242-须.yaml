须xu1
【名词】❶胡子。
【例句】始以强壮出，及还，须发尽白。（《苏武传》）丨高祖为人，隆准而龙颜，美须髯,左股有七十二黑子。（《史记•高祖本纪》）
❷动物的触须。
【例句】俄（一会儿）见小虫跃起，张尾伸须。（《促织》）
❸片刻;一会儿。
【例句】贤能不待次而举,罢（pi2指德行不好的人）不能不待须而废。（《荀子•王制》）丨坐须臾，沛公起如厕，因招樊哙出。（《鸿门宴》）

【动词】❶等待;等到。
【例句】是以吴起须故人而食。（《韩非子•外储说左上》）丨且放白鹿青崖间，须行即骑访名山。（《梦游天姥吟留别》）丨寡君须矣，吾子其入也！（《左传•成公十二年》）
❷通"需"。需要。
【例句】敛以时服，不须器物。（《三国志•蜀书•诸葛亮传》）

【副词】❶必须;应该。
【例句】烹羊宰牛且为乐，会须一饮三百杯。（《将进酒》）丨白日放歌须纵酒，青春作伴好还乡。（《闻官军收河南河北》）丨我这里青鸾有信频须寄，你却休"金榜无名誓不归"。（《长亭送别》）
❷本;本来。
【例句】你本是赵盾家堂上宾，我须是屠岸贾门下人。（元•纪君祥《赵氏孤儿》一折）
