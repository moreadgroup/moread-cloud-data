固gu4
【形容词】❶坚固。多形容城郭完坚或地势险要，易守难攻。
【例句】然后践华（华山）为城，因河为池，据亿丈之城，临不测之渊，以为固。（《过秦论》）丨荆州与国邻接，江山险固，沃野万里，士民殷富。（《资治通鉴•汉纪五十七》）丨秦孝公据靖函之固，拥雍州之地。（《过秦论》）丨今夫颛臾，固而近于费，今不取，后世必为子孙忧。（《季氏将伐颛臾》）
❷顽固；固执。
【例句】汝心之固，固不可彻，曾不若孀妻弱子。（《愚公移山》）丨独夫之心，日益骄固。（《阿房宫赋》）
❸固定;稳固。
【例句】法莫如一而固。（《韩非子•五蠹》）丨天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。（《过秦论》）
【高考题例】顾而谓吴起日："美哉乎山河之固，此魏国之宝也！"（《史记•孙子吴起列传》）
❹简陋;鄙陋。
【例句】奢则不孙（同"逊"，顺），俭则固。（《论语•述而》）丨鄙人固陋，不知怠讳。（汉•司马相如《上林赋》）

【副词】❶坚决。
【例句】秦王恐其破璧，乃辞谢，固请，召有司案图（察看地图），指从此以往十五都予赵。（《廉颇蔺相如祝传》）丨前朝恩封三子为侯，固辞不受。（汉•曹操《让县自明本志令》）丨君臣固守以窥周室。（《过秦论》）丨蔺相如固止之,曰："公之视廉将军孰与秦王？"（《廉颇蔺相如列传》）
【高考题例】郎中李梦阳进日："公诚及此时率大臣固争，去"八虎"易易耳。"（《明史•韩文传》）

❷本来;原来。
【例句】人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。（《报任安书》）丨至于颠覆，理固宜然。（《六国论》）丨伏清白以死直兮，固前圣之所厚。（《离骚》）丨固知一死生为虚诞，齐彭殓为妄作。（《兰亭集序》）丨固一世之雄也，而今安在哉？（《赤壁赋》）
❸诚然。
【例句】子固仁者,然愚亦甚矣。（《中山狼传》）丨凡四方之士无有不过而拜且泣者，斯固百世之遇也。（《五人墓碑记》）