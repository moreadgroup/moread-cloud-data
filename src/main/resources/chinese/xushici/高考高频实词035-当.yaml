---
words:
  - word: 当
    type: 【动词】
    phonetic: dang1
    tags:
      - 高中
    samples:
      - trans: ❶阻挡;抵挡。
        sentences:
          - ancient: 【例句】料大王士卒足以当项王乎？（《鸿门宴》）
          - ancient: 【高考题例】金人困都城，傅日夜亲当矢石。（《宋史•孙傅传》）
      - trans: ❷处在（某个地方、时间）。
        sentences:
          - ancient: 【例句】舟回至两山间，将入港口，有大石当中流。（《石钟山记》）
          - ancient: 今所经中岭及山巅，崖限当道者，世皆谓之天门云。（《登泰山记》）
          - ancient: 《易》之兴也，其当殷之末世，周之盛德邪？（《周易•系辞下》）
      - trans: ❸掌管;主持。
        sentences:
          - ancient: 【例句】人君当神器之重，居域中之大。（《谏太宗十思疏》）
          - ancient: 至于今，郡之贤士大夫请于当道，即除魏阉废祠之址以葬之。（《五人墓碑记》）
          - ancient: 会使辙交驰，北邀当国者相见。（《〈指南录〉后序》）
          - ancient: 猥以微贱，当侍东宫，非臣陨首所能上报。（《陈情表》）
          - ancient: 【高考题例】及当大事，毅然执持,人不能夺，卒以此忤权幸去。（《明史•傳珪传》）
      - trans: ❹承受;承当。
        sentences:
          - ancient: 【高考题例】救荒如救焚，有罪，吾自当之。（《明史•韩文传》）
      - trans: ❺顶;抵。
        sentences:
          - ancient: 【例句】以一（张）仪而当汉中地，臣请往如楚。（《史记•屈原贾生列传》）
          - ancient: 募有能捕之者，当其租入。（《捕蛇者说》）
      - trans: ❻占着;把着。
        sentences:
          - ancient: 【例句】一夫当关，万夫莫开。（《蜀道难》）
      - trans: ❼符合。
        sentences:
          - ancient: 【例句】将献公堂，惴惴恐不当意，思试之斗以觇（chan1,窥视,观察）之。（《促织》）
      - trans: ❽应当。
        sentences:
          - ancient: 【例句】古公曰："我世当有兴者，其在（姬）昌乎?"（《史记•周本纪》）
          - ancient: 吾闻二世少子也，不<当>立，<当>立者乃公子扶苏。（《陈涉世家》）
          - ancient: 诸将吏敢复有言当迎操者，与此案同。（《赤壁之战》）
      - trans: ❾判决;判罪。
        sentences:
          - ancient: 【例句】吏当广所失亡多，为虏所生得。（《史记•李将军列传》）
          - ancient: 汉使张胜谋杀单于近臣，当死。（《苏武传》）
          - ancient: 【高考题例】密州民田产银，或盗取之,大理当以强。（《宋史・曾公亮传》）
          - ancient: 芝坐爽下狱，当死，而□不讼直，志不苟免，宣帝嘉之，赦而不诛。（《晋书•鲁芝传》）

  - word: 当
    type: 【副词】
    phonetic: dang1
    tags:
      - 高中
    samples:
      - trans: ❶将要;就要;就会。
        sentences:
          - ancient: 【例句】卿与子敬、程公便在前发，孤当续发人众，多载资粮，为卿后援。（《资治通鉴•汉纪五十七》）
          - ancient: 既欲留之，当减三年寿数，乃可与君相终始，君愿之乎？（《聊斋志异•石清虚》）
          - ancient: 此吾祖太常公宣德间执此以朝，他日汝当用之!（《项脊轩志》）
          - ancient: 今当远离，临表涕零，不知所言。（《出师表》）
      - trans: ❷必定;一定。
        sentences:
          - ancient: 【例句】不久当归还,还必相迎取。（《孔雀东南飞》）

  - word: 当
    type: 【介词】
    phonetic: dang1
    tags:
      - 高中
    samples:
      - trans: ❶对着。
        sentences:
          - ancient: 【例句】盛夏之时，当风而立。（《论衡•变动》）
          - ancient: 唧唧复唧唧,木兰当户织。（《木兰诗》）
      - trans: ❷处在某个时候。
        sentences:
          - ancient: 【例句】当是时也，商君佐之。（《过秦论》）
          - ancient: 当是时，妇手拍儿声，口中呜声，儿含乳啼声，......一齐凑发，众妙毕备。（《口技》）
          - ancient: 当是时，项王军在鸿门下,沛公军在霸上，相去四十里。（《鸿门宴》）
          - ancient: 陈康肃公善射，当世无双，公亦以此自矜。（《卖油翁》）

  - word: 当
    type: 【连词】
    phonetic: dang1
    tags:
      - 高中
    samples:
      - trans: 如果;假使。
        sentences:
          - ancient: 【例句】先祖当贤，后子孙必早（显赫）。（《荀子•君子》）

  - word: 当
    type: 【名词】
    phonetic: dang4
    tags:
      - 高中
    samples:
      - trans: 器物的底部。
        sentences:
          - ancient: 【例句】今有千金之玉卮而无当，可以盛水乎？（《韩非子•外储说右上》）

  - word: 当
    type: 【动词】
    phonetic: dang4
    tags:
      - 高中
    samples:
      - trans: ❶当作。
        sentences:
          - ancient: 【例句】晩食以<当>肉，安步以<当>车，无罪以<当>贵，清静贞正以自虞。（《战国策•齐策四》）
      - trans: ❷抵押。
        sentences:
          - ancient: 【例句】走笔还诗债,抽衣当药钱。（唐•白居易《自咏老身示诸家属》）
          - ancient: 匈奴留汉使郭吉、路充国等,前后十余辈。匈奴使来，汉亦留之以相当。（《苏武传》）

  - word: 当
    type: 【形容词】
    phonetic: dang4
    tags:
      - 高中
    samples:
      - trans: 适当;恰当。
        sentences:
          - ancient: 【例句】赏罚无当，赋敛无度。（《过秦论》）
          - ancient: 古法采草药多用二月、八月，此殊未当。（《梦溪笔谈•药议》）
          - ancient: 驼闻之，曰："甚善。名我固当。"（《种树郭橐驼传》）

  - word: 当
    type: 【动词】
    phonetic: tang3
    tags:
      - 高中
    samples:
      - trans: 通"倘"。如果;假使。
        sentences:
          - ancient: 【例句】则胜负之数，存亡之理，当与秦相较，或未易量。（《六国论》）