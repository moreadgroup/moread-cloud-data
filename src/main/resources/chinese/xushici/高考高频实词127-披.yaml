            url: xxxx
            vernacular: 他便跟着癞蛤蟆的踪迹，分开丛草去寻找，只见一只蟋蟀趴在棘根下面，他急忙扑过去捉它，蟋蟀跳进了石洞。
          - ancient: 到则<披>草而坐，倾壶而醉。（《始得西山宴游记》）
