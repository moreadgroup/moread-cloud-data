          - ancient: 景从云合，而见一人，<披>紫衣，执青玉。（《柳毅传》）
            url: xxxx
            vernacular: 一群侍从像影子跟随形体，象云气聚拢拟的簇拥着一位身穿紫袍，手执青玉的人出来了。
      - trans: ❷袒露。
