---
words:
  - word: 披
    type: 【动词】
    phonetic: Pi1
    tags:
      - 高中
    samples:
      - trans: ❶穿着;覆衣于肩背。
        sentences:
          - ancient: 将军身披坚执锐，伐无道，诛暴秦，复立楚国之社稷，功宜为王。（《陈涉世家》）
          - ancient: 景从云合，而见一人，披紫衣，执青玉。（《柳毅传》）
      - trans: ❷袒露。
        sentences:
          - ancient: 惟当披露腹心，捐弃肝脑，尽力所至，不知其他。 （宋•苏轼《上神宗皇帝书》）
      - trans: ❸推开。
        sentences:
          - ancient: 披绣闼，俯雕甍。（《滕王阁序》）
      - trans: ❹掀开;拔开。	
        sentences:
          - ancient: 哙遂入，披帷西向立，瞋目视项王，头发上指，目眦（zi4，眼眶）尽裂。（《鸿门宴》）
          - ancient: 蹑迹披求，见有虫伏棘根，遽扑之，入石穴中。（《促织》）
          - ancient: 到则披草而坐，倾壶而醉。（《始得西山宴游记》）
      - trans: ❺翻开;翻阅。
        sentences:
          - ancient: 先生口不绝吟于六艺之文，手不停披于百家之编。（唐.韩愈《进学解》）
          - ancient: 披五岳之图，以为知山，不如樵夫之一足。（清•魏源《默觚上•学篇二》）
      - trans: 6散开。
        sentences:
          - ancient: 于是项王大呼，驰下，汉军皆披靡，遂斩汉一将。 （《项羽之死》）
      - trans: ❼剖析。
        sentences:
          - ancient: 臣等承旨，披究往说，各有其理。（《魏书•礼志一》）
