---
words:
  - word: 收
    type: 【名词】
    phonetic: shou1
    tags:
      - 高中
    samples:
      - trans: ❶收成。
        sentences:
          - ancient: 百亩之收，不过百石（古代容量单位，十斗为一石）。（汉•晁错《论贵粟疏》）
      - trans: ❷收藏物。
        sentences:
          - ancient: 燕赵之收藏。（《阿房宫赋》）

  - word: 收
    type: 【动词】
    phonetic: shou1
    tags:
      - 高中
    samples:
      - trans: ❶拘捕。
        sentences:
          - ancient: 此宜无罪，女反收之。（《诗经•大雅•瞻卬》）
          - ancient: 单于壮其节，朝夕遣人候问武，而收系张胜。（《苏武传》）
          - ancient: （张）衡下车（指官吏初到任），治威严，整法度，阴知奸党名姓，一时收禽（通"擒"），上下肃然，称为政理。（《张衡传》）
          - ancient: 【高考题例】憙下车，闻其二孙杀人事未发觉，即穷诘其奸，收考子春，二孙自杀。（《后汉书•赵憙传》）
      - trans: ❷收集;收取。
        sentences:
          - ancient: 余收尔骨焉。（《左传•僖公三十二年》）
          - ancient: 收天下之兵（兵器），聚之咸阳。（《过秦论》）
          - ancient: 燕赵之收藏，韩魏之经营。（《阿房宫赋》）
          - ancient: 东割膏腴之地，北收要害之郡。（《过书秦论》）
          - ancient: 秦将王翦破赵，虏赵王，尽收其地，进兵北略地，至燕南界。（《荆轲刺秦王》）
          - ancient: 剑外忽传<收>蓟北，初闻涕泪满衣裳。（《闻官军收河南河北》）
      - trans: ❸征收。
        sentences:
          - ancient: 十年不收于国，民俱有三年之食。（《勾践灭吴》）
      - trans: ❹招收。
        sentences:
          - ancient: 行收兵。比至陈，车六七百乘，骑千余，卒数万人。 （《陈涉世家》）
      - trans: ❺停止;结束。
        sentences:
          - ancient: 雷始收声。（《礼记•月令》）
      - trans: ❻收获（农作物）。
        sentences:
          - ancient: 春生，夏长，秋收，冬藏。（《史记•太史公自序》）