训xun4
【名词】❶法则。
【例句】古训是式，威仪是力。（《诗经•大雅•烝民》）
❷顺序。
【例句】事得其序之谓训。（《法言•问神》）

【动词】❶教诲;教导。
【高考题例】治官如治家，古人常有是训矣。（元•张养浩《三事忠告》）
❷训练。
【例句】祜缮甲训卒，广为戎备。（《晋书•羊祜传》）
❸解说。
【例句】乃集儒臣，训释厥旨，将播之校学。（宋•王安石《周礼义序》）