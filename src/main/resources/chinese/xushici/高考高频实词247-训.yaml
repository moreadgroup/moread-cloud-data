---
words:
  - word: 训
    type: 【名词】
    phonetic: xun4
    tags:
      - 高中
    samples:
      - trans: ❶法则。
        sentences:
          - ancient: 古训是式，威仪是力。（《诗经•大雅•烝民》）
      - trans: ❷顺序。
        sentences:
          - ancient: 事得其序之谓训。（《法言•问神》）

  - word: 训
    type: 【动词】
    phonetic: xun4
    tags:
      - 高中
    samples:
      - trans: ❶教诲;教导。
        sentences:
          - ancient: 【高考题例】治官如治家，古人常有是训矣。（元•张养浩《三事忠告》）
      - trans: ❷训练。
        sentences:
          - ancient: 祜缮甲训卒，广为戎备。（《晋书•羊祜传》）
      - trans: ❸解说。
        sentences:
          - ancient: 乃集儒臣，训释厥旨，将播之校学。（宋•王安石《周礼义序》）