甚shen4
【形容词】过分;厉害。
【例句】由此观之,王之魅（受蒙蔽）甚矣。（《邹忌讽齐王纳谏》）丨今君与廉颇同列，廉君宣恶言，而君畏匿之，恐惧殊甚。（《廉颇蔺相如列传》）丨孰知赋敛之毒,有甚是蛇者乎!（《捕蛇者说》）丨虽累百世，垢弥甚耳！（《报任安书》）丨至攘人犬豕鸡豚者，其不义又甚入人园圃窃桃李。（《墨子•非攻》）
【高考题例】凡四十有二，而水旱不与焉，灾未有若是甚者。
（《明史•傅珪传》）	：

【代词】什么;怎么。
【例句】甚当年，寂寞贾长沙（指贾谊），伤时哭？（宋•辛弃疾《满江红》）丨酒旗戏鼓甚处市。（宋•周邦彦《西河》）
【副词】常用在动词、形容词之前，表示程度相当深，可译为"很""非常"等。
【例句】秦人视之，亦不甚惜。（《阿房宫赋》）丨其下平旷，有泉侧出，而记游者甚众。（《游褒禅山记》）丨子孙视之不甚惜，举以予人，如弃草芥。（《六国论》）丨妪，先大母婢也，乳二世，先妣抚之甚厚。（《项脊轩志》）
