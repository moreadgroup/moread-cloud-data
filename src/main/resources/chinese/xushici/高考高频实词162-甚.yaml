            vernacular: 由此看来，大王您受到的蒙蔽太严重了！
          - ancient: 今君与廉颇同列，廉君宣恶言，而君畏匿之，恐惧殊<甚>。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 如今您与廉颇官位相同，廉颇传出坏话，而您却害怕躲避着他，胆怯得也太过分了
          - ancient: "孰知赋敛之毒,有<甚>是蛇者乎!（《捕蛇者说》）"
            url: xxxx
            vernacular: 谁知道搜刮老百姓的毒害，谁知道苛捐杂税的毒害比这种毒蛇的毒害更厉害呢！
          - ancient: 虽累百世，垢弥<甚>耳！（《报任安书》）
            url: xxxx
            vernacular: 即使是到百代之后，这污垢和耻辱会更加深重啊！
          - ancient: 至攘人犬豕鸡豚者，其不义又<甚>入人园圃窃桃李。（《墨子•非攻》）
            url: xxxx
            vernacular: 至于偷人家鸡犬大猪小猪的，比进人家果园偷桃李更不义。
          - ancient: 【高考题例】凡四十有二，而水旱不与焉，灾未有若是<甚>者。（《明史•傅珪传》）
            url: xxxx
            vernacular: 总共四十二次，加之水涝旱灾不断，灾害没有像这样严重的。
