台tai2
【名词】❶高而平的建筑物,可供瞭望远方或表演歌舞。
【例句】歌台暖响，春光融融;舞殿冷袖，风雨凄凄。（《阿房宫赋》）丨舞榭（台上的房子）歌台，风流总被雨打风吹去。（《永遇乐•"京口北固亭怀古》）丨秦王坐章台见相如，相如奉璧奏秦王。（《廉颇蔺相如列传》）丨万里悲秋常作客，百年多病独登台。（《登高》）
❷像台状的器物。
【例句】一去紫台连朔漠，独留青冢向黄昏。（唐•杜甫《咏怀古迹.其三》）丨可怜楼上月徘徊，应照离人妆镜台。（唐•张若虚《春江花月夜》）
❸官署名。汉设御史台、兰台。
【例句】汝是大家子，仕宦于台阁（尚书台），慎勿为妇死，贵贱情何薄！（《孔雀东南飞》）丨嗟余听鼓应官去，走马兰台类转蓬。（唐•李商隐《无题》）

【高考题例】夫台谏为天下持是非，而使人贱辱至此。（《明史,陈登云传》）丨公亮明练文法，更践久，习知朝廷台阁典宪。（《宋史•曾公亮传》）
❹卑贱的职位。
【例句】宜有期度，舆马台隶，应为科品。（《后汉书•光武十王列传》）
❺对人的尊称。古代下属称上级为宪台、堂台；朋友汤间尊称为兄台、台下。
【例句】望台下轻轻放手。（《长生殿•进果》）
❻星名，即三台（六颗星）。
【例句】在人曰三公,在天曰三台。（《晋书•天文志上》）
