素su4
【名词】❶白色的生绢。
【例句】若士必（一定）怒，伏尸二人，流血五步，天下縞素（指穿丧服），今日是也。（《唐雎不辱使命》）丨十三能织素十四学裁衣。（《孔雀东南飞》）
❷蔬菜、瓜果类食品（与""荤""相对）。
【例句】古之民未知为饮食时，素食而分处。（《墨子•辞过》）
❸白色的盐、雪等物。
【例句】熬波出素。（南朝齐•张融《海赋》）
❹旧交。
【例句】其他赴告，咸复于素。（唐•刘禹锡《重祭柳员外文》）
❺本质。
【例句】平易者道之素。（《淮南子•本经训》）
❻真情。后来写作"愫"。
【例句】披心腹，见情素。（汉•邹阳《狱中上梁王书》）

【形容词】❶白色的。
【例句】纤纤擢素手，札札弄机杼。（《迢迢牵牛星》）丨通籍（开始做官）后，俸去书来，落落大满（堆积的到处都是）,素蟫灰丝时蒙卷轴。（《黄生借韦说》）
❷朴素的。
【例句】可以调素琴，阅金经。（《陋室铭》）
❸清贫。
【例句】令内外群官举清能，拔寒素。（《晋书•武帝纪》）

【副词】❶空；白白地。
【例句】彼君子兮，不素餐兮。（《诗经•魏风•伐檀》）
❷平素；向来;一向。
【例句】虞常在汉时，素与副张胜相知。（《苏武传》）丨吴广素爱人，士卒多为用者。（《陈涉世家》）丨素善留侯张良。（《鸿门宴》）
【高考题例】王公素负重名，不可害。（《明史•王祎传》）丨邓奉反于南阳，憙素与奉善（交好），数（多次）遗（送）书切责之。（《后汉书•赵憙传》）