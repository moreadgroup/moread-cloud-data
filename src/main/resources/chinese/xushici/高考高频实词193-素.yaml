---
words:
  - word: 素
    type: 【名词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶白色的生绢。
        sentences:
          - ancient: 若士必（一定）怒，伏尸二人，流血五步，天下縞素（指穿丧服），今日是也。（《唐雎不辱使命》）
          - ancient: 十三能织素十四学裁衣。（《孔雀东南飞》）
      - trans: ❷蔬菜、瓜果类食品（与""荤""相对）。
        sentences:
          - ancient: 古之民未知为饮食时，素食而分处。（《墨子•辞过》）
      - trans: ❸白色的盐、雪等物。
        sentences:
          - ancient: 熬波出素。（南朝齐•张融《海赋》）
      - trans: ❹旧交。
        sentences:
          - ancient: 其他赴告，咸复于素。（唐•刘禹锡《重祭柳员外文》）
      - trans: ❺本质。
        sentences:
          - ancient: 平易者道之素。（《淮南子•本经训》）
      - trans: ❻真情。后来写作"愫"。
        sentences:
          - ancient: 披心腹，见情素。（汉•邹阳《狱中上梁王书》）

  - word: 素
    type: 【形容词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶白色的。
        sentences:
          - ancient: 纤纤擢素手，札札弄机杼。（《迢迢牵牛星》）
          - ancient: 通籍（开始做官）后，俸去书来，落落大满（堆积的到处都是）,素蟫灰丝时蒙卷轴。（《黄生借韦说》）
      - trans: ❷朴素的。
        sentences:
          - ancient: 可以调素琴，阅金经。（《陋室铭》）
      - trans: ❸清贫。
        sentences:
          - ancient: 令内外群官举清能，拔寒素。（《晋书•武帝纪》）

  - word: 素
    type: 【副词】
    phonetic: su4
    tags:
      - 高中
    samples:
      - trans: ❶空；白白地。
        sentences:
          - ancient: 彼君子兮，不素餐兮。（《诗经•魏风•伐檀》）
      - trans: ❷平素；向来;一向。
        sentences:
          - ancient: 虞常在汉时，素与副张胜相知。（《苏武传》）
          - ancient: 吴广素爱人，士卒多为用者。（《陈涉世家》）
          - ancient: 素善留侯张良。（《鸿门宴》）
          - ancient: 【高考题例】王公素负重名，不可害。（《明史•王祎传》）
          - ancient: 邓奉反于南阳，憙素与奉善（交好），数（多次）遗（送）书切责之。（《后汉书•赵憙传》）