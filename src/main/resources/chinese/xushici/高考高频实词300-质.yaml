---
words:
  - word: 质
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶根本;本体。
        sentences:
          - ancient: 其质非不美也。（《荀子•劝学》）
          - ancient: 芳与泽其杂糅兮，唯昭质其犹未亏。（《离骚》）
      - trans: ❷禀性;素质。
        sentences:
          - ancient: 礼释回（除掉邪僻），增美质。（《礼记•礼器》）
          - ancient: 其业有不精、德有不成者，非天质之卑（低下），则心不若余之专耳，岂他人之过哉？（《送东阳马"生序》）
      - trans: ❸底子;本色。
        sentences:
          - ancient: 夫素之质白，染之以涅（nie4黑色染料）则黑。（《淮南子•齐俗训》）
          - ancient: 永州之野产异蛇:黑质而白章，触草木尽死。（《捕蛇者说》）
      - trans: ❹抵押品;作为保证的人或财物。
        sentences:
          - ancient: 必以长安君为质，兵乃出。（《触龙说赵太后》）
          - ancient: 故周郑交质，王子狐为质于郑，郑公子忽为质于周。（《左传•隐公三年》）
      - trans: 5箭靶。
        sentences:
          - ancient: 是故质的张而弓矢至焉。（《荀子•劝学》）
      - trans: ❻通""锧"。刑具,用斧子斩杀人时用的砧板。
        sentences:
          - ancient: 君不如肉袒伏斧质请罪,则幸得脱矣。（《廉颇蔺相如列传》）
      - trans: ❼通"贽"。古代初次拜见尊长时所送的礼物，即见面礼。
        sentences:
          - ancient: （秦）惠王患之，乃令张仪佯去秦，厚币（贵重的礼物）委质事楚。（《史记•屈原贾生列传））

  - word: 质
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶作人质。
        sentences:
          - ancient: 于是为长安君约车百乘，质于齐。（《触龙说赵太后》）
      - trans: ❷询问；质问。
        sentences:
          - ancient: 援（提出）疑质理，俯身倾耳以请。（《送东阳马生序》）
          - ancient: 【高考题例】公亮质之日："锡（赏赐）宴不赴，是不虔（尊敬）君命也，人主有疾，而必使亲临，处之安乎？"（《宋史•曾公亮传》）
      - trans: ❸评判。
        sentences:
          - ancient: 而欲质天之有无。（唐•刘禹锡《天论》）
      - trans: ❹对质;验证。
        sentences:
          - ancient: 虽质君之前，臣不讳也。（《礼记•曲礼上》）

  - word: 质
    type: 【形容词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 朴实;缺乏文采（与"文"相对）。
        sentences:
          - ancient: 观殷夏所损益，曰："后虽百世可知也，以一文一质……"（《史记•孔子世家》）
          - ancient: 质胜文则野（鄙陋，粗野）,文胜质则史（文辞繁多）。（《论语•雍也》）
