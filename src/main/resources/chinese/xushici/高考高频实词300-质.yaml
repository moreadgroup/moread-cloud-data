---
words:
  - word: 质
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶根本;本体。
        sentences:
          - ancient: 其<质>非不美也，所渐者然也。（《荀子•劝学》）
            url: xxxx
            vernacular: 不是艾本身不香，而是被浸泡臭了
          - ancient: 芳与泽其杂糅兮，唯昭<质>其犹未亏。（《离骚》）
            url: xxxx
            vernacular: 虽然芳洁污垢混杂一起，只有纯洁品质不会腐朽。
      - trans: ❷禀性;素质。
        sentences:
          - ancient: 礼释回（除掉邪僻），增美<质>。（《礼记•礼器》）
            url: xxxx
            vernacular: 释回增美是汉语成语，拼音是shìhuízēngměi，意思是指去除邪僻，增加美善
          - ancient: 其业有不精、德有不成者，非天<质>之卑（低下），则心不若余之专耳，岂他人之过哉？（《送东阳马"生序》）
            url: xxxx
            vernacular: 他们中如果学业有所不精通，品德有所未养成的，如果不是天赋、资质低下，就是⽤⼼不如我这样专⼀，难道可以说是别⼈的过错吗！
      - trans: ❸底子;本色。
        sentences:
          - ancient: 夫素之<质>白，染之以涅（nie4黑色染料）则黑。（《淮南子•齐俗训》）
            url: xxxx
            vernacular: 原本洁白的绢绸，用涅染过便变黑
          - ancient: 永州之野产异蛇:黑<质>而白章，触草木尽死。（《捕蛇者说》）
            url: xxxx
            vernacular: 永州的野外出产一种奇特的蛇，它有着黑色的底子白色的花纹；如果这种蛇碰到草木，草木全都干枯而死
      - trans: ❹抵押品;作为保证的人或财物。
        sentences:
          - ancient: 必以长安君为<质>，兵乃出。（《触龙说赵太后》）
            url: xxxx
            vernacular: 一定要用长安君来做人质，援兵才能派出。
          - ancient: 故周郑交<质>，王子狐为<质>于郑，郑公子忽为<质>于周。（《左传•隐公三年》）
            url: xxxx
            vernacular: 于是周王、郑国交换人质：周平王的儿子狐在郑国做人质，郑庄公的儿子忽在周王室做人质。
      - trans: ⑤箭靶。
        sentences:
          - ancient: 是故<质>的张，而弓矢至焉；林木茂，而斧斤至焉；树成荫，而众鸟息焉。（《荀子•劝学》）
            url: xxxx
            vernacular: 所以靶子设置好了就会射来弓箭，树长成了森林就会引来斧头砍伐，树林繁茂荫凉众鸟就会来投宿
      - trans: "❻通\"锧\"。刑具，用斧子斩杀人时用的砧板。"
        sentences:
          - ancient: "君不如肉袒伏斧<质>请罪，则幸得脱矣。（《廉颇蔺相如列传》）"
            url: xxxx
            vernacular: 您不如脱掉上衣，露出肩背，伏在斧刃之下请求治罪，这样也许侥幸被赦免。
      - trans: ❼通"贽"。古代初次拜见尊长时所送的礼物，即见面礼。
        sentences:
          - ancient: （秦）惠王患之，乃令张仪佯去秦，厚币（贵重的礼物）委<质>事楚。（《史记•屈原贾生列传））
            url: xxxx
            vernacular: 秦惠王对此担忧，就令张仪假装离开秦国，拿着丰厚的礼物送给楚国作为信物，表示愿意侍奉楚王
  - word: 质
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶作人质。
        sentences:
          - ancient: 于是为长安君约车百乘，<质>于齐。（《触龙说赵太后》）
            url: xxxx
            vernacular: 于是为长安君备车一百乘，到齐国去作人质。
      - trans: ❷询问；质问。
        sentences:
          - ancient: 援（提出）疑<质>理，俯身倾耳以请。（《送东阳马生序》）
            url: xxxx
            vernacular: 提出疑难，询问道理，俯下身子，侧着耳朵请教
          - ancient: 【高考题例】公亮<质>之日："锡（赏赐）宴不赴，是不虔（尊敬）君命也，人主有疾，而必使亲临，处之安乎？"（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 曾公亮质问使者说:（皇帝）赏赐宴会（你）不去，这是对君命的不恭敬。君主有病，却一定要让他亲自出席，（这样）处理事情能觉得安心吗？
      - trans: ❸评判。
        sentences:
          - ancient: 今人以一已之穷通，而欲<质>天之有无，惑矣！（唐•刘禹锡《天论》）
            url: xxxx
            vernacular: 现在凭借个人的困窘或显达，就想要评判天道是否存在，糊涂啊！
      - trans: ❹对质;验证。
        sentences:
          - ancient: 虽<质>君之前，臣不讳也。（《礼记•曲礼上》）
            url: xxxx
            vernacular: 虽然在君王面前对质 我也不会避讳的
  - word: 质
    type: 【形容词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 朴实;缺乏文采（与"文"相对）。
        sentences:
          - ancient: 观殷夏所损益，曰："后虽百世可知也，以一文一<质>……"（《史记•孔子世家》）
            url: xxxx
            vernacular: xxxx
          - ancient: "<质>胜文则野（鄙陋，粗野），文胜<质>则史（文辞繁多）。文质彬彬，然后君子。（《论语•雍也》）"
            url: xxxx
            vernacular: 一个人过于质朴，缺乏文采，就显得粗俗；文采过多，不够质朴，就显得轻浮。质朴和文采两方面结合得好，才称得上君子。
