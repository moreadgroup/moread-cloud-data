造zao4
【名词】❶时代;时期。
【例句】公侯之有冠礼也，夏之末造也。（《仪礼•士冠礼》）
❷成就;功绩。
【例句】肆成人有德，小子有造。（《诗经•大雅•思齐》）
❸法律上指争讼的双方。
【例句】两造具备，师（各位法官）听五辞。（《尚书•吕刑》）

【动词】❶造访，拜访。.
【例句】太子日造门下，供太牢具，异物间进,车骑美女恣荆轲所欲，以顺适其意。（《史记•刺客列传》）
【高考题例】缙绅大夫游于西山，必造其庐焉。（明•杜琼《雪:屋记》）
❷到……去;
【例句】径造庐访成，视成所蓄，掩口胡卢（喉间的笑声）而笑。（《促织》）
❸达到（某一境界）。
【例句】不知便可登峰造极不？（《世说新语•文学》）
❹制作;建造。
【例句】公输盘为楚造云梯之械，成，将以攻宋。（《公输》）丨是造物者之无尽藏也，而吾与子之所共适。（《赤壁赋》）丨阳嘉元年，复造候风地动仪。（《张衡传》）
❺制定。
【例句】怀王使屈原造为宪令。（《史记•屈原贾生列传》）
❻起始;开始。
【例句】万物所出，造于太一，化于阴阳。（《吕氏春秋•大乐》）

【副词】突然。
【例句】造受命于君前，则书于笏。（《礼记•玉藻》）