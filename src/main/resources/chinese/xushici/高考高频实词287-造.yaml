      - trans: ❶造访，拜访。.
        sentences:
          - ancient: "太子日<造>门下，供太牢具，异物间进,车骑美女恣荆轲所欲，以顺适其意。（《史记•刺客列传》）"
            url: xxxx
            vernacular: xxxx
