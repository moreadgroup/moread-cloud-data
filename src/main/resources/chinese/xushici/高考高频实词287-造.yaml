---
words:
  - word: 造
    type: 【名词】
    phonetic: zao4
    tags:
      - 高中
    samples:
      - trans: ❶时代;时期。
        sentences:
          - ancient: 公侯之有冠礼也，夏之末造也。（《仪礼•士冠礼》）
      - trans: ❷成就;功绩。
        sentences:
          - ancient: 肆成人有德，小子有造。（《诗经•大雅•思齐》）
      - trans: ❸法律上指争讼的双方。
        sentences:
          - ancient: 两造具备，师（各位法官）听五辞。（《尚书•吕刑》）

  - word: 造
    type: 【动词】
    phonetic: zao4
    tags:
      - 高中
    samples:
      - trans: ❶造访，拜访。.
        sentences:
          - ancient: 太子日造门下，供太牢具，异物间进,车骑美女恣荆轲所欲，以顺适其意。（《史记•刺客列传》）
          - ancient: 【高考题例】缙绅大夫游于西山，必造其庐焉。（明•杜琼《雪:屋记》）
      - trans: ❷到……去;
        sentences:
          - ancient: 径造庐访成，视成所蓄，掩口胡卢（喉间的笑声）而笑。（《促织》）
      - trans: ❸达到（某一境界）。
        sentences:
          - ancient: 不知便可登峰造极不？（《世说新语•文学》）
      - trans: ❹制作;建造。
        sentences:
          - ancient: 公输盘为楚造云梯之械，成，将以攻宋。（《公输》）
          - ancient: 是造物者之无尽藏也，而吾与子之所共适。（《赤壁赋》）
          - ancient: 阳嘉元年，复造候风地动仪。（《张衡传》）
      - trans: ❺制定。
        sentences:
          - ancient: 怀王使屈原造为宪令。（《史记•屈原贾生列传》）
      - trans: ❻起始;开始。
        sentences:
          - ancient: 万物所出，造于太一，化于阴阳。（《吕氏春秋•大乐》）

  - word: 造
    type: 【副词】
    phonetic: zao4
    tags:
      - 高中
    samples:
      - trans: 突然。
        sentences:
          - ancient: 造受命于君前，则书于笏。（《礼记•玉藻》）