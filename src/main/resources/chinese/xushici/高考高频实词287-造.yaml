      - trans: ❶时代;时期。
        sentences:
          - ancient: 公侯之有冠礼也，夏之末<造>也。（《仪礼•士冠礼》）
            url: xxxx
            vernacular: 给公侯加冠的礼仪，夏朝时就有了。
      - trans: ❷成就;功绩。
        sentences:
          - ancient: 肆成人有德，小子有<造>。（《诗经•大雅•思齐》）
            url: xxxx
            vernacular: 如今成人有德行，后生小子有造就。
      - trans: ❸法律上指争讼的双方。
        sentences:
          - ancient: 两<造>具备，师（各位法官）听五辞。（《尚书•吕刑》）
            url: xxxx
            vernacular: 诉讼双方都到齐，刑官从五个方面考察案情。
  - word: 造
