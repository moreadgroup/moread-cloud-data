---
words:
  - word: 行
    type: 【名词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶行为；品行。
        sentences:
          - ancient: 大行不顾细谨（在小节上谨慎），大礼不辞小让（小的谦让）。（《鸿门宴》）
          - ancient: 其志洁，其行廉。（《史记•,屈,原贾生列传》）
          - ancient: 共事二三年，始尔未为久，女行无偏斜，何意致不厚？（《孔雀东南飞》）
      - trans: ❷行动;举动。
        sentences:
          - ancient: 晋祚（zuo4,国运）存亡，在此一行。（《晋书•谢安传》）
          - ancient: 会使辙交驰，北邀当国者相见,众谓予一行为可以纾祸。（《〈指南录〉后序》）
      - trans: ❸行装;行李。
        sentences:
          - ancient: 萧何薨，（曹）参闻之，告舍人趣治行，"吾且入相"。（《汉书•曹参传》）
          - ancient: 荆轲有所待,欲与俱，其人居远未来，而为治行。（《荆轲刺秦王》）
      - trans: ❹乐府古诗的一种体裁。
        sentences:
          - ancient: 故乐府中有歌有谣，有吟有引，有行有曲。（宋•王灼《碧鸡漫志》卷一）
          - ancient: 莫辞更坐弹一曲，为君翻作《琵琶<行>》。（《琵琶行》）
      - trans: ❺古代官职名。行人;使者。
        sentences:
          - ancient: 王子城父（人名）为将,弦子旗（人名）为理、宁戚（人名）为田、隰朋（人名）为行。（《管子•小匡》）
      - trans: ❻乐曲；乐章。
        sentences:
          - ancient: 相如辞谢,为鼓一再行。（《史记•司马相如列传》）
      - trans: ❼汉字的一种字体。行书。
        sentences:
          - ancient: 篆、籀（zhou4,汉字的一种字体）、分、隶、真、行、草书，无不冠绝古今。（《元史•赵孟頫传》）

  - word: 行
    type: 【动词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶行走。
        sentences:
          - ancient: 三人行，必有我师焉。（《论语•述而》）
          - ancient: 子墨子闻之，起（动身）于鲁，行十日十夜而至于郢（ying3）,见公输盘。（《公输》）
          - ancient: 其隙也，则施施而行，漫湿而游。（《始得西山宴游记》）
      - trans: ❷去;前往。
        sentences:
          - ancient: 赵王畏秦，欲毋行。（《廉颇蔺相如列传》）
          - ancient: （孙）权即遣肃行。（《资治通鉴•汉纪五十七》）
          - ancient: 永元中，举孝廉不行，连辟公府不就。（《张衡传》）
          - ancient: 向使（假如）三国各爱其地,齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当（倘若）与秦相较，或未易量。（《六国论》）

          - ancient: 【高考题例】契丹以兵二十万压代州境，遣使请代地，岁聘之使不敢行，以命将。（《宋史•许将传》）
          - ancient: 金人虽不吾索,吾当与之俱行，求见二酋面责之，庶或万一可济。（《宋史.孙傅传》）

      - trans: ❸流传;传布。
        sentences:
          - ancient: 呜呼！士之处此世，而望名誉之光、道德之行，难已！（唐•韩愈《原毁》）
      - trans: ❹实行;做。
        sentences:
          - ancient: 愚以为宫中之事，事无大小，悉以咨之，然后施行,必能裨补阙漏，有所广益。（《出师表》）
          - ancient: 所求乎为子，以父母之遗体行殆（危险的事）而死有余责。（《〈指南录〉后序》）
          - ancient: 【高考题例】令行于民期年，秦民之（到）国都言初令之不便者以千数（计算）。（《史记•商君列传》）

      - trans: ❺运行。
        sentences:
          - ancient: 天行有常。（《荀子•天论》）
      - trans: ❻巡视;巡察。
        sentences:
          - ancient: 智伯出行水。（《战国策•秦策四》）
          - ancient: 乃使人与秦吏行县乡邑，告谕之。（《史记•高祖本纪》）
      - trans: ❼出嫁。
        sentences:
          - ancient: 女子有行,远兄弟父母。（《诗经•卫风•竹竿》）
      - trans: ❽代理官职。
        sentences:
          - ancient: 丞相（田）蚡薨（hong1,指诸侯或高官去世），（韩）安国行丞相事。（《汉韦•韩安国传》）
          - ancient: 舜登用，摄行天子之政,巡狩。（《史记•夏本纪》）
          - ancient: 【高考题例】后拜骑都尉、参军事、行安南太守，迁尚书郎。（《晋书•鲁芝传》）
      - trans: ⑨经历。
        sentences:
          - ancient: 行年四岁，舅夺母志。（《陈情表》）
      - trans: ❿用。
        sentences:
          - ancient: 深谋远虑,行军用兵之道，非及向时之士也。（《过秦论》）

  - word: 行
    type: 【量词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: 遍；次（多指饮酒）。
        sentences:
          - ancient: 客至未尝不置酒，或三<行>五<行>，多不过七<行>。（《训俭示康》）

  - word: 行
    type: 【副词】
    phonetic: xing2
    tags:
      - 高中
    samples:
      - trans: ❶即将;将要。
        sentences:
          - ancient: 十八岁当一小发，服此散，亦行复差（通"瘥"，病愈）。（《三国志•魏书•方技传》）
          - ancient: 善（羡慕）万物之得时,感吾生之行休。（《归去来兮辞》）
          - ancient: 岁月易得，别来行复四年。（南朝梁•萧统《文选•与吴质书》）
      - trans: ❷又;复。
        sentences:
          - ancient: 上高堂，<行>取殿下堂。（《乐府诗集•孤儿行》）

  - word: 行
    type: 【名词】
    phonetic: hang2
    tags:
      - 高中
    samples:
      - trans: ❶道路。
        sentences:
          - ancient: 杞人、郳人从赵武、魏绛斩行栗。（《左传•襄公九年》）
      - trans: ❷行列；队伍。
        sentences:
          - ancient: 蹑足（出身于）行伍之间，而倔（同"崛"）起什伯（什长百长）之中。（《过秦论》）
          - ancient: 愚以为"营中之事，悉以咨之,必能使行阵和睦，优劣得所。（《出师表》）
      - trans: ❸辈分。
        sentences:
          - ancient: 恐汉袭之,乃曰："汉天子我丈人行也。"（《苏武传》）
      - trans: ❹行业。
        sentences:
          - ancient: 我想这一百二十行，门门都是求衣饭。（元•关汉卿《金线池》一折）
      - trans: ❺排行。
        sentences:
          - ancient: 弟姓胡氏，于行为四。（《聊斋志异•胡四相公》）

  - word: 行
    type: 【量词】
    phonetic: hang2
    tags:
      - 高中
    samples:
      - trans: 用于成行的事物。道;条。
        sentences:
          - ancient: 出门登车去,涕落百余行。（《孔雀东南飞》）