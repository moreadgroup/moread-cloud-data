---
words:
  - word: 息
    type: 【名词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: ❶呼吸时进出的气。
        sentences:
          - ancient: 近抚之，气息惙然（chuo4,气息微弱的样子）。（《促织》）
          - ancient: 扪参历井仰胁息，以手抚膺坐长叹。（《蜀道难》）
          - ancient: 但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。（《陈情表》）
          - ancient: 野马也，尘埃也,生物之以息相吹也。（《逍遥游》）
      - trans: ❷子息。
        sentences:
          - ancient: 既无叔伯，终鲜兄弟，门衰祚薄，晚有儿息。（《陈情表》）
          - ancient: 老臣贱息舒祺，最少，不肖，而臣衰，窃爱怜之。（《触龙说赵太后》）
      - trans: ❸利息。
        sentences:
          - ancient: 当具有者半贾而卖，亡（通"无"）者取倍称之息。（汉•晁错《论贵粟疏》）
          - ancient: 此我产业之花息也。（明•黄宗羲《原君》）

  - word: 息
    type: 【动词】
    phonetic: xi1
    tags:
      - 高中
    samples:
      - trans: ❶呼吸;喘气。
        sentences:
          - ancient: 初，先生救我时，束缚我足，闭我囊中，压以诗书，我鞠躬，不敢息。（《中山狼传》）
          - ancient: 武气绝，半日复息。（《苏武传》）
      - trans: ❷叹息。
        sentences:
          - ancient: 北山愚公长息曰……（《愚公移山》）
          - ancient: 长太息以掩涕兮,哀民生之多艰。（《离骚》）
          - ancient: 我闻琵琶已叹息，又闻此语重唧唧。（《琵琶行》）
      - trans: ❸休息。
        sentences:
          - ancient: 四时之间亡（通"无"）日休息。（汉•晁错《论贵粟疏》）
          - ancient: 鸡鸣入机织;夜夜不得息。（《孔雀东南飞》）
          - ancient: 乍暖还寒时候，最难将息。（《声声慢》）
      - trans: ❹停止;使停止。
        sentences:
          - ancient: 天行健，君子以自强不息。（《周易•乾卦》）
          - ancient: 归去来兮，请息交以绝游。（《归去来兮辞》）
          - ancient: 其势非天下之贤圣固不能息天下之祸。（《史记•淮阴侯列传》）
          - ancient: 步余马于兰皋兮，驰椒丘且焉止息。（《离骚》）
          - ancient: 【高考题例】使谕以指意，边害讫息。（《宋史•曾公亮传》）
      - trans: ❺同"熄"。熄灭。
        sentences:
          - ancient: 俄而（不久）家果失火，邻里共救之，幸而得息。（《汉书•"霍光传》）
      - trans: ❻滋生;增长（与"消"相对）。
        sentences:
          - ancient: 消息盈虚，终则有始。（《秋水〉）
      - trans: ❼特指人或动物的繁殖。
        sentences:
          - ancient: 流民既归，户口亦息。（《汉书•高惠高后文景功臣表》）
          - ancient: 昔伯翳为舜主畜，畜多息。（《史记•秦本纪》）

