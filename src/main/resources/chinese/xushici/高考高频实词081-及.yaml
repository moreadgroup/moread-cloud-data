---
words:
  - word: 及
    type: 【动词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶赶上。
        sentences:
          - ancient: 【例句】怀王悔，追张仪,不及。（《史记•屈原贾生列传》）
          - ancient: 予之及于死者不知其几矣。（《〈指南录〉后序》）
          - ancient: 方急时，不及召下兵，以故荆轲逐秦王。（《荆轲刺秦王》）
      - trans: ❷到达。
        sentences:
          - ancient: 【例句】微（假如没有）夫人之力不及此。（《烛之武退秦师》）
          - ancient: 火刻风猛，船往如箭，烧尽北船，延及岸上营落。（《资治通鉴•汉纪五十七》）
          - ancient: 延及孝文王、庄襄王,享国之日浅，国家无事。（《过秦论》）
          - ancient: 【高考题例】万一北人言及代州事，不有以折之，则伤国体。（《宋史•许将传》）
      - trans: ❸涉及;推及。
        sentences:
          - ancient: 【例句】老吾老，以及人之老;幼吾幼，以及人之幼。（《齐桓晋文之事》）
          - ancient: 一人飞升，仙及鸡犬。（《促织》）
          - ancient: 罚所及，则思无因怒而滥刑。（《谏太宗十思疏》）
      - trans: ❹比得上。
        sentences:
          - ancient: 【例句】君美甚，徐公何能及君也？（《邹忌讽齐王纳谏》）
          - ancient: 绑子之徒，其贤不及孔子。（《师说》）
          - ancient: 才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
          - ancient: 小知不及大知，小年不及大年。（《逍遥游》）
          - ancient: 【高考题例】既罢，日："吾久不见贾生，自以为过之，今不及也。.（《史记•屈原贾生列传》）

      - trans: ❺赶得上;来得及。
        sentences:
          - ancient: 【例句】素衣莫起风尘叹，犹及清明可到家。（宋•陆游《临安春雨初霁》）
          - ancient: 僻不当道者，皆不及往。（《登泰山记》）

  - word: 及
    type: 【介词】
    phonetic: ji2
    tags:
      - 高中
    samples: 
      - trans: ❶等到。
        sentences:
          - ancient: 【例句】及反（通"返"），市罢，遂不得履。（《韩非子•外储说左上》）
          - ancient: 及至始皇，奋六世之余烈，振长策而御宇内。（《过秦论》）
          - ancient: 及其所之既倦，情随事迁,感慨系之矣。（《兰亭集序》）
          - ancient: 武留匈奴凡十九岁，始以强壮出，及还，须发尽白。（《苏武传》）
          - ancient: 【高考题例】贾生既辞往行及渡湘水，为赋以吊屈原。（《史记.屈原贾生列传》）
      - trans: ❷到。
        sentences:
          - ancient: 【例句】谋（考虑）及子孙，可谓死君（置君于死地）乎？（《左传•僖公三十三年》）
          - ancient: 逃未及远，市（买）者还。（《童区寄传》）
      - trans: ❸跟;同。
        sentences:
          - ancient: 【例句】德音（诺言）莫违，及尔同死。（《诗经•鄢风•谷风》）
          - ancient: 及尔偕老，老使我怨。（《诗经•卫风•氓》）
      - trans: ❹当;趁。
        sentences:
          - ancient: 【例句】对曰："十五岁矣。虽少，愿及未填沟壑而托之。"（《触龙说赵太后》）
          - ancient: 今媪尊长安君之位，而封之以膏腴之地，多予之重器，而不及今令有功于国。（《触龙说赵太后》）
          - ancient: 回朕车以复路兮，及行迷之未远。（《离骚》）

  - word: 及
    type: 【连词】
    phonetic: ji2
    tags:
      - 高中
    samples: 
      - trans: 和;与。
        sentences:
          - ancient: 【例句】绍及操闻（赵）岐至，皆自将兵数百里奉迎。（《后汉书•赵岐传》）
          - ancient: 吏兵斩其使及从士三十余级。（《后汉书•班超传》）
