---
words:
  - word: 及
    type: 【动词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶赶上。
        sentences:
          - ancient: 怀王悔，追张仪，不<及>。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 怀王后悔了，派人追赶张仪，没有追上。
          - ancient: 予之<及>于死者不知其几矣。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 唉！我到达死亡的境地不知有多少次了！
          - ancient: 方急时，不<及>召下兵，以故荆轲逐秦王。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 正在慌急之中，而且也来不及召来侍卫，所以荆轲追逐秦王
      - trans: ❷到达。
        sentences:
          - ancient: 微（假如没有）夫人之力不<及>此。（《烛之武退秦师》）
            url: xxxx
            vernacular: 不行！如不是秦国国君的力量，就没有我的今天。
          - ancient: 火刻风猛，船往如箭，烧尽北船，延<及>岸上营落。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 火势猛烈，风助燃烧，船只迅速前进，就像箭一样，火势烧毁了北方的船只，继而延烧到岸边的营房。
          - ancient: 延<及>孝文王、庄襄王，享国之日浅，国家无事。（《过秦论》）
            url: xxxx
            vernacular: 延续到孝文王、庄襄王，统治的时间不长，秦国并没有什么大事发生。
          - ancient: 【高考题例】万一北人言<及>代州事，不有以折之，则伤国体。（《宋史•许将传》）
            url: xxxx
            vernacular: 如果北方的人提到代州事件，如果没有适当回应，那将会损害国家体制。
      - trans: ❸涉及;推及。
        sentences:
          - ancient: 老吾老，以<及>人之老;幼吾幼，以<及>人之幼。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 尊敬自己的老人，进而推广到尊敬别人家的老人；爱护自己的孩子，进而推广到爱护别人家的孩子。
          - ancient: 一人飞升，仙<及>鸡犬。（《促织》）
            url: xxxx
            vernacular: 一人得道成仙，连鸡狗都可以上天。
          - ancient: 罚所<及>，则思无因怒而滥刑。（《谏太宗十思疏》）
            url: xxxx
            vernacular: 动用刑罚，就要想到不要因为一时发怒而滥用刑罚。
      - trans: ❹比得上。
        sentences:
          - ancient: 君美甚，徐公何能<及>君也？（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 您美极了，徐公怎么能比得上您呢？
          - ancient: 郯子之徒，其贤不<及>孔子。（《师说》）
            url: xxxx
            vernacular: 郯子这些人，他们的贤能都比不上孔子。
          - ancient: 才能不<及>中人，非有仲尼、墨翟之贤，陶朱、猗顿之富。（《过秦论》）
            url: xxxx
            vernacular: 才能不如普通人，并没有孔丘，墨翟那样的贤德，也不像陶朱、猗顿那样富有
          - ancient: 小知不<及>大知，小年不<及>大年。（《逍遥游》）
            url: xxxx
            vernacular: 小智比不上大智，短命比不上长寿。
          - ancient: 【高考题例】既罢，日："吾久不见贾生，自以为过之，今不<及>也。.（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 听完之后，文帝慨叹道：“我好长时间没见贾谊了，自认为能超过他，现在看来还是不如他。”
      - trans: ❺赶得上;来得及。
        sentences:
          - ancient: 素衣莫起风尘叹，犹<及>清明可到家。（宋•陆游《临安春雨初霁》）
            url: xxxx
            vernacular: 不要叹息那京都的尘土使洁白的衣衫变得污秽，清明时节还来得及回到镜湖边的山阴故家。
          - ancient: 僻不当道者，皆不<及>往。（《登泰山记》）
            url: xxxx
            vernacular: 那些偏僻不对着道路的石刻，都赶不上去看了。
  - word: 及
    type: 【介词】
    phonetic: ji2
    tags:
      - 高中
    samples:
      - trans: ❶等到。
        sentences:
          - ancient: <及>反（通"返"），市罢，遂不得履。（《韩非子•外储说左上》）
            url: xxxx
            vernacular: 等到他返回集市的时候，集市已经散了，最后郑国人没能买到鞋子。
          - ancient: <及>至始皇，奋六世之余烈，振长策而御宇内。（《过秦论》）
            url: xxxx
            vernacular: 到始皇的时候，发展六世遗留下来的功业，以武力来统治各国
          - ancient: <及>其所之既倦，情随事迁，感慨系之矣。（《兰亭集序》）
            url: xxxx
            vernacular: 等到对得到或喜爱的东西已经厌倦，感情随着事物的变化而变化，感慨随之产生。
          - ancient: 武留匈奴凡十九岁，始以强壮出，<及>还，须发尽白。（《苏武传》）
            url: xxxx
            vernacular: xxxx
          - ancient: 【高考题例】贾生既辞往行<及>渡湘水，为赋以吊屈原。（《史记.屈原贾生列传》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷到。
        sentences:
          - ancient: 谋（考虑）<及>子孙，可谓死君（置君于死地）乎？（《左传•僖公三十三年》）
            url: xxxx
            vernacular: xxxx
          - ancient: 逃未<及>远，市（买）者还。（《童区寄传》）
            url: xxxx
            vernacular: xxxx
      - trans: ❸跟;同。
        sentences:
          - ancient: 德音（诺言）莫违，<及>尔同死。（《诗经•鄢风•谷风》）
            url: xxxx
            vernacular: xxxx
          - ancient: <及>尔偕老，老使我怨。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: xxxx
      - trans: ❹当;趁。
        sentences:
          - ancient: 对曰："十五岁矣。虽少，愿<及>未填沟壑而托之。"（《触龙说赵太后》）
            url: xxxx
            vernacular: xxxx
          - ancient: 今媪尊长安君之位，而封之以膏腴之地，多予之重器，而不<及>今令有功于国。（《触龙说赵太后》）
            url: xxxx
            vernacular: xxxx
          - ancient: 回朕车以复路兮，<及>行迷之未远。（《离骚》）
            url: xxxx
            vernacular: xxxx
