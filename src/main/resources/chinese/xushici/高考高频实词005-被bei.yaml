  - word: 被
    type: 【动词】
    phonetic: pi1
    tags:
      - 高中
    samples:
      - trans: ❶通"披"。穿或披。
        sentences:
          - ancient: 操吴戈兮<被>犀甲，车错毂兮短兵接。（战国楚•屈原《国殇》）
            url: xxxx
            vernacular: 战士手持兵器身披犀甲，敌我战车交错戈剑相接。
          - ancient: 将军身<被>坚执锐，伐无道，诛暴秦，复立楚国之社稷，功宜为王。（《陈涉世家》）
            url: xxxx
            vernacular: 将军您亲身披着战甲，拿着锐利的武器，讨伐诛灭残暴无道的秦王朝，恢复建立楚国的江山，按照功劳应当称王。
          - ancient: 同舍生皆<被>绮绣，戴朱缨宝饰之帽。（《送东阳马生序》）
            url: xxxx
            vernacular: 同学舍的求学者都穿着锦绣衣服，戴着穿有珠穗、饰有珍宝的帽子
      - trans: ❷通"披"。散开。
        sentences:
          - ancient: 屈原至于江滨，<被>发行吟泽畔，颜色憔悴，形容（容貌）枯槁。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 屈原到了江滨，披散头发，在水泽边一面走，一面吟咏着。脸色憔悴，形体面貌像枯死的树木一样毫无生气。
          - ancient: 公不少留我涕滂，翩然<被>发下大荒。（宋•苏轼《潮州韩文公庙碑》）
            url: xxxx
            vernacular: 您不肯稍作停留，使我们泪下如雨，只得送您的英灵，披着头发，轻快地返回仙乡
      - trans: ❸影响。
        sentences:
          - ancient: 夫人之有一能而使后人尚（推崇）之如此，况仁人庄士之遗风余思，<被>于来世者何如哉！（宋•曾巩《墨池记》）
            url: xxxx
            vernacular: 一个人有一技之长，就能使后人像这样尊重他；何况那些品德高尚、行为端庄的人，遗留下来令人思慕的美好风范，对于后世的影响那就更不用说了！
