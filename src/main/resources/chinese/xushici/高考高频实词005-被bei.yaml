  - word: 被
    type: 【动词】
    phonetic: bei4
    tags:
      - 高中
    samples:
      - trans: ❶覆盖。
        sentences:
          - ancient: 祥风时雨，覆<被>远方。（《后汉书•鲁恭传》）
            url: xxxx
            vernacular: 详风及时雨，覆盖远方。
          - ancient: 幸大雪逾岭，<被>南越中数州。（《答韦中立论师道书》）
            url: xxxx
            vernacular: 遇到下大雪，越过了五岭，覆盖了南越的几个州
          - ancient: 芙蓉覆水，秋兰<被>涯。（汉•张衡《东京赋》）
            url: xxxx
            vernacular: 芙蓉的花和叶覆盖了水面，秋兰的叶和花从水旁涯岸上披拂垂落。
          - ancient: 成归，闻妻言，如<被>冰雪。（《促织》）
            url: xxxx
            vernacular: 成名回来了，听了妻子的话，全身好像盖上冰雪一样。
      - trans: ❷及;遍及。
        sentences:
          - ancient: 东渐于海，西<被>于流沙。（《史记•夏本纪》）
            url: xxxx
            vernacular: 东临大海，西至沙漠
          - ancient: 虐政用天下，而欲德教之<被>四海，故难成也。（《汉书•董仲舒传》）
            url: xxxx
            vernacular: 暴虐的政治施用到下面，却想使德教普及到四海，这是难以办到的啊。
      - trans: ❸加;加在……之上。
        sentences:
          - ancient: 幸<被>齿发，何敢负德。（《柳毅传》）
            url: xxxx
            vernacular: 你的恩德加在我的身上，我怎么能够忘记你的恩德呢
          - ancient: 众谗人之嫉妒兮，<被>以不慈之伪名。（战国楚•屈原《九章•哀郢》）
            url: xxxx
            vernacular: 而那些谗人们却要心怀妒嫉啊，竟然在他们的头上加以“不慈”的污蔑之名。
      - trans: ❹蒙受;遭受。
        sentences:
          - ancient: 久之，闻左公<被>炮烙，旦夕且死。（《左忠毅公逸事》）
            url: xxxx
            vernacular: 过了一段时期，听说左公惨遭炮烙酷刑，快要死了。
          - ancient: 秦王复击轲，<被>八创。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦王又砍击荆轲，荆轲被砍伤了八处。
          - ancient: 其次关木索、<被>箠楚受辱。（《报任安书》）
            url: xxxx
            vernacular: 再次是戴上脚镣手铐、被杖击鞭笞而受辱。
          - ancient: 项王身亦<被>十余创。（《项羽之死》）
            url: xxxx
            vernacular: 项羽自己也负伤十多处。
          - ancient: 【高考题例】光武破寻、邑，憙<被>创，有战劳，还拜中郎将，封勇功侯。（《后汉书•赵憙传》）
            url: xxxx
            vernacular: 光武帝打败王寻、王邑时，赵憙受了伤，有战功，回朝后被拜任为中郎将，授官勇功侯。
