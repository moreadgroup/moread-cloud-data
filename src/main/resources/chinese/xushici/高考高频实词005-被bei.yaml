        sentences:
          - ancient: 曲罢曾教善才服，妆成每<被>秋娘妒。（《琵琶行》）
            url: xxxx
            vernacular: 每曲弹罢都令艺术大师们叹服；每次妆成都被同行歌妓们嫉妒。
          - ancient: 五人者，盖当蓼洲周公之<被>逮，激于义而死焉者也。（《五人墓碑记》）
            url: xxxx
            vernacular: 这五个人，是在周公蓼洲被逮捕时，激于大义而死的。
          - ancient: 信而见疑，忠而<被>谤，能无怨乎？（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 诚实对待君主反而被怀疑，忠诚却被奸臣诽谤，能不产生怨恨吗?
