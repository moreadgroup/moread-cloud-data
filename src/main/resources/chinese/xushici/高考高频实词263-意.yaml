意yi4
【名词】❶心意;意图。
【例句】醉翁之意不在酒，在乎山水之间也。（《醉翁亭记》）丨少间，帘内掷一纸出，即道人意中事，无毫发爽。（《促织》）丨囊括四海之意，并吞八荒之心。（《过秦论》）丨今者项庄拔剑舞，其意常在沛公也。（《鸿门宴》）
❷意思;意义。
【例句】书不尽言，言不尽意。（《周易•系辞下》）丨则其意深长矣。（清•薛福成《观巴黎油画记》）
❸情意;情态。
【例句】然五人之当刑也，意气扬扬，呼中丞之名而詈之，谈笑以死。（《五人墓碑记》）丨久之，目似瞑，意暇甚。（《狼》）丨或叩（询问）以往事,一一详述之，意色扬扬，若自矜诩。（《狱中杂记》）丨樊将军以穷困来归丹，丹不忍以己之私,而伤长者之意，愿足下更虑之！（《荆轲刺秦王》）丨眼底空留意，寻思起就里，险化做望夫石。（《长亭送别》）
❹意愿;想法。
【例句】我有亲父兄，性行暴如雷，恐不任我意，逆以煎我怀。（《孔雀东南飞））丨日以尽矣，荆卿岂无意哉？（《荆轲刺秦王》）

【动词】❶意料;料想。
【例句】臣与将军戮力而攻秦，将军战河北，臣战河南，然不自意能先入关破秦，得复见将军于此。（《鸿门宴》）丨群臣惊愕，卒起不意，尽失其度。（《荆轲刺秦王》）丨国事至此,予不得爱身；意北亦尚可以口舌动也。（《〈指南录〉后序》）丨诚不自意返吾衣冠，重见日月，使旦夕得正丘首，复何憾哉！（《〈指南录〉后序》）
❷猜测;怀疑。
【例句】臣闻君子善谋，小人善意，臣窃意之也。（《吕氏春秋•重言》）
【连词】通"抑"。或者;还是。
【例句】不识世无明君乎，意先生之道固不通乎？（《说苑•善说》）

