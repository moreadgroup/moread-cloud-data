---
words:
  - word: 意
    type: 【名词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶心意;意图。
        sentences:
          - ancient: 醉翁之<意>不在酒，在乎山水之间也。（《醉翁亭记》）
            url: xxxx
            vernacular: 醉翁的情趣不在于喝酒，而在欣赏山水的美景。
          - ancient: 少间，帘内掷一纸出，即道人<意>中事，无毫发爽。（《促织》）
            url: xxxx
            vernacular: 一会儿，室内丢一张纸条出来，上面写着求神的人心中想问的事，没有丝毫差错。
          - ancient: 囊括四海之<意>，并吞八荒之心。（《过秦论》）
            url: xxxx
            vernacular: 囊括四海的意图，并统天下的雄心。
          - ancient: 今者项庄拔剑舞，其<意>常在沛公也。（《鸿门宴》）
            url: xxxx
            vernacular: 现在项庄拔剑起舞，他的意图常在沛公身上啊！
      - trans: ❷意思;意义。
        sentences:
          - ancient: 书不尽言，言不尽<意>。（《周易•系辞下》）
            url: xxxx
            vernacular: 文字不能完全精确地表达言语，言语也不能完全精确地表达人的思想。
          - ancient: 则其<意>深长矣。（清•薛福成《观巴黎油画记》）
            url: xxxx
            vernacular: 这样说来它的意义就很深远了。
      - trans: ❸情意;情态。
        sentences:
          - ancient: 然五人之当刑也，<意>气扬扬，呼中丞之名而詈之，谈笑以死。（《五人墓碑记》）
            url: xxxx
            vernacular: 然而，当五个人临刑的时候，神情慷慨自若，呼喊着中丞的名字骂他，谈笑着死去了。
          - ancient: 久之，目似瞑，<意>暇甚。（《狼》）
            url: xxxx
            vernacular: 过了一会儿，狼的眼睛好像闭上了，神情悠闲得很。
          - ancient: "或叩（询问）以往事,一一详述之，<意>色扬扬，若自矜诩。（《狱中杂记》）"
            url: xxxx
            vernacular: 有人问他过去的班，他竟一件一件原原本本道来，神气活现，好像自己了不起似的。
          - ancient: "樊将军以穷困来归丹，丹不忍以己之私,而伤长者之<意>，愿足下更虑之！（《荆轲刺秦王》）"
            url: xxxx
            vernacular: 樊将军因为无路可走投奔我，我不忍心由于自己个人的私仇而伤害长者的心意，希望您另外考虑对策吧！
          - ancient: 眼底空留<意>，寻思起就里，险化做望夫石。（《长亭送别》）
            url: xxxx
            vernacular: 眼里空留着深意，回想起其中的波折，差一点化成望夫石。
      - trans: ❹意愿;想法。
        sentences:
          - ancient: 我有亲父兄，性行暴如雷，恐不任我<意>，逆以煎我怀。（《孔雀东南飞））
            url: xxxx
            vernacular: 我的家中有父亲和兄长，他们性情暴躁，恐怕不会让我如愿，违背了我的心意让我心中备受煎熬。
          - ancient: 日以尽矣，荆卿岂无<意>哉？（《荆轲刺秦王》）
            url: xxxx
            vernacular: 日子已经没多少了，您难道没有动身的意思吗？
  - word: 意
    type: 【动词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶意料;料想。
        sentences:
          - ancient: 臣与将军戮力而攻秦，将军战河北，臣战河南，然不自<意>能先入关破秦，得复见将军于此。（《鸿门宴》）
            url: xxxx
            vernacular: 我和将军合力攻打秦国，将军在黄河以北作战。我在黄河以南作战，然而自己没有料想到能够先入关攻破秦国，能够在这里再看到将军您。
          - ancient: 群臣惊愕，卒起不<意>，尽失其度。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦国的君臣都惊呆了，事情突然发生，意料不到，大家都失去了常态。
          - ancient: "国事至此,予不得爱身；<意>北亦尚可以口舌动也。（《〈指南录〉后序》）"
            url: xxxx
            vernacular: 国事到了这个地步，我顾不得爱惜自己的身躯，（而且）我料想元军方面还是可以用言语说服的。
          - ancient: 诚不自<意>返吾衣冠，重见日月，使旦夕得正丘首，复何憾哉！（《〈指南录〉后序》）
            url: xxxx
            vernacular: 实在料不到我终于返回宋朝，重整衣冠，又见到皇帝与皇后，即使立刻死在故国的土地上，我还有什么遗憾呢！
      - trans: ❷猜测;怀疑。
        sentences:
          - ancient: 臣闻君子善谋，小人善<意>，臣窃<意>之也。（《吕氏春秋•重言》）
            url: xxxx
            vernacular: 君子善于策谋,小人善于推测.这话是小民私自猜测的.
  - word: 意
    type: 【连词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: 通"抑"。或者;还是。
        sentences:
          - ancient: 不识世无明君乎，<意>先生之道，固不通乎？（《说苑•善说》）
            url: xxxx
            vernacular: 是你不能辨识世无明君呢，想来还是你所吃的道原本就不能通行？ 
