---
words:
  - word: 凡
    type: 【名词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: 尘世，宗教、神话等所指的人世间。
        sentences:
          - ancient: 地灵连海岱,境胜隔仙凡。（元•王悻《灵岩寺二十六韵》）
  - word: 凡
    type: 【形容词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: 平常;普通。
        sentences:
          - ancient: 巨（吴巨）是凡人，偏在远郡，行将为人所并，岂足托乎！（《密治通鉴•汉纪五十七》）
  - word: 凡
    type: 【副词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: ❶凡是;一切。
        sentences:
          - ancient: 如使人之所欲莫甚于生，则凡可以得生者何不用也？（《鱼我所欲也》）
          - ancient: 凡所应有，无所不有。（《口技》）
          - ancient: 凡在故老，犹蒙矜育。（《陈情表》）
          - ancient: 以为凡是州之山水有异态者，皆我有也，而未始知西山之怪特。（《始得西山宴游记》）
      - trans: ❷总共;共计;一共。
        sentences:
          - ancient: 由是先主遂诣（yi4,拜访）亮，凡三往,乃见。（《隆中对》）
          - ancient: 因为长句，歌以赠之，凡六百一十六言。（《琵琶行》序）
          - ancient: 为十表，本纪十二,书八章，世家三十，列传七十，凡百三十篇。（《报任安书》）
          - ancient: 武留匈奴凡十九岁，始以强壮出，及还，须发尽白。（《苏武传》）
          - ancient: 轩凡四遭火，得不焚，殆有神护者。（《项脊轩志》）
          - ancient: 道海安、如皋，凡三百里,北与寇往来其间，无日而非可死。（《〈指南录〉后序》）
          - ancient: 【高考题例】今自去秋来,地震天鸣，雹降星殒，龙虎出见，地裂山崩,凡四十有二。（《明史•傅珪传》）
          - ancient: 在朝凡三十余年，历掌清要，家无僵石之蓄。（《旧唐书•于休烈传》）