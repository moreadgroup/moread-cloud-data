---
words:
  - word: 凡
    type: 【名词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: 尘世，宗教、神话等所指的人世间。
        sentences:
          - ancient: 地灵连海岱，境胜隔仙<凡>。（元•王悻《灵岩寺二十六韵》）
            url: xxxx
            vernacular: 这里的山川地理灵气汇聚如海岱一样壮观，景色优美胜过凡间，就算隔着仙境看去也不逊色。
  - word: 凡
    type: 【形容词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: 平常;普通。
        sentences:
          - ancient: 巨（吴巨）是<凡>人，偏在远郡，行将为人所并，岂足托乎！（《密治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 吴巨是个平庸的人，又处在偏远的郡地，很快会被人吞并，哪里能够依靠呢！
  - word: 凡
    type: 【副词】
    phonetic: fan2
    tags:
      - 高中
    samples:
      - trans: ❶凡是;一切。
        sentences:
          - ancient: 如使人之所欲莫甚于生，则<凡>可以得生者何不用也？（《鱼我所欲也》）
            url: xxxx
            vernacular: 如果人们所喜爱的东西没有超过生命的，那么凡是能够用来求得生存的手段，有什么不可以使用呢?
          - ancient: <凡>所应有，无所不有。（《口技》）
            url: xxxx
            vernacular: 凡是在这种情况下应该有的声音，没有一样没有的。
          - ancient: <凡>在故老，犹蒙矜育。（《陈情表》）
            url: xxxx
            vernacular: 我想晋朝是用孝道来治理天下的，凡是年老而德高的旧臣，尚且还受到怜悯养育
          - ancient: 以为<凡>是州之山水有异态者，皆我有也，而未始知西山之怪特。（《始得西山宴游记》）
            url: xxxx
            vernacular: 我原以为永州山水中稍有特异地方，都已被我游览了。殊不知还有个奇异独特的西山。
      - trans: ❷总共;共计;一共。
        sentences:
          - ancient: 由是先主遂诣（yi4，拜访）亮，<凡>三往，乃见。（《隆中对》）
            url: xxxx
            vernacular: 因此先帝就去隆中拜访诸葛亮，总共去了三次，才见到诸葛亮。
          - ancient: 因为长句，歌以赠之，<凡>六百一十六言。（《琵琶行》序）
            url: xxxx
            vernacular: 于是撰写了这首七言歌行，吟唱一番来赠送给她，一共有六百一十六字
          - ancient: 为十表，本纪十二，书八章，世家三十，列传七十，<凡>百三十篇。（《报任安书》）
            url: xxxx
            vernacular: 写成十篇表，十二篇本纪，八篇书，三十篇世家，七十篇列传，一共一百三十篇
          - ancient: 武留匈奴<凡>十九岁，始以强壮出，及还，须发尽白。（《苏武传》）
            url: xxxx
            vernacular: 苏武被扣在匈奴共十九年，当初壮年出使，等到回来，胡须头发全都白了。
          - ancient: 轩<凡>四遭火，得不焚，殆有神护者。（《项脊轩志》）
            url: xxxx
            vernacular: 项脊轩一共遭过四次火灾，能够不被焚毁，大概是有神灵在保护着吧。
          - ancient: 道海安、如皋，<凡>三百里，北与寇往来其间，无日而非可死。（《〈指南录〉后序》）
            url: xxxx
            vernacular: 经过海安、如皋，共三百里路程，敌人和盗贼往来其间，没有哪一天不会死。
          - ancient: 【高考题例】今自去秋来，地震天鸣，雹降星殒，龙虎出见，地裂山崩，<凡>四十有二。（《明史•傅珪传》）
            url: xxxx
            vernacular: 自从去年秋天以来，地震雷鸣，天降冰雹，辰星坠落，龙虎出现，地裂山崩，总共四十二次
          - ancient: 在朝<凡>三十余年，历掌清要，家无僵石之蓄。（《旧唐书•于休烈传》）
            url: xxxx
            vernacular: 在朝为官共三十余年，历任清要之职，家中没有些微积蓄。
