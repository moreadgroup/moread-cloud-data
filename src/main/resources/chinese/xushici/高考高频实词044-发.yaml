---
words:
  - word: 发
    type: 【动词】
    phonetic: fa1
    tags:
      - 高中
    samples:
      - trans: ❶射箭;发射。
        sentences:
          - ancient: 【例句】控弦破左的，右发摧月支。（三国魏•曹植《白马篇》）
          - ancient: 见其发矢十中八九，但微颔之。（《卖油翁》）
          - ancient: 简子唾手登车，援乌号之弓，挟肃慎之矢，一发饮羽，狼失声而逋（bu1逃跑）。（《中山狼传》）
          - ancient: 于是众枪齐发，敌人纷堕如落叶。（《冯婉贞》）
      - trans: ❷出发。
        sentences:
          - ancient: 【例句】忽闻水上琵琶声，主人忘归客不发。（《琵琶行》）
          - ancient: 留恋处，兰舟催发。（《雨霖铃》）
          - ancient: 顷之未发，太子迟之，疑其有改悔。（《荆轲刺秦王》）
          - ancient: 发北关外,历吴门、毗陵，渡瓜洲，复还京口，为一卷。（《〈指南录〉后序》）
      - trans: ❸派遣;征发。
        sentences:
          - ancient: 【例句】二世元年七月，发闾左谪戍渔阳九百人，屯大泽乡。（《陈涉世家》）
          - ancient: 孤当续发人众，多载资粮，为卿后援。（《资治通鉴•汉纪五十七》）
          - ancient: 方欲发使送武等，会缑王与长水虞常等谋反匈奴中。（《苏武传》）
          - ancient: 发沛中儿得百二十人,教之歌。（《史记•高祖本纪》）
      - trans: ❹发动。
        sentences:
          - ancient: 【例句】虞常等七十余人欲发。其一人夜亡（逃走），告之（告发这件事）。（《史记•李广苏建传》）
          - ancient: 大阉亦逡巡畏义，非常之谋（篡夺帝位的阴谋）难于猝发。（《五人墓碑记》）’,’’
      - trans: ❺打幵;挖开。
        sentences:
          - ancient: 【例句】轲既取图奉之，发图，图穷而匕首见。（《战国策•燕策三》）
          - ancient: 成（成名，人名）有子九岁，窥父不在，窃发盆。（《促织》）
          - ancient: 【高考题例】贬谪元祐诸臣，奏发司马光墓。（《宋史•许将传》）
      - trans: ❻发现;发觉。
        sentences:
          - ancient: 【例句】奔走遐（远）方，自迷正途，又安能发狼踪以指示夫子之鹰犬也？（《中山狼传》）
      - trans: ❼发作;抒发。
        sentences:
          - ancient: 【例句】此三子者，皆布衣之士也，怀怒未发，休祲（吉凶的征兆）降于天，与臣而将四矣。（《唐雎不雇使命》）
          - ancient: 安能屈豪杰之流，扼腕墓道，发其志士之悲哉？（《五人墓碑记》）
      - trans: ❽发出。
        sentences:
          - ancient: 【例句】征于色，发于声，而后喻。（《生于忧患，死于安乐》）
          - ancient: 爽籁发而清风生，纤歌凝而白云遏。（《滕王阁序》）
          - ancient: 每念斯耻，汗未尝不发背沾衣也。（《报任安书》）
      - trans: ❾兴起。
        sentences:
          - ancient: 【例句】舜发于畎亩（quan3,田地），傅说举于版筑之间。 （《生于忧患，死于安乐》）
      - trans: ❿发布。
        sentences:
          - ancient: 【例句】今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野。（《齐桓晋文之事》）
      - trans: ⑪ 拿出。
        sentences:
          - ancient: 【例句】有贤士大夫发五十金，买五人之脰（dou4,头）而函之，卒与尸合。（《五人墓碑记》）
      - trans: ⑫ 送出。
        sentences:
          - ancient: 【例句】大王欲得璧，使人发书至赵王。（《廉颇蔺相如列传》）
      - trans: ⑬发起;提出。
        sentences:
          - ancient: 【高考题例】诸律令所更定，及列侯悉就国，其说皆自贾生发::之。（《史记•屈原贾生列传》）
          - ancient: 庆典霈泽，丁钱减半，:亦自燧发之。（《宋史•萧燧传》）

      - trans: ⑭开放。
        sentences:
          - ancient: 【例句】野芳发而幽香，佳木秀而繁阴。（《醉翁亭记》）
      - trans: ⑮特指开仓赈民。
        sentences:
          - ancient: 【例句】狗彘食人食而不知检，涂有饿莩而不知发。（《寡人之于国也》）
          - ancient: 【高考题例】为请诸朝，发太仓米振之。（《宋史•萧燧传》）

      - trans: ⑯揭露;揭发。
        sentences:
          - ancient: 【例句】单于使卫律治其事，张胜闻之，恐前语发，以状语武。（《苏武传》）
          - ancient: 博辩广大危其身者，发人之恶者也。（《史记•孔子世家》）

  - word: 发
    type: 【量词】
    phonetic: fa1
    tags:
      - 高中
    samples:
      - trans: 用于箭、枪弹、炮弹等。
        sentences:
          - ancient: 【例句】君当解去兹带，束以他物，然后叩树三发，当有应者。（《柳毅传》）。

