---
words:
  - word: 发
    type: 【动词】
    phonetic: fa1
    tags:
      - 高中
    samples:
      - trans: ❶射箭;发射。
        sentences:
          - ancient: 控弦破左的，右<发>摧月支。（三国魏•曹植《白马篇》）
            url: xxxx
            vernacular: 拉开弓如满月左右射击，一箭箭中靶心不差毫厘。
          - ancient: 见其<发>矢十中八九，但微颔之。（《卖油翁》）
            url: xxxx
            vernacular: 卖油的老翁看他射十箭中了八九成，只是微微点点头。
          - ancient: 简子唾手登车，援乌号之弓，挟肃慎之矢，一<发>饮羽，狼失声而逋（bu1逃跑）。（《中山狼传》）
            url: xxxx
            vernacular: 简子吐口唾沫到手上跳上车子，拿起宝弓，搭上利箭，一箭射到羽毛都陷入肉中，狼号叫着逃跑。
          - ancient: 于是众枪齐<发>，敌人纷堕如落叶。（《冯婉贞》）
            url: xxxx
            vernacular: 于是所有的一齐发射，敌人象落叶似的纷纷跌下马来。
      - trans: ❷出发。
        sentences:
          - ancient: 忽闻水上琵琶声，主人忘归客不<发>。（《琵琶行》）
            url: xxxx
            vernacular: 忽听得江面上传来琵琶清脆声，我忘却了回归客人也不想动身。
          - ancient: 留恋处，兰舟催<发>。（《雨霖铃》）
            url: xxxx
            vernacular: 正在依依不舍的时候，船上的人已催着出发。
          - ancient: 顷之未<发>，太子迟之，疑其有改悔。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 过了一阵还没动身，太子嫌荆轲走晚了，怀疑他有改变初衷和后悔的念头
          - ancient: "<发>北关外,历吴门、毗陵，渡瓜洲，复还京口，为一卷。（《〈指南录〉后序》）"
            url: xxxx
            vernacular: 从北门外出发，经过吴门、毗陵，渡过瓜洲，又回到京口的，作为一卷。
      - trans: ❸派遣;征发。
        sentences:
          - ancient: 二世元年七月，<发>闾左谪戍渔阳九百人，屯大泽乡。（《陈涉世家》）
            url: xxxx
            vernacular: 二世元年七月，发闾左适戍渔阳，九百人屯大泽乡。翻译为秦二世元年七月，朝廷征发贫苦人民去驻守渔阳，九百人驻扎在大泽乡。
          - ancient: 孤当续<发>人众，多载资粮，为卿后援。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 我会后续给你派遣众多人员,让他们多多运载物资粮草,作为你的后援。
          - ancient: 方欲<发>使送武等，会缑王与长水虞常等谋反匈奴中。（《苏武传》）
            url: xxxx
            vernacular: 单于正要派使者护送苏武等人归汉，适逢缑王与长水人虞常等人在匈奴内部谋反。
          - ancient: "<发>沛中儿得百二十人,教之歌。（《史记•高祖本纪》）"
            url: xxxx
            vernacular: 挑选沛中儿童一百二十人，教他们唱歌。
      - trans: ❹发动。
        sentences:
          - ancient: 虞常等七十余人欲<发>。其一人夜亡（逃走），告之（告发这件事）。（《史记•李广苏建传》）
            url: xxxx
            vernacular: 虞常等七十余人将要起事，其中一人夜晚逃走，告发了这件事。
          - ancient: "大阉亦逡巡畏义，非常之谋（篡夺帝位的阴谋）难于猝<发>。（《五人墓碑记》）’,’’"
            url: xxxx
            vernacular: 魏阉也迟疑不决，害怕正义，篡位的阴谋难于立刻发动。
      - trans: ❺打幵;挖开。
        sentences:
          - ancient: 轲既取图奉之，<发>图，图穷而匕首见。（《战国策•燕策三》）
            url: xxxx
            vernacular: 打开地图，地图全部打开，匕首就露了出来。
          - ancient: 成（成名，人名）有子九岁，窥父不在，窃<发>盆。（《促织》）
            url: xxxx
            vernacular: 成名有个儿子，年九岁，看到爸爸不在（家），偷偷打开盆子来看。
          - ancient: 【高考题例】贬谪元祐诸臣，奏<发>司马光墓。（《宋史•许将传》）
            url: xxxx
            vernacular: 贬谪元佑时的大臣，上奏挖司马光的墓。
      - trans: ❻发现;发觉。
        sentences:
          - ancient: 奔走遐（远）方，自迷正途，又安能<发>狼踪以指示夫子之鹰犬也？（《中山狼传》）
            url: xxxx
            vernacular: 奔走远方，自己迷失了道路，又怎么能发现狼的踪迹来指示给你的鹰犬呢？
      - trans: ❼发作;抒发。
        sentences:
          - ancient: 此三子者，皆布衣之士也，怀怒未<发>，休祲（吉凶的征兆）降于天，与臣而将四矣。（《唐雎不雇使命》）
            url: xxxx
            vernacular: (专诸、聂政、要离)这三个人都是普通百姓中有胆有识的人，心中的怒气还没有发作出来，上天就降下了征兆，(今天)加上我就将成为四个人了。
          - ancient: 安能屈豪杰之流，扼腕墓道，<发>其志士之悲哉？（《五人墓碑记》）
            url: xxxx
            vernacular: 又怎么能让豪杰们屈身下拜，在墓道上扼腕惋惜，抒发他们有志之士的悲叹呢？
      - trans: ❽发出。
        sentences:
          - ancient: 征于色，<发>于声，而后喻。（《生于忧患，死于安乐》）
            url: xxxx
            vernacular: 表现在脸色上，流露在言谈中，才能被人们了解。
          - ancient: 爽籁<发>而清风生，纤歌凝而白云遏。（《滕王阁序》）
            url: xxxx
            vernacular: 超逸的兴致立即兴起，排箫的音响引来的徐徐清风，柔缓的歌声吸引住飘动的白云。
          - ancient: 每念斯耻，汗未尝不<发>背沾衣也。（《报任安书》）
            url: xxxx
            vernacular: 每当想到这件耻辱的事，冷汗没有不从脊背上冒出来而沾湿衣襟的。
      - trans: ❾兴起。
        sentences:
          - ancient: "舜<发>于畎亩（quan3,田地），傅说举于版筑之间。 （《生于忧患，死于安乐》）"
            url: xxxx
            vernacular: 舜从田野耕作之中被起用，傅说从筑墙的劳作之中被起用
      - trans: ❿发布。
        sentences:
          - ancient: 今王<发>政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野。（《齐桓晋文之事》）
            url: xxxx
            vernacular: 现在大王发布政令，施行仁政，使天下的仁义之士都想在您的朝中效力。种田的都想到您的田野来耕作
      - trans: ⑪ 拿出。
        sentences:
          - ancient: "有贤士大夫<发>五十金，买五人之脰（dou4,头）而函之，卒与尸合。（《五人墓碑记》）"
            url: xxxx
            vernacular: 有位有名望的人拿出五十两银子，买下五个人的头并用木匣装起来，最终与尸体合到了一起。
      - trans: ⑫ 送出。
        sentences:
          - ancient: 大王欲得璧，使人<发>书至赵王。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 大王想要得到和氏璧，派人送信给赵王。
      - trans: ⑬发起;提出。
        sentences:
          - ancient: 【高考题例】诸律令所更定，及列侯悉就国，其说皆自贾生<发>之。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 但此后各项法令的更改，以及诸侯必须到封地去上任等事，这都是贾谊的主张。
          - ancient: 庆典霈泽，丁钱减半，亦自燧<发>之。（《宋史•萧燧传》）
            url: xxxx
            vernacular: 庆典时推布恩泽（沛泽，盛大的恩泽），丁钱减免一半，也是从萧燧发起的。
      - trans: ⑭开放。
        sentences:
          - ancient: 野芳<发>而幽香，佳木秀而繁阴。（《醉翁亭记》）
            url: xxxx
            vernacular: 野花开了，有一股清幽的香味；好的树木枝繁叶茂，形成一片浓密的绿荫。
      - trans: ⑮特指开仓赈民。
        sentences:
          - ancient: 狗彘食人食而不知检，涂有饿莩而不知<发>。（《寡人之于国也》）
            url: xxxx
            vernacular: 猪狗吃的是人吃的食物而不知道设法制止，路上出现饿死的人而不知道赈济饥民
          - ancient: 【高考题例】为请诸朝，<发>太仓米振之。（《宋史•萧燧传》）
            url: xxxx
            vernacular: 为此向朝廷请求，发放皇粮来救济百姓。
      - trans: ⑯揭露;揭发。
        sentences:
          - ancient: 单于使卫律治其事，张胜闻之，恐前语<发>，以状语武。（《苏武传》）
            url: xxxx
            vernacular: 单于派卫律审理这一案件。张胜听到这个消息，担心他和虞常私下所说的那些话被揭发，便把事情经过告诉了苏武。
          - ancient: 博辩广大危其身者，<发>人之恶者也。（《史记•孔子世家》）
            url: xxxx
            vernacular: 博洽善辩宽广弘大反而危及其身，是因为抉发别人丑恶的缘故。
  - word: 发
    type: 【量词】
    phonetic: fa1
    tags:
      - 高中
    samples:
      - trans: 用于箭、枪弹、炮弹等。
        sentences:
          - ancient: 君当解去兹带，束以他物，然后叩树三<发>，当有应者。（《柳毅传》）。
            url: xxxx
            vernacular: 您（到了那里）要解下腰带，束上别的东西，在树干上敲三下，就会有人出来招呼您。
