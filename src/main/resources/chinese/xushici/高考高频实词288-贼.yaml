            vernacular: 一天，他正一边放牛一边打柴，有两个蛮横的强盗把他绑架了，反背着手捆起来，用布蒙住他的嘴
          - ancient: 吾数击杀响马<贼>，夺其物，故仇我。（《大铁椎传》）
