  - word: 贼
    type: 【动词】
    phonetic: zei2
    tags:
      - 高中
    samples:
      - trans: ❶杀害。
        sentences:
          - ancient: 田恆相齐，阚止重于简公，二人相憎而欲相<贼>也。（《韩非子•内储说下》）
            url: xxxx
            vernacular: 田常担任齐相，而阚止受着齐简公的器重，田常、阚止这两个人互相憎恨并想杀掉对方。
      - trans: ❷伤害;危害。
        sentences:
          - ancient: 子路使子羔为费宰。子曰：‘<贼>夫人之子！’。（《论语•先进》）
            url: xxxx
            vernacular: 贼：毁坏。 夫：这，那。 害了人家的儿子。 对引导别人犯错误者的斥责
          - ancient: 及其见利而争先，或利尽而交疏（交情疏远），则反相<贼>害，虽（即使）其兄弟亲戚，不能相保。（《朋党论》）
            url: xxxx
            vernacular: 等到他们见到利益而争先恐后，或者利益已尽而交情淡漠之时，就会反过来互相残害，即使是兄弟亲戚，也不会互相保护。
