          - ancient: 【高考题例】行之十年，秦民大说，道不拾遗，山无盗<贼>，家给人足。（《史记•商君列传》）
            url: xxxx
            vernacular: 新法施行十年，秦国人都非常高兴，路上没有人将别人丢的东西据为己有，山林里也没了盗贼，家家富裕充足
      - trans: ❸杀人者。
