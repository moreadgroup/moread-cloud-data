贼zei2
【名词】❶祸患;祸害。
【例句】淫侈之俗，日日以长，是天下之大贼也。（《论积贮疏》）
❷强盗。
【例句】二豪贼劫持，反接，布囊（蒙住）其口。（《童区寄传》）丨吾数击杀响马贼,夺其物，故仇我。（《大铁椎传》）
【高考题例】行之十年，秦民大说，道不拾遗，山无盗贼,家给人足。（《史记•商君列传》）	：
❸杀人者。
【例句】燕王昏乱,其太子丹乃阴令荆轲为贼。（《史记•秦始皇本纪》）
❹对作乱叛国或外来入侵者的蔑称。
【例句】（曹）操虽托名汉相，其实汉贼也。（《资治通鉴•汉纪五十七》）丨未及见贼而士卒离散，君臣相顾，不知所归。（《伶官传序》）丨《春秋》之义行，则天下乱臣贼子惧焉。（《史记•孔子世家》）丨生无以救国难，死犹为厉鬼以击贼,义也。（《〈指南录〉后序》）丨愿陛下托臣以讨贼兴复之效,不效，则治臣之罪，以告先帝之灵。（《出师表》）
【高考题例】敌攻石尖山，浩冒阵而前，流矢中左肋，怒不拔，奋力大呼，得贼乃已。（《宋史•郭浩传》）
❺窃贼;小偷。
【例句】师曰："贼去后关门。"（《景德传灯录•杭州倾心寺法瑁宗一禅师》）

【动词】❶杀害。
【例句】二人相憎而欲相贼也。（《韩非子•内储说下》）
❷伤害;危害。
【例句】贼夫人之子。（《论语•先进》）丨及其见利而争先,或利尽而交疏（交情疏远），则反相贼害，虽（即使）其兄弟亲戚，不能相保。（《朋党论》）

【形容词】狠毒。
【例句】董卓狼戾（li4,凶暴）贼忍。（《三国志•魏书•董卓传》）
