---
words:
  - word: 却
    type: 【动词】
    phonetic: que4
    tags:
      - 高中
    samples:
      - trans: ❶后退。
        sentences:
          - ancient: 相如因持璧却立，倚柱，怒发上冲冠。（《廉颇蔺相如列传》）
          - ancient: 却坐促弦弦转急。（《琵琶行》）
      - trans: ❷迫使后退;击退。
        sentences:
          - ancient: 却匈奴七百余里。（《过秦论》）
          - ancient: 后秦击赵者再（两次），李牧连却之。（《六国论》）
      - trans: ❸拒绝;不接受。
        sentences:
          - ancient: 曰："<却>之<却>之为不恭，何哉？"（《孟子•万章下》）
          - ancient: 始以为不请,而请者不可遏（阻止）；终以为不纳，而纳者不可却。（宋•王安石《答曾公立书》）
      - trans: ❹回头。
        sentences:
          - ancient: 却看妻子愁何在，漫卷诗书喜欲狂。（《闻官军收河南河北》）
      - trans: ❺去掉。
        sentences:
          - ancient: 医得眼前疮,剜却心头肉。（唐•聂夷中《伤田家》）

  - word: 却
    type: 【副词】
    phonetic: que4
    tags:
      - 高中
    samples:
      - trans: ❶还;再。
        sentences:
          - ancient: 何当共剪西窗烛，却话巴山夜雨时。（唐•李商隐《夜雨寄北》）
      - trans: ❷反而。
        sentences:
          - ancient: 谁知嫁商贾,令人却愁苦。（唐•李白《江夏行》）
          - ancient: 雁过也，正伤心，却是旧时相识。（《声声慢》）

