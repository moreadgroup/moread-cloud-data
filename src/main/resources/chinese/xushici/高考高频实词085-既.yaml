---
words:
  - word: 既
    type: 【动词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: 穷尽;结束。
        sentences:
          - ancient: 吾与汝<既>其文（形式），未<既>其实（实质）。（《庄子・应帝王》）
            url: xxxx
            vernacular: 我传授给你的都只是外在的东西，还没有展现道的实质
          - ancient: 言未<既>，有笑于列者曰••••••（唐•韩愈《进学解》）
            url: xxxx
            vernacular: 话没有说完,有人在行列里笑道
  - word: 既
    type: 【副词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: ❶……以后；已经。
        sentences:
          - ancient: 不见复关，泣涕涟涟。<既>见复关，载笑载言。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 复关没有见到盼望的人，眼泪簌簌掉下来。情郎即从复关来，又说又笑喜洋洋。
          - ancient: 孙武<既>死，后百余岁有孙膑。（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 孙武已死，过了一百多年又出了个孙膑。
          - ancient: <既>至秦，持千金之资币物，厚遗秦王宠臣中庶子蒙嘉。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 到了秦国之后，带着价值千金的礼物，优厚地赠送给秦王的宠臣中庶子蒙嘉。
      - trans: ❷不久;后来。
        sentences:
          - ancient: <既>又与汝就食（谋生）江南，零丁孤苦，未尝一日相离也。（《祭十二郎文》）
            url: xxxx
            vernacular: 随后又和你到江南谋生，孤苦零丁，一天也没有分开过。
      - trans: ❸完全。
        sentences:
          - ancient: 宋人既成列，楚人未<既>济。（《左传•僖公二十二年》）
            url: xxxx
            vernacular: 宋军已经排成战斗的行列，楚国人没有全部渡过泓水。
      - trans: ❹就;便。
        sentences:
          - ancient: 左右<既>前，斩荆轲。秦王目眩良久。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦王的侍卫上前，斩杀了荆轲。事后，秦王还头昏眼花了好长一段时间。
  - word: 既
    type: 【连词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: ❶既然。
        sentences:
          - ancient: 君<既>若见录，不久望君来。（《孔雀东南飞》）
            url: xxxx
            vernacular: 既然承蒙你这样的记着我，不久之后我会殷切地盼望着你来。
          - ancient: <既>自以心为形役，奚惆怅而独悲？（《归去来兮辞》）
            url: xxxx
            vernacular: 既然自己的心灵为形体所役使，为什么如此失意而独自伤悲？
          - ancient: <既>来之，则安之。（《季氏将伐颛臾》）
            url: xxxx
            vernacular: 使他来了之后，就要使他安定下来。
      - trans: ❷表示并列。
        sentences:
          - ancient: 纷吾<既>有此内美兮，又重之以修能（修养才能）。（《离骚》）
            url: xxxx
            vernacular: 天赋给我很多良好素质，我不断加强自己的修养。
          - ancient: 三军<既>惑且疑，则诸侯之难至矣。（《孙子兵法•谋攻》）
            url: xxxx
            vernacular: 军队既无所适从，又疑虑重重，诸侯就会趁机兴兵作难。
          - ancient: <既>窈窕以寻壑，亦崎岖而经丘。（《归去来兮辞》）
            url: xxxx
            vernacular: 既要探寻那幽深的沟壑，又要走过那高低不平的山丘。
