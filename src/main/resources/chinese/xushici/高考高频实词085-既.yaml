---
words:
  - word: 既
    type: 【动词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: 穷尽;结束。
        sentences:
          - ancient: 【例句】吾与汝既其文（形式），未既其实（实质）。（《庄子・应帝王》）
          - ancient: 言未既，看笑于列者曰••••••（唐•韩愈《进学解》）

  - word: 既
    type: 【副词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: ❶……以后；已经。
        sentences:
          - ancient: 【例句】不见复关，泣涕涟涟。既见复关，载笑载言。（《诗经•卫风•氓》）
          - ancient: 孙武既死，后百余岁有孙膑。（《史记•孙子吴起列传》）
          - ancient: 既至秦,持千金之资币物，厚遗秦王宠臣中庶子蒙嘉。（《荆轲刺秦王》）
      - trans: ❷不久;后来。
        sentences:
          - ancient: 【例句】既又与汝就食（谋生）江南，零丁孤苦，未尝一日相离也。（《祭十二鮒戈》）
      - trans: ❸完全。
        sentences:
          - ancient: 【例句】宋人既成列，楚人未既济。（《左传•僖公二十二年》）
      - trans: ❹就;便。
        sentences:
          - ancient: 【例句】左右既前，斩荆轲。秦王目眩良久。（《荆轲刺秦王》）

  - word: 既
    type: 【连词】
    phonetic: Ji4
    tags:
      - 高中
    samples:
      - trans: ❶既然。
        sentences:
          - ancient: 【例句】君既若见录,不久望君来。（《孔雀东南飞》）
          - ancient: 既自以心为形役，奚惆怅而独悲？（《归去来兮辞》）
          - ancient: 既来之，则安之。（《季氏将伐颛臾》）
      - trans: ❷表示并列。
        sentences:
          - ancient: 【例句】纷吾既有此内美兮，又重之以修能（修养才能）。（《离骚》）
          - ancient: 三军既惑且疑。（《孙子兵法•谋攻》）
          - ancient: 既窈窕以寻壑，亦崎岖而经丘。（《归去来兮辞》）
