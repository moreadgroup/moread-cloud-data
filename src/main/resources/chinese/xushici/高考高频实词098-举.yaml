---
words:
  - word: 举
    type: 【动词】
    phonetic: ju3
    tags:
      - 高中
    samples:
      - trans: ❶拾起;升起。
        sentences:
          - ancient: 举手长劳劳,二情同依依。（《孔雀东南飞》）
          - ancient: 举头望明月，低头思故乡。（唐•李白《静夜思》）
          - ancient: 举所佩玉玦以示之者三。（《鸿门宴》）
      - trans: ❷拿；用。
        sentences:
          - ancient: 吾不能举全吴之地，十万之众，受制于人。（《资治通鉴•汉纪五十七》）
      - trans: ❸行动。
        sentences:
          - ancient: 此妇无礼节,举动自专由。（《孔雀东南飞》）
          - ancient: 乃治戎讲武，以俟（等待）大举。（《三国志•蜀书•诸葛亮传》）
          - ancient: 何故景思高举，自令放为？（《渔父》）
      - trans: ❹提出；举出。
        sentences:
          - ancient: 其称文小而其指（旨趣）极大，举类迩（er3,近）而见义远。（《史记•屈原贾笙列传》）
          - ancient: 臣诚愚鄙，不达事机，略举所见十条,辄以上闻圣听。（唐•魏徵《十渐疏》）
          - ancient: 不愤不启，举一隅不以三隅反，则弗复也。（《史记•孔子世家》）
      - trans: ❺推荐;举荐。
        sentences:
          - ancient: 前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。（《陈情表》）
          - ancient: 将军向宠……先帝称之曰能，是以众议举宠为督。（《出师表》）
          - ancient: 永元中，举孝廉不行，连辟公府不就。（《张衡传》）
          - ancient: 【高考题例】举孝廉，除郎中。（《晋书•鲁芝传》）
      - trans: ❻提拔;任用。
        sentences:
          - ancient: 人君无愚、智、贤、不肖，莫不欲求忠以自为，举贤以自佐。（《史记•屈原贾生列传》）
      - trans: ❼发动。
        sentences:
          - ancient: 远方之能疑者，并举而争起矣。（《论积贮疏》）
          - ancient: 今亡亦死，举大计亦死，等死（同样是死），死国可乎？（《陈涉世家》）
      - trans: ❽占领;攻下。
        sentences:
          - ancient: 南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。（《过秦论》）
          - ancient: 戍卒叫，函谷举，楚人一炬，可怜焦土！（《阿房宫赋》）
      - trans: ❾举行;实行。
        sentences:
          - ancient: 德政不举，威刑不肃。（三国蜀•诸葛亮《答法正书》）
      - trans: ❿科举考试;参加科举考试。
        sentences:
          - ancient: 有儒生柳毅者，应举下第。（《柳毅传》）
          - ancient: 董生举进士，连不得志于有司。（唐•韩愈《送董邵南游河北序》）
      - trans: 11养育;抚养。	
        sentences:
          - ancient: 生男慎莫举,生女哺用脯。（汉，陈琳《饮马长城窟行》）
      - trans: 12检举;揭发。
        sentences:
          - ancient: 恤孤寡，举阿党。（唐•柳宗元《时令论上》）
  
  - word: 举
    type: 【形容词】
    phonetic: ju3
    tags:
      - 高中
    samples: 
      - trans: ❶全;整个儿。
        sentences:
          - ancient: 举世混浊而我独清，众人皆醉而我独醒，是以见放。（《史记•屈原贾生列传》）
          - ancient: 大喜，笼归，举家庆贺，虽连城拱璧不啻（chi4,止）也。（《促织》）
          - ancient: 愿举国为内臣，比诸侯之列。（,《荆轲刺秦王》）
          - ancient: 且<举>世誉之而不加劝，<举>世非之而不加沮。（《逍遥游》）
          - ancient: 【高考题例】弘微少孤，事兄如父,兄弟友穆之至，举世莫及也。《宋书•谢弘微传》）
      - trans: ❷尽;完。
        sentences:
          - ancient: 杀人如不能举，刑人如恐不胜。（《史记•项羽本纪》）
  
  - word: 举
    type: 【副词】
    phonetic: ju3
    tags:
      - 高中
    samples: 
      - trans: 全；皆。
        sentences:
          - ancient: 君举不信群臣乎？（《左传•哀公六年》）
          - ancient: 王如用予，则岂徒齐民安，天下之民举安。（《孟子•公孙丑下》）

