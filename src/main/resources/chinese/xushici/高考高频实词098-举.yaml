---
words:
  - word: 举
    type: 【动词】
    phonetic: ju3
    tags:
      - 高中
    samples:
      - trans: ❶拾起;升起。
        sentences:
          - ancient: "<举>手长劳劳，二情同依依。（《孔雀东南飞》）"
            url: xxxx
            vernacular: 两人忧伤不止地举手告别，双方都依依不舍情意绵绵。
          - ancient: <举>头望明月，低头思故乡。（唐•李白《静夜思》）
            url: xxxx
            vernacular: 我抬起头来，看那天窗外空中的明月，不由得低头沉思，想起远方的家乡。
          - ancient: <举>所佩玉玦以示之者三。（《鸿门宴》）
            url: xxxx
            vernacular: 举起（他）所佩带的玉玦向项羽示意多次
      - trans: ❷拿；用。
        sentences:
          - ancient: 吾不能<举>全吴之地，十万之众，受制于人。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 我不能拿整个吴国的土地，(以及)数万民众，被别人控制。
      - trans: ❸行动。
        sentences:
          - ancient: "此妇无礼节，<举>动自专由。（《孔雀东南飞》）"
            url: xxxx
            vernacular: 这个媳妇不懂得礼节，行动又是那样自专自由。
          - ancient: 乃治戎讲武，以俟（等待）大<举>。（《三国志•蜀书•诸葛亮传》）
            url: xxxx
            vernacular: 于是开始练兵习武，以待将来大举进军中原
          - ancient: 何故景思高<举>，自令放为？（《渔父》）
            url: xxxx
            vernacular: 为什么想得过深又自命清高，以至让自己落了个放逐的下场？
      - trans: ❹提出；举出。
        sentences:
          - ancient: "其称文小而其指（旨趣）极大，<举>类迩（er3，近）而见义远。（《史记•屈原贾笙列传》）"
            url: xxxx
            vernacular: 就其文字来看，不过是寻常事情，但是它的旨趣是极大的，列举的是近事，而表达的意思却十分深远。
          - ancient: "臣诚愚鄙，不达事机，略<举>所见十条，辄以上闻圣听。（唐•魏徵《十渐疏》）"
            url: xxxx
            vernacular: 我确实愚笨无知，看不清事理机缘，大略举出所见十条，把它奏明圣上。
          - ancient: 不愤不启，不悱不发。<举>一隅不以三隅反，则弗复也。（《史记•孔子世家》）
            url: xxxx
            vernacular: 不到他想弄明白而不得的时候，不去开导他;不到他想出来却说不出来的时候，不去启发他。教给他一个方面的东西，他却不能由此而推知其他三个方面的东西，那就不再教他了。
      - trans: ❺推荐;举荐。
        sentences:
          - ancient: 前太守臣逵察臣孝廉，后刺史臣荣<举>臣秀才。（《陈情表》）
            url: xxxx
            vernacular: 先有名叫逵的太守察举臣为孝廉，后又有名叫荣的刺史推举臣为优秀人才。
          - ancient: 将军向宠，先帝称之曰能，是以众议<举>宠为督。（《出师表》）
            url: xxxx
            vernacular: 将军向宠，过去的皇上称赞他的才能，所以大家商量推荐他为都督。
          - ancient: 永元中，<举>孝廉不行，连辟公府不就。（《张衡传》）
            url: xxxx
            vernacular: 永元年间，他被推举为孝廉，却不应荐，屡次被公府征召，都没有就任。
          - ancient: 【高考题例】<举>孝廉，除郎中。（《晋书•鲁芝传》）
            url: xxxx
            vernacular: 华歆被举荐孝廉，任命为郎中
      - trans: ❻提拔;任用。
        sentences:
          - ancient: 人君无愚、智、贤、不肖，莫不欲求忠以自为，<举>贤以自佐。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 国君无论愚笨或明智、贤明或昏庸，没有不想求得忠臣来为自己服务，选拔贤才来辅助自己的。
      - trans: ❼发动。
        sentences:
          - ancient: 远方之能疑者，并<举>而争起矣。（《论积贮疏》）
            url: xxxx
            vernacular: 边远地方敢于同皇上对抗的人，就一同举兵起来造反了。
          - ancient: 今亡亦死，<举>大计亦死，等死（同样是死），死国可乎？（《陈涉世家》）
            url: xxxx
            vernacular: 现在逃跑是死，发动起义也是死，同样是死，为国事而死好吗?
      - trans: ❽占领;攻下。
        sentences:
          - ancient: 南取汉中，西<举>巴、蜀，东割膏腴之地，北收要害之郡。（《过秦论》）
            url: xxxx
            vernacular: 向南夺取汉中，向西攻取巴、蜀，向东割取肥沃的地区，向北占领非常重要的地区。
          - ancient: 戍卒叫，函谷<举>，楚人一炬，可怜焦土！（《阿房宫赋》）
            url: xxxx
            vernacular: （结果）戍边的陈涉、吴广一声呼喊，函谷关被攻下，楚项羽放一把火，可惜（华丽的阿房宫）化为了一片焦土。
      - trans: ❾举行;实行。
        sentences:
          - ancient: 德政不<举>，威刑不肃。（三国蜀•诸葛亮《答法正书》）
            url: xxxx
            vernacular: 不采取有益于民的政治措施，没有树立严峻的法律威严。
      - trans: ❿科举考试;参加科举考试。
        sentences:
          - ancient: 有儒生柳毅者，应<举>下第。（《柳毅传》）
            url: xxxx
            vernacular: 有一位书生柳毅，到京城长安参加科举考试，没有考取。
          - ancient: 董生<举>进士，连不得志于有司。（唐•韩愈《送董邵南游河北序》）
            url: xxxx
            vernacular: 董生被推举参加进士科考试，连续多年不被主考官赏识。
      - trans: ⑪养育;抚养。
        sentences:
          - ancient: "生男慎莫<举>，生女哺用脯。（汉，陈琳《饮马长城窟行》）"
            url: xxxx
            vernacular: 生下男孩千万不要养，生下女孩用肉来哺。
      - trans: ⑫检举;揭发。
        sentences:
          - ancient: 恤孤寡，<举>阿党。（唐•柳宗元《时令论上》）
            url: xxxx
            vernacular: 救济孤寡群众，揭发徇私枉法的人。
  - word: 举
    type: 【形容词】
    phonetic: ju3
    tags:
      - 高中
    samples:
      - trans: ❶全;整个儿。
        sentences:
          - ancient: <举>世混浊而我独清，众人皆醉而我独醒，是以见放。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 全世界混浊却只有我一人清白，大家都醉了却只有我一人清醒，（我）因此被放逐。
          - ancient: "大喜，笼归，<举>家庆贺，虽连城拱璧不啻（chi4，止）也。（《促织》）"
            url: xxxx
            vernacular: 成名特别高兴，用笼子装上提回家，全家庆贺，把它看得比价值连城的宝玉还珍贵
          - ancient: "愿<举>国为内臣，比诸侯之列。（《荆轲刺秦王》）"
            url: xxxx
            vernacular: 愿意全国上下都做秦国的臣民，排在诸侯的行列里
          - ancient: 且<举>世誉之而不加劝，<举>世非之而不加沮。（《逍遥游》）
            url: xxxx
            vernacular: 宋荣子是那种世上的人们都赞誉他也不会让他感到鼓舞，世上所有的人都诽谤他，他也并不因此就感到沮丧
          - ancient: "【高考题例】弘微少孤，事兄如父，兄弟友穆之至，<举>世莫及也。《宋书•谢弘微传》）"
            url: xxxx
            vernacular: 谢弘微从小失去父母，事奉兄长如同事奉父亲，兄弟之间非常友爱和睦，当代没有人能够赶得上。
      - trans: ❷尽;完。
        sentences:
          - ancient: 杀人如不能<举>，刑人如恐不胜。（《史记•项羽本纪》）
            url: xxxx
            vernacular: 杀人只担心不能杀完，对人用刑只担心不能用尽
  - word: 举
    type: 【副词】
    phonetic: ju3
    tags:
      - 高中
    samples:
      - trans: 全；皆。
        sentences:
          - ancient: 君<举>不信群臣乎？（《左传•哀公六年》）
            url: xxxx
            vernacular: xxxx
          - ancient: 王如用予，则岂徒齐民安？天下之民<举>安。（《孟子•公孙丑下》）
            url: xxxx
            vernacular: 齐王如果使用我，我怎么会只是让齐国的人民能安居乐业？全天下的人民都可以安居乐业了。
