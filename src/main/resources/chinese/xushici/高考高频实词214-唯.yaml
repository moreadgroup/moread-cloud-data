---
words:
  - word: 唯
    type: 【动词】
    phonetic: wei4
    tags:
      - 高中
    samples:
      - trans: 通""惟"。思考；考虑。
        sentences:
          - ancient: 自<唯>虚薄，为四海英雄共推盟主。（《资治通鉴•隋纪八》）.
            url: xxxx
            vernacular: 我知道自己才浅力薄，被四海英雄共同推举担任盟主。
  - word: 唯
    type: 【副词】
    phonetic: wei4
    tags:
      - 高中
    samples:
      - trans: 只;仅。
        sentences:
          - ancient: 鸡鸣而驾，塞井夷（铲平）灶，<唯>余马首是瞻。（《左传•襄公十四年》）
            url: xxxx
            vernacular: 明天早晨，鸡一叫就开始驾马套车出发。各军都要填平水井，拆掉炉灶。作战的时候，全军将土都要看我的马头来定行动的方向。
          - ancient: 芳与泽其杂糅兮，<唯>昭质其犹未亏。（《离骚》）
            url: xxxx
            vernacular: 虽然芳洁污垢混杂一起，只有纯洁品质不会腐朽。
          - ancient: 东船西舫悄无言，<唯>见江心秋月白。（《琵琶行》）
            url: xxxx
            vernacular: 东面和西面的画舫和游船都静悄悄的，只看见江心之中映着的秋月泛着白光。
  - word: 唯
    type: 【连词】
    phonetic: wei4
    tags:
      - 高中
    samples:
      - trans: ❶表示让步。相当于"虽然"。
        sentences:
          - ancient: <唯>信（韩信自称）亦以为大王弗如也。（《汉书•韩信传》）
            url: xxxx
            vernacular: 我韩信也认为大王您比不上（项羽）
          - ancient: 近吿之史也，言<唯>详备，事罕甄择（鉴别）。（《史通•疑古》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷表示动作行为的起因。相当于"因为""由于"。
        sentences:
          - ancient: <唯>不信，故质其子。（《左传•昭公二十年》）
            url: xxxx
            vernacular: xxxx
  - word: 唯
    type: 【助词】
    phonetic: wei4
    tags:
      - 高中
    samples:
      - trans: ❶用在句首，表示确定的语气。
        sentences:
          - ancient: 君处北海，寡人处南海，<唯>是风马牛不相及也。（《左传•僖公四年》）
            url: xxxx
            vernacular: 你住北海，寡人我住在南海，这真是风马牛不相及啊。
      - trans: ❷用在句首，表示希望的语气。可译为"希望""请"等。
        sentences:
          - ancient: "<唯>君图之，寡君闻命矣！（《左传•昭公十三年》）"
            url: xxxx
            vernacular: 请君王考虑一下。寡君听到命令了。
          - ancient: 愚臣亡识，<唯>陛下财（通"裁"）察。（《汉书•晁错传》）
            url: xxxx
            vernacular: xxxx
          - ancient: "阙秦以利晋，<唯>君图之（《烛之武退秦师》）"
            url: xxxx
            vernacular: 削弱秦国对晋国有利，希望您考虑这件事！
          - ancient: <唯>大王命之。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 唯大王命之：意思是一切听大王的吩咐。唯，希望的意思。
          - ancient: <唯>大王与群臣孰计议之。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 只希望大王和各位大臣从长计议此事！
