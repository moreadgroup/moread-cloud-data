      - trans: ❶认错;道歉。
        sentences:
          - ancient: 秦王恐其破璧，乃辞谢，固（坚决）请，召有司案图,指从此以往十五都予赵。（《廉颇蔺相如列传》）
          - ancient: 沛公（指刘邦）旦曰（明曰）从百余骑来见项王，至鸿门，谢曰……（《鸿门宴》）
          - ancient: 至陛下，秦武阳色变振恐，群臣怪之，荆轲顾（回头看）笑武阳，前为谢曰……（《荆轲刺秦王》）
      - trans: ❷推辞;谢绝。
        sentences:
          - ancient: 郡数以礼请，谢不肯应。（《后汉书•鲁恭传》）
          - ancient: 阿母谢媒人："女子先有誓，老姥（mu3，老妇）岂敢言！"（《孔雀
          - ancient: 【高考题例】鲁人或日："夫鲁小国，而有战胜之名，则诸侯图（谋取）鲁矣。且鲁卫兄弟之国也，而君用起,则是弃卫。"鲁君疑之，谢吴起。（《史记•孙子吴起列传》）	：
      - trans: ❸辞别;离开。
        sentences:
