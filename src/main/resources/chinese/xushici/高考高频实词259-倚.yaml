---
words:
  - word: 倚
    type: 【名词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: 通"椅"。椅子。
        sentences:
          - ancient: 黄筠<倚>子十二只，倚遍琉璃背满霜。（宋•杨万里《暑中早起东斋独坐》）

  - word: 倚
    type: 【动词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: ❶靠着;斜靠着。
        sentences:
          - ancient: 挟清漳之通浦兮，倚曲沮（ju1，古水名）之长洲。（汉•王粲《登楼赋》）
          - ancient: 连峰去天不盈尺，枯松倒挂倚绝壁。（《蜀道难》）
          - ancient: 相如因持璧却立，倚柱，怒发上冲冠。（《廉颇蔺相如列传》）
      - trans: ❷依仗;依靠。
        sentences:
          - ancient: （董）卓有威名，方倚以西行。（《后汉书•董卓传》）
      - trans: ❸随着;配合。
        sentences:
          - ancient: 客有吹洞箫者，倚歌而和之。（《赤壁赋》）
      - trans: ❹依存。
        sentences:
          - ancient: 衡常思图身之事，以为吉凶倚伏，幽微难明，乃作《思玄赋》以宣寄情志。（《张衡传》）

  - word: 倚
    type: 【形容词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: ❶倾斜。
        sentences:
          - ancient: 宫殿垣屋倾倚。（《后汉书•杨震传》）
      - trans: ❷偏斜;偏颇。
        sentences:
          - ancient: 中立而不倚，强哉矫。（《礼记•中庸》）

  - word: 倚
    type: 【介词】
    phonetic: yi3
    tags:
      - 高中
    samples:
      - trans: 沿着。
        sentences:
          - ancient: 倚沼畦瀛（池泽）兮遥望博（平广）。（战国楚•屈原《招魂》）