倚yi3
【名词】通"椅"。椅子。
【例句】黄筠倚子十二只，倚遍琉璃背满霜。（宋•杨万里《暑中早起东斋独坐》）

【动词】❶靠着;斜靠着。
【例句】挟清漳之通浦兮，倚曲沮（ju1，古水名）之长洲。（汉•王粲《登楼赋》）丨连峰去天不盈尺，枯松倒挂倚绝壁。（《蜀道难》）丨相如因持璧却立，倚柱，怒发上冲冠。（《廉颇蔺相如列传》）
❷依仗;依靠。
【例句】（董）卓有威名，方倚以西行。（《后汉书•董卓传》）
❸随着;配合。
【例句】客有吹洞箫者，倚歌而和之。（《赤壁赋》）
❹依存。
【例句】衡常思图身之事，以为吉凶倚伏，幽微难明，乃作《思玄赋》以宣寄情志。（《张衡传》）

【形容词】❶倾斜。
【例句】宫殿垣屋倾倚。（《后汉书•杨震传》）
❷偏斜;偏颇。
【例句】中立而不倚，强哉矫。（《礼记•中庸》）
【介词】沿着。
【例句】倚沼畦瀛（池泽）兮遥望博（平广）。（战国楚•屈原《招魂》）