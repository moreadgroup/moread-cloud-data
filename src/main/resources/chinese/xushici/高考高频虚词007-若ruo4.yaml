---
words:
  - word: 若
    type: 【名词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: 传说中的海神名。
        sentences:
          - ancient: 于是焉河伯始旋其面目，望洋向若而叹曰……（《庄子•秋水》）
 
  - word: 若
    type: 【动词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: ❶如同;像。
        sentences:
          - ancient: 海内存知己，天涯若比邻。（《送杜少府之任蜀州》）
          - ancient: 彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。（《师说》）
      - trans: ❷选择。
        sentences:
          - ancient: 夫晋国之乱，吾谁使先，若夫二公子而立之，以为朝夕之急。（《国语•晋语二》）
      - trans: ❸及；比得上。
        sentences:
          - ancient: 汝心之固，固不可彻，曾不若孀妻弱子。（《愚公移山》）
          - ancient: 蔺相如固止之，曰："公之视廉将军孰与秦王？"曰:"不若也。"（《廉颇蔺相如列传》）
      - trans: ❹顺从。
        sentences:
          - ancient: 天子是若，明命使赋。（《诗经•大雅•烝民》）
  - word: 若
    type: 【代词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: ❶你;你们。
        sentences:
          - ancient: 若入前为寿，寿毕，请以剑舞，因击沛公（指刘邦）于坐，杀之。（《鸿门宴》）
          - ancient: 若知我不降明，欲令两国相攻，匈奴之祸，从我始矣。（《苏武传》）
          - ancient: 力拔山兮气盖世！时不利兮唯不逝！雅不逝兮可奈何！虞兮虞兮奈若何！（《项羽之死》）
          - ancient: 更若役，复若赋，则何如？（《捕蛇者说》）
          - ancient: 【高考题例】城破，吾夫必死，吾义不独存，然不可使花氏无后，若等善抚之。（《明史•花云传》）
      - trans: ❷指示代词。如此;这样。
        sentences:
          - ancient: 以若所为，求若所欲，犹缘木而求鱼也。（《齐桓晋文之事》）
          - ancient: 君既若见录（记着我），不久望君来。（《孔雀东南飞》）
  - word: 若
    type: 【连词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: ❶表示假设。如果。
        sentences:
          - ancient: 王若隐（怜恤）其无罪而就死地，则牛羊何择焉?（《孟子•梁惠王上》）
          - ancient: 两情若是久长时，又岂在朝朝暮暮。（《鹊桥仙》）
          - ancient: 国危矣，若使烛之武见秦君，师必退。（《烛之武退秦师》）
          - ancient: 【高考题例】愚人村野无所知，若以叛逆蔽罪，恐辜好生之德。《宋史•范纯礼传》）
      - trans: ❷表示选择。或者。
        sentences:
          - ancient: 时有军役，若遭水旱，民不困乏。（《汉书•食货志上》）
      - trans: ❸表示并列。与;和。
        sentences:
          - ancient: 旅王若公。（《尚书•召诰》）
          - ancient: 茕茕（qiong2，孤单的样子）老若幼，负戴行路旁。（清•姚燮《南辕杂诗》）
      - trans: ❹表示他转。至于。
        sentences:
          - ancient: 若臣，则不可以入矣。（《左传•哀公十四年》）
          - ancient: 若其他背理而伤道者，难遍以疏举。（汉•贾谊《陈政事疏》）
          - ancient: 若夫乘天地之正，而御六气之辩，以游无穷者，彼且恶乎待哉？（《逍遥游》）
          - ancient: 若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空。（《岳阳楼记》）
          - ancient: 至若春和景明，波澜不惊，上下天光，一碧万顷。（《岳阳楼记》）
      - trans: ❺表示承接。而。
        sentences:
          - ancient: 君子夬夬独行，遇雨若濡。（《周易•夬卦》）
  - word: 若
    type: 【副词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: 乃;才。
        sentences:
          - ancient: 爱以身为天下者，若可以托天下。（《老子》十三章）
          - ancient: 必有忍也，若能有济也。（《国语•周语上》）
  - word: 若
    type: 【助词】
    phonetic: ruo4
    tags:
      - 高中
    samples:
      - trans: 用在形容词后。……的样子。
        sentences:
          - ancient: 桑之未落，其叶沃若。（《诗经•卫风•氓》）
