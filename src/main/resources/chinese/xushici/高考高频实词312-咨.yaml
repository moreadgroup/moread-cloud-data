咨zi1
【动词】❶商议;咨询。
【例句】愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。（《出师表》）
【高考题例】公亮明练文法，更践久，习知朝廷台阁典宪，首相韩琦每咨访焉。（《宋史•曾公亮传》）
❷叹息。
【例句】文王流涕而咨之。（《吕氏春秋•行论》）丨蜀道之难，难于上青天，侧身西望长咨嗟！（《蜀道难》）
【高考题例】元兴元年，病卒。百姓市道莫不咨嗟。（《后汉"书•王涣传》）

【叹词】表示赞赏。
【例句】帝曰："咨，四岳!"（《尚书.尧典》）

