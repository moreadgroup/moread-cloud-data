words:
  - word: 咨
    type: 【动词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: ❶商议;咨询。
        sentences:
          - ancient: 愚以为营中之事，悉以<咨>之，必能使行阵和睦，优劣得所。（《出师表》）
            url: xxxx
            vernacular: 我认为军队中的事情，都拿来跟他商讨，就一定能使军队团结一心，不同才能的人各得其所。
          - ancient: 【高考题例】公亮明练文法，更践久，习知朝廷台阁典宪，首相韩琦每<咨>访焉。（《宋史•曾公亮传》）
            url: xxxx
            vernacular: 曾公亮明练文法，任职以后，熟悉懂得了朝廷台阁的规章，首相韩琦经常咨询访问他。
      - trans: ❷叹息。
        sentences:
          - ancient: 文王流涕而<咨>之。（《吕氏春秋•行论》）
            url: xxxx
            vernacular: xxxx
          - ancient: 蜀道之难，难于上青天，侧身西望长<咨>嗟！（《蜀道难》）
            url: xxxx
            vernacular: 蜀道难以攀越呵简直难于上青天，侧身西望令人不免感慨与长叹！
          - ancient: 【高考题例】元兴元年，病卒。百姓市道莫不<咨>嗟。（《后汉"书•王涣传》）
            url: xxxx
            vernacular: 元兴元年，王涣病死。百姓在市中和路上没有不叹息的。
  - word: 咨
    type: 【叹词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: 表示赞赏。
        sentences:
          - ancient: 帝曰："<咨>，四岳，汤汤洪水方割，荡荡怀山襄陵，浩浩滔天。下民其咨，有能俾乂?"（《尚书.尧典》）
            url: xxxx
            vernacular: 啊!四方诸侯之长!滔滔的洪水普遍危害人们，水势奔腾包围了山岭，淹没了丘陵，浩浩荡荡，弥漫接天。臣民百姓都在叹息，有能使洪水得到治理的吗?
