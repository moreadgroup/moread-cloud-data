---
words:
  - word: 咨
    type: 【动词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: ❶商议;咨询。
        sentences:
          - ancient: 愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。（《出师表》）
          - ancient: 【高考题例】公亮明练文法，更践久，习知朝廷台阁典宪，首相韩琦每咨访焉。（《宋史•曾公亮传》）
      - trans: ❷叹息。
        sentences:
          - ancient: 文王流涕而咨之。（《吕氏春秋•行论》）
          - ancient: 蜀道之难，难于上青天，侧身西望长咨嗟！（《蜀道难》）
          - ancient: 【高考题例】元兴元年，病卒。百姓市道莫不咨嗟。（《后汉"书•王涣传》）

  - word: 咨
    type: 【叹词】
    phonetic: zi1
    tags:
      - 高中
    samples:
      - trans: 表示赞赏。
        sentences:
          - ancient: 帝曰："咨，四岳!"（《尚书.尧典》）

