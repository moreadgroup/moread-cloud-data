---
words:
  - word: 婴
    type: 【名词】
    phonetic: ying1
    tags:
      - 高中
    samples:
      - trans: 初生的小孩儿。
        sentences:
          - ancient: 见人方引（牵，拉）婴儿而欲投之江中。（《吕氏春秋•察今》）

  - word: 婴
    type: 【动词】
    phonetic: ying1
    tags:
      - 高中
    samples:
      - trans: ❶系在颈上。
        sentences:
          - ancient: 辟之是犹使处女婴宝珠，佩宝玉。（《荀子•富国》）
          - ancient: 其次剔毛发、婴金铁受辱。（《报任安书》）
      - trans: ❷通"撄"。触犯;碰。
        sentences:
          - ancient: 教诲之，调一之，则兵劲城固，敌国不敢婴也。（《荀子•强国》）
      - trans: ❸环绕;缠绕。
        sentences:
          - ancient: 世网婴我身。（晋•陆机《赴洛中道作》）
          - ancient: 而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）