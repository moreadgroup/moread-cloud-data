---
words:
  - word: 婴
    type: 【名词】
    phonetic: ying1
    tags:
      - 高中
    samples:
      - trans: 初生的小孩儿。
        sentences:
          - ancient: 有过于江上者，见人方引（牵，拉）<婴>儿而欲投之江中。（《吕氏春秋•察今》）
            url: xxxx
            vernacular: 有个从江边上走过的人，刚好看见一个人正在拉着一个小孩儿，要把他投扔到江水里去。
  - word: 婴
    type: 【动词】
    phonetic: ying1
    tags:
      - 高中
    samples:
      - trans: ❶系在颈上。
        sentences:
          - ancient: 辟之是犹使处女<婴>宝珠，佩宝玉。（《荀子•富国》）
            url: xxxx
            vernacular: xxxx
          - ancient: 其次剔毛发、<婴>金铁受辱。（《报任安书》）
            url: xxxx
            vernacular: 再次是被剃光头发、颈戴枷锁而受辱。
      - trans: ❷通"撄"。触犯;碰。
        sentences:
          - ancient: 教诲之，调一之，则兵劲城固，敌国不敢<婴>也。（《荀子•强国》）
            url: xxxx
            vernacular: 实行教诲，协调统一，就会兵力强大、城防坚固，敌国就不敢来侵犯了。
      - trans: ❸环绕;缠绕。
        sentences:
          - ancient: 借问子何之,世网<婴>我身。（晋•陆机《赴洛中道作》）
            url: xxxx
            vernacular: 若问我要往何处去?世事如网束缚着我。
          - ancient: 而刘夙<婴>疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）
            url: xxxx
            vernacular: 但祖母刘氏又早被疾病缠绕，常年卧床不起，我侍奉她吃饭喝药，从来就没有离开她。
