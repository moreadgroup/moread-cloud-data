婴ying1
【名词】初生的小孩儿。
【例句】见人方引（牵，拉）婴儿而欲投之江中。（《吕氏春秋•察今》）

【动词】〕❶系在颈上。
【例句】辟之是犹使处女婴宝珠，佩宝玉。（《荀子•富国》）丨其次剔毛发、婴金铁受辱。（《报任安书》）
❷通"撄"。触犯;碰。
【例句】教诲之，调一之，则兵劲城固，敌国不敢婴也。（《荀子•强国》）
❸环绕;缠绕。
【例句】世网婴我身。（晋•陆机《赴洛中道作》）丨而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。（《陈情表》）