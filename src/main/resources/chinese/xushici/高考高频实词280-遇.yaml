---
words:
  - word: 遇
    type: 【名词】
    phonetic: yu4
    tags:
      - 高中
    samples:
      - trans: ❶待遇。
        sentences:
          - ancient: 然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊<遇>，欲报之于陛下也。（《出师表》）
            url: xxxx
            vernacular: 不过宫廷里侍从护卫的官员不懈怠，战场上忠诚有志的将士们奋不顾身，大概是他们追念先帝对他们的特别的知遇之恩（作战的原因），想要报答在陛下您身上。
      - trans: ❷机会;际遇。
        sentences:
          - ancient: 而五人亦得以加其土封（指坟墓），列其姓名于大堤之上，凡四方之士无有不过而拜且泣者，斯固百世之<遇>（百代难得的际遇）也。（《五人墓碑记》）
            url: xxxx
            vernacular: 而这五个人也能够修建一座大坟墓，在大堤之上立碑刻名，所有四方的有志之士经过这里没有不跪拜流泪的，这实在是百代难得的际遇啊。
  - word: 遇
    type: 【动词】
    phonetic: yu4
    tags:
      - 高中
    samples:
      - trans: ❶相逢。
        sentences:
          - ancient: 进，与（曹）操<遇>于赤壁。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: xxxx
          - ancient: "当其欣于所<遇>，暂得于己，快然自足,不知老之将至。（《兰亭集序》）"
            url: xxxx
            vernacular: 但当他们对所接触的事物感到高兴时，一时感到自得，感到高兴和满足，竟然不知道衰老将要到来。
          - ancient: 杨意不逢，抚凌云而自惜;钟期既<遇>，奏流水以何惭？（《滕王阁序》）
            url: xxxx
            vernacular: 假如碰不上杨得意那样引荐的人，就只有抚拍着自己的文章而自我叹惜。既然已经遇到了钟子期，就弹奏一曲《流水》又有什么羞愧呢？
      - trans: ❷遭遇;遇到。
        sentences:
          - ancient: 公等<遇>雨，皆已失期，失期当斩。（《陈涉世家》）
            url: xxxx
            vernacular: 你们诸位遇上大雨，都已误了期限，误期是要杀头的。
          - ancient: "或<遇>其叱咄，色愈恭,礼愈至，不敢出一言以复;俟其欣悦，则又请焉。（《送东阳马生序》）"
            url: xxxx
            vernacular: 有时遭到他的训斥，表情更为恭敬，礼貌更为周到，不敢答复一句话；等到他高兴了，则又去请教。
          - ancient: 仆以口语<遇>遭此祸，重为乡党所笑，以污辱先人，亦何面目复上父母之丘墓乎？（《报任安书》）
            url: xxxx
            vernacular: 我因为多嘴说了几句话而遭遇这场大祸，更被乡里之人、朋友羞辱和嘲笑，污辱了祖宗，又有什么颜面再到父母的坟墓上去祭扫呢？
      - trans: ❸会见;见面。
        sentences:
          - ancient: 王行，度（估计）道里会<遇>之礼毕，还，不过三十日。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 大王此行，估计路程和会谈结束，再加上返回的时间，不会超过三十天。
      - trans: ❹接触;感触。
        sentences:
          - ancient: 方今之时，臣以神<遇>而不以目视，官（感觉器官）知止而神欲行。（《庄子•养生主》）
            url: xxxx
            vernacular: 现在，我凭精神和牛接触，而不用眼睛去看，感官停止了而精神在活动。
      - trans: ❺对待;招待。
        sentences:
          - ancient: 秦之<遇>将军，可谓深矣。父母宗族，皆为戮没。（《荆轲刺秦王》）
            url: xxxx
            vernacular: 秦对你樊於期，可以说是刻毒透顶了。父亲、母亲和同族的人都被杀死或没收入宫为奴。
          - ancient: 今人有大功而击之，不义也。不如因善<遇>之。（《鸿门宴》）
            url: xxxx
            vernacular: 现在人家有了大功，却要攻打他，这是不讲信义。不如趁此好好对待他。
          - ancient: 不如因而厚<遇>之，使归赵。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 不如趁此好好款待他，放他回到赵国
      - trans: ❻遇合;得到君主的赏识、信任。
        sentences:
          - ancient: 垂老<遇>君未恨晚，似君须向古人求。（唐•杜甫《相从歌赠严二别驾》）
            url: xxxx
            vernacular: xxxx
