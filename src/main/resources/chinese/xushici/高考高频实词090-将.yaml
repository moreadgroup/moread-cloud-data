---
words:
  - word: 将
    type: 【动词】
    phonetic: jiang1
    tags:
      - 高中
    samples:
      - trans: ❶扶持;搀扶。
        sentences:
          - ancient: 即<将>女出帷中，来至前。（汉•褚少孙《西门豹治邺》）
            url: xxxx
            vernacular: 即将女子从帷帐中带出，来到前面。
          - ancient: 爷娘闻女来，出郭相扶<将>。（《木兰诗》）
            url: 爹娘听说女儿要归来，互相搀扶迎接在村边道上。
            vernacular: 父母听说女儿回来了，就出城来扶着她。
          - ancient: "勤心养公姥,好自相扶<将>。（《孔雀东南飞》）"
            url: xxxx
            vernacular: 望你尽心养婆母，相互保重度时光。
      - trans: ❷持;拿。
        sentences:
          - ancient: 五花马、千金裘，呼儿<将>出换美酒，与尔同销万古愁。（《将进酒》）
            url: xxxx
            vernacular: 管它名贵五花马还是狐皮裘，快叫侍儿拿去统统来换美酒，与你同饮来消融这万古长愁。
          - ancient: <将>来的酒共食，尝着似土和泥。（《长亭送别》）
            url: xxxx
            vernacular: 拿来的酒和食，吃着就象土和泥。
      - trans: ❸奉养;调养。
        sentences:
          - ancient: 王事靡盬，不遑<将>父。（《诗经•小雅•四牡》）
            url: xxxx
            vernacular: 但君王的差使还没有完成，我顾不上把老父亲来奉养。
          - ancient: "口必甘味，和精端容,<将>之以神气。（《吕氏春秋•尽数》）"
            url: xxxx
            vernacular: 一定要吃可口的食物，进食的时候，要精神和谐，仪容端正，用精气将养，这样，周身就舒适愉快，都受到了精气的滋养。
          - ancient: 乍暖还寒时候，最难<将>息。（《声声慢•寻寻觅觅》）
            url: xxxx
            vernacular: 秋天总是忽然变暖,又转寒冷,最难保养休息。
      - trans: ❹带领;携带。
        sentences:
          - ancient: 有仙人数人，<将>我上天，离月数里而止。（《论衡•道虚》）
            url: xxxx
            vernacular: 有几个仙人把我送上了天，到离月亮几里远就停下来。
          - ancient: 居数月，其马<将>胡骏马而归。（《塞翁失马》）
            url: xxxx
            vernacular: 过了几个月，那匹马带着胡人的良马回来了。
      - trans: ❺行进;进步。
        sentences:
          - ancient: 日就月<将>，学有缉熙于光明。（《诗经•周颂•敬之》）
            url: xxxx
            vernacular: 日日有所收获，月月有所进步，这样不断地学习，日积月累就能达到光明的境界。
      - trans: ❻跟随;随从。
        sentences:
          - ancient: 生女有所归（女子出嫁），鸡狗亦得<将>。（唐•杜甫《新婚别》）
            url: xxxx
            vernacular: 有道是“嫁鸡随鸡，嫁狗随狗”，如今我嫁到你家，爹妈盼的是平平安安！
          - ancient: 语曰"<将>顺其美，匡救其恶，故上下能相亲也"。（《史记•管仲列传》）
            url: xxxx
            vernacular: 古语说：“要顺势助成君子的美德，纠正挽救他的过错，所以君臣百姓之间能亲密无间。”
  - word: 将
    type: 【副词】
    phonetic: jiang1
    tags:
      - 高中
    samples:
      - trans: 将要;就要。
        sentences:
          - ancient: 公输盘为楚造云梯之械，成，<将>以攻宋。（《公输》）
            url: xxxx
            vernacular: 公输盘替楚国造云梯这类攻城的器械，造成后，将要用它来攻打宋国。
          - ancient: 当其欣于所遇，暂得于己，快然自足，不知老之<将>至。（《兰导集序》）
            url: xxxx
            vernacular: 但当他们对所接触的事物感到高兴时，一时感到自得，感到高兴和满足，竟然不知道衰老将要到来。
  - word: 将
    type: 【连词】
    phonetic: jiang1
    tags:
      - 高中
    samples:
      - trans: ❶假如;如果。表示假设。
        sentences:
          - ancient: 今而后吾<将>再病，教从何处呼汝耶？（《祭妹文》）
            url: xxxx
            vernacular: 从今以后我要是再病了，教我从哪里去喊你呢！
      - trans: ❷用在动词、形容词之间，表示并列。相当于"且""又"
        sentences:
          - ancient: 其存其没，家莫闻知。人或有言，<将>信<将>疑。（唐•李华《吊古战场文》）
            url: xxxx
            vernacular: 他们的生死存亡，家中无从知道；即使听到有人传讯，也是疑信参半。
      - trans: ❸表示选择。相当于"抑或""还是"。
        sentences:
          - ancient: 秦欤汉欤？<将>近代欤？（唐•李华《吊古战场文》）
            url: xxxx
            vernacular: 这是秦朝、汉朝，还是近代的事情呢？
      - trans: ❹用在名词之间，表示并列。相当于"和""与"。
        sentences:
          - ancient: "暂伴月<将>影,行乐须及春。（《月下独酌》）"
            url: xxxx
            vernacular: 暂且以明月影子为伴，抓紧美好的春光及时行乐。
  - word: 将
    type: 【名词】
    phonetic: jiang4
    tags:
      - 高中
    samples:
      - trans: 将领;将帅。
        sentences:
          - ancient: 廉颇者，赵之良<将>也。（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 廉颇赵国优秀的将领。
          - ancient: 项燕为楚<将>，数有功，爱士卒，楚人怜之。（《陈涉世家》）
            url: xxxx
            vernacular: 项燕是楚国的将领，曾多次立下战功，又爱护士兵，楚国人都很爱戴他。
  - word: 将
    type: 【动词】
    phonetic: jiang4
    tags:
      - 高中
    samples:
      - trans: ❶使为将军。
        sentences:
          - ancient: 齐威王欲<将>孙膑。（《史记•孙子吴起列传》）
            url: xxxx
            vernacular: 齐威王打算任用孙膑为主将
      - trans: ❷率领;统率。
        sentences:
          - ancient: 率疲弊之卒，<将>数百之众，转而攻秦。（《过秦论》）
            url: xxxx
            vernacular: 率领着疲惫无力的士兵，指挥着几百人的队伍，掉转头来进攻秦国
          - ancient: 扶苏以数谏故，上使外<将>兵。（《陈涉世家》）
            url: xxxx
            vernacular: 扶苏因为屡次劝谏的缘故，皇上派（他）在外面带兵。
          - ancient: "今以实校之,彼所<将>中国人（中原地区的人）不过十五六万，且已久疲。（《资治通鉴•汉纪五十七》）"
            url: xxxx
            vernacular: 现在按照实际情况对核他(的数字)，他所率领的中原军队不过十五六万，而且早已疲劳。
          - ancient: 【高考题例】居五年，秦人富强。孝公使卫鞅<将>而伐魏。（《史记•商君列传》）
            url: xxxx
            vernacular: 过了五年，秦国富强，秦孝公派遣卫鞅领兵攻伐魏国。
  - word: 将
    type: 【动词】
    phonetic: qiang1
    tags:
      - 高中
    samples:
      - trans: 请;愿。
        sentences:
          - ancient: <将>子无怒，秋以为期。（《诗经•卫风•氓》）
            url: xxxx
            vernacular: 请郎君不要生气，秋天到了来迎娶。
          - ancient: 岑夫子，丹丘生，<将>进酒，杯莫停。（《将进酒》）
            url: xxxx
            vernacular: 岑夫子，丹丘生啊，请二位快点喝酒吧，举起酒杯不要停下来。
