---
words:
  - word: 将
    type: 【动词】
    phonetic: jiang1
    tags:
      - 高中
    samples:
      - trans: ❶扶持;搀扶。
        sentences:
          - ancient: 即将女出帷中，来至前。（汉•褚少孙《西门豹治邺》）
          - ancient: 爷娘闻女来，出郭相扶将。（《木兰诗》）
          - ancient: 勤心养公姥,好自相扶将。（《孔雀东南飞》）
      - trans: ❷持;拿。
        sentences:
          - ancient: 五花马、千金裘，呼儿<将>出换美酒，与尔同销万古愁。（《将进酒》）
          - ancient: 将来的酒共食，尝着似土和泥。（《长亭送别》）
      - trans:  ❸奉养;调养。
        sentences:
          - ancient: 王事靡盬，不遑将父。（《诗经•小雅•四牡》）
          - ancient: 口必甘味，和精端容,将之以神气。（《吕氏春秋•尽数》）
          - ancient: 乍暖还寒时候，最难将息。（《声声慢•寻寻觅觅》）
      - trans:  ❹带领;携带。
        sentences:
          - ancient: 有仙人数人，将我上天，离月数里而止。（《论衡•道虚》）
          - ancient: 居数月，其马将胡骏马而归。（《塞翁失马》）
      - trans:  ❺行进;进步。
        sentences:
          - ancient: 日就月将，学有缉熙于光明。（《诗经•周颂•敬之》）
      - trans:  ❻跟随;随从。
        sentences:
          - ancient: 生女有所归（女子出嫁），鸡狗亦得将。（唐•杜甫《新婚别》）
          - ancient: 语曰"转顺其美，匡救其恶，故上下能相亲也"。（《史记•管仲列传》）
  - word: 将
    type: 【副词】
    phonetic: jiang1
    tags:
      - 高中
    samples:  
      - trans: 将要;就要。
        sentences:
          - ancient:  公输盘为楚造云梯之械，成，将以攻宋。（《公输》）
          - ancient: 当其欣于所遇，暂得于己，快然自足，不知老之将至。（《兰导集序》）
  - word: 将
    type: 【连词】
    phonetic: jiang1
    tags:
      - 高中
    samples:  
      - trans: ❶假如;如果。表示假设。
        sentences:
          - ancient: 今而后吾将再病，教从何处呼汝耶？（《祭妹文》）
      - trans: ❷用在动词、形容词之间，表示并列。相当于"且""又"
        sentences:
          - ancient: 其存其没，家莫闻知。人或有言，<将>信<将>疑。（唐•李华《吊古战场文》）
      - trans: ❸表示选择。相当于"抑或""还是"。
        sentences:
          - ancient: 秦欤汉欤？将近代欤？（唐•李华《吊古战场文》）
      - trans: ❹用在名词之间，表示并列。相当于"和""与"。
        sentences:
          - ancient: 暂伴月将影,行乐须及春。（《月下独酌》）
  - word: 将
    type: 【名词】
    phonetic: jiang4
    tags:
      - 高中
    samples:  
      - trans:  将领;将帅。
        sentences:
          - ancient:  廉颇者，赵之良将也。（《廉颇蔺相如列传》）
          - ancient: 项燕为楚将，数有功，爱士卒，楚人怜之。（《陈涉世家》）
  - word: 将
    type: 【动词】
    phonetic: jiang4
    tags:
      - 高中
    samples:  
      - trans: ❶使为将军。
        sentences:
          - ancient:  齐威王欲将孙膑。（《史记•孙子吴起列传》）
      - trans: ❷率领;统率。
        sentences:
          - ancient:  率疲弊之卒，将数百之众，转而攻秦。（《过秦论》）
          - ancient: 扶苏以数谏故，上使外将兵。（《陈涉世家》）
          - ancient: 今以实校之,彼所将中国人（中原地区的人）不过十五六万，且已久疲。（《资治通鉴•汉纪五十七》）
          - ancient:  【高考题例】居五年，秦人富强。孝公使卫鞅将而伐魏。（《史记•商君列传》）
  - word: 将
    type: 【动词】
    phonetic: qiang1
    tags:
      - 高中
    samples: 
      - trans:  请;愿。
        sentences:
          - ancient:  将子无怒，秋以为期。（《诗经•卫风•氓》）
          - ancient: <将>进酒，杯莫停。（《将进酒》）