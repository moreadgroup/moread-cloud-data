宁©ning4
【副词】❶岂;难道。
【例句】且壮士不死即已，死即举大名耳，王侯将相宁有种乎！（《陈涉世家》）丨老当益壮，宁移白首之心？（《滕王阁序》）丨身直为闺阁之臣，宁得自引深藏于岩穴邪？（《报任安书》）
❷宁可;宁愿。
【例句】均之二策,宁许以负秦曲（理亏）。（《廉颇蔺相如列传》）丨宁信度，无自信也。（《韩非子•外储说左上》）丨宁赴湘流，葬于江鱼之腹中。（《渔父》）丨宁溘死以流亡兮，余不忍为此态也！（《离骚》）
❸竟;乃。
【例句】心之忧矣，宁莫之知。（《诗经•小雅•小弁》）

【助词】无实义。
【例句】宾至如归，无宁灾患。（《左传•襄公三十一年》）丨是寡大夫不得列于诸卿也，不宁唯是，又使围蒙其先君。（《左传•昭公元年》）

宁©ning2
【动词】❶探望父母。
【例句】家既迎兮当归宁。（《后汉书•董祀妻传》）丨吾妻归宁，述诸小妹语曰："闻姊家有阁子，且何谓阁子也?"（《项脊轩志》）
❷止息;安息。也指安葬。
【例句】故请母命而宁汝于斯，便祭扫也。（《祭妹文》）
❸平息;平定。
【例句】定白公之祸,宁楚国之事。（《战国策•楚策一》）
❹通"咛"。
【例句】兰芝初还时，府吏见丁宁（通"叮咛"），结誓不别离。
（《孔雀东南飞》）

【形容词】安定;安宁。
【例句】悍吏之来吾乡，叫嚣乎东西，隳突（横行）乎南北，哗然而骇者，虽鸡狗不得宁焉。（《捕蛇著说》）