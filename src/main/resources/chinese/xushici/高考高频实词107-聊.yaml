words:
  - word: 聊
    type: 【动词】
    phonetic: liao2
    tags:
      - 高中
    samples:
      - trans: ❶耳鸣。
        sentences:
          - ancient: 横舟航（连船组成的浮桥）而济湘兮，耳<聊>啾而戃慌（失意的样子）。（汉•刘向《九叹•远逝》）
            url: xxxx
            vernacular: 掉转船头把湘水渡过啊，我一阵阵耳鸣精神恍惚忧伤。
      - trans: ❷依靠;凭借。
        sentences:
          - ancient: 穷饿无<聊>，追购（悬赏追捕）又急，天高地迥，号呼靡及。（《〈指南录〉后序）
            url: xxxx
            vernacular: 困窘饥饿，无依无靠，元军悬赏追捕得又很紧急.天高地远，我的呼喊谁都听不到.
          - ancient: 其后二年，余久卧病无<聊>，乃使人复葺南阁子，其制稍异于前。（《项脊轩志》）
            url: xxxx
            vernacular: 又过了两年，我很长时间生病卧床没有什么（精神上的）寄托，就派人再次修缮南阁子，格局跟过去稍有不同。
  - word: 聊
    type: 【形容词】
    phonetic: liao2
    tags:
