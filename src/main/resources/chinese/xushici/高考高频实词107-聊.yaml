      - trans: 恐惧的样子。
        sentences:
          - ancient: 怳兮忽兮，<聊>兮慄兮，混汩汩兮。（汉•枚乘《七发》）
            url: xxxx
            vernacular: 又是那样汹涌澎湃啊，叫人心惊胆战，波浪滚滚滔滔啊，发出汩汩的喧声
  - word: 聊
    type: 【副词】
    phonetic: liao2
    tags:
      - 高中
    samples:
      - trans: 姑且;暂且。
        sentences:
          - ancient: 虞卿曰："王<聊>听臣，发使出重宝以附楚、魏，楚、魏……必入吾使。"（《战国策.赵策三》）
            url: xxxx
            vernacular: 大王姑且听从臣下的话，派使者拿出重要宝器去归附楚国、魏国。楚国、魏国想要得到大王的贵重宝物，一定让我国的使者进入他们的国家。
          - ancient: <聊>乘化以归尽，乐夫天命复奚疑！（《归去来兮辞》）
            url: xxxx
            vernacular: 抱定乐安天命的主意，还有什么可犹疑的呢！
