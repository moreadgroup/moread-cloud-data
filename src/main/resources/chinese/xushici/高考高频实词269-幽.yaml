---
words:
  - word: 幽
    type: 【名词】
    phonetic: you1
    tags:
      - 高中
    samples:
      - trans: ❶地下；阴间。
        sentences:
          - ancient: 嗟乎夫子，永安幽冥。（三国魏•曹植《王仲宣诔》）
      - trans: ❷古代州名。幽州。
        sentences:
          - ancient: 借问谁家子，幽并游侠儿。（三国魏•曹植《白马篇》）

  - word: 幽
    type: 【动词】
    phonetic: you1
    tags:
      - 高中
    samples:
      - trans: ❶监禁;拘押。
        sentences:
          - ancient: 深幽囹圄之中。（《报任安书》）
          - ancient: 乃幽武置大窖中，绝不饮食。（《苏武传》）
          - ancient: 所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世，而文釆不表于后也。（《报任安书》）
          - ancient: 吾幽囚受辱，鲍叔不以我为无耻，知我不羞小节而耻功名不显于天下也。（《史记•管仲列传》）
      - trans: ❷隐居。
        sentences:
          - ancient: 虽策命屡加，幽操不回。（《晋书•隐逸传》）

  - word: 幽
    type: 【形容词】
    phonetic: you1
    tags:
      - 高中
    samples:
      - trans: ❶深沉;幽深。
        sentences:
          - ancient: 故忧愁幽思而作《离骚》。（《史记•屈原贾生列传》）
          - ancient: 舞幽壑之潜蛟，泣孤舟之嫠li2妇。（《赤壁赋》）
      - trans: ❷昏暗;阴暗。
        sentences:
          - ancient: 下幽晦以多雨。（战国楚•屈原《涉江》）
          - ancient: 有志与力，而又不随以怠,至于幽暗昏惑而无物以相之，亦不能至也。（《游褒禅山记》）
      - trans: ❸幽静;幽雅。
        sentences:
          - ancient: 清江一曲抱村流，长夏江村事事幽。（唐•杜甫《江村》）
          - ancient: 蝉噪林逾静,鸟鸣山更幽。（唐•王籍《入若耶溪》）
      - trans: ❹隐晦;深奥。
        sentences:
          - ancient: 别有幽愁暗恨生，此时无声胜有声。（《琵琶行》）
          - ancient: 衡常思图身之事,以为吉凶倚伏，幽微难明，乃作《思玄赋》以宣寄情志。（《张衡传》）