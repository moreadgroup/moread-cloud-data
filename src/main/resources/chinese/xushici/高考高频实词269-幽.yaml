幽you1
【名词】❶地下；阴间。
.【例句】嗟乎夫子，永安幽冥。（三国魏•曹植《王仲宣诔》）
❷古代州名。幽州。
【例句】借问谁家子，幽并游侠儿。（三国魏•曹植《白马篇》）

【动词】❶监禁;拘押。
【例句】深幽囹圄之中。（《报任安书》）丨乃幽武置大窖中，绝不饮食。（《苏武传》）丨所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世，而文釆不表于后也。（《报任安书》）丨吾幽囚受辱，鲍叔不以我为无耻，知我不羞小节而耻功名不显于天下也。（《史记•管仲列传》）
❷隐居。
【例句】虽策命屡加，幽操不回。（《晋书•隐逸传》）

【形容词】❶深沉;幽深。
【例句】故忧愁幽思而作《离骚》。（《史记•屈原贾生列传》）丨舞幽壑之潜蛟，泣孤舟之嫠li2妇。（《赤壁赋》）
❷昏暗;阴暗。
【例句】下幽晦以多雨。（战国楚•屈原《涉江》）丨有志与力，而又不随以怠,至于幽暗昏惑而无物以相之，亦不能至也。（《游褒禅山记》）
❸幽静;幽雅。
【例句】清江一曲抱村流，长夏江村事事幽。（唐•杜甫《江村》）丨蝉噪林逾静,鸟鸣山更幽。（唐•王籍《入若耶溪》）
❹隐晦;深奥。
【例句】别有幽愁暗恨生，此时无声胜有声。（《琵琶行》）丨衡常思图身之事,以为吉凶倚伏，幽微难明，乃作《思玄赋》以宣寄情志。（《张衡传》）