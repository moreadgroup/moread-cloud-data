置zhi4
【名词】❶驿站。
【例句】夫良马固车，五十里而一置。（《韩非子•难势》）
❷驿马；驿车。
【例句】丞相长史乘疾置以闻。（《汉书•刘屈釐传》）
【动词】❶安放。
【例句】今以钟磬置水中，虽大风浪不能鸣也，而况石乎?（《石钟山记》）丨断头置城上，颜色（脸色）不少变。（《五人墓碑记》）丨苟入狱，不问罪之有无，必械手足，置老监。（《狱中杂记》）
❷放弃;丢下。
【例句】沛公则置车骑，脱身独骑。（《鸿门宴》）
【高考题例】时京师多盗贼，有通衢（四通八达、寛敞平坦的道路）杀人置沟中者。（《旧唐书•李揆传》）
❸摆;设。
【例句】公子于是乃置酒大会宾客。（《史记•魏公子列传》）丨将出，日与其徒置酒酣歌达曙。（《狱中杂记》）丨乃幽武置大窖中，绝不饮食。（《苏武传》）丨每移案，顾视无可置者。（《项脊轩志》）
❹设立;设置。
【例句】迨（等到）诸父异爨（cuan4,分家各起炉灶），内外多置小门墙，往往而是。（《项脊轩志》）
❺购置;添置。
【例句】郑人有且置履者。（《韩非子•外储说左上》）丨既至匈奴，置币遗（赠送）单于；单于益骄，非汉所望也。（《苏武传》）丨久之，单于使陵至海上，为武置酒设乐。（《苏武传》）
❻赦免。
【例句】斩首捕虏比（比照）三百石以上者皆杀之，无有所置。（《史记•吴王濞列传》）丨高帝曰："置之。"乃释通（指蒯通,韩信的谋士）之罪。（《史记•淮阴侯列传》）