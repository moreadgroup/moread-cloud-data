---
words:
  - word: 置
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶驿站。
        sentences:
          - ancient: 夫良马固车，五十里而一置。（《韩非子•难势》）
      - trans: ❷驿马；驿车。
        sentences:
          - ancient: 丞相长史乘疾置以闻。（《汉书•刘屈釐传》）

  - word: 置
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶安放。
        sentences:
          - ancient: 今以钟磬置水中，虽大风浪不能鸣也，而况石乎?（《石钟山记》）
          - ancient: 断头置城上，颜色（脸色）不少变。（《五人墓碑记》）
          - ancient: 苟入狱，不问罪之有无，必械手足，置老监。（《狱中杂记》）
      - trans: ❷放弃;丢下。
        sentences:
          - ancient: 沛公则置车骑，脱身独骑。（《鸿门宴》）
          - ancient: 【高考题例】时京师多盗贼，有通衢（四通八达、寛敞平坦的道路）杀人置沟中者。（《旧唐书•李揆传》）
      - trans: ❸摆;设。
        sentences:
          - ancient: 公子于是乃置酒大会宾客。（《史记•魏公子列传》）
          - ancient: 将出，日与其徒置酒酣歌达曙。（《狱中杂记》）
          - ancient: 乃幽武置大窖中，绝不饮食。（《苏武传》）
          - ancient: 每移案，顾视无可置者。（《项脊轩志》）
      - trans: ❹设立;设置。
        sentences:
          - ancient: 迨（等到）诸父异爨（cuan4,分家各起炉灶），内外多置小门墙，往往而是。（《项脊轩志》）
      - trans: ❺购置;添置。
        sentences:
          - ancient: 郑人有且置履者。（《韩非子•外储说左上》）
          - ancient: 既至匈奴，置币遗（赠送）单于；单于益骄，非汉所望也。（《苏武传》）
          - ancient: 久之，单于使陵至海上，为武置酒设乐。（《苏武传》）
      - trans: ❻赦免。
        sentences:
          - ancient: 斩首捕虏比（比照）三百石以上者皆杀之，无有所置。（《史记•吴王濞列传》）
          - ancient: 高帝曰："置之。"乃释通（指蒯通,韩信的谋士）之罪。（《史记•淮阴侯列传》）