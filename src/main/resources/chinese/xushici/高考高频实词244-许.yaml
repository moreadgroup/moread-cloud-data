---
words:
  - word: 许
    type: 【名词】
    phonetic: XU3
    tags:
      - 高中
    samples:
      - trans: 处所。
        sentences:
          - ancient: 先生不知何许人也。（《五柳先生传》）

  - word: 许
    type: 【动词】
    phonetic: XU3
    tags:
      - 高中
    samples:
      - trans: ❶答应;允许。
        sentences:
          - ancient: 将请罪于君，君不<许>;请罪于母，母不<许>。（《〈指南录〉后序》）
          - ancient: 秦王怒，不许。（《廉颇蔺相如列传》）
          - ancient: 寡人欲以五百里之地易（换取）安陵，安陵君其（副词，表示祈使）许寡人（《唐雎ju1不辱使命》）

          - ancient: 【高考题例】天水夷夏慕德，老幼赴阙献书，乞留芝。魏明帝许焉。（《晋书.鲁芝传》）
      - trans: ❷认可;赞同。
        sentences:
          - ancient: 聚室而谋曰："吾与汝毕力平险，指通豫南,达于汉阴,可乎?"杂然相许。（《愚公移山》）
          - ancient: （亮）身长八尺，每自比于管仲、乐毅，时人莫之许也。（《隆中对》）
      - trans: ❸给予;奉献。
        sentences:
          - ancient: 老母在，政（聂政自称）身未敢以许人也。（《史记・刺客列传》）
      - trans: ❹许配;答应嫁给。
        sentences:
          - ancient: 沛令善公，求之（吕公之女）不与，何自妄许与刘季？ （《汉书•高帝纪上》）
      - trans: ❺期望。
        sentences:
          - ancient: 塞上长城空自许，镜中衰鬓已先斑。（宋•陆游《书愤》）

  - word: 许
    type: 【代词】
    phonetic: XU3
    tags:
      - 高中
    samples:
      - trans: 如此;这样。
        sentences:
          - ancient: 问渠那得清如许？为有源头活水来。（宋•朱熹《观书有感》）

  - word: 许
    type: 【助词】
    phonetic: XU3
    tags:
      - 高中
    samples:
      - trans: 用在数词或数量词后，表示约数。
        sentences:
          - ancient: 潭中鱼可百许头。（《小石潭记》）
          - ancient: 舟首尾长约八分有奇,高可二黍许。（《核舟记》）