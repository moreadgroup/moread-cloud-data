许XU3
【名词】处所。
【例句】先生不知何许人也。（《五柳先生传》）

【动词】❶答应;允许。
【例句】将请罪于君，君不许;请罪于母，母不许。（《〈指南录〉后序》）丨秦王怒，不许。（《廉颇蔺相如列传》）丨寡人欲以五百里之地易（换取）安陵，安陵君其（副词，表示祈使）许寡人（《唐雎ju1不辱使命》）

【高考题例】天水夷夏慕德，老幼赴阙献书，乞留芝。魏明帝许焉。（《晋书.鲁芝传》）
❷认可;赞同。
【例句】聚室而谋曰："吾与汝毕力平险，指通豫南,达于汉阴,可乎?"杂然相许。（《愚公移山》）丨（亮）身长八尺，每自比于管仲、乐毅，时人莫之许也。（《隆中对》）
❸给予;奉献。
【例句】老母在，政（聂政自称）身未敢以许人也。（《史记・刺客列传》）
❹许配;答应嫁给。
【例句】沛令善公，求之（吕公之女）不与，何自妄许与刘季？
（《汉书•高帝纪上》）
❺期望。
【例句】塞上长城空自许，镜中衰鬓已先斑。（宋•陆游《书
愤》）

【代词】如此;这样。
【例句】问渠那得清如许？为有源头活水来。（宋•朱熹
《观书有感》）

【助词】用在数词或数量词后，表示约数。
【例句】潭中鱼可百许头。（《小石潭记》）丨舟首尾长约八分有奇,高可二黍许。（《核舟记》）