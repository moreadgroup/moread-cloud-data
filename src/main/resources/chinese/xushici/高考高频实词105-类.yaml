---
words:
  - word: 类 
    type: 【名词】
    phonetic: lei4
    tags:
      - 高中
    samples:
      - trans: ❶种类;类别。
        sentences:
          - ancient: 今欲以先王之政，治当世之民，皆守株之类也。（《韩非子•五蠹》）
          - ancient: 故王之不王，非挟太山以超北海之类也。（《齐桓晋文之事》）
          - ancient: 举类迩（近）而见义远。（《史记•屈原贾生列传》）
          - ancient: 仰观宇宙之美，俯察品类之盛。（《兰亭集序》）
      - trans: ❷同类。
        sentences:
          - ancient: 然后知是山之特立，不与培塿为类。（《始得西山宴游记》）
      - trans: ❸典范;榜样。
        sentences:
          - ancient: 明告君子，吾将以为类兮。（战国楚•屈原《九章•怀沙》）
  - word: 类 
    type: 【动词】
    phonetic: lei4
    tags:
      - 高中
    samples:
      - trans: ❶类推。
        sentences:
          - ancient: 欲进利除害，不知任贤能，此则不知类之患也。（《韩非子•难势》）
          - ancient: 义不杀少而杀众，不可谓知类。（《公输》）
      - trans: ❷类似;像。
        sentences:
          - ancient: 吾儿，久不见若（你的）影，何竟日默默在此，大类女郎也？（《项脊轩志》）
          - ancient: 佛印绝类弥勒。（《核舟记》）
          - ancient: 【高考题例】密谋匿之民间，别求状类宦者二人杀之。（《宋史•孙傅传》）
          - ancient: 【高考题例】珪居闲类木讷者。（《明史•傅珪传》）
  - word: 类 
    type: 【副词】
    phonetic: lei4
    tags:
      - 高中
    samples:
      - trans: 大抵;大致。
        sentences:
          - ancient: 走卒类士服，农夫蹑丝履。（《训俭示康》）
