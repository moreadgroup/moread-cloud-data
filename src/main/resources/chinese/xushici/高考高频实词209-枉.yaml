      - trans: ❶降低身份，屈尊前去。
        sentences:
          - ancient: 臣有客在市屠中，愿枉车骑过之。（《史记•魏公子列传》）丨越陌度阡，枉用相存。（《短歌行》）丨先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中。（《出师表》）丨嬴乃夷门抱关者也，而公子亲枉车骑，自迎嬴于众人广坐之中。（《史记•魏公子列传》）
      - trans: ❷歪曲；违背。
        sentences:
          - ancient: 不为爱人枉其法。（《管子•七法》）丨枉道而事人,何必去（离开）父母之邦？（《论语•微子》）丨身死家室富,又恐受赇枉法，为奸触大罪，身死而家灭。（《史记•滑稽列传》）
          - ancient: 【高考题例】吏奉法，律不可枉也，更道它所欲。（《后汉书•赵惠传》）
      - trans: ❸冤枉。
