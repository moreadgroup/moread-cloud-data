---
words:
  - word: 宜
    type: 【名词】
    phonetic: yi2
    tags:
      - 高中
    samples:
      - trans: ❶事情;事务。
        sentences:
          - ancient: 悠悠非吾匹。畴肯应俗宜。（三国魏•嵇康《述志诗》）
      - trans: ❷古代祭名，祭祀土神。
        sentences:
          - ancient: 天子将出，类（通""襪",祭天）乎上帝，宜乎社,造乎祢（mi3,亡父的庙）。（《礼记•王制》）
  - word: 宜
    type: 【形容词】
    phonetic: yi2
    tags:
      - 高中
    samples:
      - trans: 合适;适宜。
        sentences:
          - ancient: 将军禽（通"擒"）操，宜在今日。（《资治通鉴•汉纪五十七》）
          - ancient: 只宜近盼天都，明日登莲顶。（明•徐霞客《游黄山日记》）
          - ancient: 夏宜急雨，有瀑布声。（《黄州新建小竹楼记》）

  - word: 宜
    type: 【副词】
    phonetic: yi2
    tags:
      - 高中
    samples:
      - trans: ❶应该;应当。
        sentences:
          - ancient: 诚<宜>开张（扩大）圣听，以光（发扬光大）先帝遗德,恢弘志士之豈，不<宜>妄自菲薄，引喻失义，以塞忠谏之路也。（《出师表》）
          - ancient: 公宜少从众。（《训俭示康》）
          - ancient: 载舟覆舟,所宜深慎。（《谏太宗十思疏》）
      - trans: ❷大概;也许。
        sentences:
          - ancient: 今诚以吾众诈自称公子扶苏、项燕，为天下倡，宜多应者。（《陈涉世家》）
          - ancient: （文帝）从容问曰：""天下谁最爱我者乎?"（邓）通曰："宜莫若太子。"（《汉书•佞幸传》）

