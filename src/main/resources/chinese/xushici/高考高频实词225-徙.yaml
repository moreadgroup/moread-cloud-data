---
words:
  - word: 徙
    type: 【动词】
    phonetic: xi3
    tags:
      - 高中
    samples:
      - trans: ❶迁移。
        sentences:
          - ancient: "视驼所种树，或移<徙>，无不活。（《种树郭橐驼传》）"
            url: xxxx
            vernacular: 人们观察橐驼种的树，或者移植的树，没有不成活的
          - ancient: 今漂沦（漂泊沦落）憔悴，转<徙>于江湖间。（《琵琶行》序）
            url: xxxx
            vernacular: 但如今漂泊沦落，憔悴不堪，在江湖之间飘零流浪。
          - ancient: 是鸟也，海运则将<徙>于南冥。（《逍遥游》）
            url: xxxx
            vernacular: 这只鸟，大风吹动海水的时候就要迁徙到南方的大海去了
          - ancient: 王死后，人众<徙>去。（《苏武传》）
            url: xxxx
            vernacular: 王死后，他的部下也都迁离。
      - trans: ❷转移;变更。
        sentences:
          - ancient: 时已<徙>矣而法不<徙>，以此为治，岂不难哉！（《吕氏春秋•察今》）
            url: xxxx
            vernacular: 时代已经变了，而法令制度不变，用这种方法治理国家，岂不太难了吗！
      - trans: ❸调职;升迁。
        sentences:
          - ancient: （张）衡不慕当世，所居之官辄积年不<徙>。（《张衡传》）
            url: xxxx
            vernacular: 张衡不趋附当时的那些达官显贵，他所担任的官职，总是多年得不到提升。
      - trans: ❹谪戍;流放。
        sentences:
          - ancient: 然陈涉瓮牖绳枢之子，氓隶之人，而迁<徙>之徒也。（《过秦论》）
            url: xxxx
            vernacular: 可是，陈涉不过是个破瓮做窗户、草绳做户枢的贫家子弟，是氓、隶一类的人，（后来）做了被迁谪戍边的卒子
          - ancient: "匈奴以为神，乃<徙>武北海上无人处，使牧羝（公羊），羝乳乃（才）得归。（《苏武传》）"
            url: xxxx
            vernacular: 匈奴认为这是神在帮他，就把苏武迁移到北海边没有人的地方，让他放牧公羊，公羊生了小羊才能回来。
