---
words:
  - word: 徙
    type: 【动词】
    phonetic: xi3
    tags:
      - 高中
    samples:
      - trans: ❶迁移。
        sentences:
          - ancient: 视驼所种树,或移徙，无不活。（《种树郭橐驼传》）丨今漂沦（漂泊沦落）憔悴，转徙于江湖间。（《琵琶行》序）丨是鸟也，海运则将徙于南冥。（《逍遥游》）丨王死后，人众徙去。（《苏武传》）
      - trans: ❷转移;变更。
        sentences:
          - ancient: 时已徙矣而法不徙，以此为治，岂不难哉！（《吕氏春秋•察今》）	卜
      - trans: ❸调职;升迁。
        sentences:
          - ancient: （张）衡不慕当世，所居之官辄积年不徙。（《张衡传》）
      - trans: ❹谪戍;流放。
        sentences:
          - ancient: 然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也。（《过秦论》）丨乃徙武北海上无人处,使牧羝（公羊），羝乳乃（才）得归。（《苏武传》）
