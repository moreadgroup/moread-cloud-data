---
words:
  - word: 委
    type: 【名词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: ❶水的下游;水流汇聚之处。
        sentences:
          - ancient: "三王之祭川也，皆先河而后海,或源也，或<委>也。此之谓务本。（《礼记•学记》）"
            url: xxxx
            vernacular: 古代的三王祭祀江河的时候，都是先祭河而后祭海，这是因为河是水的本源，而海是水的归宿。这才叫抓住了根本!
      - trans: ❷末尾。
        sentences:
          - ancient: 惟其上探伏羲唐虞以来，有源有<委>，不以远绝，不以难止。（宋•陆游《吕居仁集序》）
            url: xxxx
            vernacular: xxxx
  - word: 委
    type: 【动词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: ❶听任。
        sentences:
          - ancient: 寓形宇内复几时？曷不<委>心任去留？（《归去来兮辞》）
            url: xxxx
            vernacular: 活在世上还能有多久？为什么不随心所欲，听凭自然的生死？
      - trans: ❷托付;交付。
        sentences:
          - ancient: "王年少，初即位,<委>国事大臣。（《史记•秦始皇本纪》）"
            url: xxxx
            vernacular: 秦王赵政(嬴政)年纪小，刚刚登上位，把国事委托给大臣们。
          - ancient: 问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，<委>身为贾人（商人）妇。（《琵琶行》序）
            url: xxxx
            vernacular: 我询问她的来历，原来是长安的乐伎，曾经跟穆、曹这两位琵琶名家学习技艺，后来年长色衰，嫁给一位商人为妻。
          - ancient: "向也使予<委>骨于草莽，予蛍浩然无所愧作，然微以自文于君亲,君亲其谓予何？（《〈指南录〉后序》）"
            url: xxxx
            vernacular: 以前，假使我把尸骨抛在荒野里，我虽然正大光明问心无愧，但在君王和父母前无法文饰自己的过错，国君和父母又将会怎么讲我呢？
          - ancient: "百越之君，俯首系颈,<委>命下吏。（《过秦论》）"
            url: xxxx
            vernacular: 百越的君主，低着头，颈上捆着绳子（愿意服从投降），把性命交给司法官吏。
      - trans: ❸丢弃;抛弃。
        sentences:
          - ancient: "动刀甚微，謋（huo4,迅速分离的声音）然已解，如土<委>地。（《庄子•养生主》）"
            url: xxxx
            vernacular: 动起刀来非常轻，豁啦一声，牛的骨和肉一下子就解开了，就像泥土散落在地上一样。
          - ancient: 花钿（形状如花朵的首饰）<委>地无人收，翠翘金雀玉搔头。（唐•白居易《长恨歌》）
            url: xxxx
            vernacular: 贵妃头上的饰品丢弃在地上无人收拾，首饰金雀钗玉簪珍贵头饰一根根。
      - trans: ❹推卸;推脱。
        sentences:
          - ancient: 司马欲<委>罪于孤邪！（《晋书•王裒传》）
            url: xxxx
            vernacular: 司马想把罪责加到我身上！
      - trans: ❺累积;聚积。
        sentences:
          - ancient: 傧暗蔼兮降清坛，瑞穰穰（丰盛）兮<委>如山。（汉•扬雄《甘泉赋》）
            url: xxxx
            vernacular: 众神嘉宾纷然而至呵，降临清净祠坛。祥瑞累累时，累积如山。
      - trans: ❻坠；下垂。
        sentences:
          - ancient: 正值李梳头，发<委>藉地，肤色玉曜，不为动容。（《世说新语.贤媛》）
            url: xxxx
            vernacular: 正遇见李氏在梳头，头发垂下来铺到地上，肤色像白玉一样光采照人，并没有因为公主到来而表情有变。
      - trans: ❼放置。
        sentences:
          - ancient: 羊了不眄，唯脚<委>几上，咏瞩自若。（《世说新语•雅量》）
            url: xxxx
            vernacular: 羊孚也不理睬他们，自顾自把脚放在了茶几上，悠然自得地咏诗看风景。
          - ancient: 乃令张仪详（通""佯"，假装）去秦，厚币<委>质事楚。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 就派张仪假装脱离秦国，用厚礼和信物呈献给楚王
          - ancient: 是谓"<委>肉当饿虎之蹊"也，祸必不振矣！（《史记•刺客列传》）
            url: xxxx
            vernacular: 这就好比把肉丢在饿虎经过的路上，灾祸难以避免了。
  - word: 委
