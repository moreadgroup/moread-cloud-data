---
words:
  - word: 委
    type: 【名词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: ❶水的下游;水流汇聚之处。
        sentences:
          - ancient: 三王之祭川也，皆先河而后海,或源也，或委也。此之谓务本。（《礼记•学记》）
      - trans: ❷末尾。
        sentences:
          - ancient: 惟其上探伏羲唐虞以来，有源有委，不以远绝，不以难止。（宋•陆游《吕居仁集序》）

  - word: 委
    type: 【动词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: ❶听任。
        sentences:
          - ancient: 寓形宇内复几时？曷不委心任去留？（《归去来兮辞》）
      - trans: ❷托付;交付。
        sentences:
          - ancient: 王年少，初即位,委国事大臣。（《史记•秦始皇本纪》）
          - ancient: 问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人（商人）妇。（《琵琶行》序）
          - ancient: 向也使予委骨于草莽，予蛍浩然无所愧作，然微以自文于君亲,君亲其谓予何？（《〈指南录〉后序》）
          - ancient: 百越之君，俯首系颈,委命下吏。（《过秦论》）
      - trans: ❸丢弃;抛弃。
        sentences:
          - ancient: 动刀甚微，謋（huo4,迅速分离的声音）然已解，如土委地。（《庄子•养生主》）
          - ancient: 花钿（形状如花朵的首饰）委地无人收，翠翘金雀玉搔头。（唐•白居易《长恨歌》）
      - trans: ❹推卸;推脱。
        sentences:
          - ancient: 司马欲委罪于孤邪！（《晋书•王裒传》）
      - trans: ❺累积;聚积。
        sentences:
          - ancient: 瑞穰穰（丰盛）兮委如山。（汉•扬雄《甘泉赋》）
      - trans: ❻坠；下垂。
        sentences:
          - ancient: 发委藉地。（《世说新语.贤媛》）
      - trans: ❼放置。
        sentences:
          - ancient: 唯脚委几上。（《世说新语•雅量》）
          - ancient: 乃令张仪详（通""佯"，假装）去秦，厚币委质事楚。（《史记•屈原贾生列传》）
          - ancient: 是谓"委肉当饿虎之蹊"也，祸必不振矣！（《史记•刺客列传》）

  - word: 委
    type: 【形容词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: 曲折。
        sentences:
          - ancient: 以委巷活套（俗语常谈）中来者，无不与宁南（指宁南侯左良玉）意吾；（《柳敬亭传》）

  - word: 委
    type: 【副词】
    phonetic: wei3
    tags:
      - 高中
    samples:
      - trans: 确实。
        sentences:
          - ancient: 委是良田，方得收买。（宋•苏轼《论给田募役状》）
