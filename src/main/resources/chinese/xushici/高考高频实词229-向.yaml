---
words:
  - word: 向
    type: 【名词】
    phonetic: xiang4
    tags:
      - 高中
    samples:
      - trans: ❶朝北的窗户。
        sentences:
          - ancient: 穹窒（完全堵塞）熏鼠，塞向墐（jin4,用泥涂塞）户。（《诗经•豳风•七月》）
      - trans: ❷泛指窗户。
        sentences:
          - ancient: 入五月，内著屋中。闭户塞向，密泥，勿使风入漏气。（《齐民要术•种紫草》）
      - trans: ❸方向。
        sentences:
          - ancient: 进不知向，退不知守。（唐•柳宗元《送从兄偁罢选归江淮诗序》）
      - trans: ❹从前;往昔。
        sentences:
          - ancient: 向吾不为斯役，则久已病（困苦）矣。（《捕蛇者说》）
          - ancient: 向之所欣，俯仰之间，已为陈迹，犹不能不以（因为）之兴怀，况修（生命长）短随化，终期于尽！（《兰亭集序》）
          - ancient: 凄凄不似向前声，满座重闻皆掩泣。（《琵琶行》）
          - ancient: 深谋远虑，行军用兵之道，非及向时之士也。（《过秦论》）
      - trans: ❺刚才。
        sentences:
          - ancient: 向者之论，阿谁为失？（《三国志•蜀书•庞统传》）

  - word: 向
    type: 【动词】
    phonetic: xiang4
    tags:
      - 高中
    samples:
      - trans: ❶面对;朝着。
        sentences:
          - ancient: 相向而哭。（《孟子•滕文公上》）
          - ancient: 沛公北向坐;张良西向侍。（《鸿门宴》）
          - ancient: 中有双飞鸟，自名为鸳鸯，仰头相向鸣,夜夜达五更。（《孔雀东南飞》）
      - trans: ❷奔向。
        sentences:
          - ancient: 到夏口，闻（曹）操已向荆州。（《资治通鉴•汉纪五十七》）
      - trans: ❸接近;将近。
        sentences:
          - ancient: 夜如何其？夜向晨。（《诗经•小雅•庭燎》）
          - ancient: 俄顷风定云墨色，秋天漠漠向昏黑。（《茅屋为秋风所破歌》）
      - trans: ❹对待;看待。
        sentences:
          - ancient: 世人向我同众人，唯君于我最相亲。（唐•高适《别韦参军》）
      - trans: ❺归向;仰慕。
        sentences:
          - ancient: 咸亨初，敦实为洛州长史,亦宽惠，人心怀向。（《新唐书•贾敦颐传》）
      - trans: ❻迎合。
        sentences:
          - ancient: （安）禄山方幸（受宠幸），表讨契丹以向帝意。（《新唐书•北狄传》）,
      - trans: ⑦偏爱。
        sentences:
          - ancient: 人情皆向菊,风意欲摧兰。（唐•刘禹锡《秋中暑退赠乐天》）
      - trans: ❽崇尚。
        sentences:
          - ancient: 【高考题例】及壮,知向濂洛之学，事同郡王柏，从登何基之门。（《元史•金履祥传》）

  - word: 向
    type: 【介词】
    phonetic: xiang4
    tags:
      - 高中
    samples:
      - trans: 对着;朝着。
        sentences:
          - ancient: 文挚乃命龙叔背明而立，文挚自后向明而望之。（《列子•仲尼》）
          - ancient: 今有满堂饮酒者,有一人独索然向隅而泣，则一堂之人皆不乐矣。（《说苑•贵德》）

  - word: 向
    type: 【连词】
    phonetic: xiang4
    tags:
      - 高中
    samples:
      - trans: 假使;假如。
        sentences:
          - ancient: 向不出其技,虎虽猛，疑畏卒不敢取。（《黔之驴》）
          - ancient: 向使三国各爱其地,齐人勿附于秦，刺客不行，良将犹在,则胜负之数（命运），存亡之理，当与秦相较，或未易量。（《六国论》）