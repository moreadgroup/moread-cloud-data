---
words:
  - word: 亡
    type: 【名词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: 逃跑的人。
        sentences:
          - ancient: 追亡逐北（失败逃跑的士兵），伏尸百万。（《过秦论》）

  - word: 亡
    type: 【动词】
    phonetic: wang2
    tags:
      - 高中
    samples:
      - trans: ❶逃亡;逃跑。
        sentences:
          - ancient: 今亡亦死，举大计亦死，等死（同样是死），死国可乎？（《陈涉世家》）
          - ancient: 臣为韩王送浦公,沛公今事有急，亡去不义，不可不语。（《鸿门宴》）
          - ancient: 宁溘死以流亡兮，余不忍为此态也！（《离骚》）
      - trans: ❷丧失；丢失。
        sentences:
          - ancient: 诸侯之所亡，与战败而亡者，其实（实际）亦百倍。（《六国论》）
          - ancient: 然尝闻之，大道以多歧亡羊：（《中山狼传》）
          - ancient: 秦无亡矢遗镰之费,而天下诸侯已困矣。（《过秦论》）
          - ancient: 【高考题例】尝有使客亡橐中物，移书诘盗。（《宋史・曾公亮传》）
      - trans: ❸死亡。
        sentences:
          - ancient: 今刘表新亡，二子不协，军中诸将，各有彼此（结成的团伙）。（《资治通鉴•汉纪五十七》）
          - ancient: 忧劳可以弟国，逸豫可以亡身，自然之理也。（《伶官传序》）
      - trans: ❹灭亡。
        sentences:
          - ancient: 先帝创业未半而中道崩殂（帝王死去），今天下三分，益州疲弊，此诚危急存亡之秋,也。（《出师表》）
          - ancient: 且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。（《六国论》）
          - ancient: 今臣亡国贱俘，至微至陋，过蒙拔擢,宠命优渥，岂敢盘桓，有所希冀。（《陈情表》）
      - trans: ❺出外;不在。
        sentences:
          - ancient: 孔子时（窥伺）其亡也，而往拜之。（《论语•阳货》）
      - trans: ❻通"忘;"。忘记。
        sentences:
          - ancient: 人不能自止于足，而亡其富之涯（边）乎。（《韩非子♦说林下》）


  - word: 亡
    type: 【动词】
    phonetic: wu2
    tags:
      - 高中
    samples:
      - trans: 通"无"。没有。
        sentences:
          - ancient: 终不得归汉，空自苦亡人之地，信义安所见乎?（《苏武传》）
          - ancient: 且陛下春秋高,法令<亡>常，大臣<亡>罪夷灭者数十家，安危不可知，子卿尚复谁为乎？（《苏武传》）
          - ancient: 武父子亡功德，皆为陛下所成就。（《苏武传》）
          - ancient: 子为父死，亡所恨,愿勿复再言！（《苏武传》）
          - ancient: 河曲智叟亡以应。（《愚公移山》）
          - ancient: 生之有时而用之亡度，则物力必屈。（《论积贮疏》）

          - ancient: 【高考题例】给事中许輸以为傅论议虽偶与轼合，意亦亡他，以职论事而责之过矣，翰亦罢去。（《宋史•孙傅传》）

  - word: 亡
    type: 【副词】
    phonetic: wu2
    tags:
      - 高中
    samples:
      - trans: 不。
        sentences:
          - ancient: 子祀曰："女恶（wu4）之乎?"曰："亡，予何恶!"（《庄子•大宗师》）

  - word: 亡
    type: 【连词】
    phonetic: wu2
    tags:
      - 高中
    samples:
      - trans: 不论。
        sentences:
          - ancient: 于是上遣使者分条中都官诏狱系者，亡轻重一切皆杀之。（《汉书•丙吉传》）