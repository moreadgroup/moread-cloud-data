辄 zhe4
【副词】❶擅自；独断专行。
【例句】夫姬氏爵乃诸侯,而辄行征伐。（《史通•疑古》）
❷总是;常常。
【例句】每责一头，辄倾数家之产。（《促织》）丨衡不慕当世，所居之官辄积年不。（《张衡传》）丨广廉，得赏赐辄分其麾下，饮食与士共之。（《史记•李将军列传》）丨大王起微细,诛暴逆，平定四海，有功者辄裂地而封为王侯。（《史记・高祖本纪》）
【高考题例】民思其德，为立祠安阳亭西,每食辄弦歌而荐之。（《后汉书•王涣传》）丨家居，非事未尝入州城。语及时事,辄颦蹙不答。（《明史•马文升传》）

❸立即;就。
【例句】喜而捕之，一鸣辄跃去，行且速。（《促织》）丨去辄烧绝栈道，以备诸侯盗兵袭之，亦示项羽无东意。（《史记•高祖本纪》）
