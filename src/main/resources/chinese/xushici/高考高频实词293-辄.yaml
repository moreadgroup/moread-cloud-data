---
words:
  - word: 辄
    type: 【副词】
    phonetic: zhe4
    tags:
      - 高中
    samples:
      - trans: ❶擅自；独断专行。
        sentences:
          - ancient: 夫姬氏爵乃诸侯,而辄行征伐。（《史通•疑古》）
      - trans: ❷总是;常常。
        sentences:
          - ancient: 每责一头，辄倾数家之产。（《促织》）
          - ancient: 衡不慕当世，所居之官辄积年不。（《张衡传》）
          - ancient: 广廉，得赏赐辄分其麾下，饮食与士共之。（《史记•李将军列传》）
          - ancient: 大王起微细,诛暴逆，平定四海，有功者辄裂地而封为王侯。（《史记・高祖本纪》）
          - ancient: 【高考题例】民思其德，为立祠安阳亭西,每食辄弦歌而荐之。（《后汉书•王涣传》）
          - ancient: 家居，非事未尝入州城。语及时事,辄颦蹙不答。（《明史•马文升传》）

      - trans: ❸立即;就。
        sentences:
          - ancient: 喜而捕之，一鸣辄跃去，行且速。（《促织》）
          - ancient: 去辄烧绝栈道，以备诸侯盗兵袭之，亦示项羽无东意。（《史记•高祖本纪》）
          - ancient: 【高考题例】后青州大蝗，侵入平原界辄死，岁屡有年,百姓歌"之。（《后汉书•赵惠传》）

