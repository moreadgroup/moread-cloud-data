    samples:
      - trans: ❶（地势）平坦。
        sentences:
          - ancient: 地形险<易>尽知之。（《战国策•秦策二》）
            url: xxxx
            vernacular: 地形的险要或平坦,他全知道。
          - ancient: 【高考题例】河上之丘冢，不可胜数，犹以为<易>也。（《淮南子•氾论训》）
            url: xxxx
            vernacular: 黄河流域的平原地带，尽管小土丘多得数都数不过来，但这一地带仍不失平坦
      - trans: ❷容易。
        sentences:
          - ancient: 但二月草已芽，八月苗未枯，采掇者<易>辨识耳，在药则未为良时。（《梦溪笔谈•药议》）
            url: xxxx
            vernacular: 仅仅只是因为二月间草已发芽，八月间草还没有枯萎，采集的人容易辨认识别而已，对药材来说却不是好的时节。
          - ancient: "是疾<易>传染，遘（gou4,遭遇）者虽戚属,不敢同卧起。（《狱中杂记》）"
            url: xxxx
            vernacular: 这种病容易传染，生这种病的，纵然是亲人，也不敢住在一起
      - trans: ❸安稳;和悦。
        sentences:
          - ancient: 尔还而入，我心<易>也。（《诗经•小雅•何人斯》）
            url: xxxx
            vernacular: 如果你返回来进入我的门，我悬着的心才会尽快平静。
