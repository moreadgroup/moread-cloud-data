  - word: 易
    type: 【动词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶交换。
        sentences:
          - ancient: 秦王以十五城请<易>寡人之璧，可予不（通""否"）？（《廉颇蔺相如列传》）
            url: xxxx
            vernacular: 秦王用十五座城池请求交换我的和氏璧，能不能给他？
          - ancient: "然君之职分难明，以俄顷淫乐,不<易>无穷之悲，虽愚者亦明之矣！（明•黄宗羲《原君》）"
            url: xxxx
            vernacular: 虽然君主的职分难以明了，但用片刻的荒淫享乐，不值得换取无穷的悲哀，即使是愚蠢的人也能明白这一道理的。
          - ancient: 【高考题例】文力遏之，以其羡<易>粟万石，备振贷。（《明史•韩文传》）
            url: xxxx
            vernacular: 韩文竭力制止，并用余钱买了一万石米，用来准备赈济灾荒，借给百姓。
      - trans: ❷改变;更改。
        sentences:
          - ancient: 他植者则不然，根拳而土<易>，其培之也，若不过焉则不及。（《种树郭橐驼传》）
            url: xxxx
            vernacular: 别的种树人却不是这样，种树时树根卷曲，又换上新土；培土不是过分就是不够。
          - ancient: "嗟乎！大阉之乱,缙绅而能不<易>其志者，四海之大，有几人欤？（《五人墓碑记》）"
            url: xxxx
            vernacular: 唉！当魏忠贤作乱的时候，做官的人能够不改变自己志节的，中国之大，能有几个人呢？
          - ancient: "因（凭借）人之力而敝之,不仁;失其所与,不知；以乱<易>整,不武。（《烛之武退秦师》）"
            url: xxxx
            vernacular: 依靠别人的力量，而后伤害他，这是不仁义；失去了自己所结盟的力量，真是不明智；利用混乱去改变已有的协调，这并不是威风。
          - ancient: 【高考题例】贾生以为汉兴至孝文二十余年，天下和洽，而固当改正朔，<易>服色。（《史记•屈原贾生列传》）
            url: xxxx
            vernacular: 贾谊认为，从汉兴到文帝经过二十多年，天下已经安定，朝野和睦，应当更定历法，改变所崇尚的颜色
      - trans: ❸轻视。
        sentences:
          - ancient: 高祖为亭长，素（一向）<易>诸吏。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 高祖做亭长,向来轻视那些官吏。
          - ancient: "【高考题例】揆自恃门望，以载（元载，人名）地寒（出身贫寒），意甚轻<易>,不纳。（《值唐书•李揆传》）"
            url: xxxx
            vernacular: 揆自恃（依仗）门望，以（认为）载地寒（出身微贱，地位低下），意甚轻易（轻视）
      - trans: ❹修治;治理。
        sentences:
          - ancient: <易>其田畴，薄（减轻）其税敛，民可使富也。（《孟子•尽心上》）
            url: xxxx
            vernacular: 让百姓种好他们的地，减轻他们的赋税，就可以使百姓富足。
  - word: 易
    type: 【形容词】
    phonetic: yi4
    tags:
