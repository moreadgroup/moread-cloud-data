---
words:
  - word: 易
    type: 【名词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶书名，《周易》的简称。
        sentences:
          - ancient: 伏羲至纯厚，作《易》《八卦》。（《史记•太史公自序》）
      - trans: ❷通"埸"。边界。
        sentences:
          - ancient: 吾易久远，烛明四极。（《汉书•礼乐志》）

  - word: 易
    type: 【动词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶交换。
        sentences:
          - ancient: 秦王以十五城请易寡人之璧，可予不（通""否"）？（《廉颇蔺相如列传》）
          - ancient: 然君之职分难明，以俄顷淫乐,不易无穷之悲，虽愚者亦明之矣！（明•黄宗羲《原君》）

          - ancient: 【高考题例】文力遏之，以其羡易粟万石，备振贷。（《明史•韩文传》）

      - trans: ❷改变;更改。
        sentences:
          - ancient: 根拳而土易，其培之也，若不过焉则不及。（《种树郭橐驼传》）
          - ancient: 嗟乎！大阉之乱,缙绅而能不易其志者，四海之大，有几人欤？（《五人墓碑记》）
          - ancient: 因（凭借）人之力而敝之,不仁;失其所与,不知；以乱易整,不武。（《烛之武退秦师》）
          - ancient: 【高考题例】贾生以为汉兴至孝文二十余年，天下和洽，而固当改正朔，易服色。（《史记•屈原贾生列传》）
      - trans: ❸轻视。
        sentences:
          - ancient: 高祖为亭长，素（一向）易诸吏。（《史记•高祖本纪》）
          - ancient: 【高考题例】揆自恃门望，以载（元载，人名）地寒（出身贫寒），意甚轻易,不纳。（《值唐书•李揆传》）
      - trans: ❹修治;治理。
        sentences:
          - ancient: 易其田畴，薄（减轻）其税敛。（《孟子•尽心上》）

  - word: 易
    type: 【形容词】
    phonetic: yi4
    tags:
      - 高中
    samples:
      - trans: ❶（地势）平坦。
        sentences:
          - ancient: 地形险易尽知之。（《战国策•秦策二》）
          - ancient: 【高考题例】河上之丘冢不可胜数，犹以为易也。（《淮南子•氾论训》）
      - trans: ❷容易。
        sentences:
          - ancient: 但二月草已芽，八月苗未枯，采掇者易辨识耳，在药则未为良时。（《梦溪笔谈•药议》）
          - ancient: 是疾易传染，遘（gou4,遭遇）者虽戚属,不敢同卧起。（《狱中杂记》）
      - trans: ❸安稳;和悦。
        sentences:
          - ancient: 尔还而入，我心易也。（《诗经•小雅•何人斯》）

