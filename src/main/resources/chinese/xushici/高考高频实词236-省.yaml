      - trans: ❶察看;考察。
        sentences:
          - ancient: 皇帝春游，览省远方。（《史记•秦始皇本纪》）
      - trans: ❷顾惜;顾恤。
        sentences:
          - ancient: 然少而侍中，贵不省士。（《汉书•霍去病传》）
      - trans: ❸检查;反省。
        sentences:
          - ancient: 见不善，愀然（愀qiao3,神情忧惧的样子）必以自省也。（《荀子•修身》）
          - ancient: 君子博学而日参省乎己，则知（通"智"，智慧）明而行无过矣。（《劝学》）
          - ancient: 【高考题例】文升请帝减膳撤乐，修德省愆（罪过）。（《明史・马文升传》）
      - trans: ❹问候;探望。
        sentences:
          - ancient: 凡为人子之礼，冬温而夏清，昏定而晨省。（《礼记•曲礼上》）
          - ancient: 瑜从父尚为丹杨太守，瑜往省之。（《三国志•吴书•周瑜传》）
          - ancient: 大铁椎，不知何许人。北平陈子灿省兄河南，与遇宋将军家。（《大铁椎传》）
          - ancient: 又二年，吾佐董丞相于汴州，汝来省吾。（《祭十二郎文》）
      - trans: ❺知道;醒悟。
        sentences:
          - ancient: 吾少孤，及长，不省所怙（hu3,代指父亲）。（《祭十二郎文》）
          - ancient: 忽大省曰："宇宙内事乃己分内事。"（《宋史•陆九渊传》）
          - ancient: 画图省识春风面，环珮空归夜月魂。（唐•杜甫《咏怀古迹.其三》）
      - trans: ❻记忆。
        sentences:
          - ancient: 夜来省得曾闻处，万里月明湘水秋。（唐•许浑《听唱山鹦鸠》）
