省xing3
【动词】❶察看;考察。
【例句】皇帝春游，览省远方。（《史记•秦始皇本纪》）
❷顾惜;顾恤。
【例句】然少而侍中，贵不省士。（《汉书•霍去病传》）
❸检查;反省。
【例句】见不善，愀然（愀qiao3,神情忧惧的样子）必以自省也。（《荀子•修身》）丨君子博学而日参省乎己，则知（通"智"，智慧）明而行无过矣。（《劝学》）
【高考题例】文升请帝减膳撤乐，修德省愆（罪过）。（《明史・马文升传》）
❹问候;探望。
【例句】凡为人子之礼，冬温而夏清，昏定而晨省。（《礼记•曲礼上》）丨瑜从父尚为丹杨太守，瑜往省之。（《三国志•吴书•周瑜传》）丨大铁椎，不知何许人。北平陈子灿省兄河南，与遇宋将军家。（《大铁椎传》）丨又二年，吾佐董丞相于汴州，汝来省吾。（《祭十二郎文》）
❺知道;醒悟。
【例句】吾少孤，及长，不省所怙（hu3,代指父亲）。（《祭十二郎文》）丨忽大省曰："宇宙内事乃己分内事。"（《宋史•陆九渊传》）丨画图省识春风面，环珮空归夜月魂。（唐•杜甫《咏怀古迹.其三》）
❻记忆。
【例句】夜来省得曾闻处，万里月明湘水秋。（唐•许浑《听唱山鹦鸠》）
