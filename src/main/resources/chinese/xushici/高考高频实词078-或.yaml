---
words:
  - word: 或
    type: 【代词】
    phonetic: huo4
    tags:
      - 高中
    samples:
      - trans: 有人;有的。
        sentences:
          - ancient: 【例句】兵刃既接，弃甲曳兵而走。或百步而后止，或五十步而后止。（《寡人之于国也》）丨或曰：六国互丧，率（全部）赂秦耶？（《六国论》）丨或曰："梅以曲为美，直则无姿。""（《病梅馆记》）丨句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。（《师说》）【高考题例】密州民田产银，或盗取之,大理当以强。（《宋史・曾公亮传》）丨贾生数上疏，言诸侯或连数郡，非古之制,可稍削之。（《史记•屈原贾生列传》）
  - word: 或
    type: 【副词】
    phonetic: huo4
    tags:
      - 高中
    samples: 
      - trans: ❶有时;偶或。
        sentences:
          - ancient: 【例句】余既为此志,后五年，吾妻来归，时至轩中，从余问古事,或凭几（靠在桌案上）学书。（《项脊轩志》）丨或王命急宣,有府朝发白帝，暮到江陵。（《三峡》）丨马之千里者,—食或尽粟一石。（《马说》）
      - trans: ❷也许;或许。
        sentences:
          - ancient: 【例句】越人语天姥，云霞明灭或可睹。（《梦游天姥吟留别》）丨莫如以吾所长攻敌所短，操刀挟盾，猱（nao2,像猴子—样）进鸷（像凶猛的鸟一样）击,或能免乎!（《冯婉贞》）
          - ancient: 【高考题例】金人虽不吾索，吾当与之俱行，求见二酋面责之,庶或万一可济。（《宋史♦孙傅传》）
      - trans: ❸倘若;倘或。
        sentences:
          - ancient: 【例句】所守或匪亲,化为狼与豺。（《蜀道难》）
  - word: 或
    type: 【助词】
    phonetic: huo4
    tags:
      - 高中
    samples: 
      - trans: 常用在否定句中加强否定语气。
        sentences:
          - ancient: 【例句】残贼公行，莫之或止。（《论积贮疏》）