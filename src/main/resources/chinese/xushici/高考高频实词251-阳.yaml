---
words:
  - word: 阳
    type: 【名词】
    phonetic: yang2
    tags:
      - 高中
    samples:
      - trans: ❶太阳；阳光。
        sentences:
          - ancient: 斜阳草树，寻常巷陌，人道寄奴曾住。（《永遇乐•京口北固亭怀古》）
      - trans: ❷阳面，山的南面，水的北面（与"阴"相对）。
        sentences:
          - ancient: 距其院东五里，所谓华山洞者，以其乃华山之阳名之也。（《游褒禅山记》）
          - ancient: 泰山之阳，汶水西流;其阴，济水一东流。（《登泰山记》）
          - ancient: 迁生龙门，耕牧河山之阳。（《史记•太史公自序》）
      - trans: ❸古代哲学术语之一（与"阴""相对）。
        sentences:
          - ancient: 一阴一阳之谓道。（《周易•系辞上》）
          - ancient: 衡善机巧，尤致思于天文阴阳历算。（《张衡传》）
          - ancient: 《易》著天地阴阳四时五行，故长于变。（《史记•太史公自序》）
      - trans: ❹关于活人或人世的事。如阳宅、阳间等。
      - trans: ❺农历十月的代称。
        sentences:
          - ancient: 至于阳月，阴慝（慝te4,阴气）害作。（《后汉书•马融传》）

  - word: 阳
    type: 【动词】
    phonetic: yang2
    tags:
      - 高中
    samples:
      - trans: ❶假装。
        sentences:
          - ancient: 是以箕子阳狂，接舆避世。（《汉书•邹阳传》）
      - trans: ❷生;活。
        sentences:
          - ancient: 近死之心,莫使复阳也。（《庄子•齐物论》）

  - word: 阳
    type: 【形容词】
    phonetic: yang2
    tags:
      - 高中
    samples:
      - trans: ❶温暖。
        sentences:
          - ancient: 阳春布德泽,万物生光辉。（《长歌行》）
      - trans: ❷器物或印章上凸起的（文字）。
        sentences:
          - ancient: 盖阴识难铸，阳识易为。（明•陶宗仪《南村辍耕录》卷十七）

