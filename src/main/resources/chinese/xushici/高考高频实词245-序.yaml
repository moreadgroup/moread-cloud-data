---
words:
  - word: 序
    type: 【名词】
    phonetic: XU4
    tags:
      - 高中
    samples:
      - trans: ❶隔开正堂与东西两室的墙。
        sentences:
          - ancient: 至则无以为居，居龙兴寺西序之下。（唐•柳宗元《永州龙兴寺西轩记》）
      - trans: ❷古代的地方学校。
        sentences:
          - ancient: 谨庠（xiang2,指学校）序之教，申之以孝悌（ti4,敬重兄长）之义；（《寡人之于国也》）
      - trans: ❸次序；秩序。
        sentences:
          - ancient: 长幼有序。（《荀子•君子》）
          - ancient: 日月忽其不淹兮，春与秋其代序。（《离骚》）
      - trans: ❹季节。
        sentences:
          - ancient: 四序有花长见雨，一冬无雪却闻雷。（唐•韩偓《登南神光寺塔院》）
          - ancient: 时维九月，序属三秋。（《滕王阁序》）
      - trans: ❺一种文体,赠序。如：唐•韩愈《送孟冬野序》、明•宋濂《送东阳马生序》。
      - trans: ❻通"叙"。序言,即评价介绍一部著作或一篇文章的文字。如:宋•文天祥《〈指南录〉后序》。

  - word: 序
    type: 【动词】
    phonetic: XU4
    tags:
      - 高中
    samples:
      - trans: ❶按次序排列。引申为统辖。
        sentences:
          - ancient: 然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣。（《过秦论》）
      - trans: ❷作序言。
        sentences:
          - ancient: 是年夏五，改元景炎,庐陵文天祥自序其诗，名曰《指南录》。（《〈指南录〉后序》）
      - trans: ❸通"叙"。叙说。
        sentences:
          - ancient: 会桃花之芳园，序天伦之乐事。（唐•李白《春夜宴从弟桃花园序》）
