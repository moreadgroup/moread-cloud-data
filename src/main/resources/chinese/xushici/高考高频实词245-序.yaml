---
words:
  - word: 序
    type: 【名词】
    phonetic: XU4
    tags:
      - 高中
    samples:
      - trans: ❶隔开正堂与东西两室的墙。
        sentences:
          - ancient: 至则无以为居，居龙兴寺西<序>之下。（唐•柳宗元《永州龙兴寺西轩记》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷古代的地方学校。
        sentences:
          - ancient: "谨庠（xiang2,指学校）<序>之教，申之以孝悌（ti4,敬重兄长）之义；（《寡人之于国也》）"
            url: xxxx
            vernacular: 注重乡校的教育，强调孝敬长辈的道理
      - trans: ❸次序；秩序。
        sentences:
          - ancient: 长幼有<序>。（《荀子•君子》）
            url: xxxx
            vernacular: 年长的和年少的、是有顺序的。
          - ancient: 日月忽其不淹兮，春与秋其代<序>。（《离骚》）
            url: xxxx
            vernacular: 时光迅速逝去不能久留，四季更相代谢变化有常。
      - trans: ❹季节。
        sentences:
          - ancient: 四<序>有花长见雨，一冬无雪却闻雷。（唐•韩偓《登南神光寺塔院》）
            url: xxxx
            vernacular: 四季草绿花开，一冬不见飘雪却雷声不断，这里没有冬天!
          - ancient: 时维九月，<序>属三秋。（《滕王阁序》）
            url: xxxx
            vernacular: 正当深秋九月之时
      - trans: "❺一种文体,赠序。如：唐•韩愈《送孟冬野序》、明•宋濂《送东阳马生序》。"
      - trans: "❻通\"叙\"。序言,即评价介绍一部著作或一篇文章的文字。如:宋•文天祥《〈指南录〉后序》。"
  - word: 序
    type: 【动词】
    phonetic: XU4
    tags:
      - 高中
    samples:
      - trans: ❶按次序排列。引申为统辖。
        sentences:
          - ancient: 然秦以区区之地，致万乘之势，<序>八州而朝同列，百有余年矣。（《过秦论》）
            url: xxxx
            vernacular: 然而秦凭借着它的小小的地方，发展到兵车万乘的国势，管辖全国，使六国诸侯都来朝见，已经一百多年了
      - trans: ❷作序言。
        sentences:
          - ancient: "是年夏五，改元景炎,庐陵文天祥自<序>其诗，名曰《指南录》。（《〈指南录〉后序》）"
            url: xxxx
            vernacular: 这一年夏天五月，改年号为景炎，庐陵文天祥为自己的诗集作序，诗集名《指南录》。
      - trans: ❸通"叙"。叙说。
        sentences:
          - ancient: 会桃花之芳园，<序>天伦之乐事。（唐•李白《春夜宴从弟桃花园序》）
            url: xxxx
            vernacular: 相聚在桃花飘香的花园中，畅叙兄弟间快乐的往事。
