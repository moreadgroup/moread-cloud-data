---
words:
  - word: 就
    type: 【动词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: ❶接近;趋向。
        sentences:
          - ancient: 望之不似人君，就之而不见所畏焉。（《孟子•梁惠王上》）
          - ancient: 故木受绳则直，金就砺（li，磨刀石）则利。（《劝学》）
          - ancient: 三径就荒，松菊犹存。（《归去来兮辞》）
          - ancient: 诚如是也,民归之，由水之就下，沛然谁能御之？（《孟子见梁襄王》）
      - trans: ❷登上;踏上。
        sentences:
          - ancient: 于是荆轲遂就车而去，终已不顾。（《荆轲刺秦王》）
      - trans: ❸前往。
        sentences:
          - ancient: 济沅湘以南征兮，就重华而陈词。（《离骚》）
          - ancient: 特以为智穷罪极，不能自免，卒就死耳。（《报任安书》）
          - ancient: 仆虽怯懦,欲苟活，亦颇识去就之分矣，何至自沉溺缧绁之辱哉!（《报任安书》）
          - ancient: 【高考题例】遣谒者内常侍吴承倩就私第宣慰。（《旧唐书-于休烈传》）
      - trans: ❹承受;接受。
        sentences:
          - ancient: 臣具以表闻，辞不就职。（《陈情表》）
          - ancient: 诚知其如此，虽万乘之公相，吾不以一日辍汝而就也。（《祭十二郎文》）
          - ancient: 臣知欺大王之罪当诛，臣请就汤镬。（《廉颇蔺相如列传》）
          - ancient: 是以就极刑而无愠色。（《报任安书》）
      - trans: ❺完成;形成。
        sentences:
          - ancient: 妖出，祸安得不就？（《论衡•异虚》）
          - ancient: 草创未就，会遭此祸，惜其不成。（《报任安书》）
          - ancient: 轲自知事不就，倚柱而笑。（《荆轲刺秦王》）
      - trans: ❻就职;赴任。
        sentences:
          - ancient: 永元中，举孝廉不行，连辟公府不就。（《张衡传》）
          - ancient: 周任有言曰："陈力就列，不能者止。"（《季氏将伐颛臾》）
  - word: 就
    type: 【副词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: 即；便。	举
        sentences:
          - ancient: 必以"文武"为谥，请依何等，就加诏许之，谥曰"忠武"。（《晋书•景帝纪》）
          - ancient: 及扑入手，已股落腹裂，斯须（一会儿）就毙。（《促织》）
  - word: 就
    type: 【介词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: 就着;根据。
        sentences:
          - ancient: 然就其不忘一芋，固已贤夫并老人而视芋之者。（清•周容《芋老人传》）
  - word: 就
    type: 【连词】
    phonetic: jiu4
    tags:
      - 高中
    samples:
      - trans: 假如；即使。
        sentences:
          - ancient: 法孝直若在，则能制主上令不东行;就复东行，必不倾危矣。（《三国志•蜀书•法正传》）
