否pi3



【动词】批评，评价人物的不好。
【高考题例】弘微口不言人短长，而曜好臧否人物，催每言论，弘微常以它语乱之。（《宋书•谢弘微传》）

【形容词】❶恶;坏。常与"臧""泰"连用，如成语"臧否人物""否极泰来"。
【例句】陟罚臧否，不宜异同。（《出师表》）
【高考题例】今贤否杂糅,风俗浇浮，兵未强,财未裕,宜卧薪尝胆以图内治。（《宋史•萧燧传》）
❷困厄;不顺。
【例句】否泰如天地,足以荣汝身。（《孔雀东南飞》）
❸闭塞;不通。
【例句】夫人道不通，则阴阳否鬲（同"隔"）。（《汉书•薛宣传》）

❹鄙陋无知。【例句】穷夫否妇，不知国家之虑。（《盐铁论•复古》）


