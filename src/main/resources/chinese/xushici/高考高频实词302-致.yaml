致zhi4
【名词】情致;情趣。
【例句】虽世殊事异，所以兴怀，其致一也。（《兰亭集序》）

【动词】❶给予;送给。
【例句】同志者或不远千里而致。（明•徐光启《甘薯疏序》）丨致敬亭于幕府。（《柳敬亭传》）丨于是有缚广武君而致戏下者，信乃解其缚，东乡坐，西乡对，师事之。（《史记•淮阴侯列传》）丨单于素闻广贤，令曰："得李广必生致之。"（《史记•李将军列传》）
❷归还;交回。
【例句】与子尾邑，受而稍致之。（《左传•襄公二十八年》）丨既而曰："若此乎，古之道不即人心。"退而致仕。（《公羊传•宣公元年》）
【高考题例】旋（不久）以太傅致仕，元丰元年卒，年八十。（《宋史•會公亮传》）	：
❸表达;表示。
【例句】其存君兴国而欲反复之,一篇之中三致志焉。（《史记•屈原贾生列传》）丨（鲁）肃宣（孙）权旨，论天下事势，致殷勤之意。（《资治通鉴•汉纪五十七》）丨季父愈闻汝丧之七日，乃能衔哀致诚。（《祭十二郎文》）
【高考题例】炀帝嗣位，被追入朝，百姓攀恋,累日不能出境，诣阙上书致请者,前后数百人。（《北史•来护儿传》）
❹到;达到。
【例句】假（借助）舆马者，非利足也，而致千里。（《劝学》）丨然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣。（《过秦论》）
❺得到;取得。
【例句】家贫，无从致书以观。（《送东阳马生序》）丨山阴李姓，以杀人系狱，每岁致数百金。（《狱中杂记》）
❻招致;招来。
【例句】乃致其父母昆弟而誓之。（《勾践灭吴》）丨彼于致福者,未数数然也。（《逍遥游》）丨诸侯恐惧，会盟而谋弱秦,不爱（吝惜）珍器重宝肥饶之地，以致天下之士。（《过秦论》）丨士以此方数千里争往归之，致食客三千人。（《史记•魏公子列传》）
❼致使;使得。
【例句】女行无偏斜，何意致不厚（生嫌结怨）？（《孔雀东南飞》）
❽用尽;献出。
【例句】夫民，神之主也，是以圣王先成民而后致力于神。（《左传•桓公六年》）丨事父母能竭其力，事君能致其身。（《论语•学而》）丨衡善机巧，尤致思于天文阴阳历算。（《张衡传》）丨薄衣食，致孝于鬼神。卑宫室，致费于沟淢（xu4,沟渠）。（《史记•夏本纪》）	."

【形容词】通"緻"。细密;细致。
【例句】案其狱，皆文致不可得反。（《汉书•严延年传》）

【副词】极;尽。
【例句】非致隆高也。（《荀子•仲尼》）

