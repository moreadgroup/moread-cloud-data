---
words:
  - word: 致
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 情致;情趣。
        sentences:
          - ancient: 虽世殊事异，所以兴怀，其致一也。（《兰亭集序》）

  - word: 致
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: ❶给予;送给。
        sentences:
          - ancient: 同志者或不远千里而致。（明•徐光启《甘薯疏序》）
          - ancient: 致敬亭于幕府。（《柳敬亭传》）
          - ancient: 于是有缚广武君而致戏下者，信乃解其缚，东乡坐，西乡对，师事之。（《史记•淮阴侯列传》）
          - ancient: 单于素闻广贤，令曰："得李广必生致之。"（《史记•李将军列传》）
      - trans: ❷归还;交回。
        sentences:
          - ancient: 与子尾邑，受而稍致之。（《左传•襄公二十八年》）
          - ancient: 既而曰："若此乎，古之道不即人心。"退而致仕。（《公羊传•宣公元年》）
          - ancient: 【高考题例】旋（不久）以太傅致仕，元丰元年卒，年八十。（《宋史•會公亮传》）	：
      - trans: ❸表达;表示。
        sentences:
          - ancient: 其存君兴国而欲反复之,一篇之中三致志焉。（《史记•屈原贾生列传》）
          - ancient: （鲁）肃宣（孙）权旨，论天下事势，致殷勤之意。（《资治通鉴•汉纪五十七》）
          - ancient: 季父愈闻汝丧之七日，乃能衔哀致诚。（《祭十二郎文》）
          - ancient: 【高考题例】炀帝嗣位，被追入朝，百姓攀恋,累日不能出境，诣阙上书致请者,前后数百人。（《北史•来护儿传》）
      - trans: ❹到;达到。
        sentences:
          - ancient: 假（借助）舆马者，非利足也，而致千里。（《劝学》）
          - ancient: 然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣。（《过秦论》）
      - trans: ❺得到;取得。
        sentences:
          - ancient: 家贫，无从致书以观。（《送东阳马生序》）
          - ancient: 山阴李姓，以杀人系狱，每岁致数百金。（《狱中杂记》）
      - trans: ❻招致;招来。
        sentences:
          - ancient: 乃致其父母昆弟而誓之。（《勾践灭吴》）
          - ancient: 彼于致福者,未数数然也。（《逍遥游》）
          - ancient: 诸侯恐惧，会盟而谋弱秦,不爱（吝惜）珍器重宝肥饶之地，以致天下之士。（《过秦论》）
          - ancient: 士以此方数千里争往归之，致食客三千人。（《史记•魏公子列传》）
      - trans: ❼致使;使得。
        sentences:
          - ancient: 女行无偏斜，何意致不厚（生嫌结怨）？（《孔雀东南飞》）
      - trans: ❽用尽;献出。
        sentences:
          - ancient: 夫民，神之主也，是以圣王先成民而后致力于神。（《左传•桓公六年》）
          - ancient: 事父母能竭其力，事君能致其身。（《论语•学而》）
          - ancient: 衡善机巧，尤致思于天文阴阳历算。（《张衡传》）
          - ancient: 薄衣食，<致>孝于鬼神。卑宫室，<致>费于沟淢（xu4,沟渠）。（《史记•夏本纪》）	."

