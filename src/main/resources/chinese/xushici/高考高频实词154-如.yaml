---
words:
  - word: 如
    type: 【动词】
    phonetic: ru2
    tags:
      - 高中
    samples:
      - trans: ❶往;到……去。
        sentences:
          - ancient: 坐须臾，沛公起如厕，因招樊哙出。（《鸿门宴》）
          - ancient: 纵一苇之所如，凌（越过）万顷之茫然。（《赤壁赋》）
          - ancient: 吾如淮阴，淮阴人为余言，韩信虽为布衣时，其志与众异。（《史记•淮阴侯列传》）
          - ancient: 至海陵，如高沙，常恐无辜死。（《〈指南录〉后序》）
      - trans: ❷按照;依照。
        sentences:
          - ancient: 成王在丰，使召公复营洛邑，如武王之意。（《史记•周本纪》）
          - ancient: 毅如其言，遂至其宫。（《柳毅传》）
          - ancient: 使者大喜，如惠语以让单于。（《苏武传》）
      - trans: ❸像;如同。
        sentences:
          - ancient: 从小丘西行百二十步，隔篁（竹林）竹，闻水声，如鸣珮环。（《小石潭记》）
          - ancient: 骨已尽矣而两狼之并驱如故。（《狼》）
      - trans: ❹及；比得上。
        sentences:
          - ancient: 沛公默然，曰："固不如也。且为之奈何?"（《鸿门宴》）
          - ancient: 是故弟子不必不如师。（《师说》）
      - trans: ❺引出举例。相当于"比如""譬如"。
        sentences:
          - ancient: 如平地三月花（开花）者，深山中则四月花。（《梦溪笔谈•药议》）

  - word: 如
    type: 【副词】
    phonetic: ru2
    tags:
      - 高中
    samples:
      - trans: 宜;应当。
        sentences:
          - ancient: 君若爱司马，则如亡。（《左传•昭公二十一年》）
          - ancient: 若知不能，则如无出。（《左传•成公二年》）

  - word: 如
    type: 【连词】
    phonetic: ru2
    tags:
      - 高中
    samples:
      - trans: ❶表示假设，假如;如果。
        sentences:
          - ancient: 洛阳亲友如相问，一片冰心在玉壶。（唐•王昌龄《芙蓉楼送辛渐》）
          - ancient: 若（刘）备与彼协心，上下齐同，则宜抚安，与结盟好;如有离违，宜别图之，以济大事。（《资治通鉴•汉纪五十七》）
      - trans: ❷表示选择。或者。
        sentences:
          - ancient: 宗庙之事，如会同，端章甫，愿为小相焉。（《子路、曾晳、冉有、公西华侍坐》）
          - ancient: 安见方六七十，如五六十，而非邦也者？（《子路、曾晳、冉有、公西华侍坐》）
      - trans: ❸表示连接。和;与。
        sentences:
          - ancient: 公如大夫入。（《仪礼•乡饮酒礼》）
      - trans: ❹表示转折。然而;而。
        sentences:
          - ancient: 乡是如不臧，倍（通"背"）是如不亡者，自古及今，未尝有也。（《荀子•儒效》）
          - ancient: 民之政计，皆就安利，如辟（通"避"）危穷。（《韩非子•五蠹》）

  - word: 如
    type: 【助词】
    phonetic: ru2
    tags:
      - 高中
    samples:
      - trans: 用于形容词后，表示"••••••的样子"。
        sentences:
          - ancient: 朝，与下大夫言，侃侃（理直气壮）如也；与上大夫言，訚訚（yin2，和颜悦色）如也。（《论语・乡党》）
          - ancient: 仁义之人，其言蔼如（和顺的样子）也。（《答李翊书》）
          - ancient: 短褐穿结，箪瓢屡空，晏如也。（《五柳先生传》）
          - ancient: 乐其可知也。始作翕如，纵之纯如，皦如，绎如也，以成。（《史记•孔子世家》）
          - ancient: 仁而爱人，喜施，意豁如也。（《史记•高祖本纪》）
