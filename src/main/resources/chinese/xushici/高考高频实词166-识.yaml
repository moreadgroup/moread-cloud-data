识㊀shi2
【名词】❶知己；朋友。
【例句】异乡无旧识，车马到门稀。（唐•刘禹锡《元日感怀》）
❷知识;见识。
【例句】鄙夫寡识，而今而后，乃知大汉之德馨，咸（全）在于此。（汉•张衡《东京赋》）
❸思想意识。
【例句】固知识能匡欲者鲜矣。（《后汉书•马融传》）

【动词】❶知道;懂得。
【例句】而今识尽愁滋味，欲说还休。（宋•辛弃疾《丑奴儿•书博山道中壁》）丨仆虽怯懦,欲苟活，亦颇识去就之分（分fen4,去辱就义的道理）矣。（《报任安书》）
❷熟悉;认识。
【例句】为宫室之美、妻妾之奉、所识，穷乏者得（同"德"，感激）我与？（《鱼我所欲也》）丨同是天涯沦落人，相逢何必曾相识！（《琵琶行》）丨雁过也，正伤心,却是旧时相识。（《声声慢》）

识㊁zhi4
【名词】通"帜"。标志;记号。
【例句】讫无文号旌旗表识。（《汉书•王莽传》）
【动词】通"志"。记住。
【例句】默而识之，学而不厌（满足），诲人不倦，何有于我哉！（《论语・学而》）丨因笑谓迈（人名）曰："汝识之乎？"（《石钟山记》）