---
words:
  - word: 识
    type: 【名词】
    phonetic: shi2
    tags:
      - 高中
    samples:
      - trans: ❶知己；朋友。
        sentences:
          - ancient: 异乡无旧识，车马到门稀。（唐•刘禹锡《元日感怀》）
      - trans: ❷知识;见识。
        sentences:
          - ancient: 鄙夫寡识，而今而后，乃知大汉之德馨，咸（全）在于此。（汉•张衡《东京赋》）
      - trans: ❸思想意识。
        sentences:
          - ancient: 固知识能匡欲者鲜矣。（《后汉书•马融传》）

  - word: 识
    type: 【动词】
    phonetic: shi2
    tags:
      - 高中
    samples:
      - trans: ❶知道;懂得。
        sentences:
          - ancient: 而今识尽愁滋味，欲说还休。（宋•辛弃疾《丑奴儿•书博山道中壁》）
          - ancient: 仆虽怯懦,欲苟活，亦颇识去就之分（分fen4,去辱就义的道理）矣。（《报任安书》）
      - trans: ❷熟悉;认识。
        sentences:
          - ancient: 为宫室之美、妻妾之奉、所识，穷乏者得（同"德"，感激）我与？（《鱼我所欲也》）
          - ancient: 同是天涯沦落人，相逢何必曾相识！（《琵琶行》）
          - ancient: 雁过也，正伤心,却是旧时相识。（《声声慢》）

  - word: 识
    type: 【名词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 通"帜"。标志;记号。
        sentences:
          - ancient: 讫无文号旌旗表识。（《汉书•王莽传》）

  - word: 识
    type: 【动词】
    phonetic: zhi4
    tags:
      - 高中
    samples:
      - trans: 通"志"。记住。
        sentences:
          - ancient: 默而识之，学而不厌（满足），诲人不倦，何有于我哉！（《论语・学而》）
          - ancient: 因笑谓迈（人名）曰："汝识之乎？"（《石钟山记》）