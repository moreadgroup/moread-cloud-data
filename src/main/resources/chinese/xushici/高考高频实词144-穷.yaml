---
words:
  - word: 穷
    type: 【名词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: 尽头。
        sentences:
          - ancient: 天高地迥（远），觉宇宙之无穷；兴尽悲来，识盈虚（盈满和亏损）之有数。（《滕王阁序》）
          - ancient: 四时之景不同，乐亦无穷也。（《醉翁亭记》）

  - word: 穷
    type: 【动词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: ❶极;尽。
        sentences:
          - ancient: 而世又不与能死节者比，特以为智穷罪极,不能自免，卒就死耳。（《报任安书》）
          - ancient: 轲既取图奉之，发图，图穷而匕首见。（《荆轲刺秦王》）
      - trans: ❷寻求尽头;到达尽头。
        sentences:
          - ancient: 渔人甚异之,复前行，欲穷其林。（《桃花源记》）
          - ancient: 问其深，则其好游者不能穷也。（《游褒禅山记》）
      - trans: ❸追究到底。
        sentences:
          - ancient: 事之至难解者，问之人以穷其短。（清•刘开《问说》）
      - trans: ❹用尽。
        sentences:
          - ancient: 穷予生之光阴以疗梅也哉！（《病梅馆记》）
      - trans: ❺遍及。
        sentences:
          - ancient: 渔舟唱晩，响穷彭蠡之滨。（《滕王阁序》）

  - word: 穷
    type: 【形容词】
    phonetic: qiong2
    tags:
      - 高中
    samples:
      - trans: ❶走投无路，陷入困境。
        sentences:
          - ancient: 人穷则反本，故劳苦倦极，未尝不呼天也。（《史记•屈原贾生列传》）
          - ancient: 穷且益坚，不坠青云之志。（《滕王趋阁序》）
          - ancient: 穷则独善其身，达（得志）则兼济天下。（《孟子・尽心上》）
          - ancient: 人情同于怀土兮，岂穷达而异心？（汉•王粲《登楼赋》）
          - ancient: 樊将军以穷困来归丹，丹不忍以己之私，而伤长者之意，愿足下更虑之！（《荆轲刺秦王》）
      - trans: ❷生活贫穷。
        sentences:
          - ancient: 为宫室之美、妻妾之奉、所识穷乏者得（通"德"，感恩）我与？（《鱼我所欲也》）
          - ancient: 子孙习其家凤，今多穷困。（《训俭示康》）
