---
words:
  - word: 无
    type: 【动词】
    phonetic: WU2
    tags:
      - 高中
    samples:
      - trans: 没有（与"有"相对）。
        sentences:
          - ancient: 夫虽无四方之忧,然谋臣与爪牙（武臣，武将）之士,不可不养而择也。（《勾践灭吴》）
          - ancient: 故白：至人无己，神人无功，圣人无名。（《逍遥游》）
          - ancient: 屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？（《滕王阁序》）

  - word: 无
    type: 【代词】
    phonetic: WU2
    tags:
      - 高中
    samples:
      - trans: 表示无指,没有人，没有东西。
        sentences:
          - ancient: 相人（为他人看相）多矣，无如季（刘邦）相（相貌）。（《史记•"高祖本纪》）
          - ancient: 我则异于是，无可无不可。（《论语•微子》）
          - ancient: 婉贞挥刀奋斫（zhuo2,砍），所当无不披靡（倒下）。（《冯婉贞》）

  - word: 无
    type: 【副词】
    phonetic: WU2
    tags:
      - 高中
    samples:
      - trans: ❶放在动词之前表示否定。相当于"不""没有"。
        sentences:
          - ancient: 行离理而不外危者，无之有也。（《荀子•正名》）
          - ancient: 诸将既经累（多次）捷，胆气益壮，无不一当百。（《后汉书•光武帝纪》）
          - ancient: 人曰："何不试之以足?"曰："宁信度（计算长短的工具），无自信也。"（《韩非子•外储说左上》）
          - ancient: 因令韩庆入秦，而使三国无攻秦。（《战国策•西周策》）
      - trans: ❷通"毋"。表示禁止。相当于"不要"。
        sentences:
          - ancient: 硕鼠硕鼠，无食我黍。（《诗经•魏风•硕鼠》）
          - ancient: 苟（如果）富贵，无相忘。（《陈涉世家》）
          - ancient: 王无罪岁，斯天下之民至焉。（《寡人之于国也》）
          - ancient: 王如知此，则无望民之多于邻国也。（《寡人之于国也》）

  - word: 无
    type: 【连词】
    phonetic: WU2
    tags:
      - 高中
    samples:
      - trans: ❶表示排除任何条件。相当于"不论"""无论"。
        sentences:
          - ancient: 人君无愚智贤不肖，莫不欲求忠以自为，举贤以自佐。（《史记•屈原贾生列传》）
          - ancient: 是故无贵无贱，无长无少,道之所存,师之所存也。（《师说》）
          - ancient: 公子为人仁而下士，士无贤不肖皆谦而礼交之,不敢以其富贵骄士。（《史记•魏公子列传》）
      - trans: ❷表示假设关系。相当于"即使"。
        sentences:
          - ancient: 国无小，不可易也。（《左传•僖公二十二年》）

  - word: 无
    type: 【助词】
    phonetic: WU2
    tags:
      - 高中
    samples:
      - trans: ❶用于句首，无实义。
        sentences:
          - ancient: 无念尔祖。（《诗经•大雅•文王》）
      - trans: ❷用于句末，表示疑问。
        sentences:
          - ancient: 江花未落还成都，肯访浣花老翁无？（唐•杜甫《入奏行赠西山检察使窦侍御》）