---
words:
  - word: 资
    type: 【名词】
    phonetic: Zi1
    tags:
      - 高中
    samples:
      - trans: ❶财物;物资。
        sentences:
          - ancient: 孤当续发人众，多载资粮，为卿后援。（《资治通鉴•汉纪五十七》）
          - ancient: 成妻具资诣问。（《促织》）
          - ancient: 既至秦，持千金之资币物，厚遗秦王宠臣中庶子蒙嘉。（《荆轲刺秦王》）
      - trans: ❷凭借的条件;依托的资本。
        sentences:
          - ancient: 荆州与国邻接，江山险固，沃野万里，士民殷富，若据而有之，此帝王之资也。（《资治通鉴•汉纪五十七》）
      - trans: ❸资历;声望。
        sentences:
          - ancient: （袁）绍凭世资，从容饰智，以收名誉。（《三国志•魏书•荀彧传》）
      - trans: ④资质;禀赋。
        sentences:
          - ancient: （王）嘉资性邪僻。（《汉书•袭胜传》）

  - word: 资
    type: 【动词】
    phonetic: Zi1
    tags:
      - 高中
    samples:
      - trans: ❶积蓄;储备。
        sentences:
          - ancient: 臣闻之，贾人夏则资皮，冬则资絺（chi1），旱则资舟，水则资车，以待乏也。（《勾践灭吴》）
          - ancient: 嬴闻如姬父为人所杀，如姬资之三年，自王以下欲求报其父仇，莫能得。（《史记・魏公子列传》）
      - trans: ❷供给;资助。
        sentences:
          - ancient: 于是资苏秦车马金帛以至赵。（《史记•苏秦列传》）
          - ancient: 而其主不能守，此殆天所以资将军，将军岂有意乎？（《隆中对》）
          - ancient: 连结一人之后交，不顾国家之大害，此所谓华"资怨而助祸"矣。（《史记•刺客列传》）
      - trans: ❸凭借;依托。
        sentences:
          - ancient: 大哉乾元，万物资始。（《周易•乾卦》）
          - ancient: 昔仲尼资大圣之才,怀帝王之器。（《三国志•魏书•文帝纪》）