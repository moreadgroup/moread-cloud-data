资Zi1
【名词】❶财物;物资。
【例句】孤当续发人众，多载资粮，为卿后援。（《资治通鉴•汉纪五十七》）丨成妻具资诣问。（《促织》）丨既至秦，持千金之资币物，厚遗秦王宠臣中庶子蒙嘉。（《荆轲刺秦王》）
❷凭借的条件;依托的资本。
【例句】荆州与国邻接，江山险固，沃野万里，士民殷富，若据而有之，此帝王之资也。（《资治通鉴•汉纪五十七》）
❸资历;声望。
【例句】（袁）绍凭世资，从容饰智，以收名誉。（《三国志•魏书•荀彧传》）
4资质;禀赋。
【例句】（王）嘉资性邪僻。（《汉书•袭胜传》）
【动词】❶积蓄;储备。
【例句】臣闻之，贾人夏则资皮，冬则资絺（chi1），旱则资舟，水则资车，以待乏也。（《勾践灭吴》）丨嬴闻如姬父为人所杀，如姬资之三年，自王以下欲求报其父仇，莫能得。（《史记・魏公子列传》）
❷供给;资助。
【例句】于是资苏秦车马金帛以至赵。（《史记•苏秦列传》）丨而其主不能守，此殆天所以资将军，将军岂有意乎？（《隆中对》）丨连结一人之后交，不顾国家之大害，此所谓华"资怨而助祸"矣。（《史记•刺客列传》）
❸凭借;依托。
【例句】大哉乾元，万物资始。（《周易•乾卦》）丨昔仲尼资大圣之才,怀帝王之器。（《三国志•魏书•文帝纪》）