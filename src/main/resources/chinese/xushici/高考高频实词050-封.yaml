---
words:
  - word: 封
    type: 【名词】
    phonetic: feng1
    tags:
      - 高中
    samples:
      - trans: ❶边界;疆界。
        sentences:
          - ancient: 又欲肆其西封，若不阙秦，将焉取之？（《烛之武退秦师》）
          - ancient: 然县越其封，郡逾其境。（宋•欧阳修《上范司谏书》）
          - ancient: 越四封之内，亲吾君也，犹父母也。（《勾践灭吴》）
      - trans: ❷坟冢。
        sentences:
          - ancient: 而五人亦得以加其土封,列其姓名于大堤之上，凡四方之士无不有过而拜且泣者，斯固百世之遇也。（《五人墓碑记》）

  - word: 封
    type: 【动词】
    phonetic: feng1
    tags:
      - 高中
    samples:
      - trans: ❶使……成为疆界。
        sentences:
          - ancient: 既东封郑。（《烛之武退秦师》）
      - trans: ❷帝王授予臣子土地或爵位。
        sentences:
          - ancient: 劳苦而功高如此,未有封侯之赏，而听细说（小人的谗言），欲诛有功之人，此亡秦之续耳。（《鸿曲壹》）
          - ancient: 以赂秦之地，封天下之谋臣。（《六国论》）
          - ancient: 冯唐易老，李广难封。（《滕王阁序》）
          - ancient: 【高考题例】卫鞅既破魏还，秦封之於、商十五邑，号为商君。（《史记.商君列传》）
      - trans: ❸封闭;封缄。
        sentences:
          - ancient: 吾入关，秋毫不敢有所近,籍吏民，封府库,而待将军。（《鸿门宴》）
          - ancient: 取案末独身无亲戚者二人易汝名，俟封奏时潜易之而已。（《狱中杂记》）
          - ancient: 既已，无可奈何,乃遂收奉盛樊於期之首，函封之。（《荆轲刺秦王》）
      - trans: ❹古代帝王在山上筑坛祭天。
        sentences:
          - ancient: 今天子接千岁之统,封泰山，而余不得从行,是命也夫，命也夫！（《史记•太史公自序》）
          - ancient: 元嘉草草，封狼居胥（山名），赢得仓皇北顾。（《永遇乐•京口北固亭怀古》）