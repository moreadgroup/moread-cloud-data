    tags:
      - 高中
    samples:
      - trans: 讨厌;憎恨;嫉妒。
        sentences:
          - ancient: 夫人情莫不贪生<恶>死。（《报任安书》）
            url: xxxx
            vernacular: 人之常情，没有谁不贪生怕死的
          - ancient: 帝引在帷幄，讽议左右。尝问天下所疾<恶>者。（《张衡传》）
            url: xxxx
            vernacular: 皇帝让他进皇宫，在皇帝左右，对国家的政事提意见。皇帝曾经向张衡问起天下人所痛恨的是谁。
          - ancient: 刘备天下枭雄，与操有隙，寄寓于（刘）表，表<恶>其能而不能用也。（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 刘备是天下的枭雄，与曹操有隔阂。依附投靠于刘表。刘表嫉妒他的才能而不重用他。
          - ancient: 【高考题例】元载以罪诛，除揆睦州刺史，入拜国子祭酒、礼部尚书，为卢杞所<恶>。（《旧唐书•李揆传》）
            url: xxxx
            vernacular: 元载因罪被杀后，朝廷任命李揆为睦州刺史，又入京担任国子祭酒、礼部尚书，被宰相卢杞所嫉恨。
