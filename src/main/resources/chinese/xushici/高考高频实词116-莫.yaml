---
words:
  - word: 莫
    type: 【代词】
    phonetic: mo4
    tags:
      - 高中
    samples:
      - trans: 没有谁;没有什么。
        sentences:
          - ancient: 溥天之下，莫非王土；率土之滨，莫非王臣。（《诗经•小雅•北山》）
          - ancient: 非刘豫州莫可以当曹操者，然豫州新败之后，安能抗此难乎？（《资治通鉴•汉纪五十七》）
          - ancient: 时天下承平日久，自王侯以下莫不逾侈。（《张衡传》）
          - ancient: 如使人之所欲莫甚于生。（《鱼我所欲也》）
          - ancient: 【高考题例】百姓市道莫不咨嗟。（《后汉书•王涣传》）
          - ancient: 【高考题例】弘微少孤，事兄如父，兄弟友穆之至,举世莫及也。（《宋书•谢弘微传》）	

  - word: 莫
    type: 【副词】
    phonetic: mo4
    tags:
      - 高中
    samples:
      - trans: ❶不。
        sentences:
          - ancient: 一夫当关，万夫莫开。（《蜀道难》）
          - ancient: 苟非吾之所有,虽一毫而莫取。（《赤壁赋》）
      - trans: ❷不要。
        sentences:
          - ancient: 莫辞更坐弹一曲，为君翻作《琵琶行》。（《琵琶行》）
          - ancient: 愿早定大计，莫用众人之议也。（《资治通鉴•汉纪五十七》）
      - trans: ❸大约。
        sentences:
          - ancient: 文,莫吾犹人也。躬行君子，则吾未之有得。（《论语•述而》）
  - word: 莫
    type: 【名词】
    phonetic: mu4
    tags:
      - 高中
    samples:
      - trans: ❶日落之时;傍晚。"暮"字的古体。
        sentences:
          - ancient: 日莫人倦。（《礼记•聘义》）
          - ancient: 至莫夜月明，独与迈乘小舟，至绝壁下。（《石钟山记》）
          - ancient: 莫春者，春服既成。（《子路、曾晳、冉有、公西华侍坐》）
      - trans: ❷通"幕"。幕府。
        sentences:
          - ancient: 大将军不听，令长史封书与广之莫府。（《史记•李将军列传》）
      - trans: ❸多年生草本植物，嫩叶、嫩茎可做蔬菜。
        sentences:
          - ancient: 彼汾沮洳（ru4,泥沼），言釆其莫。（《诗经•魏风•汾沮洳》）【形容词】❶昏暗；昏黑。
          - ancient: 于是榛林深泽，烟云闇（an4,黑暗）莫。（汉•枚乘《七发》）
      - trans: ❷年老。
        sentences:
          - ancient: 臣迫于衰莫。（宋•王安石《谢宣医札子》）