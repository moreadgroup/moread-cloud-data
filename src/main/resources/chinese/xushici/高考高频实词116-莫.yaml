      - trans: 没有谁;没有什么。
        sentences:
          - ancient: 溥天之下，<莫>非王土；率土之滨，<莫>非王臣。（《诗经•小雅•北山》）
            url: xxxx
            vernacular: 你看广褒无垠的普天之下，没有一处不是国君的封土；你看各处封土的天边尽头，没有一人不是国君的奴仆。
          - ancient: 非刘豫州<莫>可以当曹操者，然豫州新败之后，安能抗此难乎？（《资治通鉴•汉纪五十七》）
            url: xxxx
            vernacular: 不是说刘豫州抵挡不了曹操;但是豫州刚刚打了败仗,又怎么能抵挡这劫难呢?
          - ancient: 时天下承平日久，自王侯以下<莫>不逾侈。（《张衡传》）
            url: xxxx
            vernacular: 此时社会长期太平无事，从王公贵族到一般官吏，没有不过度奢侈的。
          - ancient: 如使人之所欲<莫>甚于生，则凡可以得生者何不用也？（《鱼我所欲也》）
            url: xxxx
            vernacular: 如果人们所喜爱的东西没有超过生命的，那么凡是能够用来求得生存的手段,有什么不可以使用呢?
          - ancient: 【高考题例】百姓市道<莫>不咨嗟。（《后汉书•王涣传》）
            url: xxxx
            vernacular: 百姓在市中和路上没有不叹息的。
          - ancient: "【高考题例】弘微少孤，事兄如父，兄弟友穆之至，举世<莫>及也。（《宋书•谢弘微传》）"
            url: xxxx
            vernacular: 谢弘微从小失去父母，事奉兄长如同事奉父亲，兄弟之间非常友爱和睦，当代没有人能够赶得上。
