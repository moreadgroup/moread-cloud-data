---
words:
  - word: 图
    type: 【名词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶图画。
        sentences:
          - ancient: 五色纷披，灿若图绣。（明•徐霞客《游黄山日图记》）丨（成名）乃强起扶杖，执图诣寺后，有古陵蔚起（高高隆起）。（《促织》）
      - trans: ❷地图；图册。
        sentences:
          - ancient: 召有司案图，指从此以往十五都（城）予赵。（《廉颇蔺相如列传》）丨温州雁荡山，天下奇秀，然自古图牒，未尝有言者。（《梦溪笔谈•杂志一》）丨轲既取图奉之，发图，图穷而匕首见。（《荆轲刺秦王》）
      - trans: ❸法度。
        sentences:
          - ancient: 章画志墨兮，前图未改。（战国楚•屈原《九章•怀沙》）
      - trans: ❹计谋;计划。
        sentences:
          - ancient: 奇锋震敌，远图谋国。（《后汉书•贾复传》）

  - word: 图
    type: 【动词】
    phonetic: tu2
    tags:
      - 高中
    samples:
      - trans: ❶考虑;谋划。
        sentences:
          - ancient: 衡常思图身之事,以为吉凶倚伏，幽微难明（幽深微妙难以看清），乃作《思玄赋》以宣（表达）寄（寄托）情志。（《张衡传》）丨阙秦以利晋，唯君图"之。（《烛，武退秦师》）丨入则与王图议国事，以出号令。（《史记•屈原贾生列传》）丨事急矣！惟先生速图！（《中山狼传》）
      - trans: ❷图谋;谋取。
        sentences:
          - ancient: 吾为公从中起，天下可图也。（《史记•淮阴侯列传》）丨且臣少仕伪朝，历职郎署，本图宦达，不矜（自夸）名节。（《陈情表》）丨此可以为援而不可图也。（"《窿中对》）
          - ancient: 【高考题例】夫鲁小国，而有战胜之名，则诸侯图鲁矣。（《史记•孙子吴起列传》）丨今贤否杂糅，风俗浇浮，兵未强，财末裕，宜卧薪尝胆以图内治。（《宋史•萧燧传》）
      - trans: ❸绘画。
        sentences:
          - ancient: 直以彩色图之。（《梦溪笔谈•书画》）
      - trans: ❹预料;料想。
        sentences:
          - ancient: 阿母大拊掌,不图子自归。（《孔雀东南飞》）
