---
words:
  - word: 市
    type: 【名词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: 集中做买卖的场所;市场。
        sentences:
          - ancient: 令初下，群臣进谏，门庭若<市>。（《邹忌讽齐王纳谏》）
            url: xxxx
            vernacular: 政令刚一下达，许多大臣都来进献谏言，宫门和庭院像集市一样热闹
          - ancient: 东<市>买骏马，西<市>买鞍鞯（jian1，垫马鞍的东西），南<市>买辔头，北<市>买长鞭。（《木兰诗》）
            url: xxxx
            vernacular: 在集市各处购买骏马、马鞍、鞍下的垫子、马嚼子、缰绳和马鞭。
          - ancient: 管弦呕哑，多于<市>人之言语。（《阿房宫赋》）
            url: xxxx
            vernacular: 管弦的声音嘈杂，比市民的言语还多。
          - ancient: <市>列珠玑，户盈罗绮，竞豪奢。（宋•柳永《望海潮》）
            url: xxxx
            vernacular: 市场上陈列着琳琅满目的珠玉珍宝，家家户户都存满了绫罗绸缎，争相比奢华。
  - word: 市
    type: 【动词】
    phonetic: shi4
    tags:
      - 高中
    samples:
      - trans: ❶卖。
        sentences:
          - ancient: 故<市>木之价不加贵于山。（《韩非子•外储说右上》）
            url: xxxx
            vernacular: 所以集市上木头的价格不比山上的贵
          - ancient: 其水斗价三贯，而取者益之他水，沿途转以<市>人，老病饮之，多至危笃。（唐•李德裕《亳州圣水状》）
            url: xxxx
            vernacular: 这种水的价格是三贯，但是取水的人会将其掺杂其他水源，然后转手卖给市民。老年和病弱者喝了这种水后，很多人都患上了危重疾病。
      - trans: ❷买。
        sentences:
          - ancient: 杂彩三百匹，交广<市>鲑（xie2，鱼类菜肴）珍。（《孔雀东南飞》）
            url: xxxx
            vernacular: 各种花色的绸缎三百匹，还派人到交州广州购来海味和山珍。
          - ancient: 阿爷无大儿，木兰无长兄，愿为<市>鞍马，从此替爷征。（《木兰诗》）
            url: xxxx
            vernacular: 父亲没有长大成人的儿子，木兰没有兄长，木兰愿意去买来马鞍和马匹，从此替父亲去出征。
          - ancient: 责（债务）毕收，以何<市>而反（返回）？（《冯谖客孟尝君》）
            url: xxxx
            vernacular: 债收完了，买什么回来？
      - trans: ❸交易;做买卖。
        sentences:
          - ancient: 日中为<市>，致天下之民，聚天下之货。（《周易•系辞下》）
            url: xxxx
            vernacular: 神农氏在中午开设集市，招引各地的民众，集聚了各地的货物。
          - ancient: 及滑，郑贾人弦高将<市>于周，遇之，以乘韦先，以十二牛劳（犒劳）秦师。（《史记•晋世家》）
            url: xxxx
            vernacular: 经过滑国的时候，郑国商人弦高将要到周都城去做买卖，在这里遇到秦军。先送上四张熟牛皮，再送十二头牛慰劳秦军
      - trans: ❹换取;求得。
        sentences:
          - ancient: 美言可以<市>尊，美行可以加人。（《老子》六十二章）
            url: xxxx
            vernacular: 美好的言辞可以换来别人对你的尊重；美好的行为可以勉励他人。
          - ancient: 君何不留楚太子，以<市>其下东国。（《战国策•齐策三》）
            url: xxxx
            vernacular: 阁下何不扣留楚太子，用他与楚国交换下东国之地呢？
