---
words:
  - word: 涕
    type: 【名词】
    phonetic: ti4
    tags:
      - 高中
    samples:
      - trans: ❶眼泪。
        sentences:
          - ancient: 长太息以掩涕兮，哀民生之多艰。（《离骚》）
          - ancient: 乘彼垝垣，以望复关。不见复关，泣涕涟涟。（《诗经•卫风•氓》）
          - ancient: 出门登车去，涕落百余行。（《孔雀东南飞》）
          - ancient: 蒋氏大戚（悲伤），汪然出涕曰……（《捕蛇者说》）
          - ancient: 【高考题例】或为之涕流，感弘微之义也。（《宋书•谢弘微传》）
      - trans: ❷鼻涕。
        sentences:
          - ancient: 目泪下落,鼻涕长一尺。（汉•王褒《僮约》）

  - word: 涕
    type: 【动词】
    phonetic: ti4
    tags:
      - 高中
    samples:
      - trans: 流泪;哭。
        sentences:
          - ancient: 高渐离击筑，荆轲和而歌，为变徴之声，士皆垂泪涕泣。（《荆轲刺秦王》）
          - ancient: 儿涕而去。（《促织》）
          - ancient: 【高考题例】因悲涕伏地不能起。（《宋史•康保裔传》）
