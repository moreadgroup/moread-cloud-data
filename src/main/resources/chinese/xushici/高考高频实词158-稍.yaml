---
words:
  - word: 稍
    type: 【名词】
    phonetic: shao1
    tags:
      - 高中
    samples:
      - trans: ❶禾的末梢。
        sentences:
          - ancient: 四郊之赋，以待稍秣。（《周礼•天官•大府》）
      - trans: ❷周代离王城三百里的地域。
        sentences:
          - ancient: 稍人下士四人。（《周礼•地官•序官》）
      - trans: ❸官府发给的粮食。
        sentences:
          - ancient: 今诸生学于太学，县官日有廩稍之供，父母岁有裘葛之遗（wei4，送），无冻馁之患矣。（《送东阳马生序》）
  - word: 稍
    type: 【动词】
    phonetic: shao1
    tags:
      - 高中
    samples:
      - trans: 通"捎"。捎带。
        sentences:
          - ancient: 他如今去汴梁做买卖，我写一封书稍将去。（元•关汉卿《救风尘》二折）
  - word: 稍
    type: 【形容词】
    phonetic: shao1
    tags:
      - 高中
    samples:
      - trans: 小。
        sentences:
          - ancient: 凡王之稍事，设荐脯醢。（《周礼•天官•膳夫》）

  - word: 稍
    type: 【副词】
    phonetic: shao1
    tags:
      - 高中
    samples:
      - trans: ❶逐渐。
        sentences:
          - ancient: 稍出近之，慭慭然（愁yin4，小心谨慎的样子），莫相知。（《黔之妒》）
          - ancient: 稍见云中白若樗蒱（chu1pu2，指—种赌具）数十立者，山也。（《登泰山沱》）
          - ancient: 少以父任，兄弟并为郎。稍迁至栘中厩监。（《苏武传》）
          - ancient: 夫人不能早自裁绳墨之外，以稍陵迟，至于鞭箠之间，乃欲引节，斯不亦远乎！（《报任安书》）
          - ancient: 可急使兵守函谷关，无内诸侯军，稍征关中兵以自益，距之。（《史记•高祖本纪》）
          - ancient: 【高考题例】贾生数（多次）上疏，言诸侯或（有的）连数郡，非古，之制，可稍削之。（《史记•屈原贾生列传》）
      - trans: ❷颇;很。
        sentences:
          - ancient: 落花纷纷稍觉多，美人欲醉朱颜酡（tuo2，酒醉后脸色发红）。（唐•李白《前有樽酒行》之一），
      - trans: ❸稍微。
        sentences:
          - ancient: 录毕，走送之，不敢稍逾约。（《送东阳马生序》）
          - ancient: 余稍为修葺，使不上漏。（《项脊轩志》）
          - ancient: 【高考题例】萍寄（像浮萍一样漂泊托身）诸州，凡十五六年，其牧守稍薄，则又移居，故其迁徙者，盖（大概）十余州焉。（《旧唐书•李揆传》）