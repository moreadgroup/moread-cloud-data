少㊀shao3
【动词】❶缺少;不够。
【例句】今少一人，愿君即以遂（毛遂自称）备员而行矣。（《史记•平原君虞卿列传》）丨遥知兄弟登高处，遍插茱萸少一人。（唐•王维《九月九日忆山东兄弟》）
❷轻视;贬低。
【例句】且夫我尝闻少仲尼之闻而轻伯夷之义者,始吾弗信。（《秋水》）
❸削弱;减少。
【例句】欲天下之治安，莫若众建诸侯而少其力。（汉•贾谊《陈政事疏》）丨邻国之民不加少，寡人之民不加多,何也？（《寡人之于国也》）

【形容词】❶数量少（与"多"相对）。
【例句】义不杀少而杀众,不可谓知类。（《公输》）丨然视其左右，来而记之者已少。（《游褒禅山记》）
❷薄弱;小。
【例句】力少而不畏强。（《韩非子.亡征》）	

【副词】❶稍;略微。
【例句】北蛮夷之鄙人，未尝见天子，故振慑,愿大王少假借之,使毕使于前。（《荆轲刺秦王》）丨断头置城上，颜色不少变。（《五人墓碑记》）丨日三四里，少益耆食，和于身。（《触龙说赵太后》）
【高考题例】贼怒,碎其首，缚诸（之于）檣丛射之,骂贼不少变，至死声犹（仍）壮，年三十有九。（《明史•花云传》）
❷不多时;一会儿。
【例句】少则洋洋焉，攸然（自得的样子）而逝。（《孟子•万章上》）丨少焉，月出于东山之上，徘徊于斗牛之间。（《赤壁赋》）

少@shao4
【名词】青年人。
顶句群贤毕至,少长咸（全）集。（《兰亭集序》）

【形容词】❶年幼。
【例句】陈涉少时,尝与人佣耕。（《陈涉世家》）丨是故无贵无贱，无长无少，道之所存，师之所存也。（《师说》）丨子卿妇年少，闻已更嫁矣。（《苏武传》）丨老臣贱息（儿子）舒祺,最少,不肖。（《触龙说赵太后》）丨吾闻二世少子也，不当立。（《陈涉世家》）
❷副的（职位）。
【例句】于是为置三少……曰少保、少傅、少师。（《汉书•贾谊传》）
