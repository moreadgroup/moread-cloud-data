      - trans: 青年人。
        sentences:
          - ancient: 群贤毕至，<少>长咸（全）集。（《兰亭集序》）
            url: xxxx
            vernacular: 诸多贤士能人都汇聚到这里，年长、年少者都聚集在这里。
  - word: 少
    type: 【形容词】
    phonetic: shao4
    tags:
      - 高中
    samples:
      - trans: ❶年幼。
        sentences:
          - ancient: 陈涉<少>时，尝与人佣耕。（《陈涉世家》）
            url: xxxx
            vernacular: 陈胜年轻时，曾同别人一起被雇佣给人耕地
          - ancient: 是故无贵无贱，无长无<少>，道之所存，师之所存也。（《师说》）
            url: xxxx
            vernacular: 因此，无论地位高低贵贱，无论年纪大小，道理存在的地方，就是老师存在的地方。
          - ancient: 子卿妇年<少>，闻已更嫁矣。（《苏武传》）
            url: xxxx
            vernacular: 你的夫人年纪还轻，听说已改嫁了
          - ancient: 老臣贱息（儿子）舒祺，最<少>，不肖。（《触龙说赵太后》）
            url: xxxx
            vernacular: 犬子舒祺，年龄最小，不成器
          - ancient: 吾闻二世<少>子也，不当立。（《陈涉世家》）
            url: xxxx
            vernacular: 我听说秦二世是始皇帝的小儿子，不应立为皇帝
      - trans: ❷副的（职位）。
        sentences:
          - ancient: 于是为置三<少>，皆上大夫也，曰<少>保、<少>傅、<少>师。（《汉书•贾谊传》）
            url: xxxx
            vernacular: 于是又设三少，都是上大夫级别，叫少保、少傅、少师。
