---
words:
  - word: 少
    type: 【动词】
    phonetic: shao3
    tags:
      - 高中
    samples:
      - trans: ❶缺少;不够。
        sentences:
          - ancient: 今少一人，愿君即以遂（毛遂自称）备员而行矣。（《史记•平原君虞卿列传》）
          - ancient: 遥知兄弟登高处，遍插茱萸少一人。（唐•王维《九月九日忆山东兄弟》）
      - trans: ❷轻视;贬低。
        sentences:
          - ancient: 且夫我尝闻少仲尼之闻而轻伯夷之义者，始吾弗信。（《秋水》）
      - trans: ❸削弱;减少。
        sentences:
          - ancient: 欲天下之治安，莫若众建诸侯而少其力。（汉•贾谊《陈政事疏》）
          - ancient: 邻国之民不加少，寡人之民不加多，何也？（《寡人之于国也》）

  - word: 少
    type: 【形容词】
    phonetic: shao3
    tags:
      - 高中
    samples:
      - trans: ❶数量少（与"多"相对）。
        sentences:
          - ancient: 义不杀少而杀众，不可谓知类。（《公输》）
          - ancient: 然视其左右，来而记之者已少。（《游褒禅山记》）
      - trans: ❷薄弱;小。
        sentences:
          - ancient: 力少而不畏强。（《韩非子.亡征》）

  - word: 少
    type: 【副词】
    phonetic: shao3
    tags:
      - 高中
    samples:
      - trans: ❶稍;略微。
        sentences:
          - ancient: 北蛮夷之鄙人，未尝见天子，故振慑，愿大王少假借之，使毕使于前。（《荆轲刺秦王》）
          - ancient: 断头置城上，颜色不少变。（《五人墓碑记》）
          - ancient: 日三四里，少益耆食，和于身。（《触龙说赵太后》）
          - ancient: 【高考题例】贼怒，碎其首，缚诸（之于）檣丛射之，骂贼不少变，至死声犹（仍）壮，年三十有九。（《明史•花云传》）
      - trans: ❷不多时;一会儿。
        sentences:
          - ancient: 少则洋洋焉，攸然（自得的样子）而逝。（《孟子•万章上》）
          - ancient: 少焉，月出于东山之上，徘徊于斗牛之间。（《赤壁赋》）

  - word: 少
    type: 【名词】
    phonetic: shao4
    tags:
      - 高中
    samples:

      - trans: 青年人。
        sentences:
          - ancient: 顶句群贤毕至，少长咸（全）集。（《兰亭集序》）

  - word: 少
    type: 【形容词】
    phonetic: shao4
    tags:
      - 高中
    samples:
      - trans: ❶年幼。
        sentences:
          - ancient: 陈涉少时，尝与人佣耕。（《陈涉世家》）
          - ancient: 是故无贵无贱，无长无少，道之所存，师之所存也。（《师说》）
          - ancient: 子卿妇年少，闻已更嫁矣。（《苏武传》）
          - ancient: 老臣贱息（儿子）舒祺，最少，不肖。（《触龙说赵太后》）
          - ancient: 吾闻二世少子也，不当立。（《陈涉世家》）
      - trans: ❷副的（职位）。
        sentences:
          - ancient: 于是为置三少……曰少保、少傅、少师。（《汉书•贾谊传》）
