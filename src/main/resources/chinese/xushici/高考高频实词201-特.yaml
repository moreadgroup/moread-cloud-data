---
words:
  - word: 特
    type: 【名词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶公牛;泛指雄性牲畜。
        sentences:
          - ancient: 白牡谓白<特>，骍犅（xīnggāng）谓赤<特>也。（《诗经•鲁颂•闔宫》"白牡骍刚""孔颖达疏）
          - ancient: 凡马，特居四之一。（《周礼•夏官•校人》）
      - trans: ❷一只牲畜。
        sentences:
          - ancient: 归，格（告至）于艺祖（文祖，有文德才艺之祖），用特。（《尚书,・舜典》）,
      - trans: ❸三岁（一说四岁）的兽。
        sentences:
          - ancient: 不狩不猎，胡眼（向上或向前看）尔庭有县（通"悬"）特兮。（《诗经•魏风•伐檀》）
      - trans: ❹配偶。
        sentences:
          - ancient: 髧（dan4,头发下垂的样子）彼两髦，实维我特。 （《诗经•,都风•柏舟》）

  - word: 特
    type: 【形容词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶杰出的;非常优秀的。
        sentences:
          - ancient: 维此奄息，百夫之特。（《诗经•秦风•黄鸟》）
          - ancient: 以为凡是州之山水有异态者，皆我有也，而未始知西山之怪特。（《始得西山宴游记》）
      - trans: ❷孤单;单独。
        sentences:
          - ancient: 处势卑贱，无粵（同伙）孤特。（《韩非子•孤愤》）

  - word: 特
    type: 【副词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶仅;只。
        sentences:
          - ancient: 而世又不与能死节者比，特以为智穷罪极,不能自免，卒就死耳。（《报任安书》）
          - ancient: 相如度（估计）秦王特以诈（欺诈的手段）详（假装）为予赵城，实木可得。（《廉颇蔺相提如列传》）
          - ancient: 丰吾所生长，极不忘耳，吾特为其以雍齿故反我为魏。（《史记•高祖本纪》）
      - trans: ❷特地;特意。
        sentences:
          - ancient: 安帝雅闻（张）衡善术学，公车特征拜郎中，再迁为太史令。（《张衡传》）
          - ancient: 诏书特下，拜臣郎中。（《陈情表》）
      - trans: ❸徒然；白白。
        sentences:
          - ancient: 君不爱宋民，腹心不完，特为义耳。（《韩非子•外储说左上》）
          - ancient: 会羽季父左尹项伯素善张良，夜驰见张良,具告其实，欲与俱去，毋特俱死。（《汉书•高帝纪》）
