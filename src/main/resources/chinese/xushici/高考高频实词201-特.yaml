---
words:
  - word: 特
    type: 【名词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶公牛;泛指雄性牲畜。
        sentences:
          - ancient: 白牡谓白<特>，骍犅（xīnggāng）谓赤<特>也。（《诗经•鲁颂•闔宫》"白牡骍刚""孔颖达疏）
            url: xxxx
            vernacular: 孔颖达疏称：“白牡谓白牡，骍犅谓赤特也。”其实就是白牛和红（赤黄）牛。
          - ancient: 凡马，<特>居四之一。（《周礼•夏官•校人》）
            url: xxxx
            vernacular: xxxx
      - trans: ❷一只牲畜。
        sentences:
          - ancient: 归，格（告至）于艺祖（文祖，有文德才艺之祖），用<特>。（《尚书，・舜典》）
            url: xxxx
            vernacular: 回来后，到尧的太庙祭祀，用一头牛作祭品。(艺祖，指有才艺文德的祖先；太祖或高祖的通称。)
      - trans: ❸三岁（一说四岁）的兽。
        sentences:
          - ancient: 不狩不猎，胡瞻（向上或向前看）尔庭有县（通"悬"）<特>兮。（《诗经•魏风•伐檀》）
            url: xxxx
            vernacular: 从不打猎去林薮，凭啥院中挂兽肉？
      - trans: ❹配偶。
        sentences:
          - ancient: 髧（dan4，头发下垂的样子）彼两髦，实维我<特>。 （《诗经•，都风•柏舟》）
            url: xxxx
            vernacular: 垂发齐眉少年郎，是我倾慕的对象。
  - word: 特
    type: 【形容词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶杰出的;非常优秀的。
        sentences:
          - ancient: 维此奄息，百夫之<特>。（《诗经•秦风•黄鸟》）
            url: xxxx
            vernacular: 谁不赞许好奄息，百夫之中一俊才。
          - ancient: 以为凡是州之山水有异态者，皆我有也，而未始知西山之怪<特>。（《始得西山宴游记》）
            url: xxxx
            vernacular: 我原以为永州山水中稍有特异地方，都已被我游览了。殊不知还有个奇异独特的西山。
      - trans: ❷孤单;单独。
        sentences:
          - ancient: 处势卑贱，无党（同伙）孤<特>。（《韩非子•孤愤》）
            url: xxxx
            vernacular: 法术之士所处地位低下，没有同党孤立无援。
  - word: 特
    type: 【副词】
    phonetic: te4
    tags:
      - 高中
    samples:
      - trans: ❶仅;只。
        sentences:
          - ancient: 而世又不与能死节者比，<特>以为智穷罪极，不能自免，卒就死耳。（《报任安书》）
            url: xxxx
            vernacular: 世人又不会拿我之死与能殉节的人相比，只会认为我是智尽无能、罪大恶极，不能免于死刑，而终于走向死路罢了
          - ancient: 相如度（估计）秦王<特>以诈（欺诈的手段）详（假装）为予赵城，实不可得。（《廉颇蔺相提如列传》）
            url: xxxx
            vernacular: 相如估计秦王只不过用欺诈手段假装给赵国城邑，实际上赵国根本不可能得到。
          - ancient: 丰吾所生长，极不忘耳，吾<特>为其以雍齿故反我为魏。（《史记•高祖本纪》）
            url: xxxx
            vernacular: 丰邑是朕所生长之地，最不能忘，朕所以不免丰邑赋税，只为雍齿的缘故，雍齿居然反朕而投魏！
      - trans: ❷特地;特意。
        sentences:
          - ancient: 安帝雅闻（张）衡善术学，公车<特>征拜郎中，再迁为太史令。（《张衡传》）
            url: xxxx
            vernacular: 汉安帝常听说他擅长术数方面的学问，命公车特地征召他，任命他为郎中。两次迁升为太史令。
          - ancient: 诏书<特>下，拜臣郎中，寻蒙国恩，除臣洗马。（《陈情表》）
            url: xxxx
            vernacular: 朝廷又特地下了诏书，任命我为郎中，不久又蒙受国家恩命，任命我为洗马。
      - trans: ❸徒然；白白。
        sentences:
          - ancient: 君不爱宋民，腹心不完，<特>为义耳。（《韩非子•外储说左上》）
            url: xxxx
            vernacular: 您这是不爱护我们宋国的百姓，自己的国家受到损害，还有什么仁义可谈呢!
          - ancient: 会羽季父左尹项伯素善张良，夜驰见张良，具告其实，欲与俱去，毋<特>俱死。（《汉书•高帝纪》）
            url: xxxx
            vernacular: 适逢项羽叔父左尹项伯是张良的故友，连夜驰见张良，详细告诉了项羽明日进攻沛公的军事实情，想叫张良和他一起脱离险境， 不必与沛公同归于尽。
