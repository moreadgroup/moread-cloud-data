畔pan4
【名词】❶田界。
【例句】历山之农者侵畔。（《韩非子•难一》）丨耕者让畔,行者让路。（《论衡•是应》）
❷边沿;旁侧。
【例句】屈原至于江滨，被发行吟泽畔，颜色憔悴，形容枯槁。（《史记•屈原贾生列传》）丨沉舟侧畔千帆过,病树前头万木春。（《酬乐天扬州初逢席上见赠》）

【动词】❶避开;躲避。
【例句】畔，吴语谓躲避曰畔。亦有所本。陈后主创齐圣观，民谣曰："齐圣观,寇来无处畔。"（清•赵翼《咳余丛考》卷四十三）
❷通"叛"。背叛;违背。
【例句】寡助之至，亲戚畔之。（《得道多助，失道寡助》）丨汝为人臣子，不顾恩义，畔主背亲，为降虏于蛮夷，何以汝为见？（《苏武传》）丨人言公之畔，陛下必不信。（《史记•淮阴侯列传》）

