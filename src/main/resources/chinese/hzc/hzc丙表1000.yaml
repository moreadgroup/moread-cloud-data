- seq: '3561'
  word: 弁
  hzctable: 表3丙表1000字
  isprint: T
  strokesnum: 5画
  pinyins: biàn
  strokes: "\U000200CB 丶 一 丿 丨"
  strokesok: true(a5~e5)
  explanation: >-
    弁 古时的一种官帽，通常配礼服用(吉礼之服用冕)。赤黑色布做叫爵弁，是文冠;白鹿皮做的叫皮弁，是武冠◇泛指帽子
    覍，冠也。周曰覍，殷曰吁，夏曰收。--《说文》。俗作卞。凡大夫以上服冕，士弁，制如冕爵。弁者，古冠之大称。委貌缁布曰冠。--《周礼·弁师》注皮弁。--《仪礼·士冠礼》。服注以白鹿皮为冠。弁，周冠名。--《广韵》突而弁兮。--《诗·小雅·甫田》王与大夫尽弁。--《书·金縢》。传弁，皮弁。不说(脱掉)弁而死于崔氏。--《左传·襄公二十五年》又如弁师(周礼官名。为夏官的弁
    biàn①古代贵族的一种帽子，通常穿礼服时用之(吉礼之服用冕)。赤黑色的布做的叫爵弁，是文冠;白鹿皮做的叫皮弁，是武冠。②泛指帽子。③加弁;加冠。④放在前面。⑤武官服皮弁，因称武官为弁。⑥清代用以称基层武官。⑦徒手搏斗。⑧惊惧;战抖。⑨快速，急促。⑩姓『有弁严子。弁
    pán通'般'。快乐。
