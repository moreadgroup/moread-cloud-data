    枳zhǐ又叫'枸橘'。落叶灌木或小乔木，枝多刺，叶是三小片的复叶，花白色，果实球形。叶和果实均供药用。中药上将未成熟的枳、枸橼等果实叫'枳实'；成熟的枳、枸橼等果实叫'枳壳。枳zhī
    1.通'胑'。肢体。 2.通'枝'。歧出。参见'枳首蛇'。
