  explanation: >-
    衄 鼻出血
    衄，鼻出血也。从血，丑声。--《说文》。俗字作衵春不鼽衄。--《素问·金匮真言论》此人奉使出门，卒尔鼻衄。--《大庄严论经》泛指人体各部位的出血 畏缩
    未战而退，先自摧衄，亦古之所忌。--《晋书》挫折;挫伤;失败
    莫不衵锐挫铓。--左思《吴都赋》流闻东军失备，师徒小衄。--曹植《求自试表》又如衄折(失败，挫败);衄挫(衄折);衄痍(创伤);衄锐(挫其锋锐)衄（衵）nǜ⒈鼻出血～血。鼻～。⒉失败，挫伤败～。
