    鹫鸟，黑色，多子。师旷曰，南方有鸟，名曰羌鹫，黄头赤目，五色皆备。--《说文》鹫，雕也。--《广雅》生奇材木箭竿就(鹫)羽。--《汉书·匈奴传》。注大雕也。产于温带和热带地区的若干种大型猛禽，与鹰类、雕类和隼类都有亲缘关系，但爪较弱，头多秃，主要或全部以腐肉为食，构成鹫科(aegypiidae)和新域鹫科(cathartidae)，其中包括一些最大的飞禽。如鹫羽(老雕的羽毛。又叫鹫翎)灵鹫山的简称
