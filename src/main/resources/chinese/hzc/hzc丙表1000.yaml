    鸩
    传说中的一种毒鸟。把它的羽毛放在酒里，可以毒杀人。用鸩的羽毛泡成的毒酒～酒。饮～止渴。用毒酒害人。鸩zhèn⒈传说中的一种毒鸟。羽毛紫绿色，放在酒中能毒死人。⒉用鸩毛泡成的毒酒饮～止渴（〈喻〉只顾眼前，不顾后果）。⒊使用鸩酒（也指毒酒）害人。
