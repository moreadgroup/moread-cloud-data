  strokesnum: 10画
  pinyins: bó
  strokes: "丶 一 丨 \U000200CD 一 ㇀ 乛 丿 一 乚"
  strokesok: true(a10~e10)
  explanation: >-
    亳 古都邑名
    谷熟为南亳，汤都，在今河南商丘县东南蒙为北亳，汤受命为盟主之处，在今河南偃师县西偃师为西亳，传说汤攻夏时所居县名(亳县，在安徽)亳bó①古都邑名。商汤的都城。相传有三处。(1)在今河南商丘县东南，传说汤曾居于此，又名南亳。《史记．殷本纪》'湯始居亳。'张守节正义引《括地志》云'宋州穣熟縣西南三十五里南亳故城，即南亳，湯都也。'(2)在今河南商丘县北，传说诸侯拥戴汤为盟主于此，又名北亳。郭沫若《中国史稿》第二编第二章第一节'汤都于亳(今河南商丘北)。'(3)在今河南偃师县西，传说汤攻克夏时所居，又名西亳。《汉书．樊哙传》'從攻秦軍，出亳南。'颜师古注引郑玄曰'亳，成湯封邑，今河南偃師湯亭是。'参见'三亳'。②汉亭名。在今陕西省西安市东南。③古国名。故址在今安徽省亳县。
