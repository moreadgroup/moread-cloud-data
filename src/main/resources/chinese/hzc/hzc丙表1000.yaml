  explanation: >-
    匝 周，环绕一周叫一匝
    帀，周也。从反帀而帀也。--《说文》。按，字亦作通，俗误作匝。就，帀也。--《周礼·典瑞》注。疏一采为一币，五采则五币。周，币也。--《礼记·檀弓》注匝城兵士。--清·邵长蘅《青门剩稿》又如绕树三匝;在门前绕了三匝;五匝;沿鼎壁游了一匝遍;次
    帀，徧也。--《广雅》增光遂净手同进忠到方丈来，持香到禅座前，插在炉内拜三匝。--明·佚名《梼杌闲评》匝 环绕
    水匝隍堑，于城东北合为一渎。--《水经注·河水》又如匝栏(围栏)笼罩，匝（帀）zā⒈周，圈鸟鹊南飞，绕树三～。⒉满，环绕浓荫～地。滋蔓～清池。
