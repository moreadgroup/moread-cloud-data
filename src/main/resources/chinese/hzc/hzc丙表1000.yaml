  pinyins: dī、dǐ
  strokes: "丿 \U0002010C 一 ㇂ 丶"
  strokesok: true(a5~e5)
  explanation: >-
    氐 低，低下◇作低。头向下垂 封君皆氐首仰给焉。--《汉书·食货志下》。师古曰氐首，犹俯首也。氐 低;低廉 氐 中国古代的一个少数民族
    自彼氐羌。--《诗·商颂·殷武》星名 氐 根本 尹氏大师，维周之氐。--《诗·小雅·节南山》氐，本也。--《说文》。按，柢之氐
    dī①我国古代西部的少数民族。②二十八宿之一。又见dǐ。【氐人】中国古族名。原在中国北部和西部的广大地区游牧。从东汉起陆续内迁，主要居住在今陕西、甘肃、四川等广大地区。从事畜牧、农业。魏晋时大量接受汉族文化和生产技术。历史上曾建立过仇池、前秦、后凉等国。氐
    dǐ根本。又见dī。
