  explanation: >-
    锶
    属于碱土族的一种银白色、软而且有延展性和韧性的二价金属元素，仅以组合物的形式、尤其是作为菱锶矿和天青石而存在，通常是由电解它的融熔的氯化物或者用铝加热还原它的氧化物而制得，在空气中变为淡黄，能产生使火焰和焰火组分染上绯红色的化合物
    锶sī金属化学元素之一。符号sr。银白色晶体，化学性质活泼。用于制烟火、合金、光电管等。溴化锶是健胃剂。乳酸锶可用于治抽风。
