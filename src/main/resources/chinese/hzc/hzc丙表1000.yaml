    噶----译音用字。如噶布伦，噶伦(原西藏地方政府的主要官员);萨噶达娃节(藏族地区纪念释迦牟尼诞生的节日);噶厦(原西藏地方政府，1959年西藏叛乱事件发生后解散)噶gé译音字。噶gá象声。如噶喇一声。【噶乌】藏语。意为护身佛盒。一般用银、铜制成，也有金制的，大小不等，贵重者镶以珠宝，有的内装小佛像及经卷符咒等物。是喇嘛教信徒佩戴的宗教用品，也是妇女的胸前装饰品和过去一部分贵族男子的头饰。【噶伦】藏语。亦作'噶隆'或'噶布伦'，原西藏地方政府主管官员。依清官制为三品，多由大贵族充任，职权甚重。【噶珊】一译'嘎山'。满语'乡村'的意思。【噶厦】藏语。意为'发布命令的机关'，旧译'噶厦公所'或'噶沙公所'，即原西藏地方政府。清乾隆十六年（1751年），清政府废原封郡王，命由噶伦四人（一僧三俗）主持噶厦，秉承驻藏大臣与达赖喇嘛的意志，共同管理西藏地方行政事务，遂成定制。1959年3月，多数噶伦叛乱，国务院命令解放，由西藏自治区筹备委员会代行其职权。【噶当派】喇嘛教派之一。【噶伦堡】硬度东北部地边境城镇。靠近西藏亚东，避暑胜地。【噶举派】喇嘛教派之一。因最重口授（藏语噶）密法的传承（藏语举）故称噶举派。噶gé
    象声词。噶gá译音用字。
