    栾 木名。也叫栾华、灯笼树 胶。花可提黄色染料，又可入药拱，建筑物立柱和横梁之间成弓形的承重结构
    结重栾以相承。--张衡《西京赋》。注柱上曲木，两头受栌者。又如栾拱(屋架中承受梁木的曲木);栾栌(屋中柱顶承梁之木，曲者为栾，直者为栌)通孪。双生子
