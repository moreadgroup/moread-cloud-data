  explanation: >-
    卞 法，法度 卞，法也。--《玉篇》率循大卞。--《书·顾命》古地名 姓卞 急躁 庄公卞急而好洁。--《左传·定公三年》卞
    biàn①法；法规率循大～。（《尚书·顾命》）②（性情）急躁～急。～姓。【卞和】春秋时楚国人。生卒年不详。传说他觅得玉璞，两次献给楚王，均被认为是假，先后被砍去双脚。楚文王即位，他抱璞在荆山下大哭，文王派匠人周目琢其璞，果然是宝玉，称为'和氏之璧'。
