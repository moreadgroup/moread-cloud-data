    1.古代打击乐器。状如曲尺。用玉﹑石或金属制成。悬挂于架上，击之而鸣。 2.适宜制磬的美石。
    3.寺院中召集众僧用的云板形鸣器或诵经用的钵形打击乐器。4.南齐时报更用的响器◇因以借指时钟。 5.弯腰。表示谦恭。 6.泛指身形曲折如磬。
    7.形容鸣声如击磬。 8.放马疾驰。参见'磬控'。 9.古死刑之一。悬而缢杀。10.副词。方言。适才。参见'盘子'。 11.通'俔'。譬如，如同。
    12.通'罄'。空，中空。 13.通'罄'。尽，罄尽。 14.通'罄'。全;遍。参见'磬地'。 15.通'罄'。形容声音坚致。
    16.通'謦'。轻声咳嗽。参见'磬欬'。
