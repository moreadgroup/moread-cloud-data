  explanation: >-
    疣 皮肤病名
    胾，赘也。从肉，尤声。--《说文》胾，肿也。--《广雅》今学曾未如胾赘。--《荀子·宥坐》。注结肉。病原体是一种病毒，症状是皮肤上出现跟正常的皮肤颜色相同的或黄褐色的突起，表面干燥而粗糙，不疼不痒，多长在面部、头部或手背等处。如疣子(疣。皮肤上长的肉瘤);疣疮(疣子)用同尤。怨恨，归咎;过失
    三皇之时，食肉衣皮，巢居穴处，以崇质朴，岂复须章黼之冠，曲裘之饰哉。然其人称有德，而孰疣之。--汉·牟融《理惑论》疣赘疣（胾）yóu⒈俗称'瘊子'。是一种病毒感染的皮肤病。症状是皮肤上出现针头至黄豆大小的疙瘩，不痒不痛。⒉
