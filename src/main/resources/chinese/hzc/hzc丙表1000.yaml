    乜 眼睛眯成一条缝 良材在烟榻上坐了，乜着眼又说道。--茅盾《霜叶红似二月花》又如乜斜(也作乜邪。眼睛眯成一条缝斜视);乜嬉(眼略眯斜视)眯着眼斜视着
    鬼祟醉眼乜斜。--关汉卿《望江亭》细娇乜着嘴儿，轻轻地摇头。--陈残云《香飘四季》乜 偷偷摸摸不知做乜鬼?--陈残云《香飘四季》又如乜噑(什么事)乜
    痴呆 乜miē⒈①眯着眼睛斜视～斜看人。②因困倦眼睛眯成一条缝～斜睡眼。乜niè⒈姓。
