    兀，高而上平也。--《说文》何时眼前突兀见此屋。--杜甫《茅屋为秋风所破歌》又如兀岸(直耸挺拔);兀嵝(险峻)光秃(如毛发)的
    蜀山兀。--唐·杜牧《阿房宫赋》又如兀首(头发脱落)茫然无知 临文乍了了，彻卷兀若天。--柳宗元《读书》又如兀兀陶陶(醉酒);兀楞楞(痴呆)不够稳定
    独立
    焉有翡翠横肩，援琴合膝，而能兀焉自立者也?--兀wù⒈高而上面平坦的样子，秃突～。蜀山～。～鹫（猛禽，头和颈上的羽毛退化而裸露）。⒉茫然无知的样子～若无。⒊⒋元曲里用作发语词。
