    齐侯疥，遂痾。--《左传》。孔颖达疏疥当为痎，痎是小疟，痾是大疟。疥 污，弄脏
    疥疮疥癣疥jiè疥疮，由疥虫引起的皮肤传染病。病损呈针头大小的丘疹、水疱，非常刺痒。病损多见于手指间、腕、肘窝、腋窝、腹股沟等皱折部位。爱清洁，讲卫生，可预防疥疮。
