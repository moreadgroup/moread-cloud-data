    strokesnum: 6画
    pinyins: sù
    strokes: 丿 ⺄ 一 丿 ㇇ 丶
    strokesok: true(a6~e6)
    explanation: >-
      夙 (会意。夕是夜间，乵表示以手持物。天不亮就起来做事情，表示早。所以除了早晨的意义外，还有早起劳作，以示恭敬的意思。本义早晨)同本义
      夙，早敬也。--《说文》夙夜在公。--《诗·召南·小星》岂不夙夜，谓行多露。--《诗·召南·行露》夙夜惟寅。--《书·舜典》夙兴。--《仪礼·士昏礼》策蹇驴，囊图书，夙行失道，望尘惊悸。--明·马中锡《中山狼传》又如夙兴(早起);夙宵(朝夕，日夜)旧;平素
      虞虽为上公，天性节约，…远近豪俊，夙僭奢者，莫不改，而归心夙sù⒈早晨～兴夜寐（起早睡晚。形容勤奋不懈）。⒉平素，过去～愿。～志。回忆～昔。
