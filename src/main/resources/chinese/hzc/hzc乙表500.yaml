  - seq: "4061"
    word: 孢
    hzctable: 表2乙表500字
    isprint: T
    strokesnum: 8画
    pinyins: bāo
    strokes: "㇇ 亅 ㇀ 丿 \U000200CC \U000200CD 一 乚"
    strokesok: true(a8~e8)
    explanation: >-
      孢子 孢子植物 【孢蒴】苔藓植物孢子体顶端产生孢子的膨大部分。成熟时开裂，散出孢子。
      【孢子】某些植物和低等动物产生的有繁殖作用或休眠作用的细胞。离开母体后能形成新的个体。
      【孢子囊】植物产生孢子的细胞或器官。有些植物有大、小孢子囊之分。大孢子囊产生个体较大而数量很少的大孢子，由它们发育成雌配子体；小孢子囊产生小而多的小孢子，由它们发育成雄配子体。
      【孢子生殖】无性生殖的一种方式。母体产生孢子，孢子不经结合，直接形成新个体。如孢子植物和原生动物门孢子虫的生殖方式。
      【孢子体】指植物世代交替中，产生孢子的植物体。孢子体一般具有二倍数的染色体。
      【孢子体世代】植物生活史中具有二倍数染色体的植物体时期。如蕨类植物从合子形成到孢子母细胞的产生为孢子体世代。又称无性世代。
