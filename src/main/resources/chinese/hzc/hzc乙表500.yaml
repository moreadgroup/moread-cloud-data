      芻，刈草也。象包束草之形。--《说文》。按，象断草包束以饮马牛者也。七曰刍粖之式。--《周礼·太宰》淫刍荛者。--《左传·昭公十三年》禁刍牧采樵。--《左传·昭公六年》刍莝养马。--《越绝书·外传本事》又如刍牧(割草放牧)用草喂牲口
      刍之三月。--《周礼·地官·充人》又如刍养(饲养)刍 〈名〉喂牲畜的草 食以刍叔。--《庄子·列御寇》馈之刍米。--《左传·僖公二十九年》民争负刍
      chú①喂牲畜用的草～秣。②割草。【刍议】谦辞。指自己粗浅的意见、议论。刍（芻）chú⒈割草～牧田中。⒉牲畜吃的草。⒊
