    explanation: >-
      铬
      一种蓝白色多价金属元素，原子序数24，通常制得的铬，质硬且脆，抗腐蚀，只以化合状态存在。主要以铬铁矿形式存在，用铝热法、硅热法或电解法将它从矿石中分离出，主要用于合金(如供铬钢用的铬铁合金或如镍铬电阻合金)及电镀(如汽车减震器和内部装璜以及切削工具)
      铬gè金属元素，符号cr(chromium)。银灰色的结晶体，质硬而脆，是制造不锈钢、高速钢等的重要原料。在别种金属上镀铬可以防锈。它和铁、锰等都是黑色金属。也叫克罗米。【铬钢】含铬的合金钢，质地坚硬，耐磨、耐腐蚀，不生锈，可用来制造机器和工具。【铬镍钢】含铬、镍的合金钢，机械强度高，硬度和韧性大，耐热，耐腐蚀，用于制造飞机、汽车、拖拉机等的重要机件。【铬镍矿】铬和铁的氧化物，是主要的含铬矿石≮褐色，多是粒状、块状或豆状，是重要的冶金原料，又供制颜料。铬gé钩。兵器。铬luò剃发。铬gè金属元素，符号cr。银灰色结晶体，质硬而脆，是制造不锈钢﹑高速钢等的重要原料。在别种金属上镀铬可以防锈。
