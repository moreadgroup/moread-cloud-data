      讫，止也。--《说文》毋讫籴。--《谷梁传·僖公九年》天既讫我殷命。--《书·西伯戡黎》。传天既毕讫殷之王命。典狱非讫于威，惟讫于富。--《书·吕刑》。传非绝于威，惟绝于富。讫不肯拜使者。--《汉书·西域传上》言讫。--唐·李朝威《柳毅传》用讫。--宋·沈括《梦溪笔谈·活板》言讫不见。--清·魏禧《大铁椎传》讫籴(终止籴粮);讫毕(完毕);讫竟(终止;了结);讫成(完成);讫工(讫功。竣讫qì⒈终了，完毕验～。收～。⒉终点，截止起～。⒊〈古〉通'迄'。到。
