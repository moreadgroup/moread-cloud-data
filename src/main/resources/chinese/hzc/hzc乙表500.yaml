  - seq: "3612"
    word: 汆
    hzctable: 表2乙表500字
    isprint: T
    strokesnum: 6画
    pinyins: cuān
    strokes: 丿 ㇏ 亅 ㇇ 丿 ㇏
    strokesok: true(a6~e6)
    explanation: >-
      汆 一种烹调方法。把食物放到沸水里稍微一煮 引申为把东西丢到水里或人钻入水中
      所以才几天就搁下来了，眼睁睁汆了它妈一大堆钱进去。--沙汀《淘金记》汆tǔn①方言。漂流在水上。如冰块在水上汆。②用油炸。如油氽花生米。汆cuān烹饪法的一种，把食物放在开水中稍煮一下。如汆丸子。汆cuān①烹调的一种方法。把食物放入沸水中稍煮一下。②引申为把东西丢到水里或人钻入水中。
  - seq: "3614"
    word: 夙
    hzctable: 表2乙表500字
