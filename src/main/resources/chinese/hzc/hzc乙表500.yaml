    strokesnum: 3画
    pinyins: yì
    strokes: 一 ㇂ 丶
    strokesok: true(a3~e3)
    explanation: >-
      弋 (象形。甲骨文字形。本义小木桩。今字作杙)同本义 以钩弋压下枝，令着地。--《齐民要术》系有绳子的箭，用来射鸟 指禽鸟
      十二月，鸣弋。弋也者，禽也。--《大戴礼记》姓氏美孟弋矣。--《诗·傭风·桑柔》弋 射。用带绳子的箭射猎
      戈，缴射也。--《玉篇》弋凫与雁。--《诗·郑风·女曰鸡鸣》。疏弋，谓以绳系矢而射之也。公弋取弋yì⒈〈古〉用带绳子的箭射～白鹄。泛指射猎～获。⒉取～其能者。
  - seq: "3505"
    word: 孑
    hzctable: 表2乙表500字
