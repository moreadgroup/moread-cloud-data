    explanation: >-
      叵〈副〉(会意。可字的反写。本义不可)同本义
      叵，不可也。--《三苍》。按，从反可，指事。怀故叵新欢。--谢灵运诗又如居心叵测;叵信(不可信);叵奈(怎奈;无奈)遂，便，于是
      超欲因此叵平诸国。--《后汉书·班超传》。注犹逐也。帝知其终不为用，叵欲讨之。--《后汉书·隗嚣传》多，甚。通颇
      其是非叵缪于圣人。--《汉书·司马迁传赞》叵pǒ⒈不可～耐（不可忍耐）。居心～测。⒉遂，就～平诸国（平平定）。
