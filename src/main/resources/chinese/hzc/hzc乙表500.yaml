    strokesnum: 3画
    pinyins: jié
    strokes: ㇇ 亅 ㇀
    strokesok: true(a3~e3)
    explanation: >-
      孑 (象形。小篆字形，象人缺右臂形。本义缺少右臂)同本义 孑，无右臂也。--《说文》孤单，单独
      胡有孑然其效戎翟也。--《国语·周语》何孤行之茕茕兮，孑不群而介立。--张衡《思玄赋》又如孑居(孑栖。独居);孑弦(单弦);孑轮(一辆车)小 剩余
      孑，余也。--《方言二》又如孑黎(遗民;残存的百姓);孑余(剩余;残余)特立，出众。多指才能、人品等
      孑，俊也。--《方言二》孑孑干旄。--《孑jié⒈孤独，孤单～立。～然一身。⒉⒊⒋〈古〉通'戟'。兵器名。
