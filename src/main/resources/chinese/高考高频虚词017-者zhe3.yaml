---
words:
  - word: 者 【代词】
    phonetic: zhe3
    tags:
      - 高中
    samples:
      - trans: ❶指示代词。这。
        sentences:
          - ancient: 【例句】细想从来，断肠多处，不与者番同。（宋•晏几道《少年游•离多最是》）
      - trans: ❷用在形容词或动词之后，指代人或事物。
        sentences:
          - ancient: 【例句】狂者东走,逐者亦东走。（《韩非子•说林上》）
          - ancient: 死者长已矣。（《石壕吏》）
          - ancient: 城北徐公，齐国之美丽者也。（《邹忌讽齐王纳谏》）
          - ancient: 期年之后,虽欲言，无可进者。（《邹忌讽齐王纳谏》）
          - ancient: 逝者如斯,而未尝往也;盈虚者如彼，而卒莫消长也。（《赤壁赋》）
          - ancient: 【高考题例】有华生者，世家江北，备谙村落者也。（《村落嫁娶图记》）
      - trans: ❸用在数词之后，指上文所说的几种人或事物。
        sentences:
          - ancient: 【例句】农、商、官三者，国之常官也。（《商君书•去强》）
      - trans: ❹用在"今""昔"等表示时间的名词之后，表示某一段时间，相当于"……的时候"。
        sentences:
          - ancient: 【例句】今者有小人之言，令将军与臣有郤xi4。（《鸿门宴》）
          - ancient: 夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之者臣也。（《季氏将伐颛臾》）
          - ancient: 少卿足下:曩者辱赐书,教以慎于接物，推贤进士为务。（《报任安书》）
  - word: 者 【助词】
    phonetic: zhe3
    tags:
      - 高中
    samples:
      - trans: ❶用在名词后，表示停顿并引出下文。
        sentences:
          - ancient: 【例句】北山愚公者，年且九十，面山而居。（《愚公移山》）
          - ancient: 师者，所以传道受业解惑也。（《师说》）
      - trans: ❷用于因果复句前一分句后，表示申述形成结果的原因或理由。
        sentences:
          - ancient: 【例句】蟹六跪而二螯，非蛇蜻之穴无可寄托者，用心躁也。（《劝学》）
          - ancient: 吾妻之美我者，私我也：妾之美我者，畏我也；客之美我者，欲有求于我也。（《邹忌讽齐王纳谏》）
      - trans: ❸用于句末，表示疑问语气。
        sentences:
          - ancient: 【例句】王曰："谁可使者?"（《廉颇蔺相如列传》）
          - ancient: 何者?严大国之威以修敬也。（《廉颇蔺相如列传》）
      - trans: ❹用在主语后，引出判断。
        sentences:
          - ancient: 【例句】楚左尹项伯者，项羽季父也，素善留侯张良。（《鸿门宴》）
      - trans: ❺定语后置的标志。
        sentences:
          - ancient: 【例句】石之铿然有声者,所在皆是也。（《石钟山记》）            