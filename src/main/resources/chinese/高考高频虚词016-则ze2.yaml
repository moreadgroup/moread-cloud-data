---
words:
  - word: 则 【名词】
    phonetic: ze2
    tags:
      - 高中
    samples:
      - trans: ❶准则;法则。
        sentences:
          - ancient: 愿依彭咸之遗则。（《离骚》）
      - trans: ❷等级。
        sentences:
          - ancient: 坤作地势，高下九则。（《汉书•叙传》）
  - word: 则 【动词】
    phonetic: ze2
    tags:
      - 高中
    samples:
      - trans: 效法。
        sentences:
          - ancient: 河出图，洛出书，圣人则之。（《周易•系辞上》）
  - word: 则 【副词】
    phonetic: ze2
    tags:
      - 高中
    samples:
      - trans: ❶乃;就（是）。
        sentences:
          - ancient: 此则岳阳楼之大观也，前人之述备矣。（《岳阳楼记》）
          - ancient: 至于斟酌损益，进尽忠言，则攸之、祎、允之任也。（《出师表》）
      - trans: ❷仅仅;只。
        sentences:
          - ancient: 口耳之间，则四寸耳，曷足以美七尺之躯哉！（《荀子•劝学》）
      - trans: ❸立即。
        sentences:
          - ancient: 于是至则围王离。（《汉书•项籍传》）
  - word: 则 【连词】
    phonetic: ze2
    tags:
      - 高中
    samples:
      - trans: ❶表示承接关系，相当于"就""便""那么"等。
        sentences:
          - ancient: 学而不思则罔（迷惘），思而不学则殆（危险）。（《论语•为政》）
          - ancient: 故木受缰则直，金就砺则利，君子博学而曰参省乎己，则知明而行无过矣。（《劝学》）
          - ancient: 盖将自其变者而观之，则天地曾不能以一瞬。（《赤壁赋》）
          - ancient: 【高考题例】萍寄诸州，凡十五六年，其牧守稍薄，则又移居，故其迁徙者,盖十余州焉。（《旧唐书•李揆传》）
      - trans: ❷表示对比关系，常用""则……则……"前后对比。
        sentences:
          - ancient: 小则获邑，大则得城。（《六国论》）
          - ancient: 思则得之，不思则不得也。（《孟子•告子上》）
      - trans: ❸表示转折关系，相当于""反而""然而""却""等。
        sentences:
          - ancient: 欲速则不达。（《论语•子路》）
          - ancient: 爱其子，择师而教之；于其身也，则耻师焉，惑矣。（《师说》）
          - ancient: 臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。（《陈情表》）
      - trans: ❹表示出乎意料，相当于"原来""竟"。
        sentences:
          - ancient: 徐而察之，则山下皆石穴罅，不知其浅深，微波入焉,涵淡澎湃而为此也。（《石钟山记》）
      - trans: ❺如果。
        sentences:
          - ancient: 今则来，沛公恐不得有此。（《史记•高祖本纪》）
