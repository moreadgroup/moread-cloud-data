---
words:
  - word: 之 【动词】
    phonetic: zhi1
    tags:
      - 高中
    samples:
      - trans: 到......去;往。
        sentences:
          - ancient: 辍耕之陇上。（《陈涉世家》）
          - ancient: 商君欲之他国。（《史记•商君列传》）
          - ancient: 奚以之九万里而南为？（《逍遥游》）
          - ancient: 辘辘远听，杳不知其所之也。（《阿房宫赋》）
          - ancient: 而又有剪发杜门,佯（假装）狂不知所之者。（《五人墓碑记》）
          - ancient: 【高考题例】令行于民期年，秦民之国都言初令之（的）不便者以千数。（《史记•商君列传》）
  - word: 【代词】
    phonetic: zhi1
    tags:
      - 高中
    samples:
      - trans: ❶表示第三人称。
        sentences:
          - ancient: 学而时习之，不亦说乎？（《论语•学而》）
          - ancient: 四方之士来者，必庙礼之。（《勾践灭吴》）
          - ancient: 余嘉其能行古道，作《师说》以贻之。（《师说》）
          - ancient: 人非生而知之者，孰能无惑?（《师说》）
          - ancient: 【高考题例】贾生数上疏，言诸侯或连数郡,非古之（的）制，可:，稍削之。（《史记•屈原贾生列传》）
      - trans: ❷有时表示第一人称或第二人称。
        sentences:
          - ancient: 鄙贱之人,不知将军宽之（我）至此也！（《廉颇蔺相如列传》）
          - ancient: 君（秦孝公）亟定变去之虑，殆无顾天下之议之（您）也。（《商君书•更法》）
      - trans: ❸表示近指，这。
        sentences:
          - ancient: 均之二策，宁许以负秦曲。（《廉颇蔺相如列传》）
          - ancient: 巫医乐师百工之人，不耻相师。（《师说》）
          - ancient: 士大夫之族，曰师曰弟子云者，则群聚而笑之。（《师说》）
          - ancient: 之二虫又何知!（《逍遥游》）
          - ancient: 【高考题例】乃短贾生日："洛阳之人，年少初学，专欲擅权，纷乱诸事。"（《史记•屈原贾生列传》）
  - word: 【助词】
    phonetic: zhi1
    tags:
      - 高中
    samples:
      - trans: ❶结构助词,相当于"的"。
        sentences:
          - ancient: 君之病在肌肤，不治将益深。（《韩非子•喻老》）
          - ancient: 老吾老，以及人之老；幼吾幼，以及人之幼。（《孟子•梁惠王上》）
          - ancient: 古之学者必有师。（《师说》）
          - ancient: 壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。（《赤壁赋》）
          - ancient: 【高考题例】其间岂无刚直之人,而弗胜龃龉，多不能安其身。（《明史•陈登云传》）
      - trans: ❷结构助词，用于主谓之间，取消句子独立性。
        sentences:
