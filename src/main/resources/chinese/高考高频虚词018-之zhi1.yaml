          - ancient: 故王之不王，不为也，非不能也。（《孟子•梁惠王上》）
          - ancient: 嗟乎！师道之不传也久矣！（《师说》）
          - ancient: 后之视今，亦犹今之视昔,悲夫！（《兰亭集序》）
      - trans: ❸在句中起调节音节的作用。
        sentences:
          - ancient: 卒之为众人，则其受于人者不至也。（《伤仲永》）
          - ancient: 余扃牖而居，久之，能以足音辨人。（《项脊轩志》）
          - ancient: 填然鼓之，兵刃既接，弃甲曳兵而走。（《寡人之于国也》）
      - trans: ❹连接动词和前置的宾语。
        sentences:
          - ancient: 苟得闻子大夫之言，何后之有？（《勾践灭吴》）
          - ancient: 夫晋，何厌之有？（《烛之武退秦师》）
          - ancient: 于是焉河伯始旋（掉转）其面目，望洋向若（海神名）而叹曰：""野语有之曰"闻道百，以为莫（没有人己若者"，我之谓也……"（《庄子•秋水》）
          - ancient: 太吏公曰：《传》曰"其身正，不令而行;其身不正，虽令不从"。其李将军之谓也？（《史记•李将军列传》）
      - trans: ❺定语后置的标志,不译。
        sentences:
          - ancient: 蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。（《劝学》）
