  - word: accept
    tags:
      - 初中
    phonetic: 【əkˈsept】
    trans: v.接受
    tips: 记 词根记忆：ac＋cept(拿，抓)→拿住→接受；同根词有： except(prep.除…之外)；conception(n.概念)
    samples:
      - 例 Please accept my apologies.请接受我的道歉。
    distinguish: 辨 accept，receive，accept表示主观上“接受”，而receive表示客观上“收到”，如：She received a birthday present from a boy but did not accept it.她收到一个男孩送的生日礼物，但没有接受。
    reference: 参 acceptable(adj.可接受的)
