    usage: 用 1．作形容词，修饰可数名词复数或不可数名词，表示“一些，一点”：I have some trouble.我碰上了一点儿麻烦。2．修饰数词，表示“大约”：It happened some twenty years ago.这大约是20年前的事了。3．修饰单数可数名词，表示“某一”：He went to some place in Africa.他到非洲某地去了。4．作代词，单独用或与of连用：Many of them become fat.And some have bad teeth.他们之中有很多人发胖了，并且有些人的牙齿也坏了。
