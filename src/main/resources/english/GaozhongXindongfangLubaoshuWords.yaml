  - word: while
    tags:
      - 初中
    phonetic: 【waɪl】
    trans: conj.正当…的时候；然而 n.一小会儿
    usage: 用 1．while引导时间状语从句，表示主句和从句的动作同时发生，从句动词必须是延续性的：While I was walking along the road，I found a bag lying on the ground.我在路上走时看见地上有一个包。
    samples:
      - 例 —I'm going to the post office.—While you're there，can you get me some stamps？—我要去邮局。—你到邮局时帮我买些邮票好吗？2．while引导让步状语从句，相当于although：While I accept that he is not perfect，I do actually like the person.尽管我承认他不完美，但我的确喜欢他。3．while用作并列连词，表示前后两者的对比：I don't like tomatoes，while Mary loves them.我不喜欢吃西红柿，而玛丽喜欢。
    distinguish: 辨 while，when，as.while，when，as都可以引导时间状语从句。when和while都可以表示主句动作与从句动作同时发生，when常与一般时态连用，而while引导的从句必须是进行时态或延续性动词：While he stood there he saw two men enter the bar.他站在那里时，看见两个男人走进了酒吧。as可以表示两个动作同时进行，强调一种伴随关系：As it grew darker it became colder.随着天色越来越暗，天气变得越来越冷。while，but这两个连词虽然在汉语中都可以翻译成“但是”，但but是指逻辑上的转折关系，而while只是一种对比关系。如：I tried not to be angry with him，but I can't.我试着不生他的气，但是我做不到。 例 Fred is very good at science，while his brother is absolutely hopeless.弗雷德很擅长理科，而他的兄弟则对理科束手无策。
  - word: atmosphere
    tags:
      - 高中
    phonetic: 【ˈætməsfɪə】
    trans: n.气氛；大气
    tips: 记 词根记忆：atmo(气)＋sphere(球体)→围绕地球的空气→大气
