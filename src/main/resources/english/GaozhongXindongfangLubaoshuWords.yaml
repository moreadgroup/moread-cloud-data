  - word: one
    tags:
      - 初中
    phonetic: 【wʌn】
    trans: num./pron.一个(人或物)；任何人(泛指)
    usage: 用 one作代词，代替前文出现过的可数名词，表示单数用one，表示复数用ones：We've been looking for houses but haven't found one we like yet.我们一直在看房子，但是还没有找到一个喜欢的。
    samples:
      - 例 Cars do cause us some health problems—in fact far more serious ones than mobile phones do. 汽车的确导致了一些健康问题——实际上，比手机导致的健康问题要严重得多。
    distinguish: 辨 one，ones，that，those，it 这五个代词都可以指代前面出现过的名词，以避免重复。one和ones只能代替可数名词，具有泛指性质，往往带有修饰语，如：This question is one of great importance.这个问题很重要。that和those具有特指性质，that常用于代替不可数名词，those代替可数名词复数，如：Life in city is quite different from that in country.城市生活和乡村生活非常不同。 例 The buildings in the capital are taller than those in other cities.首都的建筑比其他城市的高大。one和it都可以代替上文提到的单数名词，但one用于泛指，相当于a＋名词，it用于特指，相当于the＋名词，如：I prefer a flat in the downtown to one(＝a flat)in the suburb.我更喜欢市中心而不是郊区的公寓。例 The Parkers bought a new house but it(＝ the house)will need a lot of work before they can move in.帕克夫妇买了一栋新房子，但是那栋房子需要好好收拾后才能入住。
    test: 考 1．one at a time一次一个2．at one time曾经；同时3．one by one一个接一个4．one-way单行的5．one more＋n.再来一个…6．one day有一天；总有一天7．one another(三人或三人以上)互相8．at one time or another曾经
    reference: 参 oneself(pron.亲自，自己)
