    distinguish: 辨 fit，suit，match fit表“适合”之意时，多用来指“大小、形状等适合”及“服装合身”，而不表示服装的款式、颜色等合适，如：The pair of shoes doesn't fit me.这双鞋我穿不合脚。而suit侧重于“符合需要、口味、条件等”，尤其用来指“衣服式样、颜色或发型与人相配”：This coat suits you well.这件衣服很适合你。match指“相配，配得上”时，多指人或物在“品质、颜色”等方面相当或相配，如：It's difficult to match the color of the old painting.很难找到与旧画颜色相配的色彩。
    test: 考 1．be fit for适合于2．keep fit保持健康
  - word: that
    tags:
      - 小学
    phonetic: 【ðæt】
    trans: adj./pron.那，那个 conj.(引导从句，无词义)adv.那么，那样
    usage: 用 1．that用于引导名词性从句(主语从句、宾语从句、表语从句、同位语从句)和定语从句。引导名词性从句时没有词义，引导定语从句时指代先行词。另外，that在引导宾语从句时可以省略，在定语从句中作宾语时也可以省略，其他情况则不可省略。2．that用于指代上文提到的不可数名词，以避免重复：I'm moving to the countryside because the air there is much fresher than that in the city.我要搬到乡下去，因为那里的空气比城市的要清新得多。that也可指代上文提到的一种情况：—I have never been to Paris.—That's a pity.—我从来没去过巴黎。—那很遗憾。
    samples:
      - 例 I can prove what she said.我能证明她所说的话。
    distinguish: 辨 that，which that和which在引导定语从句时，以下情况只能用that：1．先行词中既有 人又有物时；2．先行词被all，anything，everything等不定代词以及first，only，any等修饰时；3．先行词被形容词最高级修饰时。以下情况只能用which：1．定语从句由介词加关系代词引导时；2．在非限制性定语从句中。that，what.that和what都可以引导主语从句、宾语从句和表语从句。区别在于，that只起引导作用，不充当任何句子成分，也没有实际意义；而what除了起引导作用，同时还在其引导的从句中作某个句子成分，本身的含义也根据句子内容而有所不同。如：I can prove that she did it.我能证明是她干的。
    test: 考 1．That's all right.没关系。2．so/such...that...如此…以至于…
