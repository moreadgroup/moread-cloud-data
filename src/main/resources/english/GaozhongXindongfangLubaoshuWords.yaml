      - 例 Jack and the others paid no attention.杰克和其他人都没留意。(此句中的the others相当于the other people)
    distinguish: 辨 another，other，the other，others，the others 这几个单词或词组都可以翻译为“其他的”，但意义和用法有所区别。 another指另外一个，后接单数名词(常省略或用one代替)：I saw one girl whispering to another.我看到一个女孩在和另一个女孩耳语。other指另外的，后接复数名词：Disney soon drew other cartoon characters like Donald Duck.迪士尼很快又画出了其他像唐老鸭这样的卡通人物。the other指某范围中所有其余的，既可接单数名词(此时范围就是两个，the other指两者中的另外一个)，也可接复数名词，名词常可省略：The couple has two girls.One is 8，the other is 4.这对夫妇有两个女儿，一个8岁，另一个4岁。
    test: 考 1．each other彼此2．other than除了3．at any other time在其他任何时间4．the other day前几天5．every other day/year每隔一天／年
