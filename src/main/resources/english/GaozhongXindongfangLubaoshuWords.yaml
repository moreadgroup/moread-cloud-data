    phonetic: 【laɪk】
    trans: n.爱好prep.像，跟…一样v.喜欢，喜爱
    distinguish: 辨 like，as 两个词都有“像…”之意，但用法不同，不可以互换。like一般用作介 词，其后接名词或代词，不接从句。如：He cried like a baby.他哭得像 个小孩。而as用作连词，其后往往接从句，如：Do exactly as I say.严格 照我说的办。另外as也可用作介词，但意思是“作为；以…的身份”，如：He used his umbrella as a walking-stick.他把雨伞当做手杖用。
