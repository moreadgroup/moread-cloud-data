      - 初中
    phonetic: 【mɔː】
    trans: (much/many的比较级)adj.更多的 adv.更 pron.更多的…；另外的…
    usage: 用 1．more作副词，除了与至少有两个音节的形容词或副词构成比较级外，还可以修饰动词：I couldn't agree with you more.我非常赞同你的意见。2．more作代词，可以和many，much，some，any，no，a few，a little等词以及数词连用：I couldn't eat any more.我再也吃不下了。
    samples:
      - 例 I'll take three more.我再要三个。
      - 例 I need one more stamp before my collection is completed.我还需要一枚邮票才能完成我的收集。
    distinguish: 辨 no more than，not more than 二者在数量上进行比较的时候，no more than＝only是“仅仅，只有”的意思，如：There are no more than 8 chairs in the room.屋子里只有8把椅子。而not more than＝the most是“最多，不超过”的意思，如：There are not more than 8 chairs in the room.屋子里最多有8把椅子。二者在程度上进行比较的时候，no more than是“两者都不”的意思，如：A is no more important than B.A和B都不重要。而not more than是“比不上，不及”的意思，如：A is not more important than B.A没有B重要。
    test: 考 1．more or less或多或少，大体上2．more than多于，超过3．no more than不过，仅仅，和…一样都不4．not more than至多；不比…更… 5．what's more而且，此外，更有甚者6．more and more越来越7．the more...，the more...越…，越…8．once more再一次9．no more = not...any more不再
