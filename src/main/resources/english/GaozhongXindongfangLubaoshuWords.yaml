    usage: 用 find可以接复合宾语，即find＋宾语＋宾补，注意：宾语和宾补之间为被动关系时，宾补用过去分词：I find my mobile phone stolen.我发现手机被偷了。可以接“宾语＋宾补”的动词还有：ask，advise，call，consider(认为)，choose，elect，find，force，feel(认为，觉得)，hear，help，like，let，make，order，persuade，see，tell，watch等。
    distinguish: 辨 find，look for find，look for都有“找”的意思。但find意为“找到”，侧重于结果：I didn't find my shoes.我没找到我的鞋。look for意为“找寻”，侧重于过程：I'm looking for my shoes，but I haven't found them yet.我在找我的鞋，但还没找到。
    test: 考 find out找出；认识到；获知：Could you find out what time the train leaves? 你能查出火车什么时间发车吗？
