  - word: make
    exchange: (made，made，making)
    tags:
      - 小学
    phonetic: 【meɪk】
    trans: vt.制造，做；使成为
    usage: 用 make后接复合宾语时，可以充当宾补的有名词、形容词、非谓语动词等。主要句型有：1．make＋宾语＋do sth.使宾语做某事：The announcement made the whole world cheer.这个宣告使全世界的人都欢呼起来。
    samples:
      - 例 Mom made him clean up the plates.妈妈让他洗盘子。注意：如改为被动句，宾补必须是to do的形式：He was made to clean up the plates by mom.妈妈让他洗盘子。可用于该句型的动词还有feel，hear，let，watch，see等。2．make＋宾语＋adj.使宾语…：Having fun with friends makes us happy.和朋友一起玩儿会使我们快乐。可用于该句型的动词还有feel，find，think，drive等。3．make＋宾语＋n.使宾语成为…：The contest made her a star.这次比赛使她成了明星。可用于该句型的动词还有elect，choose，consider，name，call等。4．make＋宾语＋done，使宾语被…：When we talk with others we make ourselves understood not just by words.当我们与他人交谈时，并不仅仅靠语言来让别人理解。5．如果宾补是不定式或从句，常常使用形式宾语，即make＋it＋adj./n.＋宾语：People in the west make it a rule to buy Christmas presents for their relatives and friends.西方人把给亲朋好友买圣诞礼物作为一种惯例。可用于该句型的动词还有feel，find，think，believe等。
    distinguish: 辨 be made from，be made of两个词组都是“由…制成”的意思，be made from已经无法看出原料的性质、特征等，而be made of可以看出。如：This kind of paper is made from agricultural waste.这种纸是由农业废料制成的。 例 The desk is made of wood.这张桌子是木头做的。注意：当某物是由多种材料制成时，无论能否看出原料的性质、特征等，均用be made from。
    test: 考 1．make money挣钱2．make bed整理床铺3．make a living谋生4．make use of利用5．make up of构成6．make up one's mind下决心7．make sure保证，确保8．make out做；理解9．make sense有意义10．make it做成某事，成功
