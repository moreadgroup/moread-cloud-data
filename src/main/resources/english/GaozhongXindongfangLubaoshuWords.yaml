    distinguish: 辨 manage to do sth.，try to do sth.manage to do sth.表示“设法做某事”，并已经成功；try to do sth.则表示“尽力，设法去做某事”，未必成功，如：We managed to solve the problem without your help.我们在没有你帮助的情况下解决了这个问题。(问题已解决); 例 We tried to solve the problem without your help.我们在没有你帮助的情况下尽力解决这个问题。(尽力去解决，但未必能解决)
    reference: 参 management(n.管理)；manager(n.经理)；managerial(adj.管理的)
