    usage: 用 1．require ＋从句，从句谓语用虚拟语气结构(should)＋ do：It is required that all passengers(should)show their tickets.所有乘客都被要求 出示车票。2．require sb.to do sth.要求某人做某事，常用被动形式：Students are required to bring their own pens and pencils.要求学生们自带钢笔和铅笔。3．require ＋ doing(＝ ＋ to be done)：The floor requires cleaning/to be cleaned.地板需要清洁了。类似require(后接现在分词表示被动含义)的动词还有want，need等，如：The floor wants/needs cleaning.地板需要清洁了。
