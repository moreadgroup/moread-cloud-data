    phonetic: 【haʊˈevə】
    trans: adv.可是，然而，尽管如此；无论如何
    usage: 用 1．however表转折时，可以放在句首、句中或句末，注意要用逗号 隔开：The book is expensive; however，it's worth it.这本书很贵，但它物有所值。2．however作连词时相当于no matter how，意为“无论如何”，引导让步状语从句：You should try to get a good night's sleep however much work you have to do.无论有多少工作要做，你都应该好好睡上一觉。
    distinguish: 辨 however，but，although(though)表示转折时，however是连接副词，放在句首、句中、句末都可以，需要用逗号隔开，如：I'd like to go with you.However，my hands are full.(＝ I'd like to go with you.My hands are full，however.)虽然我很想和你一块去，但是我太忙了。but是并列连词，只能放在形成转折关系的两个分句或句子之间，如：I'd like to go with you，but my hands are full.虽然我很想和你一块去，但是我太忙了。although和though是从属连词，引导让步状语从句，如：Although/Though I'd like to go with you，my hands are full.虽然我很想和你一块去，但是我太忙了。注意：汉语常常使用“虽然…但是…”这个连词词组，但在英语中although(though)和 but绝对不能同时使用。
