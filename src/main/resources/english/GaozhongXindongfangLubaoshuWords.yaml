    distinguish: 辨 so，such这两个单词作副词时都可用来加强语气，表示“如此…，这样…”，但在用法上有所不同：1．用于有形容词修饰的单数可数名词前时，位置不同，即such＋a【an＋adj.＋n.和so＋adj.＋a】an＋n.两种结构：such a good teacher= so good a teacher这么好的一位老师2．so可以修饰many，much，little，few，而such不可以：so much work这么多的工作；但当little表示“小”而非“少”之意时，用such修饰，如：Such little animals eat so much grass.那么小的动物吃了那么多的草。3．复数名词和不可数名词，以及没有形容词修饰的单数可数名词之前用such修饰，不能用so，如：We had such fun.我们玩得真开心。例 You are such a fool.你真是个大傻瓜。
