  - word: until
    tags:
      - 初中
    phonetic: 【ənˈtɪl】
    trans: prep./conj.直到…为止，在…以前
    usage: 用 1．主句谓语动词是延续性的，表示动作一直进行，到until表示的时间才停止：I watched her until she was out of sight.我一直看着她，直到她从视野中消失。2．主句谓语动词常为非延续性的，表示动作一直不发生，直到until表示的时间才发生：My uncle didn't marry until he was fortyfive.我叔叔直到45岁才结婚。3．Not until＋时间状语(从句)＋助动词(did，will)＋主语…，即否定词用于句子开头，句子部分倒装：Not until he was forty-five did my uncle marry.我叔叔直到45岁才结婚。4．It＋ be＋not until＋时间状语(从句)＋that...：It was not until he was forty-five that my uncle married.我叔叔直到45岁才结婚。
    distinguish: 辨 until，till.till和until可以用在口语和书面语中。until较till更为正式；until可以放在句首而till则不可，如：Until you finish your homework don't think about watching television.除非你完成家庭作业，否则别想看电视。
