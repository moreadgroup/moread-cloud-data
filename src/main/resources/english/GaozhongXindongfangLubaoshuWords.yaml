    distinguish: 辨 nobody，no one，none 1．nobody和no one只能指代人，none既可指代人又可指代物。2．no one和none后能接of，nobody无此用法，如：能说no one of us或none of us而不能说nobody of us。3．nobody和no one作主语时，谓语动词用单数，none作主语时，谓语动词既可用单数也可用复数。
