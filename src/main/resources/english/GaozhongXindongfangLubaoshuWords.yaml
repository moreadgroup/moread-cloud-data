    usage: 用 1．regret作名词时，如果表示遗憾、懊悔的情绪，为不可数名词； 如果意为感到遗憾的事或歉意，则为可数名词。I can't come—please give them my regrets.我不能来了，请代我向他们表示歉意。2．regret doing sth.(＝regret to have done sth.)为做过某事而后悔：Have you ever regretted doing something you shouldn't have done? 你是否曾经为做了不该做的事情而后悔？3．regret to do sth.为要做某事而遗憾(动词常为say，inform，tell等表示“通知、告诉”等含义的词)：I regret to say that you have failed your exam.我很遗憾地告诉你，你考试不及格。4．后接doing和to do时含义不同的动词还有：forget，remember，stop，try等。
