    phonetic: 【ˈnaɪðə】
    trans: adj./pron.(两者)都不 conj.也不
    usage: 用 1．neither A nor B作主语时，主谓一致采用就近原则，即根据B的单复数来决定谓语动词和代词的形式：Neither the children nor he has ever had his supper.他和孩子们都没吃晚餐。如果A、B部分是句子则句子要倒装，如：Neither has he been to Beijing，nor will he do so.他没有去过北京，也不想去。2．neither of短语作主语时，谓语动词用单数：Neither of her sons goes to college.她的两个儿子都没上大学。3．neither/nor＋be/have do＋主语，此结构表示前面的内容也适用于另一个人或物：I have never had a girlfriend.Neither has he.我没有交过女朋友，他也一样。
    distinguish: 辨 neither，none.neither用于否定两者：Neither of my two sisters is here.我的两个姐姐都不在这儿。而none否定三者或三者以上：None of the pupils knew the answer.没有一个学生知道答案。neither作主语时，谓语动词为单数，none作主语时，谓语动词用单复数皆可。
