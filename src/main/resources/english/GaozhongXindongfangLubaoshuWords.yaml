      - 例 It's two years since he was a League member.他退团已经两年了。
    distinguish: 辨 since，as，because，for这四个词都可以引导原因状语，because语气最强，表示直接而明确的原因，常用于回答why引起的问句，如：He had to stay at home yesterday because he was ill.因为病了，他昨天只得待在家里。as语气较弱，只是附带说明较明显的原因，如：She was well paid，as she had done the work well.她的薪水很高，因为她干得出色。since语气也比because弱，陈述的理由往往是对方所知道的，常译作“既然”，如：Since you can't answer the question，perhaps we'd better ask someone else.既然你无法回答这个问题，我们最好再问问别人。for语气最弱，只是就前一句进行逻辑推理或解释一下理由，引导一个表示原因的并列句，for不用于句首，如：Maybe he is ill，for he is absent today.他今天没有来，可能是病了。
