  - word: can
    tags:
      - 小学
      - 高中
    phonetic: 【kæn】
    trans: v.可能；能够；可以
    usage: 用 情态动词的特点是不能单独作谓语，必须和后面的动词连用共同构成谓语，没有人称和数的变化。can是最常用的情态动词之一：1．表示能力，有“会，能够”的意思，主要用在一般现在时中：Can you drive a car? 你会开车吗？2．表示可能，常用于否定句或疑问句中：Can it be true? 这是真的吗？
    samples:
      - 例 Today is Sunday.He can't be at school today.今天是星期天，他不可能去上学。3．表示允许，在口语中代替may，有“可以”的意思：You can use my car.你可以用我的车。
    distinguish: 辨 can，be able to can表示能力时，可以用be able to代替；can只有can和could两种变化，而be able to在所有时态中都有相应的变化；be able to强调“通过努力有能力做到”，如果表示“某事已经成功”应用be able to，而不用could：He was able to leave Europe before the war began.他得以在战争开始前离开欧洲。
